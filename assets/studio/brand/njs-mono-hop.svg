<svg id="njsmonoh" class="nj" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NJS Studio"><style>
#njsmonoh{overflow:visible}
#njsmonoh .dr{stroke-dasharray:2.6 2.2}

#njsmonoh .dot,#njsmonoh .jj,#njsmonoh .t,#njsmonoh .sp{transform-box:view-box}
#njsmonoh .dot{transform-origin:43.5px 10.4px}
#njsmonoh .jj{transform-origin:43.5px 52px}
#njsmonoh .t{transform-origin:32px 32px}
#njsmonoh .sp{opacity:0;transform-origin:43.5px 10px}
#njsmonoh.go .dot,.go>#njsmonoh .dot{animation:njsmonoh-hop 1.9s cubic-bezier(.45,0,.4,1) forwards}
#njsmonoh.go .jj,.go>#njsmonoh .jj{animation:njsmonoh-jj 1.9s ease-out forwards}
#njsmonoh.go .t,.go>#njsmonoh .t{animation:njsmonoh-t 1.9s ease-out forwards}
#njsmonoh.go .sp,.go>#njsmonoh .sp{animation:njsmonoh-sp 1.9s ease-out forwards}
#njsmonoh.go .sn,.go>#njsmonoh .sn{animation:njsmonoh-sn 1.9s ease-in-out forwards}
@keyframes njsmonoh-hop{
0%{transform:none}
7%{transform:scale(1.35,.65)}
15%{transform:translate(-7px,-8px) scale(.8,1.25)}
23%{transform:translate(-13px,0) scale(1.35,.65)}
31%{transform:translate(-20px,-8px) scale(.8,1.25)}
39%{transform:translate(-26px,0) scale(1.3,.7)}
44%{transform:translate(-26px,0)}
50%{transform:translate(-26px,0) rotate(-16deg)}
56%{transform:translate(-26px,0) rotate(14deg)}
61%{transform:translate(-26px,0)}
66%{transform:translate(-26px,0) scale(1.5,.55)}
80%{transform:translate(-13px,-17px) scale(.75,1.35)}
88%{transform:scale(1.7,.45)}
94%{transform:scale(.9,1.12)}
100%{transform:none}}
@keyframes njsmonoh-jj{0%,86%{transform:none}90%{transform:scaleY(.93)}96%{transform:scaleY(1.02)}100%{transform:none}}
@keyframes njsmonoh-t{0%,87%{transform:none}91%{transform:translateY(1.2px) rotate(-2deg)}95%{transform:rotate(1deg)}100%{transform:none}}
@keyframes njsmonoh-sp{0%,87%{opacity:0;transform:scale(.5)}90%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
@keyframes njsmonoh-sn{0%,87%{transform:none}91%{transform:translate(.6px,-.6px)}95%{transform:translate(-.4px,.4px)}100%{transform:none}}

@media (prefers-reduced-motion:reduce){#njsmonoh *{animation:none!important}}
</style>
<g class="t"><rect x="2" y="2" width="60" height="60" rx="17" fill="#121416"/>
<g class="sn">
<path class="so" d="M38.5 18C35.5 14 21.5 14 21.5 21.5C21.5 28 38.5 29 38.5 35.5C38.5 43 24.5 43 21.5 39" fill="none" stroke="#FF4F9A" stroke-width="5.6" stroke-linecap="round"></path>
<path class="si" d="M38.5 18C35.5 14 21.5 14 21.5 21.5C21.5 28 38.5 29 38.5 35.5C38.5 43 24.5 43 21.5 39" fill="none" stroke="#121416" stroke-width="2.8" stroke-linecap="round"></path>
</g>
<rect x="13" y="13" width="7" height="31" rx="1" fill="#FBF5F6"/>
<polygon points="13,13 20,13 47,44 40,44" fill="#FBF5F6"/>
<path class="jj" d="M43.5 13V43a8.5 8.5 0 0 1-8.5 8.5h-5" fill="none" stroke="#FBF5F6" stroke-width="7"/>

<g class="sp" opacity="0" stroke="#FF4F9A" stroke-width="1.8" stroke-linecap="round"><path d="M43.5 2.8v-1.6M37.5 6.5l-1.6-.8M49.5 6.5l1.6-.8"/></g>
<circle class="dot" cx="43.5" cy="7" r="3.4" fill="#FF4F9A"/>
</g><script><![CDATA[(function(){var s=document.currentScript&&document.currentScript.parentNode;if(!s||s.__nj)return;s.__nj=1;
var host=s.closest&&s.closest('[data-nj-host]')||s;
host.addEventListener('mouseenter',function(){s.classList.remove('go');void s.getBoundingClientRect();s.classList.add('go')});})();]]></script></svg>