   place and every eligible count landing at a different x. Seventeen
   numbers that are meant to be compared, none of them aligned.

   They are also already ordered by family in the source data, CMP then
   MGR then ONB then LDR, and the wrap threw that away by starting a
   family in the middle of a row.

   The fix is to stop treating them as pills. A minmax(380px, 1fr)
   auto-fill grid gives two columns at 1098px, one at 390px, and three
   on anything over about 1180px of content, with no breakpoint. Every
   label starts at the same x, every eligible count ends at the same x,
   and the families now begin on a row boundary two times out of three
   instead of never.

   This is a deliberate divergence from the design system's radius map,
   which puts .fchip on --r-pill. A fully round end on a 545px two line
   option is not a pill, it is a stadium, and the component has stopped
   being a chip: it is a row in a multi select list. So it takes the
   9px control radius. Flagged in the report rather than done quietly.

   Grouping the families under headings needs markup and is written up
   in markupProposals. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .pillbar:has(> [data-acourse]){
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(380px,1fr));
  gap:var(--s2);
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) [data-acourse]{
  display:flex;
  align-items:center;
  gap:var(--s3);
  width:100%;
  min-height:44px;
  padding:var(--s2) var(--s3);
  border-radius:var(--r-ctl);
  text-align:left;
  line-height:1.35;
}
/* The eligible count is the number being compared across 17 options, so
   it is pinned to the right edge of every cell and given tabular
   figures. flex:none stops it wrapping under a long module name. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) [data-acourse] > .mono{
  flex:none;
  margin-left:auto;
  font-variant-numeric:tabular-nums;
  font-size:var(--fs-meta);
}

/* ---- 4b. The selected state -------------------------------------------

   MEASURED. Unselected is --card with a --rule-int border, selected is
   a solid --brand-jade fill with white text at 9.15 to 1. That is
   already unmistakable at rest, and it is the app's own convention for
   a pressed .fchip, so the fill stays exactly as it is.

   What was missing is that the difference is carried entirely by
   colour. About one man in twelve cannot use that channel reliably, and
   a manager creating 26 statutory assignments should not be relying on
   it either. A check mark is added in a fixed 14px gutter that is
   reserved on every option whether it is on or not, so switching one on
   changes its colour and nothing moves. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) [data-acourse]::before{
  content:"";
  flex:none;
  width:14px;
  text-align:center;
  font-weight:700;
  line-height:1;
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) [data-acourse][aria-pressed="true"]::before{
  content:"✓";
}
/* The count on a selected option sits on jade rather than on white. It
   is white at full strength, 9.15 to 1, rather than a faded white,
   because a number that says how many people are about to be enrolled
   is not secondary information. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) [data-acourse][aria-pressed="true"] > .mono{
  color:inherit;
}

/* ---- 4c. The two hints under the options -------------------------------

   MEASURED. Three .hint blocks stack under the grid, at 12px with a 4px
   top margin each, and the middle one is a list of every module that is
   NOT offered and why. Read together they were one grey paragraph of
   about 340 words at the same weight as everything else.

   The "not offered, and why" block is the one a manager actually needs,
   because it answers the question the grid provokes. It is given a rule
   on its start edge and a little air so it separates from the two
   sentences of guidance around it. No fill, no colour: it is an aside,
   not a warning. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) .hint:has(> b){
  border-inline-start:2px solid var(--rule);
  padding-inline-start:var(--s3);
  margin-top:var(--s3);
  line-height:1.6;
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) .hint:has(> b) b{
  color:var(--ink);
}


/* =====================================================================
   5. STEP 3, THE COMPUTED DUE DATES
   ===================================================================== */

/* ---- 5a. The table ----------------------------------------------------

   MEASURED. Three columns of numbers, grace days, due date and people,
   in a table whose header row is --card on --card. The due cell holds a
   mono date over a "Aug 10, 2026 plus 30 grace days" explanation at
   12px, and the two lines had the same leading as a single paragraph,
   so the arithmetic and its result ran together.

   The table itself is fine. What it needed was for its header to sit on
   the panel rather than float, and for the second line of the due cell
   to read as the derivation of the first.

   CAUGHT ON THE FIRST REBUILD, by looking at the screenshot rather than
   at the rule. Making .sub a block while the markup still carries the
   <br> that used to stack it gives two line breaks instead of one, so
   an empty line opened above every statutory citation and the row grew
   by a line. The <br> is the redundant one now, so it is the one that
   goes. Measured on the same three rows: 85.8px before any of this,
   105.9px with the block set and the <br> left in, 85.6px with both
   rules in place. The row keeps its height and gains the 2px that
   separates the citation from the module name. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) .tbl th{
  background:var(--paper);
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) .tbl td .sub{
  display:block;
  margin-top:2px;
  line-height:1.4;
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) .tbl td br{
  display:none;
}


/* =====================================================================
   6. STEP 4, THE MOMENT OF COMMITMENT
   ===================================================================== */

/* ---- 6a. Four tiles, a sentence and a verb, made into one object -------

   MEASURED, before. Step 4 was 61.3px of grey hint text when nothing
   was chosen and about 300px when it was: a .grid.g4 of four white KPI
   tiles on the white panel, a gold callout, a full width jade button
   and a 12px disclaimer, all four separated by the same 16px the rest
   of the panel uses between unrelated things. Four separate objects
   doing one job.

   The step is now a filled block: --paper behind it, a --rule edge, the
   12px container radius. On --paper the four white tiles read as tiles
   for the first time, because before they were white on white with a
   1.36 to 1 border. The button lands inside the same block as the
   numbers it is about to act on, which is the entire point of a confirm
   step. --ink on --paper is 16.13 to 1 and --ink-muted on --paper is
   5.97, so nothing in the block loses contrast by moving off white.

   The step marker has to move inside the padded block, so its left
   offset changes from 0 to 14px and the connector from step 3 stops at
   the block edge. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:last-child{
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:var(--r-box);
  padding:var(--s4) var(--s4) var(--s4) 48px;
  margin-top:var(--s2);
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:last-child::after{
  left:16px; top:17px;
}
/* The tiles keep their white fill so they lift off the block. The
   descriptions were the tallest thing in the row and set the height of
   all four, so they are held to a readable measure and the row settles
   at one height instead of the height of the longest sentence. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:last-child .kpi{
  border-color:var(--rule);
  border-radius:var(--r-ctl);
  padding:var(--s3) var(--s4);
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:last-child .kpi .v{
  font-size:var(--fs-kpi);
  line-height:1.05;
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:last-child .kpi .d{
  line-height:1.4;
}
/* The callout inside the block was --card on --paper with a gold edge,
   which is the app's callout and is correct, so only its margins move
   so the block reads as one stack rather than three floating pieces. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:last-child .callout{
  margin:var(--s4) 0;
}

/* ---- 6b. The verb button ----------------------------------------------

   MEASURED. #a-confirm is the .btn base: 44px minimum height, 13.5px
   label, 9px radius, full width by an inline style. Its label is the
   whole commitment, "Create 26 assignments for 14 people", and it was
   set at the same size as the "Select all" button inside the roster
   picker two steps above it.

   52px and the 15px lead step. That is one size up from body, not a
   marketing button: it is the only control in the panel that writes
   anything, and it should be the only control in the panel at that
   size. Contrast is unchanged, white on --action at 9.15 to 1. */
#app #a-confirm{
  min-height:52px;
  font-size:var(--fs-lead);
  border-radius:var(--r-ctl);
  letter-spacing:.005em;
}
/* The prototype disclaimer under the button is the last thing on the
   panel and it is load bearing: it is the sentence that says the button
   writes no record. Centred under the full width button it stops
   looking like a stray caption.

   The :has(#a-confirm) is not decoration. Without it the rule also
   caught the single sentence step 4 shows at rest, when there is no
   button above it to be centred under, and a centred line sitting under
   three left aligned steps looked like a mistake. Caught by looking at
   the empty panel, which is the state the console opens in. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:last-child:has(#a-confirm) > .hint:last-child{
  text-align:center;
  margin-top:var(--s3);
  max-width:64ch;
  margin-inline:auto;
}


/* =====================================================================
   7. THE CAMPAIGN TABLE AND THE FULL ROSTER
   ===================================================================== */

/* ---- 7a. Status chip runs ---------------------------------------------

   MEASURED. Each campaign row carries three chips in one cell, "12
   assigned", "6 in progress", "22 complete", laid out as inline spans
   with a text space between them, so they wrapped mid run at 1440px and
   the counts in the column below never lined up. Made a flex run with
   the spacing scale, and the numbers inside them tabular so that
   4 assigned and 12 assigned are the same width. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .tbl td .chip{
  font-variant-numeric:tabular-nums;
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .tbl td:has(> .chip + .chip){
  white-space:normal;
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .tbl td:has(> .chip + .chip) .chip{
  margin:2px var(--s1) 2px 0;
  display:inline-block;
}

/* ---- 7b. The full roster ----------------------------------------------

   MEASURED. 40 rows, five columns. The readiness column is a five
   segment bar plus a two digit score at 12.5px mono, and the score sits
   after a bar of variable width, so 87, 85, 71, 78, 81, 82 and 83 were
   at seven different x positions down the column. min-width on the
   score column pins them. The employee id under each name gets the same
   tabular treatment as the picker above, so the same person reads the
   same way in both places.

   The department cell is empty for the two leadership rows because they
   carry no department. That is a data shape and CSS should not invent a
   glyph for it; it is written up in markupProposals. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .tbl .rbar .sc{
  min-width:2.6ch;
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .tbl th[scope="row"] .mono{
  font-variant-numeric:tabular-nums;
}


/* =====================================================================
   8. ONE PRIMARY BUTTON PER SCREEN
   ===================================================================== */

/* ---- 8a. Thirteen of them on training, seven on drills -----------------

   MEASURED, before.

     My training  13 rows, 13 filled --brand-jade "Review" buttons,
                  84 to 96px wide. 12 rows chipped "Current", 1 chipped
                  "Expiring".
     Drills       7 rows, 7 filled --brand-jade "Run drill" buttons at
                  84px. 6 rows chipped with a future due date, 1 chipped
                  alert at 23 days past its interval.

   Twenty filled buttons across two tabs, of which two are the ones that
   need doing today. When everything is emphasised nothing is, and this
   is the cheapest possible fix for it: a row whose status chip says the
   thing is current gets the ghost treatment the app already has, and
   the row that is expiring or overdue keeps the filled one. The
   condition is read off the chip the row already renders, so it cannot
   drift from the data.

   Verified counts by selector: .mrow:has(.chip.ok) matches 12 on
   training, 6 on drills, 0 on report. On the team tab it matches the 24
   picker rows, which contain no button, so the rule is inert there. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .mrow:has(> .chip.ok) > .btn{
  background:transparent;
  border:1px solid var(--rule-int);
  color:var(--ink);
  font-weight:600;
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .mrow:has(> .chip.ok) > .btn:hover{
  background:var(--action-soft);
  border-color:var(--action);
  color:var(--action);
}

/* ---- 8b. The one row that is late -------------------------------------

   MEASURED. The overdue drill is marked by an 8px --alert dot at the
   start of the row and an --alert chip at the end, 1100px apart, with
   six identical rows around it. A 3px edge in --alert on the row itself
   ties the two ends together and survives being scanned at arm's
   length. --alert on --card is 6.07 to 1 as a graphic against a 3.0
   floor. The start padding is reduced by the width of the edge so the
   row content does not shift by 3px relative to its neighbours.

   Restricted to rows that carry a button, so it marks a piece of work
   that can be actioned and not every person in the picker who happens
   to have an expired certificate. --alert, not --critical: this is a
   drill that is late, not an eight hour statutory clock. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .mrow:has(> .chip.alert):has(> .btn){
  border-inline-start:3px solid var(--alert);
  padding-inline-start:calc(var(--s3) - 3px);
}


/* =====================================================================
   9. THE INCIDENT REPORT FORM
   ===================================================================== */

/* ---- 9a. Seven fields that all looked the same -------------------------

   MEASURED, before. Seven .field blocks, field heights 276.3, 93.0,
   63.8, 111.8, 86.5, 63.8 and 141.0px, and seven labels every one of
   them 12.5px weight 600 in --ink-muted. Field 5, treatment level, is
   the field that decides whether this incident starts an eight hour
   Cal/OSHA clock, and it was rendered identically to field 6, which
   asks whether lost time is expected and starts nothing.

   The labels move up to the 15px lead step in --ink, the same rank the
   assignment panel steps take, so a numbered question in this product
   looks like a numbered question wherever it appears. 17.44 to 1 on
   --card. The fields are separated by the 24px step instead of 16px,
   because seven questions at 16px apart is a wall and the form is read
   under pressure on a phone. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > #rlist) > .field{
  margin-bottom:var(--s5);
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > #rlist) > .field > label.fl{
  font-size:var(--fs-lead);
  color:var(--ink);
  line-height:1.35;
  margin-bottom:var(--s3);
  letter-spacing:normal;
}

/* ---- 9b. The treatment level field ------------------------------------

   This is the most consequential control in the product. It drives
   whether a Form 5020 is required, whether the incident is serious, and
   which statutory clocks start. It was four 40px pills and a 12px grey
   sentence saying so.

   MEASURED. The four options were 114.2, 182.1, 143.0 and 128.1px wide
   at 40px tall with a 13.5px label, byte for byte the same control as
   the seven location pills two fields above.

   It is now a panel: --paper fill, --rule-int boundary at 3.19 to 1 on
   --paper, and options at 48px with the 15px lead label, which is also
   comfortably over the 44px touch target the working agreements set for
   a control somebody taps with cold hands.

   NOT painted with --critical, and not painted with --alert either. The
   field is important, not urgent, and the urgency arrives one moment
   later in the clock chips this field produces, which own the status
   scale. Painting the question the colour of its worst possible answer
   is exactly the overlap the design system forbids. Prominence here is
   size, weight and a boundary. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .field:has([data-rtreat]){
  background:var(--paper);
  border:1px solid var(--rule-int);
  border-radius:var(--r-box);
  padding:var(--s4);
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .field:has([data-rtreat]) [data-rtreat]{
  min-height:52px;
  font-size:var(--fs-lead);
  padding:var(--s2) var(--s4);
  background:var(--card);
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .field:has([data-rtreat]) [data-rtreat][aria-pressed="true"]{
  background:var(--action);
  border-color:var(--action);
  color:var(--card);
}
/* "This one field determines the entire downstream workflow" is the
   sentence that explains why this field is bigger than the others, and
   it was 12px grey under a 40px pill. Body step, ink, with air. It is
   replaced by the live clock preview the moment a level is chosen, so
   it costs nothing at rest. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .field:has([data-rtreat]) > .hint{
  font-size:var(--fs-body);
  color:var(--ink);
  margin-top:var(--s3);
  max-width:64ch;
}
/* The clock preview that replaces it stays on the status scale exactly
   as clocks() renders it. The only change is that the citation under
   each chip gets a measure so a Cal/OSHA reference does not set the
   width of the row. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .field:has([data-rtreat]) .clock + .hint,
#app .wrap:has(> #hero[data-hpersona="mgr"]) .field:has([data-rtreat]) .hint + .hint{
  line-height:1.5;
}

/* ---- 9c. The injured employee picker DID have the sticky bug ----------

   MEASURED, and this one is a real defect rather than a check that
   passed. #rlist is 200px tall with a scrollHeight of 2299px, so it
   holds 8.7 screens of roster, and its seven department headers were
   position:static. Confirmed by getComputedStyle: "static". Scroll it
   and the department name is gone, so a manager choosing between two
   people with similar names has no way to tell which department the
   list is currently in. The same component 40 lines away in the
   assignment panel gets this right.

   #rlist carries overflow:auto inline, so it is the scroll container
   and sticky resolves against it, which is the condition section 4 of
   the shell contract sets. The header already has an opaque background
   set inline, so nothing shows through it. Verified by scrolling, not
   by reading.

   The box is also raised from 200px to 272px, which is the header plus
   four full rows plus the top of a fifth: a whole row of affordance
   instead of the 1.5 rows that fitted before. The inline max-height
   needs !important to move, which is written up in markupProposals. */
#app #rlist{
  max-height:272px !important;
  overscroll-behavior:contain;
  border-color:var(--rule-int);
}
#app #rlist > div[role="presentation"]{
  position:sticky;
  top:0;
  z-index:1;
}
/* The rows in this list are 57px against the 65px of the assignment
   picker, because they carry no status chip. The selected row is
   --action-soft set inline; a chosen row also gets a jade edge so the
   choice survives being scrolled past at speed. */
#app #rlist [data-pickemp][aria-selected="true"]{
  border-inline-start:3px solid var(--action);
  padding-inline-start:calc(var(--s3) - 3px);
}

/* ---- 9d. The narrative field was not in the product typeface ----------

   MEASURED. getComputedStyle(#rnar).fontFamily returned "monospace" and
   fontSize returned 13.3333px. Nothing in the stylesheet sets a family
   on textarea, so it inherited the browser default rather than the
   font: inherit that button, input and select are given three lines
   above it in index.html. The single most safety critical free text
   field in the application is the only control in it that is not set in
   Noto Sans, and at a size that is on no step of the scale.

   The same defect is on #cnote in the HQ campaign builder, which is
   another agent's surface, so the global one line fix is written up in
   the report and only #rnar is corrected here.

   Height goes from the 88px minimum to 132px, which is about five lines
   at this leading. It is a witness account, not a subject line. */
#app #rnar{
  font-family:var(--sans);
  font-size:var(--fs-body);
  line-height:1.6;
  min-height:132px;
  border-color:var(--rule-int);
}
#app #rnar::placeholder{
  color:var(--ink-muted);
  opacity:1;
}

/* ---- 9e. The disabled submit was unreadable ---------------------------

   MEASURED. #rsubmit is 44px, full width, --brand-jade, and while the
   four required fields are unanswered it carries opacity:.45. Compositing
   that over --card gives a fill of roughly 145,180,172 and a label of
   roughly 194,214,210, which is about 1.5 to 1. The label of the only
   submit button on the most safety critical form in the product cannot
   be read while it is disabled, and it still looks close enough to a
   filled button that people press it.

   Replaced with a flat inert treatment: --paper fill, --rule-int
   boundary at 3.19 to 1, --ink-muted label at 5.97 to 1. It now reads
   as a control that is not ready rather than as a button that is
   ignoring you. Sized to match the assignment panel's verb button,
   because they are the same kind of moment on two different tabs.

   It still does not say WHAT is missing. That needs markup and is in
   markupProposals. */
#app #rsubmit{
  min-height:52px;
  font-size:var(--fs-lead);
  border-radius:var(--r-ctl);
}
#app #rsubmit[disabled]{
  opacity:1;
  background:var(--paper);
  color:var(--ink-muted);
  border:1px solid var(--rule-int);
}

/* ---- 9f. The location and type pills ----------------------------------

   MEASURED. Seven location pills and ten type pills at 40px, wrapping
   to one and two rows at 1440px and three and five rows at 390px. They
   are correct as pills: a short single word answer to a closed
   question. The only change is that they are held to the spacing scale
   and given the same 44px minimum the rest of the form has, so the
   answer row on a phone is not the one place a finger has to be
   accurate.

   The :not([data-rtreat]) is load bearing and was found by measuring
   rather than by reading. This selector carries three ids (#app, #hero
   inside the :has, #rlist inside the :has) against the two of the
   treatment rule above it, so without the exclusion it won on
   specificity and quietly held the treatment options at 44px, which was
   the whole point of that block. Verified after: treatment options
   compute to 52px, location and type to 44px. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > #rlist) .pillbar{
  gap:var(--s2);
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > #rlist) .pick:not([data-rtreat]){
  min-height:44px;
}


/* =====================================================================
   10. PHONE
   ===================================================================== */

/* ---- 10a. The step spine at 390px -------------------------------------

   MEASURED at 390px. The .wrap is 390px wide, the panel card is 358px
   with 16px of padding, so a step has 326px of content. A 34px spine
   indent takes 10 percent of that, and the roster rows inside step 1
   already wrap the job title and the employee id onto two lines at that
   width. The spine narrows to 26px and the marker to 18px, which keeps
   the sequence legible without spending another line of wrapping on it.

   The confirm block keeps its fill but drops to 12px of padding, and
   its KPI tiles go to the two column grid the app already uses below
   480px, so the four numbers stay in one object instead of becoming a
   400px column of four cards. */
@media(max-width:640px){
  #app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field{
    padding-left:26px;
    padding-bottom:var(--s4);
  }
  #app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field::before{
    left:7px;
  }
  #app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field::after{
    width:18px; height:18px;
    font-size:10px;
  }
  #app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:last-child{
    padding:var(--s3) var(--s3) var(--s3) 38px;
  }
  #app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:last-child::after{
    left:12px; top:14px;
  }
  /* MEASURED. The who box is 400px at every width, which at 390px is
     47 percent of an 844px viewport and shows two and a half of 40
     people. Half the screen spent on two rows is not a list. Raised to
     58vh, which is 489px on the reference device and shows five, and
     capped so it cannot eat a tall phone whole. The inline max-height
     needs !important to move. */
  #app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field > .card{
    max-height:min(58vh,520px) !important;
  }
  /* One column of options rather than a 380px minimum track that would
     force a horizontal overflow at 326px of content. */
  #app .wrap:has(> #hero[data-hpersona="mgr"]) .pillbar:has(> [data-acourse]){
    grid-template-columns:minmax(0,1fr);
  }
}

/* ---- 10b. The treatment panel at 390px ---------------------------------

   MEASURED. At 390px the four treatment options wrap to two rows of
   two, and "Clinic / off-site medical" is 182px against a 294px content
   width inside the panel, so a two column row leaves 100px of ragged
   space. One option per row: it is four choices, one of which changes
   what happens next for the following eight hours, and this is the one
   place in the console where a full width target is worth the height.

   The panel padding drops to 12px so the framing does not cost the
   options their width. */
@media(max-width:640px){
  #app .wrap:has(> #hero[data-hpersona="mgr"]) .field:has([data-rtreat]){
    padding:var(--s3);
  }
  #app .wrap:has(> #hero[data-hpersona="mgr"]) .field:has([data-rtreat]) .pillbar{
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:var(--s2);
  }
  /* .pick is not a flex container, so justify-content on it does
     nothing; the first attempt at this used it and the options stayed
     centred. text-align is the property that moves text in a button.
     Left aligned because four stacked full width options are a list to
     be read down, and a ragged left edge is what makes a list slower to
     read than a column. */
  #app .wrap:has(> #hero[data-hpersona="mgr"]) .field:has([data-rtreat]) [data-rtreat]{
    width:100%;
    text-align:start;
    padding-inline:var(--s4);
  }
  /* 200px of listbox on a phone is two people. The roster picker on the
     report form is the first thing the form asks for, so it gets the
     same treatment as the assignment picker. */
  #app #rlist{
    max-height:min(46vh,360px) !important;
  }
}

/* ---- 10c. 中文 ---------------------------------------------------------

   CHECKED, not assumed. 中文 has no word breaks, so anything with a
   fixed width or a nowrap that fits English overflows. Nothing in this
   file sets a width, a nowrap or a truncation on a text bearing
   element. The two places where a length assumption could bite were
   measured in both languages:

     module option, longest EN label   478.3px, longest ZH label 268px
     step label, longest EN "4 · Confirm", longest ZH "1 · 選擇人員"

   Both fit the 380px minimum track and the label line at 15px. The one
   real difference is leading: [data-lang="zh"] sets body line-height to
   1.7, and the 20px step marker was aligned to a 1.35 label line, which
   left it 2px high against a taller Chinese line. Nudged rather than
   rewritten. The mono counters keep tabular figures in both languages
   because the digits are Arabic in both. */
[data-lang="zh"] #app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field::after{
  top:3px;
}
[data-lang="zh"] #app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field > label.fl,
[data-lang="zh"] #app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > #rlist) > .field > label.fl{
  line-height:1.5;
}

/* ---- design-persona ---- */
/* ==========================================================================
   DESIGN PASS 6: THE LEGAL CONSOLE, THE EMPLOYEE CONSOLE, THE MODULE PLAYER

   Three surfaces that nobody had looked at since they were built. They are
   also the three that prove the product is more than one dashboard: a lawyer
   reading a register, one worker reading their own record, and a learner
   reading for forty five minutes.

   Every number in the comments below was read out of getBoundingClientRect
   or getComputedStyle in headless Chromium at 1440px and 390px, in English
   and in 中文, before anything was changed. Where a comment says MEASURED it
   means exactly that.

   ---- The three scopes, and why they are what they are ----

   There is no persona attribute on <html> or <body> during a normal render,
   so a persona scope has to come off something the shell already writes.
   The hero carries one:

     #app .wrap:has(> #hero[data-hpersona="cc"])   the legal console
     #app .wrap:has(> #hero[data-hpersona="emp"])     the employee console

   design-hq.css.part established this pattern for the HQ console and it is
   reused here verbatim, so the four persona design files can be read against
   each other without translating between two different hooks.

   The module player has no hero. What it does have is chrome.js.part setting
   stack.hidden = !!S.module, because the player is a focus mode that owns the
   whole column. That gives a hook that is exact rather than approximate:

     #shell .nv-col > .nv-stack[hidden] ~ .wrap        the module player

   ---- What this file deliberately does NOT do ----

   No gradients, no glass, no shadow added to anything that did not already
   have one, no decorative colour. Three of the changes below REMOVE colour.
   The single biggest legibility win on the legal console is deleting sixty
   two saturated red pills, not adding anything.
   ========================================================================== */


/* ==========================================================================
   1. THE LEGAL CONSOLE
   ========================================================================== */

/* ---- 1a. Three of the four hero sentences were cut off mid word ---------

   MEASURED, at 1440px in English. The legal hero band is 94px tall and its
   KPI strip is 521.6px wide carrying four columns, so each description gets
   118.4px. tune.css.part clamps .h-k .d to two lines, correctly, because
   without the clamp these set to four lines and drag the whole hero past its
   budget. At 118.4px the clamp is doing a lot of work:

     "On the register and not yet closed, all banners"     30px shown, 45 real
     "Emergency care or hospitalization, the reportable"   30px shown, 45 real
     "Retention clock suspended until counsel releases"    30px shown, 59 real
     "Referred by HR, privileged notes attached"           30px shown, 45 real

   All four are truncated. One of them loses half its sentence. A lawyer
   reading "Retention clock suspended until..." learns nothing and is told
   there is something they are not being shown.

   In 中文 all four measure 30px shown against 30px real, because Chinese sets
   the same meaning in about half the boxes. So this defect is English only.
   It is still fixed in both, for two reasons: the sentence is set in full
   250px further down the same page in the KPI card row, in both languages,
   which is where the definition belongs; and a hero that has a different
   shape in each language is a second design to maintain.

   This is the same call design-hq.css.part made for the HQ hero, at
   #hero[data-hpersona="hq"] .h-k .d. Two consoles, one decision.

   To reverse: delete this one rule. */
#hero[data-hpersona="cc"] .h-k .d{display:none;}


/* ---- 1b. Sixty two saturated brand red pills on one page ----------------

   MEASURED. Counted on the legal console at 1440px: 62 elements matching
   .chip.bn99 or .chip.bn168, 22 down the Store column of the incident
   register and 40 more down the store list beside the map. Each is a 83px
   pill filled with --brand-red #AB2C29 or #C42B1C carrying white text.

   Against them, on the same page: 11 .chip.alert and 2 .chip.crit, which are
   the only other red objects, plus 11 amber .chip.warn and 10 coloured
   clocks. So 75 of the 86 coloured pills on the legal console were red, 62 of
   those 75 were the loudest red on the page, and those 62 carry no urgency at
   all. They say which supermarket chain the store belongs to.

   docs/06 section 3 states the cost better than this comment can: a reader
   scanning for the one store on a statutory clock finds six, because six of
   them are the other banner. On this console that reader is counsel, and the
   thing they are scanning for is a filing deadline that has passed.

   docs/06 section 4 prescribes the fix and calls it the better of the two
   options: a banner chip is a low mix tint of the brand colour carrying the
   brand colour as its text. That satisfies the F1 contrast failure and the
   brand versus status rule in one change.

   Values are identical to the ones design-hq.css.part computed for the HQ
   queue, deliberately, so a chip does not change identity when the reader
   switches console:
     --brand-red #AB2C29 on its own 12 percent tint      6.4 to 1
     the 168 red darkened 78 percent toward --ink        5.1 to 1
   Both clear 4.5 for 11.5px text.

   TOKEN GAP, carried forward rather than papered over: there is still no
   token for a darkened 168 red. docs/06 F1 proposes --brand-red-168-deep
   #BF2418 for exactly this. Until it exists the value is derived from two
   shipped tokens with color-mix, so it stays traceable. */
#app .wrap:has(> #hero[data-hpersona="cc"]) .chip.bn99{
  background:color-mix(in srgb,var(--brand-red) 12%,var(--card));
  color:var(--brand-red);
}
#app .wrap:has(> #hero[data-hpersona="cc"]) .chip.bn168,
#app .wrap:has(> #hero[data-hpersona="cc"]) .chip.bn{
  background:color-mix(in srgb,var(--brand-red-168) 12%,var(--card));
  color:color-mix(in srgb,var(--brand-red-168) 78%,var(--ink));
}

/* The incident drawer takes the same two rules, and this one is deliberately
   NOT persona scoped, which is worth defending because it is the only rule in
   this file that reaches another console.

   #drawer is mounted on <body>, outside .wrap, so there is nothing on it that
   says which persona opened it. It cannot be scoped. design-hq.css.part hit
   the same wall and left the drawer alone, which is why the drawer header
   currently reads: a solid --brand-red "99 Ranch" pill, then a tinted
   Hospitalization chip, then the dark Privileged chip, then a tinted Escalate
   chip. Correcting three quarters of a chip row and leaving the banner as the
   loudest object in it is worse than either doing all of it or none of it.

   docs/06 section 4 does not scope its instruction by console either. It says
   a banner chip is a low mix tint, everywhere. So the drawer gets the same
   two rules and the same values, and the chip means one thing in every place
   it appears. */
#drawer .chip.bn99{
  background:color-mix(in srgb,var(--brand-red) 12%,var(--card));
  color:var(--brand-red);
}
#drawer .chip.bn168,
#drawer .chip.bn{
  background:color-mix(in srgb,var(--brand-red-168) 12%,var(--card));
  color:color-mix(in srgb,var(--brand-red-168) 78%,var(--ink));
}


/* ---- 1c. The reserved colour was on a category label -------------------

   MEASURED. .chip.crit is a solid --critical #9F1239 fill with white text and
   it renders twice on the legal register, on the treatment category
   "Hospitalization". --critical belongs to the 8 hour Cal/OSHA clock and
   nothing else, docs/06 section 3.

   The harm is legible in one row. R107 Dublin carries a Hospitalization chip
   in full --critical beside a binding clock reading "2h 48m left" in amber.
   The row is shouting the statutory red at a clock that is not on it.

   Treatment keeps its four steps and stays inside the tint family the other
   three already use. Hospitalisation stays the chip you find first by
   carrying a 1px --alert ring the others do not have. Same correction and
   same values as design-hq.css.part, for the same reason as 1b.

   Contrast: --alert #B4304A on its own 12 percent tint computes to 5.1 to 1,
   matching the .chip.alert pair docs/06 already records at 4.97. */
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl .chip.crit,
#drawer .chip.crit{
  background:color-mix(in srgb,var(--alert) 12%,var(--card));
  color:var(--alert);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--alert) 45%,var(--card));
}


/* ---- 1d. A missed statutory deadline did not read as the worst state ----

   This is the most serious state in the whole application and before this
   pass it was the fourth most visible thing in its own row.

   MEASURED, the shipped register at 1440px, 22 rows:
     3 rows past their filing deadline   ("3d 0h over", "1d 4h over", "16h 27m over")
     1 row on the 8 hour Cal/OSHA clock  ("4m left",  .c-crit)
     7 rows on a running clock           (.c-alert, from "1h 47m left" to "14h 39m left")
     1 row .c-warn, 12 rows clear

   clockState() at index.html line 4956 collapses two different facts into one
   class: cls = left<0 ? 'c-alert' : pct<25 ? 'c-alert' : ... So "3d 0h over"
   and "1h 47m left" are the same class, the same colour and the same weight.
   Nothing in the row says one of them is finished and the other is not.

   The wrong fix is more red. There are already 75 red or amber objects on
   this page and painting three rows --critical would both break the
   reservation and lose the three rows inside the noise.

   So the deadline that has passed is marked with STRUCTURE, and the colour it
   uses is the colour it already had:

     1. The depleting bar under the time is 3px and, past the deadline, it is
        0 percent filled, which currently renders as an empty grey track. That
        is backwards: an exhausted clock should read as full, not as blank.
        The track becomes solid --alert, so the row carries one 92px solid
        rule that no running clock has.
     2. The row gets a 3px edge on its first cell, inset so it costs no width.
     3. The time itself goes to weight 700.

   Three rows out of 22 carry the edge. It is a mark, not a wall.

   The 8 hour Cal/OSHA clock keeps --critical and gets the same structure in
   that colour, because that clock is precisely what --critical is reserved
   for. One row out of 22.

   HOW THE PAST DEADLINE ROWS ARE SELECTED, and this is the fragile part, so
   it is written down rather than left to be discovered. clockChip() renders
   the fill as style="width:${pct.toFixed(0)}%" and clockState() clamps pct to
   zero, so a clock that has run out is the only clock whose fill attribute
   contains "width:0%". No other percentage string contains that substring.
   It is a real signal but it is an accident of a template, and if that
   template changes these rules go quiet with no error anywhere. The durable
   fix is one line of JS and it is written up in the report under
   markupProposals: clockState() should return a distinct state for left<0.
   Until then the failure mode is that the register looks like it does today,
   which is not worse.

   One known false positive, stated so nobody rediscovers it: a clock with
   less than half a percent of its window left rounds to 0 and takes this
   treatment while still reading "2m left". On an 8 hour clock that is the
   final 2.4 minutes, which is not a state anyone should want understated. */
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl .clock .bar:has(> i[style*="width:0%"]){
  background:var(--alert);
}
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl .c-crit .bar:has(> i[style*="width:0%"]){
  background:var(--critical);
}
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl tbody tr:has(.bar > i[style*="width:0%"]) td:first-child{
  box-shadow:inset 3px 0 0 0 var(--alert);
}
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl tbody tr:has(.c-crit) td:first-child{
  box-shadow:inset 3px 0 0 0 var(--critical);
}
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl tbody tr:has(.bar > i[style*="width:0%"]) .clock .t,
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl tbody tr:has(.c-crit) .clock .t{
  font-weight:700;
}


/* ---- 1e. The clock column had no reserved width -------------------------

   MEASURED. .clock sets min-width:92px and the Binding clock column resolves
   to 157.4px of the 1114px table, which is enough today. It is enough by
   luck: the column has no floor of its own, and "16h 27m over" breaking after
   "27m" would put the word that says the clock has run out alone on its own
   line. 中文 has no word breaks and sets the citation label under it, so this
   pins the column rather than trusting the current content.

   Same two declarations design-hq.css.part uses on the HQ queue. */
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl .clock .t{white-space:nowrap;}
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl td:first-child{min-width:130px;}

/* MEASURED. The clock's depleting bar is 3px on a --rule #DFDDD4 track, which
   is 1.36 to 1 against --card. The track is not a boundary so no floor
   applies, but at 3px it also carries no information: a bar that is 20
   percent amber on an invisible track reads as a short amber dash rather than
   as a fifth of a window. Tinting the track from the status colour it already
   carries makes the remaining proportion legible. Values match the HQ queue. */
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl .c-ok .bar{background:color-mix(in srgb,var(--ok) 16%,var(--card));}
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl .c-warn .bar{background:color-mix(in srgb,var(--warn) 16%,var(--card));}
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl .c-alert .bar{background:color-mix(in srgb,var(--alert) 16%,var(--card));}
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl .c-crit .bar{background:color-mix(in srgb,var(--critical) 18%,var(--card));}


/* ---- 1f. The table header read as row zero ------------------------------

   MEASURED. The column header is 11px 600 uppercase in --ink-muted over a
   --rule underline, and the first body row starts 12px below that rule, which
   is the same 12px that separates every one of the 22 rows below it. Four
   more pixels of clearance under the rule, none above it, separates the two
   without spending height on the rows. Matches the HQ queue. */
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl th{padding-bottom:10px;}
#app .wrap:has(> #hero[data-hpersona="cc"]) .tbl tbody tr:first-child td{padding-top:14px;}


/* ---- 1g. The privileged note did not look privileged --------------------

   MEASURED, the incident drawer at INC-4100, 1440px. Three notes stack in the
   Notes section at 528px wide. The first two are 86.8px and 111.3px on --card
   with a --rule border. The third is 142px, is the only one counsel can see,
   is the only one carrying work product, and it is styled with a #FBF8EF gold
   tint and a 1px #2A2519 border. Sitting in the same stack it reads as the
   prettiest of the three notes rather than as the different one.

   What "privileged" should look like in an interface is not decoration, it is
   a boundary. So the note gets one: a 3px solid edge in the same dark ink the
   Privileged chip already uses, which is the darkest surface in the product
   and appears in exactly two other places, the prototype banner and the
   litigation hold chip. The gold tint stays, because it is the only warm
   surface in the app and it is already spent on privilege and on the
   prototype banner, which are the two things nobody may mistake for ordinary
   content.

   The body also goes up one step, from 13.5px to 15px. This is the text a
   lawyer is actually here to read and it was set smaller than the incident
   narrative above it.

   Colours are derived from the shipped .chip.priv pair rather than written,
   because there is no token for the privileged dark. TOKEN GAP, recorded:
   docs/06 section 1 already lists #2A2519 and #F3E7C6 as untokenised
   literals used by .protobar, .chip.priv and .note.priv. They want names.
   currentColor on the chip is that dark, so the edge is taken from the same
   place the chip takes its fill and cannot drift away from it. */
#drawer .note.priv{
  border-left-width:3px;
  padding-left:calc(var(--s3) - 2px);
  font-size:var(--fs-lead);
  line-height:1.6;
}
#drawer .note.priv .chip.priv{
  margin-bottom:var(--s2);
}
/* The note's meta line is the audit trail, who wrote it and when. It is 11px
   mono and it sat 8px under the body with nothing between them, so the note
   and its provenance read as one paragraph. A hairline in the privileged ink
   at 22 percent separates them for the cost of one pixel. */
#drawer .note.priv .m{
  margin-top:var(--s3);
  padding-top:var(--s2);
  border-top:1px solid color-mix(in srgb,var(--ink) 22%,transparent);
}


/* ==========================================================================
   2. THE EMPLOYEE CONSOLE
   ========================================================================== */

/* ---- 2a. The best news on the page looked like a missing panel ----------

   MEASURED, 1440px. The seeded employee is current on all six required
   modules, so "Assigned to me" renders its empty state. The card is 1148px
   wide and 110.4px tall and holds 108.4px of centred grey text. Nothing in it
   is coloured, nothing in it is marked, and it sits directly under a hero
   that just said 6 of 6 and 0 outstanding.

   A reader who has been handed a compliance tool and sees a wide empty box
   does not read "you are current". They read "this panel failed to load".
   That is the whole defect: the app is delivering its single best outcome and
   presenting it as an absence.

   So it gets the vocabulary of a result rather than of an absence: a 3px --ok
   edge down the left of the panel, and a check mark set in --ok on the title
   line. Both are borrowed rather than invented. The hero directly above this
   panel already marks its Today cards with a 3px coloured left edge, so the
   employee console now has one way of saying "this panel has a state" instead
   of two. --ok is the right token and the restrained one: docs/06 section 3
   picked a desaturated olive grey for exactly this, so that a healthy state
   never wears the 99 Ranch jade.

   FIRST ATTEMPT, recorded because it was wrong in an instructive way. The
   panel was given a 5 percent --ok wash. Composited that is #F7F7F7 against a
   --paper page of #F7F6F2, so the card stopped being white and the panel
   boundary dissolved. A tint that quiet is not restraint, it is a card that
   has lost its edge. The card stays --card and the state is carried by an
   edge and a mark, which cost no contrast at all.

   Contrast: --ok #5B6558 on --card is 6.09 to 1 for the mark, and 4.48 to 1
   as a 3px edge against the --rule the other cards carry, both over their
   floors.

   Height goes from 110.4px to 145.4px, remeasured after the change. That is
   35px spent to turn a missing panel into an answer, on the one console that
   has room for it: the employee page is 1279px tall against 3106px for legal.
   At 480px and below the extra air is given back, because a phone does not
   have 35px of whitespace to spend on air.

   The copy is a separate and better change and it is in the report under
   markupProposals: "Nothing assigned right now" should say what the hero
   already knows, which is the date of the next recertification. An empty
   state that names the next event is a feature. This rule makes the panel
   look like one; the sentence still has to say it. */
#app .wrap:has(> #hero[data-hpersona="emp"]) .card:has(> .empty){
  border-left:3px solid var(--ok);
  border-radius:var(--r-bar) var(--r-box) var(--r-box) var(--r-bar);
}
#app .wrap:has(> #hero[data-hpersona="emp"]) .empty{
  padding-top:var(--s7);
  padding-bottom:var(--s7);
}
#app .wrap:has(> #hero[data-hpersona="emp"]) .empty b::before{
  content:"\2713";
  margin-right:var(--s2);
  color:var(--ok);
  font-weight:700;
  font-size:1.15em;
}
/* At 480px and below design-system.css.part cuts the padding back and left
   aligns this block, and both of those are right on a 358px column. The extra
   air here is bought with desktop whitespace that a phone does not have. */
@media(max-width:480px){
  #app .wrap:has(> #hero[data-hpersona="emp"]) .empty{
    padding-top:var(--s5);
    padding-bottom:var(--s5);
  }
}


/* ---- 2b. The transcript rows claimed to be clickable and were not -------

   MEASURED. .tbl tbody tr sets cursor:pointer and :hover sets a background,
   globally, because in three of the four consoles a table row opens a record.
   The employee transcript has no data-inc, no data-emp and no handler: its
   six rows are the only rows in the product that do nothing. Six rows that
   light up under the cursor and then refuse to open are worse than six rows
   that sit still, and on a compliance record they invite the reader to think
   there is a detail view being withheld from them.

   This also removes the last obstacle to 2c: a sticky cell cannot inherit a
   row hover colour, so a row that does not change colour is a row whose
   sticky cell cannot disagree with it. */
#app .wrap:has(> #hero[data-hpersona="emp"]) .tbl tbody tr{cursor:default;}
#app .wrap:has(> #hero[data-hpersona="emp"]) .tbl tbody tr:hover{background:transparent;}


/* ---- 2c. On a phone his own score was off the right edge ----------------

   MEASURED at 390px. The transcript table lays out at 411.4px inside a
   332px .tblwrap, so 79.4px of it is scrolled out of view. What is in those
   79.4px is the Score column, all 61px of it, plus 18px of the Expires
   column. The four columns come out at 114.7, 106, 129.6 and 61.

   The employee console exists to show one person their own record. The
   number in that record is the score. On the device most of this workforce
   will open it on, the score is not on the screen and there is no sign it
   exists, because .tblwrap hides its scrollbar.

   The column cannot be dropped, it is the point, and it cannot be squeezed
   in: 79.4px is more than padding can give back without setting the module
   titles at four lines each, which they already are at 138.5px per row.

   So the score column is pinned to the right edge and the rest of the table
   scrolls under it. The reader can always see the score and can swipe to see
   which dates produced it. Applied at 640px and below only, which is where
   the overflow starts; above it position:sticky with right:0 is a no op but
   the border would not be, so it is scoped rather than left global.

   The cell needs an opaque background of its own or the scrolling columns
   pass through it, and 2b guarantees that background can be a constant. */
@media(max-width:640px){
  #app .wrap:has(> #hero[data-hpersona="emp"]) .tbl th.num,
  #app .wrap:has(> #hero[data-hpersona="emp"]) .tbl td.num{
    position:sticky;
    right:0;
    background:var(--card);
    box-shadow:inset 1px 0 0 0 var(--rule);
  }
}


/* ---- 2d. The transcript expiry chips were the only colour on the page ---

   MEASURED. Six .chip.ok pills in the Expires column at #E3EFE7, and two rows
   with no expiry at all, so the column reads as four green pills and two
   holes. Nothing is wrong with any of it, but a green pill is a status claim
   and every one of these says the same thing: not expired. A column where
   every value carries the same badge has stopped using the badge.

   The date keeps its colour, which is what will make an expiring or expired
   one visible when it arrives, and loses the pill shape and the fill so the
   column reads as dates first. --ok on --card is 6.09 to 1.

   It also takes the size of the Completed date beside it, 13.5px, rather than
   the 12.5px chip step. Two adjacent date columns set at two sizes was the
   thing that made the pill necessary in the first place. They now differ by
   exactly what separates them: Completed is a fact in --ink-muted at 400,
   Expires is a status in --ok at 600. An expired or expiring certificate
   keeps the pill, because that one is not a routine date, it is the reason to
   open the app. */
#app .wrap:has(> #hero[data-hpersona="emp"]) .tbl .chip.ok{
  background:transparent;
  padding-left:0;
  padding-right:0;
  font-size:var(--fs-body);
  font-variant-numeric:tabular-nums;
}


/* ==========================================================================
   3. THE MODULE PLAYER

   This is where a learner spends forty five minutes. It was the plainest
   thing in the build and reading comfort is the entire job.
   ========================================================================== */

/* ---- 3a. The line was 88 characters long -------------------------------

   MEASURED at 1440px. The player sets .wrap max-width:760px inline, which
   leaves a 728px card, 24px of card padding each side and a 678px text
   column at 15px. The first line of the Objective paragraph is:

     "After this module you will be able to apply the correct procedure for
      this situation and"

   which is 88 characters, at an average of 7.70px per character. The
   comfortable range is 60 to 80 and 88 is outside it at the wrong end: the
   eye loses the start of the next line on the return sweep, which is exactly
   the failure that matters over forty five minutes of policy text.

   Two things are done, and both are on the design system's own scale.

   The reading size goes from 15px to the 17px step, --fs-h2. It is named for
   a heading and it is used here as body, which is worth stating plainly: the
   scale in docs/06 section 6 is 11, 12.5, 13.5, 15, 17, 21, 26, 30, and 17 is
   simply the next step up from body. Nothing new is invented and no size off
   the scale is introduced. The reason to take the step is that this is the
   only surface in the product whose job is sustained reading rather than
   scanning, and 15px is a scanning size.

   The column then narrows to 680px, which gives a 600px text measure. At
   17px the average character is 8.73px, so the line lands at 71 characters, remeasured after the change,
   in the middle of the range rather than at its edge.

   中文 gets the same treatment for free and it is worth checking rather than
   assuming: CJK sets one character per em, so a 600px measure at 17px is 35
   characters per line, and the comfortable CJK range is 30 to 40. The same
   two numbers land both scripts in the middle of their own range.

   max-width needs !important because viewModule() writes it as an inline
   style. That is the only reason. */
#shell .nv-col > .nv-stack[hidden] ~ .wrap{max-width:680px !important;}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .card p,
#shell .nv-col > .nv-stack[hidden] ~ .wrap .card li{
  font-size:var(--fs-h2) !important;
  line-height:1.6 !important;
}


/* ---- 3b. Headings and body were 16px apart, and the same size ----------

   MEASURED. h3 in the module body computes to 15px 600 with margin 0 on every
   side. Two things follow from that.

   The space around a heading is entirely borrowed from its neighbours: 16px
   above it from the previous paragraph's inline margin-bottom, 8px below it
   from the next paragraph's inline margin-top. So a section title sits 16px
   under the paragraph it is leaving and 8px over the paragraph it introduces,
   at a 22.5px line height. The ratio is the right way round and the amounts
   are too small, and there are four of these inside one card.

   The size is the worse problem. h3 was 15px against a 15px body, so the
   heading and the prose were the same size and only weight separated them.
   Raising the body to 17px in 3a made that inversion visible: a section
   heading smaller than its own paragraph.

   The heading could go up, but 21px is the module title's size and four 21px
   headings inside one card compete with it. So it goes the other way and
   becomes a label rather than a small title: 12.5px, 700, uppercase, 0.09em
   tracked, in --ink. That is the eyebrow the product already uses in the
   pagehead, the hero and the map rail, so nothing new is introduced, and the
   three level scale finally reads at a glance: title 21, label 12.5 caps,
   prose 17. Small label over large prose is also the pattern a reader of long
   form policy text expects, and it cannot be confused with a paragraph at any
   size, which is what the old 15px 600 could be and was.

   Above a heading goes to 24px, below to 8px. Adjacent margins collapse
   between siblings, so the paragraph's own 16px is absorbed rather than
   added. The first heading in the card keeps 0 so the card padding is not
   doubled.

   The paragraph margins have to be rewritten with !important for the same
   reason as 3a: they are inline. */
#shell .nv-col > .nv-stack[hidden] ~ .wrap .card h3{
  margin:var(--s5) 0 var(--s2);
  font-size:var(--fs-meta);
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--ink);
}
/* Uppercase does nothing in Chinese and tracking pulls the glyphs apart, so
   the emphasis has to come from weight and size instead. This mirrors, one
   for one, the rule index.html already ships at [data-lang="zh"] .eyebrow.
   The size goes back up to 13.5px because a CJK label with no case change and
   no tracking has only weight left to separate it, and 12.5px is not enough
   of the label for weight alone to carry. */
body[data-lang="zh"] #shell .nv-col > .nv-stack[hidden] ~ .wrap .card h3{
  font-size:var(--fs-body);
  letter-spacing:.02em;
  text-transform:none;
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .card > h3:first-child{
  margin-top:0;
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .card p{
  margin:0 0 var(--s4) !important;
}


/* ---- 3c. The lists were set smaller than the prose around them ---------

   MEASURED. The procedure lists carry inline font-size:14px and
   line-height:1.9 while the paragraphs beside them are 15px at 1.5. So the
   steps a learner is meant to follow are the smallest text in the card and
   the most loosely leaded, which is two mistakes pointing in opposite
   directions. 14px is also off the scale; design-system.css.part collapses 14
   to 15 everywhere it can reach, and could not reach this one because it is
   an inline style.

   The list now matches the prose exactly, at the 17px step and 1.6, and the
   air moves from inside the line to between the items, which is where a
   numbered procedure wants it. The 20px inline indent moves to a 24px
   padding so the marker sits inside the text column rather than hanging off
   the left of it. */
#shell .nv-col > .nv-stack[hidden] ~ .wrap .card ul,
#shell .nv-col > .nv-stack[hidden] ~ .wrap .card ol{
  margin:0 0 var(--s4) !important;
  padding-left:var(--s5);
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .card li + li{margin-top:var(--s2);}


/* ---- 3d. The most important paragraph was the smallest one -------------

   MEASURED. .callout is 13.5px inside a card whose body was 15px. It renders
   twice in the player and both times it carries the thing the module exists
   to teach: "The pursuit prohibition" in the robbery module, and the
   explanation panel after every assessment answer, which is the single most
   valuable text in the whole player because it is read at the moment the
   learner got it wrong.

   It was set two steps below the prose it explains.

   It goes to the same 17px reading step as the body. It does not need to be
   bigger than the body to be important; it is already inside a panel with a
   gold edge, which is the strongest pull out treatment in the product. What
   it needed was to stop being a footnote. Padding goes up with the text so
   the panel does not tighten around it. */
#shell .nv-col > .nv-stack[hidden] ~ .wrap .callout{
  font-size:var(--fs-h2);
  line-height:1.6;
  padding:var(--s4);
  border-radius:0 var(--r-ctl) var(--r-ctl) 0;
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .callout b{
  margin-bottom:var(--s1);
}


/* ---- 3e. A statutory citation was painted as a warning ----------------

   MEASURED. The module intro renders the authority as
   <div class="chip warn">Cal/OSHA T8 §3203</div>, which is a 151.2px amber
   pill at #F6EEDB with #8A5E10 text.

   --warn is a status colour. It means this is running out of time. "Cal/OSHA
   T8 §3203" is not running out of time, it is the name of the regulation the
   module teaches, and it is the same on the day the module is written as it
   is ten years later. Painting it amber is exactly the overlap docs/06
   section 3 forbids, in the mildest and most common form: reaching for a
   status colour to add importance to something that has no status.

   It becomes the neutral chip and takes the mono face, which is what the rest
   of the product already does with citations: .clock .lb sets every statutory
   reference in the incident register in mono. A citation looks like a
   citation.

   Contrast: --ink-muted #5E5F58 on a 7 percent ink tint computes to 6.3 to 1.
   The tint is derived from --ink rather than written as the shipped #EFEDE7
   literal, because docs/06 section 1 lists that literal as untokenised and
   this file is not adding a nineteenth one. */
#shell .nv-col > .nv-stack[hidden] ~ .wrap > .chip.warn{
  background:color-mix(in srgb,var(--ink) 7%,var(--card));
  color:var(--ink-muted);
  font-family:var(--mono);
  letter-spacing:.02em;
}


/* ---- 3f. The answer options did not look like answer options ----------

   MEASURED. .optrow is a 728px white box, 48.5px tall, 12px padding, 1px
   --rule-int border, with the option letter rendered as
   <span class="mono" style="opacity:.5"> which computes to a 9px wide glyph
   at half opacity. Four of them stack with an 8px gap.

   Nothing about that says "press one of these". It is four paragraphs in
   boxes. The letter, which is the only thing that says these are choices
   rather than statements, is the faintest text on the screen at 0.5 opacity
   on --ink-muted, which composites to roughly 2.9 to 1 and would fail on its
   own.

   The letter becomes a key cap: a 26px ring with the letter centred in it, at
   full opacity, in mono. That is one of the two shapes in this product that
   already means "this is pressable", the other being the segmented control.
   The row goes to 52px minimum and 12px by 16px padding so the target is
   comfortable on a phone with cold hands, which is the working agreement's
   44px floor with room over it.

   The option text goes to the same 17px reading step as the module prose. An
   answer option is read as carefully as anything in the player and it was set
   two steps below the paragraph that taught it.

   Hover and focus move the ring and the border to --action together, so the
   whole row reads as one control rather than as a box containing a letter.

   The transition is 120ms on two colour properties only. index.html line 44
   already reduces every transition in the document to 0.01ms under
   prefers-reduced-motion with !important, so this is covered; the explicit
   rule below is there so that a future edit to that global cannot silently
   un-cover it. */
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow{
  min-height:52px;
  align-items:center;
  gap:var(--s3);
  padding:var(--s3) var(--s4);
  font-size:var(--fs-h2);
  line-height:1.5;
  transition:border-color .12s ease, background-color .12s ease;
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow > .mono{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  width:26px;
  height:26px;
  border-radius:50%;
  border:1px solid var(--rule-int);
  opacity:1 !important;
  font-size:var(--fs-meta);
  font-weight:600;
  color:var(--ink-muted);
  transition:border-color .12s ease, background-color .12s ease, color .12s ease;
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow:hover:not(:disabled),
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow:focus-visible{
  border-color:var(--action);
  background:color-mix(in srgb,var(--action-soft) 55%,var(--card));
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow:hover:not(:disabled) > .mono,
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow:focus-visible > .mono{
  border-color:var(--action);
  color:var(--action);
}
@media (prefers-reduced-motion:reduce){
  #shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow,
  #shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow > .mono{transition:none;}
}


/* ---- 3g. After answering, you could not tell which one you picked -----

   MEASURED, question 1 of CMP-120 with option A chosen and B correct. The
   picked wrong row renders at #F8ECE9 with a --alert border. The correct row
   renders at #E9F2EC with an --ok border. The two untouched rows stay white.
   All four keep the same weight, the same letter and the same shape.

   Two problems.

   First, the state is carried by colour alone, which is a WCAG 1.4.1 failure
   and, more practically, is unreadable to the eight percent of male learners
   with a red green deficiency. This is a grocery workforce sitting a
   compliance assessment; that is not a hypothetical population.

   Second, the two rows are the same strength, so the answer to "which did I
   pick" and the answer to "which was right" are given with equal emphasis and
   the reader has to work out which is which from the colour.

   So the key cap fills. The row you picked and the row that is correct both
   carry a solid mark in their own status colour, and a check or a cross is
   set at the end of the row, which is a second, non colour channel. White on
   --ok computes to 5.99 to 1 and white on --alert to 6.07, both over the 4.5
   floor for a 12.5px glyph.

   The two rows nobody touched drop to --ink-muted, 6.45 to 1 on --card, which
   is quiet without being dimmed below legibility. Opacity is deliberately not
   used for this: it would take the text down to about 3.5 to 1.

   The glyphs are ✓ and ✕, which are the same two the app already sets in the
   feedback callout, so the player says the same thing twice in the same
   vocabulary. Neither is a dash and neither is an arrow. They are announced
   by screen readers, which is correct here: the mark is carrying state that
   colour alone was carrying before. */
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow.right,
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow.wrong{
  border-width:1px;
  font-weight:500;
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow.right > .mono{
  background:var(--ok);
  border-color:var(--ok);
  color:var(--card);
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow.wrong > .mono{
  background:var(--alert);
  border-color:var(--alert);
  color:var(--card);
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow.right::after,
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow.wrong::after{
  margin-left:auto;
  padding-left:var(--s3);
  flex:none;
  font-size:var(--fs-h1);
  font-weight:700;
  line-height:1;
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow.right::after{content:"\2713";color:var(--ok);}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow.wrong::after{content:"\2715";color:var(--alert);}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow:disabled:not(.right):not(.wrong){
  color:var(--ink-muted);
  border-color:var(--rule);
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow:disabled:not(.right):not(.wrong) > .mono{
  border-color:var(--rule);
}


/* ---- 3h. The progress bar was a hairline -------------------------------

   MEASURED. .prog is 4px tall and 728px wide and it is the only thing on the
   page that says how far through a ten step module the learner is. At 4px on
   a --rule track it reads as a divider rather than as a measure, and the
   first step fills a tenth of it, which is 72.8px of jade against 655px of
   grey that most readers will not register as the same object.

   It goes to 6px, which is the height the readiness bar already uses, so the
   product has one bar height rather than two. It also gets its own rounded
   fill so the leading edge of the filled portion is visible against the
   track at step one, rather than dissolving into the corner radius.

   The bar cannot say "Section 1 of 10" without markup, and it should. That
   is in the report under markupProposals. */
#shell .nv-col > .nv-stack[hidden] ~ .wrap .prog{
  height:6px;
  border-radius:var(--r-bar);
  margin-bottom:var(--s5);
}
#shell .nv-col > .nv-stack[hidden] ~ .wrap .prog i{border-radius:var(--r-bar);}


/* ---- 3i. The question and the eyebrow were the same distance apart -----

   MEASURED. The eyebrow sits at 11px, the question h1 at 21px with a 6px top
   margin, and the option list starts 20px under the question. So the label
   and the question are 6px apart and the question and the answers are 20px
   apart, which puts the eyebrow closer to the question than the question is
   to anything, and reads as a three line block rather than as a label, a
   question and a set of choices.

   The eyebrow keeps its 6px, because a label belongs to the thing under it.
   The gap under the question goes to 24px so the choices read as a separate
   act. Written on the h1 because the inline margin-bottom is on the h1. */
#shell .nv-col > .nv-stack[hidden] ~ .wrap > h1{
  margin-bottom:var(--s5) !important;
  line-height:1.3;
  text-wrap:pretty;
}


/* ==========================================================================
   4. 中文

   Latin type and CJK type do not want the same leading. A Latin lowercase
   letter is about 0.52em tall inside its line box, so 1.5 line height leaves
   real space between the strokes of consecutive lines. A CJK glyph fills its
   em box almost completely, so the same 1.5 leaves a fraction of that gap and
   the paragraph reads as a solid block. docs/06 section 6 already records the
   answer, 1.7 for body under [data-lang="zh"], and it is implemented for
   body. It is not implemented for headings, which is where it shows worst,
   because headings are where line height is tightest to begin with.
   ========================================================================== */

/* MEASURED, and the assumption going into this was wrong, so it is recorded
   rather than quietly corrected.

   The guess was that 中文 headings were set too tight. They were not. The
   assessment question inherits its leading, and what it inherits differs by
   language: English takes the body's 1.5 and sets at 31.5px, 中文 takes the
   1.7 that [data-lang="zh"] already sets and sets at 35.7px. So the English
   heading was the loose one, at a ratio docs/06 section 6 reserves for body
   text, against a heading range of 1.15 to 1.25.

   3i tightens the question to 1.3. Left there, that rule would have pulled
   the CJK heading down to 27.3px along with it, and THAT would have been the
   regression this section exists to prevent: a Latin lowercase letter fills
   about 0.52em of its line box, so 27.3px on 21px type still leaves daylight
   between the strokes of two lines, while a CJK glyph fills close to the
   whole em and the same 27.3px leaves two solid blocks of ink 6px apart.

   So the two scripts are set separately rather than one being made to follow
   the other. 1.3 for Latin, 1.6 for CJK, which is 33.6px. Both are tighter
   than the paragraph they sit above, which is what makes them read as
   headings, and CJK keeps roughly twice the visible gap.

   The module body and the option rows go to 1.75, one step above the 1.7 the
   body already carries, because at the 17px reading step the block is denser
   again. */
body[data-lang="zh"] #shell .nv-col > .nv-stack[hidden] ~ .wrap > h1{line-height:1.6;}
body[data-lang="zh"] #shell .nv-col > .nv-stack[hidden] ~ .wrap .card p,
body[data-lang="zh"] #shell .nv-col > .nv-stack[hidden] ~ .wrap .card li{line-height:1.75 !important;}
body[data-lang="zh"] #shell .nv-col > .nv-stack[hidden] ~ .wrap .callout,
body[data-lang="zh"] #shell .nv-col > .nv-stack[hidden] ~ .wrap .optrow{line-height:1.7;}

/* MEASURED. The privileged note in 中文 sets at the same 13.5px and 1.5 as
   English, and it is the densest block of CJK in the product: legal prose,
   no line breaks, in a 528px drawer. It follows 1g up to 15px and takes the
   CJK leading with it. */
body[data-lang="zh"] #drawer .note.priv{line-height:1.75;}

/* MEASURED. The employee empty state title in 中文 is
   "目前沒有待完成的訓練", ten full width characters at the 15px lead step
   inside a 58ch container, so it never wraps and the 1.3 heading leading the
   design system sets is doing nothing visible. The sentence under it does
   wrap, at 1.55, and that is the one that reads tight. It is the same
   correction as everywhere else in this section. */
body[data-lang="zh"] #app .wrap:has(> #hero[data-hpersona="emp"]) .empty{line-height:1.75;}

/* ---- icons ---- */
/* =====================================================================
   ICONS, the stylesheet half.
   Pairs with app/parts/icons.js.part. Everything here is scoped to .ic
   or to a button that contains nothing but an .ic, so this file cannot
   repaint anything it did not draw.
   ===================================================================== */

/* Base. The svg carries its own width and height attributes from
   ic(name, size), so no size is set here; setting one would silently
   override the optical stroke ramp, because the stroke is computed
   against the size that was asked for and a CSS resize does not
   recompute it. If a call site needs a different size it passes one. */
.ic{
  display:inline-block;
  flex:none;
  color:inherit;
  overflow:visible;
}

/* Optical vertical centring beside text.
   MEASURED. At the app's 13.5px body with line-height 1.5 the line box
   is 20.25px and a 16px icon on the default baseline sits 2.4px low,
   because a baseline aligned replaced element hangs its whole box above
   the baseline. vertical-align:middle puts the icon centre on the
   x-height midpoint, which is 0.9px above the optical centre of a Noto
   Sans lowercase line. The 0.09em nudge closes that. It is em based so
   it holds at every one of the seven type sizes this app renders. */
.ic{
  vertical-align:middle;
  margin-top:-0.09em;
}

/* Inside a flex row the margin trick is wrong, because a flex item is
   not on a baseline at all. Nothing moves; alignment comes from the
   container. Every icon in this app that sits beside a label is in a
   flex row (the rail rows, the sub nav tabs, the mega panel rows, the
   palette rows), so this is the common case and the rule above is the
   fallback for inline runs. */
.ic:where(:not(:only-child)):where(.nv-ic,.fl-ic,.ibx-ic){
  margin-top:0;
}

/* Brand colour, opt in.
   docs/06 section 4 is explicit about where saturated brand is correct.
   A banner mark is identity, so it may carry the banner colour; nothing
   else in this family may. The class is opt in rather than automatic
   because these same two marks also render inside a jade filled button
   and inside a selected table row, where they have to inherit
   currentColor or they disappear. */
.ic-brand.ic-b99{color:var(--r99-deep)}
.ic-brand.ic-b168{color:var(--m168)}

/* The banner marks are the only solid rectangles in the family, so they
   are the only two that need their own optical size. MEASURED: at the
   same nominal 16px a solid 20 unit square reads about 11 percent larger
   than an open line drawing of the same box, which is the standard solid
   versus outline illusion. Scaling the box down by 0.92 puts the two
   back on the same apparent size beside each other in a table cell. */
.ic-b99,.ic-b168{transform:scale(.92)}

/* Icon only buttons.
   The working agreement floors a touch target at 44px and the design
   critique C13 found .btn rendering at 34px at 390px. An icon only
   control is the easiest one to get wrong, because its content is
   16px and nothing forces the box open. This makes the floor automatic
   for any button whose entire content is one of these marks, so a new
   icon button cannot ship under size. Not applied on fine pointers,
   where 34px is a correct dense target and 44 would loosen the top bar
   that contract section 10 already had to fight for room in. */
@media (pointer:coarse){
  button:has(> .ic:only-child),
  a:has(> .ic:only-child){
    min-width:44px;
    min-height:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
}

/* The label drop utility, which is the reason the client asked for
   icons at all.

   The complaint was a filter row wrapping to two lines. Measured on the
   legal register at 390px the four .fchip filters are "All", "Serious",
   "Escalated" and "Litigation hold", and in 中文 the last one is
   訴訟文件保存, five characters at 12.5px. The row is 372px of content
   in a 358px box, so it wraps, and the second line carries one chip.

   The fix an icon buys: put ic() inside the chip and wrap the words in
   .ic-lbl. Above 640px the words show. Below, the words are removed from
   layout and survive only as the accessible name, and four chips become
   four 44px squares totalling 200px, which fits on one line at 390px
   with room left.

   clip-path plus absolute is used rather than display:none because a
   display:none label is not read by any screen reader, and these chips
   have no other text. This is the standard visually hidden recipe, not
   an invention.

   NOTE, honestly: no call site uses this yet. Putting ic() inside the
   chip is a change to the view functions, which this agent does not
   own. The class and the measurement are here so that pass is five
   minutes rather than an argument. */
.ic-lbl{margin-left:var(--s2)}
@media (max-width:640px){
  .ic-lbl{
    position:absolute;
    width:1px;height:1px;
    margin:0;padding:0;
    overflow:hidden;
    clip-path:inset(50%);
    white-space:nowrap;
  }
  /* Without this the chip keeps its 12px side padding around a zero
     width label and lands at 34px wide, under the floor. */
  .fchip:has(> .ic){
    min-width:44px;
    padding-left:var(--s2);
    padding-right:var(--s2);
