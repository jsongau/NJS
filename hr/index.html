/* ---------- module state ---------------------------------------------------
   No PREFS object is declared here. Contract section 1 gives persistence to
   the rail state, which belongs to the chrome layer, and two parts declaring
   const PREFS in the same merged script is a SyntaxError that takes the whole
   app down. This layer reads it if it exists and assumes nothing if it does
   not. Nothing here calls the browser local storage API, which is unavailable
   in the delivery environment and throws. */
const FL = {
  ready:false,
  seq:0,
  toasts:[],          /* {id, el, timer} */
  mute:0,             /* suppresses task toasts during taskSelfTest */
  lastSel:-1,
  lastGo:{s:'', t:0},
  fab:null,
  adoptLegacyToast:true,
  surface:null,       /* last surface this rail navigated to, for the active state */
  pal:{open:false, q:'', i:0, rows:[], opener:null, recent:[]}
};

/* ---------- small helpers -------------------------------------------------- */

const flZh = () => LANG === 'zh';
const flTx = o => esc(tx(o));

/* Contract section 1 state, created only if the chrome layer has not created
   it first. Never a second state object. */
function flRoute(){
  const rail = (typeof PREFS !== 'undefined' && PREFS && PREFS.rail) ? PREFS.rail : 'open';
  if(!S.nav)  S.nav  = {mega:false, rail:rail, palette:false, inbox:false};
  if(!S.toast) S.toast = [];
  if(!S.route) S.route = {persona:S.persona, surface:null, tab:S.tab, filter:S.filter, ctx:null};
  return S.route;
}

/* S.sel is shared with an older meaning: the map writes the selected store
   object into it. So the action bar asks this function, which returns a
   selection only when the value carries the contract shape {kind, ids}. A
   store object simply reads as no selection, which is correct, and the map
   highlight keeps working because nothing here overwrites it unless there is a
   real selection to write. */
function flSelection(){
  /* Scoped to the surface that owns the selection. S.assign survives a persona
     switch, so without this the bar follows the user to the HQ console and
     offers to assign training with the panel that does the assigning three
     clicks away. A bar whose verbs point at controls that are not on screen is
     worse than no bar. */
  const owns = S.persona === 'mgr' && S.tab === 'team' && !S.module;
  const ppl = (owns && S.assign && Array.isArray(S.assign.people)) ? S.assign.people : [];
  if(ppl.length){
    S.sel = {kind:'people', ids:ppl.slice()};
    return S.sel;
  }
  if(S.sel && Array.isArray(S.sel.ids)){
    if(S.sel.kind === 'people'){ S.sel = {kind:null, ids:[]}; return null; }
    return S.sel.ids.length ? S.sel : null;
  }
  return null;
}

/* The persistent live region, contract section 7. Created here rather than in
   the markup part so that whichever layer mounts first wins and there is never
   a second one. Every count that changes on interaction comes through here. */
function flAnnounce(pair){
  let a = document.getElementById('live');
  if(!a){
    a = document.createElement('div');
    a.id = 'live';
    a.className = 'vh';
    a.setAttribute('role','status');
    a.setAttribute('aria-live','polite');
    document.body.appendChild(a);
  }
  a.textContent = typeof pair === 'string' ? pair : tx(pair);
}

/* One paint's worth of task rows, so a rail with five badges does not filter
   549 rows five times. Discarded at the end of the paint. */
let _flTasks = null;
function flTasks(){
  if(_flTasks) return _flTasks;
  return _flTasks = (typeof tasksFor === 'function') ? tasksFor(S.persona) : [];
}
function flCountKinds(kinds){
  if(!kinds || !kinds.length) return {n:0, sev:null};
  const list = flTasks().filter(t => kinds.indexOf(t.kind) >= 0);
  let sev = null;
  list.forEach(t => {
    if(t.sev === 'crit') sev = 'crit';
    else if(t.sev === 'warn' && sev !== 'crit') sev = 'warn';
  });
  return {n:list.length, sev:sev};
}

/* crit is reserved. The badge only carries the critical class when a crit task
   is actually in the count, which in this data set means an expired 8 hour
   Cal/OSHA clock and nothing else. Contract section 6. */
function flBadge(n, sev){
  if(!n) return '';
  const cls = sev === 'crit' ? 'crit' : sev === 'warn' ? 'warn' : '';
  return '<span class="fl-badge ' + cls + '" aria-hidden="true">' + (n > 99 ? '99+' : n) + '</span>';
}

/* ---------- navigation ---------------------------------------------------- */

/* Finds a section in #app by the text of its own h2, which is how this rail
   reaches a surface on a console that is one long scrolling page rather than a
   set of tabs. Matching rendered text rather than a hard coded index means the
   anchor survives a section being inserted above it, and it works in both
   languages because t() returns the rendered word. */
function flHeadingSection(key){
  const app = document.getElementById('app');
  if(!app) return null;
  const want = t(key);
  const secs = app.querySelectorAll('section');
  for(let i = 0; i < secs.length; i++){
    const h = secs[i].querySelector('h2');
    if(h && h.textContent.trim().indexOf(want) === 0) return secs[i];
  }
  return null;
}

function flScrollTo(el){
  if(!el) return false;
  el.scrollIntoView({behavior: REDUCED() ? 'auto' : 'smooth', block:'start'});
  return true;
}

/* Applies a route patch. Writes the contract shape on S.route and the legacy
   fields the existing views actually read, because both have to agree until
   every view is reading S.route. */
function flGo(patch){
  patch = patch || {};
  const r = flRoute();
  const personaChanged = patch.persona && patch.persona !== S.persona;

  if(patch.persona){
    S.persona = patch.persona;
    r.persona = patch.persona;
    if(personaChanged){
      S.module = null;
      if(!patch.tab) S.tab = S.persona === 'mgr' ? 'team' : S.persona === 'emp' ? 'record' : S.persona === 'cc' ? 'myqueue' : 'queue';
      if(!('filter' in patch)) S.filter = 'all';
      if(typeof closeDrawer === 'function') closeDrawer();
    }
  }
  if('surface' in patch){ r.surface = patch.surface; FL.surface = patch.surface; }
  if('ctx' in patch) r.ctx = patch.ctx;
  if(patch.tab){ S.tab = patch.tab; r.tab = patch.tab; }
  if('filter' in patch){
    r.filter = patch.filter;
    S.filter = patch.filter == null ? 'all' : patch.filter;
  }
  if(patch.store){ S.store = patch.store; }
  render();
  return r;
}

/* One rail destination activated. The route patch goes out first so that any
   layer reading S.route lands on the right surface, then the legacy fallback
   scrolls this build's single page consoles to the matching section. */
function flNavTo(item){
  const persona = S.persona;
  if(item.k === 'tasks'){ flOpenInbox(); return; }

  const patch = {persona:persona, surface:item.k};
  if(item.tab) patch.tab = item.tab;
  if('filter' in item) patch.filter = item.filter;
  flGo(patch);

  /* Scroll only when the console is a scrolling page. A tabbed console has
     already swapped its body, and scrolling it as well fights the user. */
  if(!item.tab){
    const target = item.sel ? document.querySelector(item.sel)
                 : item.head ? flHeadingSection(item.head) : null;
    if(target) flScrollTo(target);
  }
  flAnnounce(FL_SURFACE[item.k] || {en:item.k, zh:item.k});
}

/* The inbox drawer belongs to another layer. Ask for it by event, and if that
   layer is not in this build, fall back to the palette showing open tasks,
   which is a real answer rather than a button that does nothing. */
function flOpenInbox(){
  flRoute();
  S.nav.inbox = true;
  document.dispatchEvent(new CustomEvent('inbox:open', {detail:{persona:S.persona}}));
  if(!document.getElementById('inbox')){
    S.nav.inbox = false;
    flPaletteOpen(document.activeElement);
  }
}

/* ---------- the bottom rail ----------------------------------------------- */

function flRailItems(){
  const base = (FL_NAV[S.persona] || []).slice();
  base.push({k:'tasks', icon:'bell', tasks:true});
  return base;
}

/* Which destination reads as current. A tabbed console answers from S.tab, a
   filtered one from S.filter, and a scrolling one from the last surface this
   rail navigated to, which is the only honest answer available when four
   sections share one scroll container. */
function flActiveKey(){
  const r = flRoute();
  if(S.persona === 'mgr') return S.tab || 'team';
  if(S.persona === 'emp') return S.tab || 'record';
  return r.surface || FL.surface || null;
}

function flRailHTML(){
  const items = flRailItems();
  const active = flActiveKey();
  return items.map(item => {
    const lb = item.tasks ? FL_TXT.tasks : (FL_SURFACE[item.k] || {en:item.k, zh:item.k});
    const c = item.tasks
      ? (function(){
          const list = flTasks();
          let sev = null;
          list.forEach(t => {
            if(t.sev === 'crit') sev = 'crit';
            else if(t.sev === 'warn' && sev !== 'crit') sev = 'warn';
          });
          return {n:list.length, sev:sev};
        })()
      : flCountKinds(item.kinds);
    const aria = c.n
      ? tx(item.tasks ? FL_N.taskBadge(c.n) : FL_N.navBadge(lb, c.n))
      : tx(lb);
    return '<button type="button" data-go="' + esc(JSON.stringify({rail:item.k})) + '"' +
      (active === item.k ? ' aria-current="page"' : '') +
      ' aria-label="' + esc(aria) + '">' +
      FL_ICON[item.icon] + flBadge(c.n, c.sev) +
      '<span class="fl-lb">' + flTx(lb) + '</span></button>';
  }).join('');
}

/* ---------- the contextual action bar ------------------------------------- */

/* Verbs carry the count, per teardown doc 03 section 2 item 1: a bare "Assign"
   makes the user scroll back up to find out what they are about to do to how
   many people. "Assign 2 modules to 7 people" does not. */
function flBarHTML(sel){
  const n = sel.ids.length;
  const cnt = '<span class="fl-count">' + esc(tx(FL_N.selected(n))) + '</span>';
  if(sel.kind !== 'people'){
    return cnt + '<div class="fl-gap"></div>' +
      '<button type="button" class="ghost" data-flact="clear">' + flTx(FL_TXT.clearSel) + '</button>';
  }
  const mods = (S.assign && Array.isArray(S.assign.courses)) ? S.assign.courses.length : 0;
  const primary = mods
    ? {act:'assign', lb:FL_N.assign(mods, n)}
    : {act:'choose', lb:FL_N.choose(n)};
  return cnt + '<div class="fl-gap"></div>' +
    '<button type="button" class="ghost" data-flact="export">' + esc(tx(FL_N.exportN(n))) + '</button>' +
    '<button type="button" data-flact="' + primary.act + '">' + esc(tx(primary.lb)) + '</button>' +
    '<button type="button" class="ghost" data-flact="clear" aria-label="' + esc(tx(FL_TXT.clearSel)) + '">' +
    flTx(FL_TXT.clearShort) + '</button>';
}

function flBarAct(act){
  const sel = flSelection();
  if(!sel) return;
  if(act === 'clear'){
    /* Reuse the panel's own clear button when it is on screen, so one code path
       owns what clearing a selection means. */
    const b = document.getElementById('a-clear');
    if(b){ b.click(); } else { S.assign = {people:[], courses:[]}; S.sel = {kind:null, ids:[]}; render(); }
    flAnnounce(FL_N.selected(0));
    return;
  }
  if(act === 'assign'){
    /* Same reuse. #a-confirm already owns the preview it creates and the toast
       it raises, and duplicating that here is how two surfaces start
       disagreeing about what was created. */
    const b = document.getElementById('a-confirm');
    if(b) b.click();
    else flToast(FL_TXT.noSurface, {kind:'warn'});
    return;
  }
  if(act === 'choose'){
    /* Nothing to assign until modules are picked, so the verb takes the user to
       the module picker rather than failing quietly. */
    const pill = document.querySelector('button[data-acourse]');
    if(pill){ flScrollTo(pill.closest('div.card') || pill); pill.focus(); }
    return;
  }
  if(act === 'export'){
    /* Employee level export is routed through the release log (SOP-07)
       rather than downloaded from a selection. */
    if(typeof toast === 'function') toast('Employee level export routed to the release log for HR approval (SOP-07).');
    flAnnounce({en:'Export routed to the release log for approval'});
  }
}

/* ---------- the FAB -------------------------------------------------------- */

/* The one module an employee should be looking at next: the first required
   module that is started and unfinished, or missing, or out of date. Same rule
   viewEmp uses to build its assigned list, read through certState so the FAB
   and the list cannot disagree about what is outstanding. Started and
   unfinished reads as Resume, everything else as Start, because telling
   somebody to start a module they are halfway through is how they start it
   again from step one. */
function flEmpNext(){
  const e = S.me;
  if(!e) return null;
  const recs = (typeof REC !== 'undefined' && REC[e.id]) ? REC[e.id] : {};
  const req = required(e);
  for(let i = 0; i < req.length; i++){
    const c = req[i], r = recs[c.c], cs = certState(e, c.c);
    if(!r || !r.done || cs.s === 'expired' || cs.s === 'expiring')
      return {code:c.c, mode: (r && !r.done) ? 'resume' : 'start'};
  }
  /* Fully current. A persona with no primary action is a persona the FAB
     forgets about, so the fallback is the certification that expires next,
     offered as a review rather than a start. It is the honest next thing:
     nothing is late, and this is what goes late first. */
  let soonest = null;
  req.forEach(c => {
    const cs = certState(e, c.c);
    if(cs.exp && (!soonest || cs.exp < soonest.exp)) soonest = {code:c.c, exp:cs.exp};
  });
  return soonest ? {code:soonest.code, mode:'review'} : null;
}

function flFab(){
  if(S.persona === 'hq')
    return {icon:'log', lb:{en:'New log'}, act:'intake'};
  if(S.persona === 'cc')
    return {icon:'log', lb:{en:'New log'}, act:'intake'};
  if(S.persona === 'mgr')
    return {icon:'folder', lb:{en:'Manager responses'}, act:'respond'};
  const next = flEmpNext();
  if(!next) return null;
  const lb = next.mode === 'resume' ? {en:'Resume ' + next.code}
           : next.mode === 'review' ? {en:'Review ' + next.code}
           :                          {en:'Start ' + next.code};
  return {icon:'book', lb:lb, act:'module', arg:next.code};
}

function flFabAct(f){
  if(!f) return;
  if(f.act === 'campaign'){
    /* HQ campaign builder. The section carries an id already, so this is a real
       anchor rather than a section index that moves when somebody inserts a
       panel above it. */
    flGo({persona:'hq', surface:'training'});
    flScrollTo(document.getElementById('campaign'));
    flAnnounce(FL_SURFACE.training);
    return;
  }
  if(f.act === 'intake'){
    if(typeof intakeModal === 'function'){ intakeModal(); return; }
    flGo({persona:'cc', surface:'intake'});
    flAnnounce(FL_SURFACE.intake);
    return;
  }
  if(f.act === 'respond'){
    flGo({persona:'mgr', surface:'attendance', tab:'attendance'});
    flAnnounce(FL_SURFACE.attendance);
    return;
  }
  if(f.act === 'module'){
    /* Opening the player is state, not navigation: viewModule() takes over the
       render as soon as S.module is set. */
    S.module = f.arg; S.mstep = 0; S.manswers = {};
    if(typeof closeDrawer === 'function') closeDrawer();
    render();
    flAnnounce({en:'Module ' + f.arg, zh:'課程 ' + f.arg});
  }
}

/* ---------- toasts --------------------------------------------------------- */

/* A stack, not a singleton. Six seconds with no undo, twelve with one, because
   six is not long enough to notice a mistake, read the sentence and reach the
   button. Hovering or focusing a toast holds it open, since a timer that runs
   out while the pointer is on the undo is a trap. */
function flToast(msg, opts){
  opts = opts || {};
  const host = document.getElementById('toasts');
  if(!host) return null;
  const id = 'fl-t' + (++FL.seq);
  const hasUndo = typeof opts.undo === 'function';
  const el = document.createElement('div');
  el.className = 'fl-toast ' + (opts.kind || 'ok');
  el.dataset.fltoast = id;
  el.innerHTML =
    '<i class="fl-edge" aria-hidden="true"></i>' +
    '<div class="fl-msg">' + esc(tx(msg)) + '</div>' +
    (hasUndo ? '<button type="button" data-flt="undo">' + flTx(FL_TXT.undo) + '</button>' : '') +
    '<button type="button" class="fl-x" data-flt="close" aria-label="' + esc(tx(FL_TXT.dismiss)) + '">' +
    /* A drawn glyph, not the letter x. The letter reads as a letter beside
       Chinese copy, and the multiplication sign is the one dash-family
       character the house rule does not cover but which we avoid anyway.
       An inline path is the only version that looks the same in both
       languages and at any font stack. */
    '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
    'stroke-width="2.4" stroke-linecap="round" aria-hidden="true">' +
    '<path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  host.appendChild(el);

  const rec = {id:id, el:el, undo:opts.undo || null, timer:null, ms: hasUndo ? 12000 : 6000};
  const start = () => { rec.timer = setTimeout(() => flToastClose(id), rec.ms); };
  const stop  = () => { if(rec.timer){ clearTimeout(rec.timer); rec.timer = null; } };
  el.addEventListener('mouseenter', stop);
  el.addEventListener('mouseleave', start);
  el.addEventListener('focusin', stop);
  el.addEventListener('focusout', start);
  rec.start = start;
  start();

  FL.toasts.push(rec);
  flRoute();
  S.toast.push({id:id, kind:opts.kind || 'ok', msg:msg, undo:hasUndo});
  /* The message is the announcement. Anything a sighted user is told by a toast
     a screen reader user is told by #live, one region, on body. */
  flAnnounce(msg);
  return id;
}

function flToastClose(id){
  const i = FL.toasts.map(x => x.id).indexOf(id);
  if(i < 0) return;
  const rec = FL.toasts[i];
  if(rec.timer) clearTimeout(rec.timer);
  if(rec.el && rec.el.parentNode) rec.el.parentNode.removeChild(rec.el);
  FL.toasts.splice(i, 1);
  if(S.toast) S.toast = S.toast.filter(x => x.id !== id);
}

function flToastUndo(id){
  const rec = FL.toasts.filter(x => x.id === id)[0];
  if(!rec) return;
  const fn = rec.undo;
  flToastClose(id);
  if(!fn) return;
  const out = fn();
  if(out && out.ok === false && out.reason){ flToast(out.reason, {kind:'warn'}); return; }
  render();
}

/* ---------- task completion ------------------------------------------------
   taskComplete is wrapped rather than called from a click handler, so that the
   inbox drawer, the palette, a hero panel and this file all raise the same
   toast with the same undo without any of them knowing about the others. One
   choke point, one toast, one undo token. */
function flWrapTasks(){
  if(typeof taskComplete !== 'function' || taskComplete._fl) return;
  const inner = taskComplete;
  const wrapped = function(id, persona){
    const out = inner(id, persona);
    if(FL.mute || !out || !out.ok) return out;
    const task = (typeof taskById === 'function') ? taskById(id) : null;
    const label = task ? (task.subject && task.subject.label ? task.subject.label : tx(task.title)) : id;
    const token = out.token;
    flToast(FL_N.doneAll(label), {
      kind:'ok',
      undo: function(){
        const r = taskUndo(token);
        if(r && r.ok) flToast(FL_N.reopened(label), {kind:'warn'});
        return r;
      }
    });
    return out;
  };
  wrapped._fl = true;
  window.taskComplete = wrapped;

  /* The self test completes and undoes real tasks on purpose. Muting it keeps
     six toasts from appearing the moment somebody runs the gate. */
  if(typeof taskSelfTest === 'function' && !taskSelfTest._fl){
    const st_ = taskSelfTest;
    const w2 = function(){ FL.mute++; try{ return st_.apply(this, arguments); } finally { FL.mute--; } };
    w2._fl = true;
    window.taskSelfTest = w2;
  }
}

/* The CTA on a task row. Handled here only when no inbox layer is mounted, and
   guarded by the task's own state either way, so the two cannot both act on
   one click. taskComplete throws on an informational task and taskClear throws
   on an actionable one, so the branch is on task.act, not on a guess. */
function flTaskCta(id){
  const task = (typeof taskById === 'function') ? taskById(id) : null;
  if(!task || task.state !== 'open') return;
  if(task.act){
    taskComplete(id, S.persona);
  } else {
    taskClear(id, S.persona);
    const label = task.subject && task.subject.label ? task.subject.label : tx(task.title);
    flToast(FL_N.clearedMe(label), {kind:'ok'});
  }
  render();
}

/* Opening a task means opening the record behind it, never a detail page that
   restates the row. One branch per subject type. */
function flOpenTask(task){
  if(!task) return;
  const sub = task.subject || {};
  switch(sub.type){
    /* An incident opens the incident drawer, where the clocks and the audit
       trail already live. */
    case 'case':
      if(typeof caseDrawer === 'function') caseDrawer(sub.id);
      return;
    case 'attendance':
      if(typeof attReviewDrawer === 'function') attReviewDrawer(sub.emp);
      return;
    case 'leave':
      if(typeof leaveDrawer === 'function') leaveDrawer(sub.id);
      return;
    case 'dqrule':
      if(typeof dqDrawer === 'function') dqDrawer(sub.id);
      return;
    case 'release':
      flGo({persona:'hq', surface:'reporting'});
      return;
    case 'report':
      if(typeof reportDrawer === 'function') reportDrawer(sub.id);
      return;
    /* An overdue training row is about a person, so it opens that person's
       record rather than the module. */
    case 'employee':
      if(typeof empDrawer === 'function') empDrawer(sub.id);
      return;
    /* An overdue drill belongs to a store, so it opens that store's drills tab
       with the store already switched. */

    /* Anything else hands off to the inbox, which is the one surface that can
       render a task with no record of its own. */
    default:
      flOpenInbox();
  }
}

/* ---------- command palette ------------------------------------------------ */

const FL_CAP = {store:6, emp:8, course:6, task:6, kase:6, rpt:6};

function flMatch(hay, q){ return String(hay == null ? '' : hay).toLowerCase().indexOf(q) >= 0; }

/* Case insensitive substring over code, name and city. Deliberately not fuzzy:
   a manager typing R10 wants R101 through R109 and not a ranked guess, and a
   predictable list is faster to scan than a clever one. */
function flPalRows(q){
  const zh = flZh();
  const out = [];
  q = String(q || '').trim().toLowerCase();

  if(!q){
    /* Empty query is not an empty box. Five items: the most urgent open tasks
       first, because worst first is what tasksFor already sorts by, then
       whatever this session has opened before. */
    const urgent = flTasks().slice(0, 5);
    urgent.forEach(t => out.push(flPalTaskRow(t, FL_TXT.palStart, 'TASKS')));
    FL.pal.recent.slice(0, 5 - out.length).forEach(r => out.push(Object.assign({}, r, {grp:FL_TXT.palStart, tag:r.tag})));
    return out;
  }

  /* STORES, by code and city. */
  const stores = DEPTS.filter(s => flMatch(s.c, q) || flMatch(s.en, q));
  stores.slice(0, FL_CAP.store).forEach(s => out.push({
    grp:FL_TXT.palStores, tag:'DEPTS', kind:'store', id:s.c,
    title:s.en, sub:s.c + ' · ' + ((ROSTER[s.c] || []).filter(e => e.status !== 'term').length) + ' people',
    key:s.c
  }));
  const cases = CASES.filter(c => flMatch(c.id, q) || flMatch(RBYC[c.reason].en, q));
  cases.slice(0, FL_CAP.kase).forEach(c => out.push({
    grp:FL_TXT.palCases, tag:'CASES', kind:'case', id:c.id,
    title:c.id + ', ' + RBYC[c.reason].en, sub:empName(c.emp) + ' · ' + deptName(c.dept) + ' · ' + label(CASE_STATUS, c.status),
    key:c.id
  }));
  const rpts = REPORTS.filter(r => flMatch(r.id, q) || flMatch(r.en, q));
  rpts.slice(0, FL_CAP.rpt).forEach(r => out.push({
    grp:FL_TXT.palReports, tag:'REPORTS', kind:'rpt', id:r.id,
    title:r.en, sub:r.id + ' · ' + r.freq + ' · ' + r.owner,
    key:r.id
  }));

  /* EMP, by name and id. Capped, because 2,747 rows in a palette is a wall and
     nobody reads past the eighth. The cap is stated in the group label rather
     than hidden, so the user knows to narrow the query. */
  const people = EMP.filter(e => flMatch(e.name, q) || flMatch(e.id, q));
  people.slice(0, FL_CAP.emp).forEach(e => out.push({
    grp:FL_TXT.palEmp, tag:'EMP', kind:'emp', id:e.id,
    title:e.name, sub:e.title + ' · ' + deptName(e.dept), key:e.id,
    more: people.length > FL_CAP.emp ? FL_N.capped(FL_CAP.emp, people.length) : null
  }));

  /* COURSES, by code and title, both languages, because a Chinese reader
     searching 熱傷害 should find CMP-140. */
  const courses = COURSES.filter(c => flMatch(c.c, q) || flMatch(c.en, q));
  courses.slice(0, FL_CAP.course).forEach(c => out.push({
    grp:FL_TXT.palCourses, tag:'COURSES', kind:'course', id:c.c,
    title:c.en, sub:c.c + ' · ' + c.min + ' min' + (c.au ? ' · ' + c.au : ''),
    key:c.c
  }));

  /* Open tasks in this persona's scope only. A palette that offers legal work
     to a store manager is a permissions bug with a search box in front of it. */
  const tasks = flTasks().filter(t =>
    flMatch(t.id, q) || flMatch(tx(t.title), q) ||
    flMatch(t.subject && t.subject.label, q) || flMatch(t.kind, q));
  tasks.slice(0, FL_CAP.task).forEach(t => out.push(flPalTaskRow(t, FL_TXT.palTasks, 'TASKS')));

  return out;
}

function flPalTaskRow(t, grp, tag){
  return {
    grp:grp, tag:tag, kind:'task', id:t.id,
    title:tx(t.title),
    sub:(t.subject && t.subject.label ? t.subject.label + ' · ' : '') + tx(t.why),
    key:t.id, sev:t.sev
  };
}

function flPalPaint(){
  const list = document.getElementById('pallist');
  if(!list) return;
  const rows = FL.pal.rows;
  if(!rows.length){
    list.innerHTML = '<div class="fl-empty">' + flTx(FL_TXT.palNone) + '</div>';
    flAnnounce(FL_N.results(0));
    return;
  }
  let html = '', last = null, capNote = null;
  rows.forEach((r, i) => {
    if(r.grp !== last){
      last = r.grp;
      html += '<div class="fl-grp" role="presentation">' + flTx(r.grp) +
        (r.tag ? ' <span class="fl-k">' + esc(r.tag) + '</span>' : '') + '</div>';
    }
    if(r.more) capNote = r.more;
    html += '<button type="button" class="fl-opt" role="option" id="palopt' + i + '"' +
      ' data-palgo="' + i + '" aria-selected="' + (i === FL.pal.i) + '">' +
      '<span class="fl-g"><span class="fl-t">' + esc(r.title) + '</span>' +
      '<span class="fl-s">' + esc(r.sub || '') + '</span></span>' +
      '<span class="fl-k">' + esc(r.key || '') + '</span></button>';
  });
  if(capNote) html += '<div class="fl-empty">' + esc(tx(capNote)) + '</div>';
  list.innerHTML = html;
  const q = document.getElementById('palq');
  if(q) q.setAttribute('aria-activedescendant', 'palopt' + FL.pal.i);
  const on = list.querySelector('button.fl-opt[aria-selected="true"]');
  if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
  flAnnounce(FL_N.results(rows.length));
}

function flPalSearch(q){
  FL.pal.q = q;
  _flTasks = null;
  FL.pal.rows = flPalRows(q);
  FL.pal.i = 0;
  flPalPaint();
  _flTasks = null;
}

function flPaletteOpen(opener){
  const p = document.getElementById('palette');
  if(!p || FL.pal.open) return;
  flRoute();
  FL.pal.open = true;
  S.nav.palette = true;
  FL.pal.opener = (opener && opener.focus) ? opener : document.activeElement;
  p.hidden = false;
  const q = document.getElementById('palq');
  if(q){
    q.value = '';
    q.placeholder = tx(FL_TXT.palHold);
    q.setAttribute('aria-label', tx(FL_TXT.palHold));
  }
  const foot = document.getElementById('palfoot');
  if(foot) foot.innerHTML = '<span>' + flTx(FL_TXT.palHint) + '</span>';
  const escLb = p.querySelector('span.fl-esc');
  if(escLb) escLb.textContent = tx(FL_TXT.esc);
  p.setAttribute('aria-label', tx(FL_TXT.search));
  flPalSearch('');
  if(q) q.focus();
}

function flPaletteClose(){
  const p = document.getElementById('palette');
  if(!p || !FL.pal.open) return;
  FL.pal.open = false;
  if(S.nav) S.nav.palette = false;
  p.hidden = true;
  /* Focus goes back to whatever opened it, per contract section 7. A dialog
     that drops focus on <body> puts a keyboard user back at the top of a
     550KB page. */
  const back = FL.pal.opener;
  FL.pal.opener = null;
  if(back && document.contains(back) && back.focus) back.focus();
}

function flPalMove(d){
  const n = FL.pal.rows.length;
  if(!n) return;
  FL.pal.i = (FL.pal.i + d + n) % n;
  flPalPaint();
}

function flPalEnter(){
  const r = FL.pal.rows[FL.pal.i];
  if(!r) return;
  /* Remembered before the layer closes, so the empty query has something
     useful to show next time. Deduped by kind and id. */
  FL.pal.recent = [r].concat(FL.pal.recent.filter(x => !(x.kind === r.kind && x.id === r.id))).slice(0, 5);
  flPaletteClose();
  switch(r.kind){
    /* A store opens its drawer, with the store switched so the manager console
       is already pointed at it if the user goes there next. */
    case 'store':
      S.store = r.id;
      render();
      if(typeof deptDrawer === 'function') deptDrawer(r.id);
      return;
    case 'case':
      if(typeof caseDrawer === 'function') caseDrawer(r.id);
      return;
    case 'rpt':
      if(typeof reportDrawer === 'function') reportDrawer(r.id);
      return;
    /* A person opens their record. */
    case 'emp':
      if(typeof empDrawer === 'function') empDrawer(r.id);
      return;
    /* A module opens the player, which is the only thing a module code can
       usefully mean. */
    case 'course':
      S.module = r.id; S.mstep = 0; S.manswers = {};
      render();
      return;
    /* A task opens the record behind it. */
    case 'task':
      flOpenTask(typeof taskById === 'function' ? taskById(r.id) : null);
      return;
  }
}

/* Focus stays inside the dialog while it is open. Contract section 7. */
function flPalTrap(e){
  if(e.key !== 'Tab' || !FL.pal.open) return;
  const p = document.getElementById('palette');
  if(!p) return;
  const f = p.querySelectorAll('input, button:not([disabled])');
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

/* ---------- paint ---------------------------------------------------------- */

/* Called after every render(), never during it. Rebuilds the rail, the action
   bar and the FAB, which are the three that depend on persona, language and
   selection. The toast stack and the palette are left alone on purpose: they
   hold live state a repaint would destroy. */
function floatPaint(){
  if(!FL.ready) return;
  _flTasks = null;
  flRoute();

  const rail = document.getElementById('botrail');
  if(rail){
    rail.setAttribute('aria-label', tx(FL_TXT.nav));
    rail.innerHTML = flRailHTML();
  }

  const sel = flSelection();
  const bar = document.getElementById('actionbar');
  if(bar){
    bar.setAttribute('aria-label', tx(FL_TXT.selActions));
    if(sel){
      bar.hidden = false;
      bar.innerHTML = flBarHTML(sel);
      document.body.classList.add('fl-sel');
    } else {
      bar.hidden = true;
      bar.innerHTML = '';
      document.body.classList.remove('fl-sel');
    }
  }
  const n = sel ? sel.ids.length : 0;
  if(n !== FL.lastSel){
    if(FL.lastSel !== -1) flAnnounce(FL_N.selected(n));
    FL.lastSel = n;
  }

  const fab = document.getElementById('fab');
  if(fab){
    const f = flFab();
    /* No FAB while the module player owns the screen and no FAB under the
       action bar. Two primaries in the same corner is a coin toss, not a
       choice, and a primary action floating over a quiz is noise. */
    if(!f || sel || S.module){
      fab.hidden = true;
      fab.innerHTML = '';
      FL.fab = null;
    } else {
      FL.fab = f;
      fab.hidden = false;
      fab.setAttribute('aria-label', tx(f.lb));
      fab.setAttribute('title', tx(f.lb));
      fab.innerHTML = FL_ICON[f.icon] + '<span class="fl-lb">' + flTx(f.lb) + '</span>';
      fab.classList.toggle('gold', f.act === 'intake');
    }
  }

  const toasts = document.getElementById('toasts');
  if(toasts) toasts.setAttribute('aria-label', tx(FL_TXT.notifs));

  /* The palette is not rebuilt, but its chrome has to follow a language switch
     that happened while it was open. */
  if(FL.pal.open){
    const q = document.getElementById('palq');
    if(q){ q.placeholder = tx(FL_TXT.palHold); q.setAttribute('aria-label', tx(FL_TXT.palHold)); }
    const foot = document.getElementById('palfoot');
    if(foot) foot.innerHTML = '<span>' + flTx(FL_TXT.palHint) + '</span>';
    flPalSearch(q ? q.value : '');
  }

  _flTasks = null;
}

/* ---------- wiring --------------------------------------------------------- */

/* Every selector below is qualified to a tag. An unqualified closest on the
   bare data-persona attribute matched <html> on this project once and swallowed
   every toggle click, because <html> carries data-persona and <body> carries
   data-view. Contract section 3. */
function flWire(){
  document.addEventListener('click', e => {
    if(!e.target || !e.target.closest) return;
    let el;

    /* Rail. data-go is the contract's nav attribute, so the chrome layer may
       also handle it. Applying the same patch twice is idempotent; the guard
       below stops the second one from costing a second render inside the same
       gesture. */
    if(el = e.target.closest('button[data-go]')){
      if(e.defaultPrevented) return;
      const raw = el.dataset.go;
      const now = Date.now();
      if(FL.lastGo.s === raw && now - FL.lastGo.t < 150) return;
      FL.lastGo = {s:raw, t:now};
      let patch = null;
      try{ patch = JSON.parse(raw); }catch(err){ patch = null; }
      if(!patch) return;
      e.preventDefault();
      if(patch.rail){
        const item = flRailItems().filter(x => x.k === patch.rail)[0];
        if(item) flNavTo(item);
      } else {
        flGo(patch);
      }
      return;
    }

    if(el = e.target.closest('button[data-flact]')){ flBarAct(el.dataset.flact); return; }
    if(el = e.target.closest('button[data-flt]')){
      const host = el.closest('div[data-fltoast]');
      if(!host) return;
      if(el.dataset.flt === 'undo') flToastUndo(host.dataset.fltoast);
      else flToastClose(host.dataset.fltoast);
      return;
    }
    if(e.target.closest('button#fab')){ flFabAct(FL.fab); return; }
    if(el = e.target.closest('button[data-palette]')){ flPaletteOpen(el); return; }
    if(e.target.closest('div[data-palclose]')){ flPaletteClose(); return; }
    if(el = e.target.closest('button[data-palgo]')){
      FL.pal.i = +el.dataset.palgo;
      flPalEnter();
      return;
    }

    /* Task CTAs. Handled here only when no inbox layer is mounted, and the
       state guard inside flTaskCta means that even if both layers see the
       click, the second one finds the task already closed and does nothing. */
    if(el = e.target.closest('button[data-task]')){
      if(document.getElementById('inbox')) return;
      flTaskCta(el.dataset.task);
      return;
    }
    if(el = e.target.closest('button[data-taskread]')){
      if(document.getElementById('inbox')) return;
      if(typeof taskRead === 'function') taskRead(el.dataset.taskread, S.persona);
      render();
      return;
    }
  });

  /* Escape is layered and the palette takes it first, so this listener is on
     the capture phase and stops propagation at the innermost open layer, the
     way the map overlay's drawer already does. Without capture the app's own
     bubble listener closes the incident drawer underneath an open palette. */
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && FL.pal.open){
      e.stopPropagation();
      e.preventDefault();
      flPaletteClose();
    }
  }, true);

  document.addEventListener('keydown', e => {
    const k = e.key;
    if((e.metaKey || e.ctrlKey) && (k === 'k' || k === 'K')){
      e.preventDefault();
      if(FL.pal.open) flPaletteClose(); else flPaletteOpen(document.activeElement);
      return;
    }
    if(!FL.pal.open) return;
    if(k === 'ArrowDown'){ e.preventDefault(); flPalMove(1); return; }
    if(k === 'ArrowUp'){ e.preventDefault(); flPalMove(-1); return; }
    if(k === 'Enter'){ e.preventDefault(); flPalEnter(); return; }
    if(k === 'Home'){ e.preventDefault(); FL.pal.i = 0; flPalPaint(); return; }
    if(k === 'End'){ e.preventDefault(); FL.pal.i = Math.max(0, FL.pal.rows.length - 1); flPalPaint(); return; }
    flPalTrap(e);
  });

  document.addEventListener('input', e => {
    if(e.target && e.target.id === 'palq') flPalSearch(e.target.value);
  });

  /* The chrome layer fires this from the top bar search control. */
  document.addEventListener('palette:open', e => {
    flPaletteOpen(e && e.detail && e.detail.opener);
  });
  window.addEventListener('palette:open', e => {
    flPaletteOpen(e && e.detail && e.detail.opener);
  });

  /* Any layer that closes a task can announce it this way instead of importing
     anything from this file. */
  document.addEventListener('task:done', e => {
    const d = (e && e.detail) || {};
    if(!d.id) return;
    const task = (typeof taskById === 'function') ? taskById(d.id) : null;
    const label = task && task.subject && task.subject.label ? task.subject.label : d.id;
    flToast(FL_N.doneAll(label), {
      kind:'ok',
      undo: d.token ? function(){ return taskUndo(d.token); } : null
    });
  });
}

/* ---------- mount ---------------------------------------------------------- */

function floatMount(){
  if(FL.ready) return;
  if(typeof FLOAT_MARKUP === 'undefined') return;
  if(!document.getElementById('botrail')){
    const holder = document.createElement('div');
    holder.innerHTML = FLOAT_MARKUP;
    /* Moved out of the holder so every layer is a direct child of <body>. A
       wrapper with no transform and no z-index would not create a stacking
       context today, but somebody adding one later would silently break the
       whole z scale, so there is no wrapper to add it to. */
    while(holder.firstElementChild) document.body.appendChild(holder.firstElementChild);
  }
  document.body.classList.add('fl-on');

  /* render() is wrapped, not called from every handler. Anything in the app
     that repaints, including the 60 second clock tick, repaints the floating
     layers with it, and no future call site has to remember. */
  if(typeof render === 'function' && !render._fl){
    const inner = render;
    const wrapped = function(){
      const out = inner.apply(this, arguments);
      try{ floatPaint(); }catch(err){}
      return out;
    };
    wrapped._fl = true;
    window.render = wrapped;
  }

  /* The old singleton toast is routed into the stack so there is one place
     confirmations appear and one live region announcing them. Set
     FL.adoptLegacyToast to false before mount to leave the old one alone. */
  if(FL.adoptLegacyToast !== false && typeof toast === 'function' && !toast._fl){
    const wrapped = function(msg){
      /* The legacy call site passes one already localised string, so both
         halves of the pair are that string. It is not a translation gap; it is
         a caller that resolved the language before calling. */
      flToast({en:String(msg), zh:String(msg)}, {kind:'ok'});
    };
    wrapped._fl = true;
    window.toast = wrapped;
  }

  /* The app's own announce() built a second live region, #livereg. Two polite
     regions on one page is two things a screen reader has to keep track of and
     one of them will be stale. Routed into #live, which contract section 7
     names as the one region, and #livereg is then never created. */
  if(typeof announce === 'function' && !announce._fl){
    const wrapped = function(msg){ flAnnounce(String(msg)); };
    wrapped._fl = true;
    window.announce = wrapped;
  }

  flWrapTasks();
  flWire();
  FL.ready = true;
  flAnnounce({en:'', zh:''});
  floatPaint();
}

/* ---------- self test ------------------------------------------------------
   Returned, not logged, so a gate can fail on it. Nothing here mutates data
   that survives the call. */
function floatSelfTest(){
  const R = {};
  R.mounted = {pass: !!(document.getElementById('botrail') && document.getElementById('fab') &&
                        document.getElementById('toasts') && document.getElementById('palette') &&
                        document.getElementById('actionbar'))};
  R.live = {pass: !!document.getElementById('live')};

  /* Every rail destination in every persona has a label. */
  let missing = 0, items = 0;
  TASK_PERSONAS.forEach(p => {
    (FL_NAV[p] || []).forEach(it => {
      items++;
      const lb = FL_SURFACE[it.k];
      if(!lb || !lb.en) missing++;
    });
  });
  R.labelled = {pass: missing === 0, items: items, missing: missing};

  /* The rail hides the manager console's nav and never itself. */
  const railEl = document.getElementById('botrail');
  R.railNotSelfHiding = {pass: !!railEl && !railEl.classList.contains('bottomnav')};

  /* A department code and its name both reach the same department. */
  const byCode = flPalRows('table').filter(r => r.kind === 'store' && r.id === 'TABLE').length;
  const byName = flPalRows(deptName('TABLE').toLowerCase()).filter(r => r.kind === 'store' && r.id === 'TABLE').length;
  R.paletteDepts = {pass: byCode === 1 && byName === 1, byCode: byCode, byName: byName};

  /* The employee result set is capped, whatever the query matches. */
  const many = flPalRows('a').filter(r => r.kind === 'emp').length;
  R.empCapped = {pass: many <= FL_CAP.emp, returned: many, cap: FL_CAP.emp};

  /* An empty query is never an empty box. */
  R.emptyQuery = {pass: flPalRows('').length > 0, rows: flPalRows('').length};

  R.ok = Object.keys(R).every(k => k === 'ok' || R[k].pass !== false);
  return R;
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', floatMount);
else floatMount();
/* ==== end shell parts ==== */
</script>
