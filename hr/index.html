    justify-content:center;
  }
}

/* Windows high contrast and forced colours.
   A forced colours mode repaints stroke and fill to the system colours,
   and it does that correctly here because every mark inherits
   currentColor and nothing carries a literal. The one thing that breaks
   is the knocked out interior of clockout, attention and the 99 mark:
   fill-rule evenodd holes stay transparent, and transparent in forced
   colours mode is the system background, which is what we want. So the
   only rule needed is to stop the browser deciding these are decorative
   images and flattening them. */
@media (forced-colors:active){
  .ic{forced-color-adjust:auto}
  .ic-brand.ic-b99,.ic-brand.ic-b168{color:CanvasText}
}

/* Print. The clock pair is the reason this block exists. An incident
   record printed for a claim file has to keep the difference between a
   clock that is running and a clock that has run out, and a colour
   printer is not guaranteed. The pair is already tonal rather than
   chromatic, so all that is needed is to stop a print stylesheet
   lightening it. */
@media print{
  .ic{color:CanvasText}
  .ic-brand.ic-b99,.ic-brand.ic-b168{color:CanvasText}
}

/* No transition, no transform beside the two brand marks above, and no
   animation anywhere in this file. docs/06 section 9 records that the
   app has exactly two animations, the readiness bar and the drawer
   slide, and both are suppressed under prefers-reduced-motion. An icon
   family is not the place to add a third. */

/* ---- console-hq ---- */
/* ==========================================================================
   HQ AND HR CONSOLE, rail styles
   Owned by the hq console agent. Scoped to nav#railnav[data-console="hq"] and
   to #shell[data-hqrail="on"], both of which the JS sets and clears per
   persona, so nothing here can reach the legal, store or learner console.

   Tokens only, no raw hex. Brand colour says whose store this is, status
   colour says how urgent this is, and neither appears on a navigation row
   except through the count badge the chrome layer already owns.

   THE SIZE, and every number in it was measured in the live document at
   1440x900 with the shipped Noto Sans, not estimated.

     Reference, docs/inspo/14-source-teardown.md section 1: 196px wide,
     12px labels, 5px row padding, 13.5px icons, a 2px accent bar.
     Shipped Readiness rail: 260px wide, 13.5px labels, 44px rows.

     Longest label at 12px/600, English:  "Course catalog"   101.0px
     Longest label at 12px/600, Chinese:  "任務收件匣"        60.0px
     Longest sub tab at 11.5px/600, en:   "Past a deadline"   99.9px
     Longest sub tab at 11.5px/600, zh:   "今天到期"          48.0px

     Chinese is 5 characters against 14 and reads shorter, but each character
     is a full 12px em against 7.2px average for a Latin one, so the per
     character ratio runs 1.67 the other way. Checked both: English drives the
     width on every single row of this console, and Chinese has 41px of slack
     on the widest one.

     Widest row, adding up: 8 rail padding + 8 row padding + 16 icon + 8 gap
     + 101 label + 8 gap + 18 badge + 8 row padding + 8 rail padding = 183px.
     Set to 200px, so 17px of slack. The four pixels over the reference's 196
     are the count badge, which the reference does not carry: 405 has no
     numbers in its sidebar and this rail's whole argument is that it says
     where the work is.

     Rows land at 26px against the shipped 44px, which is 18px back per row
     and 108px back over six rows. Under pointer:coarse they go back to 44px,
     because the working agreement's 44px rule is about fingers and a mouse
     is not a finger. Both are declared below.
   ========================================================================== */

/* ---------- width ---------------------------------------------------------

   Written inside the min-width query on purpose. design-chrome.css.part
   restores the icon collapse below 1120px with #shell[data-rail], specificity
   (1,1,0), and this file is merged after it, so an unqualified (1,1,0) rule
   here would win inside that query and re-inflate the collapsed rail to
   200px. Disjoint media queries cannot collide, which is cheaper than an
   arms race over specificity. */
@media(min-width:1121px){
  #shell[data-hqrail="on"][data-rail="open"]{--rail-w:200px}
}

#railnav[data-console="hq"]{padding:var(--s3) var(--s2) var(--s5)}

/* The console name. 405 does not print one; ours does, because this app has
   four consoles and the top bar switch is 56px above with a lot of chrome in
   between. */
#railnav[data-console="hq"] .nv-rhead{
  font-size:10.5px;letter-spacing:.1em;padding:0 var(--s2) var(--s2)}

/* ---------- groups -------------------------------------------------------- */

#railnav[data-console="hq"] .hq-grp{margin-bottom:var(--s3)}
#railnav[data-console="hq"] .hq-grp:last-of-type{margin-bottom:0}

/* The eyebrow. 10.5px against the 12px row, so it reads as a label on the
   group rather than as a seventh destination. Uppercase and tracked in Latin,
   neither in Chinese: uppercase does nothing to Han characters and letter
   spacing pulls a compound apart. */
#railnav[data-console="hq"] .hq-eyebrow{
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-muted);padding:var(--s2) var(--s2) var(--s1);margin:0}
[data-lang="zh"] #railnav[data-console="hq"] .hq-eyebrow{
  text-transform:none;letter-spacing:.02em}

/* ---------- rows ---------------------------------------------------------- */

/* min-height is set to 0 first because chrome.css.part declares 44px at
   (1,0,1) and a shorthand cannot unset it. */
#railnav[data-console="hq"] .nv-ritem{
  min-height:0;padding:5px var(--s2);gap:var(--s2);
  font-size:12px;font-weight:600;border-radius:7px;position:relative}
#railnav[data-console="hq"] .nv-ritem svg{width:16px;height:16px}

/* The active row. A 2px bar bleeding off the left edge of the rail, which is
   the reference's own treatment, drawn as ::before because design-chrome
   already sets box-shadow:none on this selector and two files fighting over
   one property is how a rule stops applying without anybody noticing.
   left:-8px cancels the rail's own 8px padding so the bar sits on the edge. */
#railnav[data-console="hq"] .nv-ritem[aria-current="page"]::before{
  content:"";position:absolute;left:calc(var(--s2) * -1);top:3px;bottom:3px;
  width:2px;border-radius:0 2px 2px 0;background:var(--brand-jade)}

/* The badge shrinks with the row. 20px tall beside a 12px label reads as the
   loudest thing in the rail, and it is a count, not a deadline. */
#railnav[data-console="hq"] .nv-b{
  font-size:10.5px;min-width:18px;height:16px;padding:0 5px}

/* ---------- sub tabs ------------------------------------------------------

   Indented under the active row, and only under the active row. A rail that
   showed every sub tab of every item at once would be eleven rows of which
   five are unreachable from where the user is standing. */
#railnav[data-console="hq"] .hq-subs{
  display:flex;flex-direction:column;gap:1px;
  margin:2px 0 var(--s2) 0;padding-left:var(--s5);position:relative}
/* One hairline running the length of the set, at the indent, so the group
   reads as belonging to the row above it without a box around it. */
#railnav[data-console="hq"] .hq-subs::before{
  content:"";position:absolute;left:18px;top:2px;bottom:2px;
  width:1px;background:var(--rule)}

#railnav[data-console="hq"] .hq-sub,
#hqsubs .hq-sub{
  display:flex;align-items:center;gap:6px;width:100%;text-align:left;
  min-height:0;padding:4px var(--s2);border-radius:6px;
  font-size:11.5px;font-weight:600;color:var(--ink-muted)}
#railnav[data-console="hq"] .hq-sub:hover,
#hqsubs .hq-sub:hover{background:var(--action-soft);color:var(--ink)}
#railnav[data-console="hq"] .hq-sub[aria-current="true"],
#hqsubs .hq-sub[aria-current="true"]{
  color:var(--brand-jade-deep);background:var(--action-soft)}
#railnav[data-console="hq"] .hq-sl,
#hqsubs .hq-sl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The step number on the campaign tabs. It is part of the label in the body
   copy ("1 Target"), so it is part of the label here, held in its own span
   only so it can be dimmed. */
#railnav[data-console="hq"] .hq-sn,
#hqsubs .hq-sn{font-size:10px;color:var(--ink-muted);flex:none;opacity:.8}
#railnav[data-console="hq"] .hq-sc,
#hqsubs .hq-sc{font-size:10px;color:var(--ink-muted);flex:none;
  font-variant-numeric:tabular-nums}
#railnav[data-console="hq"] .hq-sub[aria-current="true"] .hq-sn,
#railnav[data-console="hq"] .hq-sub[aria-current="true"] .hq-sc,
#hqsubs .hq-sub[aria-current="true"] .hq-sn,
#hqsubs .hq-sub[aria-current="true"] .hq-sc{color:var(--brand-jade-deep)}

/* ---------- the collapse toggle ------------------------------------------- */

#railnav[data-console="hq"] .nv-rtog{
  min-height:0;padding:6px var(--s2);margin-top:var(--s4);font-size:11px}

/* ---------- icon mode -----------------------------------------------------

   At 64px there is no room for an eyebrow or a sub tab, so both go and the
   groups keep their identity as a hairline between icon runs. The rows
   return to 44px here because at 64px wide the icon is the entire target and
   a 26px one is a 26px target. */
#shell[data-rail="icons"] #railnav[data-console="hq"] .hq-eyebrow,
#shell[data-rail="icons"] #railnav[data-console="hq"] .hq-subs{display:none}
#shell[data-rail="icons"] #railnav[data-console="hq"] .nv-ritem{
  min-height:44px;padding-left:0;padding-right:0}
#shell[data-rail="icons"] #railnav[data-console="hq"] .nv-ritem[aria-current="page"]::before{
  left:0;border-radius:0 2px 2px 0}
#shell[data-rail="icons"] #railnav[data-console="hq"] .hq-grp{
  margin-bottom:0;padding-bottom:var(--s2);border-bottom:1px solid var(--rule)}
#shell[data-rail="icons"] #railnav[data-console="hq"] .hq-grp:last-of-type{
  border-bottom:0;padding-bottom:0}

@media(max-width:1120px){
  #railnav[data-console="hq"] .hq-eyebrow,
  #railnav[data-console="hq"] .hq-subs{display:none}
  #railnav[data-console="hq"] .nv-ritem{min-height:44px;padding-left:0;padding-right:0}
  #railnav[data-console="hq"] .nv-ritem[aria-current="page"]::before{left:0}
  #railnav[data-console="hq"] .hq-grp{
    margin-bottom:0;padding-bottom:var(--s2);border-bottom:1px solid var(--rule)}
  #railnav[data-console="hq"] .hq-grp:last-of-type{border-bottom:0;padding-bottom:0}
}

/* ---------- one control, one place ----------------------------------------

   The audit: nav#subnav on this console renders the same five buttons as the
   rail, with the same data-tab, the same data-go JSON and the same handler.
   Ten controls doing five things. While the rail is showing labels the rail
   is the nav, so the bar goes, and the sub tab row that would duplicate the
   rail's sub tabs goes with it. The campaign's own in page step tablist goes
   too, for the same reason: those five buttons are now in the rail.

   Below 1121px, or with the rail manually collapsed, none of that is true.
   The rail is a 64px icon strip or absent, the bar is the navigation again,
   and #hqsubs under it is the only home the sub tabs have. The two states are
   disjoint, so at no width does one control appear twice. */
#hqsubs{display:flex;gap:var(--s1);align-items:center;flex-wrap:nowrap;
  overflow-x:auto;scrollbar-width:none;
  padding:5px var(--s4);border-top:1px solid var(--rule);background:var(--paper)}
#hqsubs::-webkit-scrollbar{display:none}
#hqsubs .hq-sub{width:auto;flex:none;padding:6px 10px;min-height:32px}
#hqsubs .hq-sl{overflow:visible;white-space:nowrap}

@media(min-width:1121px){
  #shell[data-hqrail="on"][data-rail="open"] nav#subnav,
  #shell[data-hqrail="on"][data-rail="open"] div#hqsubs{display:none}
}

/* The campaign's own step tablist, at every width, because its five buttons
   are now the campaign row's sub tabs and one of the two homes above is
   always showing. Leaving it visible below 1121px would put the identical
   five controls twice on one screen, 40px apart, which is the failure this
   whole pass is about. The JS renames the panel it labelled, so nothing is
   left pointing at a control that is no longer on screen. */
#shell[data-hqrail="on"] div.camp div.tabs.cimt{display:none}

/* ---------- the queue table ----------------------------------------------- */

/* The empty state for a filter that currently matches nothing. Neutral, not
   status coloured: an empty filter is not an alarm. */
#shell td.hq-qempty{padding:var(--s5) var(--s3);text-align:center;
  color:var(--ink-muted);font-size:12.5px}

/* ---------- touch ---------------------------------------------------------

   House rule, 44px targets under a coarse pointer. 26px rows are a mouse
   affordance and this restores the finger one wherever the input is touch,
   independent of width, which is the correct axis for it: a 1280px tablet has
   fingers and a 1000px laptop window does not. */
@media(pointer:coarse){
  #railnav[data-console="hq"] .nv-ritem{min-height:44px}
  #railnav[data-console="hq"] .hq-sub,
  #hqsubs .hq-sub{min-height:44px}
  #railnav[data-console="hq"] .nv-rtog{min-height:44px}
}

/* ---- console-legal ---- */
/* ==========================================================================
   THE LEGAL COUNSEL CONSOLE, styles
   app/parts/console-legal.css.part. Owned by the legal console agent.

   Everything here is scoped to #shell[data-console="cc"], which
   console-legal.js.part sets on the shell element and removes on every other
   persona. Nothing in this file can reach the HQ console, the store console or
   the employee console, which is what lets two agents restructure two rails in
   one stylesheet at the same time.

   The hook is on #shell and not on <html>. <html> carrying data-persona is
   exactly what made the shipped delegated handler match the document root and
   swallow every click, recorded in docs/inspo/11-shell-contract.md section 3.

   WHY THIS CONSOLE LOOKS DIFFERENT FROM THE HQ ONE, stated as measurements
   rather than as taste. The client asked for separate dashboards for separate
   people, so the two should not be the same dashboard in two colours.

     rail width        260px  ->  196px, the reference number verbatim
     rail row height    44px  ->   34px at a fine pointer, 44px kept under
                                   pointer:coarse, which is the working
                                   agreement floor and is not negotiable
     rail label       13.5px  ->   12px, weight 600 -> 500
     count badge      filled pill in --warn or --alert  ->  tabular monospace
                                   numerals in --ink-muted, no fill at all
     active marker    filled row  ->  2px accent bar bleeding off the left edge
                                   plus --action-soft, the reference treatment
     group labels     none  ->  four eyebrows, 11px 600 0.09em
     surface title    --sans  ->  --serif at the same 17px 600

   Six structural changes and one family swap. The reference sidebar in
   docs/inspo/14-source-teardown.md section 1 is 196px with 12px labels and 5px
   row padding. This is that number, unmodified, carrying nine destinations
   where the rail it replaces carried four in 260px. Every measurement behind
   it is in docs/inspo/24-legal-console-ia.md.

   No hex anywhere in this file. Tokens only, docs/06-design-system-tawa.md.
   ========================================================================== */

/* ---------- 1. the rail ---------------------------------------------------
   tune.css.part sets #shell{--rail-w:260px} at specificity (1,0,0). This is
   (1,1,0) and console-legal is last in CSS_ORDER, so it wins on both counts.

   196px is the reference number verbatim, docs/inspo/14-source-teardown.md
   section 1, and it was kept rather than padded because it was tested rather
   than assumed. At 196px the label column resolves to 109px after the 16px
   icon, the 8px gutter, the 24px of row padding and the count column, and
   every one of the nine labels clears it in both languages with each of the
   nine in turn the active row: scrollWidth === clientWidth, 18 measurements,
   zero ellipsis. 216px and 206px were measured too and buy nothing. So this
   console offers nine destinations in 64px less rail than the four it
   replaces had.                                                             */
#shell[data-console="cc"]{--rail-w:196px}

#shell[data-console="cc"] nav#railnav{padding:var(--s3) var(--s2) var(--s6)}

/* The console name sits above four group labels that are drawn in the same
   11px uppercase eyebrow, so at 11px 600 --ink-muted it read as a fifth group
   with nothing in it. It is the parent of the four, so it takes the ink and
   the weight and they keep the muted grey. */
#shell[data-console="cc"] nav#railnav .nv-rhead{
  font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink);
  padding-bottom:var(--s3);
}

/* The group label. A label, not a link. Uppercase does nothing in Chinese, so
   under [data-lang="zh"] the emphasis moves from case to weight, which is the
   rule docs/06 section 6 already states for every eyebrow in the product. */
#shell[data-console="cc"] nav#railnav .lg-grp{
  font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);padding:var(--s2) var(--s3) var(--s1);
}
[data-lang="zh"] #shell[data-console="cc"] nav#railnav .lg-grp{
  text-transform:none;letter-spacing:.02em;font-weight:700;
}
/* 20px between one group and the next, 0 inside a group. The gap is the only
   thing that says these four rows belong together, so it has to be bigger than
   any gap inside the group and there is no gap inside the group. */
#shell[data-console="cc"] nav#railnav .lg-sec + .lg-sec{margin-top:var(--s5)}

/* The row. 34px at a fine pointer against the shipped 44px, which is where the
   nine destinations come from: nine 44px rows plus four labels plus the head
   and the toggle would be 574px of an 911px column, and this console needs the
   column to still look like navigation rather than like a list. */
#shell[data-console="cc"] nav#railnav .nv-ritem{
  position:relative;min-height:34px;gap:var(--s2);
  padding:5px var(--s3) 5px 11px;border-radius:0 9px 9px 0;
  font-size:12px;font-weight:500;letter-spacing:0;
}
#shell[data-console="cc"] nav#railnav .nv-ritem svg{width:16px;height:16px}

/* The active marker. A 2px bar bleeding off the left edge of the rail, which
   is the reference treatment, plus the soft action fill. The bar is drawn with
   a pseudo element rather than a border so it does not move the label by 2px
   when it appears and by 2px back when it goes, and it is pulled out by the
   rail's own 8px side padding so it lands on the rail edge rather than 8px
   inside it.

   The active row does NOT gain weight, and that is a measured decision rather
   than a preference. The first version bumped the active label to 600, and at
   that weight "Statutory deadlines" rendered 132px wide in the 129px label
   column the rail had at the time and ellipsised the moment it became the
   current item. That is the truncation regression
   docs/inspo/12-design-critique.md part 1 item 2 records as held, coming back
   on the one row a reader is looking at. Fill, ink and a 2px bar say "you are
   here" without changing the metrics of the thing they are marking, which is
   also what let the rail come down to the reference 196px afterwards. */
#shell[data-console="cc"] nav#railnav .nv-ritem[aria-current="page"]{
  background:var(--action-soft);color:var(--brand-jade-deep);
}
#shell[data-console="cc"] nav#railnav .nv-ritem[aria-current="page"]::before{
  content:"";position:absolute;left:calc(-1 * var(--s2));top:0;bottom:0;width:2px;
  background:var(--action);
}
#shell[data-console="cc"] nav#railnav .nv-ritem:hover{background:var(--action-soft)}

/* The count. docs/inspo/12-design-critique.md V4: the legal rail was printing
   its counts as solid --warn and --alert, the two colours a statutory clock
   uses to say a legal window is closing. A count is arithmetic, so it gets no
   status colour and no fill on this console. Zero is absent and stays in the
   accessible name, per the amendment in doc 11 section 10. */
#shell[data-console="cc"] nav#railnav .lg-n,
#shell[data-console="cc"] nav#subnav .lg-n{
  flex:none;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:11px;font-weight:600;color:var(--ink-muted);
  margin-left:var(--s2);background:none;padding:0;min-width:0;
}
#shell[data-console="cc"] nav#railnav .nv-ritem[aria-current="page"] .lg-n{
  color:var(--brand-jade-deep);
}

#shell[data-console="cc"] nav#railnav .nv-rtog{
  margin-top:var(--s5);font-size:11px;font-weight:500;
}

/* Collapsed to icons, and below 1120px where the chrome layer collapses it for
   us. The group labels go with the text labels, because a 64px column cannot
   carry an eyebrow, and the four groups then read as four gaps, which is still
   the grouping and costs nothing. */
#shell[data-console="cc"][data-rail="icons"] nav#railnav .lg-grp,
#shell[data-console="cc"][data-rail="icons"] nav#railnav .lg-n{display:none}
#shell[data-console="cc"][data-rail="icons"] nav#railnav .nv-ritem{
  justify-content:center;padding-left:0;padding-right:0;border-radius:9px;
}
#shell[data-console="cc"][data-rail="icons"] nav#railnav .nv-ritem[aria-current="page"]::before{
  display:none;
}
@media (max-width:1120px){
  #shell[data-console="cc"] nav#railnav .lg-grp,
  #shell[data-console="cc"] nav#railnav .lg-n{display:none}
  #shell[data-console="cc"] nav#railnav .nv-ritem{
    justify-content:center;padding-left:0;padding-right:0;border-radius:9px;
  }
  #shell[data-console="cc"] nav#railnav .nv-ritem[aria-current="page"]::before{display:none}
}

/* The working agreement floors a touch target at 44px and a store manager taps
   this with cold hands in a walk in cooler. A 34px row is a mouse row, so it
   only exists where there is a mouse. */
@media (pointer:coarse){
  #shell[data-console="cc"] nav#railnav .nv-ritem{min-height:44px;padding:var(--s2) var(--s3)}
  #shell[data-console="cc"] nav#railnav .nv-rtog{min-height:44px}
  #shell[data-console="cc"] .lg-act .btn{min-height:44px}
}

/* ---------- 2. the sub nav, the second level ------------------------------
   The rail carries every destination and the groups. The sub nav carries the
   siblings of wherever you are, which is the client's "sub tab of a main tab
   for the left column" and is also the fix for the defect at
   docs/inspo/12-design-critique.md R8b, where the HQ sub nav was 872px of
   content in a 390px box with three of five tabs off screen. Nine tabs would
   have been worse than five. Three cannot overflow.                          */
#shell[data-console="cc"] nav#subnav .lg-subeye{
  flex:none;align-self:center;
  font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);padding-right:var(--s3);margin-right:var(--s1);
  border-right:1px solid var(--rule);
}
[data-lang="zh"] #shell[data-console="cc"] nav#subnav .lg-subeye{
  text-transform:none;letter-spacing:.02em;font-weight:700;
}
@media (max-width:640px){
  /* The eyebrow is the group name and the rail is gone at this width, so it is
     the only thing telling a reader which group these three tabs belong to.
     It stays, and the border goes, because a vertical rule beside a bar that
     scrolls reads as the edge of the bar. */
  #shell[data-console="cc"] nav#subnav .lg-subeye{border-right:0;padding-right:var(--s2)}

  /* MEASURED at 390px: the Casework group is 542px of eyebrow plus three tabs
     in a 390px bar, so 152px is off screen. Scoping the bar to one group took
     it down from the 872px docs/inspo/12-design-critique.md R8b measured on
     the HQ console, and 542 is still more than 390.
     R8b's actual complaint is not the overflow, it is that overflow-x:auto
     with no fade, no arrow, no shadow and no partial tab peeking is the same
     bug as overflow:hidden plus a workaround only a developer knows about. So
     this is the affordance. It is a sticky last flex item, which rides the
     right edge of the scroller instead of scrolling away with the content, and
     it fades to the bar's own --paper, so it is invisible until something is
     actually underneath it. Its 32px box is cancelled by an equal negative
     margin, so it takes no room from the tabs. */
  #shell[data-console="cc"] nav#subnav::after{
    content:"";flex:0 0 var(--s6);align-self:stretch;
    position:sticky;right:0;margin-left:calc(-1 * var(--s6));
    pointer-events:none;
    background:linear-gradient(to right, transparent, var(--paper));
  }
}

/* ---------- 3. the surface ------------------------------------------------
   One family swap, and it is the only one. Noto Serif TC is already loaded by
   this build at 600 and 700 for the display numbers, so the serif costs no new
   font request. It is used on the surface title and nowhere else: a serif body
   at 13.5px in a table of statutory deadlines would be harder to read, and the
   point is a quieter document voice, not a book.                             */
#shell[data-console="cc"] .lg-head{margin-bottom:var(--s4)}
#shell[data-console="cc"] .lg-head h2{
  font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.25;
  color:var(--ink);
}
#shell[data-console="cc"] .lg-blurb{
  max-width:78ch;margin-top:var(--s2);
  font-size:13.5px;line-height:1.55;color:var(--ink-muted);
}
#shell[data-console="cc"] .lg-sub{margin:var(--s5) 0 var(--s3)}
#shell[data-console="cc"] .lg-sub h3{
  font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink);
}
#shell[data-console="cc"] .lg-hint{
  max-width:78ch;margin-top:var(--s3);color:var(--ink-muted);
}
#shell[data-console="cc"] .lg-note{max-width:78ch;margin-bottom:var(--s4)}
#shell[data-console="cc"] .lg-card{padding:var(--s4)}
#shell[data-console="cc"] .lg-bar{margin-bottom:var(--s4)}

/* The matter identifier. Monospace because it is an identifier and every
   identifier in this product is monospace, and on its own line because in a
   table of twenty two rows the eye scans the code column vertically. */
#shell[data-console="cc"] .lg-id{
  display:block;font-size:11.5px;font-weight:600;color:var(--ink-muted);
  margin-top:2px;
}

/* The store cell, and the reason there is no banner chip on this console.
   docs/inspo/12-design-critique.md V1 measured the banner chip and the status
   chip at backgrounds 3 of 255 apart, in adjacent columns of the same row, 52
   times on this console alone. docs/06 section 4 already reserves the 4px full
   height edge bar for exactly this job: it identifies the store without
   competing for the eye, because it is four pixels wide and carries no text.
   --r99-deep and --m168 rather than the saturated icon values, because the bar
   sits on --card and on --paper and the deep pair clears the 3:1 graphic floor
   on both. */
#shell[data-console="cc"] .lg-store{
  display:block;position:relative;padding-left:var(--s3);
  --lg-edge:var(--neutral);
}
#shell[data-console="cc"] .lg-store[data-b="99"]{--lg-edge:var(--r99-deep)}
#shell[data-console="cc"] .lg-store[data-b="168"]{--lg-edge:var(--m168)}
#shell[data-console="cc"] .lg-store::before{
  content:"";position:absolute;left:0;top:1px;bottom:1px;width:4px;border-radius:2px;
  background:var(--lg-edge);
}
#shell[data-console="cc"] .lg-store b{display:block;font-weight:600}
/* nowrap because "Milpitas, CA" broke after the comma in the 108px the matter
   column gets on the holds table, and a city split across two lines under a
   store code reads as two facts. The column is allowed to take the width it
   needs instead. */
#shell[data-console="cc"] .lg-store .sub{display:block;font-size:11.5px;white-space:nowrap}

#shell[data-console="cc"] .lg-tbl th[scope="row"]{font-weight:400}
#shell[data-console="cc"] .lg-act{white-space:nowrap}
#shell[data-console="cc"] .lg-act .btn + .btn{margin-left:var(--s2)}

/* ---------- 4. the privilege log ------------------------------------------
   Reuses the shipped .note.priv pair rather than introducing a fifth
   privileged dark. docs/06 section 1 lists that literal as a token gap and
   restyling it here would be a sixth agent computing a sixth value for the
   same colour, which is the mechanism the critique names in V1.              */
#shell[data-console="cc"] .lg-privlist{display:grid;gap:var(--s3)}
#shell[data-console="cc"] .lg-priv p{margin-top:var(--s2);line-height:1.55}
#shell[data-console="cc"] .lg-priv .lg-id{display:inline;margin:0}

/* ---------- 5. the worklog ------------------------------------------------
   A ledger, so it is an ordered list with the timestamp in its own column and
   the act in bold. No status colour: nothing here is urgent, it already
   happened.                                                                  */
#shell[data-console="cc"] .lg-wlist{
  list-style:none;display:grid;gap:0;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:var(--s2) var(--s4);
}
#shell[data-console="cc"] .lg-wl{
  display:flex;gap:var(--s4);align-items:baseline;
  padding:var(--s3) 0;border-bottom:1px solid var(--rule);
}
#shell[data-console="cc"] .lg-wl:last-child{border-bottom:0}
#shell[data-console="cc"] .lg-wt{
  flex:0 0 140px;font-size:11.5px;color:var(--ink-muted);
  font-variant-numeric:tabular-nums;
}
#shell[data-console="cc"] .lg-wb{flex:1;min-width:0;font-size:13.5px}
#shell[data-console="cc"] .lg-wx{
  display:block;margin-top:var(--s1);color:var(--ink-muted);line-height:1.55;
}
#shell[data-console="cc"] .lg-wl.priv{border-left:2px solid var(--brand-gold);padding-left:var(--s3)}
@media (max-width:640px){
  /* 140px of timestamp column beside 210px of text is a two column layout that
     has stopped being one. Stack. */
  #shell[data-console="cc"] .lg-wl{display:block}
  #shell[data-console="cc"] .lg-wt{display:block;margin-bottom:var(--s1)}
}

/* ---------- 6. quieting the surface --------------------------------------
   The HQ console opens on a KPI grid inside the surface as well as in the
   hero. On this console the hero carries the four numbers and the surface
   carries the work, so a second KPI row would be the same four numbers twice.
   Nothing renders one here; this rule is the guard for anything that later
   tries.                                                                     */
#shell[data-console="cc"] .lg-surf > .grid.g4{display:none}

/* ---- commerce ---- */
/* ==========================================================================
   COMMERCE HR OPERATIONS, the added modules.
   Every colour is a token. Every size is on the --fs scale and every gap is on
   the --s scale from the design system part. Status is never colour alone:
   every bar prints its value, every chip carries a word.
   ========================================================================== */

/* ---- section heads and demo tag ---------------------------------------- */
.cx-sh{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);margin:0 0 var(--s4);flex-wrap:wrap}
.cx-sh h2{margin:0}
.cx-sh .sub{max-width:80ch;margin-top:2px}
.chip.cx-demo{background:var(--action-soft);color:var(--brand-jade);border:1px solid color-mix(in srgb,var(--brand-jade) 30%,transparent);letter-spacing:.06em;font-size:var(--fs-micro)}
.chip.cx-trend{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- the today strip, call center ----------------------------------------- */
.cx-today{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-bottom:var(--s4)}
.cx-today .kpi .v{font-size:var(--fs-kpi)}
@media(max-width:900px){.cx-today{grid-template-columns:repeat(2,1fr)}}

/* ---- horizontal bar list ------------------------------------------------- */
.cx-bars{display:grid;gap:6px}
.cx-bar{display:grid;grid-template-columns:minmax(120px,32%) 1fr 76px;gap:var(--s3);align-items:center;font-size:var(--fs-meta)}
.cx-bar.on .cx-bl{font-weight:700}
.cx-bl{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-bt{height:10px;background:var(--rule);border-radius:var(--r-bar);overflow:hidden}
.cx-bt i{display:block;height:100%;border-radius:var(--r-bar);transition:width .5s ease}
.cx-bv{text-align:right;color:var(--ink)}
button.cx-bar{width:100%;text-align:left;padding:4px 6px;border-radius:var(--r-mark)}
button.cx-bar:hover{background:var(--action-soft)}

/* ---- charts --------------------------------------------------------------- */
.cx-chart{width:100%;position:relative}
.cx-chart table.vh{left:0;top:0;display:block;max-width:1px}
.cx-chart svg{display:block;width:100%}
.cx-chart circle{vector-effect:non-scaling-stroke}
.cx-ymax{display:flex;justify-content:space-between;font-size:var(--fs-micro);color:var(--ink-muted);margin-bottom:4px}
.cx-xl{display:flex;margin-top:6px}
.cx-xl span{flex:1;text-align:center;font-size:var(--fs-micro);color:var(--ink-muted);white-space:nowrap;overflow:hidden}
.cx-ax{font:500 11px var(--sans);fill:var(--ink-muted)}
.cx-axl{stroke:var(--rule);stroke-width:1}
.cx-legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:var(--fs-meta);color:var(--ink-muted);margin-top:6px}
.cx-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.cx-two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.cx-three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s4)}
@media(max-width:900px){.cx-two,.cx-three{grid-template-columns:1fr}}

/* ---- workflow chain --------------------------------------------------------- */
.cx-flow{list-style:none;display:flex;gap:0;flex-wrap:wrap;counter-reset:step;margin:0;padding:0}
.cx-step{position:relative;flex:1 1 104px;min-width:104px;padding:var(--s3) var(--s3) var(--s3) var(--s4);border:1px solid var(--rule);background:var(--card);margin-right:14px;margin-bottom:var(--s3);border-radius:var(--r-ctl);display:flex;flex-direction:column;gap:2px}
.cx-step::after{content:"";position:absolute;right:-9px;top:50%;width:14px;height:14px;transform:translateY(-50%) rotate(45deg);border-top:1px solid var(--rule);border-right:1px solid var(--rule);background:var(--card)}
.cx-step:last-child::after{display:none}
.cx-step.done{border-color:color-mix(in srgb,var(--ok) 50%,var(--rule))}
.cx-step.now{border-color:var(--brand-jade);box-shadow:inset 3px 0 0 var(--brand-jade)}
.cx-step.wait{border-style:dashed}
.cx-sn{font-size:var(--fs-micro);color:var(--ink-muted)}
.cx-st{font-weight:600;font-size:var(--fs-body)}
.cx-sd{font-size:var(--fs-meta);color:var(--ink-muted)}
.cx-flow.vert{flex-direction:column}
.cx-flow.vert .cx-step{margin-right:0}
.cx-flow.vert .cx-step::after{right:auto;left:22px;top:auto;bottom:-9px;transform:rotate(135deg)}
@media(max-width:640px){.cx-flow{flex-direction:column}.cx-step{margin-right:0}.cx-step::after{right:auto;left:22px;top:auto;bottom:-9px;transform:rotate(135deg)}}

/* ---- funnel ------------------------------------------------------------------- */
.cx-funnel{display:grid;gap:8px}
.cx-fs{display:grid;grid-template-columns:110px 1fr 56px 110px;gap:var(--s3);align-items:center;font-size:var(--fs-meta)}
.cx-ft{height:14px;background:var(--rule);border-radius:var(--r-bar);overflow:hidden}
.cx-ft i{display:block;height:100%;background:var(--action)}
.cx-fv{text-align:right}
@media(max-width:640px){.cx-fs{grid-template-columns:90px 1fr 48px}.cx-fp{display:none}}

/* ---- SQL and SOP ------------------------------------------------------------ */
.cx-sql{font-family:var(--mono);font-size:var(--fs-meta);line-height:1.55;background:#F1F0EA;border:1px solid var(--rule);border-radius:var(--r-ctl);padding:var(--s3) var(--s4);white-space:pre-wrap;word-break:break-word;color:var(--ink);margin:0 0 var(--s3)}
.cx-sql b{color:var(--brand-jade)}
.cx-sop{padding-left:22px;display:grid;gap:8px;font-size:var(--fs-body)}
.cx-sop li::marker{font-family:var(--mono);color:var(--ink-muted)}
.cx-sops{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s3)}
.cx-sopcard{text-align:left;display:flex;flex-direction:column;gap:6px;padding:var(--s4);border:1px solid var(--rule);background:var(--card);border-radius:var(--r-box);width:100%}
.cx-sopcard:hover{border-color:var(--rule-int);box-shadow:var(--el-1)}
.cx-sopcard .t{font-weight:600}
.cx-sopcard .m{font-size:var(--fs-meta);color:var(--ink-muted);display:flex;gap:var(--s3);flex-wrap:wrap}

/* ---- report builder ---------------------------------------------------------- */
.cx-rb{display:grid;grid-template-columns:280px 1fr;gap:var(--s4)}
.cx-rb .field{margin-bottom:var(--s3)}
.cx-rb .fl{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);margin-bottom:6px;display:block}
@media(max-width:900px){.cx-rb{grid-template-columns:1fr}}

/* ---- privacy control ---------------------------------------------------------- */
.cx-priv{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.cx-priv .card{padding:var(--s4)}
.cx-priv .lv{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.cx-priv .t{font-weight:700;font-size:var(--fs-lead);margin:4px 0}
@media(max-width:640px){.cx-priv{grid-template-columns:1fr}}

/* ---- executive summary ------------------------------------------------------- */
.cx-exec{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s3)}
.cx-exec .card{padding:var(--s4);display:flex;flex-direction:column;gap:6px}
.cx-exec .area{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.cx-exec .num{display:flex;align-items:baseline;gap:var(--s2);text-align:left}
.cx-exec .num b{font-size:var(--fs-h1);font-family:var(--mono)}
.cx-exec .say{font-size:var(--fs-meta);color:var(--ink-muted)}

/* ---- approach ------------------------------------------------------------------- */
.cx-approach{max-width:78ch}
.cx-approach p{margin:0 0 var(--s3);font-size:var(--fs-body)}
.cx-approach .cx-map{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)}
.cx-approach .cx-map div{padding:var(--s3) var(--s4);border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--card);font-size:var(--fs-meta)}
.cx-approach .cx-map b{display:block;font-size:var(--fs-body)}
@media(max-width:640px){.cx-approach .cx-map{grid-template-columns:1fr}}

/* ---- intake form (rep) ----------------------------------------------------- */
.cx-intake{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s4)}
.cx-intake>.card{min-width:0}
.cx-intake .list{max-height:300px;overflow:auto;border:1px solid var(--rule);border-radius:var(--r-ctl);margin-top:var(--s2)}
.cx-check{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) 0;font-size:var(--fs-body)}
.cx-check input{width:18px;height:18px}
@media(max-width:900px){.cx-intake{grid-template-columns:minmax(0,1fr)}}

/* ---- mobile queue cards ------------------------------------------------------- */
/* Wide tables are not squeezed. Below 640px the call center queue is rendered
   as one card per case, and the table is hidden. */
.cx-qcards{display:none}
@media(max-width:640px){
  #ccqueue .tblwrap{display:none}
  .cx-qcards{display:grid;gap:var(--s2)}
  .cx-qcard{width:100%;text-align:left;padding:var(--s3) var(--s4);border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--card);display:grid;gap:4px}
  .cx-qcard .r1{display:flex;justify-content:space-between;gap:var(--s2);align-items:center}
  .cx-qcard .r2{font-size:var(--fs-meta);color:var(--ink-muted)}
  .cx-qcard .r3{display:flex;gap:6px;flex-wrap:wrap}
}
.cx-signal{display:grid;grid-template-columns:120px 1fr;gap:var(--s2) var(--s4);font-size:var(--fs-body);align-items:baseline}
.cx-signal .k{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.cx-heatwrap{overflow:auto}

/* Inline emphasis inside a callout. The base rule makes <b> a block title, so
   the coverage sentence uses <strong> for its figures. */
.callout strong{font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* The intake inside the drawer: one column, the list a little shorter. */
#drawer .cx-intake{grid-template-columns:1fr}
#drawer .cx-intake .list{max-height:220px}
#drawer .cx-intake .card{padding:var(--s4)}

/* ---- New contact, the desk's primary action ------------------------------------
   Gold on navy so it reads as the one thing on the screen that is always the
   next thing to do. It lives in the top bar for the HR manager and the rep,
   as the FAB, and in the head of the queue. */
:root{--desk:#E0803E;--desk-deep:#C4692B;--desk-ink:#2B1608;--desk-soft:#FBEFE4}
.btn.gold{background:var(--desk);color:var(--desk-ink)}
.btn.gold:hover{background:var(--desk-deep);color:#fff}
#fab.gold{background:var(--desk);color:var(--desk-ink)}
#fab.gold:hover{background:var(--desk-deep);color:#fff}
.cx-sh .btn.gold{min-height:44px}

/* ---- the intake modal: wider, with tabs and the employee's record ------------- */
#drawer.wide{width:min(860px,100%)}
.cx-itabs{margin:0 0 var(--s3)}
.cx-itabs button{display:inline-flex;align-items:center;gap:6px}
.cx-itabs .cnt{font-size:11px;background:var(--action-soft);color:var(--brand-jade-deep);border-radius:20px;padding:1px 7px;font-family:var(--mono)}
.cx-hist .tblwrap{max-height:340px;overflow:auto}
.cx-hist .tbl td,.cx-hist .tbl th{padding:8px 10px;font-size:var(--fs-meta)}
.cx-hist .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-bottom:var(--s3)}
.cx-hist .kpis .kpi{padding:var(--s3)}
@media(max-width:640px){.cx-hist .kpis{grid-template-columns:1fr 1fr}}

/* ---- today's log ------------------------------------------------------------- */
.cx-logtabs{display:flex;gap:var(--s2);flex-wrap:wrap;margin:0 0 var(--s3)}
.cx-logtabs .pick .n{font-family:var(--mono);font-size:var(--fs-micro);margin-left:6px;opacity:.8}
.cx-shiftbar{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-bottom:var(--s4)}
.cx-shiftbar .card{padding:var(--s4);display:flex;flex-direction:column;gap:4px}
.cx-shiftbar .sh{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.cx-shiftbar .n{font-family:var(--mono);font-size:var(--fs-h1);line-height:1.1}
.cx-shiftbar .who{font-size:var(--fs-meta);color:var(--ink-muted)}
.cx-shiftbar .card.on{border-color:var(--desk);box-shadow:inset 3px 0 0 var(--desk)}
.chip.desk{background:var(--desk-soft);color:var(--desk-deep)}

/* ---- compact intake: typeahead first, departments as a narrow row ------------- */
.cx-sugg{max-height:none!important;margin-top:0!important}
.cx-srow{padding:7px 12px;gap:var(--s2);width:100%;text-align:left;display:flex;align-items:center}
.cx-srow .g{flex:1;min-width:0}
.cx-srow .t{font-size:13px}
.cx-srow .s{font-size:11.5px}
.cx-srow[aria-selected="true"]{background:var(--desk-soft);box-shadow:inset 3px 0 0 var(--desk)}
.cx-deptrow{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.cx-deptrow .sub{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.pick.sm{min-height:30px;padding:4px 10px;font-size:12px}
#drawer .cx-intake{gap:var(--s3)}
#drawer .cx-intake .card{padding:12px 14px}
#drawer .cx-intake .fl{margin-bottom:6px}
#drawer .cx-intake .pillbar{margin-bottom:10px!important}
#drawer .cx-intake .pick{min-height:34px;padding:5px 11px;font-size:12.5px}
#drawer .cx-intake .hint{margin-top:2px}
#drawer .cx-intake .callout{padding:8px 10px;margin:6px 0}
#drawer .cx-intake .kv{grid-template-columns:110px 1fr;gap:2px var(--s3);font-size:12.5px}
#drawer .cx-intake .rcpt{padding:8px 10px}
#drawer .cx-intake #isearch{min-height:44px;font-size:15px}

/* ---- coverage options for a call ------------------------------------------- */
.cx-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2);margin-bottom:10px}
.cx-opt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px 10px;border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--card);width:100%}
.cx-opt .k{font-weight:700;font-size:12.5px}
.cx-opt .h{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.cx-opt .n{font-size:11.5px;color:var(--ink-muted);line-height:1.35}
.cx-opt.on{border-color:var(--desk);box-shadow:inset 3px 0 0 var(--desk);background:var(--desk-soft)}
.cx-opt.off{opacity:.62;background:#F6F5F0}
.cx-opt.off .h{color:var(--ink-muted)}
button.cx-opt:hover:not(.off){border-color:var(--rule-int)}
.pick.fmla[aria-pressed="false"]{border-color:var(--desk);color:var(--desk-deep)}
@media(max-width:640px){.cx-opts{grid-template-columns:1fr}}

/* ---- rows that open ------------------------------------------------------------ */
.tbl tr[role="button"]{cursor:pointer}
.tbl tr[role="button"]:hover{background:var(--desk-soft)}
.tbl tr[role="button"]:focus-visible{outline:2px solid var(--desk);outline-offset:-2px}
.cx-emplink{text-align:left;background:none;border:0;cursor:pointer;font:inherit;color:inherit}
.cx-emplink:hover b{text-decoration:underline;color:var(--desk-deep)}
.cx-emplink:focus-visible{outline:2px solid var(--desk);outline-offset:2px;border-radius:4px}

/* ---- intake modal head: one line, so the form gets the height -------------- */
#drawer header.cx-mhead{padding:8px 14px 8px 16px;align-items:center;min-height:0}
#drawer header.cx-mhead h2{font-size:var(--fs-lead);margin:0}
#drawer header.cx-mhead .eyebrow{margin:0}
#drawer header.cx-mhead .sub{font-size:var(--fs-meta)}
#drawer header.cx-mhead .xbtn{width:32px;height:32px;min-height:0}
#drawer.wide .body{padding:12px 16px}
#drawer.wide .cx-intake .card:first-child .fl:first-child{margin-top:0}

/* ---- one rail width for every console --------------------------------------
   The shell tuned the rail per console (200 for HQ, 196 for the rep, 260 for
   the manager and the employee). Switching persona made the content column
   jump. One width above the icon breakpoint; the collapsed and narrow rules
   keep their own specificity and still win. */
@media(min-width:1121px){
  #shell,#shell[data-console="cc"],#shell[data-hqrail="on"][data-rail="open"]{--rail-w:232px}
  #shell[data-rail="icons"]{--rail-w:var(--rail-w-min)}
}

/* ---- phone ---------------------------------------------------------------------
   Below 640px the rep console tables stack: one card per row, the column
   name printed small above each value, the employee first, the actions last
   and full width. No horizontal scroll, no hidden columns. */
.pb-short{display:none}
@media(max-width:640px){
  .pb-long{display:none}
  .pb-short{display:inline}
  .protobar{padding:6px 12px;font-size:12px;line-height:1.3}
  .lg-tbl thead{display:none}
  .lg-tbl,.lg-tbl tbody{display:block;width:100%}
  .lg-tbl tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:12px 4px;border-bottom:1px solid var(--rule);align-items:start}
  .lg-tbl tbody tr:last-child{border-bottom:0}
  .lg-tbl tbody td,.lg-tbl tbody th{display:block;padding:0;border:0;min-width:0;width:auto;text-align:left}
  .lg-tbl tbody td[data-l]::before{content:attr(data-l);display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);margin-bottom:2px}
  .lg-tbl tbody th[scope="row"]{grid-column:1 / -1;order:-1}
  .lg-tbl tbody td.lg-act{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
  .lg-tbl tbody td.lg-act::before{display:none}
  .lg-tbl tbody td:empty{display:none}
  .lg-tbl tbody td[data-l=""]::before{display:none}
  .lg-tbl .lg-id{display:inline-block;margin-left:8px}
  .lg-card .tblwrap{overflow:visible}
  .cx-shiftbar{grid-template-columns:repeat(3,1fr);gap:6px}
  .cx-shiftbar .card{padding:8px 10px}
  .cx-shiftbar .sh{font-size:10px}
  .cx-shiftbar .n{font-size:var(--fs-lead)}
  .cx-shiftbar .who,.cx-shiftbar .hrs{display:none}
  .lg-tbl tbody td.lg-act{justify-content:flex-start}
  .lg-tbl tbody td.lg-act .btn{min-height:36px;padding:6px 12px;font-size:13px}
  .cx-logtabs .pick{min-height:34px;padding:5px 10px;font-size:12.5px}
  #drawer .cx-intake .pick{min-height:32px;padding:4px 10px;font-size:12px}
  #drawer .cx-intake .pillbar{gap:6px}
  #drawer header.cx-mhead .sub{display:none}
  .cx-opts{grid-template-columns:1fr 1fr}
  .cx-opt .n{display:none}
  .cx-opt.on .n{display:block}
  .cx-hist .kpis{grid-template-columns:1fr 1fr 1fr}
  .cx-hist .kpis .kpi .v{font-size:18px}
  .cx-hist .tbl td,.cx-hist .tbl th{padding:6px 8px;font-size:12px}
  .cx-sh .btn.gold{width:100%}
}

/* ---- confetti canvas: above everything, never in the way ------------------ */

/* ---- the Commerce mark in the top bar ------------------------------------------ */
#topbar .brand .mark.crownmark{background:transparent;width:32px;height:28px;border-radius:0;display:grid;place-items:center}

#topbar .brand small .gold{color:#C9A96A;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

.cx-plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}

.cx-plan .p{font-family:var(--mono);font-size:22px;margin:6px 0 4px}
.cx-plan .p small{font-family:var(--sans);font-size:var(--fs-meta);color:var(--ink-muted)}

/* ============================================================================
   COMMERCE HR OPERATIONS, data layer.

   ONE namespace, HRDATA, plus flat aliases the shell layers already read
   (DEPTS, EMP, EMPBY, ROSTER, COURSES, REC ...). Everything is generated from
   a seeded PRNG on load, so the set is identical on every reload and every
   number on every surface is derived from the same rows. There is no second
   copy of anything.

   ALL PEOPLE ARE FICTIONAL. Names come from two pools with rejection sampling
   so no full name repeats. No SSN, address, date of birth, diagnosis, bank or
   real disciplinary detail exists anywhere in this file. Leave types are
   categories, never conditions. Pay is an illustrative hourly band.

   The department list, headcounts, contact volumes, SLAs and rates below are
   ILLUSTRATIVE. They are shaped to look like a 2,500 person, 24 hour
   operation so the console reads as operational, and they are no employer's
   data. The banner on every route says so.

   Shape note for the Supabase move: every array here is one table, every
   object one row, and every cross reference is by id. HRDATA.schema at the

const NOW = Date.now();
const DAY = 864e5, HR = 36e5;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const dayStart=ms=>{const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime();};

/* Department codes are fixed; the names and job titles come from the brand

const FMLA_BANK=480;
const SHIFT_HOURS=8;

const COVERAGE=[];
(function(){

      else{const pct=P.share[pr.cls]/100;if(ded<P.deductible){const d=Math.min(P.deductible-ded,fee);ded+=d;share=d+Math.max(0,fee-d)*pct;}else share=fee*pct;}
      if(pr.cls!=='ORTHO'){const plan=fee-share;if(maxUsed+plan>P.annualMax){const can=Math.max(0,P.annualMax-maxUsed);share=fee-can;}maxUsed+=fee-share;}
      ppoLine+=share;if(!notCovered)dhmoLine+=pr.dhmo||0;else{dhmoLine+=fee;dhmoGap=true;}}
    ppo+=ppoLine;dhmo+=dhmoLine;lines.push({code:code,desc:pr.desc,qty:qty,fee:pr.fee*qty,ppo:ppoLine,dhmo:dhmoLine,notCovered:notCovered,over:!!(pr.limit&&qty>pr.limit)});});
  return{ppo:+ppo.toFixed(2),dhmo:+dhmo.toFixed(2),lines:lines,maxUsed:+maxUsed.toFixed(2),ded:ded,dhmoGap:dhmoGap,warn:warn};}

/* ---- attendance points, the ladder, suspensions ---------------------------- */
/* An ILLUSTRATIVE occurrence policy. Points per event, a rolling window, and a
   ladder of steps. Every number is configurable and labelled so on the
   console. The console computes where a person stands and names the step the
   ladder points at; HR and the manager decide, and nothing is issued from
   here. Suspensions and reinstatements are records of decisions people made. */
const POINTS={calloff:1,late:0.5,early:0.5,ncns:2};
const POINTS_WINDOW=90;
const LADDER=[
 {pts:2,step:'Coaching conversation',who:'Manager'},
 {pts:3,step:'Written warning',who:'Manager with HR',note:'One point from a suspension review'},
 {pts:4,step:'Suspension review',who:'HR Manager',note:'Typically an unpaid suspension of one to three shifts'},
 {pts:5,step:'Final written warning',who:'HR Manager'},
 {pts:6,step:'Separation review',who:'HR Manager and department head'}];
/* Points for one event: zero when the reason is a protected use. */
const pointsForEvent=a=>reasonProtected(a.reason)?0:(POINTS[a.type]||0);
function pointsFor(empId){const rows=ATT.filter(a=>a.emp===empId&&a.at>=TODAY-(POINTS_WINDOW-1)*DAY);
  const pts=rows.reduce((a,x)=>a+pointsForEvent(x),0);return{pts:+pts.toFixed(1),rows:rows};}
function ladderStep(pts){let cur=null,next=null;for(const l of LADDER){if(pts>=l.pts)cur=l;else if(!next)next=l;}return{cur:cur,next:next,toNext:next?+(next.pts-pts).toFixed(1):0};}
/* Standing in words, never colour alone. */
function pointsStanding(pts){
  if(pts>=6)return['alert','Separation review'];
  if(pts>=5)return['alert','Final warning step'];
  if(pts>=4)return['alert','Suspension review'];
  if(pts>=3)return['alert','Verge of suspension'];
  if(pts>=2)return['warn','Coaching step'];
  if(pts>=1)return['','Watch'];
  return['ok','Clear'];}
/* Suspensions and reinstatements, seeded from the people the points say are at
   or past the suspension step. Records of decisions, with dates, never a
   reason narrative. */
const SUSP=[];
(function(){
  const r=rng(2727);let seq=0;
  EMP.filter(e=>e.status==='active'&&e.lv<3&&!e.dupOf&&e.dept).forEach(e=>{
    const p=pointsFor(e.id).pts;
    if(p<4)return;
    const roll=r();
    if(roll<.45){const start=TODAY-Math.floor(r()*40+4)*DAY;const days=1+Math.floor(r()*3);
      const back=start+days*DAY;
      SUSP.push({id:'SUS-'+String(300+(++seq)),emp:e.id,dept:e.dept,pts:Math.min(p,+(4+Math.floor(r()*2)*0.5).toFixed(1)),start:start,days:days,end:back,
        status:'reinstated',reinstated:back+Math.floor(r()*2)*DAY,by:HR_MGR.id,mgr:e.mgr});}
    else if(roll<.6){const start=TODAY-Math.floor(r()*2)*DAY;const days=2+Math.floor(r()*2);
      SUSP.push({id:'SUS-'+String(300+(++seq)),emp:e.id,dept:e.dept,pts:p,start:start,days:days,end:start+days*DAY,status:'active',reinstated:null,by:HR_MGR.id,mgr:e.mgr});}
    else if(roll<.75){SUSP.push({id:'SUS-'+String(300+(++seq)),emp:e.id,dept:e.dept,pts:p,start:null,days:null,end:null,status:'review',reinstated:null,by:null,mgr:e.mgr,opened:TODAY-Math.floor(r()*5)*DAY});}
  });
  SUSP.sort((a,b)=>(b.start||b.opened||0)-(a.start||a.opened||0));

/* ---- the desk log ----------------------------------------------------------
   One row per entry typed at the desk, the record of who logged what and when.
   Seeded from the rows already on file for the last 24 operating hours (every
   attendance event taken by phone, every case opened by phone or walk-in), then
   filled to roughly thirty entries per shift with inquiries that close on the
   call, each written as a real resolved case so the log and the case file
   agree. The rep on each entry is a rep on duty for that shift. submitIntake()
   appends to this array, so a new entry shows at the top with the time it was
   typed and the persona that typed it. */
const LOG=[];
(function(){
  const r=rng(9090);const since=NOW-DAY;let seq=0;
  const onDuty=at=>{const list=repsOn(deskShift(at));return list.length?pick(r,list).id:REPS[0].id;};
  const add=o=>{o.id='LOG-'+String(++seq).padStart(4,'0');o.shift=deskShift(o.at);o.seed=true;LOG.push(o);return o;};
  const byAtt={};CASES.forEach(c=>(c.att||[]).forEach(a=>{byAtt[a]=c.id;}));
  ATT.filter(a=>a.at>=since&&a.at<=NOW&&a.via==='call').forEach(a=>{
    a.rep=onDuty(a.at);const cid=byAtt[a.id]||null;if(cid&&CASEBY[cid])CASEBY[cid].rep=a.rep;
    add({at:a.at,rep:a.rep,emp:a.emp,dept:a.dept,type:a.type,minutes:a.minutes,reason:a.reason,cover:a.cover?{bucket:a.cover.bucket,hours:a.cover.hours}:null,mgr:!!a.mgrNotified,att:a.id,caseId:cid,answered:null});});
  CASES.filter(c=>c.opened>=since&&c.opened<=NOW&&c.reason!=='attendance'&&(c.type==='Phone'||c.type==='Walk-in')).forEach(c=>{
    c.rep=onDuty(c.opened);
    add({at:c.opened,rep:c.rep,emp:c.emp,dept:c.dept,type:'inquiry',minutes:0,reason:RBYC[c.reason].en,cover:null,mgr:!!c.mgrInformed,att:null,caseId:c.id,answered:c.status==='res'});});
  const active=EMP.filter(e=>e.status==='active'&&e.dept&&e.dept!=='HR'&&!e.dupOf);
  const INQ=REASONS.filter(x=>x.c!=='attendance'&&x.c!=='er');
  const windows={day:[6,14],swing:[14,22],grave:[22,30]};
  ['day','swing','grave'].forEach(sh=>{
    const target=28+Math.floor(r()*6);
    let have=LOG.filter(l=>l.shift===sh).length;
    let guard=0;
    while(have<target&&guard++<200){
      const w=windows[sh];const h=w[0]+r()*(w[1]-w[0]);
      let at=TODAY+h*HR;if(at>NOW)at-=DAY;if(at<since)continue;
      const e=pick(r,active);const x=pick(r,INQ);const rep=onDuty(at);const answered=r()<.86;
      const c={id:'HRC-'+String(1000+CASES.length+1),emp:e.id,dept:e.dept,reason:x.c,pri:'normal',rep:rep,type:r()<.8?'Phone':'Walk-in',opened:at,sla:at+SLA_HRS.normal*HR,status:answered?'res':'prog',
        notes:[{by:rep,t:at+3*6e4,txt:pick(r,CASE_NOTE[x.c])}],esc:[],att:[],leave:null,mgrInformed:null,resolvedAt:answered?at+Math.floor(4+r()*9)*6e4:null,fcr:answered};
      CASES.push(c);CASEBY[c.id]=c;
      add({at:at,rep:rep,emp:e.id,dept:e.dept,type:'inquiry',minutes:0,reason:x.en,cover:null,mgr:false,att:null,caseId:c.id,answered:answered});
      have++;}
  });
  LOG.sort((a,b)=>b.at-a.at);
})();

function lineChart(rows,opt){opt=opt||{};const w=600,h=opt.h||140;const vals=rows.map(r=>r.v);

function focusKey(el){

  if(el.id)return '#'+CSS.escape(el.id);
  for(const a of ['data-persona','data-filter','data-tab','data-ctab','data-cdept','data-cshift','data-crole','data-cstatus','data-ccourse','data-cfocus','data-creason','data-cart',
                  'data-case','data-emp','data-dept','data-module','data-ccreason','data-ccstatus','data-an','data-andept','data-anstatus','data-anshift','data-andays',
                  'data-rb','data-apick','data-idept','data-adept','data-acourse','data-leave','data-dq','data-rpt','data-sop','data-attrev','data-ishift','data-ireason','data-ipick','data-itab','data-inew','data-lshift','data-lcard','data-ibucket','data-irel','data-bplan','data-btier','data-bdent','data-bscen','data-bproc','data-bdel','data-bqle']){
    const v=el.getAttribute(a); if(v!=null)return `[${a}="${CSS.escape(v)}"]`;

/* Copies each table head onto its cells as data-l, so the phone layout can

function cellLabels(root){(root||document).querySelectorAll('table.lg-tbl').forEach(t=>{const hs=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());
  t.querySelectorAll('tbody tr').forEach(tr=>{[...tr.children].forEach((c,i)=>{if(hs[i]&&!c.hasAttribute('data-l'))c.setAttribute('data-l',hs[i]);});});});}

/* Celebration. A short burst of confetti from the control that was pressed,
   the way a task tool marks a thing done. Brand colours only, canvas drawn,
   no library, gone in under two seconds, and off entirely for anyone who
   asked the OS for reduced motion. Never blocks a click: pointer-events none. */
let _lastPt={x:innerWidth/2,y:innerHeight*0.7,t:0};
document.addEventListener('pointerdown',e=>{_lastPt={x:e.clientX,y:e.clientY,t:Date.now()};},true);
function celebrate(opts){
  opts=opts||{};if(matchMedia('(prefers-reduced-motion: reduce)').matches)return false;
  const n=opts.n||140;const x=opts.x!=null?opts.x:_lastPt.x,y=opts.y!=null?opts.y:_lastPt.y;
  let c=document.getElementById('confetti');
  if(!c){c=document.createElement('canvas');c.id='confetti';c.setAttribute('aria-hidden','true');document.body.appendChild(c);}
  const dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
  const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#E0803E','#C9A227','#1E2B47','#5B6558','#FBEFE4','#B45309'];
  const ps=[];for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*(opts.spread||1.6);const v=(opts.v||9)*(0.55+Math.random()*0.9);
    ps.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],life:1,round:Math.random()<.3});}
  const t0=performance.now();c.style.opacity='1';
  function frame(t){const dt=Math.min(32,t-(frame.last||t))/16.67;frame.last=t;ctx.clearRect(0,0,innerWidth,innerHeight);let alive=0;
    ps.forEach(p_=>{if(p_.life<=0)return;alive++;p_.vy+=0.28*dt;p_.vx*=0.985;p_.vy*=0.985;p_.x+=p_.vx*dt;p_.y+=p_.vy*dt;p_.r+=p_.vr*dt;if(t-t0>900)p_.life-=0.03*dt;
      ctx.save();ctx.globalAlpha=Math.max(0,p_.life);ctx.translate(p_.x,p_.y);ctx.rotate(p_.r);ctx.fillStyle=p_.c;
      if(p_.round){ctx.beginPath();ctx.arc(0,0,p_.w/2,0,Math.PI*2);ctx.fill();}else ctx.fillRect(-p_.w/2,-p_.h/2,p_.w,p_.h*Math.abs(Math.cos(p_.r*2))+1);ctx.restore();});
    if(alive&&t-t0<2400)requestAnimationFrame(frame);else{ctx.clearRect(0,0,innerWidth,innerHeight);c.style.opacity='0';}}
  requestAnimationFrame(frame);_celebrated++;return true;}
let _celebrated=0;
/* How many entries the person typing has put on the log this shift, for the
   toast. The count is the reward; the confetti is the punctuation. */
function myShiftCount(me){const now=Date.now();const sh=deskShift(now);return LOG.filter(l=>l.rep===me&&l.shift===sh&&l.at>=now-8*HR).length;}
function toast(msg){let t_=document.getElementById('toast');
  if(!t_){t_=document.createElement('div');t_.id='toast';t_.setAttribute('role','status');t_.setAttribute('aria-live','polite');document.body.appendChild(t_);}
  t_.textContent=msg;t_.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(()=>t_.classList.remove('on'),2600);}

/* Contact intake, the rep's own form. One function, four contact types.
   Attendance types write an ATT row, a case, and, when hours are applied, a
   time_coverage row through applyCoverage(), the only path that touches a
   balance. Inquiries write a case only and count toward today's contacts. */
/* Pacific time for the desk clock. The received time defaults to the moment
   New log was pressed and can be edited; a time later than now means the call
   came in before midnight, so it lands on yesterday. */
const PT='America/Los_Angeles';
const ptParts=ms=>{const o={};new Intl.DateTimeFormat('en-US',{timeZone:PT,hour:'2-digit',minute:'2-digit',hour12:false,month:'short',day:'numeric',year:'numeric'}).formatToParts(ms).forEach(x=>{o[x.type]=x.value;});if(o.hour==='24')o.hour='00';return o;};
const ptHHMM=ms=>{const o=ptParts(ms);return o.hour+':'+o.minute;};
const ptStamp=ms=>{const o=ptParts(ms);return o.month+' '+o.day+', '+new Date(ms).toLocaleTimeString('en-US',{timeZone:PT,hour:'numeric',minute:'2-digit'})+' PT';};
function ptTimeToMs(hhmm){const now=Date.now();const cur=ptHHMM(now).split(':').map(Number);const want=hhmm.split(':').map(Number);
  let delta=(want[0]*60+want[1])-(cur[0]*60+cur[1]);if(delta>2)delta-=1440;return now+delta*6e4;}
function intakeReset(){S.intake={emp:null,dept:S.intake&&S.intake.dept||null,type:'late',shift:null,reason:null,minutes:15,bucket:'sick',verified:false,notified:false,inform:false,answered:true,inq:'benefits',tab:'intake',q:'',hi:0,at:Date.now(),rel:null};}
/* Inform the department manager about a contact. One write path used by the
   intake and the case drawer: stamps the case, marks the manager notified on
   any linked attendance event, leaves a note, and appends the manager's
   notice row to the task table so it reaches the department console. */
function deptManager(dept){return (ROSTER[dept]||[]).find(e=>e.role==='MGR')||null;}
function informManager(caseId,by){const c=CASEBY[caseId];if(!c)return null;const m=deptManager(c.dept);const at=Date.now();
  c.mgrInformed=at;(c.att||[]).forEach(id=>{const a=ATT.find(x=>x.id===id);if(a)a.mgrNotified=true;});
  c.notes.push({by:by||(REPS[0]||{}).id,t:at,txt:'Department manager informed: '+(m?m.name:deptName(c.dept))+'. Contact summary sent to the department console; no employee detail beyond the event category.'});
  if(typeof taskSyncCase==='function')taskSyncCase(c);bump();return m;}
/* The New contact modal. The same form in the drawer, repainted in place on
   every state change with focus put back where it was, so the pills behave
   like pills and typing in the minutes field is not interrupted. */
function intakeModal(){intakeReset();S.intakeModal=true;openDrawer(intakeModalHTML());$('#drawer').classList.add('wide');setTimeout(()=>{const i=document.querySelector('#drawer #isearch');if(i)i.focus();},60);}
function intakeModalHTML(){return '<header class="cx-mhead"><div style="flex:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><div class="eyebrow">New log</div><h2 style="margin:0">Contact intake</h2><span class="sub">Employee, type, time, coverage, manager.</span></div><button class="xbtn" data-close="1" aria-label="Close">✕</button></header><div class="body">'+(typeof intakeFormHTML==='function'?intakeFormHTML():'')+'</div>';}
/* Repaint in place: the scroll position of the body and the focused control
   both survive, so choosing an option never moves the page under the hand. */
function intakeRepaint(){const d=$('#drawer');if(!S.intakeModal||!d.classList.contains('on'))return false;
  const key=focusKey(document.activeElement);const body=d.querySelector('.body');const top=body?body.scrollTop:0;
  d.innerHTML=intakeModalHTML();

  if(key){try{const back=d.querySelector(key);if(back)back.focus({preventScroll:true});}catch(err){}}

  animateBars(d);return true;}
function intakePlan(){const f=S.intake;const e=f.emp?EMPBY[f.emp]:null;if(!e)return null;
  const bal=e.bal||{sick:0,pto:0};const hours=roundQuarter(f.type==='calloff'?SHIFT_HOURS*60:f.minutes);
  const avail=NO_BAL(f.bucket)?Infinity:(bal[f.bucket]||0);
  const applied=Math.min(hours,avail);const short=+(hours-applied).toFixed(2);
  /* Where a shortfall goes: FMLA hours run out into sick hours if there are
     any, everything else into unpaid. */
  const spill=short>0?(f.bucket==='fmla'&&(bal.sick||0)>0?'sick':'unpaid'):null;
  const spillApplied=spill==='sick'?Math.min(short,bal.sick):short;
  return{e:e,hours:hours,bucket:f.bucket,applied:+applied.toFixed(2),short:short,spill:spill,spillApplied:+spillApplied.toFixed(2),spillShort:+(short-spillApplied).toFixed(2),before:NO_BAL(f.bucket)?null:bal[f.bucket],after:NO_BAL(f.bucket)?null:+((bal[f.bucket]||0)-applied).toFixed(2)};}
function submitIntake(){const f=S.intake;const e=f.emp?EMPBY[f.emp]:null;const me=S.persona==='hq'?HR_MGR.id:(REPS[0]||{}).id;const typed=Date.now();const at=Math.min(typed,f.at||typed);
  if(!e||!f.verified){toast('Pick the employee and verify identity first.');return}

  if(f.type==='inquiry'){
    const c={id:'HRC-'+String(1000+CASES.length+1),emp:e.id,dept:e.dept,reason:f.inq,pri:'normal',rep:me,type:'Phone',opened:at,sla:at+SLA_HRS.normal*HR,status:f.answered?'res':'prog',
      notes:[{by:me,t:at,txt:'Inquiry by phone, '+RBYC[f.inq].en.toLowerCase()+'. Identity verified.'+(f.answered?' Answered from policy or the record on this call.':' Needs follow-up; handed to the owner.')}],esc:[],att:[],leave:null,resolvedAt:f.answered?at:null,fcr:!!f.answered};

    LOG.unshift({id:'LOG-'+String(LOG.length+1).padStart(4,'0'),at:typed,recv:at,shift:deskShift(typed),rep:me,emp:e.id,dept:e.dept,type:'inquiry',minutes:0,reason:RBYC[f.inq].en,cover:null,mgr:!!f.inform,att:null,caseId:c.id,answered:!!f.answered});
    if(f.inform)informManager(c.id,me);if(typeof taskSyncCase==='function')taskSyncCase(c);bump();
    intakeReset();if(S.intakeModal)closeDrawer();

  if(!f.shift||!f.reason){toast('Pick the shift and the reason category first.');return}
  const minutes=f.type==='calloff'?SHIFT_HOURS*60:Math.max(1,f.minutes);
  const row={id:'ATT-'+String(ATT.length+1).padStart(5,'0'),emp:e.id,dept:e.dept,shift:f.shift,at:at,typed:typed,type:f.type,minutes:minutes,reason:f.reason,rel:f.rel||null,documented:false,docDue:at+2*DAY,mgrNotified:f.notified,via:'call',rep:me,cover:null};
  ATT.unshift(row);
  const plan=intakePlan();let coverTxt='';
  if(plan&&plan.applied>0){const tc=applyCoverage(e.id,row,plan.bucket,plan.applied,me,'Applied at intake');coverTxt=' '+plan.applied.toFixed(2)+' '+(plan.bucket==='fmla'?'FMLA':label(COVER_BUCKETS,plan.bucket).toLowerCase())+' hours applied to '+minutes+' min ('+tc.id+').';}
  if(plan&&plan.short>0){
    if(plan.spill==='sick'){applyCoverage(e.id,row,'sick',plan.spillApplied,me,'FMLA bank exhausted, sick hours applied');coverTxt+=' '+plan.spillApplied.toFixed(2)+' sick h applied past the FMLA bank.';
      if(plan.spillShort>0){applyCoverage(e.id,row,'unpaid',plan.spillShort,me,'Balance short');coverTxt+=' '+plan.spillShort.toFixed(2)+' h unpaid, balance short.';}}
    else{applyCoverage(e.id,row,'unpaid',plan.short,me,'Balance short');coverTxt+=' '+plan.short.toFixed(2)+' h unpaid, balance short.';}}
  if(plan&&plan.bucket==='unpaid'&&plan.applied>0)coverTxt=' '+plan.hours.toFixed(2)+' h recorded unpaid at the employee\'s request.';
  if(plan&&plan.bucket==='paid'&&plan.applied>0)coverTxt=' '+plan.hours.toFixed(2)+' h paid by the employer under the rule, no balance moved.';
  const what=label(ATT_TYPES,f.type);
  const c={id:'HRC-'+String(1000+CASES.length+1),emp:e.id,dept:e.dept,reason:'attendance',pri:'normal',rep:me,type:'Phone',opened:at,sla:at+SLA_HRS.normal*HR,status:f.notified?'prog':'wmgr',
    notes:[{by:me,t:typed,txt:what+' taken by phone, received '+ptStamp(at)+'. Identity verified. Shift and reason category recorded'+(f.rel?' (family member: '+f.rel.toLowerCase()+')':'')+(reasonProtected(f.reason)?'. Protected use, no attendance points.':'.')+(f.type==='calloff'?'':' '+minutes+' minutes.')+coverTxt+(f.notified?' Department notified.':' Department notification pending.')}],esc:[],att:[row.id],leave:null,resolvedAt:null,fcr:false};
  CASES.unshift(c);CASEBY[c.id]=c;td.total++;td.by.attendance=(td.by.attendance||0)+1;
  LOG.unshift({id:'LOG-'+String(LOG.length+1).padStart(4,'0'),at:typed,recv:at,shift:deskShift(typed),rep:me,emp:e.id,dept:e.dept,type:f.type,minutes:minutes,reason:f.reason+(f.rel?' ('+f.rel.toLowerCase()+')':''),cover:row.cover?{bucket:row.cover.bucket,hours:row.cover.hours}:null,mgr:!!(f.notified||f.inform),att:row.id,caseId:c.id,answered:null});
  if(f.inform)informManager(c.id,me);if(typeof taskSyncCase==='function')taskSyncCase(c);bump();
  intakeReset();if(S.intakeModal)closeDrawer();
  const k2=myShiftCount(me);celebrate({n:150});toast(what+' recorded as '+c.id+'.'+coverTxt+' Documentation due in 48h. '+k2+' logged on your shift'+(k2>=10?', strong shift.':k2>=5?', halfway to a busy one.':'.'));render();}

function repStats(){return REPS.map(r=>{const mine=CASES.filter(c=>c.rep===r.id);const res=mine.filter(c=>c.status==='res');
  const fcr=res.length?Math.round(100*res.filter(c=>c.fcr).length/res.length):0;

  return{rep:r,handled:mine.length,open:open,fcr:fcr,aht:aht,esc:esc_,doc:docOnTime,late:mine.filter(c=>c.status!=='res'&&caseSla(c).late).length};});}
function attTrend(days,pred){const out=[];for(let d=days-1;d>=0;d--){const day=TODAY-d*DAY;const rows=ATT.filter(a=>a.at>=day&&a.at<day+DAY&&(!pred||pred(a)));
  out.push({label:new Date(day).toLocaleDateString('en-US',{weekday:'short'}).slice(0,2)+' '+new Date(day).getDate(),calloff:rows.filter(a=>a.type==='calloff').length,late:rows.filter(a=>a.type==='late').length,ncns:rows.filter(a=>a.type==='ncns').length,early:rows.filter(a=>a.type==='early').length});}return out;}
/* Root cause module. Signals computed from the last 7 days against the prior
   7, split by shift and department. It names patterns and never a cause. */
function rootCause(){const cur=attWindow(7,a=>a.type==='calloff'),prev=ATT.filter(a=>a.type==='calloff'&&a.at>=TODAY-13*DAY&&a.at<TODAY-6*DAY);
  const delta=prev.length?Math.round(100*(cur.length-prev.length)/prev.length):0;
  const inc=Math.max(0,cur.length-prev.length);
  const byShift=SHIFTS.map(s=>({s:s,cur:cur.filter(a=>a.shift===s.c).length,prev:prev.filter(a=>a.shift===s.c).length}));
  const byDept=DEPTS.map(d=>({d:d,cur:cur.filter(a=>a.dept===d.c).length,prev:prev.filter(a=>a.dept===d.c).length})).map(x=>Object.assign(x,{inc:x.cur-x.prev})).sort((a,b)=>b.inc-a.inc);
  const topShift=byShift.slice().sort((a,b)=>(b.cur-b.prev)-(a.cur-a.prev))[0];
  const shiftShare=inc?Math.round(100*Math.max(0,topShift.cur-topShift.prev)/inc):0;
  const top2=byDept.slice(0,2);const deptShare=inc?Math.round(100*top2.reduce((a,x)=>a+Math.max(0,x.inc),0)/inc):0;
  const repeat=(()=>{const cnt={};cur.forEach(a=>{cnt[a.emp]=(cnt[a.emp]||0)+1});const rc=Object.keys(cnt).filter(k=>cnt[k]>1).length;const pc={};prev.forEach(a=>{pc[a.emp]=(pc[a.emp]||0)+1});return{cur:rc,prev:Object.keys(pc).filter(k=>pc[k]>1).length};})();
  const undoc={cur:cur.filter(a=>!a.documented).length,prev:prev.filter(a=>!a.documented).length};
  return{cur:cur.length,prev:prev.length,delta:delta,topShift:topShift,shiftShare:shiftShare,top2:top2,deptShare:deptShare,repeat:repeat,undoc:undoc,byShift:byShift,byDept:byDept};}
/* Training compliance as of a date, from the same records, so the executive
   trend compares two real points rather than a number against a guess. */
function trainingPctAt(ms){let ok=0,tot=0;EMP.forEach(e=>{if(e.status==='term'||e.dupOf||!e.dept)return;required(e).forEach(c=>{tot++;const r=(REC[e.id]||{})[c.c];
  if(r&&r.done&&r.done<=ms&&(!c.rc||r.done+c.rc*30*DAY>ms))ok++;});});return pct(ok,tot);}
function trainingByCourse(){return COURSES.map(c=>{const pop=EMP.filter(e=>e.status!=='term'&&required(e).some(x=>x.c===c.c));
  const done=pop.filter(e=>certState(e,c.c).s==='current'||certState(e,c.c).s==='expiring').length;
  const over=pop.filter(e=>{const s=certState(e,c.c).s;return s==='expired'||s==='missing';}).length;
  return{c:c,assigned:pop.length,done:done,over:over,pct:pct(done,pop.length)};});}
function heatmap(){const cs=COURSES.filter(c=>c.tr==='compliance');

  return `<div class="card cx-heatwrap"><div class="heat" style="grid-template-columns:120px repeat(${cs.length},minmax(44px,1fr))"><div></div>${cs.map(c=>`<div class="cl" title="${esc(c.en)}">${esc(c.c)}</div>`).join('')}

      <span class="sub" style="margin:0 4px 0 12px">Period</span>${[[30,'30d'],[90,'90d'],[365,'12 mo']].map(([k,l])=>`<button class="fchip" data-andays="${k}" aria-pressed="${an.days===k}">${l}</button>`).join('')}</div>
