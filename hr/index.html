  icL('M11 9.4h6.2M11 13.4h4.2');

/* ---- 33. records retention ---------------------------------------------
   An archive box with a lid and a hand slot. Retention in this product
   is "five years unless a hold freezes it", which is a box on a shelf
   with a date on it, and the box is the honest object. The slot is solid
   so the box does not read as an empty rectangle at 13px. Lid depth 4.4
   units and the slot sits 3.8 below it. */
IC.retention =
  icL('M4.4 5h15.2a1.8 1.8 0 0 1 1.8 1.8v2.6H2.6V6.8A1.8 1.8 0 0 1 4.4 5z') +

  icF('M9.6 13.2h4.8v2.2H9.6z');

/* ---- 34. privileged -----------------------------------------------------
   A sealed envelope. docs/02 makes privilege a data attribute rather
   than a convention: a note marked privileged renders to counsel and to
   nobody else, HR included. So the mark is not a lock, which would say
   "you may not touch this"; it is a seal, which says "this was closed by
   the person entitled to close it". The flap is solid, which is what
   makes it read as sealed rather than as an envelope waiting to be
   filled, and gives it a dark anchor at 13px. */
IC.privilege =
  icL('M4.4 5.6h15.2a2 2 0 0 1 2 2v9.6a2 2 0 0 1-2 2H4.4a2 2 0 0 1-2-2V7.6a2 2 0 0 1 2-2z') +
  icF('M4.6 6.6h14.8L12 12.6z');

/* ---- 35. the counsel worklog -------------------------------------------
   A nib over a ruled line. The worklog counts acts recorded by counsel,
   which is writing, and every other document mark in this family is
   about a document that exists rather than about the act of making one.
   One rule line, not three: the nib already occupies the upper two
   thirds and a second rule would sit 1.0 units under its tip. */
IC.worklog =
  icL('M18.4 3.8 20.2 5.6 10.6 15.2l-2.8 1 1-2.8z') +

   A pediment on columns. Every statutory interval in this app carries a

   cited is a state agency and a code section. The building is the agency.
   Three columns at a 4.8 unit pitch, which is 2.6px at 13px and the
   widest column spacing that still leaves the pediment room. */
IC.authorities =
  icL('M2.8 9.4 12 4.2l9.2 5.2z') +

/* ---- 37 to 44. furniture ----------------------------------------------
   Not product nouns. Same grid, same stroke, same terminals, so they do

IC.lock =
  icL('M5.4 10.6h13.2a1.9 1.9 0 0 1 1.9 1.9v6.2a1.9 1.9 0 0 1-1.9 1.9H5.4a1.9 1.9 0 0 1-1.9-1.9v-6.2a1.9 1.9 0 0 1 1.9-1.9z') +

IC.prev  = icL('M14.8 5.6 8.4 12l6.4 6.4');
IC.next  = icL('M9.2 5.6 15.6 12l-6.4 6.4');
IC.plus  = icL('M12 4.6v14.8M4.6 12h14.8');

/* The bell. One drawing, replacing the two that inbox.js.part and

IC.bell =

/* Fallback. Any unknown name lands here rather than throwing, and a

IC.dot = icDot(12, 12, 5.6);

/* =====================================================================
   ic(name, size, cls)
   ===================================================================== */
function ic(name, size, cls){
  const key = IC_ALIAS[name] || name;
  const d = IC[key] || IC.dot;
  const s = size || 20;
  return '<svg class="ic ic-' + key + (cls ? ' ' + cls : '') +
    '" viewBox="0 0 24 24" width="' + s + '" height="' + s +
    '" fill="none" stroke="currentColor" stroke-width="' + icStroke(s) +
    '" stroke-linecap="round" stroke-linejoin="round" ' +
    'aria-hidden="true" focusable="false">' + d + '</svg>';
}

/* The documented name list, in one place, so a call site can be checked
   against it without reading the drawings. IC_NAMES[0] is the canonical
   set; IC_NAMES[1] is every alias that resolves into it. */
const IC_NAMES = [Object.keys(IC), Object.keys(IC_ALIAS)];

/* =====================================================================
   nvIcon, kept alive.

   chrome.js.part declares function nvIcon(k, w) and calls it in twelve
   places. Those call sites are not edited; the function is replaced
   under them.

   The replacement is an ASSIGNMENT to window.nvIcon rather than a second
   function declaration, and that is the load bearing detail. A second
   declaration only wins if this part is merged after chrome, and
   build-shell.py's JS_ORDER is shared with several other agents who
   reorder it: it already moved once while this file was being written,
   from ['tasks','hero','chrome','inbox','float'] to
   ['tasks','icons','hero','chrome','console-hq','console-legal',
   'inbox','float'], which put icons BEFORE chrome and would have made a
   declaration here lose silently.

   An assignment cannot lose either way, because a top level function
   declaration in a classic script also creates a property on the global
   object, and statements run after every declaration in the block has
   been hoisted:

     icons before chrome   hoisting leaves chrome's nvIcon bound; icons'
                           statements run first and overwrite it; chrome
                           has no statement that writes nvIcon back.
     icons after chrome    hoisting leaves chrome's nvIcon bound; this
                           assignment runs later and overwrites it.

   window.nvIcon rather than a bare nvIcon = ... so that if chrome.js.part
   is ever absent this writes a global instead of throwing under
   'use strict'.

   Signature is unchanged: (key, width). The nv-ic class is preserved
   because chrome.css.part line 185 and design-chrome.css.part line 452
   both select svg.nv-ic and would otherwise stop applying. chrome's own
   NV_ICON table is left in place and unread rather than deleted,
   because deleting it means editing a file this agent does not own.
   ===================================================================== */
function icNvIcon(k, w){
  return ic(k, w || 20, 'nv-ic');
}
window.nvIcon = icNvIcon;

const HERO_DAY = (typeof DAY !== 'undefined') ? DAY : 86400000;
const HERO_HR  = (typeof HR  !== 'undefined') ? HR  : 3600000;

const HERO_MIN = 60000;

function heroDays(ms){return Math.max(0, Math.round(Math.abs(ms) / HERO_DAY));}
function heroHrs(ms){return Math.max(0, Math.round(Math.abs(ms) / HERO_HR));}
function heroMins(ms){return Math.max(1, Math.round(Math.abs(ms) / HERO_MIN));}
function heroNum(n){return Number(n).toLocaleString();}
/* English agreement for a figure and its qualifier. "0 hours left" and
   "1 days left" are both wrong and both look generated, and the qualifier is
   the whole point of the figure. */
function heroPl(n, one, many){return n === 1 ? one : many;}

/* Contract section 7: the app repaints by innerHTML, so the only live region
   that survives is the persistent one on <body>. Write to it, never build one

/* One KPI cell. The qualifier sits inline with the number, teardown 03

     Where no filter isolates it, it stays a div. A cell that looks pressable and

    '<span class="v ' + (tone || '') + '">' + esc(value) + '</span>' +
    '<span class="q">' + esc(tx(qual)) + '</span></div>' +

    inner + '</button>';
}

/* Which surface each kind belongs to, per persona. This mirrors the pick
   functions in chrome.js.part's NV_SURFACES exactly, and it has to: the card
   promises "Open those 5", the button loads that surface with that group
   filter, and chrome narrows the surface the same way. If these two tables
   ever disagree, the count on the button stops matching the list that opens,
   which is the precise defect the 405 teardown warns about.

   mgr is the one persona whose training rows split across two surfaces, own
   training against the team's, so it is resolved per task below. */

/* Which surface each kind belongs to, per persona. Mirrors NV_SURFACES in
   chrome.js.part exactly, so the count on the button matches the list that
   opens. */
const HERO_SURFACE = {
  hq:  {case_new:'queue', sla_expiring:'queue', sla_expired:'queue', case_escalated:'queue',
        leave_followup:'leave', dq_exception:'quality', report_approval:'reporting', report_done:'reporting', points_review:'attendance'},
  cc:  {case_new:'myqueue', sla_expiring:'myqueue', sla_expired:'myqueue', attendance_doc:'docs', report_done:'log'},
  mgr: {mgr_response:'attendance', attendance_doc:'attendance', training_overdue:'team', mgr_notice:'team'},
  emp: {training_overdue:'learning'}
};
const HERO_GROUP_RANK = {late:0, today:1, week:2, noclock:3, info:4};

function heroSurfaceOf(persona, task, store){
  const row = HERO_SURFACE[persona] || {};
  if(persona === 'mgr' && task.kind === 'training_overdue'){
    const rs = (typeof ROSTER !== 'undefined' && ROSTER[store]) || [];
    const m = rs.filter(e => e.role === 'MGR')[0];
    return (m && task.subject.id === m.id) ? 'training' : 'team';
  }
  return row[task.kind] || null;
}

/* Buckets are keyed surface plus deadline group, so the number on the button
   is exactly the number of rows that open. Keying by kind instead would read
   better and lie: "Open those 3" would open a list of seventeen. */
function heroBuckets(persona, store){
  const list = tasksFor(persona, store);
  const gm = {};
  taskGroups(persona, store).forEach(g => {g.tasks.forEach(t => {gm[t.id] = g.key;});});

  const map = {}, order = [];
  list.forEach(t => {
    const sk = heroSurfaceOf(persona, t, store);
    const gk = gm[t.id];
    if(!sk || !gk) return;
    const key = sk + '|' + gk;
    let b = map[key];
    if(!b){
      b = map[key] = {surface:sk, group:gk, tasks:[], kinds:{}, subjects:{}, worst:t};
      order.push(b);
    }
    b.tasks.push(t);
    b.kinds[t.kind] = (b.kinds[t.kind] || 0) + 1;
    if(t.subject && t.subject.id) b.subjects[t.subject.id] = 1;
  });

  /* tasksFor is already sorted worst first, so each bucket's first task is its
     worst. Order the buckets by how late they are, then by how many rows are
     stuck in them. */
  order.sort((a, b) => {
    const ar = HERO_GROUP_RANK[a.group], br = HERO_GROUP_RANK[b.group];
    if(ar !== br) return ar - br;
    return b.tasks.length - a.tasks.length;
  });
  return order;
}

/* Severity for the card's 3px left edge. crit is granted only where the task
   engine granted it, which is an expired 8 hour Cal/OSHA clock and nothing
   else, per contract section 6. */
function heroCardSev(b){
  if(b.worst.sev === 'crit') return 'crit';
  if(b.group === 'late') return 'late';
  if(b.group === 'today' || b.group === 'week') return 'warn';
  return 'info';
}

/* The impact figure. Always a number with a qualifier word after it, never a
   bare figure, and the qualifier changes with the group so it stays true:
   time past the deadline when late, time left when it is still running, and a
   count of what is affected when there is no clock at all. */
function heroImpact(b){
  const now = Date.now();
  const clocky = b.worst.kind === 'clock_expiring' || b.worst.kind === 'clock_expired';
  const n = b.tasks.length;

  if(b.group === 'late'){
    let worstMs = 0;
    b.tasks.forEach(t => {if(t.due != null && now - t.due > worstMs) worstMs = now - t.due;});
    if(clocky){
      /* Under two hours the hour figure rounds to nothing useful, and "0 hours
         past the deadline" is the kind of number that makes a reader stop
         trusting the rest of the strip. */
      if(worstMs < 2 * HERO_HR){
        const m = heroMins(worstMs);
        return {v:heroNum(m), q:{en:heroPl(m, 'minute past the deadline', 'minutes past the deadline'),
                                 zh:'分鐘，逾期最久者'}};
      }
      const h = heroHrs(worstMs);
      return {v:heroNum(h), q:{en:heroPl(h, 'hour past the deadline', 'hours past the deadline'),
                               zh:'小時，逾期最久者'}};
    }
    const d = heroDays(worstMs);
    if(d < 1){
      const h = heroHrs(worstMs);
      return {v:heroNum(h), q:{en:heroPl(h, 'hour past the deadline', 'hours past the deadline'),
                               zh:'小時，逾期最久者'}};
    }
    return {v:heroNum(d), q:{en:heroPl(d, 'day past the deadline', 'days past the deadline'),
                             zh:'天，逾期最久者'}};
  }

  if(b.group === 'today' || b.group === 'week'){
    let leftMs = Infinity;
    b.tasks.forEach(t => {if(t.due != null && t.due - now < leftMs) leftMs = t.due - now;});
    if(!isFinite(leftMs) || leftMs < 0) leftMs = 0;
    if(clocky || b.group === 'today'){
      if(leftMs < 2 * HERO_HR){
        const m = heroMins(leftMs);
        return {v:heroNum(m), q:{en:heroPl(m, 'minute left on the tightest one', 'minutes left on the tightest one'),
                                 zh:'分鐘，最緊迫者剩餘'}};
      }
      const h = heroHrs(leftMs);
      return {v:heroNum(h), q:{en:heroPl(h, 'hour left on the tightest one', 'hours left on the tightest one'),
                               zh:'小時，最緊迫者剩餘'}};
    }
    const d = heroDays(leftMs);
    if(d < 1){
      const h = heroHrs(leftMs);
      return {v:heroNum(h), q:{en:heroPl(h, 'hour left on the tightest one', 'hours left on the tightest one'),
                               zh:'小時，最緊迫者剩餘'}};
    }
    return {v:heroNum(d), q:{en:heroPl(d, 'day left on the tightest one', 'days left on the tightest one'),
                             zh:'天，最緊迫者剩餘'}};
  }

  if(b.group === 'info'){
    return {v:heroNum(n), q:{en:heroPl(n, 'notice, nothing to finish', 'notices, nothing to finish'),
                             zh:'則通知，無須處理'}};
  }
  const subs = Object.keys(b.subjects).length || n;
  return {v:heroNum(subs), q:{en:heroPl(subs, 'record affected, no clock', 'records affected, no clock'),
                              zh:'筆紀錄受影響，無時限'}};
}

function heroBucketSay(b){
  const n = b.tasks.length;
  const kinds = Object.keys(b.kinds);
  if(kinds.length === 1 && HERO_KIND_SAY[kinds[0]]) return HERO_KIND_SAY[kinds[0]](n, b);
  /* Mixed. Name the group honestly, then name the leading kind inside it, so
     the sentence is still about a problem rather than about a container. */
  let lead = kinds[0];
  kinds.forEach(k => {if(b.kinds[k] > b.kinds[lead]) lead = k;});
  const m = b.kinds[lead];
  const base = (HERO_GROUP_SAY[b.group] || HERO_GROUP_SAY.noclock)(n);
  const noun = HERO_KIND_NOUN[lead] ||
    {one:{en:'an item', zh:'項目'}, many:{en:'items', zh:'項目'}};
  const word = m === 1 ? noun.one : noun.many;
  return {
    en: base.en + ', ' + m + ' of them ' + tx0(word, 'en'),
    zh: base.zh + '，其中 ' + m + ' 項為' + tx0(word, 'zh')
  };
}
/* tx() answers in the current language. These two halves are being built side
   by side into one bilingual object, so each half has to name its own. */
function tx0(o, lang){return lang === 'zh' ? o.zh : o.en;}

function heroBucketCta(b){
  const n = b.tasks.length;
  if(b.group === 'info'){
    return {en: n === 1 ? 'Read that one' : 'Read those ' + n,
            zh: '讀取這 ' + n + ' 則'};
  }
  return {en: n === 1 ? 'Open that one' : 'Open those ' + n,
          zh: '開啟這 ' + n + ' 項'};
}

function heroTodayHTML(persona, store, rest){
  const buckets = heroBuckets(persona, store).slice(0, 3);
  const total = tasksFor(persona, store).length;
  let body;
  if(!buckets.length){
    body = '<div class="h-rest"><b>' + esc(tx(rest)) + '</b> ' +
      esc(tx(HERO_COPY.restSub)) + '</div>';
  }else{
    body = '<div class="h-today">' + buckets.map(b => {
      const imp = heroImpact(b);
      return heroCard({
        sev:  heroCardSev(b),
        say:  heroBucketSay(b),
        impv: imp.v,
        impq: imp.q,
        btn:  heroGoBtn({surface:b.surface, filter:b.group}, heroBucketCta(b))
      });
    }).join('') + '</div>';
  }
  const shown = buckets.reduce((a, b) => a + b.tasks.length, 0);
  const count = total
    ? {en: shown + ' of ' + total + ' open items in view',
       zh: '已顯示 ' + shown + ' 項，未完成共 ' + total + ' 項'}
    : {en:'', zh:''};
  return '<div class="h-todayhd"><h2>' + esc(tx(HERO_COPY.today)) + '</h2>' +
    (total ? '<span class="h-count">' + esc(tx(count)) + '</span>' : '') +
    '</div>' + body;
}

/* ---------- need from you, computed ------------------------------------- */
function heroNeedHTML(persona, store){

    const rel = tasksFor('hq', store).filter(t => t.kind === 'report_approval');

   9. MOUNT
   ====================================================================== */

/* Splice the hero into the view that render() just painted, and take the old
   page head out. The view functions are not this agent's to edit, contract
   section 9, and moving nodes rather than re templating is also how
   chrome.js.part folds the shipped markup into the shell.

   :scope is used on every lookup so a nested .wrap inside a drawer or the map
   overlay can never be mistaken for the page's own. */
function heroMount(){
  const app = document.getElementById('app');
  if(!app) return;
  /* The module player is a focus mode with its own head. It gets no hero. */
  if(S.module) return;
  const wrap = app.querySelector('div.wrap');
  if(!wrap) return;
  if(wrap.querySelector(':scope > div#hero')) return;

  /* Built before the page head comes out. If a hero cannot be built, because
     the selected store resolved to nothing, the shipped head has to survive:
     a view with no head and no hero is a blank console. */
  const html = heroHTML();
  if(!html) return;

  const ph = wrap.querySelector(':scope > div.pagehead');
  /* The manager console ships its store switcher inside the page head. If the
     chrome layer is present it owns that control and mounts its own copy in
     the mini nav; if it is not, the control is carried into the hero rather
     than dropped, because a store console with no way to change store is worse
     than a taller hero. */
  const keep = (ph && typeof nvMount !== 'function') ? ph.querySelector('select#storepick') : null;
  if(ph) ph.remove();
  wrap.insertAdjacentHTML('afterbegin', html);

  if(keep){
    const slot = wrap.querySelector(':scope > div#hero div.h-act') ||
                 wrap.querySelector(':scope > div#hero div.h-id');
    if(slot) slot.appendChild(keep);
  }

  const foot = wrap.querySelector(':scope > div.foot');
  if(foot && !foot.querySelector('span.h-footnote')){
    foot.insertAdjacentHTML('beforeend', heroFootNoteHTML());
  }
}

/* ======================================================================
   10. ROUTING OUT OF THE HERO
   ====================================================================== */

/* Every Today button carries a route patch, never a bare navigation. The patch
   is handed to the chrome layer's nvGo when it is present, because that is the
   one function that knows how to set the legacy S.filter for a surface, scroll
   to the right section and move focus. When it is not present the button still
   works, at the cost of the scroll.

   patch.lfilter is the optional legacy S.filter value for surfaces whose own
   list narrows on it. It is applied after nvGo, because nvGo assigns the
   surface default and renders, and a second render is a cheaper price than
   reaching into another agent's module scope to pre empt it. */
function heroGo(patch){
  patch = patch || {};
  const lf = patch.lfilter || null;
  const out = {surface:patch.surface || null, filter:patch.filter || null};
  if(patch.persona) out.persona = patch.persona;

  /* Announced before the route is applied, not after. Contract section 7 wants
     every count that changes on interaction to reach #live, and the counts do
     not move on a navigation, so saying it first costs nothing and survives
     whatever the routing layer does with the render that follows. */
  const c = taskCount(S.persona, S.store);
  const lbl = (typeof TASK_GROUP_LABEL !== 'undefined' && out.filter && TASK_GROUP_LABEL[out.filter])
    ? tx(TASK_GROUP_LABEL[out.filter]) : '';
  heroSay(t(S.persona) + ', ' + (lbl ? lbl + ', ' : '') +
    (c.total + ' open'));

  if(typeof nvGo === 'function'){
    nvGo(out);
    if(lf && S.filter !== lf){S.filter = lf; render();}
  }else{
    S.module = null;
    if(out.surface){S.tab = out.surface; S.route.surface = out.surface;}
    S.filter = lf || 'all';
    S.route.filter = out.filter;
    S.route.ctx = null;
    render();
  }
}

/* Capture phase, and only for buttons inside #hero.

   Contract section 3: every closest() here is qualified to a tag, because
   <html> carries data-persona and <body> carries data-view on this project and
   an unqualified closest matched the document root once already.

   Stopping propagation here keeps the floating layer's own data-go handler
   from routing the same click a second time. The chrome layer's capture
   handler is registered on this same node so it still runs, and it already
   returns early for any data-go button that is not inside one of its four
   containers. Buttons carrying data-module are deliberately not touched, so
   the shipped module player keeps receiving them. */
document.addEventListener('click', e => {
  if(!e.target || !e.target.closest) return;
  const b = e.target.closest('button[data-go]');
  if(!b || !b.closest('div#hero')) return;
  e.preventDefault();
  e.stopPropagation();
  let patch = null;
  try{patch = JSON.parse(b.dataset.go || '{}');}catch(err){patch = null;}
  if(patch) heroGo(patch);
}, true);

/* render() is wrapped, not replaced. chrome.js.part wraps it too and captures
   whatever it finds, so in merge order the chain becomes
   shipped render, then this hero mount, then the chrome mount. Replacing it
   would silently drop whichever layer merged first. */
const HERO_BASE_RENDER = render;
render = function(){
  HERO_BASE_RENDER.apply(this, arguments);

/* ---------- derived data ------------------------------------------------- */
function nvSurfList(persona){return NV_SURFACES[persona] || NV_SURFACES.hq;}
function nvFind(persona, key){
  const list = nvSurfList(persona);
  for(let i = 0; i < list.length; i++) if(list[i].k === key) return list[i];
  return null;
}
function nvCtx(persona, store){
  const rs = (typeof ROSTER !== 'undefined' && ROSTER[store]) || [];
  const mgr = rs.filter(e => e.role === 'MGR')[0] || null;
  return {persona:persona, store:store, mgr:mgr, mgrId:mgr ? mgr.id : null, me:S.me || null, meId:S.me ? S.me.id : null};
}
function nvGroupMap(persona, store){
  const m = {};
  taskGroups(persona, store).forEach(g => {g.tasks.forEach(t => {m[t.id] = g.key;});});
  return m;
}
function nvSurfaceKey(){
  const list = nvSurfList(S.persona);
  const has = k => list.some(s => s.k === k);
  if(S.persona === 'mgr' || S.persona === 'emp') return has(S.tab) ? S.tab : list[0].k;
  if(S.route && has(S.route.surface)) return S.route.surface;
  if(has(S.tab)) return S.tab;
  return list[0].k;
}
/* One pass over one persona's open tasks, split by surface, in the task
   engine's own group order. Everything drawn by this file reads from here. */
function nvSurfaceData(persona, store){
  const ctx = nvCtx(persona, store);
  const groups = taskGroups(persona, store);
  return nvSurfList(persona).map(sf => {
    let total = 0, worst = 'info', group = null, gn = 0;
    const tasks = [];
    groups.forEach(g => {
      const mine = g.tasks.filter(t => sf.pick(t, ctx));
      if(!mine.length) return;
      if(group === null){group = g.key; gn = mine.length;}
      total += mine.length;
      mine.forEach(t => {
        tasks.push(t);
        if(t.sev === 'crit') worst = 'crit';
        else if(t.sev === 'warn' && worst !== 'crit') worst = 'warn';
      });
    });
    const phrase = total === 0
      ? (sf.rest ? sf.rest(ctx) : NV_COPY.nothing)
      : nvPhrase(group, gn, total);
    return {sf:sf, ctx:ctx, total:total, group:group, worst:worst, tasks:tasks, phrase:phrase};
  });
}
function nvPhrase(group, n, total){
  const base = (NV_PHRASE[group] || NV_PHRASE.noclock)(n);
  if(total <= n) return base;
  return {en:base.en + ', ' + total + ' ' + NV_COPY.allIn.en,
          zh:''};
}
/* Severity drives the badge, and severity is the task engine's field. The one
   selector that can reach --critical is the crit branch, and clock_expired is
   the only kind the engine allows to carry crit. */
function nvBadgeCls(row){
  if(!row.total) return 'zero';
  if(row.worst === 'crit') return 'crit';
  if(row.group === 'late') return 'late';
  if(row.worst === 'warn') return 'warn';
  return 'info';
}
function nvOpenPhrase(c){
  return {en:'Tasks, ' + c.total + ' open'};
}


/* ---------- need from you ------------------------------------------------ */
function nvNeed(persona, store){
  const all = taskAll();
  const openFor = (kind, p, pred) => all.filter(t => t.kind === kind && taskOpen(t, p) && (!pred || pred(t)));
  if(persona === 'hq'){
    const esc_ = openFor('case_escalated', 'hq').length;
    const rel = openFor('report_approval', 'hq').length;
    const dq = openFor('dq_exception', 'hq').length;
    const pr = openFor('points_review', 'hq').length;
    if(!esc_ && !rel && !dq && !pr) return {en:'Nothing is waiting only on the HR manager right now.'};
    return {en:esc_ + ' escalations need an outcome, ' + pr + ' employees at 3 points or more need a review recorded, ' + rel + ' employee level reports are held for approval, and ' + dq + ' high priority data quality rules have open exceptions.'};
  }
  if(persona === 'cc'){
    const nw = openFor('case_new', 'cc').length;
    const docs = openFor('attendance_doc', 'cc').length;
    if(!nw && !docs) return {en:'Nothing is waiting on the desk. Every contact is picked up and every event is documented.'};
    return {en:nw + ' new contacts have nobody working them and ' + docs + ' attendance events are waiting for documentation.'};
  }
  if(persona === 'mgr'){
    const where = deptName(store);
    const resp = openFor('mgr_response', 'mgr', t => t.store === store).length;
    const docs = openFor('attendance_doc', 'mgr', t => t.store === store).length;
    const tr = openFor('training_overdue', 'mgr', t => t.store === store).length;
    if(!resp && !docs && !tr) return {en:'Nothing in ' + where + ' is waiting on you.'};
    return {en:resp + ' HR cases cannot close until ' + where + ' responds, ' + docs + ' attendance events need documentation, and ' + tr + ' required modules are overdue on the team.'};
  }
  const mine = openFor('training_overdue', 'emp', t => S.me && t.subject.id === S.me.id).length;
  if(!mine) return {en:'Nothing is waiting on you. Your next recertification will appear here when it comes due.'};
  return {en:mine + ' modules are assigned to you and nobody else can complete them for you.'};
}

function nvCrumb(rows){
  const cur = nvSurfaceKey();
  const sf = nvFind(S.persona, cur);
  const row = rows.filter(r => r.sf.k === cur)[0];
  const parts = ['<span class="nv-hide-sm">' + esc(tx(NV_COPY.crumbRoot)) + '</span>',
                 '<span class="nv-hide-sm">' + esc(t(S.persona)) + '</span>',
                 '<b>' + esc(sf ? tx(sf.label) : cur) + '</b>'];
  /* The filter is a crumb you can take off. A navigation that narrows the list
     and gives you no way back to the whole list is a trap, not a shortcut. */
  if(S.route.filter && row){
    parts.push('<button class="nv-clear" data-go="' + esc(JSON.stringify({surface:cur})) +
      '" aria-label="' + esc(tx(NV_COPY.clearFilter) + ', ' +
        tx(TASK_GROUP_LABEL[S.route.filter] || NV_COPY.nothing)) + '"><b>' +
      esc(tx(TASK_GROUP_LABEL[S.route.filter] || NV_COPY.nothing)) + '</b>' +
      nvIcon('x', 13) + '</button>');
  }
  if(S.module) parts.push('<b>' + esc(S.module) + '</b>');
  /* The separator travels WITH the crumb that follows it, rather than being
     joined between crumbs. Joining left the separators behind when .nv-hide-sm
     took the first two crumbs away on a phone, so the trail rendered as
     "/ / Action queue". A separator is part of its crumb, not a thing between
     two crumbs, and marking it up that way is what makes hiding a crumb hide
     its separator with it. */
  const marked = parts.map((p, i) => i === 0 ? p
    : '<span class="nv-cr' + (/nv-hide-sm/.test(p) ? ' nv-hide-sm' : '') + '">' +
      '<span class="nv-sep" aria-hidden="true">/</span>' + p + '</span>');
  return '<nav class="nv-crumb" aria-label="' + esc(tx(NV_COPY.crumbRoot)) + '">' +
    marked.join('') + '</nav>';
}

/* Previous and next walk the loaded queue: this surface, narrowed by whatever
   filter the navigation carried. Somebody working a queue should not have to
   go back to the list between items. */
function nvQueue(){
  const store = S.store, p = S.persona;
  const sf = nvFind(p, nvSurfaceKey());
  const ctx = nvCtx(p, store);
  let list = tasksFor(p, store);
  if(sf && sf.pick) list = list.filter(t => sf.pick(t, ctx));
  if(S.route.filter){
    const gm = nvGroupMap(p, store);
    list = list.filter(t => gm[t.id] === S.route.filter);
  }
  return list;
}

  const cur = i >= 0 ? list[i] : null;

     control says how big it is, not where in it you are. */
  const pos = list.length
    ? (i >= 0 ? (i + 1) + ' / ' + list.length : list.length + ' ' + tx(NV_COPY.inQueue))
    : tx(NV_COPY.queueEmpty);

  if(foot) foot.innerHTML = '<span class="lab">' + esc(tx(NV_COPY.need)) + '</span>' +
    '<span class="txt">' + esc(tx(nvNeed(S.persona, S.store))) + '</span>';
}

let NV_MEGA_OPENER = null;
function nvMegaOpen(trigger){
  nvMegaMount();
  const p = document.getElementById('meganav');
  if(!p) return;
  NV_MEGA_OPENER = trigger || document.activeElement;
  nvMegaFill();
  p.hidden = false;
  S.nav.mega = true;
  const btn = document.querySelector('button[data-mega="open"]');
  if(btn) btn.setAttribute('aria-expanded', 'true');
  const f = p.querySelectorAll(FOCUSABLE);
  if(f.length) f[0].focus();
  nvLiveSay(tx(NV_COPY.megaLabel));
}
function nvMegaClose(restore){
  const p = document.getElementById('meganav');
  S.nav.mega = false;
  if(p) p.hidden = true;
  const btn = document.querySelector('button[data-mega="open"]');
  if(btn) btn.setAttribute('aria-expanded', 'false');
  /* Focus returns to the control that opened the panel, contract section 7.
     render() rebuilds the top bar, so the original node may be detached by now,
     in which case its replacement is the honest destination. Deliberately no
     offsetParent test: the trigger sits in a position:sticky bar and offsetParent
     is unreliable there. */
  if(restore){
    const back = (NV_MEGA_OPENER && document.contains(NV_MEGA_OPENER)) ? NV_MEGA_OPENER : btn;
    if(back && back.focus) back.focus();
  }
  NV_MEGA_OPENER = null;
}
/* Tab cycles inside the panel while it is open, contract section 7. FOCUSABLE
   is the selector the shipped drawer already uses, reused rather than forked so
   the two traps cannot drift. */
function nvTrap(e){
  const p = document.getElementById('meganav');
  if(!p || p.hidden || e.key !== 'Tab') return;
  const f = [].slice.call(p.querySelectorAll(FOCUSABLE)).filter(el => el.offsetParent !== null);
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){e.preventDefault(); last.focus();}
  else if(!e.shiftKey && document.activeElement === last){e.preventDefault(); first.focus();}
}
/* Escape is layered: the palette takes it first, then the inbox, then the mega
   panel. The shipped incident drawer and the full screen map overlay are inner
   layers too. S.nav is the contract's flag for the first two, and the other two
   are read off the DOM state their own code already sets. */
function nvInnerOpen(){
  if(S.nav && (S.nav.palette || S.nav.inbox)) return true;
  const d = document.getElementById('drawer');
  if(d && d.classList.contains('on')) return true;
  return false;
}

/* ---------- live region, contract section 7 ------------------------------ */

/* #app is repainted by innerHTML, so a live region inside it is a brand new
   node every time and announces nothing. This one lives on <body> and only its
   text changes. */
function nvLiveEl(){
  let a = document.getElementById('live');
  if(!a){
    a = document.createElement('div');
    a.id = 'live';
    a.className = 'vh';
    a.setAttribute('role', 'status');
    a.setAttribute('aria-live', 'polite');
    document.body.appendChild(a);
  }
  return a;
}
function nvLiveSay(msg){nvLiveEl().textContent = msg;}

/* ---------- navigation ---------------------------------------------------- */

let NV_SCROLL = null, NV_FOCUS = null;

function nvGo(patch){
  patch = patch || {};
  if(patch.persona && patch.persona !== S.persona){
    if(!nvCanEnter(S.persona, patch.persona)) return;
    S.persona = patch.persona;
    if(typeof closeDrawer === 'function') closeDrawer();
  }
  S.module = null;
  const sf = nvFind(S.persona, patch.surface) || nvSurfList(S.persona)[0];
  if(sf){
    S.route.surface = sf.k;
    S.tab = sf.k;                       /* mgr views read S.tab, the rest ignore it */
    S.filter = sf.setFilter || 'all';   /* the loaded filter, teardown section 1 */
    NV_SCROLL = sf.k;
    NV_FOCUS = 'nav#subnav button[data-tab="' + sf.k + '"]';
  }
  S.route.persona = S.persona;
  S.route.filter = patch.filter || null;
  S.route.ctx = null;
  nvMegaClose(false);
  render();
}
function nvOpenSubject(task){
  const s = task.subject;
  if(s.type === 'case' && typeof caseDrawer === 'function') return caseDrawer(s.id);
  if(s.type === 'employee' && typeof empDrawer === 'function') return empDrawer(s.id);
  if(s.type === 'attendance' && typeof attReviewDrawer === 'function') return attReviewDrawer(s.emp);
  if(s.type === 'leave' && typeof leaveDrawer === 'function') return leaveDrawer(s.id);
  if(s.type === 'dqrule' && typeof dqDrawer === 'function') return dqDrawer(s.id);
  if(s.type === 'report' && typeof reportDrawer === 'function') return reportDrawer(s.id);
  if(typeof deptDrawer === 'function') return deptDrawer(s.store || S.store);
}
function nvStep(dir){
  const list = nvQueue();
  if(!list.length) return;
  let i = -1;
  for(let n = 0; n < list.length; n++) if(list[n].id === S.route.ctx) i = n;
  i = i < 0 ? (dir > 0 ? 0 : list.length - 1) : i + dir;
  if(i < 0) i = 0;
  if(i >= list.length) i = list.length - 1;
  const task = list[i];
  S.route.ctx = task.id;
  NV_FOCUS = 'div#mininav button[data-nvstep="' + (dir > 0 ? '1' : '-1') + '"]';
  nvLiveSay(tx(NV_COPY.item) + ' ' + (i + 1) + ' / ' + list.length + ', ' + tx(task.title));
  render();
  nvOpenSubject(task);
}

/* ---------- mount --------------------------------------------------------- */

/* The top bar is extended in place rather than re-templated, because the bell
   inside it belongs to the inbox agent and re-templating would silently take
   ownership of somebody else's markup. */
function nvTopbar(bar){
  const c = taskCount(S.persona, S.store);
  const mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
  const brand = bar.querySelector('div.brand');
  if(brand && !bar.querySelector('button[data-mega]')){
    brand.insertAdjacentHTML('afterend',
      /* aria-expanded is seeded from state, not from a literal. render() rebuilds
         the whole top bar, and a panel that is open while its trigger insists it
         is closed is worse than no trigger at all. */
      '<button class="nv-tb" data-mega="open" aria-expanded="' + (S.nav.mega ? 'true' : 'false') +
      '" aria-haspopup="dialog"' +
      ' aria-label="' + esc(tx(NV_COPY.menuOpen)) + '">' + nvIcon('grid', 18) +
      '<span class="nv-lbl">' + esc(tx(NV_COPY.menu)) + '</span>' +
      (c.total ? '<span class="nv-tbn" aria-hidden="true">' + c.total + '</span>' : '') + '</button>');
  }else{
    const b = bar.querySelector('button[data-mega]');
    if(b){
      const n = b.querySelector('span.nv-tbn');
      if(c.total && n) n.textContent = c.total;
      b.setAttribute('aria-expanded', S.nav.mega ? 'true' : 'false');
    }
  }
  const ctl = bar.querySelector('div.chrome-ctl');
  if(ctl && !ctl.querySelector('button[data-palette]')){
    const html = '<button class="nv-tb" data-palette="1" aria-label="' + esc(tx(NV_COPY.searchHint)) +
      '">' + nvIcon('find', 18) + '<span class="nv-lbl">' + esc(tx(NV_COPY.search)) + '</span>' +
      /* Spelled out rather than the command glyph: the font stack is Noto Sans
         plus Noto Sans TC and neither carries U+2318, so the glyph renders as
         tofu on a plain Linux box. */
      '<span class="nv-kbd" aria-hidden="true">' + (mac ? 'Cmd K' : 'Ctrl K') + '</span></button>';
    const bell = ctl.querySelector('button.bell');
    if(bell) bell.insertAdjacentHTML('beforebegin', html);
    else ctl.insertAdjacentHTML('beforeend', html);
  }
}

let NV_LAST_TOTAL = null, NV_LAST_PERSONA = null;

function nvMount(){
  const app = document.getElementById('app');
  if(!app) return;
  const bar = app.querySelector('div.topbar');
  const proto = app.querySelector('div.protobar');
  if(!bar || !proto) return;
  if(!bar.id) bar.id = 'topbar';
  nvTopbar(bar);

  /* Wrap everything below the proto banner into the shell flex column. Done by
     moving nodes rather than by re-templating the views, because this file is
     not allowed to edit them and because moving preserves the map's detached
     WebGL node the same way the shipped code relies on. */
  let shell = app.querySelector('div#shell');
  if(!shell){
    shell = document.createElement('div');
    shell.id = 'shell';
    const rail = document.createElement('nav');
    rail.id = 'railnav';
    const col = document.createElement('div');
    col.className = 'nv-col';
    const stack = document.createElement('div');
    stack.className = 'nv-stack';
    const sub = document.createElement('nav');
    sub.id = 'subnav';
    const mini = document.createElement('div');
    mini.id = 'mininav';
    stack.appendChild(sub);
    stack.appendChild(mini);
    col.appendChild(stack);
    shell.appendChild(rail);
    shell.appendChild(col);
    let n = proto.nextSibling;
    while(n){const nx = n.nextSibling; col.appendChild(n); n = nx;}
    app.appendChild(shell);
  }
  const rail = shell.querySelector('nav#railnav');
  const col = shell.querySelector('div.nv-col');
  const stack = shell.querySelector('div.nv-stack');
  const sub = shell.querySelector('nav#subnav');
  const mini = shell.querySelector('div#mininav');

  /* The persona can change without going through nvGo, because the top bar
     segmented control is the shipped handler's and stays that way. A loaded
     filter belongs to the surface it was loaded from, so it does not survive a
     move to a different console: leaving it behind made the breadcrumb claim a
     narrowing that was no longer being applied to anything. */
  if(S.route.persona !== S.persona){
    S.route.persona = S.persona;
    S.route.surface = null;
    S.route.filter = null;
    S.route.ctx = null;
  }
  S.route.surface = nvSurfaceKey();
  shell.setAttribute('data-rail', S.nav.rail);
  rail.setAttribute('aria-label', t(S.persona) + ' ' + tx(NV_COPY.surfaces));

  const rows = nvSurfaceData(S.persona, S.store);
  rail.innerHTML = nvRailHTML(rows);
  sub.innerHTML = nvSubnavHTML(rows);

  /* Fold the manager console's own store picker in. Two elements with the same
     id is invalid markup and the shipped change handler keys on that id, so the
     duplicate is removed before this one is written. */
  col.querySelectorAll('select#storepick').forEach(el => {
    if(!el.closest('div#mininav')) el.remove();
  });
  mini.innerHTML = nvMininavHTML(rows);

  /* The module player is a focus mode: it owns the whole column and has its own
     exit. The rail stays so there is always a way out. */
  stack.hidden = !!S.module;

  /* Every sticky offset in the stylesheet is measured from these two, so a
     banner that wraps to two lines on a narrow screen moves the whole stack
     instead of hiding the tabs behind it. */
  const pb = proto.offsetHeight;
  if(pb && String(pb) !== String(nvMount._pb)){
    nvMount._pb = pb;
    document.documentElement.style.setProperty('--pb-h', pb + 'px');
  }

  /* Contract section 7: every count that changes on interaction reaches #live. */
  const c = taskCount(S.persona, S.store);
  if(NV_LAST_TOTAL !== null && (c.total !== NV_LAST_TOTAL || S.persona !== NV_LAST_PERSONA)){
    nvLiveSay(t(S.persona) + ', ' + tx(nvOpenPhrase(c)));
  }
  NV_LAST_TOTAL = c.total;
  NV_LAST_PERSONA = S.persona;

  if(NV_FOCUS){
    const sel = NV_FOCUS;
    NV_FOCUS = null;
    try{const el = document.querySelector(sel); if(el) el.focus();}catch(err){}
  }
  if(NV_SCROLL){
    const key = NV_SCROLL;
    NV_SCROLL = null;
    const sf = nvFind(S.persona, key);
    const soft = typeof REDUCED === 'function' && REDUCED() ? 'auto' : 'smooth';
    let target = null;
    if(sf && sf.sec != null){
      target = typeof sf.sec === 'string'
        ? col.querySelector(sf.sec)
        : col.querySelectorAll('div.wrap > section')[sf.sec];
    }
    if(target) target.scrollIntoView({block:'start', behavior:soft});
    else window.scrollTo({top:0, behavior:soft});
  }
}

/* ---------- events -------------------------------------------------------- */

/* Capture, and propagation stops here. Every nav button also carries data-tab
   so the shipped delegated handler recognises it, but that handler forces
   S.filter back to 'all', which would throw away the loaded filter this whole
   design exists to carry. Taking the click in the capture phase does the entire
   job in one render instead of two.
   Every closest() below is qualified to a tag: <html> carries data-persona and
   <body> carries data-view on this project, and a bare closest() matched the
   document root once already and ate every toggle click on the page. */
document.addEventListener('click', e => {
  if(!e.target.closest) return;
  const go = e.target.closest('button[data-go]');
  if(!go) return;
  /* data-go is the contract's shared nav attribute and the floating layer uses
     it too, for the mobile bottom rail, with its own patch vocabulary. Stopping
     propagation on every data-go button in the document would swallow that rail
     whole. So this only claims the four containers this file owns, and every
     other data-go click travels on untouched. */
  const mine = go.closest('nav#subnav') || go.closest('nav#railnav') ||
               go.closest('div#meganav') || go.closest('div#mininav');
  if(!mine) return;
  e.preventDefault();
  e.stopPropagation();
  if(go.getAttribute('aria-disabled') === 'true') return;
  let patch = {};
  try{patch = JSON.parse(go.dataset.go || '{}');}catch(err){patch = {};}
  nvGo(patch);
}, true);

document.addEventListener('click', e => {
  if(!e.target.closest) return;
  const T = s => e.target.closest(s);
  let el;

  if(el = T('button[data-mega]')){
    if(el.dataset.mega === 'close' || S.nav.mega) nvMegaClose(true);
    else nvMegaOpen(el);
    return;
  }
  /* The palette belongs to another layer. This is the trigger, not the thing. */
  if(T('button[data-palette]')){
    document.dispatchEvent(new CustomEvent('palette:open', {detail:{source:'topbar'}}));
    return;
  }
  if(T('button[data-railtog]')){
    S.nav.rail = S.nav.rail === 'icons' ? 'open' : 'icons';
    window.PREFS.rail = S.nav.rail;
    const shell = document.getElementById('shell');
    if(shell) shell.setAttribute('data-rail', S.nav.rail);
    NV_FOCUS = 'nav#railnav button[data-railtog]';
    render();
    return;
  }
  if(el = T('button[data-nvstep]')){
    if(!el.disabled) nvStep(+el.dataset.nvstep);
    return;
  }
  /* The panel's own backdrop. Clicks inside land on .nv-mega-in or deeper. */
  if(e.target.id === 'meganav'){nvMegaClose(true); return;}
  /* The language choice persists, contract section 1. The shipped handler owns
     the switch itself; this only records the preference. */
  if(el = T('button[data-lang]')){window.PREFS.lang = el.dataset.lang; return;}
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    const p = document.getElementById('meganav');
    if(!p || p.hidden) return;
    if(nvInnerOpen()) return;
    e.stopPropagation();
    nvMegaClose(true);
    return;
  }
  nvTrap(e);
}, true);

/* ---------- boot ---------------------------------------------------------- */

/* render() is wrapped rather than replaced. Other part files wrap it too, and
   each one capturing the current value composes cleanly in merge order. */
const NV_BASE_RENDER = render;
render = function(){
  NV_BASE_RENDER.apply(this, arguments);
  nvMount();
};

function nvBoot(){
  nvLiveEl();
  nvMegaMount();
  S.nav.rail = window.PREFS.rail || 'open';
  render();
}
nvBoot();

   Kept from /tawa: named groups with eyebrow labels in the rail, sub tabs
   under the active row for controls that only narrow one list, the queue
   filter made real, the task inbox as a rail destination, and the sub nav
   hidden while the rail shows labels so no control appears twice.
   ========================================================================== */

const HQ_COPY = {
  console:  {en:'HR Manager'},
  gToday:   {en:'Today'},
  gCall:    {en:'Call center'},
  gWork:    {en:'Workforce'},
  gPeople:  {en:'People'},
  gData:    {en:'Data'},
  gLead:    {en:'Leadership'},
  inbox:    {en:'Task inbox'},
  inboxRest:n => ({en:n + ' open across every surface of this console'}),
  all:      {en:'Everything'},
  steps:    {en:'Assignment steps'},
  filters:  {en:'Queue filters'},
  showAll:  (n, all) => ({en:'Showing ' + n + ' of ' + all + ' open cases. Escalations first, then tightest SLA, not recency.'}),
  showBand: (n, m, k, band) => ({en:'Showing ' + n + ' of ' + m + ' cases, which carry the ' + k + ' items ' + band.en.charAt(0).toLowerCase() + band.en.slice(1) + '. Escalations first, then tightest SLA.'}),
  none:     {en:'Nothing in the queue matches this filter right now.'},
  queue:    {en:'Action queue'}
};
const HQ_STEPS = [
  {v:'target',  n:1, label:{en:'Target'}},
  {v:'gap',     n:2, label:{en:'Shortfall'}},
  {v:'message', n:3, label:{en:'Message'}},
  {v:'review',  n:4, label:{en:'Dry run'}},
  {v:'history', n:5, label:{en:'History'}}
];
/* ---------- icons -------------------------------------------------------- */

/* The icon agent delivers ic(name, size) in icons.js.part and nvIcon
   delegates to it. 16px, not 20px: the reference draws 13.5px icons beside
   12px labels, and 20px beside a 12px label reads as an icon with a caption.

   ic() answers every name, because an unknown one falls back to IC.dot, so
   asking it for a name it does not have returns a filled circle rather than
   nothing. That is how "Task inbox" first shipped here as a bullet. So the
   family is asked whether it knows the name before it is asked to draw it,
   and the one name it does not have is drawn below, at the family's own
   stroke width for the size, so it does not read lighter than its neighbours.

   The drawing: the same tray the queue uses, with three stacked lines above
   it rather than one card inside it. The queue is the thing you empty; the
   inbox is everything that arrived, in one pile. */
const HQ_INBOX_PATH =
  '<path d="M3.4 14.2h4.1l1.5 2.4h6l1.5-2.4h4.1"/>' +
  '<path d="M3.4 14.2 5.9 8.4h12.2l2.5 5.8v4.6a1.4 1.4 0 0 1-1.4 1.4H4.8a1.4 1.4 0 0 1-1.4-1.4z"/>' +
  '<path d="M8.4 5.6h7.2M9.9 2.9h4.2"/>';
function hqKnowsIcon(name){
  if(typeof IC === 'undefined' || !IC) return false;
  const key = (typeof IC_ALIAS !== 'undefined' && IC_ALIAS && IC_ALIAS[name]) || name;
  return Object.prototype.hasOwnProperty.call(IC, key);
}
function hqIcon(name, size){
  const s = size || 16;
  if(typeof ic === 'function' && hqKnowsIcon(name)) return ic(name, s);
  if(name === 'inbox'){
    /* icStroke is the family's rendered pixel curve. Without it, 1.7 user
       units is the value chrome.js.part draws at, which is the right
       neighbour to match when the family has not landed. */
    const w = typeof icStroke === 'function' ? icStroke(s) : 1.7;
    return '<svg class="ic ic-inbox nv-ic" viewBox="0 0 24 24" width="' + s + '" height="' + s +
      '" fill="none" stroke="currentColor" stroke-width="' + w + '" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true" focusable="false">' + HQ_INBOX_PATH + '</svg>';
  }
  if(typeof ic === 'function') return ic(name, s);
  if(typeof nvIcon === 'function') return nvIcon(name, s);
  return '';
}

/* ---------- surface model patch ------------------------------------------ */
let HQ_PATCHED = false;
function hqPatchSurfaces(){
  if(HQ_PATCHED) return;
  if(typeof NV_SURFACES === 'undefined' || !NV_SURFACES.hq) return;
  HQ_PATCHED = true;
  const list = NV_SURFACES.hq;
  list.forEach(sf => {sf.sec = null;});
  if(!list.some(s => s.k === 'inbox')){
    list.splice(1, 0, {k:'inbox', icon:'inbox', sec:null, label:HQ_COPY.inbox, pick:() => false,
      rest:() => HQ_COPY.inboxRest(typeof taskCount === 'function' ? taskCount('hq', S.store).total : 0)});
  }
}

/* ---------- the groups --------------------------------------------------- */
const HQ_GROUPS = [
  {k:'today',  label:HQ_COPY.gToday,  items:['queue', 'inbox']},
  {k:'call',   label:HQ_COPY.gCall,   items:['callcenter', 'attendance']},
  {k:'work',   label:HQ_COPY.gWork,   items:['workforce', 'leave']},
  {k:'people', label:HQ_COPY.gPeople, items:['recruiting', 'training', 'comp']},
  {k:'data',   label:HQ_COPY.gData,   items:['quality', 'reporting']},
  {k:'lead',   label:HQ_COPY.gLead,   items:['exec', 'approach']}
];

/* ---------- sub tabs ----------------------------------------------------- */
function hqSubTabs(key){
  if(key === 'queue') return hqQueueTabs();
  if(key === 'training') return hqCampTabs();
  return null;
}
function hqQueueTabs(){
  if(typeof taskGroups !== 'function' || typeof nvFind !== 'function') return null;
  const sf = nvFind('hq', 'queue');
  if(!sf) return null;
  const ctx = nvCtx('hq', S.store);
  const groups = taskGroups('hq', S.store);
  let all = 0;
  const out = [];
  groups.forEach(g => {
    const n = g.tasks.filter(t => sf.pick(t, ctx)).length;
    all += n;
    if(!n) return;
    out.push({kind:'filter', v:g.key, label:g.label, count:n,
              on:S.route && S.route.filter === g.key});
  });
  out.unshift({kind:'filter', v:'', label:HQ_COPY.all, count:all,
               on:!(S.route && S.route.filter)});
  return {label:HQ_COPY.filters, tabs:out};
}

function hqCampTabs(){
  if(typeof S.campaign !== 'object' || !S.campaign) return null;
  if(S.route.filter) return null;
  /* Counts only where a count is a fact rather than a decoration. History
     knows how many campaigns have run. Shortfall knows how many modules the
     current rule is short of, and campSelect is the same call campaignUI
     already makes on this paint, so asking again costs one pass over a list
     that is already warm. Everything else has no number and gets none. */
  let gap = 0;
  try{ gap = (typeof campSelect === 'function' ? campSelect().courses.length : 0); }
  catch(err){ gap = 0; }
  const hist = (typeof CAMPAIGNS !== 'undefined' && CAMPAIGNS) ? CAMPAIGNS.length : 0;
  return {label:HQ_COPY.steps, tabs:HQ_STEPS.map(s => ({
    kind:'ctab', v:s.v, n:s.n, label:s.label,
    count:s.v === 'gap' ? gap : s.v === 'history' ? hist : 0,
    on:S.campaign.ctab === s.v
  }))};
}
/* ---------- rail markup -------------------------------------------------- */

function hqRowHTML(r, cur, subs){
  const on = r.sf.k === cur;
  const cls = typeof nvBadgeCls === 'function' ? nvBadgeCls(r) : 'zero';
  const name = tx(r.sf.label) + ', ' + tx(r.phrase);
  const badge = r.sf.k === 'inbox'
    ? ''   /* see hqPatchSurfaces: the inbox does not carry a second copy of
              the same count. Its total is in the accessible name. */
    : '<span class="nv-b ' + cls + '" aria-hidden="true">' + r.total + '</span>';
  /* The inbox row is the one destination that is a page rather than a surface,
     and it cannot travel through data-go. inbox.js.part wraps nvGo with
     `IBX.page = false` so that any navigation leaves the page, which is
     correct and is also why routing INTO it through nvGo sets the flag and
     then immediately clears it. Measured: the rail marked the row current and
     the page never mounted. So this row carries its own attribute and calls
     the inbox's own opener, which is the same door the bell uses. */
  const act = r.sf.k === 'inbox'
    ? ' data-hqpage="inbox"'
    : ' data-tab="' + esc(r.sf.k) + '" data-go="' +
      esc(JSON.stringify({surface:r.sf.k, filter:null})) + '"';
  let out = '<button class="nv-ritem hq-item" id="hqi-' + esc(r.sf.k) + '"' + act +
    (on ? ' aria-current="page"' : '') +
    ' aria-label="' + esc(name) + '">' + hqIcon(r.sf.icon, 16) +
    '<span class="nv-rlabel">' + esc(tx(r.sf.label)) + '</span>' + badge + '</button>';
  if(on && subs && subs.tabs.length > 1){
    out += '<div class="hq-subs" role="group" aria-label="' + esc(tx(subs.label)) + '">' +
      subs.tabs.map(s => hqSubBtnHTML(s, 'rail')).join('') + '</div>';
  }
  return out;
}

/* A sub tab is a control, not an ornament. aria-current marks the live one,
   the count is in the accessible name rather than left to a decorative span,
   and the button is a button so the keyboard reaches it in DOM order right
   under its parent. */
function hqSubBtnHTML(s, where){
  const n = s.count ? ', ' + s.count : '';
  const num = s.n ? '<span class="hq-sn mono" aria-hidden="true">' + s.n + '</span>' : '';
  return '<button class="hq-sub" id="' + esc('hqs-' + where + '-' + s.kind + '-' + (s.v || 'all')) +
    '" data-hqsub="' + esc(s.kind + ':' + s.v) + '"' +
    ' data-hqwhere="' + esc(where) + '"' +
    (s.on ? ' aria-current="true"' : '') +
    ' aria-label="' + esc(tx(s.label) + n) + '">' + num +
    '<span class="hq-sl">' + esc(tx(s.label)) + '</span>' +
    (s.count ? '<span class="hq-sc mono" aria-hidden="true">' + s.count + '</span>' : '') +
    '</button>';
}

function hqRailHTML(rows){
  const cur = typeof nvSurfaceKey === 'function' ? nvSurfaceKey() : 'queue';
  const subs = hqSubTabs(cur);
  const by = {};
  rows.forEach(r => {by[r.sf.k] = r;});
  const groups = HQ_GROUPS.map(g => {
    const items = g.items.map(k => by[k]).filter(Boolean);
    if(items.length < 2) return '';   /* a group of one is not a group */
    return '<div class="hq-grp" role="group" aria-labelledby="hqg-' + esc(g.k) + '">' +
      '<p class="hq-eyebrow" id="hqg-' + esc(g.k) + '">' + esc(tx(g.label)) + '</p>' +
      items.map(r => hqRowHTML(r, cur, subs)).join('') + '</div>';
  }).join('');
  const collapsed = S.nav.rail === 'icons';
  const tog = '<button class="nv-rtog" data-railtog="1" aria-pressed="' +
    (collapsed ? 'true' : 'false') + '" aria-label="' +
    esc(tx(collapsed ? NV_COPY.expand : NV_COPY.collapse)) + '">' +
    hqIcon('panel', 16) + '<span>' +
    esc(tx(collapsed ? NV_COPY.expand : NV_COPY.collapse)) + '</span></button>';
  return '<div class="nv-rhead">' + esc(tx(HQ_COPY.console)) + '</div>' + groups + tog;
}

/* ---------- the second home for the sub tabs ------------------------------

   THE DECISION, stated because the brief asks for it: the sub tabs live in
   the rail, and the rail is the only place they live while it is showing
   labels. The sub nav bar is hidden on this console at that width, because
   the audit found it already duplicates all five rail items exactly.

   Below 1120px the rail collapses to a 64px icon strip and below 900px it is
   gone entirely, and at those widths a sub tab indented under a rail row has
   nowhere to be. So the sub nav bar comes back, and this row of sub tabs
   comes with it, directly under it. The two are mutually exclusive by
   viewport: at no width does the same control appear twice. The CSS that
   enforces that is one media query in console-hq.css.part and it is written
   against the same 1120 and 900 the contract's breakpoints already use. */
function hqSubRowHTML(subs){
  if(!subs || subs.tabs.length < 2) return '';
  return '<div id="hqsubs" role="group" aria-label="' + esc(tx(subs.label)) + '">' +
    subs.tabs.map(s => hqSubBtnHTML(s, 'bar')).join('') + '</div>';
}

/* ---------- the queue filter, made real ---------------------------------- */
function hqQueueIds(band){
  if(typeof taskGroups !== 'function') return null;
  const sf = nvFind('hq', 'queue');
  if(!sf) return null;
  const ctx = nvCtx('hq', S.store);
  const seen = {};
  taskGroups('hq', S.store).forEach(g => {
    if(band && g.key !== band) return;
    g.tasks.forEach(t => {
      if(!sf.pick(t, ctx)) return;
      if(t.subject && t.subject.type === 'case') seen[t.subject.id] = 1;
    });
  });
  return seen;
}
function hqQueueRepaint(){
  if(S.route.surface !== 'queue') return;
  if(typeof sortedCases !== 'function' || typeof caseRow !== 'function') return;
  const col = document.querySelector('div#shell div.nv-col');
  if(!col) return;
  const body = col.querySelector('div.wrap section div.card table.tbl tbody');
  if(!body) return;
  const band = S.route.filter || null;
  const all = sortedCases();
  const ids = band ? hqQueueIds(band) : null;
  const list = ids ? all.filter(i => ids[i.id]) : all;
  const show = list.slice(0, 12);
  if(!show.length){
    const cols = body.previousElementSibling ? body.previousElementSibling.querySelectorAll('th').length : 8;
    body.innerHTML = '<tr><td colspan="' + cols + '" class="hq-qempty">' + esc(tx(HQ_COPY.none)) + '</td></tr>';
  }else{
    body.innerHTML = show.map(caseRow).join('');
  }
  const hint = col.querySelector('div.wrap section div.card div.hint');
  if(!hint) return;
  if(!band){hint.textContent = tx(HQ_COPY.showAll(show.length, all.length)); return;}
  const sf = nvFind('hq', 'queue');
  const ctx = nvCtx('hq', S.store);
  let items = 0;
  taskGroups('hq', S.store).forEach(g => {if(g.key !== band) return; items = g.tasks.filter(t => sf.pick(t, ctx)).length;});
  const lab = (typeof TASK_GROUP_LABEL !== 'undefined' && TASK_GROUP_LABEL[band]) || HQ_COPY.all;
  hint.textContent = tx(HQ_COPY.showBand(show.length, list.length, items, lab));
}
function hqCampPanelAria(){
  if(S.route.surface !== 'training') return;
  const panel = document.getElementById('camp-panel');
  if(!panel) return;
  const list = document.querySelector('div.camp div.tabs.cimt');
  if(list && getComputedStyle(list).display !== 'none') return;
  /* Both sets are in the DOM at all times and CSS decides which one is on
     screen, so the label has to name the one the user can actually see.
     offsetParent is null for a display:none subtree, which is the cheapest
     visibility test that is true here. */
  const on = [].slice.call(document.querySelectorAll('button.hq-sub[aria-current="true"]'))
    .filter(el => el.offsetParent !== null)[0];
  panel.setAttribute('role', 'region');
  if(on && on.id) panel.setAttribute('aria-labelledby', on.id);
}
/* ---------- mount --------------------------------------------------------- */

let HQ_FOCUS = null;

function hqMount(){
  const shell = document.getElementById('shell');
  if(!shell) return;
  const rail = shell.querySelector('nav#railnav');
  const stack = shell.querySelector('div.nv-stack');

  /* Every other console is left exactly as the chrome layer built it. This
     file owns one persona and touches nothing else, which is the whole point
     of keeping the consoles separate rather than merging them. */
  if(S.persona !== 'hq'){
    shell.removeAttribute('data-hqrail');
    if(rail) rail.removeAttribute('data-console');
    const old = shell.querySelector('div#hqsubs');
    if(old) old.remove();
    return;
  }

  hqPatchSurfaces();
  if(!rail) return;
  shell.setAttribute('data-hqrail', 'on');
  rail.setAttribute('data-console', 'hq');

  const rows = typeof nvSurfaceData === 'function' ? nvSurfaceData('hq', S.store) : [];
  if(rows.length) rail.innerHTML = hqRailHTML(rows);

  if(stack){
    const old = stack.querySelector('div#hqsubs');
    if(old) old.remove();
    const cur = typeof nvSurfaceKey === 'function' ? nvSurfaceKey() : 'queue';
    const html = hqSubRowHTML(hqSubTabs(cur));
    /* Directly under the sub nav, not under the breadcrumb. A filter row
       below the crumb reads as belonging to the crumb, and the crumb is
       already the thing that says which filter is on. */
    const sub = stack.querySelector('nav#subnav');
    if(html && sub) sub.insertAdjacentHTML('afterend', html);
    else if(html) stack.insertAdjacentHTML('beforeend', html);
  }

  hqQueueRepaint();
  hqCampPanelAria();

  /* The chrome layer points its post render focus at
     nav#subnav button[data-tab=...], and on this console that button is
     display:none above 1120px, so focus fell to <body> after every rail
     click. Focusing a hidden element is a no op, so this runs after it and
     puts focus on the control the user actually pressed. */
  if(HQ_FOCUS){
    const sel = HQ_FOCUS;
    HQ_FOCUS = null;
    try{
      const el = document.querySelector(sel);
      if(el && el.offsetParent !== null) el.focus();
    }catch(err){}
  }
}

/* ---------- events -------------------------------------------------------

   Registered on window in the capture phase, which runs before the chrome
   layer's document capture listener. That ordering matters for exactly one
   thing: the inbox page is mounted from a flag read during render, so the
   flag has to be right before the render that the chrome layer is about to
   fire, not after it. Registering on document instead would put this second
   and cost a whole extra paint.

   Every closest() is qualified to a tag. <html> carries no data-persona on
   this build and <body> carries data-view, and a bare closest() has already
   matched the document root once on this project and eaten every toggle
   click on the page. */
window.addEventListener('click', e => {
  if(!e.target || !e.target.closest) return;
  const go = e.target.closest('button[data-go]');
  if(!go) return;
  if(!go.closest('nav#railnav') && !go.closest('nav#subnav') &&
     !go.closest('div#meganav') && !go.closest('div#mininav')) return;
  let patch = {};
  try{ patch = JSON.parse(go.dataset.go || '{}'); }catch(err){ patch = {}; }
  if(patch.persona && patch.persona !== 'hq') return;
  /* Leaving the inbox page needs no work here: inbox.js.part already wraps
     nvGo so that every navigation clears its flag. */
  HQ_FOCUS = 'nav#railnav button[data-tab="' + (patch.surface || '') + '"]';
}, true);

/* The inbox row, and the one page in this rail that is not a surface.

   stopImmediatePropagation, and it is not a shortcut. inbox.js.part runs a
   capture listener of its own whose last clause reads "leaving the full page:
   only navigation leaves it", and it treats any button inside nav#railnav as
   navigation, which is right for the other five rows and exactly wrong for
   this one. Both listeners sit on document, so a plain stopPropagation does
   not reach a sibling on the same node: measured, the page mounted and the
   flag was cleared 1ms later by that clause, and the next repaint for any
   reason dropped the page while the rail still said Task inbox. Stopping the
   immediate chain costs nothing else, because this attribute is declared in
   this file and nothing downstream listens for it. */
document.addEventListener('click', e => {
  if(!e.target || !e.target.closest) return;
  const b = e.target.closest('button[data-hqpage]');
  if(!b || !b.closest('nav#railnav')) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  HQ_FOCUS = 'nav#railnav button[data-hqpage="inbox"]';
  if(typeof ibxGoPage === 'function') ibxGoPage(true);
}, true);

document.addEventListener('click', e => {
  if(!e.target || !e.target.closest) return;
  const b = e.target.closest('button[data-hqsub]');
  if(!b) return;
  const raw = b.dataset.hqsub || '';
  const cut = raw.indexOf(':');
  const kind = cut < 0 ? raw : raw.slice(0, cut);
  const val = cut < 0 ? '' : raw.slice(cut + 1);

  if(kind === 'filter'){
    S.route.filter = val || null;
    S.route.ctx = null;
    if(typeof nvLiveSay === 'function' && typeof TASK_GROUP_LABEL !== 'undefined'){
      nvLiveSay(tx(HQ_COPY.queue) + ', ' +
        tx(val ? (TASK_GROUP_LABEL[val] || HQ_COPY.all) : HQ_COPY.all));
    }
  }else if(kind === 'ctab'){
    /* Not reusing the shipped data-ctab attribute on purpose. Its delegated
       handler ends with camp-panel.scrollIntoView, which is the repositioning
       behaviour this whole pass exists to remove: pressing a step in the left
       rail should swap the panel, not move the page. Same state, same render,
       no scroll. */
    if(!S.campaign) return;
    S.campaign.ctab = val;
    S.campaign.pending = null;
  }else{
    return;
  }
  HQ_FOCUS = 'button[data-hqsub="' + raw.replace(/"/g, '') + '"][data-hqwhere="' +
    (b.dataset.hqwhere || 'rail') + '"]';
  render();
});

/* ---------- boot ---------------------------------------------------------- */

/* render() is wrapped rather than replaced, the same way the chrome layer
   wraps it, so each part capturing the current value composes cleanly in
   merge order. This file is merged after chrome, so hqMount runs after
   nvMount and rewrites a rail that is already built and already correct. */
const HQ_BASE_RENDER = render;
render = function(){
  HQ_BASE_RENDER.apply(this, arguments);
  try{ hqMount(); }catch(err){ /* a console must never take the shell down */ }
};

hqPatchSurfaces();

/* Deferred by one turn rather than called inline. Every part merged after this
   one is still being evaluated on the line below, and the parts that follow
   declare their state with const, which means a render fired from here reaches
   into a temporal dead zone where even `typeof` throws rather than returning
   'undefined'. An exception at this point does not just skip a paint: it
   aborts the rest of the merged script and takes the inbox, the floaters and
   the other console with it. That is not hypothetical, it happened on this
   file, and the whole app booted with no inbox because of it. */
setTimeout(function(){ try{ render(); }catch(err){} }, 0);

/* ---- console-cc ---- */
/* ==========================================================================
   THE CALL CENTER REP CONSOLE
   Built on the /tawa legal console pattern: a grouped rail, a sub nav scoped
   to the current group, one surface per rail item, and every action control
   rendered as <button data-task="T-nnnn">, which the inbox layer already
   handles through taskComplete and the undo toast. This console gets the
   whole engine and adds nothing to it.

   What the rep sees: their own queue, the intake form they run on every
   call, the documentation they owe, what went up to the HR manager, the
   log, and the procedures. Nothing about pay, nothing about leave detail.
   ========================================================================== */

const CC_COPY = {
  console:   {en:'Call center rep'},
  groupToday:{en:'Today'},
  groupWork: {en:'Casework'},
  groupRec:  {en:'Record'},
  inGroup:   {en:'in'},
  none:      {en:'Nothing here yet'},
  sMyqueue:  {en:'Open cases, new and unassigned first, then tightest SLA. Picking one up assigns it and tells the employee somebody has it.'},
  sIntake:   {en:'The form the desk runs on every call. Pick the department, then the employee. Call-off, late arrival, early out or an inquiry. It writes the attendance row, applies the hours the employee asks to use, and opens the case; the dashboards read those rows.'},
  sCoverage: {en:'Every time hours were applied to cover time missed: which bucket, how many, and the balance before and after. This is the ledger payroll reads.'},
  sDocs:     {en:'Attendance events inside 14 days with no documentation on file. Due 48 hours after the shift. Marking one documented clears it for the manager too.'},
  sEsc:      {en:'What went up to the HR manager and why, plus the employee relations tracker. Intake facts only; no finding is recorded here.'},
  sLog:      {en:'Every entry typed at the desk in the last 24 operating hours, by shift: the time it was typed, who typed it, the employee, what was logged, the hours applied and whether the manager was told. Roughly thirty entries a shift across day, swing and graveyard.'},
  sSops:     {en:'The procedures the desk runs on. Owner, version, last update, review status.'}
};

const CC_GROUPS = [
  {k:'today', label:CC_COPY.groupToday},
  {k:'work',  label:CC_COPY.groupWork},
  {k:'rec',   label:CC_COPY.groupRec}
];
const CC_GRP = {myqueue:'today', intake:'today', docs:'work', escalations:'work', coverage:'rec', log:'rec', sops:'rec'};
const CC_BLURB = {myqueue:CC_COPY.sMyqueue, intake:CC_COPY.sIntake, docs:CC_COPY.sDocs, escalations:CC_COPY.sEsc, coverage:CC_COPY.sCoverage, log:CC_COPY.sLog, sops:CC_COPY.sSops};
NV_SURFACES.cc.forEach(s => {s.grp = CC_GRP[s.k]; s.blurb = CC_BLURB[s.k];});
const CC_SURFACES = NV_SURFACES.cc;

function ccSurf(k){return CC_SURFACES.filter(s => s.k === k)[0] || null;}
function ccGroupOf(k){const s = ccSurf(k); return s ? s.grp : CC_GROUPS[0].k;}
function ccKey(){const k = surfKey(); return k || 'myqueue';}
function ccIcon(name, size){
  const s = size || 16;
  try{if(typeof ic === 'function') return ic(name, s);}catch(err){}
  if(typeof nvIcon === 'function') return nvIcon(name, s);

function ccTask(pred){

function ccTaskBtn(task, copy){

function ccOpenBtn(id){return '<button type="button" class="btn ghost sm" data-case="' + esc(id) + '">Open the case</button>';}
function ccMe(){return REPS[0] || null;}

/* ---------- the grouped rail --------------------------------------------- */
const CC_BASE_RAIL = (typeof nvRailHTML === 'function') ? nvRailHTML : null;
const CC_BASE_SUB  = (typeof nvSubnavHTML === 'function') ? nvSubnavHTML : null;
function ccCountHTML(total){if(!total) return ''; return '<span class="lg-n mono" aria-hidden="true">' + total + '</span>';}

    ccIcon('panel', 16) + '<span>' + esc(tx(collapsed ? NV_COPY.expand : NV_COPY.collapse)) + '</span></button>';

nvRailHTML = function(rows){

function ccSubnavHTML(rows){

nvSubnavHTML = function(rows){

/* ---------- surface furniture ------------------------------------------- */
function ccHead(sf){return '<div class="lg-head"><h2>' + esc(tx(sf.label)) + '</h2><p class="lg-blurb">' + esc(tx(sf.blurb)) + '</p></div>';}
function ccEmpty(msg){return '<div class="empty"><b>' + esc(tx(CC_COPY.none)) + '</b>' + esc(tx(msg)) + '</div>';}
/* The employee cell is a button: the name opens the employee record, the row

/* ---------- the surfaces -------------------------------------------------- */
function ccMyQueue(){

  }).join('');

  return ccHead(sf) + newBtn + (mine.length ? '<div class="card lg-card"><div class="tblwrap"><table class="tbl lg-tbl"><thead><tr>' +

    '</tr></thead><tbody>' + rows + '</tbody></table></div><p class="hint lg-hint">' + Math.min(40, mine.length) + ' of ' + mine.length + '. New and unassigned rows sit at the top regardless of SLA, because a case nobody owns has no clock anyone is watching.</p></div>'
    : ccEmpty({en:'Nothing new and nothing assigned to you.'}));
}

/* The coverage panel is repainted alone while the minutes field is typed in,
   so the caret stays put. It is a pure function of S.intake. */
function intakeCoverHTML(){
  const f = S.intake; const p = intakePlan(); if(!p) return '';

  const label_ = f.type === 'calloff' ? 'the ' + SHIFT_HOURS + ' hour shift' : f.minutes + ' min ' + label(ATT_TYPES, f.type).toLowerCase();
  const fm = e.fmla; const fmH = fm ? (bal.fmla || 0) : 0;

  const opt = (k, name, h, note, avail) => '<button class="cx-opt' + (f.bucket === k ? ' on' : '') + (avail ? '' : ' off') + '" data-ibucket="' + k + '" aria-pressed="' + (f.bucket === k) + '"' + (avail ? '' : ' aria-disabled="true"') + '><span class="k">' + esc(name) + '</span><span class="h">' + (h == null ? 'no balance' : h.toFixed(2) + ' h') + '</span><span class="n">' + note + '</span></button>';

/* Employee suggestions. Empty query: the people most recently logged at the
   desk (they call back), then the alphabet. Typed query: name or ID matches,
   a word that starts with the query first, then anywhere in the name. At most
   eight rows so the list never needs a scrollbar; typing narrows it. */
function intakePool(){
  const f = S.intake;
  return EMP.filter(x => x.status === 'active' && x.dept && x.dept !== 'HR' && !x.dupOf && x.lv < 4 && (!f.dept || x.dept === f.dept));
}
function intakeSuggest(){
  const f = S.intake; const q = (f.q || '').trim().toLowerCase();
  const pool = intakePool();
  /* Nothing typed, nothing suggested. The field stays clean until the rep
     starts a name or an ID; the count tells them how wide the pool is. */
  if(!q) return {rows:[], recent:0, total:pool.length, idle:true};
  const score = x => { const n = x.name.toLowerCase(), id = x.id.toLowerCase();
    if(id === q || n === q) return 0; if(n.startsWith(q) || id.startsWith(q)) return 1;
    if(n.split(' ').some(w => w.startsWith(q))) return 2; if(n.indexOf(q) >= 0 || id.indexOf(q) >= 0) return 3; return 9; };
  const hits = pool.map(x => [score(x), x]).filter(p => p[0] < 9).sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name));
  return {rows:hits.slice(0, 8).map(p => p[1]), recent:0, total:hits.length};
}

    '<div class="hint" style="margin:4px 0 8px">' + (s.total > 8 ? '8 of ' + s.total + ' matches, keep typing.' : s.total + (s.total === 1 ? ' match.' : ' matches.')) + '</div>';

/* ==========================================================================
   THE TASK INBOX
   Shell contract 11, sections 0, 3, 4 and 7. Owned by the inbox agent.

   Two surfaces over one list.

     The drawer  (#inbox) is for triage. Grouped by deadline, worst first, one
                 verb per row, and it closes.
     The page    (.ibx-page at S.route.surface 'inbox') is for work. Same rows,
                 as a filterable sortable table with an export and a column
                 naming who else is competent to close each item.

   Nothing in this file owns any task state. It calls taskComplete, taskRead,
   taskClear, taskUndo, taskGroups and taskCount and it never touches TASKS or
   NOTIFS, because the moment a second file starts writing that state the two
   can disagree, which is the failure contract section 0 exists to prevent.

   The one sentence this whole surface exists to make legible: finishing a
   shared item closes it for everybody at once, and dismissing a notice closes
   it for you alone. Every row says which of the two it is, in words, before
   the user presses anything.
   ========================================================================== */

const IBX = {

  page:false,         /* the full page surface is mounted */
  collapsed:{},       /* group key to true, drawer only */
  hold:null,          /* {ids, until} while completed rows sit in the done state */
  holdT:null,
  sort:{k:'worst', d:1},
  f:{scope:null, store:'all', kind:'all', sev:'all'},
  navHooked:false,
  lastPersona:null,
  closeT:null
};

/* Counted phrases. English inflects for number and Chinese does not, so the
   singular lives in the same object as the plural rather than in a stray
   ternary at the call site, and "1 items closed" cannot happen. */

     header that counted severity while the list below it counted shared work

                        zh:'共用工作 ' + s + ' 項，僅寄給你 ' + p + ' 項'}),
