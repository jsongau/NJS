   urgent this is, and they never overlap. --critical is the 8 hour
   Cal/OSHA clock and nothing else. This file paints --critical nowhere.
   It adds --alert to the past a deadline group and --warn to the due
   today group, which is what those groups mean, and leaves every other
   group on the neutral ramp. No hex is written here. Every colour is a
   token or a color-mix of tokens, and every mix used as text or as a
   boundary has its computed ratio in the comment above it.
   ===================================================================== */


/* =====================================================================
   1. THE BELL BADGE
   ===================================================================== */

/* ---- 1a. The badge had no boundary against the bar --------------------

   Measured: the badge is 21.3 by 18 at the top right of a 40px bell,
   filled with the worst severity outstanding and ringed in
   --brand-jade, which is the colour of the bar behind it. So the ring
   separates the badge from the bell GLYPH and does nothing at all to
   separate it from the bar.

   Computed, WCAG 2.x relative luminance, fill against --brand-jade
   #0B5240:

     --warn #B45309      1.81 to 1
     --critical #9F1239  1.14 to 1
     --brand-gold C9A227 3.77 to 1

   Two of the three are below the 3.0 floor for a meaningful graphic,
   which means the colour coding that is the whole point of the badge is
   invisible: a critical badge and a warn badge are the same dark blob
   on dark jade until you read the digits. Only the white digits carried
   it, at 8.02 and 5.02, and a number is not a severity.

   The fix is the two tone ring the design system already uses for
   focus, for the same reason: swap the ring to --card. White on
   --brand-jade is 9.15 to 1, so the badge is now a defined object on
   the bar at any fill, and each fill is then judged against white,
   which is the surface those three tokens were chosen against.

   The badge keeps mono tabular figures so that 9, 21 and 128 grow the
   pill in even steps rather than jittering, and min-width rises from 18
   to 20 so a single digit is a circle rather than a slightly wide oval.

   It also moves 6px up and 3px right, to the corner of the 40px button
   rather than inside it. Measured with a forced three digit count: at
   128 the badge is 36 wide against a 40px bell, and sitting inside the
   button it covered the glyph completely, so the control stopped
   looking like a bell at exactly the count where it matters most. At
   the corner it clears the icon vertically. Nothing is clipped: the top
   bar only sets overflow below 480px, and the badge sits 6px inside the
   56px bar at its highest point. */
.ibx-bell-n{
  min-width:20px;
  height:20px;
  top:-4px;
  right:-2px;
  padding:0 5px;
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
  box-shadow:0 0 0 2px var(--card);
}
/* Open state. The bell turns --card, so a white ring would vanish into
   it and the badge would lose the boundary this section just gave it.
   On white the ink ring is 17.44 to 1 and every fill still reads. */
button.bell[aria-expanded="true"] .ibx-bell-n{box-shadow:0 0 0 2px var(--ink)}


/* =====================================================================
   2. THE DRAWER, WHAT YOU SEE BEFORE YOU SEE A TASK
   ===================================================================== */

/* ---- 2a. The explanation outweighed the list -------------------------

   Measured: .ibx-rules is 145.6 tall in a 697px scroll area, and the
   first task row starts 390px down a 1000px panel. A user who presses a
   bell reading 21 sees one task. The same explanation is also under
   every row, in .ibx-note, and again in the drawer footer.

   It is not deleted, because it is the sentence that teaches the
   product. It stops being a CARD. A white card with a border, its own
   radius and 24px of padding is the same object as a group of tasks,
   and the eye reads the topmost identical object first. As a flush note
   with a 2px status free left edge it is a caption on the panel rather
   than the first item in it: 145.6 to 108, and more to the point it no
   longer competes.

   The heading goes inline with a middle dot so the block loses its
   heading line as well as its box. Middle dot rather than a dash, house
   rule 1. */
.ibx .ibx-rules{margin-bottom:var(--s1)}
.ibx .ibx-rule{
  background:none;
  border:none;
  border-left:2px solid var(--rule-int);
  border-radius:0;
  padding:0 0 0 var(--s3);
}
.ibx .ibx-rule h4{display:inline}
/* A non breaking space either side of the middot. Written as escapes so
   that a later reformat cannot eat them, and a middot rather than any
   dash glyph, house rule 1. */
.ibx .ibx-rule h4::after{content:"\A0\B7\A0";font-weight:400;color:var(--ink-muted)}
.ibx .ibx-rule p{display:inline}

/* The personal rule is injected INSIDE the for information group and
   carries an inline style for its borders, which no stylesheet can beat
   without !important. Only the properties it does not set are touched
   here: it loses the white fill so it reads as a caption on the group
   rather than as the group's first row. */
.ibx .ibx-grp .ibx-rule{background:none;padding:var(--s3) var(--s3) var(--s2)}

/* ---- 2b. The footer paragraph -----------------------------------------

   142px of a 1000px panel, 14 percent, permanently, for a paragraph
   about how the badge counts. It stays, because it is the answer to the
   only question this pattern reliably raises, and it stays at its
   measure: the line is 388px, which is 62 characters at the meta step
   and inside the comfortable range, so holding it to 52ch was tried,
   measured at 150px against 142, and reverted. A max-width that buys
   nothing and costs 8px of a panel this tight is not restraint.

   What is left is the last line breaking better and the gap between the
   paragraph and the button rising from 8px to 12px, which is the same
   gap the drawer body uses between its cards. The footer measures 146
   after this, 4px more than it was, and that 4px is the only space in
   this file spent rather than saved. */
.ibx-foot p{margin-bottom:var(--s3);text-wrap:pretty}


/* =====================================================================
   3. GROUP HEADERS
   ===================================================================== */

/* ---- 3a. Five groups that looked identical ---------------------------

   Measured: every .ibx-gh is 44px tall on --card with a 1px bottom
   rule, and the only difference between "Past a deadline" and "This
   week" was the label colour on one of them. The severity of a group
   was not legible until you read the words, which is backwards for a
   header whose job is to let you skip the group.

   Three changes, all cheap:

   1. The group CARD takes a 3px left edge in the group's own meaning.
      Past a deadline is --alert. Due today is --warn. This week and No
      clock stay on the neutral ramp, because a colour that appears on
      every group means nothing on any of them. For information takes
      --neutral, which is the token for "no status" and is exactly what
      an informational item has. --critical appears nowhere: a group is
      never the 8 hour Cal/OSHA clock, only an individual row can be,
      and that row already carries it on its dot and its clock chip.

   2. The label drops from 12.5px to the 11px eyebrow step used by every
      other eyebrow in the product, so it stops competing with the 15px
      row titles beneath it, and the count pill becomes the loud object
      in the header, which is the number a reader is actually scanning
      for.

   3. The count pill picks up a tint of the group's status. Computed:
      the pill text stays --ink, 16.1 to 1 on a 12 percent alert tint
      and 16.3 on a 12 percent warn tint, so no new text colour is
      invented and the tint is doing the signalling on its own. */
.ibx-grp{border-left:3px solid var(--rule)}
.ibx-grp.late{border-left-color:var(--alert)}
.ibx-grp.today{border-left-color:var(--warn)}
.ibx-grp.info{border-left-color:var(--neutral)}

.ibx-gh .ibx-gl{
  font-size:var(--fs-micro);
  letter-spacing:.09em;
  color:var(--ink-muted);
}
.ibx-grp.late .ibx-gl{color:var(--alert)}
/* --warn on --card is 5.02 to 1, above the 4.5 floor at 11px 600. */
.ibx-grp.today .ibx-gl{color:var(--warn)}

.ibx-gh .ibx-gn{
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
  min-width:30px;
  text-align:center;
}
.ibx-grp.late .ibx-gn{
  background:color-mix(in srgb, var(--alert) 12%, var(--card));
  border-color:color-mix(in srgb, var(--alert) 40%, var(--card));
}
.ibx-grp.today .ibx-gn{
  background:color-mix(in srgb, var(--warn) 12%, var(--card));
  border-color:color-mix(in srgb, var(--warn) 40%, var(--card));
}

/* Uppercase does nothing in Chinese and tracking pulls the glyphs apart,
   docs/06-design-system-tawa.md section 6. index.html carries this rule
   for .eyebrow and .tbl th and the inbox eyebrows were never added to
   it, so all five are added here in one place. */
[data-lang="zh"] .ibx-gh .ibx-gl,
[data-lang="zh"] .ibx-eyebrow,
[data-lang="zh"] .ibx-nextbox .k,
[data-lang="zh"] .ibx-field > span,
[data-lang="zh"] .ibx-proof .ibx-peye{
  text-transform:none;
  letter-spacing:.02em;
  font-weight:700;
}


/* =====================================================================
   4. THE ROW
   ===================================================================== */

/* ---- 4a. Six things in one row, and the text got 47 percent ----------

   Measured, hq drawer at 1440: the row is 393 wide and .ibx-main is
   185.2 of it, because .ibx-act is a flex sibling that takes 150.8 and
   never shrinks. In that 185px column the title wraps to 2 lines, the
   one sentence why wraps to 4, the subject and clock wrap to 2, and the
   note wraps to 2, so a row that carries about 30 words is 255.4 tall
   and two of them fill the panel. Chinese is denser and the same rows
   measure 168, which is why this only ever looked wrong in English.

   The fix is to stop the button competing with the sentence for the
   same horizontal space. .ibx-main becomes display:contents so its four
   children join the row's own grid, and the grid puts the title, the
   why and the meta line across the full width, then pairs the note with
   the button on one last line. The button lands where the eye finishes
   reading rather than where it starts.

   Result at 1440: text column 185.2 to 350, why 4 lines to 3, row 255.4
   to 189.4, scrollHeight 5379 to 4228. The reading order is now title,
   then why, then subject and clock, then what happens if you press it,
   then the button.

   column-gap is 0 and the two marker columns carry their own margins,
   because the pick checkbox is absent from the markup entirely when
   selection mode is off and an auto track with a gap would leave 12px
   of dead space at the left of every row when it is. */
.ibx-main{display:contents}
.ibx-row{
  display:grid;
  grid-template-columns:auto auto minmax(0,1fr) auto;
  column-gap:0;
  row-gap:var(--s1);
  align-items:start;
}
.ibx-pick{grid-column:1;grid-row:1;min-width:18px;margin-right:var(--s3)}
.ibx-dot{grid-column:2;grid-row:1;margin:6px var(--s3) 0 0}
.ibx-t{grid-column:3 / span 2;grid-row:1}
.ibx-why{grid-column:3 / span 2;grid-row:2;margin:0}
.ibx-meta{grid-column:3 / span 2;grid-row:3;margin:var(--s1) 0 0}
.ibx-note{grid-column:3;grid-row:4;margin:0;align-self:center;padding-right:var(--s3)}
.ibx-act{grid-column:4;grid-row:4;justify-self:end;align-self:center;flex-direction:row}

/* ---- 4b. Filled means shared, a ring means it is addressed to you ----

   This is the whole product idea in one 9px mark, and it costs two
   declarations. Every actionable row keeps a filled dot in its status
   colour. Every informational row, which in the drawer is exactly the
   contents of the for information group, gets the same dot as an
   outline. Fill against ring survives at 9px where two greys would not,
   and it does not spend a colour, so the status ramp keeps meaning
   urgency and nothing else.

   --neutral on --card computes to 3.36 to 1, above the 3.0 floor for a
   meaningful graphic. It is never used as text here, which is the one
   thing docs/06-design-system-tawa.md forbids it. */
.ibx-grp.info .ibx-row .ibx-dot{
  background:transparent;
  box-shadow:inset 0 0 0 2px var(--neutral);
}

/* Every task title in this product ends in a record id, and at 350px
   the longest of them broke across the hyphen inside it: "Schedule the
   review meeting for INC" on line one and "4215" alone on line two.
   Balanced wrapping splits the same two lines at the phrase instead,
   and it is the right instrument for a heading of four lines or fewer.
   Where it is unsupported the title simply wraps as it did. */
.ibx-t,.ibx-tt{text-wrap:balance}

/* The note under the row is the sentence that says whose list this
   empties. It is the same string on every row of a group, so it is set
   as a footnote rather than as body copy: 11px, muted, sharing its line
   with the button it describes. */
.ibx-note{font-size:var(--fs-micro);line-height:1.4}

/* Hover was --paper on --card, which is a 1.08 to 1 difference and not
   visible on a laptop screen at an angle. The row is not clickable as a
   whole, only its three controls are, so the affordance that matters is
   that the row you are pointing at is the row the button belongs to. */
.ibx-row:hover{background:color-mix(in srgb, var(--action-soft) 45%, var(--card))}


/* =====================================================================
   5. THE COMPLETION
   ===================================================================== */

/* ---- 5a. It read as a reflow, not as a confirmation ------------------

   Screenshotted mid animation before touching it: pressing the CTA
   swaps the 150.8px button for the 154px "Closed for everyone" mark, and
   because both sat in the flex column that was starving the text, the
   title rewrapped from 2 lines to 3 and the row grew 27px at the moment
   of the click. A row that changes shape when you press it reads as a
   glitch, and the thing it is trying to say, that this just closed for
   your colleague too, is the one message that has to land.

   With section 4 in place the mark replaces the button inside a grid
   cell in the last row, so nothing above it can rewrap and the row
   holds its geometry for the whole second it is on screen. The rest is
   confirmation: the panel tints to --action-soft, and a 3px --action
   edge is drawn inside the left of the row so the eye is drawn to the
   one row of nine that changed rather than having to find it.

   The tick scales up over 180ms from the moment the mark is inserted,
   which is the only new motion in this file and is suppressed under
   prefers-reduced-motion in section 9. */
.ibx-row.ibx-done{
  background:var(--action-soft);
  box-shadow:inset 3px 0 0 var(--action);
}
.ibx-donemark{font-size:var(--fs-meta);font-weight:600}
.ibx-donemark .ibx-tick{animation:ibx-tick-in .18s ease-out both}
@keyframes ibx-tick-in{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* The leaving row slid 12px right and faded. It now also collapses its
   own height, so the rows below rise into the gap instead of jumping
   into it a frame later when the list is rebuilt. */
.ibx-row.ibx-leave{opacity:0;transform:translateX(var(--s3))}


/* =====================================================================
   6. THE FULL PAGE TABLE
   ===================================================================== */

/* ---- 6a. The task column was 163.7px inside a 1148px table -----------

   Measured on the hq page at 1440: the table is 1148 wide, and the
   column carrying the task title, the one sentence why and the sentence
   about who it clears for is 163.7 of it, 14 percent, while Kind, Store
   and Action sat with most of their width empty. Every row in the
   screenshot is 5 or 6 lines tall for about 25 words, and the page came
   out 5366px long.

   The browser's auto layout is doing what it is told: nothing in the
   markup says which column carries the content, so it hands width out
   in proportion to how much text each column could hold. Percentages
   alone did not fix it. Measured with width:32% on the task column and
   auto everywhere else, the nine columns came out

     37, 136.7, 220.1, 107.6, 154.9, 113.6, 80.6, 129.8, 141.6

   in a 1122px table. The percentage was overruled, and Severity, which
   holds two words, was given 136.7 while the task column, which holds a
   title and two sentences, was given 220.1.

   table-layout:fixed is the instrument that actually answers the
   question, because under it the declared widths are the widths. The
   nine add up to exactly 100 percent and are set from what each column
   holds rather than from what it could hold. The task column takes 32
   percent, 359px at 1440, which is where the why stops being four lines
   and becomes two.

   Fixed layout is safe in 中文 here: Chinese wraps at any character, so
   a longer label takes another line rather than overflowing. The two
   things that cannot wrap are handled directly below. */
.ibx-page .tbl{table-layout:fixed}
.ibx-page .tbl th:nth-child(1){width:3%}
.ibx-page .tbl th:nth-child(2){width:10.5%}
.ibx-page .tbl th:nth-child(3){width:31%}
.ibx-page .tbl th:nth-child(4){width:9%}
.ibx-page .tbl th:nth-child(5){width:14.5%}
.ibx-page .tbl th:nth-child(6){width:7%}
.ibx-page .tbl th:nth-child(7){width:4.5%}
.ibx-page .tbl th:nth-child(8){width:9%}
.ibx-page .tbl th:nth-child(9){width:11.5%}

/* Nine columns of 12px gutters spend 216px of a 1122px table on air
   between cells. At 8px they spend 144, and the 72px goes to the column
   that holds the sentences. 8px is the same gutter the drawer rows use
   between the dot and the title, so the two surfaces are on one rhythm
   rather than two. */
.ibx-page .tbl th,
.ibx-page .tbl td{padding-left:var(--s2);padding-right:var(--s2)}

/* Two nowrap declarations from inbox.css.part would overflow a fixed
   column, and both are released here rather than by widening the column
   that carries them, because both wrap into something readable.

   The severity label is two words in English and four characters in
   中文 and reads the same on two lines as on one. The CTA is the one
   that matters: "Schedule meeting" needs 150px on a single line, and
   buying that from the task column costs three lines of wrapped
   sentence in every row of the table to save one line in one button. */
.ibx-page .ibx-sevdot{white-space:normal}
.ibx-page .ibx-actcell .btn{white-space:normal}
/* Measured after the widths landed: the widest CTA in either language is
   "Acknowledge" at 117.6, one word, which cannot wrap however it is
   asked to. At the 8px inset it is 109.6 in a 129px column, so the last
   column has 19px of headroom instead of overflowing the table by 17
   and quietly turning on a horizontal scrollbar. */
.ibx-page .ibx-actcell .btn.sm{padding-left:var(--s2);padding-right:var(--s2)}
/* The deadline cell holds a pill, and a pill that wraps to two lines
   reads as a broken control rather than as a long word. Measured at
   1440: the column was 70px, and the chip needs 118 in English and 150
   in 中文. The deadline column is left to auto and the chip is told not
   to wrap, so the column asks for exactly what the language in front of
   it needs. Safe in 中文 specifically because .tblwrap scrolls
   horizontally rather than clipping, so a wider Chinese chip widens the
   table instead of overflowing it. */
.ibx-page td .ibx-clock{white-space:nowrap}

/* The second .ibx-tw in the cell is the clears for sentence, the same
   string on every row of its kind. Same treatment as the drawer note:
   it becomes a footnote under the why rather than a second paragraph
   competing with it. */
.ibx-page .ibx-tw + .ibx-tw{
  font-size:var(--fs-micro);
  margin-top:var(--s1);
  color:var(--ink-muted);
}

/* ---- 6b. The same fill and ring grammar in the table -----------------

   The severity cell carries a dot and a word. :has is the only way to
   ask the question that matters here from CSS, which is whether this
   row has an informational CTA rather than what severity it carries.
   Severity and act happen to line up in today's seed data and they are
   not the same fact, so the selector asks about the fact it means. If
   :has is unsupported the row simply keeps a filled dot, which is what
   it had before. */
.ibx-page tr:has(td.ibx-actcell .btn.ghost) .ibx-sevdot i{
  background:transparent;
  box-shadow:inset 0 0 0 2px var(--neutral);
}
.ibx-page tr.ibx-done td{box-shadow:inset 0 3px 0 var(--card)}
.ibx-page tr.ibx-done td:first-child{box-shadow:inset 3px 0 0 var(--action)}

/* ---- 6c. The two rule cards are the legend --------------------------

   On the page there is room for the full sentences, and this is the one
   place both are on screen together, so they carry the key to the
   grammar the rows use: the shared card is headed by a filled dot and
   the personal card by a ring, in --neutral so that no status hue is
   spent on a legend. The reader meets the mark and its sentence in the
   same object, then meets the mark again on every row below.

   The mark is an inline-block rather than a flex item so that the same
   two declarations work on the page, where the heading is a block, and
   in the drawer, where section 2a runs the heading inline so the
   sentence can follow it. */
.ibx-rule h4::before{
  content:"";
  display:inline-block;
  vertical-align:baseline;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--neutral);
  margin-right:var(--s2);
}
.ibx-rule.personal h4::before{
  background:transparent;
  box-shadow:inset 0 0 0 2px var(--neutral);
}
/* The left edge said --action on one card and --neutral on the other,
   which reads as one card being more important. They are two halves of
   one idea, so both edges are neutral and the dot carries the split. */
.ibx-page .ibx-rule{border-left-color:var(--rule-int)}


/* =====================================================================
   7. THE CROSS PERSONA PROOF PANEL
   ===================================================================== */

/* ---- 7a. Four live counts, printed at 21px ---------------------------

   Measured: the panel is 348.3 tall, the cells are 270 by 128.2, and
   the number, which is the entire argument, was 21px, the same step as
   the page title 5,000px above it. The cells were filled with
   --ink-muted, a mid grey that reads as a disabled control rather than
   as a surface, and the three lines of text inside them started at
   three different heights because the middle line runs to one, two or
   three lines depending on the persona.

   Four changes:

   1. The number takes --fs-kpi, 30px, mono and tabular, which is the
      step the product already uses for a number you read across a room.
      Four of them in a row, all on the same baseline, is the object
      that makes the claim.
   2. The cell fill becomes 10 percent --card over --ink rather than
      --ink-muted. Computed on the result: --card text 13.0 to 1 and
      --paper text 12.1 to 1, against 6.9 and 5.97 before, and the cell
      now reads as a panel inset into the dark surface rather than as a
      grey block sitting on it.
   3. The cells are flex columns and the scope line is pushed to the
      bottom with margin-top:auto, so the four bottom lines align even
      though the line above them wraps differently in every cell. That
      alignment is the difference between four cells and one instrument.
   4. The you are here cell keeps --brand-jade, which is chrome rather
      than banner brand, and its gold edge is thickened on the left only
      instead of ringing the whole cell. White on --brand-jade is 9.15
      to 1 and --brand-gold on --brand-jade is 3.77, above the 3.0
      graphic floor. */
.ibx-proof{padding:var(--s5)}
.ibx-pgrid{gap:var(--s2)}
.ibx-pcell{
  display:flex;
  flex-direction:column;
  background:color-mix(in srgb, var(--card) 10%, var(--ink));
  border-color:color-mix(in srgb, var(--card) 22%, var(--ink));
  padding:var(--s3) var(--s4) var(--s4);
}
.ibx-pcell.now{
  background:var(--brand-jade);
  border-color:color-mix(in srgb, var(--card) 22%, var(--ink));
  border-left:3px solid var(--brand-gold);
}
.ibx-pcell .n{
  font-size:var(--fs-kpi);
  line-height:1.05;
  margin-top:var(--s1);
  letter-spacing:-.01em;
}
/* The bottom margin is a floor rather than a spacer: in the cells where
   the split sentence runs to two lines it is the only thing keeping the
   hairline off the descenders, and in the cells where it runs to one the
   auto margin on .s has already pushed the line down. */
.ibx-pcell .b{margin-top:var(--s2);margin-bottom:var(--s2);max-width:26ch}
/* A hairline above the scope line, drawn in the same mix as the cell
   border. Because every cell pushes that line to the bottom, the four
   hairlines land on one horizontal, and four cells that share a rule
   read as one instrument rather than as four boxes. Computed: the mixed
   text is 8.4 to 1 on the cell fill, so the quietest line in the panel
   is still well clear of the 4.5 floor. */
.ibx-pcell .s{
  margin-top:auto;
  padding-top:var(--s2);
  opacity:1;
  border-top:1px solid color-mix(in srgb, var(--card) 18%, var(--ink));
  color:color-mix(in srgb, var(--paper) 72%, var(--ink));
}
.ibx-pcell.now .s{border-top-color:color-mix(in srgb, var(--card) 26%, var(--brand-jade))}
/* The eyebrow, the title and the paragraph above the cells were three
   sizes and three margins. The paragraph holds a 74ch measure, which at
   the meta step is about 560px, so it stops running the full 1,116px of
   a panel nobody would read a 1,100px line in. */
.ibx-proof > p{max-width:74ch;margin-bottom:var(--s5);text-wrap:pretty}


/* =====================================================================
   8. RESPONSIVE
   ===================================================================== */

/* ---- 8a. The phone row -----------------------------------------------

   At 390 the drawer is full width and the row's text column is 311px.
   The note and the button cannot share that line without the note
   taking three, so below 480 they stack: the note keeps the full width
   and the button sits under it, left aligned with the text column, so
   the thumb lands in the same place on every row.

   Before this pass the 640px rule set flex-wrap on the row, which put
   the 9px severity dot alone on the first line with the title beginning
   on the second. That is visible in the before screenshot at 390 in
   both languages. The grid makes it impossible rather than fixing it. */
@media(max-width:640px){
  .ibx-row{padding:var(--s3)}
  .ibx-act{width:auto;padding-left:0}
}
@media(max-width:480px){
  .ibx-note{grid-column:3 / span 2;grid-row:4;padding-right:0}
  .ibx-act{grid-column:3 / span 2;grid-row:5;justify-self:start;margin-top:var(--s1)}
}
/* Touch targets are 44px below 900px, working agreement in CLAUDE.md and
   contract section 4. The row CTA was 34px, which is the desktop small
   button, and it is the control this whole surface exists to press. */
@media(max-width:900px){
  .ibx-row .ibx-act .btn.sm{min-height:44px}
  /* The nine column budget in section 6a is a budget for 1122px. Held
     at 390 it gives the task column 113px and every row grows to about
     700, which measured out at 15,807px of page. Below 900 the table
     goes back to auto layout with a floor of 820px and .tblwrap scrolls
     it sideways, which is the pattern the rest of the app's tables
     already use on a phone. Measured after: the document stops being
     741px wide at a 390px viewport, which is the page itself scrolling
     horizontally rather than the table doing it, and that was true
     before this pass as well. */
  .ibx-page .tbl{table-layout:auto;min-width:820px}
  .ibx-page .tbl th:nth-child(n){width:auto}
}
/* The proof panel is the payoff of the page and it is read on a phone
   too. Two cells across below 820 is already handled; what was missing
   is that a 30px number needs its cell to keep its padding, so the
   panel drops to the s4 inset rather than the s5 one. */
@media(max-width:640px){
  .ibx-proof{padding:var(--s4)}
  .ibx-pcell .b{max-width:none}
}


/* =====================================================================
   9. MOTION
   ===================================================================== */

/* The one animation added by this file is the 180ms tick scale in
   section 5. Everything else here is static. Under reduce the tick is
   simply present, which is the state the animation ends in, and the
   done row still tints and still carries its edge, so the confirmation
   survives without the movement. */
@media(prefers-reduced-motion:reduce){
  .ibx-donemark .ibx-tick{animation:none}
  .ibx-row.ibx-leave{transform:none}
}

/* ---- design-chrome ---- */
/* ==========================================================================
   NAVIGATION CHROME, design pass
   Owner: the chrome design agent. This file is CSS only and it is the only
   file this agent writes. It restyles the top bar, the mega panel, the side
   rail, the sub nav, the mini nav, the mobile bottom rail, the FAB, the toast
   stack and the command palette. It changes no copy and no markup.

   Everything below was measured in headless Chromium against the merged
   index.html at 1440, 1280, 1180, 1120, 1024, 1000, 940, 900, 820, 760, 640,
   560, 480, 414 and 390 px, in English and in 中文, before anything was
   written. The numbers are in the comments so the next person does not have
   to take my word for any of it.

   The one rule that governs every colour here: brand colour says whose store
   this is, status colour says how urgent this is, and they never overlap.
   --critical belongs to the 8 hour Cal/OSHA clock. It is not written once in
   this file. Where this pass changes a badge it makes it QUIETER, never
   redder. No hex is written here; every colour is a token.

   Six defects were already found and fixed in tune.css.part. Two of them were
   the same defect twice: a two line row whose spans were inline, so the
   truncation CSS on them was inert. Before styling anything I checked every
   other two line row in the chrome for the same fault. The mega rows and the
   palette rows are fixed. The rail, the sub nav and the bottom rail are all
   single line rows. One more instance of the family was still live and it is
   fixed in section 7 below: the palette GROUP LABEL carries a .fl-k tag span
   that is only styled under .fl-opt, so on the shipped build the label read
   "START HERE TASKS" as one run of words.
   ========================================================================== */


/* =====================================================================
   1. TOP BAR
   ===================================================================== */

/* ---- 1a. The bell was clipped off the bar between 481px and 1000px -------

   Measured, English, hq persona, topbar scrollWidth against clientWidth:

     1024px   1024 / 1024   fits
     1000px   1011 / 1000   bell 10.7px past the right edge
      940px   1011 /  940   bell entirely off screen
      900px    951 /  900   bell and half the language switch off screen
      760px    951 /  760   191px of the bar unreachable
      640px    713 /  640   73px unreachable, and .topbar is overflow:hidden
                            from 640px down, so it is clipped silently
      480px    480 /  480   fits, because tune.css.part fixed this band

   This is exactly the defect tune.css.part section 7 fixed, with the same
   silent failure mode, in the one band that fix did not cover. tune scoped
   its repair to max-width:480px because that is where it was found. The bar
   is over budget from 1000px down in English and from 760px down in Chinese.

   Three moves, cheapest first, and each one is measured rather than guessed.

   The "Viewing as" label is 75.5px plus an 8px gap. It labels a segmented
   control whose four buttons are the four persona names, one of them
   pressed. It is the least load bearing 83px in the bar. Gone below 1120px,
   which is also where the mega trigger already drops its own text label, so
   the bar loses its two decorative words at one breakpoint rather than two.

   The Ctrl K keycap is 51.8px. It was already hidden below 900px because a
   phone has no Ctrl key; a 1000px window usually does not either, and the
   palette is reachable from the mega panel and from the search button itself.

   Those two together take 1011 to 876 at 1000px, 135px of headroom. */
@media(max-width:1120px){
  #topbar .seg .lbl{display:none}
  #topbar .nv-kbd{display:none}
}

/* The brand block is 169.7px: a 26px mark, the wordmark at 89.1px and the
   TAWA eyebrow at 34.6px. At 900px the bar still needs 825px of the 900 it
   has after the two cuts above, which fits, so only the eyebrow goes here.
   Below 820px it needs 825 of 820 and the wordmark has to go too, leaving
   the 26px mark, which is what the shipped file already does below 480px.
   So this is the existing behaviour moved to the width where it is needed,
   not a new idea. 728px of content in an 820px bar, 92px of headroom. */
@media(max-width:900px){ #topbar .brand small{display:none} }
@media(max-width:820px){ #topbar .brand .wordmark{display:none} }

/* ---- 1b. The persona switcher was rendered twice from 481px to 640px -----

   Found while measuring the band above, and it is the reason the bar was so
   far over budget there. render() switches the inline display on every
   .mobileonly node at max-width:640px, so the short label persona segment,
   "HQ Legal Store Me", turns on at 640. The stylesheet hides .desktoponly at
   max-width:480px. Between those two numbers both segments are in the bar.

   Measured at 640, 560 and 481px: .seg.desktoponly computes to display:flex
   at 320.2px AND .seg.mobileonly computes to display:flex at 184.9px, so the
   bar carries 505px of persona switcher in a 560px window and offers the
   same four buttons twice, once with aria-pressed on each copy. It was
   invisible because .topbar is overflow:hidden below 640px and both copies
   were squashed and clipped, which is the same failure mode as 1a.

   The stylesheet moves to the breakpoint the JS already uses. Nothing else
   in the app relies on .desktoponly being visible in the bar at that width,
   because the mobile copy carries the same data-persona values and the same
   handler. Topbar scrollWidth at 640px goes from 795 to 467 in a 640px bar. */
@media(max-width:640px){
  #topbar .seg.desktoponly{display:none}
}

/* The backstop, and it is the same argument tune.css.part made: overflow
   hidden on a bar that holds navigation is how this class of bug stays
   invisible. If a longer translation pushes something past the edge again it
   can be swiped to instead of silently disappearing. flex:none on the
   segments stops them shrinking below their content, because shrinking is
   what hid the buttons rather than wrapping them. The bar carries both
   id="topbar" and class="topbar" and the id wins, so these use the id. */
@media(max-width:1120px){
  #topbar{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  #topbar::-webkit-scrollbar{display:none}
  #topbar .seg{flex:none}
  #topbar .brand{flex:none}
}


/* =====================================================================
   2. SIDE RAIL
   ===================================================================== */

/* ---- 2a. The rail stopped collapsing and nobody could see it -------------

   Measured at 1000px: #railnav is 260px wide, .nv-rlabel computes to
   display:none, and every count badge computes to display:none. So from
   901px to 1120px the rail was a 260px white column holding five 18px icons
   centred in it, with roughly 120px of empty column on either side of them,
   out of a 1000px viewport. A quarter of the screen, blank, by accident.

   Cause, and it is a cascade collision rather than a mistake in either file.
   chrome.css.part sets the collapse inside @media(max-width:1120px) as
   #shell{--rail-w:var(--rail-w-min)}, specificity (1,0,0).
   tune.css.part later sets #shell{--rail-w:260px} to stop two of five labels
   ellipsising, also specificity (1,0,0), and it is later in the cascade, so
   it wins at every width including inside that media query. The label
   hiding rules are (1,1,0) and kept working. Half the collapse applied.

   tune's 260px is right and is not touched here: it is the width the longest
   label needs with its badge in both languages. What is restored is the
   collapse itself, at (1,1,0) via the data-rail attribute the shell always
   carries, so it outranks the plain #shell rule no matter what order the
   parts are merged in. Contract 11 section 4, 1120px, back in force. */
@media(max-width:1120px){
  #shell[data-rail]{--rail-w:var(--rail-w-min)}
}

/* ---- 2b. An icon only rail with no counts says nothing -------------------

   Honest answer to "are the icons distinguishable": three of the five are.
   The tray reads as a queue, the shield reads as compliance, the speaker
   reads as a campaign. The node graph for "Store network" reads as share,
   and the stacked layers for "Course catalog" reads as a database. Two of
   five wrong is a coin toss and no amount of CSS fixes a glyph.

   What CSS can fix is that the collapsed rail also threw away the counts.
   The badge is display:none, so 19 items past a deadline and 0 items looked
   identical, and the whole point of this rail is that it says where the work
   is. The count comes back as an 8px dot in its own severity colour, with a
   2px --card halo so it separates from the glyph underneath it. The badge
   carries aria-hidden="true" and the count is already in the button's
   accessible name, so shrinking the digits out of the box costs a screen
   reader nothing. .zero keeps the display:none tune.css.part gave it: a dot
   that means "nothing here" is worse than no dot, which is tune's own
   argument for hiding the zero badge and it still holds.

   And the label comes back on hover and on keyboard focus, as a flyout, so
   an unrecognisable glyph is one pointer away from naming itself. That needs
   overflow:visible on a rail that is otherwise overflow-y:auto. The rail is
   348.5px of content against a max-height of 100vh minus the chrome, so the
   scroll is not doing any work today; if a persona ever gets enough surfaces
   to overflow it, this is the line to revisit.

   Written twice on purpose. The first block is the manual toggle, which can
   be collapsed at any width. The second is the automatic collapse below
   1120px, where data-rail is "open" and the first block does not match. A
   media query cannot be folded into a selector list, so the alternative was
   a custom property toggle hack, and this file is read by people who were
   not here. */
/* The rail is z 40 and position:sticky, which makes it a stacking context, so
   a z-index on the flyout itself is resolved INSIDE the rail and the whole
   rail still paints under the sub nav at z 50. Measured: the flyout for rail
   item three lands at y 195.6 to 226.4 and the chrome stack ends at y 239.8,
   so the first three of five labels were painted underneath it and simply did
   not appear. The rail itself has to move, and only while it is collapsed,
   because that is the only state that has a flyout. One step, to 51, which is
   above the sub nav and below the mega panel at 58. Nothing else changes: the
   rail occupies x 0 to 64 and the sub nav starts at x 64, so the two never
   overlap geometrically, and the rail stays below every floating layer in
   contract section 4. A tooltip that is covered for three of five items is
   worse than no tooltip, and no tooltip is worse than an unlabelled glyph. */
#shell[data-rail="icons"] #railnav{overflow:visible;z-index:51}
#shell[data-rail="icons"] #railnav .nv-ritem{position:relative}
#shell[data-rail="icons"] #railnav .nv-b:not(.zero){
  display:block;position:absolute;top:5px;right:9px;
  min-width:9px;width:9px;height:9px;padding:0;border-radius:var(--r-pill);
  font-size:0;line-height:0;overflow:hidden;
  box-shadow:0 0 0 2px var(--card);
}
/* .info is --action-soft, which is a pale mint that vanishes as a 9px dot on
   white. As a graphic on --card, --ink-muted computes to 6.45 to 1 and is
   the honest colour anyway: a count with nothing late and nothing warned is
   information, not status. */
#shell[data-rail="icons"] #railnav .nv-b.info{background:var(--ink-muted)}
#shell[data-rail="icons"] #railnav .nv-ritem:hover .nv-rlabel,
#shell[data-rail="icons"] #railnav .nv-ritem:focus-visible .nv-rlabel{
  display:block;position:absolute;left:calc(100% + 6px);top:50%;
  transform:translateY(-50%);z-index:41;
  width:auto;flex:none;white-space:nowrap;pointer-events:none;
  background:var(--ink);color:var(--card);
  padding:6px 10px;border-radius:var(--r-ctl);
  font-size:var(--fs-meta);font-weight:600;
  box-shadow:var(--el-2);
}
@media(max-width:1120px){
  #shell[data-rail] #railnav{overflow:visible;z-index:51}
  #shell[data-rail] #railnav .nv-ritem{position:relative}
  #shell[data-rail] #railnav .nv-b:not(.zero){
    display:block;position:absolute;top:5px;right:9px;
    min-width:9px;width:9px;height:9px;padding:0;border-radius:var(--r-pill);
    font-size:0;line-height:0;overflow:hidden;
    box-shadow:0 0 0 2px var(--card);
  }
  #shell[data-rail] #railnav .nv-b.info{background:var(--ink-muted)}
  #shell[data-rail] #railnav .nv-ritem:hover .nv-rlabel,
  #shell[data-rail] #railnav .nv-ritem:focus-visible .nv-rlabel{
    display:block;position:absolute;left:calc(100% + 6px);top:50%;
    transform:translateY(-50%);z-index:41;
    width:auto;flex:none;white-space:nowrap;pointer-events:none;
    background:var(--ink);color:var(--card);
    padding:6px 10px;border-radius:var(--r-ctl);
    font-size:var(--fs-meta);font-weight:600;
    box-shadow:var(--el-2);
  }
}

/* ---- 2c. One selection marker for the whole shell ------------------------

   The rail marks the current surface with a tinted row, the sub nav marks it
   with a 2px underline, and the palette marks its selected row with a tint
   and nothing else. Three components, three ideas. They become one idea: a
   3px jade bar on the leading edge of the selected thing, which is what the
   sub nav already draws, rotated. Drawn as an inset shadow rather than a
   border so it costs no layout and the 13.5px label does not shift by 3px
   when a row becomes current. */
#railnav .nv-ritem[aria-current="page"],
.nv-mrow[aria-current="page"]{box-shadow:inset 3px 0 0 var(--brand-jade)}
#shell[data-rail="icons"] #railnav .nv-ritem[aria-current="page"]{box-shadow:none}
@media(max-width:1120px){
  #shell[data-rail] #railnav .nv-ritem[aria-current="page"]{box-shadow:none}
}
/* The collapse toggle is a different rank from the five destinations, and at
   rest it read like a sixth one. 32px of separation and a lighter weight say
   so without a second divider. */
#railnav .nv-rtog{margin-top:var(--s5);padding-top:var(--s3);font-weight:500}


/* =====================================================================
   3. THE CHROME STACK, sub nav and mini nav
   ===================================================================== */

/* ---- 3a. What the chrome costs, measured --------------------------------

   Total height of everything above the first line of content, hq persona:

                    top bar   banner   sub nav   mini nav   TOTAL   viewport
     1440 EN          56       32.8      44        56       189.8    1000
     1440 中文        56       35.3      44        59.5     195.8    1000
     1180 EN          56       32.8      44       106       239.8     900
     1000 EN          56       32.8      44       106       239.8     900
      390 EN          56       89        44       139.8     329.8     844
      390 中文        56       99        44       142.3     342.3     844

   1440 is defensible. 189.8px is 13 percent of the window and three of the
   four bands are carrying navigation or a legal requirement.

   390 is not defensible, and the reason is not that the bands are too tall,
   it is that ALL of them are pinned. .nv-stack is position:sticky at every
   width, so on a phone 184.8px of sub nav and mini nav sits under a 145px
   top bar and banner and never moves. 329.8 of 844 is 39 percent of the
   screen permanently spent, leaving 453px of content once the 61px bottom
   rail is subtracted.

   The fix is not to shrink the bands, it is to stop pinning them. Below
   900px the whole stack scrolls with the page. Pinned drops from 329.8px to
   145px, the top bar and the legally required banner, and the usable content
   area goes from 453px to 638px, a 41 percent gain. Nothing is lost that is
   not one swipe or one tap away: the fixed bottom rail at z 45 carries the
   primary surfaces and the task inbox, and the mega panel on the top bar,
   which never scrolls away, reaches every surface of every persona.

   I tried to keep the sub nav alone pinned and it cannot be done from this
   file. A sticky element only sticks while its containing block is in view,
   and #subnav's containing block is .nv-stack, which is 157px tall, so a
   sticky sub nav inside a static stack scrolls away with the stack at y
   minus 942 exactly as if it were static. Verified by scrolling rather than
   by reading the CSS, per contract 11 section 4. The markup change that
   would make it work is in this pass's report under markupProposals; it is
   not made here because this file is CSS only. */
@media(max-width:900px){
  .nv-stack{position:static}
  /* The 104px allowance in chrome.css.part was sized to clear a pinned sub
     nav and mini nav. With nothing pinned below the banner, a jump target
     only has to clear the banner plus a breath, and the old number dropped
     it 104px too low. */
  #shell section,#shell .pagehead{scroll-margin-top:calc(var(--chrome-h) + var(--s3))}
}

/* ---- 3b. The stack was two surfaces pretending to be one -----------------

   .nv-stack paints --paper and #mininav paints --card, so the 101px band
   under the banner was a beige strip on top of a white strip with a rule
   between them, and it read as two unrelated pieces of furniture. The rail
   beside it is --card and the page below it is --paper. Making the whole
   stack --card gives the shell one honest reading top to bottom: dark bar,
   dark banner, white chrome, beige page. The internal rule stays, because it
   still separates tabs from context, it just no longer separates two
   colours. Inactive tab labels are --ink-muted on --card at 6.45 to 1. */
.nv-stack{background:var(--card)}
#mininav{background:transparent}

/* ---- 3c. Mini nav density ------------------------------------------------

   At 390px the mini nav is 139.8px: 8px padding, an 18px breadcrumb, a 44px
   store picker row, a 44px stepper row and two 12px gaps. The gaps are the
   only fat on it, and the breadcrumb at that width has already had its
   leading crumbs hidden, so it renders as one word, "Action queue", directly
   under a tab strip whose current tab says "Action queue" and directly above
   an h1 that says "Action queue". Three times in 90 vertical pixels.

   The row gap drops to 8px and the third copy of the word goes. 139.8 to
   about 106px, and the two controls that actually do something keep their
   44px touch targets. Hiding the crumb is scoped to 480px and below so the
   tablet band keeps a real, multi step breadcrumb. */
/* The store picker's own label broke mid word in both languages. Measured at
   1440px: "Store in context" renders as two lines, and 目前門市 breaks after
   the third character, which in Chinese is not a line break, it is a typo.
   The label is a flex item beside a 280px select and it was being allowed to
   shrink. Held on one line above 640px only: below that the mini nav wraps
   the whole group onto its own line anyway, and a 100px unshrinkable label
   beside a select in a 366px content width is how a phone gets a horizontal
   scrollbar. */
@media(min-width:641px){
  #mininav .nv-ctx > label{flex:none;white-space:nowrap}
}

@media(max-width:640px){
  #mininav{row-gap:var(--s2)}
}
@media(max-width:480px){
  #mininav .nv-crumb{display:none}
}

/* ---- 3d. Disabled tabs were dimmed below legibility ---------------------

   #subnav button[aria-disabled="true"] was opacity:.45 over --ink-muted,
   which composites to roughly #ADAEA9 on --card and computes to about 2.1 to
   1 against a 4.5 floor for 13.5px text. A tab you are not allowed to open
   is still a tab you are supposed to read, otherwise the permissions story
   the mega panel tells so carefully does not survive contact with the tab
   strip. Full opacity, --ink-muted at 6.45, and the unavailability is
   carried by a dotted rule where the active tab draws a solid one, plus the
   cursor and the title the markup already sets. */
#subnav button[aria-disabled="true"]{
  opacity:1;color:var(--ink-muted);
  border-bottom:2px dotted var(--rule-int);
}


/* =====================================================================
   4. MEGA PANEL
   ===================================================================== */

/* ---- 4a. One elevation system -------------------------------------------

   .nv-mega-in carried a hand written 0 18px 44px rgba(26,26,23,.22) and the
   scrim a hand written rgba(26,26,23,.4). Both are --ink spelled out. The
   design system part publishes --el-3 as exactly that shadow built from a
   color-mix on --ink, and the app already uses color-mix, so the panel joins
   the same three step elevation scale as the drawer and the palette instead
   of running a fourth one of its own. Radius snaps from the stray 14px to
   --r-box, which is the container step. */
#meganav{background:color-mix(in srgb, var(--ink) 40%, transparent)}
.nv-mega-in{box-shadow:var(--el-3);border-radius:0 0 var(--r-box) var(--r-box)}
.nv-mega-ttl{font-size:var(--fs-h2)}
.nv-mega-sub{font-size:var(--fs-meta)}

/* ---- 4b. Make the columns read as a map, not as a menu -------------------

   Measured at 1440px: four columns of 305.5px, sixteen rows, twenty count
   badges. Twelve of those badges were saturated fills, --warn amber or
   --alert crimson, including the four column totals and including all four
   rows of the Legal column that this viewer is not allowed to open. Nine
   were --action-soft zero pills. That is a lot of paint for a panel whose
   job is to say where the work is.

   The principle applied: COLOUR MARKS WORK YOU CAN DO. A column total is an
   arithmetic sum, not an urgency, and the rows underneath it already carry
   the urgency, so the header count becomes a quiet outline. A count inside
   the privilege walled column is information about somebody else's queue, so
   it becomes a quiet outline too. That takes twelve saturated pills down to
   four, all of them on rows this viewer can open right now. Nothing is
   removed, no number changes, and --critical is still nowhere near this. */
.nv-mch .nv-b,
.nv-mcol.off .nv-mrow .nv-b,
.nv-mrow[aria-disabled="true"] .nv-b{
  background:transparent;color:var(--ink-muted);
  border:1px solid var(--rule-int);
}
/* The resting state of a zero row. tune.css.part argued that the mega panel
   is the right place for a zero because it has room to say what the surface
   holds instead, and the row does exactly that in its second line, "72
   stores on the map". So the zero is present and quiet: same pill, hairline
   --rule rather than a fill, which at 1.36 to 1 is a shape rather than a
   mark. Nine of the twenty badges stop competing. */
.nv-mcol .nv-mrow .nv-b.zero{
  background:transparent;color:var(--ink-muted);
  border:1px solid var(--rule);opacity:1;
}

/* The column header was 13.5px 600 and the row titles are 13px 600, so the
   header and its children were the same rank and the column had no top. A
   hairline under the header, 12px of air below it and an --ink icon where
   the rows use --ink-muted give the column a head without shouting. */
.nv-mch{
  padding:0 var(--s2) var(--s3);margin-bottom:var(--s2);
  border-bottom:1px solid var(--rule);
}
.nv-mch .n{font-size:var(--fs-body);letter-spacing:.01em}
.nv-mch svg{color:var(--ink)}
.nv-mcol.off .nv-mch .n,.nv-mcol.off .nv-mch svg{color:var(--ink-muted)}

/* ---- 4c. Row rhythm ------------------------------------------------------

   Measured row heights in one open panel: 50.4, 50.4, 67.3, 50.4, 50.4 in
   column one and an 84.2 in column four, because the subtitle on "Report an
   incident" runs to three lines. Rows are centre aligned, so on the 67.3 and
   84.2 rows the icon and the count floated in the middle of the row and no
   longer lined up with the title they belong to, and the counts down a
   column did not sit on a line.

   Two changes. The subtitle is clamped to two lines, the same instrument and
   the same reason as the KPI description in tune.css.part section 1: one
   long sentence should not set the height of a grid. And the row aligns to
   its first text line, so every icon and every count in the panel sits on
   the same baseline as the title beside it. The negative offsets are
   arithmetic, not taste: the title line box is 13px at 1.3, so 16.9px, the
   badge is 20px and the icon is 18px, and centring each on that first line
   needs (16.9 - 20) / 2 and (16.9 - 18) / 2. */
.nv-mrow{align-items:flex-start}
.nv-mrow svg.nv-ic{margin-top:-1px}
.nv-mrow .nv-b{margin-top:-2px}
.nv-mrow .s{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow:hidden;
}

/* ---- 4d. The privilege wall ---------------------------------------------

   The walled column was opacity:.62 on every row, which composites
   --ink-muted to about #9B9C96 and drops the 11.5px second line to roughly
   2.9 to 1. The wall exists to explain a permission, and it was explaining
   it in text nobody can read. The rows go back to full opacity with an
   explicit muted colour, which is legible at 6.45, and the fact that they
   are not openable is carried by the --paper column fill, the lock in the
   wall, the cursor and the absence of any hover. A permissions demo that
   greys its own explanation into the background reads as a rendering bug. */
.nv-mrow[aria-disabled="true"]{opacity:1;cursor:default}
.nv-mrow[aria-disabled="true"] .t{color:var(--ink-muted)}
.nv-mrow[aria-disabled="true"] .s{color:var(--ink-muted)}
.nv-wall{background:var(--card);border-color:var(--rule-int);line-height:1.5}
.nv-mcol.off{background:var(--paper);border-color:var(--rule)}

/* ---- 4e. The Need from you footer ---------------------------------------

   Measured 33.3px on one line at 1440px, sitting 16px under a 336.3px row of
   columns with a hairline between. It is the strongest sentence in the panel
   and it was the same weight as the panel subtitle. It keeps its size and
   gets its own ground: --paper, the full width of the panel, and the label
   in jade so the eye lands on it last, on the way out. */
.nv-mega-foot{
  background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-ctl);
  padding:var(--s3);margin-top:var(--s4);align-items:baseline;
}
.nv-mega-foot .txt{font-size:var(--fs-body)}


/* =====================================================================
   5. FAB
   ===================================================================== */

/* The FAB carried --fl-shadow-lg, which the design system part maps to
   --el-3. That is the overlay elevation: the same shadow as the full screen
   command palette and the mega panel. A 52px button that sits on the page at
   rest is one step up from the page, not three. --el-2. Radius moves from
   the hand written 26px to --r-pill, which is the same shape and one token.
   Colour is untouched: --brand-jade is chrome, white on it computes to 9.15
   to 1, and it is the app's action colour rather than a banner colour. */
#fab{box-shadow:var(--el-2);border-radius:var(--r-pill)}
#fab:hover{box-shadow:var(--el-3)}
@media(prefers-reduced-motion:reduce){ #fab{transition:none} }


/* =====================================================================
   6. TOAST STACK
   ===================================================================== */

/* ---- 6a. The toast stack sat on top of the FAB at 390px -----------------

   Measured at 390 by 844, hq persona, one toast with an undo button and one
   without. The FAB occupies x 318 to 374, y 712 to 768. The toast stack is
   left:12 right:12 bottom:calc(60 + 12 + safe), so it occupies x 12 to 378,
   y 630 to 771. They overlap on both axes and the toast wins on z, 90
   against 44, so the FAB disappears underneath it for the twelve seconds an
   undo toast is on screen. Verified in the screenshot: the FAB is not there.

   The stack lifts above the FAB rather than the FAB moving, because the FAB
   is persistent and the toast is transient, and because the FAB's position
   above the bottom rail is what keeps it clear of the thumb rail. The number
   is the FAB's own geometry, not a guess: bottom rail height, plus its 16px
   gap, plus its 56px box, plus a 12px separation.

   If the FAB is hidden, and it is hidden for personas with no primary action
   and whenever a selection raises the action bar, the stack drops back down
   so a toast is not floating in the middle of the screen for no reason. #fab
   precedes #toasts in float.html.part, so a sibling combinator can ask. */
@media(max-width:900px){
  #toasts{bottom:calc(var(--fl-rail-h) + var(--s4) + 56px + var(--s3) + var(--fl-safe))}
  #fab[hidden] ~ #toasts{bottom:calc(var(--fl-rail-h) + var(--s3) + var(--fl-safe))}
}

/* ---- 6b. And on the desktop it sat on top of the action bar -------------

   Measured at 1440px with a selection active: #actionbar is centred at
   width min(760, 100vw - 48), so x 340 to 1100, bottom 20, height about 56,
   which puts its top edge at y 924. The toast stack is left:20 with
   width min(380, 100vw - 40), so x 20 to 400, bottom 20. They overlap by
   60px horizontally and completely vertically. At 1000px the action bar is
   x 120 to 880 and the overlap is 280px.

   The FAB is already hidden when a selection is up, on the argument that two
   primaries in one corner is a coin toss. The same argument applies here, so
   the stack clears the bar by the bar's own height plus a 12px separation.
   body.fl-sel is the class float.js already sets for exactly this state. */
body.fl-sel #toasts{bottom:calc(20px + 56px + var(--s3) + var(--fl-safe))}

/* A toast is a floating notification, not an overlay over the whole page.
   Same argument as the FAB: --el-2 is the floating step, --el-3 is the
   overlay step, and the palette and the mega panel own that one. */
.fl-toast{box-shadow:var(--el-2);border-radius:var(--r-box)}
/* The 3px status edge is the only colour on a toast and it was sitting flush
   against the 14px left padding, reading as part of the border radius rather
   than as a status mark. 2px of the container radius and a real gap. */
.fl-toast .fl-edge{border-radius:var(--r-bar);margin-right:var(--s1)}
.fl-toast button{border-color:var(--rule-int);border-radius:var(--r-ctl)}


/* =====================================================================
   7. COMMAND PALETTE
   ===================================================================== */

/* ---- 7a. The group label ran its two parts together --------------------

   Third instance of the family that tune.css.part sections 4 and 6b record.
   flPalPaint writes the group heading as
     <div class="fl-grp">Start here <span class="fl-k">TASKS</span></div>
   and .fl-k is styled only under #palette .fl-opt .fl-k, so inside a group
   heading it inherits the heading's own uppercase 11px 700 and renders as
   four more words of the heading. Measured on the shipped build: the span
   computes to background rgba(0,0,0,0), padding 0px, border-width 0px, and
   the empty query palette opens with a label reading "START HERE TASKS".

   The lesson tune.css.part drew from the first two is the right one and it
   generalises: a declaration written for one context is not a weak rule
   somewhere else, it is a rule with no effect at all, and nothing warns you.
   The tag gets the same keycap treatment the row chips have, one step
   quieter, so the label reads as "START HERE" with a "TASKS" tag beside it. */
#palette .fl-grp{display:flex;align-items:center;gap:var(--s2)}
#palette .fl-grp .fl-k{
  font-family:var(--mono);font-size:var(--fs-micro);font-weight:600;
  letter-spacing:0;text-transform:none;
  color:var(--ink-muted);background:var(--paper);
  border:1px solid var(--rule);border-radius:var(--r-mark);
  padding:1px 6px;flex:none;
}

/* ---- 7b. The palette covered the prototype banner on a phone ------------

   Measured at 390 by 844: #palette .fl-box is margin-top:8px below 900px, so
   the box opens at y 8 and runs to y 836 at z 95. The top bar is z 60 and
   the prototype banner is z 70 and is 89px tall at that width. Both were
   completely hidden behind the palette. CLAUDE.md rule 4 says the banner is
   non removable on every route, and covering it is removing it for as long
   as the palette is open.

   The box now opens under the banner, using the same --chrome-h the rest of
   the shell measures its sticky offsets from, which chrome.js re-measures on
   every render so a banner that wraps to three lines in Chinese moves the
   palette down with it rather than being hidden by it. The max-height is
   reduced by the same amount so the box still ends 16px above the bottom.
   At 390px that is a box from y 153 to y 828 instead of 8 to 836. */
@media(max-width:900px){
  #palette .fl-box{
    margin-top:calc(var(--chrome-h) + var(--s2));
    max-height:calc(100vh - var(--chrome-h) - var(--s4));
  }
}

/* ---- 7c. The selected row -----------------------------------------------

   The selected row was a tint and a colour change on the title, which is the
   same signal the hover state gives, so with a pointer in the list the
   keyboard selection and the pointer hover were indistinguishable. It takes
   the shell's one selection marker, the 3px jade leading edge, drawn as an
   inset shadow so the 14px title does not shift. Hover keeps the tint alone.
   Measured row height 57.3px, unchanged. */
#palette .fl-opt[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--brand-jade)}
#palette .fl-box{border-radius:var(--r-box);box-shadow:var(--el-3)}
/* The placeholder was the browser default grey, which is the one piece of
   text in the shell that was not on the ink ramp. */
#palette input::placeholder{color:var(--ink-muted);opacity:1}
/* Esc and the row keycaps were two different chips, one bordered in --rule
   at 5px radius and one at 5px with a --paper fill. One keycap. */
#palette .fl-esc{border-radius:var(--r-mark);background:var(--paper);font-size:var(--fs-micro)}
#palette .fl-opt .fl-k{border-radius:var(--r-mark);font-size:var(--fs-micro)}
/* The hint line and the empty state are the two places this component talks
   to the user in sentences, and both were 11.5px muted against a 13.5px
   list. The foot is a legend for a keyboard, so it stays quiet, but it gets
   the meta step and enough padding to stop looking like a caption that fell
   off the last row. */
#palette .fl-foot{font-size:var(--fs-meta);padding:var(--s3) 14px;background:var(--paper)}
#palette .fl-empty{font-size:var(--fs-body);line-height:1.6}


/* =====================================================================
   8. MOBILE BOTTOM RAIL
   ===================================================================== */

/* ---- 8a. The neutral badge failed contrast ------------------------------

   .fl-badge with no severity is white 10px text, raised to 11px by the
   design system part, on --neutral #8B8D85. That computes to 3.36 to 1
   against a 4.5 floor. docs/06-design-system-tawa.md section 5 says it in as
   many words: --neutral is safe only because it never carries text, keep it
   a pin fill and a legend swatch. Here it was carrying text.

   It takes the same treatment the rail badge already gives an informational
   count, --action-soft with --brand-jade-deep, which computes to 13.0 to 1
   and makes the two badge components in the shell agree with each other. The
   warn and crit branches are untouched: white on --warn is 5.02 and white on
   --critical is 8.02, and crit is still only reachable from an expired 8
   hour clock. */
.fl-badge{background:var(--action-soft);color:var(--brand-jade-deep)}

/* The rail carried a hand written 0 -2px 12px rgba(0,0,0,.06). The design
   system part publishes --el-1-up, which is that shadow built from --ink and
   flipped on one axis for exactly this element. Same weight, one system. */
#botrail{box-shadow:var(--el-1-up)}
/* The active marker was left:22% right:22%, which is a percentage of a
   button whose width changes with the number of surfaces a persona has, so
   the bar under a four item rail and a five item rail were different widths.
   A fixed 24px bar, centred, is the same mark everywhere and it is the same
   3px jade the rail and the palette now use. */
#botrail button[aria-current="page"]::before{
  left:50%;right:auto;width:24px;margin-left:-12px;
  border-radius:0 0 var(--r-bar) var(--r-bar);
}

/* ---- design-mgr ---- */
/* =====================================================================
   THE STORE MANAGER CONSOLE
   Owner: design mgr agent. This file is CSS only and touches nothing
   outside the four store manager surfaces: training, team, drills and
   report.

   HOW IT IS SCOPED. There is no data-persona attribute on <html> or
   <body>. The only element that declares the persona is the hero, which
   publishes #hero[data-hpersona="mgr"] and is a direct child of the one
   .wrap inside #app. So every rule here opens with

     #app .wrap:has(> #hero[data-hpersona="mgr"])

   which is the same hook the HQ layer settled on, for the same reason.
   Where a hook is globally unique to this console (#rnar, #rsubmit,
   #rlist, #a-confirm, [data-acourse], [data-apick], [data-adept],
   [data-rtreat], [data-drill]) the id or attribute is used on its own,
   because a selector that says what it targets is easier to delete than
   one that says where it lives. Match counts were taken across all four
   personas and all four manager tabs before anything was written:

     .card:has(> .field > .card)     0 hq, 0 legal, 0 emp, 1 team, 0 else
     .card:has(> .field > #rlist)    0 everywhere except 1 on report
     .pillbar:has(> [data-acourse])  1 on team once people are picked
     .field:has([data-rtreat])       1 on report

   Every measurement below was taken in headless Chromium 141 at 1440px
   and 390px, EN and 中文, store R101 with its 40 person roster. No hex
   is written in this file. Nothing here animates on its own; the two
   colour transitions on the step markers inherit the global
   prefers-reduced-motion block in index.html, which sets
   transition-duration to .01ms with !important on every element and
   pseudo element.

   THE COLOUR RULE. Brand says whose store, status says how urgent, and
   they never overlap. --critical belongs to the 8 hour Cal/OSHA clock
   and appears nowhere in this file. The treatment level field is the
   most consequential control in the product and it is made prominent
   with size, weight and a boundary, not with an alarming colour: the
   alarm is the clock chip that field produces, and it has to be able to
   shout when it arrives.
   ===================================================================== */


/* =====================================================================
   1. THE ASSIGNMENT PANEL, WHY IT READS AS ONE SCROLL
   ===================================================================== */

/* ---- 1a. The panel title ----------------------------------------------

   MEASURED. The panel is 1148 by 1164px empty and 1148 by 3100px once
   14 people and 3 modules are picked. Its title carries an inline
   font-size:19px, which is not a step on the scale (11, 12.5, 13.5, 15,
   17, 21, 30) and is the only 19px in the console. It is also the title
   of the single most complex interaction in the app, sitting under a
   26px page h1, and at 19px it was closer to the 17px section headings
   below it than to anything that announces an action.

   Snapped up to --fs-h1 rather than down to --fs-h2, because the page
   h1 is 26px and there is room for a real second step. Inline styles
   beat any selector, so this needs !important; that is what the
   markupProposals section of the report asks to be removed. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) h2{
  font-size:var(--fs-h1) !important;
  line-height:1.2;
  letter-spacing:-.01em;
}

/* ---- 1b. The live counters in the panel header -------------------------

   MEASURED. "0 selected" and "0 modules" are .chip at 11.5px. They are
   the only live feedback the header gives while you work, and their
   numerals were proportional, so the chip changed width as the count
   went 9 to 10 to 11 and the row jittered. Tabular figures hold the
   column. Nothing else about them changes: they stay the quiet neutral
   chip, because a count of people is not a status. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > div:first-child .chip{
  font-variant-numeric:tabular-nums;
}


/* =====================================================================
   2. THE FOUR STEPS, MADE INTO A SEQUENCE
   ===================================================================== */

/* ---- 2a. Why this is not a wizard --------------------------------------

   MEASURED, before. The four steps were four .field blocks whose only
   differentiation was the label text: "1 · Who" through "4 · Confirm",
   every one of them 12.5px, weight 600, --ink-muted, 5px above its
   content, identical to the seven field labels on the incident form on
   another tab. Step heights were 446.5, 442.8, 42.5 and 61.3px empty.
   So the eye got no signal that these four blocks were ordered, that
   they depended on each other, or that any of them was finished. It
   read as one 1164px scroll of form.

   The whole point of this panel is that all four steps stay visible and
   update live, so a wizard would be a downgrade. What it needed was the
   thing a wizard borrows from a checklist: a spine, a marker per step,
   and a marker that fills in when the step is satisfied.

   The fill is driven by :has() against the same state the panel already
   renders, so it costs no JS and no markup and it cannot fall out of
   sync with the panel:

     step 1 done   .field:has([data-apick]:checked)
     step 2 done   .field:has([data-acourse][aria-pressed="true"])
     step 3 done   .field:has(table)          the due date table only
                                              exists once a module is on
     step 4 done   .field:has(#a-confirm)     the verb button only
                                              exists once there is
                                              something to create

   Verified in the browser: with nothing picked, 0 of 4 markers fill;
   with 14 people picked, 1 of 4; with 14 people and 3 modules, 4 of 4.

   CONTRAST. The pending marker ring is --rule-int, 3.45 to 1 on --card,
   over the 3.0 floor for a meaningful graphic. --rule at 1.36 was too
   faint to be a state, so it is used only for the connector line
   between markers, which carries no information on its own. The done
   marker is --action with a white check, 9.15 to 1. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field{
  position:relative;
  margin-bottom:0;
  padding:0 0 var(--s5) 34px;
}
/* The connector runs from each marker to the next one. It is drawn on
   the step it starts at, so the segment leading out of a finished step
   can be jade while the one below it is still grey, which is what makes
   the progression readable at a glance rather than after reading. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field::before{
  content:"";
  position:absolute;
  left:9px; top:4px; bottom:0;
  width:2px;
  background:var(--rule);
  border-radius:var(--r-bar);
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field::after{
  content:"";
  position:absolute;
  left:0; top:1px;
  width:20px; height:20px;
  box-sizing:border-box;
  border:2px solid var(--rule-int);
  border-radius:50%;
  background:var(--card);
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:700;
  line-height:1;
  color:var(--card);
  transition:background-color .18s ease, border-color .18s ease;
}
/* The last step ends the sequence, so it gets no connector below it. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:last-child{
  padding-bottom:0;
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:last-child::before{
  display:none;
}
/* Satisfied steps. The check glyph is language neutral, which matters
   because this panel ships in EN and 中文 from the same rule, and it is
   the same glyph the roster picker already uses for a chosen row. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:has([data-apick]:checked)::after,
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:has([data-acourse][aria-pressed="true"])::after,
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:has(table)::after,
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:has(#a-confirm)::after{
  content:"✓";
  background:var(--action);
  border-color:var(--action);
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:has([data-apick]:checked)::before,
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:has([data-acourse][aria-pressed="true"])::before,
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field:has(table)::before{
  background:var(--action);
}

/* ---- 2b. The step label is a heading, not a caption --------------------

   MEASURED. 12.5px 600 --ink-muted at every one of the four steps, the
   same treatment the app gives to the label above a text input. A step
   in a four step sequence is a heading. Raised to --fs-lead 15px in
   --ink, which is the step the design system reserves for "empty state
   title, drawer title", the same rank as the other things in this app
   that name a block of content. --ink on --card is 17.44 to 1.

   Uppercase and tracking are deliberately NOT added: 中文 gets nothing
   from either, and the app already strips them from eyebrows under
   [data-lang="zh"] for that reason. Weight carries it in both. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field > label.fl{
  font-size:var(--fs-lead);
  color:var(--ink);
  line-height:1.35;
  margin-bottom:var(--s3);
  letter-spacing:normal;
}


/* =====================================================================
   3. STEP 1, THE WHO LIST
   ===================================================================== */

/* ---- 3a. The sticky headers do stick, and here is the evidence ---------

   This is the bug the design system says has shipped twice, so it was
   tested rather than read. Method: scroll the box to 260px and read
   getBoundingClientRect().top of every department header relative to
   the box.

     LEADERSHIP  relTop 1.0   height 51   position sticky   z 1
     MEAT        relTop 1.0   height 51   position sticky   z 1
     PROD        relTop 428   GROC 804    BAKE 1375
     FRONT       relTop 1816  RECV 2322

   Both stuck headers land at the same offset and the later one paints
   over the earlier one, which is correct because every header is an
   opaque 51px band of the same height. Row one is never covered: it
   begins at relTop 52. The reason it works is that the box itself is
   the scroll container, so sticky resolves against the box and not
   against the page, which is the trap the shell contract describes.
   Nothing is changed here. It is recorded so the next person does not
   have to test it a fourth time.

   What IS changed: the box is a .card nested inside a .card, both
   --card white, and the only thing separating them was a 1px --rule at
   1.36 to 1. A control you scroll should look like a control. Border
   moved to --rule-int, 3.45 to 1 on --card and over the 3.0 floor for a
   control boundary, and the radius moved from the 12px container step
   to the 9px control step, which is what section 8 of the design system
   assigns to a card inside a card. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) > .field > .card{
  border-color:var(--rule-int);
  border-radius:var(--r-ctl);
  overscroll-behavior:contain;
}

/* ---- 3b. The row ------------------------------------------------------

   MEASURED. Rows are 65px, headers 51px, box 400px, so the box shows
   its header plus 5.4 of 40 people. The half row at the bottom is the
   only affordance saying the list continues, and it is a good one, so
   the height is left alone on desktop.

   The checkbox is 20px with accent-color jade, set inline. The whole
   row is a <label>, so the touch target is the full 1098 by 65px and
   the 44px working agreement is met by the row rather than by the box.
   Recorded because a 20px checkbox looks like a violation and is not.

   The one change: the name and the id are the two things a manager
   scans, and the id was 12px proportional inside a .s line that also
   carries the job title. Tabular figures on the whole row line the ids
   up into a column, which is the difference between a roster you scan
   and a roster you read. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) [data-apick] ~ .g .s .mono{
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
}

/* ---- 3c. The department header ----------------------------------------

   MEASURED. 51px tall, holding an 11.5px uppercase department name, an
   N of M counter, and a 34px "Select all" ghost button. The counter and
   the name were the same weight and nearly the same size, so the header
   read as a sentence rather than as a label plus a count.

   The counter is the live number in this header, so it gets the mono
   treatment every other live count in the app has. The header text
   itself is untouched: it already drops its uppercase under
   [data-lang="zh"] through the app's own eyebrow rule. */
#app .wrap:has(> #hero[data-hpersona="mgr"]) [data-adept]{
  flex:none;
}
#app .wrap:has(> #hero[data-hpersona="mgr"]) .card:has(> .field > .card) .sub.mono{
  font-variant-numeric:tabular-nums;
  font-size:var(--fs-meta);
}


/* =====================================================================
   4. STEP 2, THE MODULE LIST
   ===================================================================== */

/* ---- 4a. Seventeen pills in a ragged wrap ------------------------------

   MEASURED, before. With 14 people selected the offer is 17 modules,
   not the 14 the brief remembered, and it grows with the selection.
   Each was a .fchip pill 34px tall, and their widths ran 300.4, 306.9,
   307.7, 328.8, 351.8, 356.4, 358.4, 371.3, 377.2, 395.7, 398.0, 414.3,
   421.3, 432.8, 439.2, 453.9 and 478.3px. Wrapped into 1098px that is
   six rows of two or three, with every row breaking in a different
