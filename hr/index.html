function sReporting(){const rb=S.rb;
  const status={ok:['ok','On schedule'],approval:['warn','Awaiting approval'],exception:['alert','Exception'],review:['','Manual review']};
  const RBM=[['headcount','Headcount by department'],['absence','Absence rate by shift'],['calls','Call volume by reason'],['turnover','Turnover by tenure'],['leave','Leave utilization by month'],['coverage','Time coverage by bucket'],['points','Attendance points by department']];
  const rbRun=()=>{const scope=e=>!e.dupOf&&(rb.dept==='all'||e.dept===rb.dept)&&(rb.status==='all'||e.status===rb.status);
    if(rb.metric==='headcount')return{head:['Department','Headcount'],rows:DEPTS.filter(d=>rb.dept==='all'||d.c===rb.dept).map(d=>[d.en,EMP.filter(e=>scope(e)&&e.dept===d.c&&e.status!=='term').length]),
      sql:`SELECT d.name AS department, COUNT(*) AS headcount\nFROM employees e\nJOIN departments d ON d.id = e.department_id\nWHERE e.status IN ('active','leave')${rb.dept!=='all'?`\n  AND d.code = '${rb.dept}'`:''}\nGROUP BY d.name\nORDER BY headcount DESC;`};
    if(rb.metric==='absence')return{head:['Shift','Events','Rate'],rows:SHIFTS.map(s=>{const ev=attWindow(+rb.period,a=>(a.type==='calloff'||a.type==='ncns')&&a.shift===s.c&&(rb.dept==='all'||a.dept===rb.dept)).length;const ppl=EMP.filter(e=>scope(e)&&e.shift===s.c&&e.lv<3&&e.status!=='term').length;return[s.en,ev,(100*ev/Math.max(1,ppl*+rb.period*5/7)).toFixed(2)+'%'];}),
      sql:`WITH sched AS (\n  SELECT shift, COUNT(*) * ${rb.period} * 5.0/7 AS shifts\n  FROM employees WHERE status = 'active' GROUP BY shift)\nSELECT a.shift,\n       COUNT(*) AS events,\n       ROUND(100.0 * COUNT(*) / s.shifts, 2) AS absence_rate\nFROM attendance_events a\nJOIN sched s ON s.shift = a.shift\nWHERE a.type IN ('calloff','ncns')\n  AND a.occurred_at >= now() - interval '${rb.period} days'\nGROUP BY a.shift, s.shifts;`};
    if(rb.metric==='points')return{head:['Department','People','At 3+ points','At 4+ points','Avg points'],rows:DEPTS.filter(d=>rb.dept==='all'||d.c===rb.dept).map(d=>{const ppl=EMP.filter(e=>e.status==='active'&&e.lv<3&&!e.dupOf&&e.dept===d.c);const pts=ppl.map(e=>pointsFor(e.id).pts);return[d.en,ppl.length,pts.filter(x=>x>=3).length,pts.filter(x=>x>=4).length,(pts.reduce((a,x)=>a+x,0)/Math.max(1,ppl.length)).toFixed(2)];}),
      sql:`WITH pts AS (\n  SELECT a.employee_id,\n         SUM(p.points) AS points\n  FROM attendance_events a\n  JOIN points_policy p ON p.event_type = a.type\n  WHERE a.occurred_at >= now() - interval '${POINTS_WINDOW} days'\n  GROUP BY a.employee_id)\nSELECT d.name AS department,\n       COUNT(e.id) AS people,\n       COUNT(*) FILTER (WHERE pts.points >= 3) AS at_three_plus,\n       COUNT(*) FILTER (WHERE pts.points >= 4) AS at_four_plus,\n       ROUND(AVG(COALESCE(pts.points, 0)), 2) AS avg_points\nFROM employees e\nJOIN departments d ON d.id = e.department_id\nLEFT JOIN pts ON pts.employee_id = e.id\nWHERE e.status = 'active'${rb.dept!=='all'?`\n  AND d.code = '${rb.dept}'`:''}\nGROUP BY d.name\nORDER BY at_three_plus DESC;`};
    if(rb.metric==='coverage')return{head:['Bucket','Rows','Hours applied'],rows:COVER_BUCKETS.map(([k,l])=>{const c=coverSince(TODAY-(+rb.period-1)*DAY,x=>x.bucket===k&&(rb.dept==='all'||x.dept===rb.dept));return[l,c.length,c.reduce((a,x)=>a+x.hours,0).toFixed(2)];}),
      sql:`SELECT bucket,\n       COUNT(*) AS applications,\n       SUM(hours_applied) AS hours\nFROM time_coverage tc\nJOIN employees e ON e.id = tc.employee_id\nWHERE tc.created_at >= now() - interval '${rb.period} days'${rb.dept!=='all'?`\n  AND e.department_id = '${rb.dept}'`:''}\nGROUP BY bucket\nORDER BY hours DESC;`};
    if(rb.metric==='calls')return{head:['Reason','Contacts, 14d'],rows:REASONS.map(x=>[x.en,CONTACTS.reduce((a,r)=>a+(r.by[x.c]||0),0)]),
      sql:`SELECT reason, SUM(count) AS contacts\nFROM contact_daily\nWHERE date >= current_date - 13\nGROUP BY reason\nORDER BY contacts DESC;`};
    if(rb.metric==='turnover')return{head:['Tenure band','Separations, 12 mo'],rows:[['Under 90 days',0],['90 days to 1 year',0],['1 to 3 years',0],['Over 3 years',0]].map(b=>{const n=EMP.filter(e=>!e.dupOf&&e.term&&e.status==='term'&&e.term>=NOW-365*DAY&&(rb.dept==='all'||e.dept===rb.dept)&&(()=>{const t=(e.term-e.hired)/DAY;return b[0]==='Under 90 days'?t<90:b[0]==='90 days to 1 year'?t>=90&&t<365:b[0]==='1 to 3 years'?t>=365&&t<1095:t>=1095;})()).length;return[b[0],n];}),
      sql:`SELECT CASE\n         WHEN termination_date - hire_date < 90 THEN 'Under 90 days'\n         WHEN termination_date - hire_date < 365 THEN '90 days to 1 year'\n         WHEN termination_date - hire_date < 1095 THEN '1 to 3 years'\n         ELSE 'Over 3 years' END AS tenure_band,\n       COUNT(*) AS separations\nFROM employees\nWHERE status = 'term'\n  AND termination_date >= now() - interval '12 months'\nGROUP BY 1 ORDER BY MIN(termination_date - hire_date);`};
    return{head:['Month','Leave cases starting'],rows:Array.from({length:6},(_,i)=>{const d=new Date(NOW);d.setMonth(d.getMonth()-(5-i));const y=d.getFullYear(),mo=d.getMonth();return[d.toLocaleDateString('en-US',{month:'short'}),LEAVES.filter(l=>{const s=new Date(l.start);return s.getFullYear()===y&&s.getMonth()===mo&&(rb.dept==='all'||l.dept===rb.dept);}).length];}),
      sql:`SELECT date_trunc('month', start_date) AS month, COUNT(*) AS leave_cases\nFROM leave_cases\nWHERE start_date >= now() - interval '6 months'\nGROUP BY 1 ORDER BY 1;`};};
  const out=rb.ran?rbRun():null;
  const pick=(k,items,cur)=>`<div class="pillbar">${items.map(([v,l])=>`<button class="pick" data-rb="${k}:${v}" aria-pressed="${cur===v}">${esc(l)}</button>`).join('')}</div>`;
  return `<section>${sectionHead('Reporting center','What runs, who owns it, when it last ran, and whether it needs a human before it leaves HR.',demoTag())}

/* ============================================================================
   DEPARTMENT MANAGER CONSOLE. One department, one roster, the cases waiting
   on this manager, and the training the department owes. S.store holds the
   department code (the name is the shell layers' word for the unit in context).
   ============================================================================ */

function teamList(){const rs=(ROSTER[S.store]||[]).filter(e=>e.status!=='term'&&!e.dupOf);const f=S.filter;
  return rs.filter(e=>f==='all'||(f==='att'&&empAtt(e.id,30).length>=2)||(f==='train'&&!empCompliance(e).ok)||(f==='leave'&&e.status==='leave')).sort((a,b)=>b.lv-a.lv||a.name.localeCompare(b.name));}
const asgElig=(e,cc)=>required(e).some(c=>c.c===cc);
function asgPeople(){return S.assign.people.map(id=>EMPBY[id]).filter(Boolean)}
function asgOffer(ppl){const m={};ppl.forEach(e=>required(e).forEach(c=>{m[c.c]=(m[c.c]||0)+1}));return COURSES.filter(c=>m[c.c]).map(c=>({c:c,n:m[c.c]}));}
function asgPrune(){const ppl=asgPeople();S.assign.courses=S.assign.courses.filter(cc=>ppl.some(e=>asgElig(e,cc)));}
function asgTotals(){const ppl=asgPeople(),rows=[];
  ppl.forEach(e=>S.assign.courses.forEach(cc=>{if(!asgElig(e,cc))return;const s=certState(e,cc);if(s.s==='current')return;rows.push({emp:e.id,c:cc,due:NOW+CBY[cc].gd*DAY,s:s.s});}));
  return{rows:rows,recip:new Set(rows.map(r=>r.emp)).size};}
const CAMP={};
function campaigns(sc){if(CAMP[sc])return CAMP[sc];const r=rng(hash(sc+'asg'));const list=[];
  const rs=(ROSTER[sc]||[]).filter(e=>e.lv<3);
  for(let i=0;i<2;i++){const cc=pick(r,['CMP-110','CMP-120','CMP-102']);const people=rs.slice(i*6,i*6+6+Math.floor(r()*6));
    list.push({id:'ASG-'+(8100+i+hash(sc)%50),at:NOW-Math.floor(r()*40+3)*DAY,courses:[cc],rows:people.map(e=>({emp:e.id,c:cc,due:NOW-Math.floor(r()*20-10)*DAY,s:r()<.6?'done':r()<.8?'prog':'asg'}))});}
  return CAMP[sc]=list;}

function mgrTeam(){const d=dep(S.store);const rs=teamList();const all=(ROSTER[S.store]||[]).filter(e=>e.status!=='term'&&!e.dupOf);
  const td=attToday().filter(a=>a.dept===S.store);const wmgr=openCases().filter(c=>c.dept===S.store&&c.status==='wmgr');
  return `<section><h2>Today in ${esc(d.en)}</h2>
    <div class="grid g4" style="margin-bottom:16px">${kpi(num(all.length),'people','Active plus on leave')}${kpi(num(td.filter(a=>a.type==='calloff').length),'call-offs today','Received by the HR desk',td.filter(a=>a.type==='calloff').length>3?'warn':'')}${kpi(num(all.filter(e=>e.lv<3&&pointsFor(e.id).pts>=3).length),'at 3+ points','Written warning step or beyond; review with HR',all.filter(e=>e.lv<3&&pointsFor(e.id).pts>=3).length?'bad':'good')}${kpi(pct(all.filter(e=>empCompliance(e).ok).length,all.length)+'%','training current','No expired or missing module',pct(all.filter(e=>empCompliance(e).ok).length,all.length)>=90?'good':'warn')}</div>
    ${td.length?`<div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:8px">Attendance alerts, today</h3><dl class="dlist c3">${td.map(a=>{const e=EMPBY[a.emp]||{};return `<div class="dlrow" data-attrev="${a.emp}" tabindex="0" role="button" aria-label="Open attendance review for ${esc(e.name)}"><dt><b>${esc(e.name)}</b><br><span class="sub">${esc(e.title)} · ${esc(shf(a.shift).en)}</span></dt><dd>${esc(label(ATT_TYPES,a.type))}<br><span class="sub">${esc(a.reason)}</span></dd><dd class="sub mono">${esc(ftime(a.at))}${a.mgrNotified?'':' <span class="chip warn">not yet notified</span>'}</dd></div>`}).join('')}</dl></div>`:''}
  </section>
  <section><h2>Notices from the HR desk</h2>
    ${(()=>{const list=CASES.filter(c=>c.dept===S.store&&c.mgrInformed&&c.mgrInformed>=TODAY-6*DAY).sort((a,b)=>b.mgrInformed-a.mgrInformed);
      return list.length?tbl(['When','Employee','Contact','Event','Status',''],list.slice(0,20).map(c=>{const e=EMPBY[c.emp]||{};const a=(c.att||[]).map(id=>ATT.find(x=>x.id===id)).filter(Boolean)[0];
        return `<tr><td class="mono sub">${esc(fdt(c.mgrInformed))}</td><th scope="row"><b>${esc(e.name||'')}</b><br><span class="sub">${esc(e.title||'')}</span></th><td>${esc(RBYC[c.reason].en)}</td><td>${a?esc(label(ATT_TYPES,a.type))+(a.type==='late'||a.type==='early'?' · '+a.minutes+' min':''):'<span class="sub">none</span>'}</td><td>${caseStatusChip(c.status)}</td><td><button class="btn ghost sm" data-case="${c.id}">Open</button></td></tr>`}).join(''),{caption:'HR desk notices, 7 days',hint:'What the desk sent this department. Category and event only; reason detail and balances stay with HR.'})
      :empty('No notices this week','When the HR desk informs this department about a contact, it appears here and on the bell.');})()}
  </section>
  <section><h2>${t('myTeam')}</h2>
    ${chipRow([['all','Everyone'],['att','2+ attendance events, 30d'],['train','Training due'],['leave','On leave']],'filter',S.filter)}
    ${tbl(['Name','Title','Shift',{l:'Events, 30d',cls:'num'},{l:'Points',cls:'num'},'Training','Status'],rs.slice(0,60).map(e=>{const n=empAtt(e.id,30).length;const c=empCompliance(e);const pp=e.lv<3?pointsFor(e.id).pts:null;const sd=pp==null?null:pointsStanding(pp);
      return `<tr data-emp="${e.id}" tabindex="0" role="button" aria-label="Open employee record ${esc(e.name)}"><th scope="row"><b>${esc(e.name)}</b><br><span class="sub mono">${esc(e.id)}</span></th><td>${esc(e.title)}</td><td>${esc(shf(e.shift)?shf(e.shift).en:'')}</td><td class="num mono ${n>=3?'h-bad':''}">${n}</td><td class="num mono">${pp==null?'':pp.toFixed(1)+(pp>=3?' <span class="chip alert">'+esc(sd[1])+'</span>':pp>=2?' <span class="chip warn">coaching</span>':'')}</td><td>${c.ok?'<span class="chip ok">Current</span>':`<span class="chip alert">${c.bad} due</span>`}</td><td><span class="chip ${e.status==='leave'?'warn':''}">${esc(e.status)}</span></td></tr>`}).join(''),{caption:'Department roster',hint:`${Math.min(60,rs.length)} of ${rs.length}. Managers see attendance counts, points standing and training status for their own team only; no pay, no leave detail. A standing is computed; the step is decided with HR.`})}
    <div class="crow" style="margin-top:10px"><div class="spacer"></div><button class="btn ghost sm" id="exp-team">Export roster</button></div>
  </section>`;}

function mgrAttendance(){const d=dep(S.store);const wmgr=openCases().filter(c=>c.dept===S.store&&c.status==='wmgr');const open=openCases().filter(c=>c.dept===S.store&&c.status!=='wmgr');
  const wk=attWindow(7,a=>a.dept===S.store);const undoc=wk.filter(a=>!a.documented);
  return `<section><h2>Manager responses due</h2>
    ${wmgr.length?tbl(['SLA','Case','Employee','Reason','Opened','What HR needs'],wmgr.map(c=>{const e=EMPBY[c.emp]||{};return `<tr data-case="${c.id}" tabindex="0" role="button" aria-label="${esc(caseRowLabel(c))}"><td>${slaChip(c)}</td><td class="mono">${esc(c.id)}</td><td>${esc(e.name)}</td><td>${esc(RBYC[c.reason].en)}</td><td class="sub mono">${esc(fdt(c.opened))}</td><td class="sub">Confirm the event and add your note on the case</td></tr>`}).join(''),{caption:'Cases waiting on the manager'}):empty('Nothing is waiting on you','HR has no open question for this department.')}
  </section>
  <section><h2>Call-offs and events, 7 days</h2>
    <div class="grid g4" style="margin-bottom:16px">${kpi(num(wk.filter(a=>a.type==='calloff').length),'call-offs','This department')}${kpi(num(wk.filter(a=>a.type==='ncns').length),'no-call / no-show','Document the same day',wk.filter(a=>a.type==='ncns').length?'bad':'good')}${kpi(num(undoc.length),'documentation pending','Due inside 48 hours of the shift',undoc.length?'warn':'good')}${kpi(num(open.length),'other open HR cases','This department')}</div>
    ${tbl(['Employee','Type','Reason','When','Documentation'],wk.slice(0,30).map(a=>{const e=EMPBY[a.emp]||{};return `<tr data-attrev="${a.emp}" tabindex="0" role="button" aria-label="Open attendance review for ${esc(e.name)}"><th scope="row"><b>${esc(e.name)}</b><br><span class="sub">${esc(shf(a.shift).en)} shift</span></th><td>${esc(label(ATT_TYPES,a.type))}</td><td>${esc(a.reason)}</td><td class="sub mono">${esc(fdt(a.at))}</td><td>${a.documented?'<span class="chip ok">On file</span>':`<span class="chip warn">Due ${esc(fshort(a.docDue))}</span>`}</td></tr>`}).join(''),{caption:'Attendance events, 7 days',hint:'Managers see the event, the category and the documentation state. The rolling counts and any review sit with HR.'})}
  </section>`;}

function mgrTraining(){const rs=(ROSTER[S.store]||[]).filter(e=>e.status!=='term'&&!e.dupOf);const mgr=rs.find(e=>e.role==='MGR');
  const mine=mgr?required(mgr).map(c=>({c:c,s:certState(mgr,c.c)})):[];
  const ppl=asgPeople();const offer=asgOffer(ppl);const tot=asgTotals();const hist=campaigns(S.store);
  const list=teamList();const a=S.assign.people;const allOn=list.length>0&&list.every(x=>a.indexOf(x.id)>=0);
  return `<section><h2>${t('myTraining')}</h2>
    ${mgr?`<div class="card"><dl class="dlist c4">${mine.map(x=>`<div class="dlrow"><dt>${esc(x.c.en)}<br><span class="sub mono">${esc(x.c.c)}</span></dt><dd class="sub">${x.s.exp?'lapses '+fdate(x.s.exp):' '}</dd><dd><span class="chip ${x.s.s==='current'?'ok':x.s.s==='expiring'?'warn':'alert'}">${esc(t(x.s.s))}</span></dd><dd>${x.s.s==='current'?`<button class="btn ghost sm" data-module="${x.c.c}">${t('review')}</button>`:`<button class="btn sm" data-module="${x.c.c}">${t('startModule')}</button>`}</dd></div>`).join('')}</dl></div>`:''}
  </section>
  <section><h2>Assign training to my team</h2>
    <div class="cx-two"><div class="card"><div class="crow" style="margin-bottom:8px"><h3>1. Pick people</h3><div class="spacer"></div><button class="btn ghost sm" data-adept="all" aria-pressed="${allOn}">${allOn?'Clear the team':'Select the whole team'}</button></div>
      <div style="max-height:320px;overflow:auto;border:1px solid var(--rule);border-radius:9px">${list.map(e=>`<label class="cx-check" style="padding:8px 12px;border-bottom:1px solid #F0EEE7"><input type="checkbox" data-apick="${e.id}" ${a.indexOf(e.id)>=0?'checked':''}><span><b>${esc(e.name)}</b> <span class="sub">${esc(e.title)}${empCompliance(e).ok?'':' · '+empCompliance(e).bad+' due'}</span></span></label>`).join('')}</div></div>
      <div class="card"><h3 style="margin-bottom:8px">2. Pick modules</h3>
        ${ppl.length?`<div class="pillbar">${offer.map(x=>`<button class="pick" data-acourse="${x.c.c}" aria-pressed="${S.assign.courses.includes(x.c.c)}" title="${esc(x.c.en)}"><span class="mono">${x.c.c}</span> <span class="sub">${x.n}</span></button>`).join('')}</div><div class="hint">Only modules somebody in the selection actually requires are offered. The count is how many of the selected people it applies to.</div>`:'<div class="hint">Pick people first. The module list is derived from what they require.</div>'}
        <h3 style="margin:16px 0 8px">3. Confirm</h3>
        <dl class="kv"><dt>People</dt><dd class="mono">${ppl.length}</dd><dt>Assignments</dt><dd class="mono">${tot.rows.length}</dd><dt>Skipped, already current</dt><dd class="mono">${ppl.length*S.assign.courses.length-tot.rows.length}</dd></dl>
        <div class="crow" style="margin-top:12px"><button class="btn ghost sm" id="a-clear">Clear</button><div class="spacer"></div><button class="btn sm" id="a-confirm" ${tot.rows.length?'':'disabled'}>Create ${tot.rows.length} assignments</button></div></div></div>
    <h3 style="margin:16px 0 8px">Assignment history, this department</h3>
    ${hist.map(h=>`<div class="chist"><div class="crow"><b class="mono">${esc(h.id)}</b><span class="sub">${esc(fdate(h.at))} · ${h.courses.map(c=>esc(c)).join(', ')}</span><div class="spacer"></div><span class="mono">${h.rows.filter(r=>r.s==='done').length} / ${h.rows.length} done</span></div></div>`).join('')}
  </section>`;}

function mgrLeave(){const L=LEAVES.filter(l=>l.dept===S.store);
  return `<section><h2>Leave and returns</h2>
    ${L.length?tbl(['Employee','Start','Expected return','Status'],L.map(l=>{const e=EMPBY[l.emp]||{};return `<tr><th scope="row"><b>${esc(e.name)}</b><br><span class="sub">${esc(e.title||'')}</span></th><td class="mono">${esc(fshort(l.start))}</td><td class="mono">${esc(fshort(l.ret))}</td><td><span class="chip">${esc(label(LEAVE_STATUS,l.status))}</span></td></tr>`}).join(''),{caption:'Leave in this department',hint:'Managers see dates and status only. Leave type, documentation and any detail stay with HR (SOP-04).'}):empty('Nobody in this department is on leave','')}
  </section>`;}

function viewMgr(){const d=dep(S.store);const tabs=[['team',t('myTeam')],['attendance','Attendance'],['training','Training'],['leave','Leave']];
  const body=S.tab==='attendance'?mgrAttendance():S.tab==='training'?mgrTraining():S.tab==='leave'?mgrLeave():mgrTeam();
  return `<div class="wrap">
  <div class="pagehead"><div><div class="eyebrow">Department console</div><h1>${esc(d?d.en:'')}</h1>
    <div class="sub"><label for="storepick" class="vh">Department</label><select id="storepick">${DEPTS.map(x=>`<option value="${x.c}" ${x.c===S.store?'selected':''}>${esc(x.en)}</option>`).join('')}</select></div></div>
    <div class="spacer"></div></div>
  <div class="tabs" role="tablist" style="display:none">${tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${esc(l)}</button>`).join('')}</div>
  ${body}${footer()}
  <nav class="bottomnav mobileonly" style="display:none">${tabs.map(([k,l])=>`<button data-tab="${k}" aria-selected="${S.tab===k}">${esc(l)}</button>`).join('')}</nav></div>`;}

/* ---- benefits ---- */
/* ============================================================================
   MY BENEFITS, dental enrollment for the employee console.
   Ported from the BenefitsFlow dental module (June 2026): plan comparison,
   coverage tier with the paycheck impact, a DHMO primary dentist pick, a
   procedure cost estimator on ADA CDT codes, and an election that writes a
   pending change for HR. Everything a person needs to choose is on one
   surface; nothing about anyone else.
   ============================================================================ */

S.ben = S.ben || {plan:null, tier:null, dentist:null, items:{}, dedMet:false, q:'', scen:null, qle:null};
/* The demo employee has a life event window open, reported five days ago, so
   the election path can be walked outside November. */
if(S.me && S.me.benefits && !S.me.benefits.dental.qle) S.me.benefits.dental.qle = {type:'Birth or adoption', at:Date.now() - 5 * DAY, until:Date.now() + 25 * DAY, caseId:'HRC-0991'};

const money = n => '$' + (Math.round(n * 100) / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

function benState(){const e = S.me; const d = (e.benefits && e.benefits.dental) || {plan:null, tier:null};
  const f = S.ben; if(f.plan === null && f.tier === null && !f._seeded){f.plan = d.plan || 'ppo'; f.tier = d.tier || 'ee'; f.dentist = d.dentist || null; f._seeded = true;}
  return {e, d, f};}

function benWindow(e){const d = e.benefits.dental;
  if(d.qle && Date.now() < d.qle.until) return {open:true, why:'Life event window, ' + d.qle.type.toLowerCase() + ', closes ' + fshort(d.qle.until)};
  if(oeOpen()) return {open:true, why:'Open enrollment through ' + fshort(OE_END)};
  if(e.hired && Date.now() - e.hired < 30 * DAY) return {open:true, why:'New hire window, 30 days from ' + fshort(e.hired)};
  return {open:false, why:'Open enrollment ' + fshort(OE_START) + ' to ' + fshort(OE_END) + ' for the ' + PLAN_YEAR + ' plan year. Outside it, a change needs a qualifying life event.'};}

function benPlanCard(k, f){const P = DENTAL_PLANS[k]; const on = f.plan === k;
  return '<button type="button" class="cx-plan' + (on ? ' on' : '') + '" data-bplan="' + k + '" aria-pressed="' + on + '"><span class="k">' + esc(P.name) + '</span><span class="c">' + esc(P.carrier) + '</span>' +
    '<span class="p">' + money(DENTAL_PREMIUM[k][f.tier || 'ee']) + ' <small>per paycheck, ' + esc(label(DENTAL_TIERS, f.tier || 'ee').toLowerCase()) + '</small></span>' +
    '<ul>' + P.lines.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul></button>';}

function benCompare(){const P = DENTAL_PLANS.ppo, D = DENTAL_PLANS.dhmo;
  const row = (l, a, b) => '<tr><th scope="row">' + esc(l) + '</th><td>' + a + '</td><td>' + b + '</td></tr>';
  return '<div class="card" style="padding:0"><div class="tblwrap"><table class="tbl"><thead><tr><th scope="col">Compare</th><th scope="col">Dental PPO</th><th scope="col">Dental DHMO</th></tr></thead><tbody>' +
    row('Network', esc(P.network), esc(D.network)) + row('Deductible', '$' + P.deductible + ' person, $' + P.famDeductible + ' family', 'None') +
    row('Calendar year maximum', '$' + P.annualMax.toLocaleString() + ' per person', 'None') + row('Preventive and diagnostic', 'Covered in full', 'Fixed copay, $5') +
    row('Basic and restorative', '10% after deductible', 'Fixed copay per procedure') + row('Major', '40% after deductible, 12 month wait', 'Fixed copay per procedure') +
    row('Orthodontia', '50%, $' + P.orthoMax.toLocaleString() + ' lifetime', '<span class="chip warn">Not covered</span>') + row('Choose a dentist', 'Any; preferred network pays best', 'Primary dentist at enrollment; referrals for specialists') +
    '</tbody></table></div><div class="hint" style="padding:8px 16px 12px">Illustrative plans for this work sample. The real summary of benefits and coverage governs.</div></div>';}

function benTiers(f){return '<div class="pillbar" style="margin-bottom:8px">' + DENTAL_TIERS.map(([k, l]) => '<button class="pick" data-btier="' + k + '" aria-pressed="' + (f.tier === k) + '">' + esc(l) + '</button>').join('') + '</div>';}

function benPaycheck(f){if(!f.plan) return '<div class="hint">Waiving dental: nothing is deducted.</div>';
  const per = DENTAL_PREMIUM[f.plan][f.tier], yr = dentalAnnualPremium(f.plan, f.tier); const other = f.plan === 'ppo' ? 'dhmo' : 'ppo'; const diff = DENTAL_PREMIUM[other][f.tier] - per;
  return '<div class="cx-pay"><div class="kpi"><div class="v">' + money(per) + '</div><div class="k">per paycheck</div><div class="d">' + PAY_PERIODS + ' pay periods, pre-tax</div></div>' +
    '<div class="kpi"><div class="v">' + money(yr) + '</div><div class="k">per year</div><div class="d">' + esc(DENTAL_PLANS[f.plan].name) + ', ' + esc(label(DENTAL_TIERS, f.tier).toLowerCase()) + '</div></div>' +
    '<div class="kpi"><div class="v">' + (diff >= 0 ? '+' : '') + money(diff) + '</div><div class="k">the other plan, per paycheck</div><div class="d">' + esc(DENTAL_PLANS[other].name) + ' would cost ' + (diff >= 0 ? 'more' : 'less') + '</div></div></div>';}

function benDentists(f){return '<div class="cx-dent">' + DHMO_DENTISTS.map(d => '<button type="button" class="cx-dentist' + (f.dentist === d.id ? ' on' : '') + (d.accepting ? '' : ' off') + '" data-bdent="' + d.id + '" aria-pressed="' + (f.dentist === d.id) + '"' + (d.accepting ? '' : ' aria-disabled="true"') + '><span class="t">' + esc(d.name) + '</span><span class="s">' + esc(d.city) + ' · ' + d.mi + ' mi · ' + esc(d.lang) + '</span>' + (d.accepting ? '' : '<span class="chip warn">Not accepting new patients</span>') + '</button>').join('') + '</div>' +
  '<div class="hint">Fictional practices for the demo. A DHMO requires a primary dentist on file before the first visit; change it any month.</div>';}

function benEstimator(f){const q = (f.q || '').trim().toLowerCase();
  const hits = q ? DENTAL_PROCS.filter(p => p.code.toLowerCase().indexOf(q) >= 0 || p.desc.toLowerCase().indexOf(q) >= 0 || p.cat.toLowerCase().indexOf(q) >= 0).slice(0, 8) : [];
  const calc = dentalCalc(f.items, {dedMet:f.dedMet}); const n = Object.keys(f.items).length;
  const scen = '<div class="pillbar" style="margin-bottom:10px">' + DENTAL_SCENARIOS.map(s => '<button class="pick" data-bscen="' + s.k + '" aria-pressed="' + (f.scen === s.k) + '" title="' + esc(s.d) + '">' + esc(s.l) + '</button>').join('') + '<button class="pick" data-bscen="clear" aria-pressed="false">Clear</button></div>';
  const search = '<div class="field" style="margin-bottom:6px"><label class="fl vh" for="bsearch">Add a procedure</label><input id="bsearch" type="search" placeholder="Procedure code or name, e.g. D2740 or crown" autocomplete="off" value="' + esc(f.q || '') + '"></div>' +
    '<div id="bsugg">' + (hits.length ? '<div class="list cx-sugg">' + hits.map(p => '<button class="mrow cx-srow" data-bproc="' + p.code + '"><div class="g"><div class="t">' + esc(p.code) + ' <span class="sub">' + esc(p.desc) + '</span></div><div class="s">' + esc(p.cat) + ' · fee about $' + p.fee + (p.dhmo == null ? ' · not covered on DHMO' : ' · DHMO copay $' + p.dhmo) + '</div></div></button>').join('') + '</div>' : (q ? '<div class="hint">No procedure matches.</div>' : '')) + '</div>';
  const table = n ? '<div class="card" style="padding:0;margin-top:8px"><div class="tblwrap"><table class="tbl"><thead><tr><th scope="col">Procedure</th><th scope="col">Qty</th><th scope="col">Fee</th><th scope="col">You pay, PPO</th><th scope="col">You pay, DHMO</th><th scope="col"></th></tr></thead><tbody>' +
      calc.lines.map(l => '<tr><th scope="row">' + esc(l.code) + '<br><span class="sub">' + esc(l.desc) + '</span></th><td class="mono">' + l.qty + (l.over ? ' <span class="chip warn">over frequency</span>' : '') + '</td><td class="mono">' + money(l.fee) + '</td><td class="mono">' + money(l.ppo) + '</td><td class="mono">' + (money(l.dhmo) + (l.notCovered ? ' <span class="chip warn">not covered, full fee</span>' : '')) + '</td><td class="lg-act"><button class="btn ghost sm" data-bproc="' + esc(l.code) + '">+1</button><button class="btn ghost sm" data-bdel="' + esc(l.code) + '">-1</button></td></tr>').join('') +
      '</tbody></table></div></div>' : '<div class="hint" style="margin-top:8px">Pick a scenario or add procedures to compare what you would pay on each plan.</div>';

/* ==========================================================================
   TASK AND NOTIFICATION ENGINE
   Kept from /tawa unchanged in its one architectural decision:

     TASKS  are shared work items owned by the organisation. One row per unit
            of work. State is open, done or void. Anybody competent closes it
            and it closes for everybody.
     NOTIFS are per person pointers at those work items. Only that person can
            change them and nobody else ever sees the change.

   The badge counts OPEN TASKS IN YOUR SCOPE. Reading never moves a number.

   Everything here is derived from data the app already has: cases through
   openCases() and caseSla(), attendance through ATT, leave through LEAVES,
   data quality through dqRun(), report releases through PENDING_RELEASE,
   training through required() and certState(). No parallel dataset.
   ========================================================================== */

  return {id:'T-' + String(seq).padStart(4,'0'), kind:kind, act:k.act, sev:o.sev, scope:k.scope.slice(),
    store:o.store || null, subject:o.subject, title:o.title, why:o.why, due:o.due == null ? null : o.due,
    cta:o.cta, state:'open', doneBy:null, doneAt:null};
}

const _tkDays = ms => Math.max(0, Math.round(Math.abs(ms) / DAY));
const _tkHrs  = ms => Math.max(0, Math.round(Math.abs(ms) / HR));
const _tkWhere = c => {const e = EMPBY[c.emp]; return c.id + ', ' + (e ? e.name : c.emp) + ', ' + deptName(c.dept);};
const _tkSlaKind = left => left < 0 ? 'sla_expired' : 'sla_expiring';
const _tkSlaSev  = (c, left) => (left < 0 && c.pri === 'urgent') ? 'crit' : 'warn';
function _tkSlaWhy(c, left){
  const h = _tkHrs(left);
  return left < 0
    ? {en:c.id + ' passed its ' + SLA_HRS[c.pri] + ' hour ' + label(PRIORITY, c.pri).toLowerCase() + ' priority target about ' + h + ' hours ago and is still ' + label(CASE_STATUS, c.status).toLowerCase() + '.'}
    : {en:c.id + ' has about ' + h + ' hours left on its ' + SLA_HRS[c.pri] + ' hour target and is still ' + label(CASE_STATUS, c.status).toLowerCase() + '.'};
}
/* Attendance documentation tasks are bounded to a window so the manager list
   stays a list and not an archive. */
const _tkAttWindow = () => TODAY - 13*DAY;
function _tkAttRows(){return ATT.filter(a => !a.documented && a.at >= _tkAttWindow());}
function _tkDqOpen(rule){return dqRun().rows.filter(x => x.rule === rule && !DQ_DONE[x.rule + ':' + x.emp]);}
function _tkPendingId(p){return p.rpt + '@' + p.requested;}

function _tkNoticeRow(c){
  const e = EMPBY[c.emp];
  return {sev:'info', store:c.dept,
    subject:{type:'case', id:c.id, label:_tkWhere(c), store:c.dept},
    title:{en:'HR desk: ' + RBYC[c.reason].en.toLowerCase() + ' contact from ' + (e ? e.name : c.emp)},
    why:{en:'The HR desk informed this department at ' + ftime(c.mgrInformed) + '. ' + (c.att && c.att.length ? 'An attendance event is on the record; documentation is due 48 hours after the shift.' : 'No attendance event; for your awareness only.')},
    due:null, cta:TASK_CTA.info};
}
/* Rows for a case created after load. Appends with the next id so nothing
   already numbered moves, which keeps every per person read stamp valid. */
function taskSyncCase(c){
  taskAll();
  const seq = () => TASKS.length + 1;
  const has = (kind) => TASKS.some(t => t.kind === kind && t.subject.id === c.id);
  const where = _tkWhere(c);
  if(c.status === 'new' && !has('case_new')) TASKS.push(taskRow(seq(), 'case_new', {sev:'info', store:c.dept, subject:{type:'case', id:c.id, label:where},
    title:{en:'Pick up ' + c.id}, why:{en:'Opened just now by ' + c.type.toLowerCase() + ' and nobody has taken it.'}, due:c.opened + 2*HR, cta:TASK_CTA.pickup}));
  if(c.status === 'wmgr' && !has('mgr_response')) TASKS.push(taskRow(seq(), 'mgr_response', {sev:'warn', store:c.dept, subject:{type:'case', id:c.id, label:where, store:c.dept},
    title:{en:'Respond on ' + c.id}, why:{en:'HR asked ' + deptName(c.dept) + ' to confirm the event on ' + c.id + ' and the case cannot close until the manager answers.'}, due:c.opened + 24*HR, cta:TASK_CTA.respond}));
  if(c.mgrInformed && !has('mgr_notice')) TASKS.push(taskRow(seq(), 'mgr_notice', _tkNoticeRow(c)));
  (c.att || []).forEach(id => {
    const a = ATT.find(x => x.id === id);
    if(!a || a.documented || TASKS.some(t => t.kind === 'attendance_doc' && t.subject.id === a.id)) return;
    const e = EMPBY[a.emp];
    TASKS.push(taskRow(seq(), 'attendance_doc', {sev:'info', store:a.dept, subject:{type:'attendance', id:a.id, label:a.id + ', ' + (e ? e.name : a.emp) + ', ' + deptName(a.dept), emp:a.emp, store:a.dept},
      title:{en:'Document ' + label(ATT_TYPES, a.type).toLowerCase() + ' for ' + (e ? e.name : a.emp)}, why:{en:label(ATT_TYPES, a.type) + ' taken just now has no documentation on file yet.'}, due:a.docDue, cta:TASK_CTA.doc}));
  });
}
function taskBuild(){
  const out = [];
  let seq = 0;
  const push = (kind, o) => {out.push(taskRow(++seq, kind, o));};
  const now = Date.now();

  /* --- cases. openCases() and caseSla() are what the queue reads. -------- */
  openCases().forEach(c => {
    const where = _tkWhere(c);
    const sla = caseSla(c);
    if(c.status === 'new'){
      push('case_new', {sev:c.pri === 'urgent' ? 'warn' : 'info', store:c.dept,
        subject:{type:'case', id:c.id, label:where},
        title:{en:'Pick up ' + c.id},
        why:{en:'Opened ' + _tkHrs(now - c.opened) + ' hours ago by ' + c.type.toLowerCase() + ' and nobody has taken it, so the employee has no confirmation anyone is working it.'},
        due:c.opened + 2*HR, cta:TASK_CTA.pickup});
    }
    if(c.status !== 'new' && c.status !== 'esc' && (sla.late || sla.soon)){
      push(_tkSlaKind(sla.left), {sev:_tkSlaSev(c, sla.left), store:c.dept,
        subject:{type:'case', id:c.id, label:where},
        title:{en:'Work ' + c.id + ' inside its SLA'},
        why:_tkSlaWhy(c, sla.left), due:c.sla, cta:TASK_CTA.work});
    }
    if(c.status === 'esc'){
      push('case_escalated', {sev:c.reason === 'er' ? 'warn' : 'info', store:c.dept,
        subject:{type:'case', id:c.id, label:where},
        title:{en:'Record the outcome on ' + c.id},
        why:{en:c.id + ' was escalated to the HR manager ' + _tkHrs(now - (c.esc[0] ? c.esc[0].t : c.opened)) + ' hours ago (' + (c.esc[0] ? c.esc[0].why : 'no reason recorded') + ') and no outcome is on the case.'},
        due:(c.esc[0] ? c.esc[0].t : c.opened) + 24*HR, cta:TASK_CTA.outcome});
    }
    if(c.status === 'wmgr'){
      push('mgr_response', {sev:'warn', store:c.dept,
        subject:{type:'case', id:c.id, label:where, store:c.dept},
        title:{en:'Respond on ' + c.id},
        why:{en:'HR asked ' + deptName(c.dept) + ' to confirm the event on ' + c.id + ' ' + _tkHrs(now - c.opened) + ' hours ago and the case cannot close until the manager answers.'},
        due:c.opened + 24*HR, cta:TASK_CTA.respond});
    }
  });

  /* --- attendance documentation. One task per undocumented event inside the
     window. Scope cc and mgr; the resolver narrows mgr to the department. ---- */
  _tkAttRows().forEach(a => {
    const e = EMPBY[a.emp];
    push('attendance_doc', {sev:a.type === 'ncns' ? 'warn' : (a.docDue < now ? 'warn' : 'info'), store:a.dept,
      subject:{type:'attendance', id:a.id, label:a.id + ', ' + (e ? e.name : a.emp) + ', ' + deptName(a.dept), emp:a.emp, store:a.dept},
      title:{en:'Document ' + label(ATT_TYPES, a.type).toLowerCase() + ' for ' + (e ? e.name : a.emp)},
      why:{en:label(ATT_TYPES, a.type) + ' on ' + fshort(a.at) + ', ' + shf(a.shift).en.toLowerCase() + ' shift, has no documentation on file' + (a.docDue < now ? ' and the 48 hour window closed ' + _tkDays(now - a.docDue) + ' days ago.' : '.')},
      due:a.docDue, cta:TASK_CTA.doc});
  });

  /* --- leave follow-up. New requests and overdue contacts. ------------------ */
  LEAVES.forEach(l => {
    if(l.status !== 'new' && l.status !== 'over' && l.doc !== 'overdue') return;
    const e = EMPBY[l.emp];
    push('leave_followup', {sev:l.status === 'over' || l.doc === 'overdue' ? 'warn' : 'info', store:l.dept,
      subject:{type:'leave', id:l.id, label:l.id + ', ' + (e ? e.name : l.emp) + ', ' + deptName(l.dept)},
      title:{en:(l.status === 'new' ? 'Acknowledge ' : 'Follow up on ') + l.id},
      why:{en:l.status === 'new' ? 'A leave request was received ' + _tkDays(now - l.lastContact) + ' days ago and the packet has not been acknowledged.'
        : 'Last contact was ' + _tkDays(now - l.lastContact) + ' days ago and documentation is ' + l.doc + '. Operational follow-up only, no eligibility question.'},
      due:l.status === 'new' ? l.lastContact + DAY : l.lastContact + 10*DAY, cta:TASK_CTA.follow});
  });

  /* --- data quality. One task per high priority rule with open rows. ------- */
  DQ_RULES.forEach(rule => {
    if(rule.pri !== 'high') return;
    const rows = _tkDqOpen(rule.k);
    if(!rows.length) return;
    push('dq_exception', {sev:'warn', store:null,
      subject:{type:'dqrule', id:rule.k, label:rule.en + ', ' + rows.length + ' records'},
      title:{en:rows.length + ' records: ' + rule.en.toLowerCase()},
      why:{en:rule.en + ' is a high priority rule and ' + rows.length + ' employee records fail it on the current run. ' + rule.fix + '.'},
      due:TODAY + DAY + 5.5*HR, cta:TASK_CTA.dq});
  });

  /* --- report approvals. --------------------------------------------------- */
  PENDING_RELEASE.forEach(p => {
    const r = REPORTS.find(x => x.id === p.rpt);
    push('report_approval', {sev:'warn', store:null,
      subject:{type:'release', id:_tkPendingId(p), label:(r ? r.en : p.rpt) + ' for ' + p.requestedBy},
      title:{en:'Approve the release of ' + (r ? r.en : p.rpt)},
      why:{en:p.requestedBy + ' asked for ' + p.fields.join(', ') + ' (' + p.reason + '). The report carries employee names, so it does not leave HR without an approval on the log.'},
      due:p.requested + 24*HR, cta:TASK_CTA.approve});
  });

  /* --- training. required() and certState(), the same two the team table
     and the transcript read. Scope mgr plus emp; the resolver enforces it. */
  EMP.forEach(e => {
    if(e.status === 'term' || e.dupOf || !e.dept) return;
    required(e).forEach(c => {
      const cs = certState(e, c.c);
      if(cs.s !== 'expired' && cs.s !== 'missing') return;
      const rec = (REC[e.id] || {})[c.c];
      push('training_overdue', {sev:c.tr === 'compliance' ? 'warn' : 'info', store:e.dept,
        subject:{type:'employee', id:e.id, label:e.name + ', ' + e.id, course:c.c, store:e.dept},
        title:{en:c.c + ' overdue for ' + e.name},
        why:cs.s === 'expired'
          ? {en:c.en + ' expired ' + _tkDays(Date.now() - cs.exp) + ' days ago and the ' + c.rc + ' month interval has lapsed' + (c.au ? ' under ' + c.au + ', flagged VERIFY' : '') + '.'}
          : {en:c.en + ' has never been started and it is required for this role and department' + (c.au ? ' under ' + c.au + ', flagged VERIFY' : '') + '.'},
        due:cs.s === 'expired' ? cs.exp : (rec && rec.due ? rec.due : null), cta:TASK_CTA.train});
    });
  });

  /* --- points review. Anyone at or past 3 points with no review recorded
     and no suspension review open. HR only. ------------------------------- */
  EMP.forEach(e => {
    if(e.status !== 'active' || e.lv >= 3 || e.dupOf || !e.dept) return;
    const p = pointsFor(e.id);
    if(p.pts < 3 || PTS_REVIEWED[e.id] || suspFor(e.id).some(x => x.status !== 'reinstated')) return;
    push('points_review', {sev:p.pts >= 4 ? 'warn' : 'info', store:e.dept,
      subject:{type:'employee', id:e.id, label:e.name + ', ' + deptName(e.dept), store:e.dept},
      title:{en:'Review attendance points for ' + e.name},
      why:{en:e.name + ' is at ' + p.pts.toFixed(1) + ' points in the rolling ' + POINTS_WINDOW + ' days, ' + (p.pts >= 4 ? 'at the suspension review step' : 'one point from a suspension review') + '. The standing is computed; the step is a decision to record with the manager.'},
      due:TODAY + 2*DAY, cta:TASK_CTA.review});
  });

  /* --- manager notices. The desk informed a department manager about a
     contact. Informational, per person, scoped to that department. -------- */
  CASES.forEach(c => {if(c.mgrInformed) push('mgr_notice', _tkNoticeRow(c));});

  /* --- informational. Reports that ran today. Clears per person. ------------ */
  REPORTS.forEach(r => {
    if(r.mode !== 'auto' || r.last < TODAY) return;
    push('report_done', {sev:'info', store:null,
      subject:{type:'report', id:r.id, label:r.en},
      title:{en:r.en + ' ran at ' + ftime(r.last)},
      why:{en:'Automated run completed' + (r.names ? '; employee level output is held for approval.' : '; aggregated output is ready to export.')},
      due:null, cta:TASK_CTA.info});
  });

  return out;
}

/* Re-derives the three fields an SLA row changes on its own while nobody is
   looking, so a case that crosses its target mid session moves from expiring
   to expired here at the same moment the queue chip goes red. */
function taskRefresh(){
  if(!TASKS) return;
  for(let n = 0; n < TASKS.length; n++){
    const t = TASKS[n];
    if(t.kind !== 'sla_expiring' && t.kind !== 'sla_expired') continue;
    if(t.state !== 'open') continue;
    const c = CASEBY[t.subject.id];
    if(!c) continue;
    const left = c.sla - Date.now();
    t.kind = _tkSlaKind(left);
    t.sev  = _tkSlaSev(c, left);
    t.why  = _tkSlaWhy(c, left);
    t.due  = c.sla;
  }
}

function taskAll(){
  if(!TASKS) TASKS = taskBuild();
  taskRefresh();
  return TASKS;
}
function taskById(id){
  const all = taskAll();
  for(let i = 0; i < all.length; i++) if(all[i].id === id) return all[i];
  return null;
}
function taskNotif(persona, id){
  const bucket = NOTIFS[persona] || (NOTIFS[persona] = {});
  return bucket[id] || (bucket[id] = {read_at:null, cleared_at:null});
}

/* ---------- the single open predicate ----------------------------------- */
function taskLive(task){
  const now = Date.now();
  switch(task.kind){
    case 'case_new':        {const c = CASEBY[task.subject.id]; return !!c && c.status === 'new';}
    case 'sla_expiring':
    case 'sla_expired':     {const c = CASEBY[task.subject.id]; if(!c || c.status === 'res' || c.status === 'new' || c.status === 'esc') return false; const s = caseSla(c); return s.late || s.soon;}
    case 'case_escalated':  {const c = CASEBY[task.subject.id]; return !!c && c.status === 'esc';}
    case 'mgr_response':    {const c = CASEBY[task.subject.id]; return !!c && c.status === 'wmgr';}
    case 'attendance_doc':  {const a = ATT.find(x => x.id === task.subject.id); return !!a && !a.documented;}
    case 'leave_followup':  {const l = LEAVES.find(x => x.id === task.subject.id); return !!l && (l.status === 'new' || l.status === 'over' || l.doc === 'overdue');}
    case 'dq_exception':    return _tkDqOpen(task.subject.id).length > 0;
    case 'report_approval': return PENDING_RELEASE.some(p => _tkPendingId(p) === task.subject.id);
    case 'training_overdue':{const e = EMPBY[task.subject.id]; if(!e) return false; const s = certState(e, task.subject.course).s; return s === 'expired' || s === 'missing';}
    case 'points_review':   {const e = EMPBY[task.subject.id]; return !!e && pointsFor(e.id).pts >= 3 && !PTS_REVIEWED[e.id] && !suspFor(e.id).some(x => x.status !== 'reinstated');}
    case 'report_done':     return true;
    case 'mgr_notice':      {const c = CASEBY[task.subject.id]; return !!c && !!c.mgrInformed;}
    default:                return false;
  }
}
function taskOpen(task, persona){
  if(task.state !== 'open') return false;
  if(!taskLive(task)) return false;
  if(!task.act && persona){
    const n = (NOTIFS[persona] || {})[task.id];
    if(n && n.cleared_at) return false;
  }
  return true;
}
/* hq and cc work every department. mgr sees one department. emp sees one
   person. A department scoped informational row only reaches hq or cc while
   they are looking at that department. */
function taskInScope(task, persona, store, empId){
  if(task.scope.indexOf(persona) < 0) return false;
  if(persona === 'emp') return task.subject.type === 'employee' && task.subject.id === empId;
  if(persona === 'mgr') return task.store === store;
  if(!task.act) return task.store == null || task.store === store;
  return true;
}
function _tkStore(store){return store || (typeof S !== 'undefined' && S.store) || null;}
function _tkEmp(){return (typeof S !== 'undefined' && S.me) ? S.me.id : null;}
function taskSort(a, b){
  const ac = a.sev === 'crit' ? 0 : 1, bc = b.sev === 'crit' ? 0 : 1;
  if(ac !== bc) return ac - bc;
  const ad = a.due == null ? Infinity : a.due, bd = b.due == null ? Infinity : b.due;
  if(ad !== bd) return ad - bd;
  const as = TASK_SEV_RANK[a.sev], bs = TASK_SEV_RANK[b.sev];
  if(as !== bs) return as - bs;
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}

/* ---------- the public API --------------------------------------------- */
function tasksFor(persona, store){
  const sc = _tkStore(store), me = _tkEmp();
  return taskAll().filter(t => taskOpen(t, persona) && taskInScope(t, persona, sc, me)).sort(taskSort);
}
function taskCount(persona, store){
  const out = {crit:0, warn:0, info:0, total:0};
  tasksFor(persona, store).forEach(t => {if(out[t.sev] != null) out[t.sev]++; out.total++;});
  return out;
}
const TASK_GROUP_LABEL = {
  late:    {en:'Past a deadline'},
  today:   {en:'Due today'},
  week:    {en:'This week'},
  noclock: {en:'No clock'},
  info:    {en:'For information'}
};
function taskGroups(persona, store){
  const list = tasksFor(persona, store);
  const now = Date.now();
  const end = new Date(now); end.setHours(23,59,59,999);
  const eod = end.getTime();
  const keys = ['late','today','week','noclock','info'];
  const bins = {late:[], today:[], week:[], noclock:[], info:[]};
  list.forEach(t => {
    if(!t.act){bins.info.push(t); return;}
    if(t.due == null){bins.noclock.push(t); return;}
    if(t.due < now){bins.late.push(t); return;}
    if(t.due <= eod){bins.today.push(t); return;}
    if(t.due <= now + 7*DAY){bins.week.push(t); return;}
    bins.noclock.push(t);
  });
  return keys.map(k => ({key:k, label:TASK_GROUP_LABEL[k], tasks:bins[k]}));
}

/* ---------- effects ------------------------------------------------------
   Completing a task moves the underlying record, and returns a restore
   function so undo is a real undo. */
function taskEffects(task, persona){
  const now = Date.now();
  const noop = () => {};
  const actor = persona === 'hq' ? HR_MGR.id : (REPS[0] ? REPS[0].id : 'HR');
  switch(task.kind){
    case 'case_new': {
      const c = CASEBY[task.subject.id]; if(!c) return noop;
      const prev = {status:c.status, rep:c.rep, len:c.notes.length};
      c.status = 'prog'; c.rep = actor;
      c.notes.push({by:actor, t:now, txt:'Picked up from the task inbox. Employee contacted to confirm the request is being worked.'});
      bump();
      return () => {c.status = prev.status; c.rep = prev.rep; c.notes.length = prev.len; bump();};
    }
    case 'sla_expiring':
    case 'sla_expired': {
      const c = CASEBY[task.subject.id]; if(!c) return noop;
      const prev = {status:c.status, res:c.resolvedAt, len:c.notes.length};
      c.status = 'res'; c.resolvedAt = now;
      c.notes.push({by:actor, t:now, txt:'Closed after confirmation with the employee, from the task inbox.'});
      bump();
      return () => {c.status = prev.status; c.resolvedAt = prev.res; c.notes.length = prev.len; bump();};
    }
    case 'case_escalated': {
      const c = CASEBY[task.subject.id]; if(!c) return noop;
      const prev = {status:c.status, len:c.notes.length};
      c.status = 'prog';
      c.notes.push({by:HR_MGR.id, t:now, txt:'HR manager review recorded. Outcome noted on the case; rep to close after confirmation with the employee.'});
      bump();
      return () => {c.status = prev.status; c.notes.length = prev.len; bump();};
    }
    case 'mgr_response': {
      const c = CASEBY[task.subject.id]; if(!c) return noop;
      const prev = {status:c.status, len:c.notes.length};
      c.status = 'prog';
      c.notes.push({by:'MGR', t:now, txt:'Manager response recorded from the department console. Event confirmed.'});
      bump();
      return () => {c.status = prev.status; c.notes.length = prev.len; bump();};
    }
    case 'attendance_doc': {
      const a = ATT.find(x => x.id === task.subject.id); if(!a) return noop;
      const prev = {doc:a.documented, mn:a.mgrNotified};
      a.documented = true; a.mgrNotified = true;
      bump();
      return () => {a.documented = prev.doc; a.mgrNotified = prev.mn; bump();};
    }
    case 'leave_followup': {
      const l = LEAVES.find(x => x.id === task.subject.id); if(!l) return noop;
      const prev = {status:l.status, last:l.lastContact, doc:l.doc};
      l.lastContact = now;
      if(l.status === 'new') l.status = l.doc === 'complete' ? 'open' : 'pend';
      else if(l.status === 'over') l.status = 'pend';
      if(l.doc === 'overdue') l.doc = 'pending';
      bump();
      return () => {l.status = prev.status; l.lastContact = prev.last; l.doc = prev.doc; bump();};
    }
    case 'dq_exception': {
      const rows = _tkDqOpen(task.subject.id);
      const keys = rows.map(x => x.rule + ':' + x.emp);
      keys.forEach(k => {DQ_DONE[k] = now;});
      bump();
      return () => {keys.forEach(k => {delete DQ_DONE[k];}); bump();};
    }
    case 'report_approval': {
      const i = PENDING_RELEASE.findIndex(p => _tkPendingId(p) === task.subject.id);
      if(i < 0) return noop;
      const p = PENDING_RELEASE[i];
      const rel = {rpt:p.rpt, t:now, by:HR_MGR.id, to:p.requestedBy, fields:p.fields, ok:true};
      PENDING_RELEASE.splice(i, 1); RELEASES.unshift(rel);
      return () => {PENDING_RELEASE.splice(i, 0, p); const j = RELEASES.indexOf(rel); if(j >= 0) RELEASES.splice(j, 1);};
    }
    case 'training_overdue': {
      const eid = task.subject.id, cc = task.subject.course;
      const e = EMPBY[eid], c = CBY[cc];
      if(!e || !c) return noop;
      const recs = REC[eid] || (REC[eid] = {});
      const had = Object.prototype.hasOwnProperty.call(recs, cc);
      const prev = had ? recs[cc] : null;
      const r = rng(hash(eid + cc + 'task'));
      recs[cc] = {done:now, due:prev && prev.due ? prev.due : now, score:78 + Math.floor(r()*22), attempt:1, first:true};
      bump();
      return () => {if(had) recs[cc] = prev; else delete recs[cc]; bump();};
    }
    case 'points_review': {
      const eid = task.subject.id;
      PTS_REVIEWED[eid] = now; bump();
      return () => {delete PTS_REVIEWED[eid]; bump();};
    }
    case 'report_done':
      return noop;
    default:
      return noop;
  }
}
function taskMemoBust(){if(typeof bump === 'function') bump();}

/* ---------- mutation ---------------------------------------------------- */
function taskComplete(id, persona){
  const task = taskById(id);
  if(!task) return {ok:false, undo:null, token:null, reason:{en:'No task with that id.'}};
  if(!task.act) throw new Error('taskComplete on an informational task: ' + id + ' has no shared completion, use taskClear');
  if(task.scope.indexOf(persona) < 0) return {ok:false, undo:null, token:null, reason:{en:'That persona is not competent to close this item.'}};
  if(task.state !== 'open') return {ok:false, undo:null, token:null, reason:{en:'That item is already closed.'}};
  const prev = {state:task.state, doneBy:task.doneBy, doneAt:task.doneAt};
  const restore = taskEffects(task, persona);
  task.state = 'done'; task.doneBy = persona; task.doneAt = Date.now();
  /* A small burst when a person, not a script, closed it: the pointer was
     down inside the last second. */
  if(typeof celebrate === 'function' && typeof _lastPt !== 'undefined' && Date.now() - _lastPt.t < 1000) celebrate({n:45, v:6, spread:2.2});
  const n = taskNotif(persona, id);
  if(!n.read_at) n.read_at = task.doneAt;
  const token = 'U-' + id + '-' + (++_tkUndoSeq);
  let spent = false;
  const undo = () => {
    if(spent) return {ok:false, reason:{en:'That undo has already been used.'}};
    spent = true; restore();
    task.state = prev.state; task.doneBy = prev.doneBy; task.doneAt = prev.doneAt;
    delete TASK_UNDO[token];
    return {ok:true, id:id};
  };
  TASK_UNDO[token] = undo;
  return {ok:true, undo:undo, token:token, id:id};
}
function taskRead(id, persona){
  const task = taskById(id);
  if(!task) return {ok:false, reason:{en:'No task with that id.'}};
  const n = taskNotif(persona, id);
  const at = Date.now();
  if(!n.read_at) n.read_at = at;
  if(!task.act && !n.cleared_at) n.cleared_at = at;
  return {ok:true, read_at:n.read_at, cleared_at:n.cleared_at};
}
function taskClear(id, persona){
  const task = taskById(id);
  if(!task) return {ok:false, reason:{en:'No task with that id.'}};
  if(task.act) throw new Error('taskClear on an actionable task: ' + id + ' is shared work and clears for everyone when it is done, use taskComplete');
  const n = taskNotif(persona, id);
  const at = Date.now();
  if(!n.read_at) n.read_at = at;
  n.cleared_at = at;
  return {ok:true, cleared_at:n.cleared_at};
}
function taskUndo(token){
  const fn = TASK_UNDO[token];
  if(typeof fn !== 'function') return {ok:false, reason:{en:'That undo has expired.'}};
  return fn();
}

/* ---------- self test ---------------------------------------------------- */
function taskSelfTest(){
  const R = {};
  const all = taskAll();
  const seen = {}; let dupes = 0;
  all.forEach(t => {if(seen[t.id]) dupes++; seen[t.id] = 1;});
  R.uniqueIds = {pass:dupes === 0, tasks:all.length, duplicates:dupes};

  let bad = 0; const badIds = [];
  all.forEach(t => {
    const s = t.subject; let ok = false;
    if(s.type === 'case') ok = !!CASEBY[s.id];
    else if(s.type === 'attendance') ok = ATT.some(a => a.id === s.id);
    else if(s.type === 'leave') ok = LEAVES.some(l => l.id === s.id);
    else if(s.type === 'dqrule') ok = DQ_RULES.some(r => r.k === s.id);
    else if(s.type === 'release') ok = PENDING_RELEASE.some(p => _tkPendingId(p) === s.id) || t.state === 'done';
    else if(s.type === 'employee') ok = !!EMPBY[s.id] && (t.kind === 'points_review' || !!CBY[s.course]);
    else if(s.type === 'report') ok = REPORTS.some(r => r.id === s.id);
    if(!ok){bad++; if(badIds.length < 5) badIds.push(t.id + ':' + s.type + ':' + s.id);}
  });
  R.subjectsResolve = {pass:bad === 0, unresolved:bad, sample:badIds};

  /* Attendance documentation tasks agree with the dashboard's own count. */
  let drift = 0;
  DEPTS.forEach(d => {
    const mine = all.filter(t => t.kind === 'attendance_doc' && t.store === d.c && taskOpen(t, 'mgr')).length;
    const dash = _tkAttRows().filter(a => a.dept === d.c).length;
    if(mine !== dash) drift++;
  });
  R.docTasksMatchDashboard = {pass:drift === 0, departmentsDisagreeing:drift};

  const probe = all.filter(t => t.act && t.scope.length > 1 && taskOpen(t, t.scope[0]))[0] || all.filter(t => t.act && taskOpen(t, t.scope[0]))[0];
  if(!probe){
    R.closesForEveryone = {pass:false, note:'no open actionable task to probe'};
    R.decrementsEveryBadge = {pass:false, note:'no open actionable task to probe'};
    R.undoRestoresState = {pass:false, note:'no open actionable task to probe'};
  }else{
    const probeStore = probe.store || _tkStore(null);
    const before = {}, beforeSeen = {};
    TASK_PERSONAS.forEach(p => {before[p] = taskCount(p, probeStore); beforeSeen[p] = tasksFor(p, probeStore).some(t => t.id === probe.id);});
    const snapBefore = _tkSnapshot(probe);
    const res = taskComplete(probe.id, probe.scope[0]);
    const stillSeen = TASK_PERSONAS.filter(p => tasksFor(p, probeStore).some(t => t.id === probe.id));
    R.closesForEveryone = {pass:res.ok === true && stillSeen.length === 0, task:probe.id, kind:probe.kind, closedBy:probe.scope[0], visibleBeforeTo:TASK_PERSONAS.filter(p => beforeSeen[p]), stillVisibleTo:stillSeen};
    const dropped = [], notDropped = [];
    TASK_PERSONAS.forEach(p => {
      const after = taskCount(p, probeStore);
      if(beforeSeen[p]){if(after.total === before[p].total - 1) dropped.push(p); else notDropped.push(p);}
      else if(after.total !== before[p].total) notDropped.push(p + ':moved-without-being-in-scope');
    });
    R.decrementsEveryBadge = {pass:notDropped.length === 0 && dropped.length > 0, decremented:dropped, wrong:notDropped};
    const undone = taskUndo(res.token);
    const snapAfter = _tkSnapshot(probe);
    R.undoRestoresState = {pass:undone.ok === true && snapAfter === snapBefore, task:probe.id, countsRestored:TASK_PERSONAS.every(p => taskCount(p, probeStore).total === before[p].total)};
    if(snapAfter !== snapBefore) R.undoRestoresState.diff = {before:snapBefore, after:snapAfter};
  }

  const act = all.find(t => t.act);
  const info = all.find(t => !t.act);
  let threw = false;
  if(act){try{taskClear(act.id, 'hq');}catch(err){threw = true;}}
  R.clearThrowsOnActionable = {pass:threw, probed:act ? act.id : null};
  let infoOk = false;
  if(info){
    const p = info.scope[0];
    const beforeN = taskCount(p, info.store).total;
    taskClear(info.id, p);
    const afterN = taskCount(p, info.store).total;
    const otherStillOpen = taskOpen(info, info.scope[1] || p) || info.scope.length < 2;
    infoOk = afterN === beforeN - 1 && otherStillOpen && info.state === 'open';
    const n = taskNotif(p, info.id); n.cleared_at = null; n.read_at = null;
  }
  R.infoClearsForOnePersonOnly = {pass:infoOk, probed:info ? info.id : null};

  R.counts = {};
  TASK_PERSONAS.forEach(p => {R.counts[p] = taskCount(p, _tkStore(null));});
  R.allPassed = Object.keys(R).filter(k => R[k] && typeof R[k].pass === 'boolean').every(k => R[k].pass);
  return R;
}
function _tkSnapshot(task){
  const parts = [task.state, String(task.doneBy), String(task.doneAt)];
  const s = task.subject;
  if(s.type === 'case'){const c = CASEBY[s.id]; if(c) parts.push(JSON.stringify({status:c.status, rep:c.rep, res:c.resolvedAt, notes:c.notes.length}));}
  else if(s.type === 'attendance'){const a = ATT.find(x => x.id === s.id); if(a) parts.push(JSON.stringify({doc:a.documented, mn:a.mgrNotified}));}
  else if(s.type === 'leave'){const l = LEAVES.find(x => x.id === s.id); if(l) parts.push(JSON.stringify({status:l.status, last:l.lastContact, doc:l.doc}));}
  else if(s.type === 'dqrule'){parts.push(String(_tkDqOpen(s.id).length));}
  else if(s.type === 'release'){parts.push(String(PENDING_RELEASE.length) + '|' + String(RELEASES.length));}
  else if(s.type === 'employee'){const e = EMPBY[s.id]; if(e){parts.push(JSON.stringify((REC[s.id] || {})[s.course] || null)); parts.push(JSON.stringify(empCompliance(e))); parts.push(String(!!PTS_REVIEWED[s.id]));}}
  return parts.join('|');
}

/* ---- icons ---- */
/* =====================================================================
   ICONS. One drawn family for the whole product.
   Owner: the icon designer. Writes app/parts/icons.js.part and
   app/parts/icons.css.part and nothing else.
   =====================================================================

   WHY THIS FILE EXISTS, stated before the drawings.

   The client asked for custom marks because a filter row wraps to two
   lines. That is the brief. An icon that lets a label shrink or vanish
   is load bearing here; an icon that is only decoration is weight the
   page cannot afford.

   WHAT WAS THERE BEFORE, counted rather than estimated.

     app/parts/chrome.js.part   NV_ICON            23 drawings
     app/parts/float.js.part    FL_ICON  15 + 1 inline close   16
     app/parts/inbox.js.part    bell, tick                      2
     app/parts/hero.js.part     bmark 99, 168, product mark     3
     app/mapview.js.part        I{} 8 + pin + inline chevron   10
                                                        total 54

   Fifty four drawings. Collapsing the redraws of the same idea across
   files (queue x2, map x3, lock x2, close x2, bell x2, shield x2,
   send x2, mortarboard x2, users x2, file x2, book x2, chevron x2)
   leaves 41 distinct concepts. So 13 of the 54 are a second or third
   drawing of something the app already owned, and the two bells are
   drawn at different weights on adjacent surfaces. That is the pile
   this file replaces with a family.

   THE FAMILY LAW. Six rules, and every drawing below obeys all six.

   1. ONE GRID: 24. Chosen over 20 because every existing call site is
      already viewBox="0 0 24 24", so nvIcon can delegate here without a
      single call site changing, and because 24 divides into a 20 unit
      live area with a 2 unit optical margin, which is the margin that
      keeps a mark off the edge of a 44px tap target.

   2. LIVE AREA 2 to 22. Nothing but a deliberate bleed touches 0 or 24.
      2 units is 1.08px at 13px and 1.67px at 20px.

   3. ONE STROKE, OPTICALLY equal, not geometrically equal. A fixed 1.7
      user unit stroke renders 0.92px at 13px and 1.42px at 20px. Those
      are the same number and they are not the same weight to the eye:
      the 0.92px one lands under a device pixel, gets antialiased to
      grey, and the small icon reads lighter than the large one sitting
      next to it in the same rail. So the stroke is specified in
      RENDERED PIXELS and converted back to user units per call:

          renderedPx(size) = 0.2875 * size ^ 0.573

      The exponent is not a guess. It was solved from two anchors that
      were picked by eye on screen and then held: 1.25px at 13 and
      1.60px at 20. 0.573 is ln(1.60/1.25) / ln(20/13).

        size   rendered   user units   stroke as share of the box
          13     1.250       2.308        9.62 percent
          14     1.304       2.236        9.32
          16     1.408       2.112        8.80
          18     1.506       2.008        8.37
          20     1.600       1.920        8.00
          24     1.776       1.776        7.40
          28     1.940       1.663        6.93
          40     2.380       1.428        5.95

      Read the last column downward. The small end of the ramp carries a
      relatively fatter stroke on purpose. That is the whole correction.

   4. MINIMUM SEPARATION 4 UNITS between two parallel strokes, measured
      centre to centre. At 13px, 4 units is 2.17px, the stroke eats
      1.25px of it and 0.92px of white survives. Below 4 the two strokes
      merge into one grey bar at 13px. This rule is why no drawing here
      has more than four parallel lines across the live area, and why
      the transcript has three ruled lines rather than the five a
      designer reaches for.

   5. ONE TERMINAL, ONE CORNER. round caps, round joins, and 2.2 units
      of corner radius on every rectangle (1.08px at 13px, a softened
      corner rather than a blob). Circles are true circles.

   6. FILL IS A MEANING, NOT A STYLE. Solid fill is spent on exactly
      three things: an exhausted state (the clock that has run out),
      an alarm state (needs attention), and identity (the two banner
      marks). Everywhere else the family is line work. That is what
      makes tone available as a signal at 13px, where hue is not:
      roughly one man in twelve cannot use the red versus green
      channel, and docs/06 section 3 already requires status to survive
      greyscale.

   THE CLOCK PAIR, which is the one that matters.

   This product is about deadlines that carry legal weight. A running
   statutory clock and a clock that has run out must be separable at
   13px with the colour thrown away. They are drawn as the same object
   at opposite tone:

     clock      an open ring with a filled wedge showing the part of the
                interval already spent. Reads LIGHT.
     clockout   the same disc with the wedge grown to the full 360, so
                it is solid, with the hand and the twelve mark knocked
                out of it as true holes. Reads DARK.

   Light ring against dark disc is the largest difference two marks of
   the same silhouette can carry, and it is exactly the difference that
   photocopies, prints and survives a greyscale simulation. Measured on
   the contact sheet at 13px: the ring covers about 34 percent of its
   bounding box in ink, the disc about 88 percent.

   HOW TO USE IT.

     ic(name)                 20px, the rail and sub nav default
     ic(name, 13)             the smallest place these render
     ic(name, 16, 'fl-ic')    extra class, for a layer's own CSS

   Always aria-hidden. An icon in this app never carries the accessible
   name; the button around it does, and every call site already sets
   aria-label. An icon that also announced itself would double announce.
   ===================================================================== */

/* Stroke in rendered pixels, then back into user units on the 24 grid.
   Clamped at both ends: below 1.18 user units the line breaks up on a
   non retina display at large sizes, above 2.45 the counters inside the
   tighter drawings start to close at 11px and 12px. */
function icStroke(size){
  const px = 0.2875 * Math.pow(size, 0.573);
  const u = px * 24 / size;
  return Math.round(Math.min(2.45, Math.max(1.18, u)) * 100) / 100;
}

/* Line work. Inherits stroke and width from the svg element. */
function icL(d){ return '<path d="' + d + '"/>'; }

/* Solid. fill-rule evenodd so a subpath inside the outer shape is a real
   hole rather than a shape painted in the background colour. A hole works
   on any surface; a shape painted --card is wrong the moment the icon
   sits on --paper, on --action-soft, or on a selected jade row. Three
   drawings here depend on that: clockout, attention and the 99 mark. */
function icF(d){
  return '<path d="' + d + '" fill="currentColor" stroke="none" fill-rule="evenodd"/>';
}
function icO(cx, cy, r){
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>';
}
function icDot(cx, cy, r){
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r +
         '" fill="currentColor" stroke="none"/>';
}
/* A circular subpath written so it can be appended to a filled outer
   shape and punch a hole in it under fill-rule evenodd. */
function icHole(cx, cy, r){
  return 'M' + (cx - r) + ' ' + cy + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) +
         ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0z';
}

   rehearsed evacuation or robbery response that a store has to run on
   an interval, so the depiction is the rehearsal itself. The figure is
   solid because a 9 unit tall stick figure at 13px (4.9px) is four
   grey hairlines; as a filled silhouette it is one readable shape. */
IC.drill =
  icL('M14.6 3.6h4.2a1.6 1.6 0 0 1 1.6 1.6v13.6a1.6 1.6 0 0 1-1.6 1.6h-4.2') +

/* ---- 11. an incident ---------------------------------------------------

   person hurt at work: a laceration in meat and seafood, a burn in
   bakery, a lifting injury in receiving. The generic alternative is a
   warning triangle, which is already spent on "needs attention" and
   which describes how somebody feels about the event rather than the
   event. Diagonal so it cannot be read as another card.
   REVISED after looking. The first version was 12.6 units square with a
   diagonal through it and it read as a no entry sign, not a dressing.
   It is now a true capsule, 18.8 long by 8.6 wide, drawn as a rounded
   rect rotated 45 degrees with fully round ends, and the pad is marked
   by the two cross lines that a dressing actually has. Long against
   wide is what stops it reading as a diamond. */
IC.incident =
  icL('M18.65 11.43 11.43 18.65a4.3 4.3 0 0 1-6.08-6.08l7.22-7.22a4.3 4.3 0 0 1 6.08 6.08z') +
  icL('M11.08 6.84 17.16 12.92M6.84 11.08 12.92 17.16') +
  icDot(10.7, 13.3, 1.0) +
  icDot(13.3, 10.7, 1.0);

/* ---- 12. a person ------------------------------------------------------
   Head and shoulders. Head radius 3.0 with the shoulder line starting
   at 14.6 leaves 3.8 units between them, one tenth under the 4 unit
   rule and taken knowingly: the two forms run in different directions,
   a circle against a wide arc, so the eye separates them at 13px where
   two parallel lines at 3.8 would fuse. */

  icO(12, 7.8, 3.0) +
  icL('M4.8 20.6v-1.2c0-2.9 3.2-4.8 7.2-4.8s7.2 1.9 7.2 4.8v1.2');

/* ---- 13. a roster ------------------------------------------------------
   Three people as three rows. No container: the transcript owns the
   page outline, so the roster gives it up and is recognised by the
   texture of head, name, head, name instead. Rows at 4.6 unit pitch,
   2.5px at 13px, comfortably over the 4 unit floor. */
IC.roster =
  icDot(6.2, 7.4, 2.0) +
  icDot(6.2, 12.0, 2.0) +
  icDot(6.2, 16.6, 2.0) +

/* ---- 14. a transcript --------------------------------------------------
   A page of completions, each one ticked off. Portrait page with no
   corner fold, which is what separates it from the filing at a glance.
   Three rows only: a fourth would put the ruled lines at 3.4 unit
   pitch and they would close up at 13px. The three sit at exactly 4.0,
   which is the floor, and this is the densest drawing in the family.
   It reads as a filled page at 13px rather than as three countable
   completions, and that is recorded rather than claimed away. */
IC.transcript =
  icL('M5.6 3.4h12.8a1.9 1.9 0 0 1 1.9 1.9v13.4a1.9 1.9 0 0 1-1.9 1.9H5.6a1.9 1.9 0 0 1-1.9-1.9V5.3a1.9 1.9 0 0 1 1.9-1.9z') +
  icF('M6.9 6.8h2.4v2.4H6.9zM6.9 10.8h2.4v2.4H6.9zM6.9 14.8h2.4v2.4H6.9z') +
  icL('M11.8 8h5.6M11.8 12h5.6M11.8 16h3.4');

/* ---- 15. a certificate expiring ---------------------------------------
   A seal with ribbon tails, and the seal is a clock face. That is the
   whole idea in one mark: a certification is a thing you earned that
   also has a countdown attached, and the certification module in this
   app tracks exactly that. The wedge inside is the same wedge as the
   statutory clock so the two marks visibly belong to each other.

   inside a 10.8 unit seal is 5 dark pixels and it disappeared. It is 180
   degrees here, half the seal, which is also the more useful reading,

  icF('M12 9.2V3.8a5.4 5.4 0 0 1 0 10.8z') +
  icL('M8.6 13.7 6.9 20.6l5.1-2.4 5.1 2.4-1.7-6.9');

/* ---- 16. a statutory clock, running ------------------------------------
   An open ring with the spent part of the interval filled. Not hands:
   two hands at 13px are 1.25px lines inside an 8.2px circle and they
   read as a smudge, while a filled wedge is a shape. The wedge runs
   from twelve clockwise to four, 120 degrees, which is the "some of it
   is gone and most of it is left" reading. Ink coverage of the drawing
   inside its bounding box, measured on the contact sheet at 13px: 34
   percent. Compare with clockout below. */
IC.clock =
  icO(12, 12, 8.0) +
  icF('M12 12V5.6a6.4 6.4 0 0 1 5.54 3.2z') +
  icL('M12 2.4v1.6');

/* ---- 17. a clock that has run out --------------------------------------
   The same clock with the wedge grown to the whole face. Solid disc,
   with the twelve mark and the hand knocked out as true holes so the
   mark still says clock and not dot. Ink coverage at 13px: 88 percent,
   against 34 for the running clock. That 54 point difference is the
   signal, it is carried entirely by tone, and it survives greyscale, a
   photocopy and a red green deficiency. Nothing about it depends on
   --critical being applied, which matters because docs/06 section 3
   reserves --critical for the 8 hour Cal/OSHA clock and this mark also
   has to work on the 14 day and 5 day intervals in --alert and --warn.

   are separable even at the 11px the mega panel can push them to. */
IC.clockout =
  icF('M12 3.4a8.6 8.6 0 1 0 0 17.2 8.6 8.6 0 0 0 0-17.2z' +
      'M11.05 6.9h1.9v6.05h-1.9z' +
      'M10.9 2.2h2.2v2.6h-2.2z') +
  icL('M12 2.4v1.6');

/* ---- 18. needs attention ----------------------------------------------
   A solid triangle with the bang knocked out. The only triangle in the
   family, so the silhouette alone carries it, and solid so it is the
   darkest mark on any row it appears in. Bar 1.9 by 4.6 units and dot
   at 1.05 radius: at 13px that is 1.0 by 2.5px and a 1.1px dot, which
   is the floor at which a knocked out bang still reads as two marks
   rather than one. */
IC.attention =
  icF('M13.62 3.7a1.86 1.86 0 0 0-3.24 0L2.5 18.1a1.86 1.86 0 0 0 1.62 2.8h15.76a1.86 1.86 0 0 0 1.62-2.8z' +
      'M11.05 8.5h1.9v5.1h-1.9z' +
      icHole(12, 16.8, 1.15));

/* ---- 19. in a campaign -------------------------------------------------
   A ring that has not closed yet, with the subject at its centre. Out,
   counted, not finished.
   REVISED after looking. The first version filled a band between radius
   6.4 and 9.6 to make a progress arc. That band is 3.2 units thick and
   the ring's own stroke is 1.92 at 20px, so the arc rendered as a hook
   hanging off the top of the circle and the two weights fought. Any
   filled overlay on a stroked ring has this problem, because the stroke
   changes with size and a filled band cannot. So the gap carries the
   meaning instead: same ring, 100 degrees of it missing, and the stroke
   is the svg's own at every size. The centre dot is what separates it
   from a loading spinner and from ontrack. */
IC.incampaign =
  icL('M12 4A8 8 0 1 1 4.12 13.39') +
  icDot(12, 12, 2.4);

/* ---- 20. on track ------------------------------------------------------
   An open ring with a check. Light in tone on purpose, so a row of
   these beside one attention triangle reads as one dark mark in a field
   of light ones, which is the scan a manager actually performs. Check
   arms 4.0 and 7.2 units, 2.2px and 3.9px at 13px. */
IC.ontrack =
  icO(12, 12, 8.0) +
  icL('m8.2 12.2 2.8 2.8 5.1-5.6');

/* ---- 21. banner, 99 Ranch ---------------------------------------------
   A solid rounded square carrying two counters. CLAUDE.md rule 5 forbids
   a trademarked logo in a public deployment and the shell contract
   section 6 says to build the marks from the palette instead, so this is
   two bowls standing for two nines, not a traced numeral. The store mark
   radius scales with the box in docs/06 section 8, which is why the
   corner is 5.6 on a 20 unit square rather than the family's 2.2.
   REVISED after looking. The first version drew one bowl with a stem, an
   abstracted 9, and at 96px it read as a key. Two identical counters
   read as a pair rather than as an object, which is what a banner mark
   should do. Holes are radius 2.3 with 2.75 units of solid between them,
   1.49px at 13px, so they stay two marks and do not bridge. They sit on
   the diagonal rather than side by side: two counters level with each
   other in a rounded square read as a pair of eyes at 96px, and a mark
   that turns into a face is a mark that gets noticed for the wrong
   reason.

   outlined, so they separate at 13px with the colour removed. */
IC.b99 =
  icF('M7.6 2h8.8A5.6 5.6 0 0 1 22 7.6v8.8A5.6 5.6 0 0 1 16.4 22H7.6A5.6 5.6 0 0 1 2 16.4V7.6A5.6 5.6 0 0 1 7.6 2z' +
      icHole(9.4, 9.4, 2.3) +

/* ---- 22. banner, 168 Market -------------------------------------------

IC.b168 =

  icDot(15.1, 12.0, 2.9);

/* ---- 23. assign --------------------------------------------------------
   A person and a plus. Assignment in this product is always a person
   gaining a requirement, never a document moving, so the person is the
   subject and the plus is the verb. The plus sits in its own quadrant
   with 4.2 units between its bar and the shoulder line so the two never
   touch at 13px. */
IC.assign =
  icO(9.4, 7.6, 3.0) +
  icL('M2.8 20.4v-1.1c0-2.8 2.9-4.6 6.6-4.6 1 0 2 .14 2.9.4') +
  icL('M17.6 13.4v7.2M14 17h7.2');

/* ---- 24. export --------------------------------------------------------
   A sheet leaving a tray. The chevron is drawn geometry, not the arrow

   lip, which sits 3.4 units below it. */
IC.export =
  icL('M4.2 14.6v3.6a1.9 1.9 0 0 0 1.9 1.9h11.8a1.9 1.9 0 0 0 1.9-1.9v-3.6') +

/* ---- 25. search --------------------------------------------------------

IC.search =

  icL('m15.1 15.1 5.3 5.3');

/* ---- 26. the mega panel ------------------------------------------------
   The panel itself: a bar with a four column sheet under it. Not a
   generic 2 by 2 grid, because a 2 by 2 grid is what every product on
   earth uses for "more" and it says nothing about what opens. This says
   a wide thing with columns opens, which is what happens.
   The panel has four columns, one per persona, and this mark shows
   three. Four needs three dividers at a 4.85 unit pitch, and although
   4.85 clears the 4 unit floor on paper, at the 18px the top bar
   actually calls this at, three dividers plus two walls is five near
   vertical lines in 10px and it rendered as a grey band. Two dividers
   at 6.1 units hold. The mark's job is "a wide panel opens", not "count
   the columns", so the count is what gets spent. Stated rather than
   quietly drawn wrong. */
IC.mega =
  icL('M4.4 4.4h15.2a1.9 1.9 0 0 1 1.9 1.9v11.4a1.9 1.9 0 0 1-1.9 1.9H4.4a1.9 1.9 0 0 1-1.9-1.9V6.3a1.9 1.9 0 0 1 1.9-1.9z') +
  icL('M2.5 9.2h19') +

/* ---- 27. collapse the rail --------------------------------------------
   The shell with the rail solid, and a chevron knocked out of the rail
   pointing at the edge it folds toward. The knockout is 1.9 units wide,
   1.0px at 13px, so at 13 it reads as texture inside the bar rather
   than as a chevron; at 16 and 20, where this control actually renders,
   it reads. Recorded rather than hidden. */
IC.rail =
  icL('M4.4 4.4h15.2a1.9 1.9 0 0 1 1.9 1.9v11.4a1.9 1.9 0 0 1-1.9 1.9H4.4a1.9 1.9 0 0 1-1.9-1.9V6.3a1.9 1.9 0 0 1 1.9-1.9z') +
  icF('M2.5 6.3a1.9 1.9 0 0 1 1.9-1.9h4.6v15.2H4.4a1.9 1.9 0 0 1-1.9-1.9z' +
      'M7.5 9.4 6.1 8.2 3.3 12l2.8 3.8 1.4-1.2L5.7 12z');

/* ---- 28. training ------------------------------------------------------
   A mortarboard over a shelf of modules. Kept because the store
   consoles say "My training" beside it and a manager should not have to
   learn a new word for school.
   REVISED after looking at 13px. A mortarboard is normally drawn as a
   cap over the head band, and the two cannot be separated: at y 10.2 the
   cap's own lower edge is at x 7.67 and the band's left wall wants to be
   at 7.4, so they cross and fuse into a grey lozenge at 13px.
   Removing the band entirely was tried and was worse: cap plus tassel
   alone read as a flag at 13px, not as a cap. The band is back, and the
   fix is that its two top corners are placed ON the cap's lower edges
   at 60 percent of their length, (8.36, 11.32) and (15.64, 11.32),

IC.training =

/* ---- 29. my learning, the module player -------------------------------
   A play triangle in a ring. Solid triangle, because an outlined
   triangle 6 units on a side is three hairlines at 13px. */
IC.learning =
  icO(12, 12, 8.0) +
  icF('M10.2 8.4 16 12l-5.8 3.6z');

/* ---- 30. a report ------------------------------------------------------
   A clipboard with three bars. The clip is the silhouette break that

IC.report =

  icL('M9.6 3.2h4.8a1.2 1.2 0 0 1 1.2 1.2v1.6a1.2 1.2 0 0 1-1.2 1.2H9.6a1.2 1.2 0 0 1-1.2-1.2V4.4a1.2 1.2 0 0 1 1.2-1.2z') +

/* ---- 31. the task inbox ------------------------------------------------
   The same tray the queue uses, with the pile that arrived stacked above
   it instead of one card standing in it. The two sit next to each other
   in the Today group of the HQ rail, so they are separated by tone as
   well as by form: the queue carries the family's one solid bar, the
   inbox is line work throughout. The queue is the thing you empty; the
   inbox is everything that came. Lines at a 4.0 pitch and 4.5 units
   clear of the tray lip. */
IC.inbox =
  icL('M3.6 13.9v4.3a1.9 1.9 0 0 0 1.9 1.9h13a1.9 1.9 0 0 0 1.9-1.9v-4.3h-4.6l-1.5 2.6h-4.6l-1.5-2.6z') +

   A bound ledger, closed, with a solid spine. The register is the whole
   record across every store, so it is a book that stays shut and gets
   written in, not the open book the catalog is. The spine is the solid

IC.register =
