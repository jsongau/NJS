/* ---- tasks ---- */
/* ==========================================================================
   TASK AND NOTIFICATION ENGINE
   Shell contract 11, sections 0 and 2. Owned by the task engine agent.

   The one architectural decision, restated so it cannot be lost in a merge:

     TASKS  are shared work items owned by the organisation. One row per unit
            of work. State is open, done or void. Anybody competent closes it
            and it closes for everybody.
     NOTIFS are per person pointers at those work items. One row per persona
            per task. State is read_at and cleared_at. Only that person can
            change it and nobody else ever sees the change.

   The badge counts OPEN TASKS IN YOUR SCOPE. It does not count unread rows.
   A task you already read is still outstanding. A task somebody else finished
   is not outstanding even if you never opened it. There is no line anywhere in
   this file that writes a per persona structure in order to make a badge go
   down, and if one appears in review, it is the bug section 0 exists to stop.

   Everything here is derived from data the app already has. There is no
   parallel dataset. Incidents come from INCIDENTS through openInc() and
   bindingClock(), drills from DRILLS and storeStats(), training from REC
   through required() and certState(), campaigns from campaigns(). The seeded
   PRNG helpers rng() and hash() are reused so the set is identical on every
   reload, in the same style as the INCIDENTS and DRILLS generators above.

   Nothing at the top level of this file touches app data. TASKS is built on
   first access, so the merge can place this block anywhere in the script.
   ========================================================================== */

/* The fixed kind list. Nine, matching sql/05-workflow-and-notifications.sql so
   the prototype and the backend do not drift. Adding a tenth here without
   adding it there is how two systems start disagreeing about what work is.
   crit is reserved: clock_expired is the only kind allowed to carry it, and
   only when the expired clock is the 8 hour Cal/OSHA one, because --critical
   is that clock's colour and nothing else's. */
const TASK_KINDS = {
  ack_incident:    {act:true,  scope:['hq','mgr']},
  clock_expiring:  {act:true,  scope:['hq','legal']},
  clock_expired:   {act:true,  scope:['hq','legal']},
  schedule_meeting:{act:true,  scope:['hq']},
  legal_review:    {act:true,  scope:['legal']},
  litigation_hold: {act:true,  scope:['legal']},
  drill_overdue:   {act:true,  scope:['mgr']},
  training_overdue:{act:true,  scope:['mgr','emp']},
  campaign_done:   {act:false, scope:['hq','mgr']}
};
const TASK_PERSONAS = ['hq','legal','mgr','emp'];
const TASK_SEV_RANK = {crit:0, warn:1, info:2};

/* The two tables. TASKS is the shared one and starts null so that no app data
   is read while the script is still evaluating. NOTIFS is the private one, one
   bucket per persona. In production the NOTIFS grain is one row per person;
   this prototype has exactly one person behind each persona, so persona is the
   key. Nothing else about the shape changes. */
let TASKS = null;
const NOTIFS = {hq:{}, legal:{}, mgr:{}, emp:{}};
const TASK_UNDO = {};
let _tkUndoSeq = 0;

/* Copy that appears inside a task row. Bilingual in the same object, as house
   rule 6 requires. subject.label is left as a plain string on purpose: it is
   built from identifiers and place names, and this app renders store codes and
   city names untranslated everywhere else. */
const TASK_NOTE = {
  ack:   {en:'Acknowledged from the task inbox. Store contacted to confirm the employee is stable and the hazard was corrected.',
          zh:'已於待辦清單受理。已聯繫門市確認員工狀況穩定，且現場危害已排除。'},
  meet:  {en:'Review meeting scheduled from the task inbox. Attendees: store manager, department supervisor, HR. Agenda: sequence of events, corrective action, follow up training.',
          zh:'已於待辦清單安排檢討會議。出席者：店長、部門主管、人資。議程：事發經過、矯正措施、後續訓練。'},
  legal: {en:'Escalation reviewed by counsel. Preservation scope and interview protocol confirmed with HR.',
          zh:'法務已完成轉介案件審閱。已與人資確認保存範圍與訪談程序。'},
  hold:  {en:'Litigation hold applied from the task inbox. Preserve camera footage, maintenance logs and scheduling records for the prior 30 days.',
          zh:'已於待辦清單設定訴訟文件保存。請保全事發前 30 天的監視影像、維護紀錄與排班紀錄。'}
};

/* ---------- generation ------------------------------------------------- */

/* One helper so every task row is built the same way and nothing can quietly
   ship a task with a missing bilingual half or an unknown kind. */
function taskRow(seq, kind, o){
  const k = TASK_KINDS[kind];
  if(!k) throw new Error('unknown task kind ' + kind);
  return {
    id: 'T-' + String(seq).padStart(4,'0'),
    kind: kind,
    act: k.act,
    sev: o.sev,
    scope: k.scope.slice(),
    store: o.store || null,
    subject: o.subject,
    title: o.title,
    why: o.why,
    due: o.due == null ? null : o.due,
    cta: o.cta,
    state: 'open',
    doneBy: null,
    doneAt: null
  };
}

const TASK_CTA = {
  ack:   {en:'Acknowledge',       zh:'受理'},
  file:  {en:'Mark filed',        zh:'標記已送件'},
  meet:  {en:'Schedule meeting',  zh:'安排會議'},
  legal: {en:'Record review',     zh:'記錄審閱'},
  hold:  {en:'Set hold',          zh:'設定文件保存'},
  drill: {en:'Log drill',         zh:'記錄演練'},
  train: {en:'Record completion', zh:'記錄完成'},
  info:  {en:'Dismiss',           zh:'關閉通知'}
};

const _tkDays = ms => Math.max(0, Math.round(Math.abs(ms) / DAY));
const _tkHrs  = ms => Math.max(0, Math.round(Math.abs(ms) / HR));
/* A meeting is on the record either because the task inbox stamped one or
   because the seeded note history already carries one. Both count, so the
   inbox never asks for a meeting that the incident drawer already shows. */
const _tkHasMeeting = i => !!i.meet || (i.notes || []).some(n => /Meeting scheduled|安排會議/.test(n.txt || ''));
const _tkCity = sc => {const s = st(sc); return s ? s.city + ' ' + s.st : sc;};

/* Statutory clock copy lives in one place because it is recomputed. A clock is
   the only thing on this list that changes state on its own while nobody is
   looking, so kind, severity and the sentence are derived from the live number
   of milliseconds left rather than frozen at load. See taskRefresh below.
   crit is granted only to an expired Cal/OSHA 8 hour clock, because
   --critical is that clock's colour and the design system reserves it. */
const _tkClockKind = (c, left) => left < 0 ? 'clock_expired' : 'clock_expiring';
const _tkClockSev  = (c, left) => (left < 0 && c.crit) ? 'crit' : 'warn';
function _tkClockWhy(i, c, left){
  const h = _tkHrs(left);
  return left < 0
    ? {en:'The ' + c.k + ' filing on ' + i.id + ' passed its deadline about ' + h + ' hours ago under ' + c.src + ', an interval flagged VERIFY until a human confirms it against current law.',
       zh:'依 ' + c.src + '，' + i.id + ' 的 ' + c.k + ' 送件期限已逾約 ' + h + ' 小時；該期限仍待人工查證現行法規（VERIFY）。'}
    : {en:'The ' + c.k + ' filing on ' + i.id + ' has about ' + h + ' hours left under ' + c.src + ', an interval flagged VERIFY until a human confirms it against current law.',
       zh:'依 ' + c.src + '，' + i.id + ' 的 ' + c.k + ' 送件尚餘約 ' + h + ' 小時；該期限仍待人工查證現行法規（VERIFY）。'};
}

function taskBuild(){
  const out = [];
  let seq = 0;
  const push = (kind, o) => {out.push(taskRow(++seq, kind, o));};
  const now = NOW;

  /* --- incidents. openInc() and bindingClock(), the same two functions the
     HQ queue and the legal console read, so the inbox cannot show a clock the
     queue disagrees with. ------------------------------------------------ */
  openInc().forEach(i => {
    const where = i.id + ', ' + _tkCity(i.store);
    const ago = _tkHrs(now - i.at);

    /* ack_incident. Nobody has confirmed receipt of the report. */
    if(!i.ack){
      push('ack_incident', {
        sev: i.serious ? 'warn' : 'info',
        store: i.store,
        subject: {type:'incident', id:i.id, label:where},
        title: {en:'Acknowledge ' + i.id, zh:'受理 ' + i.id},
        why: {en:'Reported ' + ago + ' hours ago at ' + _tkCity(i.store) + ' and no acknowledgement is recorded, so the store has no confirmation that anyone has picked it up.',
              zh:'於 ' + _tkCity(i.store) + ' 通報已 ' + ago + ' 小時，系統尚無受理紀錄，門市無從得知是否已有人接手。'},
        due: i.at + 24*HR,
        cta: TASK_CTA.ack
      });
    }

    /* clock_expiring and clock_expired. bindingClock() returns the single most
       urgent unfiled statutory clock on the incident, which is exactly what the
       queue shows, so one task per incident and not one per clock. The kind is
       a snapshot taken at load: a clock that crosses zero mid session keeps its
       clock_expiring row rather than silently vanishing and reappearing under
       another id, which would read as a lost task. */
    const b = bindingClock(i);
    if(b){
      push(_tkClockKind(b.c, b.st.left), {
        sev: _tkClockSev(b.c, b.st.left),
        store: i.store,
        subject: {type:'incident', id:i.id, label:where, clock:b.c.k},
        title: {en:'File ' + b.c.k + ' for ' + i.id, zh:'為 ' + i.id + ' 送出 ' + b.c.k},
        why: _tkClockWhy(i, b.c, b.st.left),
        due: b.c.due,
        cta: TASK_CTA.file
      });
    }

    /* schedule_meeting. Acknowledged, and serious or lost time, and no review
       meeting anywhere in the note history yet. */
    if(i.ack && (i.serious || i.lost) && !_tkHasMeeting(i)){
      push('schedule_meeting', {
        /* warn, not info: this only fires on a serious or a lost time injury,
           and an info chip on a lost time injury reads as filler. */
        sev: 'warn',
        store: i.store,
        subject: {type:'incident', id:i.id, label:where},
        title: {en:'Schedule the review meeting for ' + i.id, zh:'安排 ' + i.id + ' 的檢討會議'},
        why: {en:i.id + ' is ' + (i.serious ? 'a serious injury' : 'a lost time injury') + ' that was acknowledged ' + _tkDays(now - i.ack) + ' days ago and still has no review meeting on the record.',
              zh:i.id + ' 屬' + (i.serious ? '重大傷害' : '損工傷害') + '，受理至今已 ' + _tkDays(now - i.ack) + ' 天，紀錄中仍無檢討會議。'},
        due: i.at + 3*DAY,
        cta: TASK_CTA.meet
      });
    }

    /* legal_review. HR referred it to counsel and counsel has not closed it. */
    if(i.escal && !i.legalReviewed){
      push('legal_review', {
        sev: 'warn',
        store: i.store,
        subject: {type:'incident', id:i.id, label:where},
        title: {en:'Close the legal escalation on ' + i.id, zh:'結案 ' + i.id + ' 的法務轉介'},
        why: {en:'HR referred ' + i.id + ' to counsel and no review has been recorded against it, so the escalation is still open on both consoles.',
              zh:'人資已將 ' + i.id + ' 轉交法務，但尚無審閱紀錄，兩邊主控台皆仍顯示未結。'},
        due: i.at + 2*DAY,
        cta: TASK_CTA.legal
      });
    }

    /* litigation_hold. Serious enough that evidence needs protecting and no
       hold is set. */
    if(i.serious && !i.hold){
      push('litigation_hold', {
        sev: 'warn',
        store: i.store,
        subject: {type:'incident', id:i.id, label:where},
        title: {en:'Set a litigation hold on ' + i.id, zh:'對 ' + i.id + ' 設定訴訟文件保存'},
        why: {en:i.id + ' required ' + (i.treat === 'hosp' ? 'hospitalisation' : 'emergency treatment') + ' and no hold is protecting the camera footage or the maintenance records for that area.',
              zh:i.id + ' 已' + (i.treat === 'hosp' ? '住院治療' : '送急診') + '，目前尚無文件保存指示保護該區域的監視影像與維護紀錄。'},
        due: i.at + 24*HR,
        cta: TASK_CTA.hold
      });
    }
  });

  /* --- drills. DRILLS is the store level record and storeStats().drillsOverdue
     is the number the network table prints, so the two are read together here
     and the assertion below checks they agree. -------------------------- */
  STORES.forEach(s => {
    const d = DRILLS[s.c] || {};
    COURSES.filter(c => c.drill).forEach(c => {
      const rec = d[c.c];
      if(!rec || rec.due >= now) return;
      push('drill_overdue', {
        sev: 'warn',
        store: s.c,
        subject: {type:'course', id:c.c, label:c.c + ', ' + s.c, store:s.c},
        title: {en:'Run ' + c.en, zh:'執行' + c.zh},
        why: {en:s.c + ' last ran ' + c.c + ' ' + _tkDays(now - rec.last) + ' days ago and the ' + c.rc + ' month interval lapsed ' + _tkDays(now - rec.due) + ' days ago.',
              zh:s.c + ' 上次執行 ' + c.c + ' 已是 ' + _tkDays(now - rec.last) + ' 天前，' + c.rc + ' 個月的週期已逾期 ' + _tkDays(now - rec.due) + ' 天。'},
        due: rec.due,
        cta: TASK_CTA.drill
      });
    });
  });

  /* --- training. required() decides what each person owes, certState() decides
     whether they are current. Both are the functions the transcript and the
     team table already use. Scope is mgr plus emp: the manager sees their own
     store, the employee sees only their own row, and the resolver below is what
     enforces that rather than a second copy of the data. ----------------- */
  EMP.forEach(e => {
    required(e).forEach(c => {
      const cs = certState(e, c.c);
      if(cs.s !== 'expired' && cs.s !== 'missing') return;
      const rec = (REC[e.id] || {})[c.c];
      const dueAt = cs.s === 'expired' ? cs.exp : (rec && rec.due ? rec.due : null);
      push('training_overdue', {
        sev: c.tr === 'compliance' ? 'warn' : 'info',
        store: e.store,
        subject: {type:'employee', id:e.id, label:e.name + ', ' + e.id, course:c.c, store:e.store},
        title: {en:c.c + ' overdue for ' + e.name, zh:c.c + ' 逾期：' + e.name},
        why: cs.s === 'expired'
          ? {en:tx(c) + ' expired ' + _tkDays(now - cs.exp) + ' days ago and the ' + c.rc + ' month recertification interval has lapsed' + (c.au ? ' under ' + c.au + ', flagged VERIFY' : '') + '.',
             zh:tx(c) + ' 已逾期 ' + _tkDays(now - cs.exp) + ' 天，' + c.rc + ' 個月的複訓週期已過' + (c.au ? '，法源 ' + c.au + '，仍待人工查證（VERIFY）' : '') + '。'}
          : {en:tx(c) + ' has never been started and it is required for this role and department' + (c.au ? ' under ' + c.au + ', flagged VERIFY' : '') + '.',
             zh:tx(c) + ' 從未開始，而此職務與部門依規定必須完成' + (c.au ? '，法源 ' + c.au + '，仍待人工查證（VERIFY）' : '') + '。'},
        due: dueAt,
        cta: TASK_CTA.train
      });
    });
  });

  /* --- campaigns. Informational, one per closed campaign per store. There is
     nothing to finish, so this row clears per person and never for everyone.
     It carries a store, and the resolver only hands a store scoped
     informational row to the persona looking at that store, which is what
     keeps an informational item out of anybody else's badge. ------------ */
  STORES.forEach(s => {
    (campaigns(s.c) || []).forEach(cp => {
      const cc = cp.courses[0];
      const c = CBY[cc];
      if(!c) return;
      const closed = cp.at + c.gd*DAY;
      if(closed >= now) return;
      const done = cp.rows.filter(r => r.s === 'done').length;
      push('campaign_done', {
        sev: 'info',
        store: s.c,
        subject: {type:'campaign', id:cp.id, label:cp.id + ', ' + s.c, store:s.c, course:cc},
        title: {en:'Campaign ' + cp.id + ' closed at ' + s.c, zh:'派發 ' + cp.id + ' 已於 ' + s.c + ' 結束'},
        why: {en:done + ' of ' + cp.rows.length + ' people finished ' + cc + ' before the due date and the assignment window closed ' + _tkDays(now - closed) + ' days ago.',
              zh:'共 ' + cp.rows.length + ' 人中有 ' + done + ' 人於期限前完成 ' + cc + '，指派期間已於 ' + _tkDays(now - closed) + ' 天前結束。'},
        due: null,
        cta: TASK_CTA.info
      });
    });
  });

  return out;
}

/* Re-derives the three fields on a statutory clock row that time can change
   underneath it: the kind, the severity and the sentence that quotes the hours
   left. The app repaints every 60 seconds, and without this a clock that
   crossed zero mid session would still say clock_expiring and warn in the
   inbox while the incident queue had already gone to expired and critical.
   Two surfaces, one fact, two answers, which is the thing this file exists to
   stop.

   This is idempotent and derived only from the clock. It never changes whether
   a row is open, never changes scope, and never changes an id, so no task can
   appear or disappear because of it. Every read goes through taskAll, so every
   API function sees exactly the same refreshed row. */
function taskRefresh(){
  if(!TASKS) return;
  const now = Date.now();
  for(let n = 0; n < TASKS.length; n++){
    const t = TASKS[n];
    if(t.kind !== 'clock_expiring' && t.kind !== 'clock_expired') continue;
    if(t.state !== 'open') continue;
    const i = INCIDENTS.find(x => x.id === t.subject.id);
    if(!i) continue;
    const c = (i.cl || []).find(x => x.k === t.subject.clock);
    if(!c) continue;
    const left = c.due - now;
    t.kind = _tkClockKind(c, left);
    t.sev  = _tkClockSev(c, left);
    t.why  = _tkClockWhy(i, c, left);
    t.due  = c.due;
  }
}

function taskAll(){
  if(!TASKS) TASKS = taskBuild();
  taskRefresh();
  return TASKS;
}
function taskById(id){
  const all = taskAll();
  for(let i = 0; i < all.length; i++) if(all[i].id === id) return all[i];
  return null;
}
function taskNotif(persona, id){
  const bucket = NOTIFS[persona] || (NOTIFS[persona] = {});
  return bucket[id] || (bucket[id] = {read_at:null, cleared_at:null});
}

/* ---------- the single open predicate ----------------------------------- */

/* Everything below reads openness through this one function. That is the whole
   reason two of these API calls cannot disagree about whether something is
   outstanding: there is no second opinion to have.

   It reads the shared state field AND re-derives the underlying condition. The
   second half is what keeps the inbox honest when the work is done somewhere
   else: acknowledge INC-4103 from the incident drawer and the ack_incident row
   stops being open here too, without anybody wiring the drawer to this file. */
function taskLive(task){
  const now = Date.now();
  const inc = id => INCIDENTS.find(x => x.id === id);
  switch(task.kind){
    case 'ack_incident':    {const i = inc(task.subject.id); return !!i && !i.closed && !i.ack;}
    case 'clock_expiring':
    case 'clock_expired':   {const i = inc(task.subject.id); return !!i && !i.closed && !(i.filed && i.filed[task.subject.clock]);}
    case 'schedule_meeting':{const i = inc(task.subject.id); return !!i && !i.closed && !_tkHasMeeting(i);}
    case 'legal_review':    {const i = inc(task.subject.id); return !!i && !i.closed && !!i.escal && !i.legalReviewed;}
    case 'litigation_hold': {const i = inc(task.subject.id); return !!i && !i.closed && !i.hold;}
    case 'drill_overdue':   {const d = (DRILLS[task.subject.store] || {})[task.subject.id]; return !!d && d.due < now;}
    case 'training_overdue':{const e = EMPBY[task.subject.id]; if(!e) return false;
                             const s = certState(e, task.subject.course).s; return s === 'expired' || s === 'missing';}
    case 'campaign_done':   return true;
    default:                return false;
  }
}

/* Open for a given persona. For an actionable task the answer is the same for
   everybody, which is the point. For an informational one the personal cleared
   stamp is the only thing that can retire it, and it retires it for that person
   alone. */
function taskOpen(task, persona){
  if(task.state !== 'open') return false;
  if(!taskLive(task)) return false;
  if(!task.act && persona){
    const n = (NOTIFS[persona] || {})[task.id];
    if(n && n.cleared_at) return false;
  }
  return true;
}

/* Scope resolution, one place.
   hq and legal work the whole network, so an actionable row reaches them
   wherever it happened. mgr sees one store. emp sees one person. A store
   scoped informational row only reaches hq or legal while they are looking at
   that store, which is how an informational item stays out of everybody
   else's badge, per contract section 0. */
function taskInScope(task, persona, store, empId){
  if(task.scope.indexOf(persona) < 0) return false;
  if(persona === 'emp') return task.subject.type === 'employee' && task.subject.id === empId;
  if(persona === 'mgr') return task.store === store;
  if(!task.act) return task.store == null || task.store === store;
  return true;
}

function _tkStore(store){return store || (typeof S !== 'undefined' && S.store) || null;}
function _tkEmp(){return (typeof S !== 'undefined' && S.me) ? S.me.id : null;}

/* Worst first: crit before everything, then the soonest deadline, then
   severity, then id so the order never wobbles between two equal rows. */
function taskSort(a, b){
  const ac = a.sev === 'crit' ? 0 : 1, bc = b.sev === 'crit' ? 0 : 1;
  if(ac !== bc) return ac - bc;
  const ad = a.due == null ? Infinity : a.due, bd = b.due == null ? Infinity : b.due;
  if(ad !== bd) return ad - bd;
  const as = TASK_SEV_RANK[a.sev], bs = TASK_SEV_RANK[b.sev];
  if(as !== bs) return as - bs;
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}

/* ---------- the public API --------------------------------------------- */

/* Open tasks in this persona's scope, worst first. Pure read. */
function tasksFor(persona, store){
  const sc = _tkStore(store), me = _tkEmp();
  return taskAll()
    .filter(t => taskOpen(t, persona) && taskInScope(t, persona, sc, me))
    .sort(taskSort);
}

/* The badge. Counts open tasks in scope, by severity. Never counts unread. */
function taskCount(persona, store){
  const out = {crit:0, warn:0, info:0, total:0};
  tasksFor(persona, store).forEach(t => {
    if(out[t.sev] != null) out[t.sev]++;
    out.total++;
  });
  return out;
}

const TASK_GROUP_LABEL = {
  late:    {en:'Past a deadline', zh:'已逾期'},
  today:   {en:'Due today',       zh:'今天到期'},
  week:    {en:'This week',       zh:'本週'},
  noclock: {en:'No clock',        zh:'無時限'},
  info:    {en:'For information', zh:'僅供知悉'}
};

/* Grouped for the drawer. Same filter, same sort, same open predicate as
   tasksFor, so a group cannot contain a row the badge did not count. */
function taskGroups(persona, store){
  const list = tasksFor(persona, store);
  const now = Date.now();
  const end = new Date(now); end.setHours(23,59,59,999);
  const eod = end.getTime();
  const keys = ['late','today','week','noclock','info'];
  const bins = {late:[], today:[], week:[], noclock:[], info:[]};
  list.forEach(t => {
    if(!t.act){bins.info.push(t); return;}
    if(t.due == null){bins.noclock.push(t); return;}
    if(t.due < now){bins.late.push(t); return;}
    if(t.due <= eod){bins.today.push(t); return;}
    if(t.due <= now + 7*DAY){bins.week.push(t); return;}
    bins.noclock.push(t);
  });
  return keys.map(k => ({key:k, label:TASK_GROUP_LABEL[k], tasks:bins[k]}));
}

/* ---------- effects ------------------------------------------------------

   Completing a task moves the underlying record. Without this the manager
   clears a drill task and the drills tab still says overdue, and now two
   surfaces of the same product hold different beliefs about the same fact,
   which is the exact inconsistency contract section 0 exists to prevent.

   Returns a restore function that puts the underlying record back exactly as
   it was, so undo is a real undo and not a second guess.                    */
function taskEffects(task, persona){
  const now = Date.now();
  const inc = id => INCIDENTS.find(x => x.id === id);
  const noop = () => {};

  switch(task.kind){

    /* ack_incident. Stamp the acknowledgement and leave the same audit note
       the incident drawer leaves, so the timeline reads identically whether
       the work was done here or there. */
    case 'ack_incident': {
      const i = inc(task.subject.id); if(!i) return noop;
      const prevAck = i.ack, prevLen = (i.notes = i.notes || []).length;
      i.ack = now;
      i.notes.push({by:'HR', t:now, txt:tx(TASK_NOTE.ack)});
      return () => {i.ack = prevAck; i.notes.length = prevLen;};
    }

    /* clock_expiring and clock_expired. Mark that one statutory filing filed.
       bindingClock() then moves to the next unfiled clock on its own, which is
       what the queue reads, so the queue updates without being told. */
    case 'clock_expiring':
    case 'clock_expired': {
      const i = inc(task.subject.id); if(!i) return noop;
      const k = task.subject.clock;
      i.filed = i.filed || {};
      const had = Object.prototype.hasOwnProperty.call(i.filed, k), prev = i.filed[k];
      i.filed[k] = 1;
      return () => {if(had) i.filed[k] = prev; else delete i.filed[k];};
    }

    /* schedule_meeting. A stamp plus the note, because _tkHasMeeting reads
       both and the seeded incidents only have the note. */
    case 'schedule_meeting': {
      const i = inc(task.subject.id); if(!i) return noop;
      const prevMeet = i.meet, prevLen = (i.notes = i.notes || []).length;
      i.meet = now;
      i.notes.push({by:'HR', t:now, txt:tx(TASK_NOTE.meet)});
      return () => {i.meet = prevMeet; i.notes.length = prevLen;};
    }

    /* legal_review. Closes the escalation with a privileged note. i.escal
       stays true because the referral did happen; legalReviewed is what says
       counsel has dealt with it. */
    case 'legal_review': {
      const i = inc(task.subject.id); if(!i) return noop;
      const prevRev = i.legalReviewed, prevLen = (i.notes = i.notes || []).length;
      i.legalReviewed = now;
      i.notes.push({by:'LEGAL', t:now, priv:1, txt:tx(TASK_NOTE.legal)});
      return () => {i.legalReviewed = prevRev; i.notes.length = prevLen;};
    }

    /* litigation_hold. Sets the hold flag the legal console and the incident
       drawer both render. */
    case 'litigation_hold': {
      const i = inc(task.subject.id); if(!i) return noop;
      const prevHold = i.hold, prevLen = (i.notes = i.notes || []).length;
      i.hold = true;
      i.notes.push({by:'LEGAL', t:now, priv:1, txt:tx(TASK_NOTE.hold)});
      return () => {i.hold = prevHold; i.notes.length = prevLen;};
    }

    /* drill_overdue. Writes DRILLS the same way the drills tab does, then
       busts the store stats memo so the network table and the store card stop
       saying overdue. Attendance is derived from hash() rather than
       Math.random() so undo restores a value, not a guess. */
    case 'drill_overdue': {
      const sc = task.subject.store, cc = task.subject.id;
      const d = (DRILLS[sc] || {})[cc], c = CBY[cc];
      if(!d || !c) return noop;
      const prev = {last:d.last, due:d.due, att:d.att};
      d.last = now;
      d.due = now + c.rc*30*DAY;
      d.att = Math.max(1, (ROSTER[sc] || []).length - (hash(sc + cc) % 4));
      taskMemoBust(null, sc);
      return () => {d.last = prev.last; d.due = prev.due; d.att = prev.att; taskMemoBust(null, sc);};
    }

    /* training_overdue. Writes REC for that one person and that one course,
       then busts the compliance and readiness memos for that person and the
       store stats memo for their store, otherwise the team table keeps
       printing the old expired count from cache. */
    case 'training_overdue': {
      const eid = task.subject.id, cc = task.subject.course;
      const e = EMPBY[eid], c = CBY[cc];
      if(!e || !c) return noop;
      const recs = REC[eid] || (REC[eid] = {});
      const had = Object.prototype.hasOwnProperty.call(recs, cc);
      const prev = had ? recs[cc] : null;
      const r = rng(hash(eid + cc + 'task'));
      recs[cc] = {done:now, due:prev && prev.due ? prev.due : now,
                  score:78 + Math.floor(r()*22), attempt:1, first:true};
      taskMemoBust(eid, e.store);
      return () => {if(had) recs[cc] = prev; else delete recs[cc]; taskMemoBust(eid, e.store);};
    }

    /* campaign_done. Informational. There is nothing shared to move, and
       taskComplete refuses to get here in the first place. */
    case 'campaign_done':
      return noop;

    default:
      return noop;
  }
}

/* The three memo caches in the data layer are keyed by employee, by employee
   plus target level, and by store. bump() already clears the store one and
   bumps the render version; the other two have no invalidator because nothing
   used to write REC after load. Now something does. */
function taskMemoBust(empId, storeCode){
  if(empId){
    if(typeof _mc !== 'undefined' && _mc) delete _mc[empId];
    if(typeof _mr !== 'undefined' && _mr){
      Object.keys(_mr).forEach(k => {if(k.indexOf(empId + ':') === 0) delete _mr[k];});
    }
  }
  if(typeof bump === 'function') bump();
  else if(typeof _ms !== 'undefined' && _ms && storeCode) delete _ms[storeCode];
}

/* ---------- mutation ---------------------------------------------------- */

/* Closes the task for EVERYONE. Writes TASKS only, then moves the underlying
   record. Nothing per persona is touched except this actor's own read stamp,
   which is a courtesy and does not affect anybody's count. */
function taskComplete(id, persona){
  const task = taskById(id);
  if(!task) return {ok:false, undo:null, token:null,
    reason:{en:'No task with that id.', zh:'找不到該待辦項目。'}};
  if(!task.act) throw new Error('taskComplete on an informational task: ' + id +
    ' has no shared completion, use taskClear');
  if(task.scope.indexOf(persona) < 0) return {ok:false, undo:null, token:null,
    reason:{en:'That persona is not competent to close this item.', zh:'此身分無權結案此項目。'}};
  if(task.state !== 'open') return {ok:false, undo:null, token:null,
    reason:{en:'That item is already closed.', zh:'該項目已結案。'}};

  const prev = {state:task.state, doneBy:task.doneBy, doneAt:task.doneAt};
  const restore = taskEffects(task, persona);
  task.state = 'done';
  task.doneBy = persona;
  task.doneAt = Date.now();
  const n = taskNotif(persona, id);
  if(!n.read_at) n.read_at = task.doneAt;

  const token = 'U-' + id + '-' + (++_tkUndoSeq);
  let spent = false;
  const undo = () => {
    if(spent) return {ok:false, reason:{en:'That undo has already been used.', zh:'此復原已使用過。'}};
    spent = true;
    restore();
    task.state = prev.state; task.doneBy = prev.doneBy; task.doneAt = prev.doneAt;
    delete TASK_UNDO[token];
    return {ok:true, id:id};
  };
  TASK_UNDO[token] = undo;
  return {ok:true, undo:undo, token:token, id:id};
}

/* Personal read state. Never touches TASKS. An informational row has no shared
   completion, so reading it is what retires it, and only for this person. */
function taskRead(id, persona){
  const task = taskById(id);
  if(!task) return {ok:false, reason:{en:'No task with that id.', zh:'找不到該待辦項目。'}};
  const n = taskNotif(persona, id);
  const at = Date.now();
  if(!n.read_at) n.read_at = at;
  if(!task.act && !n.cleared_at) n.cleared_at = at;
  return {ok:true, read_at:n.read_at, cleared_at:n.cleared_at};
}

/* Personal dismissal. Only legal on an informational task. Dismissing an
   actionable one would be a person deciding that shared work is finished
   because they stopped wanting to look at it. */
function taskClear(id, persona){
  const task = taskById(id);
  if(!task) return {ok:false, reason:{en:'No task with that id.', zh:'找不到該待辦項目。'}};
  if(task.act) throw new Error('taskClear on an actionable task: ' + id +
    ' is shared work and clears for everyone when it is done, use taskComplete');
  const n = taskNotif(persona, id);
  const at = Date.now();
  if(!n.read_at) n.read_at = at;
  n.cleared_at = at;
  return {ok:true, cleared_at:n.cleared_at};
}

/* Reopens. Same effect as calling the undo function taskComplete handed back;
   the token exists so a toast can carry a string instead of a closure. */
function taskUndo(token){
  const fn = TASK_UNDO[token];
  if(typeof fn !== 'function') return {ok:false,
    reason:{en:'That undo has expired.', zh:'此復原已失效。'}};
  return fn();
}

/* ---------- explainer copy for the inbox UI ----------------------------- */

/* Plain language, because the two tables behind this list are the one thing a
   user will get wrong if nobody tells them. Bilingual in the same object. */
const TASK_COPY = {
  title:  {en:'Why some items clear for everyone and some clear only for you',
           zh:'為什麼有些項目會為所有人清除，有些只會為你清除'},
  shared: {en:'Most items here are one piece of work that the whole company shares. When anybody who is competent to do it finishes it, it closes for everyone at once and the item records who finished it. You will not see it again, and neither will your colleague in another console.',
           zh:'這裡多數項目是全公司共用的同一件工作。只要任何有權處理的人完成它，它就會同時對所有人結案，並記錄完成者是誰。你不會再看到它，其他主控台的同事也不會。'},
  personal:{en:'Items marked for information have nothing to finish. They are a notice addressed to you, so dismissing one removes it from your list and from no other list. Your colleague keeps their own copy until they read theirs.',
           zh:'標示為「僅供知悉」的項目沒有可完成的工作。那是寄給你的通知，關閉它只會從你的清單移除，不會影響任何人。同事的那一份要等他們自己讀過才會消失。'},
  badge:  {en:'The number on the bell counts work that is still outstanding in your scope, not messages you have not opened. Reading an item does not make the number go down. Finishing one does, for everyone.',
           zh:'鈴鐺上的數字計算的是你權責範圍內尚未完成的工作，不是你未讀的訊息。讀取項目不會讓數字變小，完成項目才會，而且是對所有人。'},
  effect: {en:'Finishing an item also moves the record behind it, so the incident drawer, the drills tab and this list can never disagree about the same fact. Undo puts both back.',
           zh:'完成項目時，系統會同時更新其背後的紀錄，因此事故明細、演練分頁與這份清單不會對同一件事說法不一。復原會把兩者一起還原。'}
};

/* ---------- self test ---------------------------------------------------- */

/* Returns the assertions rather than logging them, so a caller can render them
   or fail a gate on them. Every mutation it makes is undone before it returns.

   It deliberately picks a task in two personas' scope, because the assertion
   that matters is not that the actor stops seeing it. It is that everybody
   else does too. */
function taskSelfTest(){
  const R = {};
  const all = taskAll();

  /* 1. no id repeats */
  const seen = {};
  let dupes = 0;
  all.forEach(t => {if(seen[t.id]) dupes++; seen[t.id] = 1;});
  R.uniqueIds = {pass: dupes === 0, tasks: all.length, duplicates: dupes};

  /* 2. every subject resolves against real data */
  let bad = 0; const badIds = [];
  all.forEach(t => {
    const s = t.subject;
    let ok = false;
    if(s.type === 'incident') ok = !!INCIDENTS.find(x => x.id === s.id);
    else if(s.type === 'employee') ok = !!EMPBY[s.id] && !!CBY[s.course];
    else if(s.type === 'course') ok = !!CBY[s.id] && !!DRILLS[s.store] && !!DRILLS[s.store][s.id];
    else if(s.type === 'campaign') ok = (campaigns(s.store) || []).some(c => c.id === s.id);
    if(!ok){bad++; if(badIds.length < 5) badIds.push(t.id + ':' + s.type + ':' + s.id);}
  });
  R.subjectsResolve = {pass: bad === 0, unresolved: bad, sample: badIds};

  /* 3. drill tasks agree with storeStats, the number the network table prints */
  let drift = 0;
  STORES.forEach(s => {
    const mine = all.filter(t => t.kind === 'drill_overdue' && t.store === s.c && taskOpen(t, 'mgr')).length;
    if(mine !== storeStats(s).drillsOverdue) drift++;
  });
  R.drillsMatchStoreStats = {pass: drift === 0, storesDisagreeing: drift};

  /* 4, 5, 6. complete a shared task and prove it closed for everybody */
  const probe = all.filter(t => t.act && t.scope.length > 1 && taskOpen(t, t.scope[0]))[0]
             || all.filter(t => t.act && taskOpen(t, t.scope[0]))[0];
  if(!probe){
    R.closesForEveryone = {pass:false, note:'no open actionable task to probe'};
    R.decrementsEveryBadge = {pass:false, note:'no open actionable task to probe'};
    R.undoRestoresState = {pass:false, note:'no open actionable task to probe'};
  }else{
    const probeStore = probe.store || _tkStore(null);
    const before = {}, beforeSeen = {};
    TASK_PERSONAS.forEach(p => {
      before[p] = taskCount(p, probeStore);
      beforeSeen[p] = tasksFor(p, probeStore).some(t => t.id === probe.id);
    });
    const snapBefore = _tkSnapshot(probe, probeStore);

    const res = taskComplete(probe.id, probe.scope[0]);

    const stillSeen = TASK_PERSONAS.filter(p => tasksFor(p, probeStore).some(t => t.id === probe.id));
    R.closesForEveryone = {
      pass: res.ok === true && stillSeen.length === 0,
      task: probe.id, kind: probe.kind, closedBy: probe.scope[0],
      visibleBeforeTo: TASK_PERSONAS.filter(p => beforeSeen[p]),
      stillVisibleTo: stillSeen
    };

    const dropped = [], notDropped = [];
    TASK_PERSONAS.forEach(p => {
      const after = taskCount(p, probeStore);
      if(beforeSeen[p]){
        if(after.total === before[p].total - 1) dropped.push(p); else notDropped.push(p);
      }else if(after.total !== before[p].total){
        notDropped.push(p + ':moved-without-being-in-scope');
      }
    });
    R.decrementsEveryBadge = {pass: notDropped.length === 0 && dropped.length > 0,
      decremented: dropped, wrong: notDropped};

    const undone = taskUndo(res.token);
    const snapAfter = _tkSnapshot(probe, probeStore);
    R.undoRestoresState = {
      pass: undone.ok === true && snapAfter === snapBefore,
      task: probe.id,
      countsRestored: TASK_PERSONAS.every(p => taskCount(p, probeStore).total === before[p].total)
    };
    if(snapAfter !== snapBefore) R.undoRestoresState.diff = {before:snapBefore, after:snapAfter};
  }

  /* 7. taskClear throws on an actionable task, and does not throw on an
     informational one */
  const act = all.find(t => t.act);
  const info = all.find(t => !t.act);
  let threw = false;
  if(act){try{taskClear(act.id, 'hq');}catch(err){threw = true;}}
  R.clearThrowsOnActionable = {pass: threw, probed: act ? act.id : null};

  let infoOk = false;
  if(info){
    const p = info.scope[0];
    const beforeN = taskCount(p, info.store).total;
    taskClear(info.id, p);
    const afterN = taskCount(p, info.store).total;
    const otherStillOpen = taskOpen(info, info.scope[1] || p) || info.scope.length < 2;
    infoOk = afterN === beforeN - 1 && otherStillOpen && info.state === 'open';
    /* put the personal state back so the self test leaves nothing behind */
    const n = taskNotif(p, info.id); n.cleared_at = null; n.read_at = null;
  }
  R.infoClearsForOnePersonOnly = {pass: infoOk, probed: info ? info.id : null};

  R.counts = {};
  TASK_PERSONAS.forEach(p => {R.counts[p] = taskCount(p, _tkStore(null));});
  R.allPassed = Object.keys(R).filter(k => R[k] && typeof R[k].pass === 'boolean')
                             .every(k => R[k].pass);
  return R;
}

/* A stable string of everything the probe task can touch, so undo is compared
   against the real prior state and not against a hopeful re-read of one field. */
function _tkSnapshot(task, store){
  const parts = [task.state, String(task.doneBy), String(task.doneAt)];
  const s = task.subject;
  if(s.type === 'incident'){
    const i = INCIDENTS.find(x => x.id === s.id);
    if(i) parts.push(JSON.stringify({ack:i.ack, filed:i.filed, meet:i.meet, hold:i.hold,
      escal:i.escal, rev:i.legalReviewed, notes:(i.notes || []).length}));
  }else if(s.type === 'course'){
    const d = (DRILLS[s.store] || {})[s.id];
    if(d) parts.push(JSON.stringify({last:d.last, due:d.due, att:d.att}));
    const ss = st(s.store); if(ss) parts.push(String(storeStats(ss).drillsOverdue));
  }else if(s.type === 'employee'){
    const e = EMPBY[s.id];
    if(e){
      parts.push(JSON.stringify((REC[s.id] || {})[s.course] || null));

  const sc = st(store); if(sc) parts.push(String(storeStats(sc).pct));

}

/* The numerals are drawn, not set. A text element would put the glyph where
   the loaded font's metrics say it goes, and Noto Sans is a network request
   that can fail, so the mark would be one shape with the webfont and another
   without it. These are stroked paths on a 16 unit tall grid with an explicit
   advance width per digit, which makes 20px, 28px and 40px the same drawing at
   three scales.

   Construction, so the next person can extend the set. Every glyph's stroke
   centre line lives between y 1.2 and y 14.8, and the 1.2 half stroke on each
   side puts the ink at 0 to 16. w is the ink width, so a digit placed at x
   starts its ink exactly at x. 6 is 9 rotated 180 degrees about the cell
   centre, which is why their control points mirror. */
const BM_DIGIT = {
  '1':{w:5.6, d:'<path d="M1.2 4 4.4 1.2V14.8"/>'},
  '6':{w:9.2, d:'<circle cx="4.6" cy="11.4" r="3.4"/><path d="M1.2 10.4C1.2 5.8 3 3.1 6 1.2"/>'},
  '8':{w:9.3, d:'<circle cx="4.6" cy="4.1" r="2.9"/><circle cx="4.6" cy="11.3" r="3.5"/>'},
  '9':{w:9.2, d:'<circle cx="4.6" cy="4.6" r="3.4"/><path d="M8 5.6C8 10.2 6.2 12.9 3.2 14.8"/>'}
};
const BM_GAP = 1.6;      /* space between two digits, in grid units */
const BM_STROKE = 3.0;   /* rendered stroke weight in the 40 unit square */

/* Where the numerals sit inside the 40 unit square. A three digit mark gets a
   wider box and therefore ends up optically smaller, which is what happens to
   every three digit mark ever drawn and is not a bug to correct. */
const BM_BOX = {'99':{w:27, h:24}, '168':{w:30, h:22}};

const BM_LABEL = {
  '99':        {en:'99 Ranch Market mark',  zh:'99 Ranch Market 標記'},
  '168':       {en:'168 Market mark',       zh:'168 Market 標記'},
  readiness:   {en:'Readiness',             zh:'Readiness 準備度'}
};

/* Lay a string of digits out left to right and report the natural ink box. */
function bmNumerals(s){
  let x = 0, out = '';
  for(let i = 0; i < s.length; i++){
    const g = BM_DIGIT[s.charAt(i)];
    if(!g) continue;
    out += '<g transform="translate(' + x.toFixed(2) + ' 0)">' + g.d + '</g>';
    x += g.w + (i === s.length - 1 ? 0 : BM_GAP);
  }
  return {d:out, w:x, h:16};
}

/* bmark(banner, size) returns one inline SVG mark.
   banner is '99', '168' or anything else for the Readiness product mark.
   size is 20, 28 or 40. decorative suppresses the label when the banner name
   is already spelled out in the text beside it, so a screen reader does not
   read "99 Ranch Market mark, 99 Ranch". */
function bmark(banner, size, decorative){
  const px = size || 28;
  const key = banner === '168' ? '168' : banner === '99' ? '99' : 'readiness';
  let inner;
  if(key === 'readiness'){
    /* The shipped mark is a red square carrying one character and that is the
       design, so it is kept. One compromise, stated rather than hidden: this
       single CJK glyph is a text element, because tracing a CJK outline by
       hand here would be less reliable than the font, not more. textLength
       pins the horizontal size and dominant-baseline pins the vertical
       centre, so neither depends on which face resolved. */
    inner = '<text class="bm-ch" x="20" y="20.5" text-anchor="middle" ' +
      'dominant-baseline="central" textLength="21" lengthAdjust="spacingAndGlyphs" ' +
      'font-family="\'Noto Serif TC\',Georgia,serif" font-size="23" font-weight="700">準</text>';
  }else{
    const box = BM_BOX[key];
    const n = bmNumerals(key);
    const s = Math.min(box.w / n.w, box.h / n.h);
    const tx0 = (40 - n.w * s) / 2;
    const ty0 = (40 - n.h * s) / 2;
    /* The stroke is divided back out by the scale so both marks carry the same
       rendered weight even though they scale by different amounts. */
    inner = '<g class="bm-fig" transform="translate(' + tx0.toFixed(3) + ' ' + ty0.toFixed(3) +
      ') scale(' + s.toFixed(4) + ')" stroke-width="' + (BM_STROKE / s).toFixed(3) + '">' +
      n.d + '</g>';
  }
  const a = decorative
    ? 'aria-hidden="true" focusable="false"'
    : 'role="img" aria-label="' + esc(tx(BM_LABEL[key])) + '"';
  return '<svg class="bmark bmark-' + key + '" width="' + px + '" height="' + px +
    '" viewBox="0 0 40 40" ' + a + '>' +
    '<rect class="bm-sq" x="0" y="0" width="40" height="40" rx="9.5"/>' + inner + '</svg>';
}

const HERO_DAY = (typeof DAY !== 'undefined') ? DAY : 86400000;
const HERO_HR  = (typeof HR  !== 'undefined') ? HR  : 3600000;

const HERO_MIN = 60000;

function heroDays(ms){return Math.max(0, Math.round(Math.abs(ms) / HERO_DAY));}
function heroHrs(ms){return Math.max(0, Math.round(Math.abs(ms) / HERO_HR));}
function heroMins(ms){return Math.max(1, Math.round(Math.abs(ms) / HERO_MIN));}
function heroNum(n){return Number(n).toLocaleString();}
/* English agreement for a figure and its qualifier. "0 hours left" and
   "1 days left" are both wrong and both look generated, and the qualifier is
   the whole point of the figure. */
function heroPl(n, one, many){return n === 1 ? one : many;}

/* Which surface each kind belongs to, per persona. This mirrors the pick
   functions in chrome.js.part's NV_SURFACES exactly, and it has to: the card
   promises "Open those 5", the button loads that surface with that group
   filter, and chrome narrows the surface the same way. If these two tables
   ever disagree, the count on the button stops matching the list that opens,
   which is the precise defect the 405 teardown warns about.

   mgr is the one persona whose training rows split across two surfaces, own
   training against the team's, so it is resolved per task below. */
const HERO_SURFACE = {
  hq:    {ack_incident:'queue', clock_expiring:'queue', clock_expired:'queue',
          schedule_meeting:'queue', campaign_done:'campaign'},
  legal: {clock_expiring:'filings', clock_expired:'filings',
          legal_review:'matters', litigation_hold:'holds'},
  mgr:   {drill_overdue:'drills', ack_incident:'report',
          campaign_done:'team', training_overdue:'team'},
  emp:   {training_overdue:'learning'}
};
const HERO_GROUP_RANK = {late:0, today:1, week:2, noclock:3, info:4};

function heroSurfaceOf(persona, task, store){
  const row = HERO_SURFACE[persona] || {};
  if(persona === 'mgr' && task.kind === 'training_overdue'){
    const rs = (typeof ROSTER !== 'undefined' && ROSTER[store]) || [];
    const sm = rs.filter(e => e.role === 'SM')[0];
    return (sm && task.subject.id === sm.id) ? 'training' : 'team';
  }
  return row[task.kind] || null;
}

/* Buckets are keyed surface plus deadline group, so the number on the button
   is exactly the number of rows that open. Keying by kind instead would read
   better and lie: "Open those 3" would open a list of seventeen. */
function heroBuckets(persona, store){
  const list = tasksFor(persona, store);
  const gm = {};
  taskGroups(persona, store).forEach(g => {g.tasks.forEach(t => {gm[t.id] = g.key;});});

  const map = {}, order = [];
  list.forEach(t => {
    const sk = heroSurfaceOf(persona, t, store);
    const gk = gm[t.id];
    if(!sk || !gk) return;
    const key = sk + '|' + gk;
    let b = map[key];
    if(!b){
      b = map[key] = {surface:sk, group:gk, tasks:[], kinds:{}, subjects:{}, worst:t};
      order.push(b);
    }
    b.tasks.push(t);
    b.kinds[t.kind] = (b.kinds[t.kind] || 0) + 1;
    if(t.subject && t.subject.id) b.subjects[t.subject.id] = 1;
  });

  /* tasksFor is already sorted worst first, so each bucket's first task is its
     worst. Order the buckets by how late they are, then by how many rows are
     stuck in them. */
  order.sort((a, b) => {
    const ar = HERO_GROUP_RANK[a.group], br = HERO_GROUP_RANK[b.group];
    if(ar !== br) return ar - br;
    return b.tasks.length - a.tasks.length;
  });
  return order;
}

/* Severity for the card's 3px left edge. crit is granted only where the task
   engine granted it, which is an expired 8 hour Cal/OSHA clock and nothing
   else, per contract section 6. */
function heroCardSev(b){
  if(b.worst.sev === 'crit') return 'crit';
  if(b.group === 'late') return 'late';
  if(b.group === 'today' || b.group === 'week') return 'warn';
  return 'info';
}

/* The impact figure. Always a number with a qualifier word after it, never a
   bare figure, and the qualifier changes with the group so it stays true:
   time past the deadline when late, time left when it is still running, and a
   count of what is affected when there is no clock at all. */
function heroImpact(b){
  const now = Date.now();
  const clocky = b.worst.kind === 'clock_expiring' || b.worst.kind === 'clock_expired';
  const n = b.tasks.length;

  if(b.group === 'late'){
    let worstMs = 0;
    b.tasks.forEach(t => {if(t.due != null && now - t.due > worstMs) worstMs = now - t.due;});
    if(clocky){
      /* Under two hours the hour figure rounds to nothing useful, and "0 hours
         past the deadline" is the kind of number that makes a reader stop
         trusting the rest of the strip. */
      if(worstMs < 2 * HERO_HR){
        const m = heroMins(worstMs);
        return {v:heroNum(m), q:{en:heroPl(m, 'minute past the deadline', 'minutes past the deadline'),
                                 zh:'分鐘，逾期最久者'}};
      }
      const h = heroHrs(worstMs);
      return {v:heroNum(h), q:{en:heroPl(h, 'hour past the deadline', 'hours past the deadline'),
                               zh:'小時，逾期最久者'}};
    }
    const d = heroDays(worstMs);
    if(d < 1){
      const h = heroHrs(worstMs);
      return {v:heroNum(h), q:{en:heroPl(h, 'hour past the deadline', 'hours past the deadline'),
                               zh:'小時，逾期最久者'}};
    }
    return {v:heroNum(d), q:{en:heroPl(d, 'day past the deadline', 'days past the deadline'),
                             zh:'天，逾期最久者'}};
  }

  if(b.group === 'today' || b.group === 'week'){
    let leftMs = Infinity;
    b.tasks.forEach(t => {if(t.due != null && t.due - now < leftMs) leftMs = t.due - now;});
    if(!isFinite(leftMs) || leftMs < 0) leftMs = 0;
    if(clocky || b.group === 'today'){
      if(leftMs < 2 * HERO_HR){
        const m = heroMins(leftMs);
        return {v:heroNum(m), q:{en:heroPl(m, 'minute left on the tightest one', 'minutes left on the tightest one'),
                                 zh:'分鐘，最緊迫者剩餘'}};
      }
      const h = heroHrs(leftMs);
      return {v:heroNum(h), q:{en:heroPl(h, 'hour left on the tightest one', 'hours left on the tightest one'),
                               zh:'小時，最緊迫者剩餘'}};
    }
    const d = heroDays(leftMs);
    if(d < 1){
      const h = heroHrs(leftMs);
      return {v:heroNum(h), q:{en:heroPl(h, 'hour left on the tightest one', 'hours left on the tightest one'),
                               zh:'小時，最緊迫者剩餘'}};
    }
    return {v:heroNum(d), q:{en:heroPl(d, 'day left on the tightest one', 'days left on the tightest one'),
                             zh:'天，最緊迫者剩餘'}};
  }

  if(b.group === 'info'){
    return {v:heroNum(n), q:{en:heroPl(n, 'notice, nothing to finish', 'notices, nothing to finish'),
                             zh:'則通知，無須處理'}};
  }
  const subs = Object.keys(b.subjects).length || n;
  return {v:heroNum(subs), q:{en:heroPl(subs, 'record affected, no clock', 'records affected, no clock'),
                              zh:'筆紀錄受影響，無時限'}};
}

function heroBucketSay(b){
  const n = b.tasks.length;
  const kinds = Object.keys(b.kinds);
  if(kinds.length === 1 && HERO_KIND_SAY[kinds[0]]) return HERO_KIND_SAY[kinds[0]](n, b);
  /* Mixed. Name the group honestly, then name the leading kind inside it, so
     the sentence is still about a problem rather than about a container. */
  let lead = kinds[0];
  kinds.forEach(k => {if(b.kinds[k] > b.kinds[lead]) lead = k;});
  const m = b.kinds[lead];
  const base = (HERO_GROUP_SAY[b.group] || HERO_GROUP_SAY.noclock)(n);
  const noun = HERO_KIND_NOUN[lead] ||
    {one:{en:'an item', zh:'項目'}, many:{en:'items', zh:'項目'}};
  const word = m === 1 ? noun.one : noun.many;
  return {
    en: base.en + ', ' + m + ' of them ' + tx0(word, 'en'),
    zh: base.zh + '，其中 ' + m + ' 項為' + tx0(word, 'zh')
  };
}
/* tx() answers in the current language. These two halves are being built side
   by side into one bilingual object, so each half has to name its own. */
function tx0(o, lang){return lang === 'zh' ? o.zh : o.en;}

function heroBucketCta(b){
  const n = b.tasks.length;
  if(b.group === 'info'){
    return {en: n === 1 ? 'Read that one' : 'Read those ' + n,
            zh: '讀取這 ' + n + ' 則'};
  }
  return {en: n === 1 ? 'Open that one' : 'Open those ' + n,
          zh: '開啟這 ' + n + ' 項'};
}

function heroTodayHTML(persona, store, rest){
  const buckets = heroBuckets(persona, store).slice(0, 3);
  const total = tasksFor(persona, store).length;
  let body;
  if(!buckets.length){
    body = '<div class="h-rest"><b>' + esc(tx(rest)) + '</b> ' +
      esc(tx(HERO_COPY.restSub)) + '</div>';
  }else{
    body = '<div class="h-today">' + buckets.map(b => {
      const imp = heroImpact(b);
      return heroCard({
        sev:  heroCardSev(b),
        say:  heroBucketSay(b),
        impv: imp.v,
        impq: imp.q,
        btn:  heroGoBtn({surface:b.surface, filter:b.group}, heroBucketCta(b))
      });
    }).join('') + '</div>';
  }
  const shown = buckets.reduce((a, b) => a + b.tasks.length, 0);
  const count = total
    ? {en: shown + ' of ' + total + ' open items in view',
       zh: '已顯示 ' + shown + ' 項，未完成共 ' + total + ' 項'}
    : {en:'', zh:''};
  return '<div class="h-todayhd"><h2>' + esc(tx(HERO_COPY.today)) + '</h2>' +
    (total ? '<span class="h-count">' + esc(tx(count)) + '</span>' : '') +
    '</div>' + body;
}

   5. NEED FROM YOU
   Computed, never written down. hq and legal only, because they are the two
   consoles where somebody else's work is genuinely blocked on this viewer.

function heroNeedHTML(persona, store){
  let txt, btn = '';
  if(persona === 'hq'){
    /* The only thing in this data set that a store cannot close without HQ is
       the post incident review meeting: schedule_meeting is scoped to hq
       alone, and the incident stays open until a meeting is on the record. */
    const rows = tasksFor('hq', store).filter(t => t.kind === 'schedule_meeting');
    const stores = {};
    rows.forEach(t => {if(t.store) stores[t.store] = 1;});
    const ns = Object.keys(stores).length;
    if(!rows.length){
      txt = {en:'No store is waiting on HQ to schedule anything right now.',
             zh:'目前沒有門市在等待總部安排任何事項。'};
    }else{
      txt = {en: ns + (ns === 1 ? ' store cannot' : ' stores cannot') +
                 ' close a post incident review until HQ schedules the meeting, covering ' +
                 rows.length + (rows.length === 1 ? ' incident.' : ' incidents.'),
             zh: '有 ' + ns + ' 間門市的事故檢討待總部安排會議後才能結案，共涉及 ' +
                 rows.length + ' 件事故。'};
      const worst = rows[0];
      btn = heroGoBtn({surface:'queue', filter:heroGroupOf('hq', store, worst.id)},
        HERO_COPY.openQueue, 'h-needgo');
    }
  }else{
    const rows = tasksFor('legal', store).filter(t => t.kind === 'litigation_hold');
    if(!rows.length){
      txt = {en:'No matter is waiting on a hold decision from you.',
             zh:'目前沒有等待你決定文件保存的案件。'};
    }else{
      txt = {en: rows.length + (rows.length === 1 ? ' matter is' : ' matters are') +
                 ' waiting on a litigation hold decision, which is a call only counsel can make.',
             zh: '有 ' + rows.length + ' 件案件待決定是否設定文件保存，此決定僅法務可作成。'};
      btn = heroGoBtn({surface:'holds', filter:heroGroupOf('legal', store, rows[0].id)},
        HERO_COPY.openHolds, 'h-needgo');
    }
  }
  return '<div class="h-need"><span class="h-needk">' + esc(tx(HERO_COPY.need)) + '</span>' +
    '<span class="h-needt">' + esc(tx(txt)) + '</span>' + btn + '</div>';
}

function heroGroupOf(persona, store, id){
  const gs = taskGroups(persona, store);
  for(let i = 0; i < gs.length; i++){
    for(let j = 0; j < gs[i].tasks.length; j++) if(gs[i].tasks[j].id === id) return gs[i].key;
  }
  return null;
}

function heroEyebrow(txt, marks){

function heroBandHTML(o){
  /* "Need from you" moved out of the identity column and onto its own full
     width row, by the merge rather than by this layer's author.

     Measured, not preferred: inside h-id it sat in a 432px column, so its one
     sentence wrapped to two lines and the label and the link stacked under it,
     which took the column to 202px and set the height of the whole band. The
     KPI block beside it was 91px, so 111px of the hero was whitespace holding
     up a short sentence. On its own row it is one line at any width above a
     phone, and it reads better there anyway, because it is a sentence about
     the whole console rather than a third line of the title. */
  return '<div class="h-band"><div class="h-id">' +
      o.eyebrow +
      '<h1>' + o.title + '</h1>' +
      '<div class="h-sub">' + o.sub + '</div>' +
    '</div>' +
    (o.kpis ? '<div class="h-kpis">' + o.kpis + '</div>' : '') +
    /* Always emitted, even empty. It is the slot the manager console's own
       store switcher is carried into when the chrome layer is not present, and
       a slot that only sometimes exists is a slot that is sometimes missed. */
    '<div class="h-act">' + (o.act || '') + '</div>' +
  '</div>' + (o.need || '');
}

/* Different in kind on purpose. One person, their own progress, the next thing
   due. There is no KPI strip about the network here and there should not be:
   the numbers a learner can act on are all about the learner. */
function heroEmpNext(e){
  const rank = s => s === 'missing' ? 0 : s === 'expired' ? 1 : s === 'expiring' ? 2 : 3;
  let best = null;
  required(e).forEach(c => {
    const cs = certState(e, c.c);
    const k = rank(cs.s);
    const exp = cs.exp == null ? Infinity : cs.exp;
    if(!best || k < best.k || (k === best.k && exp < best.exp)) best = {c:c, k:k, exp:exp, s:cs.s};
  });
  return best;
}

function heroEmp(){
  const e = S.me;
  if(!e) return null;
  const s = st(e.store);
  const recs = REC[e.id] || {};
  const req = required(e);
  const done = req.filter(c => recs[c.c] && recs[c.c].done).length;
  const assigned = req.filter(c => {
    const r = recs[c.c];
    const cs = certState(e, c.c);
    return !r || !r.done || cs.s === 'expired' || cs.s === 'expiring';
  }).length;
  const pct = req.length ? Math.round(100 * done / req.length) : 0;

  const eyebrow = heroEyebrow(
    tx(HERO_COPY.eyeEmp) + ' · ' + (s ? s.c + ', ' + s.city + ', ' + s.st : e.store),
    bmark(s ? s.b : '99', 20, true));

  const sub = esc(e.title) + ' · ' + esc(tx(dep(e.dept))) + ' · ' +
    '<span class="mono">' + esc(e.id) + '</span>' +
    '<div class="h-prog"><span class="h-track"><i class="h-fill" style="width:' + pct + '%"></i></span>' +
    '<span class="mono">' + pct + '%</span></div>';

  const kpis =
    heroKpi(done + ' / ' + req.length, {en:'required modules complete', zh:'門必修課程已完成'},
      {en:'Counted against the modules your role and department require',
       zh:'以你的職務與部門所需課程計算'}, pct >= 90 ? 'good' : pct >= 70 ? 'warn' : 'bad') +
    heroKpi(heroNum(assigned), {en:'still on your list', zh:'門仍在你的清單上'},
      {en:'Missing, expired, or inside the 60 day recertification window',
       zh:'缺漏、逾期，或已進入 60 天重新認證窗'}, assigned ? 'warn' : 'good');

  /* The next thing due, as one card, with the module button the shipped player
     already listens for. */
  const nx = heroEmpNext(e);
  let today;
  if(!nx){
    today = '<div class="h-todayhd"><h2>' + esc(tx(HERO_COPY.today)) + '</h2></div>' +
      '<div class="h-rest"><b>' + esc(tx(HERO_COPY.restEmp)) + '</b> ' +
      esc(tx(HERO_COPY.restSub)) + '</div>';
  }else{
    const name = tx(nx.c);
    const d = nx.exp === Infinity ? 0 : heroDays(nx.exp - Date.now());
    const say = nx.s === 'missing'
      ? {en: nx.c.c + ' ' + name + ' has never been completed',
         zh: nx.c.c + ' ' + name + ' 尚未完成過'}
      : nx.s === 'expired'
      ? {en: nx.c.c + ' ' + name + ' lapsed ' + d + ' days ago',
         zh: nx.c.c + ' ' + name + ' 已失效 ' + d + ' 天'}
      : nx.s === 'expiring'
      ? {en: nx.c.c + ' ' + name + ' lapses in ' + d + ' days',
         zh: nx.c.c + ' ' + name + ' 將於 ' + d + ' 天後失效'}
      : {en: 'Your next recertification is ' + nx.c.c + ' ' + name,
         zh: '你的下一項重新認證是 ' + nx.c.c + ' ' + name};
    const sev = nx.s === 'missing' || nx.s === 'expired' ? 'late'
      : nx.s === 'expiring' ? 'warn' : 'info';
    const cta = nx.s === 'current'
      ? {en:'Review ' + nx.c.c, zh:'複習 ' + nx.c.c}
      : {en:'Start ' + nx.c.c,  zh:'開始 ' + nx.c.c};
    today = '<div class="h-todayhd"><h2>' + esc(tx(HERO_COPY.today)) + '</h2></div>' +
      '<div class="h-today">' + heroCard({
        sev: sev,
        say: say,
        impv: heroNum(nx.c.min),
        impq: {en:'minutes of work', zh:'分鐘的課程時間'},
        /* data-module is the shipped player's own attribute, so this button
           opens the module through the handler that already exists. */
        btn: '<button type="button" class="btn sm" data-module="' + esc(nx.c.c) + '">' +
             esc(tx(cta)) + '</button>'
      }) + '</div>';
  }

  return {
    banner: s ? s.b : '99',
    band: heroBandHTML({eyebrow:eyebrow, title:esc(e.name), sub:sub, kpis:kpis}),
    today: today
  };
}

   ====================================================================== */

/* Splice the hero into the view that render() just painted, and take the old
   page head out. The view functions are not this agent's to edit, contract
   section 9, and moving nodes rather than re templating is also how
   chrome.js.part folds the shipped markup into the shell.

   :scope is used on every lookup so a nested .wrap inside a drawer or the map
   overlay can never be mistaken for the page's own. */
function heroMount(){
  const app = document.getElementById('app');
  if(!app) return;
  /* The module player is a focus mode with its own head. It gets no hero. */
  if(S.module) return;
  const wrap = app.querySelector('div.wrap');
  if(!wrap) return;
  if(wrap.querySelector(':scope > div#hero')) return;

  /* Built before the page head comes out. If a hero cannot be built, because
     the selected store resolved to nothing, the shipped head has to survive:
     a view with no head and no hero is a blank console. */
  const html = heroHTML();
  if(!html) return;

  const ph = wrap.querySelector(':scope > div.pagehead');
  /* The manager console ships its store switcher inside the page head. If the
     chrome layer is present it owns that control and mounts its own copy in
     the mini nav; if it is not, the control is carried into the hero rather
     than dropped, because a store console with no way to change store is worse
     than a taller hero. */
  const keep = (ph && typeof nvMount !== 'function') ? ph.querySelector('select#storepick') : null;
  if(ph) ph.remove();
  wrap.insertAdjacentHTML('afterbegin', html);

  if(keep){
    const slot = wrap.querySelector(':scope > div#hero div.h-act') ||
                 wrap.querySelector(':scope > div#hero div.h-id');
    if(slot) slot.appendChild(keep);
  }

  /* The palette proof and the marks disclaimer, hq only for the proof because
     it is a note about how this build is made and it belongs on the console a
     reviewer opens first. */
  if(S.persona === 'hq' && !wrap.querySelector(':scope > div.h-proof')){
    const foot = wrap.querySelector(':scope > div.foot');
    if(foot) foot.insertAdjacentHTML('beforebegin', heroProofHTML());
    else wrap.insertAdjacentHTML('beforeend', heroProofHTML());
  }
  const foot = wrap.querySelector(':scope > div.foot');
  if(foot && !foot.querySelector('span.h-footnote')){
    foot.insertAdjacentHTML('beforeend', heroFootNoteHTML());
  }
}

/* ======================================================================
   10. ROUTING OUT OF THE HERO
   ====================================================================== */

/* Every Today button carries a route patch, never a bare navigation. The patch
   is handed to the chrome layer's nvGo when it is present, because that is the
   one function that knows how to set the legacy S.filter for a surface, scroll
   to the right section and move focus. When it is not present the button still
   works, at the cost of the scroll.

   patch.lfilter is the optional legacy S.filter value for surfaces whose own
   list narrows on it. It is applied after nvGo, because nvGo assigns the
   surface default and renders, and a second render is a cheaper price than
   reaching into another agent's module scope to pre empt it. */
function heroGo(patch){
  patch = patch || {};
  const lf = patch.lfilter || null;
  const out = {surface:patch.surface || null, filter:patch.filter || null};
  if(patch.persona) out.persona = patch.persona;

  /* Announced before the route is applied, not after. Contract section 7 wants
     every count that changes on interaction to reach #live, and the counts do
     not move on a navigation, so saying it first costs nothing and survives
     whatever the routing layer does with the render that follows. */
  const c = taskCount(S.persona, S.store);
  const lbl = (typeof TASK_GROUP_LABEL !== 'undefined' && out.filter && TASK_GROUP_LABEL[out.filter])
    ? tx(TASK_GROUP_LABEL[out.filter]) : '';
  heroSay(t(S.persona) + ', ' + (lbl ? lbl + ', ' : '') +
    (LANG === 'zh' ? '未完成 ' + c.total + ' 項' : c.total + ' open'));

  if(typeof nvGo === 'function'){
    nvGo(out);
    if(lf && S.filter !== lf){S.filter = lf; render();}
  }else{
    S.module = null;
    if(out.surface){S.tab = out.surface; S.route.surface = out.surface;}
    S.filter = lf || 'all';
    S.route.filter = out.filter;
    S.route.ctx = null;
    render();
  }
}

/* Capture phase, and only for buttons inside #hero.

   Contract section 3: every closest() here is qualified to a tag, because
   <html> carries data-persona and <body> carries data-view on this project and
   an unqualified closest matched the document root once already.

   Stopping propagation here keeps the floating layer's own data-go handler
   from routing the same click a second time. The chrome layer's capture
   handler is registered on this same node so it still runs, and it already
   returns early for any data-go button that is not inside one of its four
   containers. Buttons carrying data-module are deliberately not touched, so
   the shipped module player keeps receiving them. */
document.addEventListener('click', e => {
  if(!e.target || !e.target.closest) return;
  const b = e.target.closest('button[data-go]');
  if(!b || !b.closest('div#hero')) return;
  e.preventDefault();
  e.stopPropagation();
  let patch = null;
  try{patch = JSON.parse(b.dataset.go || '{}');}catch(err){patch = null;}
  if(patch) heroGo(patch);
}, true);

/* render() is wrapped, not replaced. chrome.js.part wraps it too and captures
   whatever it finds, so in merge order the chain becomes
   shipped render, then this hero mount, then the chrome mount. Replacing it
   would silently drop whichever layer merged first. */
const HERO_BASE_RENDER = render;
render = function(){
  HERO_BASE_RENDER.apply(this, arguments);
  heroMount();
};

/* The shipped boot ran its first render before this block was evaluated, so
   the first paint has a page head and no hero. Mount once against the DOM that
   is already there rather than forcing a second full render of 549 task rows. */

/* Who may enter whose console. Read straight off the app's own behaviour:
   the legal console prints "this role cannot view training scores or browse
   rosters", and the incident drawer withholds privileged notes from HR. A
   column the viewer cannot enter is rendered with its counts and its reason,
   never removed, because a permissions demo that hides the door reads as a
   permissions bug rather than a permissions boundary. */
const NV_ENTER = {
  hq:    {hq:1, legal:0, mgr:1, emp:1},
  legal: {hq:0, legal:1, mgr:0, emp:0},
  mgr:   {hq:0, legal:0, mgr:1, emp:0},
  emp:   {hq:0, legal:0, mgr:0, emp:1}
};
const NV_WALL = {
  hq:    {en:'Network wide consoles are HQ and HR only. The counts are visible here, the console is not.',
          zh:'全網主控台僅限總部人資。此處可看到數字，但無法開啟該主控台。'},
  legal: {en:'Privileged. Counsel only, and privileged notes are never rendered to any other role.',
          zh:'法務特權範圍，僅限法務人員；特權紀錄不會顯示給其他任何身分。'},
  mgr:   {en:'A store console belongs to that store. This role reads the counts and cannot open the roster.',
          zh:'門市主控台屬於該門市。此身分可讀取數字，但無法開啟人員名冊。'},
  emp:   {en:'The learner view belongs to one person and carries their own scores.',
          zh:'學習者檢視屬於個人，且含個人成績。'}
};
function nvCanEnter(viewer, col){
  const row = NV_ENTER[viewer] || {};
  return !!row[col];
}

/* ---------- derived data ------------------------------------------------- */

function nvSurfList(persona){return NV_SURFACES[persona] || NV_SURFACES.hq;}
function nvFind(persona, key){
  const list = nvSurfList(persona);
  for(let i = 0; i < list.length; i++) if(list[i].k === key) return list[i];
  return null;
}
function nvCtx(persona, store){
  const rs = (typeof ROSTER !== 'undefined' && ROSTER[store]) || [];
  const mgr = rs.filter(e => e.role === 'SM')[0] || null;
  return {persona:persona, store:store, mgr:mgr, mgrId:mgr ? mgr.id : null,
          me:S.me || null, meId:S.me ? S.me.id : null};
}
/* Which group each open task fell into, taken from taskGroups so the chrome
   and the inbox drawer can never bin the same task differently. */
function nvGroupMap(persona, store){
  const m = {};
  taskGroups(persona, store).forEach(g => {g.tasks.forEach(t => {m[t.id] = g.key;});});
  return m;
}
/* The current surface. mgr is the one persona whose surfaces are the shipped
   S.tab values, so S.tab stays authoritative there and S.route.surface follows
   it rather than competing with it. */
function nvSurfaceKey(){
  const list = nvSurfList(S.persona);
  const has = k => list.some(s => s.k === k);
  if(S.persona === 'mgr') return has(S.tab) ? S.tab : 'training';
  if(S.route && has(S.route.surface)) return S.route.surface;
  if(has(S.tab)) return S.tab;
  return list[0].k;
}

/* One pass over one persona's open tasks, split by surface, in the task
   engine's own group order. Everything drawn by this file reads from here. */
function nvSurfaceData(persona, store){
  const ctx = nvCtx(persona, store);
  const groups = taskGroups(persona, store);
  return nvSurfList(persona).map(sf => {
    let total = 0, worst = 'info', group = null, gn = 0;
    const tasks = [];
    groups.forEach(g => {
      const mine = g.tasks.filter(t => sf.pick(t, ctx));
      if(!mine.length) return;
      if(group === null){group = g.key; gn = mine.length;}
      total += mine.length;
      mine.forEach(t => {
        tasks.push(t);
        if(t.sev === 'crit') worst = 'crit';
        else if(t.sev === 'warn' && worst !== 'crit') worst = 'warn';
      });
    });
    const phrase = total === 0
      ? (sf.rest ? sf.rest(ctx) : NV_COPY.nothing)
      : nvPhrase(group, gn, total);
    return {sf:sf, ctx:ctx, total:total, group:group, worst:worst, tasks:tasks, phrase:phrase};
  });
}
function nvPhrase(group, n, total){
  const base = (NV_PHRASE[group] || NV_PHRASE.noclock)(n);
  if(total <= n) return base;
  return {en:base.en + ', ' + total + ' ' + NV_COPY.allIn.en,
          zh:base.zh + '，' + NV_COPY.allIn.zh + ' ' + total + ' 件'};
}
/* Severity drives the badge, and severity is the task engine's field. The one
   selector that can reach --critical is the crit branch, and clock_expired is
   the only kind the engine allows to carry crit. */
function nvBadgeCls(row){
  if(!row.total) return 'zero';
  if(row.worst === 'crit') return 'crit';
  if(row.group === 'late') return 'late';
  if(row.worst === 'warn') return 'warn';
  return 'info';
}
function nvOpenPhrase(c){
  return {en:'Tasks, ' + c.total + ' open', zh:'待辦事項，' + c.total + ' 項未完成'};
}

/* ---------- need from you ------------------------------------------------ */

/* Teardown doc 03 section 2, item 3. The strongest writing on that hub is the
   section that names what the viewer personally has to unblock, so this is one
   computed sentence per persona and never a hardcoded one. It counts through
   taskAll and taskOpen, which is the same open predicate the badge uses. */
function nvNeed(persona, store){
  const all = taskAll();
  const openFor = (kind, p, pred) => all.filter(t =>
    t.kind === kind && taskOpen(t, p) && (!pred || pred(t)));

  if(persona === 'hq'){
    const meets = openFor('schedule_meeting', 'hq').length;
    const drills = openFor('drill_overdue', 'mgr');
    const by = {};
    drills.forEach(t => {by[t.store] = (by[t.store] || 0) + 1;});
    const codes = Object.keys(by).sort((a, b) => by[b] - by[a]);
    const worst = codes[0];
    if(!meets && !codes.length) return {en:'Nothing is waiting only on HQ right now. Every review meeting is booked and every store drill is inside its interval.',
                                        zh:'目前沒有只等總部處理的事項。所有檢討會議皆已安排，各門市演練也都在週期內。'};
    return {en:meets + ' review meetings can only be scheduled by HQ, and ' + codes.length +
               ' stores are carrying an overdue drill that needs a scheduled slot' +
               (worst ? ', ' + worst + ' most of all with ' + by[worst] : '') + '.',
            zh:'有 ' + meets + ' 場檢討會議只有總部能安排；另有 ' + codes.length +
               ' 間門市的演練已逾期，需要總部排定時段' +
               (worst ? '，其中以 ' + worst + ' 最多，共 ' + by[worst] + ' 項' : '') + '。'};
  }

  if(persona === 'legal'){
    const rev = openFor('legal_review', 'legal').length;
    const hold = openFor('litigation_hold', 'legal').length;
    const late = openFor('clock_expired', 'legal').length;
    if(!rev && !hold && !late) return {en:'Nothing is waiting only on counsel. Every escalation is closed and every hold that was asked for is set.',
                                       zh:'目前沒有只等法務處理的事項。所有轉介案件皆已結案，所需的文件保存也都已設定。'};
    return {en:rev + ' escalations and ' + hold + ' litigation holds sit only with counsel, and ' + late +
               ' statutory filings are already past their deadline. Nobody else in this company can close them.',
            zh:'有 ' + rev + ' 件轉介案件與 ' + hold + ' 項訴訟文件保存只有法務能處理，另有 ' + late +
               ' 項法定送件已逾期。公司內沒有其他人能結案。'};
  }

  if(persona === 'mgr'){
    const s = st(store);
    const where = s ? s.c + ', ' + s.city : String(store);
    const dr = openFor('drill_overdue', 'mgr', t => t.store === store).length;
    const tr = openFor('training_overdue', 'mgr', t => t.store === store).length;
    const ack = openFor('ack_incident', 'mgr', t => t.store === store).length;
    if(!dr && !tr && !ack) return {en:'Nothing at ' + where + ' is waiting on you. Drills are current, certifications are current, and every incident has been acknowledged.',
                                   zh:where + ' 目前沒有等你處理的事項。演練與認證皆在效期內，事故也都已受理。'};
    return {en:dr + ' drills can only be run at ' + where + ', ' + tr +
               ' certifications need you to record the completion, and ' + ack +
               ' incidents are waiting for somebody to confirm they were picked up.',
            zh:'有 ' + dr + ' 項演練只能在 ' + where + ' 執行，' + tr +
               ' 項認證需要你記錄完成，另有 ' + ack + ' 件事故等待確認已有人接手。'};
  }

  const mine = openFor('training_overdue', 'emp', t => S.me && t.subject.id === S.me.id).length;
  if(!mine) return {en:'Nothing is waiting on you. Your next recertification will appear here when it comes due.',
                    zh:'目前沒有等你處理的事項。下次複訓到期時會出現在這裡。'};
  return {en:mine + ' modules are assigned to you and nobody else can complete them for you.',
          zh:'有 ' + mine + ' 門課程指派給你，沒有其他人能代為完成。'};
}

/* ---------- mini nav ----------------------------------------------------- */

function nvCrumb(rows){
  const cur = nvSurfaceKey();
  const sf = nvFind(S.persona, cur);
  const row = rows.filter(r => r.sf.k === cur)[0];
  const parts = ['<span class="nv-hide-sm">' + esc(tx(NV_COPY.crumbRoot)) + '</span>',
                 '<span class="nv-hide-sm">' + esc(t(S.persona)) + '</span>',
                 '<b>' + esc(sf ? tx(sf.label) : cur) + '</b>'];
  /* The filter is a crumb you can take off. A navigation that narrows the list
     and gives you no way back to the whole list is a trap, not a shortcut. */
  if(S.route.filter && row){
    parts.push('<button class="nv-clear" data-go="' + esc(JSON.stringify({surface:cur})) +
      '" aria-label="' + esc(tx(NV_COPY.clearFilter) + ', ' +
        tx(TASK_GROUP_LABEL[S.route.filter] || NV_COPY.nothing)) + '"><b>' +
      esc(tx(TASK_GROUP_LABEL[S.route.filter] || NV_COPY.nothing)) + '</b>' +
      nvIcon('x', 13) + '</button>');
  }
  if(S.module) parts.push('<b>' + esc(S.module) + '</b>');
  /* The separator travels WITH the crumb that follows it, rather than being
     joined between crumbs. Joining left the separators behind when .nv-hide-sm
     took the first two crumbs away on a phone, so the trail rendered as
     "/ / Action queue". A separator is part of its crumb, not a thing between
     two crumbs, and marking it up that way is what makes hiding a crumb hide
     its separator with it. */
  const marked = parts.map((p, i) => i === 0 ? p
    : '<span class="nv-cr' + (/nv-hide-sm/.test(p) ? ' nv-hide-sm' : '') + '">' +
      '<span class="nv-sep" aria-hidden="true">/</span>' + p + '</span>');
  return '<nav class="nv-crumb" aria-label="' + esc(tx(NV_COPY.crumbRoot)) + '">' +
    marked.join('') + '</nav>';
}

/* One store switcher for the whole app. The manager console shipped its own
   #storepick inside the page head; nvMount removes that one and this is the
   only survivor, so the id stays unique and the shipped change handler that
   listens for it keeps working untouched. */
function nvCtxHTML(){
  if(S.persona === 'emp'){
    const e = S.me;
    return '<span class="nv-ctx">' + esc(tx(NV_COPY.ctxMe)) + ' <b>' +
      esc(e ? e.name : '') + '</b> <span class="mono">' + esc(e ? e.id : '') + '</span></span>';
  }
  const opts = STORES.map(x => '<option value="' + esc(x.c) + '"' + (x.c === S.store ? ' selected' : '') +
    '>' + esc(x.c + ' · ' + x.city + ', ' + x.st) + '</option>').join('');
  return '<span class="nv-ctx"><label class="nv-hide-sm" for="storepick">' +
    esc(tx(NV_COPY.ctxStore)) + '</label>' +
    '<select id="storepick" aria-label="' + esc(tx(NV_COPY.ctxStore)) + '">' + opts + '</select></span>';
}

/* Previous and next walk the loaded queue: this surface, narrowed by whatever
   filter the navigation carried. Somebody working a queue should not have to
   go back to the list between items. */
function nvQueue(){
  const store = S.store, p = S.persona;
  const sf = nvFind(p, nvSurfaceKey());
  const ctx = nvCtx(p, store);
  let list = tasksFor(p, store);
  if(sf && sf.pick) list = list.filter(t => sf.pick(t, ctx));
  if(S.route.filter){
    const gm = nvGroupMap(p, store);
    list = list.filter(t => gm[t.id] === S.route.filter);
  }
  return list;
}
function nvMininavHTML(rows){
  const list = nvQueue();
  let i = -1;
  for(let n = 0; n < list.length; n++) if(list[n].id === S.route.ctx) i = n;
  const cur = i >= 0 ? list[i] : null;
  /* No cursor yet is not position zero. Until somebody steps into the queue the
     control says how big it is, not where in it you are. */
  const pos = list.length
    ? (i >= 0 ? (i + 1) + ' / ' + list.length : list.length + ' ' + tx(NV_COPY.inQueue))
    : tx(NV_COPY.queueEmpty);
  const dis = list.length ? '' : ' disabled';
  const step =
    '<div class="nv-step" role="group" aria-label="' + esc(tx(NV_COPY.item)) + '">' +
    '<button data-nvstep="-1" aria-label="' + esc(tx(NV_COPY.prev)) + '"' + dis + '>' +
      nvIcon('back', 16) + esc(tx(NV_COPY.prev)) + '</button>' +
    '<span class="nv-pos">' + esc(pos) + '</span>' +
    '<button data-nvstep="1" aria-label="' + esc(tx(NV_COPY.next)) + '"' + dis + '>' +
      esc(tx(NV_COPY.next)) + nvIcon('fwd', 16) + '</button></div>';
  const now = cur ? '<span class="nv-cur">' + esc(tx(cur.title)) + '</span>' : '';
  return nvCrumb(rows) + now + '<span class="nv-grow"></span>' + nvCtxHTML() + step;
}

const NV_MEGA_FALLBACK =
  '<div id="meganav" role="dialog" aria-modal="true" hidden><div class="nv-mega-in">' +
  '<div class="nv-mega-head"><div><div class="nv-mega-ttl" data-nv="ttl"></div>' +

function nvMegaMount(){
