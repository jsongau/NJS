nge.","把人擺成復甦姿勢，觀察有沒有變化。"],["Wait for the manager on duty to arrive and take charge.","等值班主管到場接手指揮。"]],"a":1,"x":["Compressions start immediately, and tasks are assigned by name, because an instruction to the group is an instruction to nobody. One named person brings the AED, one named person calls 911, stays on the line and meets the medics. Do not move an unresponsive person for the sake of privacy, and do not wait for a manager to authorise care.","立刻開始胸外按壓，並且指名分派任務，因為對著一群人下指令等於沒有下指令。指定一人去拿 AED，指定一人打 911、保持通話並到入口接引救護人員。不要為了避開顧客視線而搬動失去反應的傷病者，也不要等主管到場才開始施救。"]},{"q":["The pre drill check of the AED shows the electrode pads expired last month. The status light is green.","演練前檢查 AED，發現電極貼片上個月已過期，狀態指示燈仍是綠燈。"],"o":[["Run the drill with the expired pads and order replacements afterward.","先用過期的電擊貼片做演練，事後再訂新的。"],["Ignore the pad date, the status light is what matters.","不用管貼片效期，看狀態指示燈就好。"],["Cancel the drill until a vendor can visit.","先取消演練，等廠商能來再說。"],["Replace the pads before the drill, log the pad and battery check on the DRL-203 record, and treat the drill as incomplete until that check is logged.","演練前先換上新的電擊貼片，把貼片和電池的檢查登錄在 DRL-203 記錄上，在完成登錄之前，這場演練都算未完成。"]],"a":3,"x":["The pad and battery check is the verification artifact for this drill, so an unlogged check is an unfinished drill. Expired pads are a device you cannot rely on in the one minute that decides the outcome. California Health and Safety Code 1797.196 addresses AED maintenance for facilities that have one. VERIFY the current text and the manufacturer schedule with counsel before stating any interval as fact.","貼片與電池檢查是本項演練的查核佐證，沒有登錄檢查，就等於演練未完成。過期的貼片，會讓你在最關鍵的那一分鐘無法信任這台機器。加州健康與安全法 1797.196 有關於設置 AED 場所的維護規定。任何期限都須先向法務確認條文現況與原廠保養週期，不得逕行認定。VERIFY"]},{"q":["The AED finishes analysing and announces no shock advised.","AED 分析完畢，語音提示「不建議電擊」。"],"o":[["Move the pads and analyse again in a different position.","把貼片換個位置再分析一次。"],["Assume the person is stable now and wait.","假設傷病患現在已經穩定，先等一下。"],["Switch the unit off and take the pads off, it found nothing.","把機器關掉、貼片撕下來，反正它沒偵測到什麼。"],["Leave the pads on, follow the voice prompts, resume compressions immediately, and let the device reanalyse on its own schedule until medics take over.","貼片繼續貼著，依照語音提示操作，立刻恢復壓胸，讓機器按自己的時間再次分析，直到救護人員接手。"]],"a":3,"x":["No shock advised does not mean no emergency. The device only keeps monitoring while the pads stay on, and compressions are what circulates blood between analyses. Keep going until EMS physically takes over, or until the person moves and breathes normally. Repositioning pads on your own initiative wastes the seconds that matter.","「不建議電擊」不等於「沒有緊急狀況」。只有貼片持續貼著，機器才會繼續監測；而在兩次分析之間，維持血液循環的是胸外按壓。請持續施救，直到救護人員接手，或傷病者出現動作並恢復正常呼吸為止。自行重貼電極只會浪費最關鍵的那幾秒。"]},{"q":["During the drill the crew realises nobody was assigned to meet the ambulance. What belongs in the drill plan?","演練過程中，同仁發現沒有人被指派去接引救護車。演練計畫裡應該要有什麼？"],"o":[["Send everybody outside to wave the ambulance down.","叫大家都到外面攔救護車。"],["A named greeter at the entrance, a named person to clear the aisle and hold the path open, and the store address with the nearest cross street ready to read to the dispatcher.","指定一個人在門口接應，指定一個人淨空走道並把通路保持暢通，另外準備好門市地址和最近的路口名稱，可以直接念給勤務中心聽。"],["Call 911 a second time to ask where the ambulance is.","再打一次 911 問救護車到哪裡了。"],["Nothing, the medics can find a supermarket.","不用準備，救護人員自己找得到超市。"]],"a":1,"x":["Minutes disappear at the door of a large store with several entrances and a full parking lot. Name a greeter, name a path clearer, and keep the address and cross street next to the phone. Everyone else stays with the patient or keeps customers back. Write those two names into the drill plan, not into somebody memory.","大型門市有多個出入口與滿場的停車場，時間就是在門口被耗掉的。指名一位接引人員、指名一位清出通道的人員，並把地址與最近的路口名稱放在電話旁邊。其餘同仁留在傷病者身邊或負責疏導顧客。這兩個名字要寫進演練計畫，而不是靠誰記得。"]},{"q":["The drill shows it took four minutes to reach the AED because the cabinet is inside a locked office.","演練結果顯示，取得 AED 花了四分鐘，因為機櫃放在上鎖的辦公室裡。"],"o":[["A corrective action to relocate the AED to an unlocked, signed and publicly reachable position, with a named owner and a due date, to be verified at the next drill.","開立改善措施，把 AED 移到不上鎖、有標示而且大家都拿得到的位置，寫明負責人和完成期限，並在下次演練時查驗。"],["A note in the debrief that staff should move faster next time.","在檢討會註記下次動作要再快一點。"],["A note that the drill passed because the AED was used in the end.","註記演練通過，因為最後還是用到了 AED。"],["A reminder that supervisors carry the office key.","提醒大家主管身上有辦公室鑰匙。"]],"a":0,"x":["Do not train around a defect you can remove. If the device is locked away, the fix is the location, not the footspeed of whoever holds the key. Write the corrective action with an owner and a date, mount the cabinet where any employee or bystander can reach it, and confirm at the next drill that it is still there.","能夠直接排除的缺陷，就不要用訓練去繞過它。機器被鎖起來，該改的是擺放位置，而不是拿鑰匙的人跑多快。把改善措施連同負責人與期限寫進紀錄，將機櫃裝設在任何同仁或民眾都能取用的位置，並在下次演練時確認它還在原處。"]}],"DRL-204":[{"q":["A receiver reports a sharp chemical smell and stinging eyes near the compressor room door.","收貨人員回報，在壓縮機房門口附近聞到刺鼻化學氣味，眼睛也感到刺痛。"],"o":[["Prop the doors open to ventilate the room, then look for the leak.","把門撐開通風，然後進去找漏點。"],["Wait to see whether the smell gets stronger before doing anything.","先看看味道會不會變濃，再決定要不要處理。"],["Nobody enters. Evacuate away from the odour along the designated route, keep everyone clear of the area, and call 911 and the refrigeration contractor from outside.","任何人都不准進去。沿著指定路線往遠離氣味的方向撤離，讓所有人遠離該區域，並在戶外撥打 911 和通知冷凍設備廠商。"],["Send someone in with a cloth over their face to close the valve.","派人用布摀住口鼻進去關閥門。"]],"a":2,"x":["You cannot judge concentration by smell, and the point where an odour becomes unbearable is already past the point where it is unsafe. Store staff evacuate, isolate the area and call from outside. Trained and equipped responders handle entry and isolation. Confirm the route to the outdoor assembly point on every drill, because that is the verification artifact for DRL-204.","氣味無法用來判斷濃度，而且當味道濃到讓人受不了時，濃度早就已經超過安全範圍。門市同仁的任務是撤離、封鎖區域，並在戶外撥打電話。進入與關斷由受過訓練、配備齊全的專責人員處理。每次演練都要確認前往戶外集合點的路線，因為那正是 DRL-204 的查核佐證。"]},{"q":["The designated evacuation route for a refrigerant release runs past the loading dock, which today is directly downwind of the compressor room.","冷媒外洩的指定撤離路線會經過卸貨區，而今天卸貨區正好位於壓縮機房的下風處。"],"o":[["Use the posted route, it is the approved one.","走公告的路線，那是核准過的。"],["Move to the alternate assembly point that is upwind and, where possible, uphill of the release, and record on the drill record which route was used and which alternate exists.","改到位於洩漏點上風處、而且盡量地勢較高的備用集合點，並在演練記錄上寫明這次走的是哪條路線、備用路線又是哪一條。"],["Wait indoors until the wind changes.","待在室內，等風向改變。"],["Split the group and send half along each route.","把人分成兩半，兩條路線各走一半。"]],"a":1,"x":["A posted route is a default, not a rule that outranks the air. Go upwind and, where the site allows, uphill, and keep the group together so that the count at the far end is still valid. DRL-204 closes on a confirmed evacuation route, so write down the route actually used and the alternate you would use in the other wind.","公告的路線只是預設值，不能凌駕於當下的風向之上。往上風處走，地形允許時往高處走，並讓隊伍保持在一起，這樣到達集合點後的清點才有效。DRL-204 以「確認撤離路線」結案，因此要寫下當天實際使用的路線，以及風向相反時的備用路線。"]},{"q":["A night manager who used to work in HVAC offers to go in and isolate the system to save the product in the cases.","一位曾從事空調冷凍工作的夜班主管主動表示要進去關斷系統，以搶救冷藏櫃裡的商品。"],"o":[["Approve it as long as a second employee waits at the doorway.","可以，只要有第二位員工在門口等著。"],["Approve it, the experience makes it reasonable and the product loss is real.","可以，他有經驗，而且商品損失是真的。"],["Approve it as long as the manager holds their breath going in.","可以，只要主管進去時憋住呼吸。"],["Decline. No store employee enters an area with an unknown airborne concentration, whatever their background. Staff evacuate and account for people while trained responders handle entry.","不可以。不論資歷背景如何，門市員工都不得進入空氣中濃度不明的區域。員工負責撤離和清點人數，進入現場交給受過訓練的應變人員。"]],"a":3,"x":["Prior trade experience is not current training, a fit tested respirator or a gas monitor. Product loss is an insurable cost and the responders decide when entry is safe. Process safety rules such as 8 CCR 5189 may apply depending on the refrigerant and the quantity held onsite. VERIFY applicability store by store with counsel rather than assuming it.","過去的技術背景，不等於現行訓練、密合度測試合格的呼吸防護具或氣體偵測器。商品損失屬於可投保的成本，何時可以進入由專責應變人員判斷。依冷媒種類與現場存量不同，8 CCR 5189 等製程安全規定可能適用。請逐店由法務確認適用範圍，不要自行推定。VERIFY"]},{"q":["At the outdoor assembly point the count is one short. The missing receiver was last seen at the dock about five minutes ago.","在戶外集合點清點時少了一人。這位收貨同仁大約五分鐘前最後一次出現在卸貨區。"],"o":[["Give the name, the last known location and the time to the fire department incident commander on arrival, and keep everyone out of the building.","消防隊到場時，把姓名、最後出現的位置和時間告訴現場指揮官，並讓所有人都待在建築物外面。"],["Call the phone and wait to see if they answer before telling anyone.","先打他的手機看他會不會接，接不到再告訴別人。"],["Have every department search its own area a second time.","叫各部門把自己的區域再搜一次。"],["Send two employees back to the dock to look.","派兩位員工回卸貨區找人。"]],"a":0,"x":["A missing person in a possible release is a rescue for equipped responders, not for coworkers. The most useful thing the store can hand over is a name, a last known location and a time. Keep the group intact so the count stays valid, and keep calling the phone while you wait, from outside the building.","在可能有洩漏的情況下失去聯繫的人員，屬於專責人員的救援任務，不是同事該去做的事。門市能提供最有價值的東西，就是姓名、最後出現位置與時間。請讓隊伍維持完整，清點才有效，同時在建築物外持續撥打對方電話。"]},{"q":["After the drill, a deli clerk who was on a rest break in the break room says they never heard the announcement.","演練結束後，一位在員工休息室休息的熟食部同仁表示，他完全沒聽到廣播。"],"o":[["Do nothing, one person is inside the margin.","不用處理，少一個人還在容許範圍內。"],["Record the clerk as noncompliant and start a discipline record.","把該店員記為未遵守規定，並開立懲處記錄。"],["Keep the store completion, log a documented makeup briefing for that clerk, and open a corrective action on the announcement not being audible in the break room, with a named owner and a due date.","門市維持完成，替該店員登錄一場有書面記錄的補訓說明，並針對休息室聽不到廣播開立改善措施，寫明負責人和完成期限。"],["Rerun the whole drill for everybody.","全店所有人重做一次演練。"]],"a":2,"x":["Two separate things happened here. One person missed the drill, which is handled with a short documented briefing before their next shift. The store also found a genuine defect in its alarm coverage, which is worth more than the drill itself. Fix the audibility, then confirm at the next drill that the break room hears it.","這裡其實發生了兩件事。一是有人沒參與演練，用下次上班前一次有紀錄的補充說明處理即可。二是門市發現廣播覆蓋確實有缺口，這個發現比演練本身更有價值。先把可聽度修好，下次演練時再確認休息室聽得到。"]}],"DRL-210":[{"q":["A person at the register demands the cash in the drawer and keeps one hand inside a jacket pocket. Nothing is visible.","一名男子在收銀檯要求交出抽屜裡的現金，一隻手始終插在外套口袋裡，沒有露出任何東西。"],"o":[["Reach under the counter for the alarm while keeping eye contact.","一邊維持眼神接觸，一邊伸手到櫃台下按警報。"],["Refuse until you actually see a weapon.","在真的看到武器之前先拒絕。"],["Stall and keep the person talking until somebody else notices.","拖延時間，一直跟對方講話，等別人發現。"],["Comply immediately and calmly, treat the demand as genuine and any implied weapon as real, keep your hands visible, and say what you are about to do before you do it.","立刻冷靜配合，把對方的要求當真，把暗示的武器當成真的，雙手保持在對方看得見的地方，每個動作做之前先說出來。"]],"a":3,"x":["The demand is the threat, whether or not anything is shown. Slow, narrated, visible movements are what keep an encounter from escalating. Cash and merchandise are replaceable and insured, and you are not. Use an alarm only if you can do it unseen, and never make a sudden movement toward a pocket, a phone or a button.","只要對方提出要求，威脅就已經成立，無論有沒有亮出東西。動作放慢、先說再做、雙手保持可見，才是避免情勢升高的關鍵。現金與商品可以補回，也有保險，人不行。除非確定不會被看見，否則不要去按警報，更不要突然把手伸向口袋、手機或按鈕。"]},{"q":["Someone takes the till and runs out the front door. A supervisor starts after them and calls for you to follow.","有人拿走收銀抽屜後從前門跑出去。一位主管開始追出去，並叫你跟上。"],"o":[["Say out loud that policy prohibits pursuit, ask the supervisor to come back inside, then start writing down what you observed.","大聲說出公司規定禁止追出去，請主管回到店內，然後開始把你看到的內容寫下來。"],["Follow at a distance and try to get a plate number.","保持距離跟過去，設法記下車牌號碼。"],["Follow, the supervisor is in charge of the floor.","跟上去，賣場現場是主管在負責。"],["Stay inside and mention it to the district manager next week.","留在店裡，下週再跟區經理提一下。"]],"a":0,"x":["The pursuit rule binds every level, supervisors included. A supervisor who chases teaches the team that chasing is expected, which puts every one of those people at risk in every future incident. Saying it out loud in the moment is part of the job, and the incident goes into the record the same day, not next week.","禁止追趕的規定適用於所有層級，主管也不例外。主管一旦追出去，等於告訴團隊追趕是被期待的行為，會讓每一位同仁在未來每次事件中承擔風險。當下把這句話講出來，本身就是職責的一部分；事件也要當天就登錄，不是等到下週。"]},{"q":["A person is pushing a full cart of high value liquor straight toward the exit, and you are the closest employee to the door.","一名男子推著滿滿一車高價酒類直直往出口走，而你是離門口最近的同仁。"],"o":[["Take hold of the cart handle and keep hold of it.","抓住推車把手不放。"],["Step aside and let them pass, do not touch the person or the cart, and note whatever you can observe safely so you can write it down afterward.","讓到旁邊讓對方過去，不要碰對方也不要碰推車，在安全的前提下盡量記住看到的特徵，事後再寫下來。"],["Step in front of the cart and block the doorway until help arrives.","站到推車前面擋住門口，等支援到場。"],["Follow them into the parking lot to get a plate number.","跟到停車場去記車牌號碼。"]],"a":1,"x":["Blocking, grabbing and following are the three instincts this training exists to override. A theft turns into an assault the moment somebody feels cornered. Let it go, keep your distance, and put your attention on details you can record from inside the building, direction of travel, clothing, build and vehicle. Merchandise is insured.","擋、抓、追，正是這套訓練要壓下去的三個本能反應。只要對方覺得被逼到角落，竊盜就會瞬間變成傷害事件。放手、保持距離，把注意力放在你能在店內安全記下的細節上，例如逃逸方向、衣著、體型與車輛。商品有保險。"]},{"q":["The person has left. Three employees start comparing what they saw while the store waits for police.","對方已經離開。等待警方到場期間，三位同仁開始互相對照各自看到的情況。"],"o":[["Let them, one consistent story is more credible.","讓他們互相對說法，版本一致比較有可信度。"],["Leave it to the police to sort the accounts out when they arrive.","等警察到場再由他們去釐清各人的說法。"],["Separate them and have each write their own account before any discussion, then lock the doors, let nobody in or out, and leave surfaces and items untouched until police release the scene.","把他們分開，在互相討論之前各自寫下自己的說法，接著鎖上門，不讓任何人進出，並在警方解除現場之前，不要碰觸任何檯面和物品。"],["Have the most senior employee write one account on behalf of the group.","由最資深的員工代表大家寫一份說法。"]],"a":2,"x":["Memory blends fast in a group, and one blended story is worth less than three imperfect independent ones. Take individual written accounts first, then preserve the scene, no cleaning and no touching anything the person handled. Post nothing anywhere, and route every media question to the corporate contact.","記憶在群體討論中會很快互相污染，一份「說法一致」的紀錄，價值遠低於三份各自獨立、也許不完美的陳述。先請每個人分開寫下自己所見，再保全現場，不清理、不觸碰對方碰過的物品與表面。不要在任何平台發文，媒體詢問一律轉給總部窗口。"]},{"q":["The cashier who was at the register is visibly shaking. The manager on duty wants them back on a lane once police leave.","當時在收銀檯的收銀員明顯還在發抖。值班主管希望警方離開後，讓他回到收銀線上。"],"o":[["Relieve them, give them a private space and the employee assistance contact, do not ask them to retell the event for coworkers, and complete the store debrief covering what happened, who was present, what worked and what changes.","讓他先下場休息，安排一個不受打擾的空間，提供員工協助方案的聯絡方式，不要要求他為了同事再講一次經過，另外完成門市檢討，內容包括發生了什麼、當時有誰在場、哪些做法有效、要調整哪些地方。"],["Put them back on a lane, staying busy helps people move on.","讓他回收銀線上，忙起來比較容易走出來。"],["Have them tell the whole team what happened so everybody learns from it.","請他跟全體同仁講一遍經過，讓大家都學到東西。"],["Send them home immediately without pay and follow up in a few days.","立刻讓他無薪回家，過幾天再追蹤。"]],"a":0,"x":["People who are supported after an incident come back to work, and people who are not, leave. Relieve the person, offer a quiet room and the assistance line, and never turn their account into a team meeting. The written debrief is what converts one bad hour into a change other stores can use. VERIFY any filing window or reporting deadline with counsel before stating it as a rule.","事件之後有被好好照顧的人會留下來，沒有被照顧的人會離職。請讓當事人下線休息，提供安靜的空間與員工協助方案的聯絡方式，也絕對不要把他的經歷變成團隊會議的題材。書面檢討才是讓這一小時的傷害，轉化成其他門市可用的改善。任何提交時限或通報期限，都須先向法務確認後才可視為規定。VERIFY"]}],"DRL-211":[{"q":["New hires ask why the sequence is Run, then Hide, then Fight, and not some other order.","新進同仁詢問，為什麼順序是先逃跑、再躲藏、最後才反擊，而不是別的排法。"],"o":[["It is the order the three words are easiest to remember in.","這只是三個字最好記的排列順序。"],["It is a checklist, you complete each step in turn before you are allowed to move to the next one.","這是一份檢查表，每一步都要依序做完，才可以進到下一步。"],["It is a personal preference, take whichever of the three suits you.","這是個人偏好，三個當中挑一個適合自己的就好。"],["It is ordered by survivability. Distance and an exit first, then barriers and silence if you cannot get out, and physical resistance only as a last resort when your life is in immediate danger.","這是依照存活機率排的。優先拉開距離、找到出口離開；出不去才靠阻隔和保持安靜；只有在生命立即受到威脅時，才把肢體反抗當成最後手段。"]],"a":3,"x":["Each step is a worse position than the one before it, so you take the best option available from where you are standing. Nobody has to work through Run and Hide before fighting, and nobody should fight while a clear exit exists. Teach it as a decision made in seconds from your own location, not as a sequence to complete.","每往後一步，處境就比前一步更差，所以要在你所在的位置選出當下最好的選項。沒有人需要先跑過、躲過才可以反擊，也沒有人該在還有明確出口時選擇反擊。要把它教成「在幾秒內依所在位置做出的判斷」，而不是一套必須依序走完的流程。"]},{"q":["You are in receiving. There is a report of a threat at the front of the store and an exterior door is about twenty feet from you.","你人在收貨區。有人回報店面前方出現威脅，而距離你大約六公尺處就有一道通往戶外的門。"],"o":[["Hide behind the pallets and stay quiet.","躲在棧板後面保持安靜。"],["Leave everything behind, go out the door, keep moving away from the building, and call 911 once you are at a safe distance.","東西全部丟下，從那道門出去，持續往遠離建築物的方向移動，到安全距離後再打 911。"],["Lock yourself in the receiving office and wait.","把自己鎖在收貨辦公室裡等待。"],["Find your team first so that everybody leaves together.","先找到自己的組員，大家一起離開。"]],"a":1,"x":["When there is a clear route away from the threat, take it and take it now. Leave bags, keys and product where they are. Do not gather people, tell whoever is beside you to come and keep moving, because an evacuation that waits for a headcount becomes a group that is still inside. Call from a safe place, not while you are running.","只要有一條明確遠離威脅的路線，就立刻走。包包、鑰匙、商品全部留在原地。不要回頭集合眾人，叫身邊的人跟上就繼續走，因為一場「等大家到齊」的撤離，最後就是一群人還留在裡面。到安全距離之後再打 911，不要邊跑邊打。"]},{"q":["There is no route out of the back office. You are in there with two coworkers and one customer.","後場辦公室沒有其他出路。裡面有你、兩位同事和一位顧客。"],"o":[["Keep calling out into the hallway so that others can join you.","持續朝走廊喊話，讓其他人可以過來會合。"],["Move out through the sales floor toward the front to reach an exit.","穿過賣場往前面移動，設法走到出口。"],["Lock and barricade the door, turn the lights off, silence phones completely, stay low, get out of the line of the door, and stay quiet until law enforcement makes contact.","把門鎖上並用東西堵住，關掉燈，手機完全靜音，身體壓低，避開門的正對面，保持安靜直到執法人員前來接觸。"],["Hold the door handle and open it now and then to check the hallway.","抓住門把，不時開一下門查看走廊。"]],"a":2,"x":["A locked, barricaded, dark and silent room is a room that gets passed by. Silence the phone itself, not just the ringer, and get out of the line of the door rather than standing behind it. Stay put and stay quiet until officers make contact, because a voice in a hallway is information given away for free.","一間上鎖、堵住、關燈且安靜的房間，往往就會被跳過。手機要整支靜音，不是只關鈴聲；人要離開門的正對面，而不是貼著門站。保持不動、保持安靜，直到執法人員主動接觸為止，因為在走廊喊出聲，等於白白把位置送出去。"]},{"q":["Officers come through the entrance with weapons up, moving fast, and pass an injured person without stopping.","執法人員持槍快速從入口進入，經過一位傷者時並未停下。"],"o":[["Take hold of an officer and lead them to the injured person.","拉住員警，帶他去傷者那裡。"],["Run toward them so that they can escort you out.","朝他們跑過去，讓他們護送你出去。"],["Show empty hands, keep them visible, stay calm, follow commands exactly, avoid pointing or grabbing at anyone, and move in the direction they indicate.","張開空著的雙手並保持在看得見的地方，保持冷靜，完全依照指令行動，不要用手指人或抓住任何人，並往他們指示的方向移動。"],["Start recording video so that there is evidence.","開始錄影，這樣才有證據。"]],"a":2,"x":["The first officers in are looking for the threat, and treatment teams follow behind them. Empty, visible hands and exact compliance are what keep you from being mistaken for the problem. Give information verbally when you are asked, keep the phone down, and move where you are told, even if it is away from where you want to go.","第一批進入的執法人員任務是找出威脅，醫療團隊會跟在後面進來。雙手空著、保持可見、完全依指令行動，才不會被誤認為威脅本身。被詢問時用口頭回答，手機收起來，並依指示的方向移動，即使那不是你想走的方向。"]},{"q":["A manager wants to run an unannounced simulation with an employee playing the role of an attacker, so that staff react realistically.","一位店長想辦一場不預告的模擬，由同仁扮演攻擊者，好讓大家做出真實反應。"],"o":[["Skip the drill and send the policy out by email instead.","不要辦演練，改用電子郵件把規定發給大家。"],["Do not simulate an attacker. Announce it as a drill, then walk the decision points, exit routes, lockable rooms, phone silencing and reunification, and record the law enforcement liaison contact on the drill record.","不要模擬歹徒。先廣播這是演練，接著帶大家走過各個判斷時機、逃生路線、可上鎖的房間、手機靜音和事後集合會合的做法，並把警方聯絡窗口記在演練記錄上。"],["Approve it, but only after closing with no customers in the building.","可以核准，但只能在打烊後、店內沒有顧客時進行。"],["Approve it, surprise is the only way to test a real reaction.","可以核准，只有突襲才測得出真實反應。"]],"a":1,"x":["Simulated attacker exercises injure people and traumatise staff, and they teach fear rather than decisions. A drill that is talked through and walked through produces the same decisions with none of the harm. DRL-211 closes with the law enforcement liaison noted, so invite your local agency to look at the routes and record who you spoke with.","安排扮演攻擊者的模擬演練會造成人員受傷與心理創傷，教出來的是恐懼，不是判斷力。用口頭講解加上實地走一次的方式，能得到一樣的判斷結果，卻不會造成任何傷害。DRL-211 以「記錄執法聯繫窗口」結案，因此請邀請當地警方協助檢視動線，並記下聯繫對象。"]}],"DRL-212":[{"q":["A parent at the service counter says their child has been missing for a few minutes.","一位家長在服務檯表示，孩子已經找不到好幾分鐘了。"],"o":[["Page Code Adam straight away with the child name so that everybody starts looking.","立刻廣播 Code Adam 並報出孩子的名字，讓大家馬上開始找。"],["Walk the parent around the store to look before involving anybody else.","先陪家長在店裡繞一圈找，再決定要不要通知其他人。"],["Take the parent to the office and call police before telling the floor.","先帶家長到辦公室報警，之後再通知賣場同仁。"],["Take a description first, age, height, hair, complete clothing including shoe colour, and where and when the child was last seen, then page Code Adam with that description.","先取得特徵描述，包括年齡、身高、頭髮、完整的衣著和鞋子顏色，以及最後看到孩子的地點和時間，再用這些描述廣播 Code Adam。"]],"a":3,"x":["A page without a description sends forty people to look for nothing. The thirty seconds spent getting clothing, shoe colour and the last known aisle is what makes the search work. Broadcast the description, never the child name, because a name spoken over a public address system can be used by a stranger to call that child.","沒有特徵描述的廣播，等於讓四十個人去找一個不存在的目標。花三十秒問清楚衣著、鞋子顏色與最後出現的走道，搜尋才會有效。廣播時只播特徵，絕對不要播孩子的名字，因為在公共廣播中說出的名字，可能被陌生人用來呼喚那個孩子。"]},{"q":["The Code Adam page goes out. What happens at the exits?","Code Adam 廣播已經發出。各出口該怎麼做？"],"o":[["Assigned staff cover every exit, including receiving and emergency doors, watch everyone who leaves, and stay at their post until the all clear.","指派的同仁守住每一個出入口，包括進貨門和逃生門，看清楚每個離開的人，沒有聽到解除通知就不能離開崗位。"],["Everyone available goes to the place the child was last seen.","所有有空的人都趕到最後看到小孩的地方。"],["Put one person on the main entrance, which is where anybody would leave.","只派一個人顧大門就好，大家都是從那裡出去的。"],["Lock every exit so that nobody can leave the building.","把所有出入口鎖起來，讓任何人都出不去。"]],"a":0,"x":["Door coverage is the part of Code Adam that actually protects the child. Cover every exit, including the ones customers never use, and hold those posts until the all clear, even after somebody reports a sighting. Never chain or lock exits, that is a fire code violation and it traps everyone inside. The confirmed door coverage assignment is the verification artifact for DRL-212.","守住出口，才是 Code Adam 真正保護孩子的部分。每一個出口都要有人，包含顧客平常不會使用的收貨門與緊急出口；即使有人回報看到孩子，也要守到宣布解除為止。絕對不可以上鎖或加鏈條封住出口，那違反消防法規，也會把所有人困在裡面。確認出口人員派工，就是 DRL-212 的查核佐證。"]},{"q":["Fifteen employees are on the floor when the page goes out. How is the search organised?","廣播發出時，賣場上有十五位同仁。搜尋要怎麼分工？"],"o":[["Hold everyone at the front until police arrive to run the search.","把所有人集中在前區，等警察到了再開始搜尋。"],["Each department sweeps its assigned zone from the drill map, including restrooms, back rooms, coolers and any space a small child can fit into, and reports the zone clear to one coordinator.","各部門依照演練圖搜自己負責的區域，包括廁所、後場、冷藏庫，還有小孩鑽得進去的任何空間，搜完就向同一位統籌人員回報該區清查完畢。"],["Everyone converges on the aisle where the child was last seen.","所有人都集中到最後看到小孩的那條走道。"],["Ask customers to spread out and help with the search.","請顧客分頭幫忙一起找。"]],"a":1,"x":["A crowd in one aisle leaves the rest of the store unwatched. Zones from a map, restrooms and back rooms included, with one coordinator tracking which zones have been reported clear, is what stops the same shelf being checked six times while nobody checks the cooler. Children hide in low, enclosed spaces, so search low as well as at eye level.","所有人擠在同一條走道，等於整間店其他地方都沒人看。依照演練地圖分區搜尋，含廁所與後場，並由一位統籌人員記錄哪些區域已回報清查完畢，才不會同一排貨架被查六次、冷藏庫卻沒人進去。孩子常躲在低矮、封閉的空間，所以要蹲下來找，不能只看視線高度。"]},{"q":["The search has run for ten minutes with no sighting, and a door watcher reports that somebody left with a child who may match the description.","搜尋已進行十分鐘仍未發現，同時守門同仁回報，有人帶著一名特徵可能相符的孩子離開了。"],"o":[["Call 911 immediately on any sign that the child left the building or left with somebody, and call at the time limit set in the store procedure even without a sighting, with no employee needing approval to make the call.","只要有跡象顯示小孩離開了賣場或是跟人走了，立刻打 911，就算沒人看到，到了店內規定的時限也要打，任何同仁都不需要先請示就可以打這通電話。"],["Call only if the parent asks for the police.","只有家長要求報警的時候才打。"],["Wait thirty minutes before calling, most children turn up.","先等三十分鐘再打，大部分的小孩都會自己出現。"],["Keep searching internally, calling police early makes the store look bad.","繼續在店內找就好，太早報警會讓店裡不好看。"]],"a":0,"x":["Any indication that the child left the building or left with somebody is an immediate 911 call, and no employee needs permission to place it. Absent that, call at the interval written in the store procedure. VERIFY that interval with counsel and with your local agency before publishing it, and treat it as store policy rather than as a stated legal deadline.","只要出現孩子已離開建築物或被人帶走的跡象，就要立刻撥打 911，任何同仁都不需要先請示。若沒有這類跡象，則依門市程序訂定的時限撥打。該時限在公告前須先經法務與當地警方確認，並且應視為門市政策，而不是既定的法定期限。VERIFY"]},{"q":["The child is found in a back aisle, unharmed.","孩子在後方走道被找到，平安無事。"],"o":[["Page the parent name over the intercom so that they can come and collect the child.","用廣播叫家長的名字，請他們來把小孩帶走。"],["Cancel the page and get everyone back to work, the child is safe.","取消廣播，大家回去工作，小孩已經沒事了。"],["Reunite the child only with the person who made the report, after confirming, then give the all clear that releases the doors, and complete the debrief covering time to page, door coverage gaps and zone gaps.","確認之後，只能把小孩交還給通報的那個人，接著發布解除通知讓出入口人員撤哨，最後完成檢討，內容要涵蓋多久才廣播、出入口有沒有漏守、分區有沒有漏搜。"],["Walk the child to the front and hand them to the first adult who says they are the parent.","把小孩帶到前區，交給第一個說自己是家長的大人。"]],"a":2,"x":["The last minute is the one where a store can hand a child to the wrong adult. Confirm before you reunite, then give one clear all clear so that door watchers know they can leave their posts. The debrief records time to page, which doors went uncovered and which zones nobody swept, each with a named owner and a due date to be checked at the next drill.","最後這一分鐘，正是門市最有可能把孩子交給錯的人的時刻。先確認身分再交還，接著明確宣布解除，讓守門同仁知道可以撤哨。檢討紀錄要寫下從通報到廣播花了多久、哪些出口沒有人守、哪些區域沒有人清查，並逐項指定負責人與完成期限，於下次演練查核。"]}],"LDR-501":[{"q":["You are filling two deli clerk openings and you have five candidates. The third one is warm and easy to talk to, the conversation runs long, and you skip your last two questions because you already feel good about her. What is the problem with that?","你要補兩個熟食部的職缺，手上有五位應徵者。第三位談吐親切、聊得很順，時間拉長了，你因為對她印象已經很好，就跳過了最後兩題。這樣做的問題在哪裡？"],"o":[["Nothing, because an experienced interviewer can tell early, the remaining two questions would not have changed the outcome, and stretching an interview out after the decision is obvious wastes her time and yours","沒有問題，因為有經驗的面試官很早就看得出來，剩下兩題也不會改變結果，決定已經明確還把面試拖長，只是浪費她和你的時間"],["Skipping questions means she was measured on a shorter list than the other four, so the candidates can no longer be compared and the rapport you felt is doing work the evidence should be doing","跳過題目代表她被評量的題數比其他四位少，這些人選之間已經無法比較，而你感受到的投緣，正在取代應該由證據說話的部分"],["Nothing, provided you ask the skipped questions of the other candidates as well","沒有問題，只要跳過的題目對其他人選也一樣不問"],["The only problem is that the interview ran long and put the schedule behind","唯一的問題是面試拖太久，讓後面的行程延後"]],"a":1,"x":["A structured interview is worth something only because every candidate answers the same questions in the same order and is scored on the same criteria. Drop two questions for one person and you have two different instruments and no basis for comparison, and the gap gets filled by how the conversation felt. Keep the question set fixed, take the notes as you go, and if a question turns out to be useless then remove it from the set for everyone before the next interview, not during one.","結構化面談之所以有價值，唯一的原因是每一位應徵者都用相同順序回答相同的問題，並依相同標準評分。對其中一個人少問兩題，你手上就變成兩套不同的工具，彼此無法比較，而那個空缺會被「聊起來的感覺」填滿。請固定題組，邊談邊記錄；如果某一題確實沒有用，那就在下一場面談之前把它從題組中拿掉，對所有人一致，而不是在面談進行到一半時臨時跳過。"]},{"q":["Your produce lead of nine years has retired. In the debrief a panel member says the strongest candidate on paper is not right because he is nothing like the person who just left, who knew every regular customer by name. How should you handle that?","做了九年的蔬果部組長退休了。在面談後的討論中，一位面談官說，紙面上最強的那位應徵者不合適，因為他和剛離開的那位完全不像，那位老組長連每個常客的名字都記得。你應該怎麼處理？"],"o":[["Accept the judgement, because the panel member worked alongside the previous lead for years and knows better than anyone what the department actually needs from the person who replaces him","接受這個判斷，因為這位面試委員和前任組長共事多年，最清楚部門需要接任的人具備什麼條件"],["Bring it back to the posted requirements and the scored criteria, and ask which specific requirement the candidate falls short on and what in the interview shows it","回到職缺公告的條件和評分標準，請他說明人選具體不符合哪一項要求，以及面試中哪些內容顯示了這一點"],["Score the candidate down slightly for customer rapport and keep him in the running","在顧客互動這一項稍微扣分，但讓他繼續留在候選名單"],["Restart the process with a job description written to describe the previous lead","重新啟動流程，把職務說明改寫成前任組長的樣子"]],"a":1,"x":["A predecessor is not a job description. Measuring candidates against the person who left narrows the pool to people who resemble a single individual, and resemblance is a poor predictor and a familiar route to a discrimination claim. If knowing regulars by name genuinely matters, then it belongs in the posted requirements as a customer service standard that every candidate is asked about and scored on. Force the objection back into the criteria. If it cannot be stated as a requirement and evidenced from the interview, it is a preference and it does not carry the decision.","前任者不是職務說明書。用離職的那個人來衡量應徵者，等於把人選範圍縮小成「像某一個人的人」，而相像本身既無法預測工作表現，也是很容易走向歧視爭議的一條路。如果認得常客真的重要，那它就應該寫進公告的任職要求，變成一項顧客服務標準，對每一位應徵者都提問、都評分。請把這個反對意見逼回評分標準上；如果它無法被寫成一項要求，也無法從面談內容中舉證，那它就只是偏好，不能拿來決定結果。"]},{"q":["A candidate for a bakery opener role mentions on her own that she has two young children. The shift starts at 05:00 and you want to be sure she understands that. What should you ask?","一位應徵烘焙部早班的應徵者主動提到，她有兩個年幼的孩子。這個班從清晨五點開始，你想確認她清楚這一點。你應該怎麼問？"],"o":[["Ask how she plans to arrange childcare for a 05:00 start, since she raised the subject herself","既然是她自己提起的，就問她5點上班要怎麼安排小孩的照顧"],["Ask whether she is planning to have more children, so that you can forecast coverage for the department, since a bakery opener slot is difficult to backfill and the department has to plan ahead","問她是不是還打算生小孩，這樣才能預估部門人力，因為烘焙部的開店班很難找人替補，部門必須提早規劃"],["State the actual schedule and ask the same availability question you ask every candidate, which is whether she can work the posted shift, and leave family arrangements out of it","說明實際的班表，然後問每位人選都會問的同一個出勤問題，也就是能不能配合公告的班別，家庭安排就不要碰"],["Note her comment in the file as a coverage risk and move on without asking anything","把她說的話記在資料裡當成人力風險，什麼都不問就繼續往下走"]],"a":2,"x":["The candidate raising a topic does not open it for questioning. Family plans, childcare arrangements, marital status, pregnancy, age, religion, national origin, disability and medical history stay out of the interview as topics, and the fact that she volunteered the information changes nothing except that you should not follow it. What you legitimately need is availability for the posted schedule, so ask that, ask it the same way of everyone, and record the answer. Write down the schedule question, not her family. Send anything you are unsure about to HR before the interview rather than improvising in the room. Authority: FEHA under Gov. Code 12940 and Title VII. VERIFY with HR or counsel, this module is training and not legal advice.","應徵者自己提起某個話題，並不等於那個話題就可以問。生育計畫、托育安排、婚姻狀況、懷孕、年齡、宗教、原國籍、身心障礙與病史，這些主題都不應出現在面談中；她主動說了，唯一改變的是你更不該順著問下去。你真正需要確認的是她能不能配合公告的班表，所以就問這一題，對每個人都用同樣的問法，並記錄答案。要寫進紀錄的是班表這一題，不是她的家庭狀況。任何你不確定的問題，請在面談前就先問人資，不要在現場臨場發揮。法源：加州公平就業與住房法（Gov. Code 12940）與聯邦 Title VII。請向人資或法務查證（VERIFY），本課程是訓練，不構成法律意見。"]},{"q":["You are close to an offer for a meat cutter and you want to pitch the number correctly. A panel member suggests asking what he earned at his last store so the offer lands just above it. The candidate then asks what the range for the role is. What is the right course?","你快要對一位肉品切割師發出錄取通知，想把薪資數字抓準。一位面談官建議先問他上一家店的薪水，再開出略高一點的數字。接著應徵者反過來問這個職位的薪資區間是多少。正確的做法是什麼？"],"o":[["Ask what he earned before, because he can decline to answer if he does not want to say","問他之前領多少，因為他不想說可以不回答"],["Do not ask about prior pay, and provide the pay scale for the position on request, basing the offer on the posted range and the scored interview","不要問前一份工作的薪資，對方要求時提供該職務的薪資級距，依公告範圍和面試評分決定給薪"],["Avoid the subject entirely and let HR handle pay with the candidate after the offer is signed, since compensation is not the hiring manager decision to make and raising it in the room only creates expectations","完全避開這個話題，等錄取通知簽了再讓HR跟人選談薪水，因為薪酬不是用人主管能決定的，在面試現場提起只會讓對方有期待"],["Ask what he is looking for, and if he names a number, ask what he currently earns to check it","問他的期望待遇，如果他說出一個數字，再問他目前領多少來對照"]],"a":1,"x":["Asking about prior compensation is off limits in California, and the fourth option is the same question wearing a coat, so treating a voluntary answer as permission does not help you. What a candidate is asked for and what you may share run in opposite directions here. An employer generally may not seek salary history, and generally must supply the pay scale for the position to an applicant who asks. Anchor the offer on the posted range and the interview scores, which is also the only basis you could defend later. Authority: Labor Code 432.3. VERIFY the current text and the applicant request rule with HR before you rely on it.","在加州，詢問應徵者先前的薪資是不被允許的，而第四個選項只是同一個問題換件衣服；把「他自己願意講」當成可以問的理由，並不能幫到你。這件事上，你可以問的與你應該提供的，方向剛好相反：雇主原則上不得探詢薪資歷史，而在應徵者要求時，原則上應提供該職位的薪資級距。請用公告的薪資區間與面談評分來決定開價，這也是日後唯一站得住腳的依據。法源：Labor Code 432.3。在據以執行之前，請與人資查證（VERIFY）現行條文與應徵者索取薪資級距的規則。"]},{"q":["After four interviews for one grocery clerk opening, the hiring manager writes not a good fit and a bit odd on three of the forms, keeps the winning form, and throws the other three away because the decision is made. What is wrong with this?","一個雜貨部門的職缺面談了四位應徵者，用人主管在其中三份表單上寫下「不適合」和「怪怪的」，留下錄取者那一份，把另外三份丟掉，理由是反正已經決定了。這樣做的問題在哪裡？"],"o":[["Nothing, once an offer is accepted the other paperwork has served its purpose","沒有問題，錄取通知一旦被接受，其他文件就完成任務了"],["The notes are the only account of why each candidate scored as they did, so they have to be job related and factual, and the forms for candidates who were not selected have to be retained for the period the policy sets rather than discarded at the moment of decision","這些紀錄是每位人選為何得到該分數的唯一依據，所以內容必須和工作相關而且具體，未錄取人選的表單也要依規定的保存年限留存，不能在做出決定的當下就丟掉"],["The only problem is the wording, since the forms could have been thrown away safely if the notes had been neutral","唯一的問題是用字，因為只要紀錄寫得中性，表單本來就可以安全丟掉"],["The only problem is retention, since brief impressions are perfectly acceptable on an interview form as long as the paper is actually filed, and no hiring manager can be expected to write a full page about every candidate who walks through the door during a busy week of interviewing for a single opening","唯一的問題是保存，因為只要文件真的有歸檔，面試表上寫簡短印象完全可以接受，在忙碌的一週裡為了一個職缺面試那麼多人，不能要求用人主管替每個人寫滿一整頁"]],"a":1,"x":["Two defects here and they compound. Not a good fit and a bit odd describe your reaction rather than the candidate performance against the criteria, so they are the sentences that get read aloud later with nothing underneath them to explain the score. And the records for candidates who were not selected are exactly the records that show the process was applied consistently, so destroying them removes your own evidence. Write what the candidate said or did against a named requirement, and keep every candidate file for the retention period in the policy. VERIFY the applicable retention period with HR, since it is set by policy and by law rather than by the manager.","這裡有兩個缺陷，而且會互相加乘。「不適合」和「怪怪的」描述的是你的反應，不是應徵者對照評分標準的表現，這種句子日後被念出來時，底下沒有任何東西可以支撐那個分數。另一方面，未錄取者的資料，正是能證明流程一致適用的那批資料，銷毀它們等於把自己的證據丟掉。請寫下應徵者針對某一項明確要求說了什麼、做了什麼，並且把每一位應徵者的資料依政策保存期限留存。適用的保存期限請與人資查證（VERIFY），因為那是由政策與法規決定，不是由用人主管決定。"]}],"LDR-502":[{"q":["A produce buyer lands a case of berries at a delivered cost of 24.00 and sets the case retail at 32.00. He reports it to you as a 33 percent margin item. Is he right?","一位蔬果採購以到店成本 24.00 進了一箱莓果，訂出的整箱售價是 32.00。他向你回報說這是毛利率百分之三十三的商品。他說得對嗎？"],"o":[["Yes, 8.00 of profit on 24.00 of cost is 33 percent","對，成本24元賺8元就是33%"],["No, 33 percent is the markup on cost. Gross margin is 8.00 divided by the 32.00 retail, which is 25 percent","不對，33%是成本加成率。毛利是8元除以32元的售價，等於25%"],["No, and the difference does not really matter here, because both figures describe the same 8.00 of gross profit and the profit and loss statement will report whichever number the department submits","不對，但這裡差別不大，因為兩個數字講的都是同樣8元的毛利，損益表上會呈現部門報上去的那個數字"],["Yes, and it will also show as 33 percent on the profit and loss statement","對，而且損益表上也會顯示33%"]],"a":1,"x":["Markup is measured on cost and margin is measured on retail, and the two are different numbers for the same item. Here the gross profit is 8.00, so the markup is 8 divided by 24 which is 33 percent, and the margin is 8 divided by 32 which is 25 percent. The profit and loss statement reports the 25. Confusing the two overstates a department by eight points, which is enough to make a department that is missing its plan look like it is beating it. When a buyer quotes a percentage, ask which base it sits on.","加成率是以成本為分母，毛利率是以售價為分母，同一件商品的這兩個數字並不相同。這個例子的毛利額是 8.00，所以加成率是 8 除以 24，等於百分之三十三；毛利率是 8 除以 32，等於百分之二十五。損益表上呈現的是百分之二十五。把兩者混為一談，會讓一個部門的績效被高估八個百分點，這個幅度足以讓一個沒達成預算的部門，看起來像是超前達標。當採購報出一個百分比時，請先問清楚那個百分比的分母是什麼。"]},{"q":["In one four week period grocery records 12,000 of shrink on 800,000 of sales, and the deli records 6,000 of shrink on 96,000 of sales. The store manager wants to spend the next month working on grocery because the dollar figure is twice as large. What should you tell him?","某個四週的期間內，雜貨部在 800,000 的銷售額上記錄了 12,000 的損耗，熟食部則是在 96,000 的銷售額上記錄了 6,000 的損耗。店長打算下個月把重心放在雜貨部，因為金額是兩倍。你應該怎麼跟他說？"],"o":[["He is right, twelve thousand dollars is the larger loss and the larger loss is the priority","他說得對，一萬二千元是比較大的損失，損失大的要先處理"],["Shrink has to be read as a percentage of the sales that produced it. Grocery is at 1.5 percent and the deli is at 6.25 percent, so the deli is the department where the process is broken","損耗要看它占營業額的比例。雜貨部是1.5%，熟食部是6.25%，所以流程出問題的是熟食部"],["The two departments are equivalent once you account for the deli being smaller","把熟食部規模比較小這件事算進去，兩個部門其實一樣"],["Neither figure is usable until both departments are counted on the same day of the week and on the same inventory cycle, because a count taken before a delivery and one taken after it are not comparable numbers","兩個數字都還不能用，除非兩個部門在同一個星期幾、同一個盤點週期結算，因為進貨前盤的和進貨後盤的數字沒得比"]],"a":1,"x":["Twelve thousand on eight hundred thousand is 1.5 percent. Six thousand on ninety six thousand is 6.25 percent. The deli is losing more than four times as much of every sales dollar, and a rate that high in a department with production, cooking loss and short shelf life usually points at production planning, at markdown timing or at how waste is being recorded, all of which are fixable. Rank by rate to find the broken process, then size the prize in dollars to decide how much time it deserves. Both readings matter, but the rate is what tells you where to look.","一萬二千除以八十萬是百分之一點五。六千除以九萬六千是百分之六點二五。熟食部每一塊錢的銷售所損失的比例是雜貨部的四倍以上；而在一個有現場製作、烹調損耗與短效期的部門，這麼高的損耗率通常指向生產計畫、折價時機，或廢棄品的登錄方式，這三件事都是可以改的。先用比率找出流程壞在哪裡，再用金額衡量值得投入多少時間。兩種看法都有用，但告訴你該往哪裡看的是比率。"]},{"q":["Your store runs 620,000 in weekly sales with 74,400 of store labour, and the labour target is 12.0 percent. A remodel across the street takes sales down about 8 percent for six weeks, to roughly 570,400. You keep the schedule exactly as it is. What happens and what should you do?","你的門市週銷售額 620,000，門市人事費用 74,400，人事費用率目標是百分之十二。對街的改建工程讓銷售額在六週內下滑約百分之八，掉到大約 570,400。你把班表原封不動維持不變。會發生什麼事，你又應該怎麼做？"],"o":[["Labour percent is unchanged, because you did not add any hours","人事成本比率沒變，因為你沒有增加工時"],["Labour rises to about 13.0 percent, so hours have to flex down roughly in proportion to the sales decline, about 8 percent, taken out of the day parts where the traffic actually fell","人事成本比率升到約13.0%，所以工時要跟著往下調，大約減8%，而且要從實際客流下滑的時段扣"],["Labour rises to about 13.0 percent, and the fix is to cut the lowest paid positions first, because each hour removed there costs the store the least and the schedule can absorb the loss most easily","人事成本比率升到約13.0%，做法是先砍薪資最低的職位，因為在那裡每少一個工時，門市付出的成本最少，班表也最容易吸收"],["Labour percent will correct itself when sales return, so no action is needed","等營業額回來，人事成本比率自己就會修正，不用處理"]],"a":1,"x":["The ratio moves when either side moves. Holding 74,400 of labour against 570,400 of sales gives 13.04 percent, so a fixed schedule against falling sales costs about a point of labour without anyone doing anything wrong. Holding 12.0 percent on the lower volume means about 68,450 of labour, which is roughly 5,950 less per week. Take it from the hours that face the traffic you actually lost, checking against the sales by day part rather than trimming evenly, and protect the coverage that produces the sales you still have. Cutting by pay rate rather than by demand is how a store ends up short at exactly the hour it is busiest.","這個比率的兩邊，任何一邊變動它都會動。用 74,400 的人事費用對上 570,400 的銷售額是百分之十三點零四，也就是說，班表不動而銷售下滑，光是這樣就會多掉大約一個百分點的人事費用率，沒有任何人做錯事。若要在較低的銷售量下維持百分之十二，人事費用約需 68,450，也就是每週要少約 5,950。請從實際流失客流的那些時段去調整，對照分時段的銷售資料，而不是全班表平均砍，同時保住支撐現有業績的那些人力。依薪資高低而不是依需求來砍人，正是一家店最後在最忙的那個小時缺人的原因。"]},{"q":["Hot foods grew sales from 45,000 to 54,000 in a four week period, up 20 percent, and the department head is asking for recognition. Gross margin fell from 38 percent to 28 percent because of end of day markdowns, and the department added 60 labour hours at a loaded rate of about 22.00. Did the department make more money?","熟食部在一個四週的期間內，銷售額從 45,000 成長到 54,000，成長百分之二十，部門主管正在等你的肯定。但毛利率從百分之三十八掉到百分之二十八，原因是打烊前的折價，而且部門多用了 60 個工時，含負擔的時薪約 22.00。這個部門真的多賺了嗎？"],"o":[["Yes, nine thousand dollars of additional sales is nine thousand dollars the store did not have before","對，多出來的九千元營業額，是門市原本沒有的九千元"],["No. Gross profit fell from 17,100 to 15,120, a loss of 1,980, and the extra hours added about 1,320 of cost, so the department is roughly 3,300 worse off on 9,000 more sales","不對。毛利從17,100元掉到15,120元，少了1,980元，多排的工時又增加約1,320元成本，所以營業額多了九千元，部門反而大約虧了3,300元"],["Yes, because a lower margin percentage on a substantially larger sales base still produces more gross profit in dollars, which is the number the store actually banks at the end of the period","對，因為在大很多的營業基礎上，就算毛利率比較低，換算成金額的毛利還是比較多，那才是門市期末真正入帳的數字"],["No, but only because of the added hours. The margin decline by itself does not affect the outcome","不對，但問題只出在多排的工時。毛利率下滑本身不影響結果"]],"a":1,"x":["Sales are the top line and nobody banks the top line. Thirty eight percent of 45,000 is 17,100 of gross profit. Twenty eight percent of 54,000 is 15,120. So the growth was bought with markdowns that gave back 1,980 of profit, and 60 hours at 22.00 added 1,320 of cost on top of that, leaving the department about 3,300 behind on 9,000 more sales. This is the whole reason a department can grow revenue and still lose money. Judge a department on gross profit dollars after the labour it took to produce them, and treat a margin decline of ten points as a production and ordering question, since goods marked down at nine at night were made or ordered in the wrong quantity that morning.","銷售額只是損益表的第一行，而沒有人能把第一行存進銀行。45,000 的百分之三十八是 17,100 的毛利額，54,000 的百分之二十八是 15,120。也就是說，這次成長是用折價換來的，吐回去 1,980 的毛利，再加上 60 個工時乘以 22.00、多出 1,320 的成本，結果是銷售額多了 9,000，部門卻落後約 3,300。這正是一個部門營收成長卻仍然虧錢的完整原因。評價一個部門，要看扣掉為此投入的人力之後的毛利金額；而毛利率掉十個百分點，應該當成生產與訂貨的問題來看，因為晚上九點被打折出清的商品，是那天早上做多了或訂多了。"]},{"q":["A staple item sells at 4.99 with a cost of 3.74, so about a 25 percent margin. A department head wants to drop the retail to 4.49 to win units back from a competitor, and says the volume will more than make up for it. What does the arithmetic say he needs?","一項基本商品售價 4.99，成本 3.74，毛利率約百分之二十五。部門主管想把售價降到 4.49，把客人從競爭對手那邊搶回來，並說銷量一定補得回來。算術告訴我們他需要什麼？"],"o":[["About 10 percent more units, matching the size of the price reduction","約多賣10%的數量，和降價的幅度一樣"],["About 25 percent more units, matching the margin on the item","約多賣25%的數量，和這項商品的毛利一樣"],["About 67 percent more units, because gross profit per unit falls from 1.25 to 0.75 and 1.25 divided by 0.75 is about 1.67","約多賣67%的數量，因為每件毛利從1.25元掉到0.75元，1.25除以0.75約等於1.67"],["About 40 percent more units, because gross profit per unit falls by 40 percent from 1.25 to 0.75, so the volume has to rise by the same proportion to hold the line","約多賣40%的數量，因為每件毛利從1.25元掉到0.75元，減少了40%，數量要以同樣比例增加才守得住"]],"a":2,"x":["Price cuts come out of gross profit, not out of sales, which is why a ten percent price move is never a ten percent problem. Gross profit per unit goes from 1.25 to 0.75, so holding the same gross profit dollars takes about 67 percent more units, and the new margin is 0.75 on 4.49 which is 16.7 percent rather than 25. Before approving it, ask what unit lift the last comparable price move actually delivered, whether the vendor will fund part of the reduction, and whether the item pulls a basket large enough to justify carrying it thin. A price cut that misses its unit target does not break even, it just sells the same volume for less.","降價是從毛利裡面扣，不是從銷售額裡面扣，這就是為什麼百分之十的價格變動，從來不是百分之十的問題。單位毛利從 1.25 掉到 0.75，因此要維持同樣的毛利金額，銷量必須增加約百分之六十七；而新的毛利率是 0.75 除以 4.49，等於百分之十六點七，不是百分之二十五。核准之前，請先問三件事：上一次類似的降價實際帶來多少銷量成長、供應商願不願意分擔一部分價差，以及這項商品帶動的客單是否大到值得用這麼薄的毛利去做。沒有達到銷量目標的降價不會打平，它只是用比較低的價格賣掉同樣的量。"]}],"MGR-301":[{"q":["A stocker rolls an ankle on Saturday at 9 p.m. and tells the closing supervisor right away. The store is slammed, so the supervisor files the incident on Monday morning and enters Monday as the date. What is wrong with that record?","週六晚上九點，一位理貨員腳踝扭傷，當下就告訴了關店主管。當晚店裡很忙，主管在週一早上才建檔，並把日期填成週一。這份紀錄的問題在哪裡？"],"o":[["Nothing, the date a form is submitted is the date that counts.","沒有問題，以表單送出的日期為準。"],["The record should carry Saturday 9 p.m. as the time the incident occurred, because every downstream clock is measured from occurrence and not from submission, so entering Monday quietly moves a deadline and misstates the facts.","紀錄上的事故發生時間應該寫星期六晚上九點，因為後續所有的期限都是從事故發生時間起算，不是從送件時間起算，寫成星期一等於偷偷把期限往後挪，也把事實寫錯了。"],["The date only matters once the employee decides to see a doctor.","等同仁決定要去看醫生，日期才有影響。"],["Monday is acceptable as long as the narrative mentions that it happened over the weekend.","只要在敘述裡提到事情是週末發生的，日期寫星期一也可以。"]],"a":1,"x":["Occurrence time and submission time are two different fields and only one of them starts a clock. Record when it happened, then record separately when you learned of it and when you filed. A late filing is a manageable problem. A filing with the wrong occurrence time is a misstatement that follows the file into every later review. California Labor Code 5401 for the claim form and 6409.1 for the employer report are cited here for context only, and every interval in this system is marked VERIFY until counsel confirms it.","事發時間與送件時間是兩個不同的欄位，只有其中一個會啟動法定時效。請如實填寫事發時間，再另外記錄你何時得知、何時建檔。送件晚了是可以處理的問題；事發時間填錯則是一項不實陳述，會跟著這份卷宗進入日後每一次檢視。此處引用加州勞動法 5401 條（理賠表單）與 6409.1 條（雇主通報）僅供參考，本系統所有期限在法務確認前一律標註 VERIFY。"]},{"q":["It is 11 p.m. on a holiday weekend. A closing supervisor has an injury to report, cannot reach the store manager, and the office is dark. What should the system and the supervisor do?","連假期間晚上十一點，關店主管有一件傷害事件要通報，聯絡不上店長，辦公室也沒有人。系統與這位主管分別該怎麼做？"],"o":[["The supervisor files the incident immediately, because intake is always open to any supervisor and manager review happens afterward rather than before.","主管當下就把事故通報建檔，因為通報管道隨時都對任何一位主管開放，經理是事後複核，不是事前核准。"],["Wait until the store manager can approve it in the morning.","等早上店長可以核准的時候再說。"],["Write it on paper and hand it to the office when someone is in.","先寫在紙上，等辦公室有人的時候再交過去。"],["Send the store manager a text and file only if they answer.","傳簡訊給店長，等他回覆了再建檔。"]],"a":0,"x":["Any control that can stop an incident from being recorded will eventually stop one from being recorded. Intake is open at every hour to every supervisor, with no approval standing in front of it. Review, correction and escalation all happen after the record exists. If a supervisor ever has to choose between filing and waiting for permission, the design has failed, not the supervisor.","任何可以攔下通報的關卡，遲早都會真的攔下一件通報。受理必須全天候對所有主管開放，前面不能擺任何簽核。審核、更正與後續呈報，都在紀錄建立之後才進行。如果主管必須在「先建檔」與「等人核准」之間二選一，那是制度設計失敗，不是主管的錯。"]},{"q":["A supervisor writes this narrative: the employee was being careless as usual and slipped on a floor that was obviously wet. What should the narrative say instead?","一位主管在事故敘述欄寫下：該員一如往常不小心，在明顯濕滑的地板上滑倒。這段敘述應該怎麼改寫？"],"o":[["Leave it, an honest opinion from the person on the floor is useful.","就這樣留著，第一線同仁的真心話很有參考價值。"],["Remove the description of the floor so the store is not blamed.","把地板狀況的描述刪掉，免得責任落到店裡。"],["State what can be observed and verified, the time, the aisle, the task, what was on the floor, whether a wet floor sign was up, who was present and what the employee said, and leave fault and habit out of the record entirely.","只寫看得到、查得證的事實，包括時間、走道、當時在做什麼工作、地上有什麼、有沒有立小心地滑的告示牌、現場有誰、同仁說了什麼，至於是誰的錯、平常習慣如何，完全不要寫進紀錄。"],["Name whoever last mopped that aisle so responsibility is clear.","把最後拖那條走道的人寫上去，責任才清楚。"]],"a":2,"x":["Intake captures facts, not verdicts. As usual is a character claim, careless is a legal conclusion, and obviously wet is an argument. All three are attackable and none of them help anyone fix the aisle. Write what a camera would have caught, keep every observation attributable, and let investigation and any determination of fault happen later by people whose job that is.","受理階段記錄的是事實，不是判決。「一如往常」是在評斷人格，「不小心」是法律上的結論，「明顯濕滑」則是一種主張。這三者都禁不起檢驗，也都無助於改善那條走道。請寫下攝影機拍得到的內容，讓每一項觀察都能追溯來源，責任認定留給後續有職責的人處理。"]},{"q":["A cashier hurt a wrist an hour ago. She has not decided whether she will see a doctor, so the supervisor is holding the report until the treatment level is known.","一位收銀員一小時前手腕受傷，還沒決定要不要就醫，主管因此先壓著報告，想等確定就醫方式再送出。"],"o":[["Holding is correct, an incomplete record is worse than a late one.","先壓著是對的，資料不齊比晚報更糟。"],["File now with what is known, mark the treatment level as pending, and update it the moment it changes, because the record can be amended but the elapsed time cannot be recovered.","用現在已知的內容先報，治療層級先標註為待確認，一有變化馬上更新，因為紀錄可以事後補正，時間過了卻補不回來。"],["File only if she actually goes to a clinic.","等她真的去診所了再報。"],["Ask her to decide before the end of her shift and file after that.","請她在下班前決定，之後再報。"]],"a":1,"x":["Waiting for certainty is the most common way a window gets burned, and it always looks like diligence while it is happening. File on what you know, flag what you do not, and let the treatment level be updated as a first class change with its own timestamp. A record that grows more accurate over time is normal. A record that was never opened is unrecoverable.","為了等資訊齊全而延後，是最常見的時效流失原因，而且發生當下看起來還很像盡責。請先就已知內容建檔，未知的部分標註待補，等治療層級確定後再以獨立的時間戳更新。一份隨時間逐步補正的紀錄是正常的；一份從未建立的紀錄則無法挽回。"]},{"q":["An employee bumps his head on a low shelf, says he is fine, and asks you not to write it up because he does not want a fuss.","一位同仁的頭撞到低層架，他說自己沒事，並請你不要寫報告，因為不想把事情鬧大。"],"o":[["Honor the request, it is his body and his choice.","尊重他的要求，身體是他的，他自己決定。"],["Mention it verbally to the next shift manager and leave it there.","口頭跟下一班的主管講一聲就好。"],["Log it only if symptoms appear later.","等之後真的出現症狀再登錄。"],["Record it anyway, note in his own words that he reported no symptoms and declined care at that time, and tell him plainly that the log protects his options if anything changes.","還是要做紀錄，用他自己的說法註明他當下表示沒有不適、也婉拒就醫，並且直接跟他說清楚，這筆紀錄是在保留他之後萬一有狀況的處理空間。"]],"a":3,"x":["An employee can decline treatment. He cannot waive the record, and he should not be asked to. Intake is not a claim and it is not an accusation, it is the only thing that will exist if a headache shows up two days from now. Write what he reported, write that he declined care, tell him it was logged, and add head injuries to the list of things you check back on before the end of the shift.","同仁可以拒絕接受治療，但他無法免除建檔，也不該被要求這麼做。受理紀錄既不是理賠申請，也不是究責，它是萬一兩天後開始頭痛時，唯一還留得下來的東西。請寫下他當時陳述的狀況、寫下他婉拒就醫，並告知他已經留有紀錄；頭部撞擊也請列入下班前要再關心一次的名單。"]}],"MGR-302":[{"q":["A deli clerk nicks a finger on a slicer guard. You clean it with antiseptic from the store kit, apply a bandage, and she finishes her shift with no restriction and no outside care. Classify it and name what it triggers.","一位熟食部同仁的手指被切片機護片刮到。你用店內急救箱的消毒藥水清潔傷口並貼上OK繃，她照常做完當班工作，沒有工作限制，也沒有到外部就醫。請判定層級並說明會啟動什麼。"],"o":[["First aid only. It produces a log entry in the incident record and starts no statutory filing clock, and the log entry is still required.","只算急救處理。這種情況會在事故紀錄裡留下一筆登錄，不會啟動任何法定申報期限，但是那筆登錄還是一定要做。"],["Clinic level, because a slicer was involved.","算診所就醫層級，因為牽涉到切片機。"],["Emergency level, because any laceration is reportable.","算緊急層級，因為只要是撕裂傷就要通報。"],["Nothing at all, since no time was lost and no outside provider was seen.","什麼都不用做，因為沒有損失工時，也沒有去外面看醫生。"]],"a":0,"x":["Single use supplies from the store kit, no sutures, no prescription, no work restriction and no outside provider is the classic first aid picture. First aid still gets logged, because the log is how a pattern at one slicer becomes visible. What first aid does not do is start the claim form or the employer report clocks. California Labor Code 5401 and 6409.1 are cited for context, and the boundary between first aid and medical treatment must be VERIFIED against current guidance before it drives a filing decision.","使用店內急救箱的一次性用品、沒有縫合、沒有處方藥、沒有工作限制、也沒有外部醫療人員介入，這是典型的急救層級。急救層級仍然要留紀錄，因為唯有留下紀錄，同一台切片機反覆出事的模式才會被看見。急救層級不會啟動的是理賠表單與雇主通報的時效。此處引用加州勞動法 5401 條與 6409.1 條僅供參考；急救與醫療處置的界線，必須先依現行規範確認後，才可用來決定是否提報。VERIFY"]},{"q":["A receiver cuts a forearm on a strapping band. You send him to the occupational clinic, where he receives sutures and a written restriction of no lifting over ten pounds for one week. Classify it and name what it triggers.","一位驗收人員的前臂被捆帶割傷。你送他到職業醫學診所，醫師縫合傷口，並開立一週內不得提舉超過十磅的書面工作限制。請判定層級並說明會啟動什麼。"],"o":[["First aid, since he returned to work the same day.","算急救處理，因為他當天就回來上班了。"],["Beyond first aid. It starts the DWC-1 claim form clock to the employee, commonly cited as within one working day of notice, and the Form 5020 employer first report clock, commonly cited as within five days, and it does not by itself trigger the Cal/OSHA serious injury report.","超出急救處理的範圍。這會啟動要交給同仁的 DWC-1 理賠申請表期限，一般說法是接獲通知後一個工作日內，也會啟動雇主初次報告 Form 5020 的期限，一般說法是五天內，但是這件事本身不會觸發 Cal/OSHA 的重大傷害通報。"],["It triggers the eight hour Cal/OSHA report because there is a work restriction.","因為有工作限制，所以會觸發 Cal/OSHA 的八小時通報。"],["Only the Form 5020 applies, the DWC-1 is for lost time cases.","只需要 Form 5020，DWC-1 是損失工時的案件才要用。"]],"a":1,"x":["Sutures and a written restriction put this past first aid, and past first aid is the line where the two workers compensation clocks start. Give the employee the claim form, do not wait for him to ask for it, and file the employer first report. California Labor Code 5401 is commonly cited for one working day on the DWC-1 and 6409.1 for the five day employer report. Both intervals are cited from secondary sources and are marked VERIFY. Confirm with counsel before treating either as a deadline.","縫合加上書面工作限制，已經超過急救層級；而超過急救層級，正是兩條勞工賠償時效開始起算的分界。請主動把理賠表單交給該員，不要等他開口索取，同時提交雇主初次通報。一般引用加州勞動法 5401 條為 DWC-1 應於接獲通知後一個工作日內交付，6409.1 條為雇主應於五日內提交報告。兩項期限皆引自次級資料來源，標註 VERIFY，須經法務確認後才可視為正式期限。"]},{"q":["A grocery clerk falls from a ladder in the back room, is transported by ambulance, and is admitted overnight for observation. You have already notified the claims administrator. What still has to happen?","一位雜貨部同仁在後場從梯子上摔落，由救護車送醫，並留院觀察一晚。你已經通知理賠管理單位。還有什麼一定要做？"],"o":[["Nothing further, notifying the claims administrator covers the employer obligations.","不用再做什麼，通知理賠管理單位就等於盡到雇主的義務了。"],["The DWC-1 and Form 5020 clocks only, since the hospital is handling the medical side.","只有 DWC-1 和 Form 5020 的期限要跑，醫療的部分醫院會處理。"],["The DWC-1 and Form 5020 clocks run as with any case beyond first aid, and on top of them an inpatient hospitalization triggers a separate report to Cal/OSHA, commonly cited as immediately and within eight hours, which notice to the claims administrator does not satisfy.","DWC-1 和 Form 5020 的期限照一般超出急救處理的案件跑，除此之外，住院治療還會另外觸發一份要通報 Cal/OSHA 的報告，一般說法是立即通報且不得超過八小時，這份報告不能用通知理賠管理單位來代替。"],["Wait for a confirmed diagnosis before reporting anything, so the report is accurate.","等確定診斷出來再通報，這樣報的內容才準確。"]],"a":2,"x":["This is the case managers get wrong, because telling the claims administrator feels like reporting. It is a different obligation to a different body on a much shorter clock, and the two do not substitute for each other. Escalate the moment you know there is an inpatient admission rather than waiting for a diagnosis, and preserve the ladder and the area untouched. California Labor Code 6409.1 is commonly cited for the eight hour serious injury report and the definition of a serious injury or illness is itself narrow and specific. VERIFY the current text, the trigger and the interval with counsel before relying on any of it.","這一題是主管最常判斷錯誤的情境，因為通知理賠單位「感覺上」就像已經完成通報。但那是對不同機關、不同法源、而且時效短得多的另一項義務，兩者不能互相取代。一旦確認為住院收治，就要立即呈報，不要等診斷確定，同時保持梯子與現場原狀不要移動。一般引用加州勞動法 6409.1 條為八小時內通報重大傷害，而「重大傷害或疾病」的定義本身相當狹窄且明確。相關條文、觸發要件與期限，皆須經法務確認後才可依循。VERIFY"]},{"q":["A clerk catches a finger in a cart corral. It is swollen, he cannot bend it, and he says he just wants ice and does not want to go anywhere because he cannot afford to lose the hours.","一位同仁的手指被推車回收架夾到，手指腫脹且無法彎曲。他說只想冰敷，不想去任何地方，因為他不能損失工時。"],"o":[["Give him ice and put him back on the floor, it is his choice.","給他冰敷，然後讓他回賣場繼續上班，這是他自己的選擇。"],["Offer and arrange a medical evaluation now, tell him the visit and the wage question are handled separately and are not his to solve in the aisle, and understand that once you arrange offsite care the case is beyond first aid and the DWC-1 and Form 5020 clocks start.","現在就主動提供並安排就醫評估，跟他說看診和薪資的問題是分開處理的，不需要他站在走道上自己想辦法解決，同時要知道，只要你安排了外部就醫，這個案件就超出急救處理的範圍，DWC-1 和 Form 5020 的期限開始起算。"],["Call 911, a finger that will not bend is an emergency.","打 911，手指彎不了就是緊急狀況。"],["Wait until the end of the shift and see whether the swelling goes down.","等到下班再看看腫有沒有消。"]],"a":1,"x":["Two decisions are being tangled together here, whether he needs to be seen and whether he loses money. Untangle them out loud. You are not qualified to rule out a fracture and neither is he, so arrange the evaluation, remove the wage pressure from the conversation, and never let cost anxiety decide a medical question. Once you send him for care it is beyond first aid, so treat the filing clocks as running from the time of injury. VERIFY every interval with counsel.","這裡有兩個決定被綁在一起，一個是他需不需要就醫，一個是他會不會少賺錢。請當場把這兩件事拆開講清楚。你沒有能力排除骨折，他也沒有，所以請安排醫療評估，把薪資顧慮從這段對話中移開，絕不能讓費用焦慮來決定醫療問題。一旦你安排外部就醫，本案即超過急救層級，提報時效請以受傷時間起算。所有期限均須經法務確認。VERIFY"]},{"q":["An incident was filed on Tuesday as first aid, a bandage and nothing more. On Thursday the same employee sees a doctor for the same injury and is put on a work restriction. What do you do with the record?","某件事故在週二以急救層級建檔，只做了包紮處理。到了週四，同一位同仁因為同一處傷勢就醫，並被開立工作限制。這份紀錄該怎麼處理？"],"o":[["Update the treatment level on the existing incident, which opens the filing obligations that first aid did not, and keep the original occurrence time, since the clocks are measured from the injury rather than from the day you learned it had escalated.","在原本那筆事故紀錄上更新治療層級，這會開啟急救處理原本沒有的申報義務，發生時間維持原本的，因為期限是從受傷當下起算，不是從你得知情況變嚴重的那天起算。"],["Open a new incident dated Thursday, since that is when it became reportable.","另外開一筆日期寫星期四的事故紀錄，因為那時候才變成要通報的案件。"],["Leave it as filed, first aid was an honest classification on Tuesday.","維持原本報的內容，星期二歸類成急救處理並沒有造假。"],["Do nothing, he went to the doctor on his own time.","什麼都不用做，他是自己利用私人時間去看醫生的。"]],"a":0,"x":["Treatment level is not a decision you make once, it is a field that follows the injury. Escalate the existing record so the whole history stays in one place and the change carries its own timestamp, and never let a reclassification quietly reset the occurrence time to today. Assume the clocks run from the date of injury and act with the time you actually have left, which may already be less than you think. VERIFY with counsel how a late escalation is measured before stating any rule to a store.","治療層級不是一次定案的判斷，而是隨著傷勢變動的欄位。請在原有紀錄上升級，讓完整歷程留在同一件案子裡，並讓這次變更帶有自己的時間戳；絕對不要因為重新分類，就把事發時間悄悄改成今天。請以受傷日起算時效來因應，實際剩餘時間可能比你以為的更少。升級提報的時效如何計算，須先經法務確認，才可對門市宣布為規定。VERIFY"]}],"MGR-303":[{"q":["A customer slips near produce. Three employees saw some part of it. The manager on duty plans to write one clear summary of what the three of them agree happened.","一位顧客在生鮮區附近滑倒，三位同仁分別看到了一部分經過。值班主管打算把三個人達成共識的版本，整理成一份清楚的摘要。"],"o":[["One summary is better, a single consistent account is more credible than three that differ.","寫一份總結就好，說法一致比三份互相矛盾的紀錄更有說服力。"],["Take a separate account from each of the three before they discuss it with each other, in their own words, signed and dated, because the value of a statement is that it preserves what one person actually perceived.","在三個人互相討論之前，分別請每個人用自己的話寫下來，簽名並註明日期，因為證人紀錄的價值就在於保留每個人當下真正看到的內容。"],["Have the most senior of the three write the account for the group.","由三人當中年資最深的那位代表大家寫一份。"],["Collect statements only if the customer says she intends to make a claim.","只有在客人表明她要求償的時候，才收集證人紀錄。"]],"a":1,"x":["A witness statement exists to preserve one perspective before it blends with everyone else. Three imperfect independent accounts are worth far more than one tidy agreed version, and a version that reads as coordinated is the first thing anyone reviewing the file will attack. Separate the witnesses, take each account in their own words, have them sign and date it, and do not edit their wording into yours.","證人陳述的意義，在於保存某一個人的觀點，避免它與其他人的說法混在一起。三份各自獨立、也許不完美的陳述，價值遠高於一份整齊一致的共同版本；而讀起來像是對過口徑的版本，正是日後檢視卷宗時第一個被攻擊的地方。請把證人分開，各自用自己的話陳述，簽名並註記日期，不要把他們的用語改寫成你的用語。"]},{"q":["The store is in a heavy rush when an incident happens. The manager decides to collect witness statements at the end of the week when things calm down.","事故發生時門市正值尖峰。主管決定等到週末比較空的時候，再統一收集證人陳述。"],"o":[["Reasonable, a considered statement written later is more useful than a rushed one.","合理，事後想清楚再寫的紀錄，比匆忙寫出來的更有用。"],["Fine, as long as it is still written rather than spoken.","可以，只要最後是寫成書面而不是口頭就好。"],["Take a short written account from each witness the same day even if it is only a few lines, because detail decays within hours and witnesses talk to each other, and a brief account taken now beats a polished one taken on Friday.","當天就請每位證人寫一份簡短紀錄，只有幾行也沒關係，因為細節幾個小時就會模糊，證人之間也會互相討論，現在拿到的簡短版本，勝過星期五才寫得漂亮的版本。"],["Record each witness on video now and have them write it up on Friday.","現在先把每位證人錄影起來，星期五再請他們寫成文字。"]],"a":2,"x":["Two things happen to memory in the days after an incident. It fades, and it absorbs what other people said in the break room. Neither is dishonesty and both are permanent. Take a short account the same day, name, time, position, what they saw and heard, signed. If a witness has more to add later, take that as a second dated statement rather than editing the first one.","事故發生後的幾天內，記憶會發生兩件事：一是細節逐漸淡去，二是不知不覺吸收了休息室裡別人講的版本。這兩者都不是說謊，卻都無法回復。請當天就取得簡短的書面陳述，包含姓名、時間、所在位置、看到與聽到的內容，並簽名。若證人日後想補充，請以第二份註記日期的陳述處理，不要去修改第一份。"]},{"q":["A witness hands you a statement that reads: he was rushing because he always rushes, and that is why he fell.","一位證人交給你的陳述寫著：他當時很趕，因為他一向都很趕，所以才會跌倒。"],"o":[["Accept it, it is the witness honest impression and impressions matter.","照收，那是證人誠實的感受，感受也很重要。"],["Ask her to write again describing only what she saw and heard, where she was standing, what he was carrying, how fast he was moving in her own words, and what was on the floor, and leave the cause and the habit out because those are not hers to determine.","請她重寫一次，只描述她看到和聽到的：她站在哪裡、對方手上拿著什麼、用她自己的話形容對方走多快、地上有什麼，把原因和「他一向如此」這類判斷拿掉，因為那不是她該認定的事。"],["Rewrite it for her in cleaner language and have her sign it.","幫她用比較通順的文字重寫，再請她簽名。"],["Discard the statement, it is not usable.","把這份紀錄丟掉，這種內容沒辦法用。"]],"a":1,"x":["The last clause of that sentence is a causal finding and the middle clause is a character claim, and both of them make the parts she genuinely observed easier to dismiss. Send it back with a concrete prompt about position, distance, direction and what was on the floor. Never write it for her, and never throw a statement away. If she insists on keeping her conclusion in, take it as written and let the observable detail stand on its own.","那句話的最後一段是在認定因果，中間一段則是在評斷人格，兩者都會讓她真正親眼看到的部分更容易被推翻。請把陳述退回，並用具體提問引導：她站在哪裡、距離多遠、對方朝哪個方向、地上有什麼。絕對不要替她代筆，也絕對不要把陳述丟掉。如果她堅持保留自己的結論，就照她所寫收下，讓可觀察的細節自己說話。"]},{"q":["An employee has a visible facial injury after a fall in the back room. A supervisor wants to photograph her face for the file.","一位同仁在後場跌倒，臉部有明顯外傷。有位主管想拍下她的臉部照片附在卷宗裡。"],"o":[["Photograph the injury first, it is the clearest evidence there is.","先拍傷處，那是最清楚的證據。"],["Take no photographs at all, images of an injured employee create a privacy problem.","完全不要拍照，拍受傷的同仁會有隱私問題。"],["Photograph the scene before anything is moved, wide shots then close ups of the floor, the spill, the lighting, the footwear and anything underfoot, with a common object in frame for scale, and photograph a person only with their consent and only where it is genuinely relevant.","在任何東西被移動之前先拍現場，先拍大範圍再拍特寫，包含地面、漏出來的液體、照明、鞋子和腳下的任何東西，畫面裡放一個常見物品當比例尺，要拍到人一定要先取得對方同意，而且只在真的有必要的時候拍。"],["Clean the area first so the photographs look presentable, then shoot the scene.","先把現場清乾淨，讓照片看起來體面一點，再拍現場。"]],"a":2,"x":["The injury will be documented by whoever treats her and it will still be visible tomorrow. The scene will not. Within ten minutes somebody will have mopped the floor, moved the pallet and turned on a light, and the thing that explains why she fell will be gone. Shoot wide before you shoot close, keep the original files with their timestamps rather than screenshots, and never stage or tidy an area before you photograph it.","她的傷勢會由治療她的人留下紀錄，而且明天仍然看得到；現場則不會。十分鐘內就會有人把地拖乾淨、把棧板移開、把燈打開，而真正能解釋她為什麼跌倒的那個東西就消失了。請先拍全景再拍特寫，保留帶有時間戳的原始檔案而不是螢幕截圖，並且絕對不要在拍照前整理或布置現場。"]},{"q":["A pallet jack involved in an injury has a wheel that binds. Maintenance offers to fix it this afternoon so nobody else gets hurt on it.","一台與傷害事件有關的棧板拖車，輪子有卡住的狀況。維修人員表示今天下午就可以修好，免得再有人因此受傷。"],"o":[["Let maintenance repair it today, removing the hazard comes first.","今天就讓維修人員修好，先把危險排除最重要。"],["Tag it out of service, move it somewhere it cannot be used, photograph it and record the asset number and any prior repair history before anyone touches the wheel, then release it for repair once the documentation is complete.","掛上停用標示，移到不會被拿去用的地方，在任何人碰到輪子之前先拍照，並記下財產編號和過去的維修紀錄，等文件都做完再送修。"],["Keep it in service until the incident is closed so operations are not disrupted.","在案件結案之前繼續使用，才不會影響營運。"],["Scrap it, a jack that caused an injury should not be on the floor again.","直接報廢，出過事的油壓拖板車不應該再回到賣場。"]],"a":1,"x":["Safety and preservation are not in conflict here, they are both satisfied by taking the equipment out of service rather than by repairing it immediately. A repair erases the condition the record is trying to describe, and it also erases the more useful question, which is how long that wheel had been binding and whether anyone had written it up. Photograph it, pull the maintenance history, then fix it.","在這裡，安全與保全證據並不衝突，把設備停用就同時滿足了兩者，並不需要馬上維修。維修會抹除紀錄正要描述的那個狀態，也會抹除更關鍵的問題：那個輪子卡了多久，以及是否有人曾經回報過。請先拍照、調出維修保養紀錄，之後再送修。"]}],"MGR-305":[{"q":["A department lead drafts a written warning that says: employee has a bad attitude, does not care about the job, and brings the team down.","一位部門主管草擬的書面警告寫著：該員態度不佳、對工作漠不關心，並且拖累團隊士氣。"],"o":[["Approve it, the lead sees this person every day and that is an honest assessment.","核准，組長每天都看到這個人，這就是誠實的評價。"],["Soften the wording to needs improvement in professionalism and issue it.","把用字改得緩和一點，寫成「專業態度有待改進」再發出去。"],["Send it back to be rewritten around observable behaviour, the dates and times, what was said or not done, the standard that applies, what coaching already happened, and the specific change expected by a named date.","退回去重寫，內容要圍繞看得到的行為：日期和時間、說了什麼或什麼沒做到、適用的標準、之前已經做過哪些輔導，以及要求在哪一個明確日期之前做到什麼改變。"],["Drop the written warning and handle it as a verbal conversation instead.","取消書面警告，改用口頭談話處理。"]],"a":2,"x":["Attitude, does not care and brings the team down are conclusions about a person, and a person cannot correct a conclusion. Behaviour can be corrected because it can be described. Replace each phrase with the incident behind it, on Tuesday the 3rd he left the register unattended for eleven minutes without calling for relief, and now the employee knows what to change and any reviewer can check whether it happened. Softening the language does not fix it, it just makes it vague as well as unfair.","「態度」、「漠不關心」、「拖累士氣」都是對人的結論，而人無法去更正一個結論。行為之所以能被更正，是因為它能被描述。請把每一句評語換成背後的具體事件，例如三號週二他未呼叫接手人員即離開收銀檯十一分鐘。這樣該員知道要改什麼，任何審核者也能查證是否確有其事。把措辭改得委婉並不能解決問題，只會讓它同時變得模糊又不公平。"]},{"q":["Two employees in the same department are late by similar amounts on similar frequencies. One receives a written warning. The other is a strong producer, so the manager lets it go.","同一部門有兩位同仁，遲到的次數與時間長度都差不多。其中一位收到書面警告，另一位因為績效很好，主管就沒有處理。"],"o":[["Manager discretion is the point of progressive discipline, results should count for something.","主管本來就有裁量權，這正是漸進式懲處的用意，績效也應該算數。"],["Apply the same step to the same conduct, and if there genuinely is a difference such as an approved schedule adjustment then document that difference at the time rather than reconstructing it later.","同樣的行為就給同樣的處分階段，如果真的有差異，例如其中一位有經過核准的班表調整，就要在當下把這個差異記錄下來，而不是事後才補寫。"],["Issue the second warning now and date it to when the lateness started so the file matches.","現在就發第二張警告，日期填回遲到開始的那天，讓資料看起來一致。"],["Withdraw the first warning so neither employee is treated unfairly.","把第一張警告撤銷，這樣兩個人都不會被不公平對待。"]],"a":1,"x":["The comparison is the case. Nobody gets to inspect the manager intention, but anyone can line up two files and see that the same conduct produced two different outcomes, and once that is visible the question stops being about lateness. Performance belongs in a performance review, not in whether a rule applies. If there is a legitimate reason for a difference, it has to be written down while it is true, because a reason produced afterward reads as an excuse.","真正被檢視的是兩人之間的比較。沒有人能檢查主管心裡在想什麼，但任何人都可以把兩份卷宗攤開，看到相同的行為產生了不同的處置；一旦這一點被看見，爭點就不再是遲到本身。績效表現屬於績效考核，而不是決定規則要不要適用的理由。如果差別待遇確實有正當原因，就必須在當下寫下來，事後才補上的理由，讀起來就是藉口。"]},{"q":["A manager has kept two years of coaching notes in a personal spreadsheet on his laptop. Before an HR meeting he opens it and tidies up the wording on several older entries.","一位主管把兩年來的輔導紀錄存在自己筆電的試算表裡。在與人資開會前，他打開檔案，把幾則舊紀錄的用字修得比較通順。"],"o":[["A personal spreadsheet is fine so long as the content is accurate.","自己用試算表記沒問題，只要內容正確就好。"],["Print the spreadsheet and sign it now so it becomes an official document.","把試算表印出來現在簽名，讓它變成正式文件。"],["Coaching notes belong in the system of record where each entry is timestamped and cannot be silently altered, and where a correction is added as a new dated entry rather than edited over the old one, because a document anyone can quietly change proves nothing about when it was written.","輔導紀錄應該放在正式的紀錄系統裡，每一筆都有時間戳記，不能被偷偷改掉，要更正就新增一筆有日期的紀錄，而不是把舊的蓋過去，因為任何人都能私下修改的文件，根本無法證明它是什麼時候寫的。"],["Retype the whole history into the system today, keeping the original dates on each entry.","今天把全部歷史紀錄重新打進系統，每一筆都保留原本的日期。"]],"a":2,"x":["In a dispute the first question about any note is not what it says, it is when it was written and by whom, and whether it could have been changed since. A file on a laptop cannot answer that, and the tidying he just did would make an honest record look manufactured. Put entries into the system when the conversation happens, correct by appending a new dated entry that references the old one, and never overwrite history even when the change is innocent.","在爭議中，關於任何一則紀錄，第一個被問到的從來不是內容寫了什麼，而是何時寫的、誰寫的，以及事後是否可能被更動。存在筆電裡的檔案回答不了這個問題，而他剛才「修順」的動作，會讓一份誠實的紀錄看起來像是事後編造的。請在談話當下就把紀錄輸入系統，需要更正時以新增一筆註明日期並引用原紀錄的方式處理，即使改動完全出於善意，也絕對不要覆寫歷史。"]},{"q":["A manager wants to terminate for repeated no call no show. He now realises that three months of verbal conversations were never documented anywhere. He asks what to write.","一位主管想以多次未請假亦未出勤為由終止聘僱，此時才發現這三個月來的口頭談話從未留下任何紀錄。他來問應該補寫什麼。"],"o":[["Write up the three conversations now and date each one to the day it happened, since they really did happen.","現在把那三次談話寫成紀錄，日期各自填回實際發生的那天，反正事情真的有發生。"],["Terminate anyway, verbal warnings are still warnings.","還是照樣解僱，口頭警告也是警告。"],["Ask the employee to sign a statement acknowledging that the earlier conversations took place.","請同仁簽一份聲明，承認先前確實有過那幾次談話。"],["Write nothing retroactive. Record today, dated today, only what he can honestly attest to including his recollection of the earlier conversations described as recollection, and take the timing and the next step to HR before anything is issued.","不要補寫任何回溯日期的紀錄。今天寫、日期就填今天，只寫他能誠實作證的內容，先前談話的部分寫成他的回憶並註明那是回憶，而且在發出任何文件之前，先和 HR 討論時間點和下一步。"]],"a":3,"x":["Backdating is the one mistake that converts a defensible case into an indefensible one, and it is usually done by an honest person trying to make the file reflect what genuinely happened. A note dated today that says on or about early June I spoke with him about attendance is truthful and usable. The same note dated early June is not. Write today, label recollection as recollection, and let HR decide whether the record supports the step he wants to take.","事後補填日期，是唯一能把一個站得住腳的案子變成站不住腳的錯誤，而且做這件事的，往往是一位誠實、只想讓卷宗如實反映經過的主管。一則日期為今天、內容寫著「約於六月初曾就出勤狀況與其談話」的紀錄，既真實又可用；同樣的內容若把日期寫成六月初，就不是了。請以今天的日期書寫，把回憶明確標示為回憶，並讓人資判斷現有紀錄是否足以支撐他想採取的處置。"]},{"q":["You deliver a written warning and the employee refuses to sign it, saying she disagrees with every word of it.","你送達一份書面警告，該員拒絕簽名，並表示她完全不同意上面的每一句話。"],"o":[["Note on the form that she was presented with it, read it, and declined to sign, add the date, time and the name of the person who witnessed that, give her a copy, and tell her she may attach a written response which goes in the file alongside the warning.","在表單上註明已經把文件交給她、她看過了、但拒絕簽名，加上日期、時間和在場見證者的姓名，給她一份影本，並告訴她可以附上書面說明，會和警告一起放進檔案。"],["Void the warning and reissue it later when she is calmer.","先把警告作廢，等她情緒平復再重發一次。"],["Sign it on her behalf and note that she was present.","代替她簽名，並註明她當時在場。"],["Hold the warning in your desk until she agrees to sign it.","把警告先收在你的抽屜裡，等她願意簽再說。"]],"a":0,"x":["A signature acknowledges receipt, not agreement, and a refusal to sign does not void anything. Record the refusal factually with a witness, hand over a copy so she cannot later say she never saw it, and genuinely invite her written response. A rebuttal in the file is not a weakness in the case. A warning that was quietly withheld because delivering it was uncomfortable is.","簽名代表的是收到，不是同意，拒絕簽名也不會讓任何處置失效。請如實記錄拒簽的事實並有見證人在場，交付副本給她，避免日後主張從未看過，同時真誠地告知她可以附上書面說明。卷宗裡有一份員工的反駁，並不會削弱這個案子；因為當面送達很尷尬就把警告壓在抽屜裡，才會。"]}],"MGR-308":[{"q":["From the end of an aisle you watch a customer put two bottles of liquor inside a jacket and walk toward the exit. You are the closest employee.","你在走道盡頭看見一位顧客把兩瓶酒放進外套內，接著往出口走去。你是離他最近的同仁。"],"o":[["Step over and politely ask him to return the items before he leaves, asking is not confronting.","走過去，在他離開前禮貌地請他把商品放回來，問一下又不算對峙。"],["Let him go without any approach, keep a safe distance, do not touch him or anything he is carrying, and start recording what you observed from inside the store, then report it through the loss prevention channel.","讓他走，不要上前，保持安全距離，不要碰他或他身上的任何東西，在店內開始寫下你觀察到的內容，再依照防損通報管道回報。"],["Stand in the doorway so he has to walk around you.","站在門口，讓他必須繞過你才出得去。"],["Follow him into the parking lot from a distance to get a vehicle description.","遠遠跟到停車場，記下車輛特徵。"]],"a":1,"x":["The polite approach is the answer most people pick and it is the one this training exists to override, because the person being approached does not experience it as polite. He experiences being caught, and what happens in the next two seconds is no longer yours to control. Observe, record, report, never pursue. This is the same rule as the robbery module, and the merchandise is insured while the people on your shift are not.","「客氣地上前詢問」是多數人會選的答案，也正是這套訓練要壓下去的反應，因為被上前詢問的人並不覺得那是客氣。他感受到的是被抓到，而接下來那兩秒會發生什麼，已經不是你能控制的了。觀察、記錄、通報，絕不追趕。這與搶劫應變模組是同一條規則：商品有保險，當班的同仁沒有。"]},{"q":["A new clerk chases a shoplifter across the parking lot, recovers the merchandise, and comes back pleased with himself. Two other employees saw him do it.","一位新進同仁追著行竊者穿過停車場，把商品追了回來，回到店裡時相當得意。另外兩位同仁也看到了整個過程。"],"o":[["Praise him in front of the others, the merchandise came back and initiative should be recognised.","當著其他人的面稱讚他，商品拿回來了，主動積極就該被肯定。"],["Say nothing so his willingness to help is not discouraged.","什麼都不說，免得打擊他想幫忙的心。"],["Acknowledge that he was trying to protect the store, state clearly in front of the same people who saw it that pursuit is prohibited for every employee at every level, coach him on what to do instead, and document the incident and the coaching the same day.","肯定他是想保護店裡，同時當著看到這件事的同一群人清楚說明，不論職級，所有同仁都禁止追出去，接著輔導他下次該怎麼做，並在當天把事件和輔導內容記錄下來。"],["Issue a final written warning immediately so the rule is taken seriously.","立刻發最後一次書面警告，讓大家認真看待這條規定。"]],"a":2,"x":["Two other people watched this happen and they are now waiting to learn what the store actually rewards. If it goes unaddressed the rule is dead in that store, and if he is praised the next person chases someone who turns around. Correct it publicly enough that the witnesses hear the rule, privately enough that he is not humiliated, and write it down. The first instance is a coaching event, not a final warning, and the point is that the rule binds supervisors and managers exactly as it binds him.","另外兩個人看到了整件事，他們現在正在觀察這家店真正獎勵的是什麼。如果沒有人處理，這條規則在這家店就形同作廢；如果還被稱讚，下一個追出去的人遇到的可能是回頭反擊的對象。處理時要讓在場看到的人都聽見規則，但也要顧及他的顏面，並且要留下書面紀錄。第一次發生屬於輔導事件，而不是最終警告；重點在於這條規則對主管與店長的約束，和對他完全一樣。"]},{"q":["The person has left the property and nothing was recovered. You are writing the report. What belongs in it?","對方已經離開店區，商品沒有追回。你正在撰寫報告，裡面應該寫什麼？"],"o":[["Say who you think it was, since a name is the most useful thing an investigator can have.","把你認為是誰寫上去，因為對調查人員來說，名字是最有用的資訊。"],["Nothing needs writing, no merchandise was recovered and nobody was hurt.","不用寫什麼，商品沒追回來，也沒有人受傷。"],["What you actually observed and can attribute, the time, the aisle, the items and quantity, direction of travel, clothing, build and anything visible from inside such as a vehicle colour, plus the camera position and the time range to pull, with no guess about identity and no assumption about whether the person has done it before.","寫下你真正看到、而且說得出來源的內容：時間、走道、商品和數量、離開方向、衣著、體型，以及從店內看得到的資訊例如車子顏色，再加上攝影機位置和需要調閱的時間區間，不要猜測身分，也不要假設這個人以前是不是做過。"],["Ask the employees who saw it to agree on one version first so the report is consistent.","先請看到的同仁對一下說法，統一成一個版本，這樣報告才會一致。"]],"a":2,"x":["A report is only worth what can be attributed to a named observer at a stated time. Guesses about identity contaminate everything around them and are the fastest way to turn a shrink report into a complaint against the store
