function nvMegaColHTML(col){
  const viewer = S.persona;
  const can = nvCanEnter(viewer, col);
  /* One store context for the whole panel. taskInScope already decides what a
     store means per persona: mgr is bounded by it, hq and legal use it only to
     place store scoped informational rows, emp ignores it entirely. */
  const store = S.store;
  const rows = nvSurfaceData(col, store);
  const c = taskCount(col, store);
  const head =
    '<div class="nv-mch">' + nvIcon(col === 'legal' ? 'matters' : col === 'emp' ? 'learning' :
      col === 'mgr' ? 'team' : 'queue', 18) +
    '<span class="n">' + esc(t(col)) + '</span>' +
    '<span class="nv-b ' + (c.crit ? 'crit' : c.warn ? 'warn' : c.total ? 'info' : 'zero') +
    '" aria-label="' + esc(tx(nvOpenPhrase(c))) + '">' + c.total + '</span></div>' +
    (can ? '' : '<p class="nv-wall">' + nvIcon('lock', 15) + '<span>' + esc(tx(NV_WALL[col])) + '</span></p>');

  const body = rows.map(r => {
    const cls = nvBadgeCls(r);
    const inner = nvIcon(r.sf.icon) +
      '<span class="g"><span class="t">' + esc(tx(r.sf.label)) + '</span>' +
      '<span class="s">' + esc(r.sf.blocked ? tx(r.sf.blocked) : tx(r.phrase)) + '</span></span>' +
      '<span class="nv-b ' + cls + '" aria-hidden="true">' + r.total + '</span>';
    if(!can || r.sf.blocked){
      return '<div class="nv-mrow' + (r.total ? '' : ' rest') + '" aria-disabled="true">' + inner + '</div>';
    }
    const on = col === viewer && r.sf.k === nvSurfaceKey();
    return '<button class="nv-mrow' + (r.total ? '' : ' rest') + '" data-go="' +
      esc(JSON.stringify({persona:col, surface:r.sf.k, filter:r.group})) + '"' +
      (on ? ' aria-current="page"' : '') +
      ' aria-label="' + esc(tx(r.sf.label) + ', ' + tx(r.phrase)) + '">' + inner + '</button>';
  }).join('');

  return '<div class="nv-mcol' + (can ? '' : ' off') + '">' + head + body + '</div>';
}

function nvMegaFill(){
  const p = document.getElementById('meganav');
  if(!p) return;
  const q = s => p.querySelector(s);
  p.setAttribute('aria-label', tx(NV_COPY.megaLabel));

  const x = q('button[data-nv="x"]'), cols = q('div[data-nv="cols"]'), foot = q('div[data-nv="foot"]');
  if(ttl) ttl.textContent = tx(NV_COPY.megaTtl);

  if(cols) cols.innerHTML = TASK_PERSONAS.map(nvMegaColHTML).join('');
  if(foot) foot.innerHTML = '<span class="lab">' + esc(tx(NV_COPY.need)) + '</span>' +
    '<span class="txt">' + esc(tx(nvNeed(S.persona, S.store))) + '</span>';
}

let NV_MEGA_OPENER = null;
function nvMegaOpen(trigger){
  nvMegaMount();
  const p = document.getElementById('meganav');
  if(!p) return;
  NV_MEGA_OPENER = trigger || document.activeElement;
  nvMegaFill();
  p.hidden = false;
  S.nav.mega = true;
  const btn = document.querySelector('button[data-mega="open"]');
  if(btn) btn.setAttribute('aria-expanded', 'true');
  const f = p.querySelectorAll(FOCUSABLE);
  if(f.length) f[0].focus();
  nvLiveSay(tx(NV_COPY.megaLabel));
}
function nvMegaClose(restore){
  const p = document.getElementById('meganav');
  S.nav.mega = false;
  if(p) p.hidden = true;
  const btn = document.querySelector('button[data-mega="open"]');
  if(btn) btn.setAttribute('aria-expanded', 'false');
  /* Focus returns to the control that opened the panel, contract section 7.
     render() rebuilds the top bar, so the original node may be detached by now,
     in which case its replacement is the honest destination. Deliberately no
     offsetParent test: the trigger sits in a position:sticky bar and offsetParent
     is unreliable there. */
  if(restore){
    const back = (NV_MEGA_OPENER && document.contains(NV_MEGA_OPENER)) ? NV_MEGA_OPENER : btn;
    if(back && back.focus) back.focus();
  }
  NV_MEGA_OPENER = null;
}
/* Tab cycles inside the panel while it is open, contract section 7. FOCUSABLE
   is the selector the shipped drawer already uses, reused rather than forked so
   the two traps cannot drift. */
function nvTrap(e){
  const p = document.getElementById('meganav');
  if(!p || p.hidden || e.key !== 'Tab') return;
  const f = [].slice.call(p.querySelectorAll(FOCUSABLE)).filter(el => el.offsetParent !== null);
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){e.preventDefault(); last.focus();}
  else if(!e.shiftKey && document.activeElement === last){e.preventDefault(); first.focus();}
}
/* Escape is layered: the palette takes it first, then the inbox, then the mega
   panel. The shipped incident drawer and the full screen map overlay are inner
   layers too. S.nav is the contract's flag for the first two, and the other two
   are read off the DOM state their own code already sets. */
function nvInnerOpen(){
  if(S.nav && (S.nav.palette || S.nav.inbox)) return true;
  const d = document.getElementById('drawer');
  if(d && d.classList.contains('on')) return true;
  const mv = document.querySelector('div.mv');
  if(mv && mv.offsetParent !== null) return true;
  return false;
}

/* ---------- live region, contract section 7 ------------------------------ */

/* #app is repainted by innerHTML, so a live region inside it is a brand new
   node every time and announces nothing. This one lives on <body> and only its
   text changes. */
function nvLiveEl(){
  let a = document.getElementById('live');
  if(!a){
    a = document.createElement('div');
    a.id = 'live';
    a.className = 'vh';
    a.setAttribute('role', 'status');
    a.setAttribute('aria-live', 'polite');
    document.body.appendChild(a);
  }
  return a;
}
function nvLiveSay(msg){nvLiveEl().textContent = msg;}

/* ---------- navigation ---------------------------------------------------- */

let NV_SCROLL = null, NV_FOCUS = null;

function nvGo(patch){
  patch = patch || {};
  if(patch.persona && patch.persona !== S.persona){
    if(!nvCanEnter(S.persona, patch.persona)) return;
    S.persona = patch.persona;
    if(typeof closeDrawer === 'function') closeDrawer();
  }
  S.module = null;
  const sf = nvFind(S.persona, patch.surface) || nvSurfList(S.persona)[0];
  if(sf){
    S.route.surface = sf.k;
    S.tab = sf.k;                       /* mgr views read S.tab, the rest ignore it */
    S.filter = sf.setFilter || 'all';   /* the loaded filter, teardown section 1 */
    NV_SCROLL = sf.k;
    NV_FOCUS = 'nav#subnav button[data-tab="' + sf.k + '"]';
  }
  S.route.persona = S.persona;
  S.route.filter = patch.filter || null;
  S.route.ctx = null;
  nvMegaClose(false);
  render();
}
function nvOpenSubject(task){
  const s = task.subject;
  if(s.type === 'incident' && typeof incDrawer === 'function') return incDrawer(s.id);
  if(s.type === 'employee' && typeof empDrawer === 'function') return empDrawer(s.id);
  if(typeof storeDrawer === 'function') return storeDrawer(s.store || S.store);
}
function nvStep(dir){
  const list = nvQueue();
  if(!list.length) return;
  let i = -1;
  for(let n = 0; n < list.length; n++) if(list[n].id === S.route.ctx) i = n;
  i = i < 0 ? (dir > 0 ? 0 : list.length - 1) : i + dir;
  if(i < 0) i = 0;
  if(i >= list.length) i = list.length - 1;
  const task = list[i];
  S.route.ctx = task.id;
  NV_FOCUS = 'div#mininav button[data-nvstep="' + (dir > 0 ? '1' : '-1') + '"]';
  nvLiveSay(tx(NV_COPY.item) + ' ' + (i + 1) + ' / ' + list.length + ', ' + tx(task.title));
  render();
  nvOpenSubject(task);
}

/* ---------- mount --------------------------------------------------------- */

/* The top bar is extended in place rather than re-templated, because the bell
   inside it belongs to the inbox agent and re-templating would silently take
   ownership of somebody else's markup. */
function nvTopbar(bar){
  const c = taskCount(S.persona, S.store);
  const mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
  const brand = bar.querySelector('div.brand');
  if(brand && !bar.querySelector('button[data-mega]')){
    brand.insertAdjacentHTML('afterend',
      /* aria-expanded is seeded from state, not from a literal. render() rebuilds
         the whole top bar, and a panel that is open while its trigger insists it
         is closed is worse than no trigger at all. */
      '<button class="nv-tb" data-mega="open" aria-expanded="' + (S.nav.mega ? 'true' : 'false') +
      '" aria-haspopup="dialog"' +
      ' aria-label="' + esc(tx(NV_COPY.menuOpen)) + '">' + nvIcon('grid', 18) +
      '<span class="nv-lbl">' + esc(tx(NV_COPY.menu)) + '</span>' +
      (c.total ? '<span class="nv-tbn" aria-hidden="true">' + c.total + '</span>' : '') + '</button>');
  }else{
    const b = bar.querySelector('button[data-mega]');
    if(b){
      const n = b.querySelector('span.nv-tbn');
      if(c.total && n) n.textContent = c.total;
      b.setAttribute('aria-expanded', S.nav.mega ? 'true' : 'false');
    }
  }
  const ctl = bar.querySelector('div.chrome-ctl');
  if(ctl && !ctl.querySelector('button[data-palette]')){
    const html = '<button class="nv-tb" data-palette="1" aria-label="' + esc(tx(NV_COPY.searchHint)) +
      '">' + nvIcon('find', 18) + '<span class="nv-lbl">' + esc(tx(NV_COPY.search)) + '</span>' +
      /* Spelled out rather than the command glyph: the font stack is Noto Sans
         plus Noto Sans TC and neither carries U+2318, so the glyph renders as
         tofu on a plain Linux box. */
      '<span class="nv-kbd" aria-hidden="true">' + (mac ? 'Cmd K' : 'Ctrl K') + '</span></button>';
    const bell = ctl.querySelector('button.bell');
    if(bell) bell.insertAdjacentHTML('beforebegin', html);
    else ctl.insertAdjacentHTML('beforeend', html);
  }
}

let NV_LAST_TOTAL = null, NV_LAST_PERSONA = null;

function nvMount(){
  const app = document.getElementById('app');
  if(!app) return;
  const bar = app.querySelector('div.topbar');
  const proto = app.querySelector('div.protobar');
  if(!bar || !proto) return;
  if(!bar.id) bar.id = 'topbar';
  nvTopbar(bar);

  /* Wrap everything below the proto banner into the shell flex column. Done by
     moving nodes rather than by re-templating the views, because this file is
     not allowed to edit them and because moving preserves the map's detached
     WebGL node the same way the shipped code relies on. */
  let shell = app.querySelector('div#shell');
  if(!shell){
    shell = document.createElement('div');
    shell.id = 'shell';
    const rail = document.createElement('nav');
    rail.id = 'railnav';
    const col = document.createElement('div');
    col.className = 'nv-col';
    const stack = document.createElement('div');
    stack.className = 'nv-stack';
    const sub = document.createElement('nav');
    sub.id = 'subnav';
    const mini = document.createElement('div');
    mini.id = 'mininav';
    stack.appendChild(sub);
    stack.appendChild(mini);
    col.appendChild(stack);
    shell.appendChild(rail);
    shell.appendChild(col);
    let n = proto.nextSibling;
    while(n){const nx = n.nextSibling; col.appendChild(n); n = nx;}
    app.appendChild(shell);
  }
  const rail = shell.querySelector('nav#railnav');
  const col = shell.querySelector('div.nv-col');
  const stack = shell.querySelector('div.nv-stack');
  const sub = shell.querySelector('nav#subnav');
  const mini = shell.querySelector('div#mininav');

  /* The persona can change without going through nvGo, because the top bar
     segmented control is the shipped handler's and stays that way. A loaded
     filter belongs to the surface it was loaded from, so it does not survive a
     move to a different console: leaving it behind made the breadcrumb claim a
     narrowing that was no longer being applied to anything. */
  if(S.route.persona !== S.persona){
    S.route.persona = S.persona;
    S.route.surface = null;
    S.route.filter = null;
    S.route.ctx = null;
  }
  S.route.surface = nvSurfaceKey();
  shell.setAttribute('data-rail', S.nav.rail);
  rail.setAttribute('aria-label', t(S.persona) + ' ' + tx(NV_COPY.surfaces));

  const rows = nvSurfaceData(S.persona, S.store);
  rail.innerHTML = nvRailHTML(rows);
  sub.innerHTML = nvSubnavHTML(rows);

  /* Fold the manager console's own store picker in. Two elements with the same
     id is invalid markup and the shipped change handler keys on that id, so the
     duplicate is removed before this one is written. */
  col.querySelectorAll('select#storepick').forEach(el => {
    if(!el.closest('div#mininav')) el.remove();
  });
  mini.innerHTML = nvMininavHTML(rows);

  /* The module player is a focus mode: it owns the whole column and has its own
     exit. The rail stays so there is always a way out. */
  stack.hidden = !!S.module;

  /* Every sticky offset in the stylesheet is measured from these two, so a
     banner that wraps to two lines on a narrow screen moves the whole stack
     instead of hiding the tabs behind it. */
  const pb = proto.offsetHeight;
  if(pb && String(pb) !== String(nvMount._pb)){
    nvMount._pb = pb;
    document.documentElement.style.setProperty('--pb-h', pb + 'px');
  }

  /* Contract section 7: every count that changes on interaction reaches #live. */
  const c = taskCount(S.persona, S.store);
  if(NV_LAST_TOTAL !== null && (c.total !== NV_LAST_TOTAL || S.persona !== NV_LAST_PERSONA)){
    nvLiveSay(t(S.persona) + ', ' + tx(nvOpenPhrase(c)));
  }
  NV_LAST_TOTAL = c.total;
  NV_LAST_PERSONA = S.persona;

  if(NV_FOCUS){
    const sel = NV_FOCUS;
    NV_FOCUS = null;
    try{const el = document.querySelector(sel); if(el) el.focus();}catch(err){}
  }
  if(NV_SCROLL){
    const key = NV_SCROLL;
    NV_SCROLL = null;
    const sf = nvFind(S.persona, key);
    const soft = typeof REDUCED === 'function' && REDUCED() ? 'auto' : 'smooth';
    let target = null;
    if(sf && sf.sec != null){
      target = typeof sf.sec === 'string'
        ? col.querySelector(sf.sec)
        : col.querySelectorAll('div.wrap > section')[sf.sec];
    }
    if(target) target.scrollIntoView({block:'start', behavior:soft});
    else window.scrollTo({top:0, behavior:soft});
  }
}

/* ---------- events -------------------------------------------------------- */

/* Capture, and propagation stops here. Every nav button also carries data-tab
   so the shipped delegated handler recognises it, but that handler forces
   S.filter back to 'all', which would throw away the loaded filter this whole
   design exists to carry. Taking the click in the capture phase does the entire
   job in one render instead of two.
   Every closest() below is qualified to a tag: <html> carries data-persona and
   <body> carries data-view on this project, and a bare closest() matched the
   document root once already and ate every toggle click on the page. */
document.addEventListener('click', e => {
  if(!e.target.closest) return;
  const go = e.target.closest('button[data-go]');
  if(!go) return;
  /* data-go is the contract's shared nav attribute and the floating layer uses
     it too, for the mobile bottom rail, with its own patch vocabulary. Stopping
     propagation on every data-go button in the document would swallow that rail
     whole. So this only claims the four containers this file owns, and every
     other data-go click travels on untouched. */
  const mine = go.closest('nav#subnav') || go.closest('nav#railnav') ||
               go.closest('div#meganav') || go.closest('div#mininav');
  if(!mine) return;
  e.preventDefault();
  e.stopPropagation();
  if(go.getAttribute('aria-disabled') === 'true') return;
  let patch = {};
  try{patch = JSON.parse(go.dataset.go || '{}');}catch(err){patch = {};}
  nvGo(patch);
}, true);

document.addEventListener('click', e => {
  if(!e.target.closest) return;
  const T = s => e.target.closest(s);
  let el;

  if(el = T('button[data-mega]')){
    if(el.dataset.mega === 'close' || S.nav.mega) nvMegaClose(true);
    else nvMegaOpen(el);
    return;
  }
  /* The palette belongs to another layer. This is the trigger, not the thing. */
  if(T('button[data-palette]')){
    document.dispatchEvent(new CustomEvent('palette:open', {detail:{source:'topbar'}}));
    return;
  }
  if(T('button[data-railtog]')){
    S.nav.rail = S.nav.rail === 'icons' ? 'open' : 'icons';
    window.PREFS.rail = S.nav.rail;
    const shell = document.getElementById('shell');
    if(shell) shell.setAttribute('data-rail', S.nav.rail);
    NV_FOCUS = 'nav#railnav button[data-railtog]';
    render();
    return;
  }
  if(el = T('button[data-nvstep]')){
    if(!el.disabled) nvStep(+el.dataset.nvstep);
    return;
  }
  /* The panel's own backdrop. Clicks inside land on .nv-mega-in or deeper. */
  if(e.target.id === 'meganav'){nvMegaClose(true); return;}
  /* The language choice persists, contract section 1. The shipped handler owns
     the switch itself; this only records the preference. */
  if(el = T('button[data-lang]')){window.PREFS.lang = el.dataset.lang; return;}
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    const p = document.getElementById('meganav');
    if(!p || p.hidden) return;
    if(nvInnerOpen()) return;
    e.stopPropagation();
    nvMegaClose(true);
    return;
  }
  nvTrap(e);
}, true);

/* ---------- boot ---------------------------------------------------------- */

/* render() is wrapped rather than replaced. Other part files wrap it too, and
   each one capturing the current value composes cleanly in merge order. */
const NV_BASE_RENDER = render;
render = function(){
  NV_BASE_RENDER.apply(this, arguments);
  nvMount();
};

function nvBoot(){
  nvLiveEl();
  nvMegaMount();
  S.nav.rail = window.PREFS.rail || 'open';
  render();
}
nvBoot();

/* ==========================================================================
   THE TASK INBOX
   Shell contract 11, sections 0, 3, 4 and 7. Owned by the inbox agent.

   Two surfaces over one list.

     The drawer  (#inbox) is for triage. Grouped by deadline, worst first, one
                 verb per row, and it closes.
     The page    (.ibx-page at S.route.surface 'inbox') is for work. Same rows,
                 as a filterable sortable table with an export and a column
                 naming who else is competent to close each item.

   Nothing in this file owns any task state. It calls taskComplete, taskRead,
   taskClear, taskUndo, taskGroups and taskCount and it never touches TASKS or
   NOTIFS, because the moment a second file starts writing that state the two
   can disagree, which is the failure contract section 0 exists to prevent.

   The one sentence this whole surface exists to make legible: finishing a
   shared item closes it for everybody at once, and dismissing a notice closes
   it for you alone. Every row says which of the two it is, in words, before
   the user presses anything.
   ========================================================================== */

  clock_expired:   {en:'Statutory filing overdue',zh:'法定送件已逾期'},
  schedule_meeting:{en:'Schedule a review',       zh:'安排檢討會議'},
  legal_review:    {en:'Legal escalation',        zh:'法務轉介'},
  litigation_hold: {en:'Litigation hold',         zh:'訴訟文件保存'},
  drill_overdue:   {en:'Drill overdue',           zh:'演練逾期'},
  training_overdue:{en:'Training overdue',        zh:'訓練逾期'},
  campaign_done:   {en:'Campaign closed',         zh:'派發結束'}
};
const IBX_SEV = {
  crit:{en:'Critical', zh:'極重要'},
  warn:{en:'Needs action', zh:'需處理'},
  info:{en:'For information', zh:'僅供知悉'}
};

/* ---------- small helpers ------------------------------------------------- */

const ibxTx = o => esc(tx(o));

/* Contract section 7: #app is repainted by innerHTML, so the live region has to
   live on body. Whichever layer created it wins; this never makes a second. */
function ibxSay(pair){
  if(typeof flAnnounce === 'function'){ flAnnounce(pair); return; }
  if(typeof nvLiveSay === 'function'){ nvLiveSay(tx(pair)); return; }
  let a = document.getElementById('live');
  if(!a){
    a = document.createElement('div');
    a.id = 'live'; a.className = 'vh';
    a.setAttribute('role','status'); a.setAttribute('aria-live','polite');
    document.body.appendChild(a);
  }
  a.textContent = tx(pair);
}

function ibxPersona(p){
  const row = (typeof T !== 'undefined' && T[p]) ? T[p] : null;
  return row ? {en:row[0], zh:row[1]} : {en:p, zh:p};
}
function ibxCity(code){
  const s = (typeof st === 'function') ? st(code) : null;
  return s ? (s.c + ', ' + s.city + ' ' + s.st) : String(code || '');
}
function ibxDate(ms){
  const d = new Date(ms);
  const o = {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'};
  return {en:d.toLocaleString('en-US', o), zh:d.toLocaleString('zh-TW', o)};
}

/* The relative clock on a row. Bilingual rather than reusing fmtLeft, which is
   English only and prints "left" and "over" as literals. */
function ibxWhen(due){
  if(due == null) return null;
  const ms = due - Date.now();
  const late = ms < 0;
  const a = Math.abs(ms);
  const d = Math.floor(a / DAY), h = Math.floor((a % DAY) / HR), m = Math.floor((a % HR) / 60000);
  const en = d > 0 ? (d + 'd ' + h + 'h') : h > 0 ? (h + 'h ' + m + 'm') : (m + 'm');
  const zh = d > 0 ? (d + ' 天 ' + h + ' 小時') : h > 0 ? (h + ' 小時 ' + m + ' 分') : (m + ' 分');
  const on = ibxDate(due);
  return {
    late: late,
    ms: ms,
    txt: late ? {en:en + ' overdue', zh:'逾期 ' + zh}
              : {en:en + ' left', zh:'剩 ' + zh},
    full: late ? {en:'Deadline passed ' + en + ' ago, ' + on.en, zh:'期限已於 ' + zh + '前屆至，' + on.zh}
               : {en:'Due in ' + en + ', ' + on.en, zh:'尚有 ' + zh + '，' + on.zh}
  };
}

/* Who else is competent to close this. The point of a shared task is that more
   than one person can close it, so the answer is a real list and never a
   silence. */
function ibxWhoElse(task, viewer){
  if(!task.act) return {list:[], note:IBX_T.nobody};
  const others = task.scope.filter(p => p !== viewer);
  if(!others.length) return {list:[], note:IBX_T.onlyYou};
  return {
    list: others,
    note: {en:'Also ' + others.map(p => ibxPersona(p).en).join(', '),
           zh:'另有 ' + others.map(p => ibxPersona(p).zh).join('、')}
  };
}

/* The selection lives in S.sel, contract section 1, because that is what drives
   the contextual action bar the floaters layer draws. Reading it back from
   there rather than keeping a private copy means clearing the selection from
   that bar clears it here too, with no wiring between the two files. */
function ibxSel(){
  return (S.sel && S.sel.kind === 'tasks' && Array.isArray(S.sel.ids)) ? S.sel.ids : [];
}
function ibxSetSel(ids){
  S.sel = {kind: ids.length ? 'tasks' : null, ids: ids.slice()};
}
function ibxTogglePick(id){
  const ids = ibxSel().slice();
  const i = ids.indexOf(id);
  if(i < 0) ids.push(id); else ids.splice(i, 1);
  ibxSetSel(ids);
}

/* Rows this persona may actually close. taskComplete refuses anything outside
   scope, so the bulk verb never offers work it would then be told off for. */
function ibxActionable(list, persona){
  return list.filter(t => t.act && t.state === 'open' && t.scope.indexOf(persona) >= 0);
}

/* ---------- the next deadline, for the empty state ------------------------ */

/* An empty list should say what it means and what happens next, not "no
   notifications". There is no open task to point at by definition, so this
   reaches past the task table into the same records the tasks are derived from
   and finds the soonest thing this persona is on the hook for. */
function ibxNext(persona, store){
  const now = Date.now();
  let best = null;
  const take = (at, pair) => {
    if(at == null || at <= now) return;
    if(!best || at < best.at) best = {at:at, what:pair};
  };

  if(persona === 'hq' || persona === 'legal'){
    /* The soonest unfiled statutory clock anywhere on the register. */
    openInc().forEach(i => {
      (i.cl || []).forEach(c => {
        if(i.filed && i.filed[c.k]) return;
        take(c.due, {en:c.k + ' for ' + i.id + ', ' + ibxCity(i.store),
                     zh:i.id + ' 的 ' + c.k + '，' + ibxCity(i.store)});
      });
    });
  }
  if(persona === 'hq' || persona === 'mgr'){
    /* The soonest drill interval that has not lapsed yet. */
    const codes = persona === 'mgr' ? [store] : Object.keys(DRILLS);
    codes.forEach(sc => {
      const d = DRILLS[sc] || {};
      Object.keys(d).forEach(cc => {
        const c = CBY[cc];
        if(!c) return;
        take(d[cc].due, {en:tx(c) + ' drill at ' + sc, zh:sc + ' 的' + tx(c) + '演練'});
      });
    });
  }
  if(persona === 'mgr' || persona === 'emp'){
    /* The soonest certification that has not expired yet. */
    const people = persona === 'emp'
      ? (S.me ? [S.me] : [])
      : (ROSTER[store] || []);
    people.forEach(e => {
      required(e).forEach(c => {
        const cs = certState(e, c.c);
        if(cs.s !== 'current' && cs.s !== 'expiring') return;
        take(cs.exp, {en:tx(c) + ' recertification for ' + e.name,
                      zh:e.name + ' 的' + tx(c) + '複訓'});
      });
    });
  }
  if(!best) return null;
  const w = ibxWhen(best.at);
  return {at:best.at, what:best.what, when:w};
}

/* ---------- the bell ------------------------------------------------------ */

/* The shipped bell at line 1156 of index.html was a dead button carrying an
   aria-label and a count of incidents with less than twelve hours on the clock.
   It is taken over in place rather than re-templated, because chrome() rebuilds
   the top bar on every render and re-templating it here would mean two files
   own the same markup. */
function ibxBell(){
  const b = document.querySelector('div.topbar button.bell') ||
            document.querySelector('header#topbar button.bell') ||
            document.querySelector('button.bell');
  if(!b) return null;
  const c = taskCount(S.persona, S.store);
  const sev = c.crit ? 'crit' : c.warn ? 'warn' : c.total ? 'info' : 'zero';
  const label = tx(IBX_N.badge(c));
  b.setAttribute('data-ibxbell', '1');
  b.setAttribute('type', 'button');
  b.setAttribute('aria-haspopup', 'dialog');
  b.setAttribute('aria-expanded', (S.nav && S.nav.inbox) ? 'true' : 'false');
  b.setAttribute('aria-label', label);
  b.setAttribute('title', label);
  b.innerHTML =
    '<svg class="ibx-bell-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M18 8a6 6 0 1 0-12 0c0 6-3 7-3 7h18s-3-1-3-7"/>' +
    '<path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>' +
    (c.total ? '<span class="ibx-bell-n ' + sev + '" aria-hidden="true">' + c.total + '</span>' : '');
  return b;
}

/* ---------- drawer mount, open and close ---------------------------------- */

function ibxMount(){
  if(document.getElementById('inbox')) return true;
  if(typeof INBOX_MARKUP === 'undefined') return false;
  const holder = document.createElement('div');
  holder.innerHTML = INBOX_MARKUP;
  /* Direct children of body, so the z scale in contract section 4 means what it
     says. A wrapper is one transform away from creating a stacking context and
     silently capping everything inside it. */
  while(holder.firstElementChild) document.body.appendChild(holder.firstElementChild);
  return true;
}

function ibxFocusable(){
  const d = document.getElementById('inbox');
  if(!d) return [];
  return [].slice.call(d.querySelectorAll(FOCUSABLE)).filter(el => el.offsetParent !== null);
}

function ibxOpen(trigger){
  if(!ibxMount()) return;
  const d = document.getElementById('inbox'), sc = document.getElementById('inboxscrim');
  if(!d || !sc) return;
  if(!S.nav) S.nav = {mega:false, rail:'open', palette:false, inbox:false};
  IBX.opener = (trigger && trigger.focus) ? trigger : document.activeElement;
  S.nav.inbox = true;
  clearTimeout(IBX.closeT);
  d.hidden = false; sc.hidden = false;
  document.body.classList.add('ibx-lock');
  ibxDrawerPaint();
  requestAnimationFrame(() => {d.classList.add('ibx-on'); sc.classList.add('ibx-on');});
  const f = ibxFocusable();
  if(f.length) f[0].focus(); else d.focus();
  const c = taskCount(S.persona, S.store);
  ibxSay({en:tx(IBX_T.live) + '. ' + IBX_N.countSay(c).en,
          zh:tx(IBX_T.live) + '。' + IBX_N.countSay(c).zh});
  ibxBell();
}

function ibxClose(restoreFocus){
  const d = document.getElementById('inbox'), sc = document.getElementById('inboxscrim');
  if(S.nav) S.nav.inbox = false;
  IBX.selmode = false;
  /* A selection must never outlive the surface that shows it. Left behind, it
     would raise the floating action bar over a console with no visible tick
     boxes, offering a verb against rows the user can no longer see. */
  if(ibxSel().length) ibxSetSel([]);
  document.body.classList.remove('ibx-lock');
  if(d) d.classList.remove('ibx-on');
  if(sc) sc.classList.remove('ibx-on');
  clearTimeout(IBX.closeT);
  IBX.closeT = setTimeout(() => {
    if(S.nav && S.nav.inbox) return;      /* reopened during the transition */
    if(d) d.hidden = true;
    if(sc) sc.hidden = true;
  }, REDUCED() ? 0 : 230);
  const back = IBX.opener;
  IBX.opener = null;
  if(restoreFocus){
    const bell = document.querySelector('button[data-ibxbell]');
    const target = (back && document.contains(back) && back.offsetParent !== null) ? back : bell;
    if(target && target.focus) target.focus();
  }
  ibxBell();
}

/* Escape is layered, contract section 7. The palette, the incident drawer and
   the full screen map overlay all sit above this drawer, so when one of them is
   open Escape belongs to it and this listener stands aside. */
function ibxAboveOpen(){
  if(S.nav && S.nav.palette) return true;
  if(typeof FL !== 'undefined' && FL && FL.pal && FL.pal.open) return true;
  const dr = document.getElementById('drawer');
  if(dr && dr.classList.contains('on')) return true;
  const mv = document.querySelector('div.mv');
  if(mv && mv.offsetParent !== null) return true;
  return false;
}

function ibxTrap(e){
  const f = ibxFocusable();
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){e.preventDefault(); last.focus();}
  else if(!e.shiftKey && document.activeElement === last){e.preventDefault(); first.focus();}
  else if(f.indexOf(document.activeElement) < 0){e.preventDefault(); first.focus();}
}

/* ---------- one task row -------------------------------------------------- */

/* opts.pick draws the bulk checkbox, opts.tag is li on the drawer and tr on the
   page. The note under each row is the teaching moment: it names, in a plain
   sentence and before anything is pressed, whose list this button empties. */
function ibxRowHTML(task, opts){
  opts = opts || {};
  const w = ibxWhen(task.due);
  const picked = ibxSel().indexOf(task.id) >= 0;
  const canAct = task.scope.indexOf(S.persona) >= 0;
  const clockCls = !w ? '' : (task.sev === 'crit' ? ' crit' : w.late ? ' late' : '');
  const pick = opts.pick && task.act && canAct
    ? '<div class="ibx-pick"><input type="checkbox" data-ibxpick="' + task.id + '"' +
      (picked ? ' checked' : '') + ' aria-label="' + esc(tx(IBX_T.pickOne) + ': ' + tx(task.title)) +
      '"></div>'
    : (opts.pick ? '<div class="ibx-pick"></div>' : '');

  const cta = task.act
    ? '<button type="button" class="btn sm" data-task="' + task.id + '"' +
      (canAct ? '' : ' disabled title="' + ibxTx(IBX_T.notYours) + '"') + '>' +
      ibxTx(task.cta) + '</button>'
    : '<button type="button" class="btn ghost sm" data-task="' + task.id + '">' +
      ibxTx(task.cta) + '</button>';

  const note = task.act ? IBX_T.clearsAll : IBX_T.clearsMe;

  return '<li class="ibx-row" data-ibxrow="' + task.id + '" data-sev="' + task.sev + '">' +
    pick +
    '<span class="ibx-dot" aria-hidden="true"></span>' +
    '<div class="ibx-main">' +
      '<p class="ibx-t">' + ibxTx(task.title) + '</p>' +
      '<p class="ibx-why">' + ibxTx(task.why) + '</p>' +
      '<p class="ibx-meta">' +
        '<button type="button" class="ibx-subj" data-ibxsubj="' + task.id + '">' +
          esc(task.subject.label) + '</button>' +
        (w ? '<span class="ibx-clock' + clockCls + '" title="' + ibxTx(w.full) + '">' +
             ibxTx(w.txt) + '</span>'
           : '<span class="ibx-clock">' + ibxTx(IBX_T.noClock) + '</span>') +
      '</p>' +
      '<p class="ibx-note">' + ibxTx(note) + '</p>' +
    '</div>' +
    '<div class="ibx-act">' + cta + '</div>' +
  '</li>';
}

/* The tick is drawn, not typed. The font stack is Noto Sans plus Noto Sans TC
   and a check mark character is not guaranteed in either, so a glyph here
   renders as tofu on a plain Linux box. */
function ibxDoneMarkHTML(shared){
  return '<span class="ibx-donemark"><span class="ibx-tick" aria-hidden="true">' +
    '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" ' +
    'stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 12.5 9.5 18 20 6.5"/></svg></span>' +
    ibxTx(shared ? IBX_T.doneAll : IBX_T.doneMe) + '</span>';
}

/* ---------- the drawer ---------------------------------------------------- */

function ibxScopeLine(persona){
  if(persona === 'hq') return IBX_T.scopeNet;
  if(persona === 'legal') return IBX_T.scopePriv;
  if(persona === 'mgr') return {en:'Store ' + S.store + ', ' + ibxCity(S.store),
                                zh:'門市 ' + S.store + '，' + ibxCity(S.store)};
  const me = S.me;
  return me ? {en:me.name + ', ' + me.id, zh:me.name + '，' + me.id}
            : {en:'One learner', zh:'單一學員'};
}

function ibxDrawerPaint(){
  const d = document.getElementById('inbox');
  if(!d) return;
  const persona = S.persona;
  const groups = taskGroups(persona, S.store);
  const c = taskCount(persona, S.store);
  const all = groups.reduce((a, g) => a.concat(g.tasks), []);
  const act = ibxActionable(all, persona);
  const sel = ibxSel().filter(id => {const t = taskById(id); return t && t.state === 'open';});

  const eye = d.querySelector('p.ibx-eyebrow');
  const ttl = d.querySelector('h2.ibx-title');
  const sum = d.querySelector('p.ibx-sum');
  const tools = d.querySelector('div.ibx-tools');
  const body = d.querySelector('div.ibx-groups');
  const foot = d.querySelector('footer.ibx-foot');
  const x = d.querySelector('button.ibx-x');

  if(x) x.setAttribute('aria-label', tx(IBX_T.close));
  if(eye) eye.textContent = tx(ibxPersona(persona)) + ' · ' + tx(ibxScopeLine(persona));
  if(ttl) ttl.textContent = tx(IBX_T.tasks);
  const shared = all.filter(t => t.act).length;
  if(sum){
    sum.innerHTML = c.total
      ? ibxTx(IBX_N.openIn(c.total)) + ' · ' +
        ibxTx(IBX_N.actSplit(shared, all.length - shared))
      : ibxTx(IBX_T.bellNone);
  }

  /* Header verbs. The bulk verb carries its count, because "Complete" alone
     makes the user scroll back up to find out what they are about to close and
     how much of it. */
  if(tools){
    let h = '';
    if(!IBX.selmode && act.length > 1){
      h += '<button type="button" class="btn ghost sm" data-ibx="selmode">' +
           ibxTx(IBX_T.selSeveral) + '</button>';
    }
    if(IBX.selmode){
      h += '<button type="button" class="btn sm" data-ibx="bulk"' + (sel.length ? '' : ' disabled') +
           '>' + ibxTx(IBX_N.completeN(sel.length)) + '</button>' +
           '<button type="button" class="btn ghost sm" data-ibx="selall">' +
           ibxTx(IBX_T.selectAll) + '</button>' +
           '<button type="button" class="btn ghost sm" data-ibx="cancel">' +
           ibxTx(IBX_T.cancel) + '</button>';
    }
    h += '<span class="ibx-grow"></span>';
    tools.innerHTML = h;
  }

  /* While a completed row is sitting in its done state the list is not rebuilt,
     or the row the user is being shown would be removed by the same render that
     is meant to be showing it. The header count above has already dropped,
     which is the honest order: the number falls the moment the work closed. */
  if(body && !IBX.hold){
    if(!c.total){
      body.innerHTML = ibxEmptyHTML(persona);
    }else{
      let h = '<div class="ibx-rules"><div class="ibx-rule"><h4>' + ibxTx(IBX_T.rulesShared) +
              '</h4><p>' + ibxTx(TASK_COPY.shared) + '</p></div></div>';
      groups.forEach(g => {
        if(!g.tasks.length) return;
        const open = !IBX.collapsed[g.key];
        h += '<section class="ibx-grp ' + g.key + '">' +
          '<button type="button" class="ibx-gh" data-ibxgrp="' + g.key + '" aria-expanded="' +
            (open ? 'true' : 'false') + '">' +
            '<span class="ibx-caret" aria-hidden="true"></span>' +
            '<span class="ibx-gl">' + ibxTx(g.label) + '</span>' +
            '<span class="ibx-gn">' + g.tasks.length + '</span>' +
            '<span class="vh">, ' + ibxTx(IBX_N.groupCount(g.tasks.length)) + '</span>' +
          '</button>';
        if(open){
          if(g.key === 'info'){
            h += '<div class="ibx-rule personal" style="border-radius:0;border-left-width:3px;' +
                 'border-top:none;border-right:none"><h4>' + ibxTx(IBX_T.rulesPersonal) +
                 '</h4><p>' + ibxTx(TASK_COPY.personal) + '</p></div>';
          }
          h += '<ul class="ibx-list">' +
               g.tasks.map(t => ibxRowHTML(t, {pick:IBX.selmode})).join('') + '</ul>';
        }
        h += '</section>';
      });
      body.innerHTML = h;
    }
  }

  if(foot){
    foot.innerHTML =
      '<p>' + ibxTx(TASK_COPY.badge) + '</p>' +
      '<div class="ibx-footrow">' +
        '<button type="button" class="btn ghost sm" data-ibx="page">' +
          ibxTx(IBX_T.openFull) + '</button>' +
        '<span class="ibx-grow"></span>' +
      '</div>';
  }
}

function ibxEmptyHTML(persona){
  const nx = ibxNext(persona, S.store);
  let box = '';
  if(nx){
    box = '<div class="ibx-nextbox"><p class="k">' + ibxTx(IBX_T.nextLabel) + '</p>' +
      '<p class="v">' + ibxTx(nx.what) + ' · <b>' + ibxTx(nx.when.txt) + '</b><br>' +
      '<span class="sub">' + ibxTx(ibxDate(nx.at)) + '</span></p></div>';
  }else{
    box = '<div class="ibx-nextbox"><p class="k">' + ibxTx(IBX_T.nextLabel) + '</p>' +
      '<p class="v">' + ibxTx(IBX_T.noNext) + '</p></div>';
  }
  return '<div class="ibx-empty"><h3>' + ibxTx(IBX_T.emptyTitle) + '</h3>' +
    '<p>' + ibxTx(IBX_T.emptyBody) + '</p>' + box + '</div>';
}

/* ---------- acting on a row ----------------------------------------------- */

/* The completed row is left on screen for about a second, carrying the sentence
   that says what just happened, and only then leaves. Removing it on click is
   faster and tells the user nothing about which of nine similar rows they just
   closed, or that closing it closed it for their colleague too. */
function ibxHold(ids, shared){
  IBX.hold = {ids:ids.slice(), until:Date.now() + 1050};
  ids.forEach(id => {
    ['li[data-ibxrow="' + id + '"]', 'tr[data-ibxrow="' + id + '"]'].forEach(selq => {
      const row = document.querySelector(selq);
      if(!row) return;
      row.classList.add('ibx-done');
      const cell = row.querySelector('div.ibx-act') || row.querySelector('td.ibx-actcell');
      if(cell) cell.innerHTML = ibxDoneMarkHTML(shared);
      const pick = row.querySelector('input[data-ibxpick]');
      if(pick) pick.disabled = true;
    });
  });
  clearTimeout(IBX.holdT);
  const wait = REDUCED() ? 700 : 1050;
  IBX.holdT = setTimeout(() => {
    const held = IBX.hold ? IBX.hold.ids : [];
    held.forEach(id => {
      ['li[data-ibxrow="' + id + '"]', 'tr[data-ibxrow="' + id + '"]'].forEach(selq => {
        const row = document.querySelector(selq);
        if(row) row.classList.add('ibx-leave');
      });
    });
    /* The full render is deferred to here rather than fired at click time,
       because on the full page render() rebuilds #app wholesale and would take
       the row away in the same frame that is meant to be showing it closed.
       Everything behind the drawer catches up one second late, which nobody can
       see, and the counts the user is looking at were updated immediately. */
    setTimeout(() => {IBX.hold = null; render();}, REDUCED() ? 0 : 240);
  }, wait);
}

/* The CTA. taskComplete throws on an informational row and taskClear throws on
   an actionable one, so the branch is on task.act and never on a guess. */
function ibxCta(id){
  const task = taskById(id);
  if(!task || task.state !== 'open') return;
  if(task.act){
    if(task.scope.indexOf(S.persona) < 0){
      ibxSay(IBX_T.notYours);
      return;
    }
    const out = taskComplete(id, S.persona);
    if(!out || !out.ok){
      if(out && out.reason && typeof flToast === 'function') flToast(out.reason, {kind:'warn'});
      else if(out && out.reason && typeof toast === 'function') toast(tx(out.reason));
      return;
    }
    /* The floaters layer wraps taskComplete and raises the toast with the undo,
       so raising one here as well would give the same action two toasts and two
       undo tokens for one task. Only speak up when that layer is absent. */
    if(!taskComplete._fl && typeof toast === 'function'){
      toast(tx(IBX_T.doneAll) + ': ' + task.subject.label);
    }
    ibxAfter([id], true);
  }else{
    taskClear(id, S.persona);
    if(typeof flToast === 'function') flToast(IBX_N.clearedMe(task.subject.label), {kind:'ok'});
    else if(typeof toast === 'function') toast(tx(IBX_N.clearedMe(task.subject.label)));
    ibxAfter([id], false);
  }
}

/* Personal read state only. Never touches the shared table, so the badge does
   not move, which is the whole point of contract section 0. */
function ibxMarkRead(id){
  if(typeof taskRead !== 'function') return;
  taskRead(id, S.persona);
  render();
}

function ibxAfter(ids, shared){
  ibxSetSel(ibxSel().filter(x => ids.indexOf(x) < 0));
  ibxHold(ids, shared);
  const c = taskCount(S.persona, S.store);
  ibxSay({en:(shared ? IBX_T.doneAll.en : IBX_T.doneMe.en) + '. ' + IBX_N.countSay(c).en,
          zh:(shared ? IBX_T.doneAll.zh : IBX_T.doneMe.zh) + '。' + IBX_N.countSay(c).zh});
  ibxLiveUpdate();
}

/* Every count that can move on this interaction, moved, without rebuilding the
   list the completed row is sitting in. The drawer body and the page table are
   deliberately left alone until the hold expires; everything that carries a
   number is not, because the number falling is the proof the click did what the
   sentence under the button said it would. */
function ibxLiveUpdate(){
  ibxBell();
  if(S.nav && S.nav.inbox) ibxDrawerPaint();
  const proof = document.querySelector('section.ibx-proof');
  if(proof && proof.parentNode){
    const holder = document.createElement('div');
    holder.innerHTML = ibxProofHTML();
    const fresh = holder.firstElementChild;
    if(fresh) proof.parentNode.replaceChild(fresh, proof);
  }
  const sub = document.querySelector('div.ibx-page div.pagehead div.sub');
  if(sub){
    const out = ibxPageRows();
    const c = taskCount(out.scope, ibxStoreArg());
    sub.innerHTML = esc(tx(ibxPersona(out.scope))) + ' · ' +
      ibxTx(IBX_N.openIn(c.total)) + ' · ' +
      ibxTx(IBX_N.rowsShown(out.rows.length, out.all));
  }
  if(!IBX.page) render();
}

/* Bulk. One toast, one undo, covering the batch. The floaters layer raises a
   toast per completed task, so its mute counter is held up for the duration and
   the batch speaks once, with an undo that reopens every row it closed, newest
   first so the restores unwind in the order they were applied. */
function ibxBulk(){
  const persona = S.persona;
  const ids = ibxSel().filter(id => {
    const t = taskById(id);
    return t && t.act && t.state === 'open' && t.scope.indexOf(persona) >= 0;
  });
  if(!ids.length) return;
  const muted = (typeof FL !== 'undefined' && FL && typeof FL.mute === 'number');
  if(muted) FL.mute++;
  const tokens = [], done = [];
  try{
    ids.forEach(id => {
      const out = taskComplete(id, persona);
      if(out && out.ok){done.push(id); if(out.token) tokens.push(out.token);}
    });
  }finally{
    if(muted) FL.mute--;
  }
  if(!done.length) return;

  const undo = function(){
    let n = 0;
    tokens.slice().reverse().forEach(tk => {
      const r = taskUndo(tk);
      if(r && r.ok) n++;
    });
    if(typeof flToast === 'function') flToast(IBX_N.batchBack(n), {kind:'warn'});
    else if(typeof toast === 'function') toast(tx(IBX_N.batchBack(n)));
    return {ok:true};
  };
  if(typeof flToast === 'function') flToast(IBX_N.batchDone(done.length), {kind:'ok', undo:undo});
  else if(typeof toast === 'function') toast(tx(IBX_N.batchDone(done.length)));

  IBX.selmode = false;
  ibxAfter(done, true);
}

/* The subject is the record, not a page restating the row, so this opens the
   incident drawer, the employee record or the store surface the other layers
   already own, and closes the drawer behind it. */
function ibxOpenSubject(id){
  const task = taskById(id);
  if(!task) return;
  const wasOpen = !!(S.nav && S.nav.inbox);
  if(wasOpen) ibxClose(false);
  if(typeof flOpenTask === 'function'){ flOpenTask(task); return; }
  if(typeof nvOpenSubject === 'function'){ nvOpenSubject(task); return; }
  const s = task.subject;
  if(s.type === 'incident' && typeof incDrawer === 'function') return incDrawer(s.id);
  if(s.type === 'employee' && typeof empDrawer === 'function') return empDrawer(s.id);
  if(typeof storeDrawer === 'function') return storeDrawer(s.store || S.store);
}

/* ---------- the full page ------------------------------------------------- */

function ibxScope(){
  const p = IBX.f.scope || S.persona;
  return TASK_PERSONAS.indexOf(p) >= 0 ? p : S.persona;
}
function ibxStoreArg(){
  const scope = ibxScope();
  if(scope === 'mgr') return IBX.f.store === 'all' ? S.store : IBX.f.store;
  return IBX.f.store === 'all' ? S.store : IBX.f.store;
}
function ibxPageRows(){
  const scope = ibxScope();
  let rows = tasksFor(scope, ibxStoreArg());
  const all = rows.length;
  if(IBX.f.store !== 'all') rows = rows.filter(t => t.store === IBX.f.store);
  if(IBX.f.kind !== 'all') rows = rows.filter(t => t.kind === IBX.f.kind);
  if(IBX.f.sev !== 'all') rows = rows.filter(t => t.sev === IBX.f.sev);
  return {rows:ibxSortRows(rows), all:all, scope:scope};
}
function ibxSortRows(list){
  const k = IBX.sort.k, d = IBX.sort.d;
  if(k === 'worst') return list.slice().sort(taskSort);
  const val = t =>
    k === 'sev'   ? TASK_SEV_RANK[t.sev] :
    k === 'due'   ? (t.due == null ? Infinity : t.due) :
    k === 'kind'  ? t.kind :
    k === 'store' ? (t.store || '') :
    k === 'who'   ? t.scope.join(',') :
                    tx(t.title);
  return list.slice().sort((a, b) => {
    const x = val(a), y = val(b);
    if(x < y) return -1 * d;
    if(x > y) return 1 * d;
    return taskSort(a, b);
  });
}

function ibxTh(key, label, extra){
  const on = IBX.sort.k === key;
  const dir = !on ? 'none' : (IBX.sort.d > 0 ? 'ascending' : 'descending');
  return '<th' + (extra || '') + ' aria-sort="' + dir + '">' +
    '<button type="button" class="ibx-th" data-ibxsort="' + key + '">' + ibxTx(label) +
    '<span class="ibx-arrow ' + (on ? (IBX.sort.d > 0 ? 'up' : 'down') : 'off') +
    '" aria-hidden="true"></span></button></th>';
}

/* ---------- the cross persona proof --------------------------------------- */

/* Four live counts, one per persona, from the one shared table. This is the
   panel that makes "it cleared for everyone" checkable instead of asserted: do
   the work in one console, watch the other three numbers move, and no role
   switch is needed to believe it. */
function ibxProofHTML(){
  const cells = TASK_PERSONAS.map(p => {
    /* Every persona is counted against the store the user is currently looking
       at, because that is the store whose informational rows are in play. hq
       and legal read the whole network for shared work either way. */
    const list = tasksFor(p, S.store);
    const c = taskCount(p, S.store);
    const shared = list.filter(x => x.act).length;
    const scopeLine = p === 'hq' ? IBX_T.scopeNet
      : p === 'legal' ? IBX_T.scopePriv
      : p === 'mgr' ? {en:'Store ' + S.store, zh:'門市 ' + S.store}
      : (S.me ? {en:S.me.name, zh:S.me.name} : {en:'One learner', zh:'單一學員'});
    return '<div class="ibx-pcell' + (p === S.persona ? ' now' : '') + '">' +
      '<p class="p">' + esc(tx(ibxPersona(p))) +
        (p === S.persona ? ' · ' + ibxTx(IBX_T.proofNow) : '') + '</p>' +
      '<p class="n">' + c.total + '</p>' +
      '<p class="b">' + (c.total
        ? ibxTx(IBX_N.actSplit(shared, c.total - shared))
        : ibxTx(IBX_N.nothingOut)) + '</p>' +
      '<p class="s">' + ibxTx(scopeLine) + '</p>' +
    '</div>';
  }).join('');
  return '<section class="ibx-proof" aria-label="' + esc(tx(IBX_T.proofTitle)) + '">' +
    '<p class="ibx-peye">' + ibxTx(IBX_T.proofEye) + '</p>' +
    '<h3>' + ibxTx(IBX_T.proofTitle) + '</h3>' +
    '<p>' + ibxTx(IBX_T.proofBody) + '</p>' +
    '<div class="ibx-pgrid">' + cells + '</div>' +
  '</section>';
}

/* ---------- export -------------------------------------------------------- */

/* Reuses the shipped csv() helper rather than a second serialiser, so the
   quoting rules are the ones the incident register and the roster already use.
   Both languages ship in the file, because a bilingual product that exports one
   language has quietly decided which half of its users the spreadsheet is for. */
function ibxExport(){
  if(typeof csv !== 'function') return;
  const out = ibxPageRows();
  const head = ['task_id','kind','severity','clears_for','scope','store','subject_type',
    'subject_id','subject_label','title_en','title_zh','why_en','why_zh','due_iso',
    'deadline_state','state'];
  const body = out.rows.map(t => {
    const w = ibxWhen(t.due);
    return [t.id, t.kind, t.sev, t.act ? 'everyone' : 'you only', t.scope.join(' '),
      t.store || '', t.subject.type, t.subject.id, t.subject.label,
      t.title.en, t.title.zh, t.why.en, t.why.zh,
      t.due == null ? '' : new Date(t.due).toISOString(),
      !w ? 'none' : (w.late ? 'overdue' : 'open'), t.state];
  });
  csv([head].concat(body), 'task-inbox-' + out.scope + '.csv');
  ibxSay(IBX_N.rowsShown(out.rows.length, out.all));
}

/* ---------- page mount ---------------------------------------------------- */

/* The console views are written by functions this file is not allowed to touch,
   and render() rebuilds #app wholesale every time, so the page is mounted after
   that rebuild and the console it replaces is hidden rather than removed. Every
   paint starts from fresh markup, so there is nothing to restore on the way
   out. */
function ibxPageMount(){
  const app = document.getElementById('app');
  if(!app) return;
  if(!IBX.page) return;
  if(S.module){ IBX.page = false; return; }

  /* Contract section 1 names the surface. The chrome layer recomputes
     S.route.surface from its own list on every mount and inbox is not in that
     list, so it is written back here, after that mount has run. */
  if(S.route) S.route.surface = 'inbox';

  const col = app.querySelector('div#shell div.nv-col');
  const host = col || app;
  [].slice.call(host.children).forEach(el => {
    if(el.classList.contains('nv-stack')) return;      /* subnav and mininav stay */
    if(el.classList.contains('ibx-page')) return;
    /* The top bar carries the bell and the proto banner is not removable,
       house rule 2, so neither is ever hidden. */
    if(el.classList.contains('topbar') || el.classList.contains('protobar')) return;
    /* display:none rather than the hidden attribute, because several of these
       nodes carry a display rule of their own and [hidden] loses to it. */
    el.style.display = 'none';
  });
  const wrap = document.createElement('div');
  wrap.innerHTML = ibxPageHTML();
  const page = wrap.firstElementChild;
  if(page) host.appendChild(page);
}

function ibxGoPage(open){
  IBX.page = !!open;
  if(open && S.route) S.route.surface = 'inbox';
  if(open) IBX.f.scope = S.persona;
  render();
  if(open){
    const h = document.querySelector('div.ibx-page h1');
    if(h){
      h.setAttribute('tabindex', '-1');
      h.focus();
    }
    ibxSay(IBX_T.pageTitle);
  }
}

/* ---------- paint --------------------------------------------------------- */

function ibxPaint(){
  ibxHookNav();
  /* A persona switch changes whose list this is, so a selection made in the
     previous persona's scope is dropped rather than carried into a bulk verb
     that would then be refused row by row, and the page's scope filter follows
     the role the user is actually in. */
  if(IBX.lastPersona !== S.persona){
    IBX.lastPersona = S.persona;
    IBX.f.scope = S.persona;
    if(ibxSel().length) ibxSetSel([]);
    IBX.selmode = false;
  }
  ibxBell();
  if(S.nav && S.nav.inbox) ibxDrawerPaint();
  ibxPageMount();
}

/* nvGo and flGo are the two navigation choke points. Leaving the full page is a
   navigation, so both are wrapped once, lazily, because flGo is defined in a
   part that merges after this one. */
function ibxHookNav(){
  if(IBX.navHooked) return;
  let hooked = 0;
  ['nvGo','flGo'].forEach(name => {
    const fn = window[name];
    if(typeof fn !== 'function' || fn._ibx) return;
    const wrapped = function(){ IBX.page = false; return fn.apply(this, arguments); };
    wrapped._ibx = true;
    window[name] = wrapped;
    hooked++;
  });
  if(hooked >= 2) IBX.navHooked = true;
}

/* ---------- events -------------------------------------------------------- */

/* One capture phase listener. Capture, because the shipped bubble handler at
   index.html line 2443 opens with two unqualified attribute selectors, one on
   data-close and one on data-persona, and the map overlay writes data-persona
   onto <html>. Once the map has been used, every click anywhere on the page
   matches that second selector and is swallowed by a persona switch. Handling
   this drawer's clicks before that handler sees them is the only way a modal
   mounted on <body> stays reliable.

   Every closest() below is qualified to a tag, house rule and contract section
   3, for exactly the reason above. */
document.addEventListener('click', function(e){
  if(!e.target || !e.target.closest) return;
  const inDrawer = !!e.target.closest('aside#inbox');
  const onScrim = !!e.target.closest('div#inboxscrim');
  const inPage = !!e.target.closest('div.ibx-page');
  let el;

  /* The bell. */
  if(el = e.target.closest('button[data-ibxbell]')){
    e.preventDefault(); e.stopPropagation();
    if(S.nav && S.nav.inbox) ibxClose(true); else ibxOpen(el);
    return;
  }

  if(onScrim){ e.stopPropagation(); ibxClose(true); return; }

  if(inDrawer || inPage){
    /* The drawer is modal, so nothing outside it may act on a click inside it.
       stopPropagation does not cancel a default action, so a checkbox in here
       still toggles and still fires change. */
    e.stopPropagation();
  }

  if(el = e.target.closest('button[data-ibx]')){
    const k = el.dataset.ibx;
    e.preventDefault();
    if(k === 'close'){ ibxClose(true); return; }
    if(k === 'selmode'){ IBX.selmode = true; ibxSetSel([]); ibxDrawerPaint(); return; }
    if(k === 'cancel'){ IBX.selmode = false; ibxSetSel([]); ibxDrawerPaint(); return; }
    if(k === 'selall'){
      const all = taskGroups(S.persona, S.store).reduce((a, g) => a.concat(g.tasks), []);
      ibxSetSel(ibxActionable(all, S.persona).map(t => t.id));
      ibxDrawerPaint();
      ibxSay(IBX_N.selectedN(ibxSel().length));
      return;
    }
    if(k === 'bulk'){ ibxBulk(); return; }
    if(k === 'page'){ ibxClose(false); ibxGoPage(true); return; }
    if(k === 'backconsole'){ ibxGoPage(false); return; }
    return;
  }

  if(el = e.target.closest('button[data-ibxgrp]')){
    e.preventDefault();
    const k = el.dataset.ibxgrp;
    IBX.collapsed[k] = !IBX.collapsed[k];
    ibxDrawerPaint();
    const btn = document.querySelector('button[data-ibxgrp="' + k + '"]');
    if(btn) btn.focus();
    return;
  }

  if(el = e.target.closest('button[data-ibxsubj]')){
    e.preventDefault(); e.stopPropagation();
    ibxOpenSubject(el.dataset.ibxsubj);
    return;
  }

  if(el = e.target.closest('button[data-ibxsort]')){
    e.preventDefault();
    const k = el.dataset.ibxsort;
    if(IBX.sort.k === k) IBX.sort.d = -IBX.sort.d;
    else IBX.sort = {k:k, d:1};
    render();
    const back = document.querySelector('button[data-ibxsort="' + k + '"]');
    if(back) back.focus();
    return;
  }

  if(e.target.closest('button[data-ibxexport]')){
    e.preventDefault(); e.stopPropagation();
    ibxExport();
    return;
  }

  /* The contract's own task attributes. The floaters layer stands down on both
     of these whenever #inbox is mounted, so there is exactly one handler. */
  if(el = e.target.closest('button[data-task]')){
    e.preventDefault(); e.stopPropagation();
    if(!el.disabled) ibxCta(el.dataset.task);
    return;
  }
  if(el = e.target.closest('button[data-taskread]')){
    e.preventDefault(); e.stopPropagation();
    ibxMarkRead(el.dataset.taskread);
    return;
  }

  /* Leaving the full page. Only navigation leaves it: the language and persona
     switches are not navigation and must not throw the user back to a console
     they did not ask for. */
  if(IBX.page && !inPage && !inDrawer){
    const b = e.target.closest('button');
    if(b && (b.closest('nav#railnav') || b.closest('nav#subnav') || b.closest('div#mininav') ||
             b.closest('div#botrail') || b.closest('div#meganav') ||
             b.hasAttribute('data-tab') || b.hasAttribute('data-go') ||
             b.hasAttribute('data-module') || b.hasAttribute('data-filter'))){
      IBX.page = false;
    }
  }
}, true);

document.addEventListener('change', function(e){
  const el = e.target;
  if(!el || !el.matches) return;
  if(el.matches('input[data-ibxpick]')){
    e.stopPropagation();
    const id = el.dataset.ibxpick;
    ibxTogglePick(id);
    /* The repaint destroys the checkbox that was just ticked, so focus is put
       back on its replacement by id. Without this a keyboard user is dropped on
       <body> after every tick, which is the bug the shipped render() already
       carries focusKey() to avoid. */
    if(S.nav && S.nav.inbox) ibxDrawerPaint(); else render();
    const back = document.querySelector('input[data-ibxpick="' + id + '"]');
    if(back) back.focus();
    ibxSay(IBX_N.selectedN(ibxSel().length));
    return;
  }
  if(el.matches('select[data-ibxf]')){
    e.stopPropagation();
    const k = el.dataset.ibxf;
    if(k === 'scope'){
      IBX.f.scope = el.value;
      /* A scope change can strand a selection made in another persona's list,
         and a hidden selection is how a bulk verb closes something the user
         cannot see. */
      ibxSetSel([]);
    }
    else IBX.f[k] = el.value;
    render();
    const back = document.querySelector('select[data-ibxf="' + k + '"]');
    if(back) back.focus();
    return;
  }
});

/* Escape is layered, contract section 7. This listener is on capture so it can
   stop the shipped bubble handler from closing the incident drawer underneath
   an open inbox, and it stands aside for every layer that sits above it. */
document.addEventListener('keydown', function(e){
  if(!S.nav || !S.nav.inbox) return;
  if(e.key === 'Escape'){
    if(ibxAboveOpen()) return;
    e.stopPropagation();
    e.preventDefault();
    ibxClose(true);
    return;
  }
  if(e.key === 'Tab'){
    if(ibxAboveOpen()) return;
    ibxTrap(e);
  }
}, true);

/* The floaters layer asks for the drawer by event rather than importing
   anything from this file. */
document.addEventListener('inbox:open', function(e){
  const opener = (e && e.detail && e.detail.opener) ||
                 document.querySelector('button[data-ibxbell]');
  if(S.nav && S.nav.inbox) return;
  ibxOpen(opener);
});
document.addEventListener('inbox:close', function(){ ibxClose(true); });

/* render() is wrapped rather than replaced, capturing whatever the layers that
   merged before this one left behind, so the chain composes in merge order. */
const IBX_BASE_RENDER = render;
render = function(){
  const out = IBX_BASE_RENDER.apply(this, arguments);
  try{ ibxPaint(); }catch(err){}
  return out;
};

function ibxBoot(){
  if(IBX.ready) return;
  if(!S.nav) S.nav = {mega:false, rail:'open', palette:false, inbox:false};
  if(!S.sel) S.sel = {kind:null, ids:[]};
  if(!S.route) S.route = {persona:S.persona, surface:null, tab:S.tab, filter:null, ctx:null};
  ibxMount();
  IBX.ready = true;
  render();
}

/* ---------- self test ----------------------------------------------------- */

/* Returned, not logged, so a gate can fail on it. Nothing here mutates state
   that survives the call: the one completion it performs is undone before the
   function returns, and the assertion that matters is the one after the undo. */
function ibxSelfTest(){
  const R = {};

  R.mounted = {pass: !!(document.getElementById('inbox') && document.getElementById('inboxscrim'))};
  R.bell = (function(){
    const b = document.querySelector('button[data-ibxbell]');
    return {pass: !!b && !!b.getAttribute('aria-label') && /\d|no|沒有/.test(b.getAttribute('aria-label')),
            label: b ? b.getAttribute('aria-label') : null};
  })();

  /* Every string this file can render ships both halves. */
  let half = 0, pairs = 0;
  const check = o => {
    if(!o || typeof o !== 'object') return;
    if(typeof o.en === 'string' || typeof o.zh === 'string'){
      pairs++;
      if(!o.en || !o.zh) half++;
      return;
    }
    Object.keys(o).forEach(k => {if(typeof o[k] === 'object') check(o[k]);});
  };
  check(IBX_T); check(IBX_KIND); check(IBX_SEV);
  ['openIn','groupCount','completeN','selectedN','batchDone','batchBack'].forEach(k => {
    check(IBX_N[k](2));
  });
  check(IBX_N.actSplit(2, 1)); check(IBX_N.nothingOut);
  ['groupCount','completeN','selectedN','batchDone','batchBack'].forEach(k => check(IBX_N[k](1)));
  R.plurals = {pass: IBX_N.batchDone(1).en.indexOf('1 item ') === 0 &&
                     IBX_N.batchDone(2).en.indexOf('2 items ') === 0,
               one: IBX_N.batchDone(1).en, many: IBX_N.batchDone(2).en};
  check(IBX_N.clearedMe('X')); check(IBX_N.rowsShown(1, 2));
  check(IBX_N.badge({crit:1, warn:1, info:1, total:3}));
  check(IBX_N.badge({crit:0, warn:0, info:0, total:0}));
  R.bilingual = {pass: half === 0, pairs: pairs, missingHalf: half};

  /* No dash or arrow glyph anywhere in the copy, house rule 1. Written as code
     points rather than as the characters themselves, because the merge in
     build-shell.py refuses to write a part that contains any of them, and a
     test that fails the build it is testing is not a test. */
  const bad = [];
  const BADGLYPH = /[\u2014\u2013\u2192\u2190\u21d2\u21d0]/;
  const sweep = o => {
    if(!o) return;
    if(typeof o === 'string'){
      if(BADGLYPH.test(o)) bad.push(o.slice(0, 40));
      return;
    }
    if(typeof o === 'object') Object.keys(o).forEach(k => sweep(o[k]));
  };
  sweep(IBX_T); sweep(IBX_KIND); sweep(IBX_SEV);
  R.glyphs = {pass: bad.length === 0, offenders: bad};

  /* The one that matters. A task in two personas' scope, closed by one of them,
     must leave the other persona's count as well. This is contract section 0
     expressed as an assertion rather than as prose. */
  R.clearsForEveryone = (function(){
    const shared = taskAll().filter(t =>
      t.act && t.state === 'open' && t.scope.length > 1 && taskOpen(t, t.scope[0]))[0];
    if(!shared) return {pass:true, skipped:'no multi scope task open'};
    const a = shared.scope[0], b = shared.scope[1];
    const before = {a:taskCount(a, shared.store).total, b:taskCount(b, shared.store).total};
    const muted = (typeof FL !== 'undefined' && FL && typeof FL.mute === 'number');
    if(muted) FL.mute++;
    const out = taskComplete(shared.id, a);
    if(muted) FL.mute--;
    if(!out || !out.ok) return {pass:false, reason:'complete refused', id:shared.id};
    const mid = {a:taskCount(a, shared.store).total, b:taskCount(b, shared.store).total};
    taskUndo(out.token);
    const after = {a:taskCount(a, shared.store).total, b:taskCount(b, shared.store).total};
    return {
      pass: mid.a === before.a - 1 && mid.b === before.b - 1 &&
            after.a === before.a && after.b === before.b,
      id: shared.id, personas: [a, b], before: before, afterComplete: mid, afterUndo: after
    };
  })();

  /* Dismissing a notice moves this person's count and nobody else's. */
  R.clearsForYouOnly = (function(){
    const info = taskAll().filter(t => !t.act && t.state === 'open')[0];
    if(!info) return {pass:true, skipped:'no informational task'};
    const mine = info.scope[0], other = info.scope[1] || info.scope[0];
    const before = {mine:taskCount(mine, info.store).total, other:taskCount(other, info.store).total};
    const n = taskNotif(mine, info.id);
    const prev = {read:n.read_at, cleared:n.cleared_at};
    taskClear(info.id, mine);
    const after = {mine:taskCount(mine, info.store).total, other:taskCount(other, info.store).total};
    n.read_at = prev.read; n.cleared_at = prev.cleared;
    const otherHeld = (mine === other) ? true : after.other === before.other;
    return {pass: after.mine === before.mine - 1 && otherHeld && info.state === 'open',
            id: info.id, before: before, after: after};
  })();

  /* The drawer never shows a row the badge did not count. */
  R.groupsMatchBadge = (function(){
    const bad2 = [];
    TASK_PERSONAS.forEach(p => {
      const c = taskCount(p, S.store).total;
      const g = taskGroups(p, S.store).reduce((a, x) => a + x.tasks.length, 0);
      if(c !== g) bad2.push(p + ' badge ' + c + ' groups ' + g);
    });
    return {pass: bad2.length === 0, offenders: bad2};
  })();

  /* Every open row in every persona's list can name somebody competent to close
     it, which is the claim the page's last column makes. */
  R.whoCanAct = (function(){
    let bad3 = 0;
    TASK_PERSONAS.forEach(p => {
      tasksFor(p, S.store).forEach(t => {
        if(t.act && !t.scope.length) bad3++;
      });
    });
    return {pass: bad3 === 0, offenders: bad3};
  })();

  R.pageRenders = (function(){
    try{
      const prev = IBX.f.scope;
      let n = 0;
      TASK_PERSONAS.forEach(p => {
        IBX.f.scope = p;
        const h = ibxPageHTML();
        if(typeof h === 'string' && h.length > 200) n++;
      });
      IBX.f.scope = prev;
      return {pass: n === TASK_PERSONAS.length, rendered: n};
    }catch(err){ return {pass:false, error:String(err && err.message || err)}; }
  })();

  return R;
}

/* ==========================================================================
   FLOATING LAYERS
   Shell contract 11, sections 3, 4 and 7. Owned by the floaters agent.

   Five layers, all children of <body>:

     #botrail    mobile primary nav below 900px           z 45
     #actionbar  contextual, rises when S.sel.ids fills   z 46
     #fab        one primary action per persona           z 44
     #toasts     the toast stack                          z 90
     #palette    command palette, Cmd K and Ctrl K        z 95

   Three things about this file that are load bearing and easy to undo by
   accident.

   1. Nothing here renders inside #app. render() repaints #app by assigning
      innerHTML, so a palette rendered in there would lose its input value and
      its caret on the next tick of the 60 second refresh, and a toast would
      vanish while somebody was reaching for its undo. Everything below is a
      sibling of #app, and floatPaint() repaints it after render() rather than
      during it.

      inside #app announces nothing at all, because it is a brand new node
      every repaint and the screen reader never gets to read the old one. The
      campaign sender learned this the hard way and left a comment about it.

      layer that closes a task raises the toast that carries the undo, exactly
      once, because there is one choke point instead of three call sites that
      have to remember. The inbox drawer does not have to know this file exists.

   Everything user visible ships English and Chinese in the same object. Colour
   is class names resolving to tokens in float.css.part; there is no colour
   literal in this file.
   ========================================================================== */

/* Contract section 1 state, created only if the chrome layer has not created

function flRoute(){
