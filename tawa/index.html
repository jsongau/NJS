/* ============ training assignment surface ============
   Mechanics lifted from docs/inspo/03-405-assignment-teardown.md, section 7.2,
   not the pixels: bulk selection first, a verb button carrying live counts, a
   plain sentence preview before anything is created, and an N of M completion
   counter beside a status. Four steps: who, what, when, confirm.
   Two things the 405 board does not have and this one must:
   department scoped eligibility, and a due date the manager cannot type. */
const ASGS={asg:['Assigned','已指派'],prog:['In progress','進行中'],done:['Complete','已完成']};
const asgLbl=k=>ASGS[k][LANG==='zh'?1:0];
const fshort=ms=>new Date(ms).toLocaleDateString(LANG==='zh'?'zh-TW':'en-US',{month:'short',day:'numeric'});

/* The team table and the roster picker read the same filtered list, so the
   filter chips govern both and "select all in Produce" means "select all the
   Produce people you can currently see". The old comparator was
   b.lv-a.lv||a.dept<b.dept?-1:1, which parses as (b.lv-a.lv||a.dept<b.dept)
   ?-1:1 and therefore returned -1 for every pair whose levels differ at all,
   in both directions. Parenthesised. */
function teamList(){const rs=ROSTER[S.store]||[];const f=S.filter;
  let list=rs.slice().sort((a,b)=>(b.lv-a.lv)||(a.dept<b.dept?-1:a.dept>b.dept?1:0));
  if(f==='overdue')list=list.filter(e=>empCompliance(e).bad>0);
  if(f==='expiring')list=list.filter(e=>empCompliance(e).soon>0);
  if(f==='ready')list=list.filter(e=>readiness(e).score>=80);
  return list;}

/* Eligibility is required(), the one rule the rest of the app already uses.
   Offering CMP-101 Supervisory to a cashier is the mistake a store manager
   spots in one second, so the picker never generates the pairing. */
const asgElig=(e,cc)=>required(e).some(c=>c.c===cc);
function asgPeople(){return S.assign.people.map(id=>EMPBY[id]).filter(Boolean)}
function asgOffer(ppl){const m={};ppl.forEach(e=>required(e).forEach(c=>{m[c.c]=(m[c.c]||0)+1}));
  return COURSES.filter(c=>m[c.c]).map(c=>({c:c,n:m[c.c]}));}
function asgBlocked(ppl){const m={};ppl.forEach(e=>required(e).forEach(c=>{m[c.c]=1}));
  return COURSES.filter(c=>!c.drill&&!m[c.c]);}
function asgWhy(c){const zh=LANG==='zh',b=[];
  if(c.sup===1)b.push(zh?'僅限主管職':'supervisory roles only');
  if(c.sup===0)b.push(zh?'僅限非主管':'non supervisory roles only');
  if(c.lv){const r=ROLES.find(x=>x.lv===c.lv);if(r)b.push(tx(r)+(zh?'以上':' and above'));}
  if(c.dp)b.push((zh?'僅限 ':'')+c.dp.map(d=>tx(dep(d))).join(zh?'、':', ')+(zh?'':' only'));
  return b.join(' · ')||(zh?'所選人員都不需要這門課':'nobody you selected is required to take it');}
function asgPrune(){const ppl=asgPeople();
  S.assign.courses=S.assign.courses.filter(cc=>ppl.some(e=>asgElig(e,cc)));}
function asgTotals(){const ppl=asgPeople(),rows=[];
  S.assign.courses.forEach(cc=>{const c=CBY[cc];if(!c)return;
    ppl.forEach(e=>{if(asgElig(e,cc))rows.push({emp:e.id,c:cc,due:NOW+c.gd*DAY})})});
  const rec={};rows.forEach(x=>rec[x.emp]=1);
  return{rows:rows,recip:Object.keys(rec).length,mods:S.assign.courses.length,
    earliest:rows.length?Math.min.apply(null,rows.map(x=>x.due)):null};}

/* Campaigns are held in memory per store. Two are seeded so the status and the
   completion counter have something to count on first load. Anything the
   manager creates here is flagged sent:0 and rendered as a preview. */
const CAMP={};
function campaigns(sc){if(CAMP[sc])return CAMP[sc];
  const rs=ROSTER[sc]||[],r=rng(hash(sc+'camp')),out=[];
  const seed=(cc,depts,ago)=>{const c=CBY[cc];if(!c)return;
    const ppl=rs.filter(e=>(!depts||depts.includes(e.dept))&&required(e).some(x=>x.c===cc));
    if(!ppl.length)return;const at=NOW-ago*DAY;
    out.push({id:'ASG-'+(2400+hash(sc+cc)%700),at:at,courses:[cc],sent:1,
      rows:ppl.map(e=>{const q=r();return{emp:e.id,c:cc,due:at+c.gd*DAY,s:q<.44?'done':q<.72?'prog':'asg'}})});};
  seed('CMP-150',null,26); seed('CMP-140',['RECV','PROD'],11);
  return CAMP[sc]=out;}

      ${groups.map(g=>`<div role="presentation" style="padding:6px 12px;background:#F4F2EC;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-muted)">${esc(tx(g.d))}</div>
        ${g.list.map(e=>`<div class="mrow" data-pickemp="${e.id}" role="option" tabindex="0" aria-selected="${f.emp===e.id}" style="padding:8px 12px;${f.emp===e.id?'background:var(--action-soft)':''}">
          <div class="g"><div class="t">${esc(e.name)}</div><div class="s">${esc(e.title)}</div></div>
          ${f.emp===e.id?'<span class="chip ok">✓</span>':''}</div>`).join('')}`).join('')}
      </div>
      ${inj?`<div class="hint">${LANG==='zh'?'自動帶入':'Auto-filled'}: ${esc(tx(dep(inj.dept)))} · ${esc(inj.title)} · ${LANG==='zh'?'主管':'Supervisor'} ${esc(sup?sup.name:' ')} · ${LANG==='zh'?'到職':'hired'} ${fdate(inj.hired)}</div>`:''}

    <div class="field"><label class="fl">4 · ${LANG==='zh'?'事故類型':'Incident type'}</label>
      <div class="pillbar">${ITYPES.map(l=>`<button class="pick" data-rtype="${l[0]}" aria-pressed="${f.type===l[0]}">${esc(LANG==='zh'?l[2]:l[1])}</button>`).join('')}</div></div>
    <div class="field"><label class="fl">5 · ${LANG==='zh'?'醫療處置':'Treatment level'}</label>

      <div class="pillbar">${[['y',LANG==='zh'?'是':'Yes'],['n',LANG==='zh'?'否':'No'],['u',LANG==='zh'?'不確定':'Unknown']].map(([k,l])=>`<button class="pick" data-rlost="${k}" aria-pressed="${f.lost===k}">${esc(l)}</button>`).join('')}</div></div>

const QUESTIONS={"CMP-101":[{"q":["A produce clerk has no supervisor title, but she writes the department schedule, assigns the work for each shift, and management acts on her recommendation when someone is disciplined. Which harassment prevention course does she need?","一位蔬果部同事沒有主管職稱，但部門排班表由她撰寫，每班的工作由她分派，管理層在懲處員工時也是依她的建議行事。她應完成哪一門性騷擾防治訓練？"],"o":[["The one hour non supervisory course, because her job title is clerk","一小時的非主管課程，因為她的職稱是店員"],["The two hour supervisory course, because the law defines supervisor by the authority actually exercised, not by the title","兩小時的主管課程，因為法規認定主管是看實際行使的職權，不是看職稱"],["No course at all, because she cannot hire or fire","完全不用上課，因為她不能決定雇用或解雇"],["The two hour course, but only after her title is formally changed","兩小時的主管課程，但要等她的職稱正式改了才上"]],"a":1,"x":["FEHA reaches anyone who assigns work, responsibly directs others, or effectively recommends discipline using independent judgment, so a shift lead or a scheduler can be supervisory while carrying a clerk title. Set the supervisory flag on the role, not on the person, so that a promotion starts the correct clock automatically. Authority: Gov. Code 12926(t) and Gov. Code 12950.1. VERIFY the definition and the two hour requirement before this drives a live assignment.","加州公平就業與住房法對「主管」的認定看的是實際行使的職權，不是職稱。凡是能分派工作、實質指揮他人，或其懲處建議會被採納並需要獨立判斷者，都可能屬於主管級。應把「是否為主管職」設在職務上而非個人身上，晉升時合規時鐘才會自動啟動。法源：Gov. Code 12926(t)、Gov. Code 12950.1。請人工查證（VERIFY）後再據以自動指派課程。"]},{"q":["A cashier mentions in passing that a back room lead keeps making comments about the body of another employee. That employee has not complained and asks you to leave it alone. What is your obligation as a supervisor?","一位收銀同事順口提到，後場的組長一再對另一位員工的身材發表評論。當事人並未申訴，還請你不要多管。身為主管，你的義務是什麼？"],"o":[["Respect the request and do nothing unless the employee files a written complaint","尊重她的要求，先不處理，除非員工提出書面申訴"],["Speak to the lead informally and keep it off the record so nobody is embarrassed","私下找組長談一談，不留紀錄，免得大家難堪"],["Report it through the company complaint process now, because the employer duty begins once the employer knows","現在就依公司申訴流程通報，因為雇主一旦知情，雇主的責任就開始了"],["Wait to see whether it happens again so you can describe a pattern","先觀察會不會再發生，這樣才能說明是不是慣性行為"]],"a":2,"x":["A supervisor who learns of possible harassment puts the employer on notice, and the duty to take reasonable steps to prevent and correct does not wait for a written complaint. Report it through the channel the policy names, tell the reporting employee what happens next, and do not promise a confidentiality you cannot deliver. Authority: Gov. Code 12940(k) and Gov. Code 12950.1. VERIFY.","主管知悉可能的騷擾行為，等同雇主已經知悉，而雇主採取合理措施預防與矯正的義務並不以書面申訴為前提。請立即依政策指定的管道通報，告知通報者接下來的處理流程，並且不要承諾你做不到的保密。法源：Gov. Code 12940(k)、Gov. Code 12950.1。請人工查證（VERIFY）。"]},{"q":["You are hiring twelve seasonal clerks for a holiday season that runs about ten weeks. Your usual practice is to put new hires into the harassment prevention batch that runs every six months. What is wrong with that plan?","你為期約十週的年節旺季雇用了十二位季節性員工。你們的慣例是把新進人員排入每半年一梯的性騷擾防治訓練。這個安排的問題在哪裡？"],"o":[["Nothing, six months is the standard deadline for every new hire","不用調整，六個月是所有新進人員的標準期限"],["Seasonal staff are exempt because they work less than six months","季節性人員可以免除，因為他們工作不到六個月"],["An employee hired to work less than six months carries a much shorter deadline, commonly stated as 30 calendar days after hire or 100 hours worked, whichever comes first","聘期不到六個月的員工，期限短很多，一般是到職後30個日曆天或工作滿100小時，以先到者為準"],["Seasonal staff need the two hour supervisory course instead","季節性人員要改上兩小時的主管課程"]],"a":2,"x":["The short tenure rule is the one a grocery chain breaks every holiday season, because the standard deadline lands after the seasonal employee has already left. Schedule the training in the first week and let the system trigger from expected tenure rather than from a batch calendar. Authority: Gov. Code 12950.1. VERIFY the 30 day and 100 hour figures before either becomes a countdown in the system.","短期雇用的規定，正是連鎖超市每年旺季最常違反的一條，因為一般期限往往落在季節性員工已經離職之後。請把訓練排在到職第一週，並讓系統依「預計在職期間」自動觸發，而不是依固定梯次的行事曆。法源：Gov. Code 12950.1。三十日與一百工時這兩個數字請人工查證（VERIFY）後，才可以在系統上顯示為倒數。"]},{"q":["Three of the receiving crew this month came from a staffing agency and are on the agency payroll. Your compliance dashboard shows all three as overdue for harassment prevention training. What is the right correction?","本月收貨組有三位人力是派遣公司派來的，薪資由派遣公司發放。合規儀表板顯示這三人的性騷擾防治訓練已逾期。正確的處理方式是什麼？"],"o":[["Enroll them in the store course and count them exactly like any other employee","把他們排進門市課程，並且比照一般員工計算"],["Delete them from the dashboard so the store number looks clean","把他們從儀表板刪掉，讓門市的數字好看"],["Record the requirement as carried by the temporary services employer, show that reason on screen, and confirm the agency has trained them","把訓練責任記在派遣公司身上，在畫面上顯示這個原因，並向派遣公司確認他們已完成訓練"],["Mark them exempt because they are not permanent staff","標記為免除，因為他們不是正職人員"]],"a":2,"x":["For workers supplied by a temporary services employer the training obligation sits with the agency, but a deleted row hides a real question and a blank row teaches nothing. Show the person, show that the duty belongs to the agency, and keep evidence that you asked. Authority: Gov. Code 12950.1. VERIFY, and note that you may still train agency workers on store specific conduct rules as a matter of policy.","派遣人力的性騷擾防治訓練義務落在派遣公司身上。但把資料列直接刪掉會掩蓋真正的問題，留白也無法說明任何事。正確做法是保留人員資料，在畫面上標明義務歸屬於派遣公司，並保存你已向派遣公司查證的紀錄。法源：Gov. Code 12950.1。請人工查證（VERIFY）。另外，門市仍可依內部政策對派遣人力實施店內行為規範訓練。"]},{"q":["An employee reports that a coworker has been harassing her. To keep the two apart while HR investigates, you move the reporting employee to an overnight shift she did not ask for and drop two of her weekend hours. What is the problem?","一位員工申訴同事對她進行騷擾。為了在人資調查期間把兩人分開，你把提出申訴的員工調到她並未要求的大夜班，並砍掉她兩個週末的工時。問題出在哪裡？"],"o":[["Nothing, separating the parties is standard practice during an investigation","沒有問題，調查期間把雙方分開是常見做法"],["The problem is only the lost hours, the shift change itself is fine","問題只在於工時變少，調班本身沒有問題"],["You should have moved both people to the overnight shift","應該把兩個人都調到大夜班"],["The change burdens the person who reported, which reads as retaliation, so any separation should fall on the accused or be genuinely neutral","這樣調動是把負擔加在提出申訴的人身上，看起來就是報復，要分開的話應該調動被指控的一方，或採取真正中立的做法"]],"a":3,"x":["Interim measures during an investigation are appropriate, but they must not penalise the person who came forward. An unwanted overnight shift and lost weekend hours are a detriment, and detriment following a protected complaint is what a retaliation claim is built from. Document the reason for any interim change and offer the reporting employee a choice. Authority: Gov. Code 12940(h) and Gov. Code 12950.1. VERIFY.","調查期間採取暫時性措施本身沒有問題，但這些措施不能懲罰站出來申訴的人。被迫改上大夜班、加上少掉的週末工時，都是實質不利益，而在受保護的申訴之後出現不利益，正是報復性對待主張的成立基礎。任何暫時性調整都要記錄理由，並讓申訴人有選擇權。法源：Gov. Code 12940(h)、Gov. Code 12950.1。請人工查證（VERIFY）。"]}],"CMP-102":[{"q":["On the night crew a stocker imitates the accent of a coworker and keeps using a nickname the coworker has asked him to stop using. Nothing sexual is said. Is this inside the scope of this training?","夜班理貨組有位同事一再模仿另一位同事的口音，並繼續使用對方已經請他停止使用的綽號。過程中沒有任何與性有關的言語。這種情況屬於本課程的範圍嗎？"],"o":[["No, harassment training covers sexual conduct only","不需要，騷擾訓練只涵蓋性方面的行為"],["Yes, the course must cover abusive conduct and harassment based on protected characteristics, and national origin is one of them","需要，課程必須涵蓋惡意言行，以及針對受保護特徵的騷擾，原國籍就是其中一項"],["Only if a supervisor personally witnesses it","只有主管親眼看到才需要"],["Only if the coworker files a formal complaint first","只有那位同事先提出正式申訴才需要"]],"a":1,"x":["California requires this training to include prevention of abusive conduct and to be inclusive of harassment based on protected characteristics. Mocking an accent is conduct tied to national origin, and continuing after being asked to stop is what turns a bad joke into a hostile environment. Say something, or report it. Authority: Gov. Code 12950.1. VERIFY.","加州要求本訓練必須涵蓋職場惡意行為（abusive conduct）的預防，並且要涵蓋針對受保護特徵的騷擾，原國籍即為其中之一。模仿口音屬於與原國籍相關的行為，而在對方明確要求停止後仍繼續，就是把一個不好笑的玩笑變成敵意工作環境的關鍵。請當場制止，或向上通報。法源：Gov. Code 12950.1。請人工查證（VERIFY）。"]},{"q":["The person making you uncomfortable is your own department manager, and the policy poster tells you to raise concerns with your department manager. What do you do?","讓你感到不舒服的人，正是你自己的部門經理，而政策海報上寫的是「有疑慮請向部門經理反映」。你該怎麼做？"],"o":[["Use the alternate channel the policy names, such as the store manager, HR, or the reporting line, because a procedure that dead ends at the accused is not a channel","改用政策中列出的其他管道，例如店長、人資或申訴專線，因為一個最後停在被指控者身上的流程根本不算管道"],["Wait until the manager is off shift and handle it yourself","等那位主管下班之後自己處理"],["Post about it publicly so other employees can corroborate","公開發文，讓其他員工出面佐證"],["Say nothing until you have another job lined up","先不要說，等找到下一份工作再說"]],"a":0,"x":["Every complaint procedure has to give you a route that does not run through the person you are complaining about. Use the alternate contact, write down the dates and what happened for your own record, and keep a copy. Reporting is protected activity and retaliation for it is separately unlawful. Authority: Gov. Code 12940 and Gov. Code 12950.1. VERIFY.","任何申訴程序都必須提供一條不必經過被申訴人的管道。請改用政策中列出的替代聯絡窗口，並自行以書面記下日期與事發經過，留存副本。提出申訴屬於受保護的行為，針對申訴的報復本身就是另一項違法行為。法源：Gov. Code 12940、Gov. Code 12950.1。請人工查證（VERIFY）。"]},{"q":["You see a vendor merchandiser repeatedly touching the shoulder and back of a bakery clerk after she has moved away from him twice. She has not said anything to anyone. What is the most useful thing you can do?","你看到一位廠商的陳列人員，在烘焙部同事已經兩次走開之後，仍反覆碰觸她的肩膀和背部。她並沒有向任何人提起。你能做的最有幫助的事是什麼？"],"o":[["Nothing, it is between them and the vendor is not our employee","不用處理，那是他們之間的事，廠商也不是我們的員工"],["Interrupt with something ordinary, such as asking her to help you at the counter, then report what you saw to a manager","用平常的理由打斷，例如請她過來櫃檯幫忙，之後再把看到的情況回報給主管"],["Confront the vendor and tell him he is committing harassment","當場質問廠商，告訴他這樣就是騷擾"],["Wait and see whether she reports it herself","先觀察她自己會不會通報"]],"a":1,"x":["A low key interruption ends the moment without forcing a confrontation, and the report is what puts the employer on notice so it can act. The employer duty extends to conduct by non employees such as vendors and contractors where the employer knows or should have known. You do not have to be the target in order to report. Authority: Gov. Code 12940(j). VERIFY.","用一句再平常不過的話打斷當下，可以立即中止情況，又不必逼任何人正面衝突；而後續的通報，才是讓公司知悉並得以處置的關鍵。雇主的責任也及於廠商、承攬商等非受僱人員的行為，只要雇主已知悉或應當知悉。你不必是被害人也可以通報。法源：Gov. Code 12940(j)。請人工查證（VERIFY）。"]},{"q":["A new hire says she completed the one hour harassment prevention course at her previous grocery employer about eighteen months ago and still has the certificate. How should the system treat that?","一位新進同事表示，她大約十八個月前在前一家超市完成了一小時的性騷擾防治課程，證書也還留著。系統應該如何處理這筆紀錄？"],"o":[["Waive the requirement permanently, she holds a certificate","永久免除這項要求，因為她有證明"],["Ignore it and start a fresh clock from her hire date with no credit considered","不予採計，從她的到職日重新起算，完全不看先前的訓練"],["Record the prior training with its date and let the recurring obligation run on the two year cycle, under a written rule about what evidence you accept","登錄先前訓練和日期，讓定期訓練依兩年週期繼續跑，並用書面規定寫清楚可以接受哪些證明"],["Require her to take it again only if she is promoted","只有在她升職時才要求重上"]],"a":2,"x":["The obligation recurs on a two year cycle, so prior compliant training with a date is evidence rather than a permanent waiver. Store the completion date so the next due date is computed instead of guessed, and write down which outside certificates you accept before a manager has to decide case by case. Authority: Gov. Code 12950.1. VERIFY the two year interval and the treatment of prior employer training before relying on either.","這項訓練義務以兩年為週期反覆發生，因此前雇主的合格訓練紀錄是「證據」，不是永久豁免。請把完訓日期存成資料，讓下一次到期日由系統計算而非人工猜測，並事先以書面訂出哪些外部證書可以採認，避免每次都由現場主管臨時判斷。法源：Gov. Code 12950.1。兩年週期以及採認前雇主訓練的做法，請人工查證（VERIFY）。"]},{"q":["A regular customer at the fish counter makes comments every week about the body of a clerk. She laughs it off in front of him, then tells you privately that she dreads his visits. What should happen?","一位常客每週都在水產櫃檯對一位同事的身材品頭論足。她當場笑笑帶過，事後私下告訴你，她很怕他來。接下來應該怎麼做？"],"o":[["Nothing formal, customers are not covered and she did not object to him at the time","不用正式處理，顧客不在規範內，而且她當下也沒有反對"],["Tell her to be more direct with the customer next time","告訴她下次對顧客要更直接一點"],["Report it so the store can act, because the employer duty covers harassment by customers once the employer knows, and a nervous laugh is not consent","通報讓門市處理，因為雇主一旦知情，顧客造成的騷擾也在雇主責任範圍內，而且尷尬賠笑不等於同意"],["Move her quietly to a different department","私下把她調到別的部門"]],"a":2,"x":["Harassment by customers and other non employees falls inside the employer duty once the employer knows or should know, and moving the clerk instead of addressing the customer shifts the burden onto the person who was harassed. Report it, let the store set the boundary with the customer, and check back with her afterwards. Authority: Gov. Code 12940(j). VERIFY.","一旦雇主知悉或應當知悉，顧客等非受僱人員所為的騷擾同樣落在雇主的責任範圍內。把同事調到別的部門，等於把代價轉嫁給被騷擾的人。正確做法是通報，由門市出面對該顧客劃出界線，事後再回頭關心當事人。法源：Gov. Code 12940(j)。請人工查證（VERIFY）。"]}],"CMP-110":[{"q":["A store manager asks whether every employee in the building needs a California food handler card. The building holds a checkout front end, a produce department, a packaged grocery floor, and a hot deli counter. What is the correct answer?","一位店長問你，這棟建築裡的每一位員工是否都需要加州食品從業人員證（Food Handler Card）。店內包含收銀前線、蔬果部、包裝食品賣場，以及一個熱食熟食櫃檯。正確的答案是什麼？"],"o":[["Yes, everyone who works somewhere that sells food needs a card","需要，只要在賣食品的地方工作，每個人都要有食品從業人員卡"],["No, nobody who works in a grocery store needs a card","不需要，在超市工作的人都不用這張卡"],["It depends on the facility and on the duties, because the statute lists exempt facility types that include grocery stores, while a hot deli or a separately permitted food facility inside the store may be a different answer","要看場所和實際工作內容，因為法規列出的免除場所類型包含超市，但熱食熟食區或店內另外領照的食品場所，答案可能不一樣"],["Only supervisors need a card, everyone else is covered by the store certificate","只有主管需要這張卡，其他人由門市的證書涵蓋"]],"a":2,"x":["Health and Safety Code 113948 lists exempt facility types and grocery stores appear on that list, described roughly as retail establishments primarily selling canned food, dry goods, fresh produce, fresh meat, fish and poultry. So a cashier or a packaged grocery clerk may well not need the statewide card, while a hot deli counter, a food court tenant, or a separately permitted food facility operating inside the store may be covered. Answer it per facility and per duty, never as a blanket yes or no. VERIFY, and treat this as the single highest value verification in the catalog. Confirm the subdivision letter, confirm whether the exemption attaches to the permit, to the establishment, or to the duties of the employee, and confirm with the local enforcement agency before any card requirement is switched on or off for a role.","Health and Safety Code 113948 列有豁免的設施類型，而雜貨店（grocery store）就在該清單上，其定義大致為主要販售罐頭食品、乾貨、生鮮蔬果、生鮮肉類、魚類與禽類的零售場所。因此收銀員或包裝食品區的理貨員很可能不需要全州的食品從業人員證；但店內的熱食熟食櫃檯、美食街承租戶，或另外領有許可證的食品營業場所，可能就是另一個答案。請依「設施」與「工作內容」個別判斷，絕不可一概而論。請人工查證（VERIFY）：這是本專案中價值最高的一項待查證事項。需確認法條的款次、確認豁免究竟是附著於許可證、營業場所本身，還是員工的實際職務，並在為任何職務開啟或關閉此項要求之前，先向當地稽查主管機關確認。"]},{"q":["Assume your legal review confirms that the packaged grocery floor at a given store sits inside the exemption, so those clerks do not need the statewide card. A department head concludes that food safety training for that crew can be dropped. Is that right?","假設法務審查已經確認，某家門市的包裝食品賣場屬於豁免範圍，因此該區同事不需要全州的食品從業人員證。某位部門主管於是認為，這組人的食品安全訓練可以取消。這樣對嗎？"],"o":[["Yes, the exemption removes the requirement, so the training becomes optional","是的，免除規定等於取消要求，訓練變成自由參加"],["No, the exemption removes the card, not the underlying duty for food employees to know safe practices, so the in house program still applies","不是，免除的是那張卡，不是食品從業人員必須懂安全作業的基本責任，所以公司內部的訓練還是要做"],["Yes, provided the store has a certified food safety manager on the payroll","是的，只要門市有聘任持證的食品安全管理人員就可以"],["No, but only for employees who handle unpackaged produce","不是，但只適用於處理未包裝生鮮的員工"]],"a":1,"x":["An exemption from the card is not an exemption from knowledge. Food employee knowledge obligations under the California Retail Food Code still apply, and an in house food safety program is a recognised way to meet them, which is why the catalog keeps the accredited card course and in house food safety fundamentals as two separate courses on two different clocks. VERIFY the exemption scope and the in house alternative with counsel and with the local enforcement agency.","豁免的是「證照」，不是「知識義務」。加州零售食品法規對食品從業人員的知識要求仍然適用，而店內自辦的食品安全訓練是被認可的達成方式之一。這也是課程目錄把「經認證的外部證照課程」與「店內食品安全基礎課程」拆成兩門、各自計算週期的原因。豁免範圍與店內替代方案，請與法務及當地稽查主管機關確認（VERIFY）。"]},{"q":["A new deli clerk at a facility your review confirms is not exempt asks who pays for the food handler course and when she has to take it. What is the correct answer under current California law?","在一個經審查確認「不屬於豁免範圍」的營業場所，一位新進熟食部同事問你：食品從業人員課程由誰付費，以及她必須在什麼時候完成。依加州現行法律，正確的答案是什麼？"],"o":[["She pays, on her own time, and she should have obtained the card before applying","她自己付費、用自己的時間去上，而且應該在應徵前就先拿到卡"],["The employer pays for the training and the exam, treats the time as hours worked with the employee relieved of other duties, and the card is obtained within the statutory window after hire","雇主負擔訓練和考試費用，這段時間算工作時間並免除其他工作，到職後在法定期限內取得卡"],["The employer pays only if she passes on the first attempt","只有她第一次就考過，雇主才付費"],["She has until her first performance review","她可以拖到第一次考績面談前再處理"]],"a":1,"x":["California amended the food handler rules so that the employer bears the cost of the training and the examination, the time is compensable and duty free, and an employer may not require an applicant to already hold a card as a condition of being hired. The deadline after hire is commonly cited as 30 days and the card is commonly cited as valid for three years from issuance. Authority: Health and Safety Code 113948 as amended by SB 476 (2023). VERIFY both intervals and the effective date before either becomes a countdown on screen.","加州已修法明定：訓練與考試的費用由雇主負擔，該段時間視為工作時間並支付工資，且員工在此期間應被免除其他工作職責；雇主亦不得以「應徵時已持有證照」作為錄用條件。到職後的取得期限常見引述為三十日，證照效期常見引述為自核發日起三年。法源：Health and Safety Code 113948，經 SB 476（2023）修正。兩項期間與生效日期，請人工查證（VERIFY）後才可在畫面上顯示為倒數。"]},{"q":["An enforcement officer at the deli asks for proof that the food handlers on duty hold valid cards. The cards are in a drawer at the district office. What does that tell you about how the records should be kept?","稽查人員在熟食區要求出示當班食品從業人員持有有效證照的證明，但證照都放在區部辦公室的抽屜裡。這件事告訴你紀錄應該怎麼保存？"],"o":[["Nothing, the card belongs to the employee so the facility carries no record duty","不用，卡是員工個人的，場所沒有保存紀錄的責任"],["Only the food safety manager certificate has to be kept on site","只有食品安全管理人員證書需要留在店內"],["A verbal statement from the manager on duty is sufficient","由值班主管口頭說明就足夠了"],["The facility itself must be able to produce records showing that each food handler it employs holds a valid card, on request, so the record has to live where the inspection happens","場所本身必須能在被要求時提出紀錄，證明所聘的每一位食品從業人員都持有有效的卡，所以紀錄要放在會被稽查的地方"]],"a":3,"x":["The food facility must maintain records documenting that each food handler it employs holds a valid card and make them available to the enforcement officer on request. Store the issue and expiry dates as data, keep the accepted evidence retrievable at the facility, and let the system flag an expiring card before an inspector does. Authority: Health and Safety Code 113948. VERIFY the accepted form of proof with your county.","食品營業場所必須保存文件，足以證明其僱用的每一位食品從業人員都持有有效證照，並在稽查人員要求時提供。請把核發日與到期日存成資料、把可採認的證明留在營業場所可即時調閱之處，並讓系統在證照到期前先示警，而不是等稽查人員先發現。法源：Health and Safety Code 113948。可採認的證明形式，請向所屬郡確認（VERIFY）。"]},{"q":["A store you are onboarding sits in a county that ran its own food handler program before the statewide card existed. Your rule engine currently assigns the statewide course to everyone. What should you do?","你正在導入的一家門市，位於一個在全州證照制度之前就已自行推動食品從業人員計畫的郡。你的規則引擎目前對所有人一律指派全州課程。你該怎麼做？"],"o":[["Nothing, the statewide card supersedes every county program","不用處理，全州的卡優先於所有郡的制度"],["Turn the requirement off for that county, since local programs are always more lenient","把那個郡的要求關掉，因為地方制度一定比較寬鬆"],["Scope the rule by the county of the store and confirm with that county environmental health department which credential it accepts","依門市所在的郡設定規則適用範圍，並向該郡的環境衛生局確認他們認可哪一種證明"],["Assign both the statewide course and the county course to everyone, to be safe","保險起見，全州課程和郡的課程都指派給每個人"]],"a":2,"x":["Several counties, commonly cited as San Diego, Riverside and San Bernardino, ran their own programs and are treated separately from the statewide card, so the correct model is a rule scoped by store county rather than one chainwide rule. Assigning both looks cautious but burns paid training hours and hides which credential actually satisfies the inspector. VERIFY the county list and each county requirement with the local environmental health department.","有數個郡在全州制度之前即自行推動食品從業人員計畫，常被引述的包括 San Diego、Riverside 與 San Bernardino，這些郡與全州證照分開處理。因此正確的模型是「依門市所在郡設定規則」，而不是全連鎖一體適用。兩種課程都指派看似保險，實際上白白消耗有薪訓練工時，也讓人分不清究竟哪一張證照才能通過稽查。郡別清單與各郡要求，請向當地環境衛生主管機關查證（VERIFY）。"]}],"CMP-111":[{"q":["The only person at your store holding the food safety manager certificate gives two weeks notice. The store manager plans to look for a replacement class once the position has been backfilled. What is the risk?","門市裡唯一持有食品安全管理員證照的人提出兩週後離職。店長打算等職缺補上之後再找課程。風險在哪裡？"],"o":[["No risk, the requirement attaches to the person, so it leaves with that person","沒有風險，這項要求是跟著個人走的，人走了就沒事"],["The requirement attaches to the facility, so the store is short a certificate holder the day that person walks out, and the cover has to be built before the resignation, not after","這項要求是跟著場所走的，那個人離開的當天門市就少了持證人，接手的人要在他離職前就先安排好，不是離職後才補"],["No risk while the store still has valid food handler cards on file","只要門市還有有效的食品從業人員卡紀錄就沒有風險"],["The district manager certificate covers every store in the district","區經理的證書可以涵蓋整個區的每一家門市"]],"a":1,"x":["Each food facility must have an owner or employee who has passed an approved and accredited food safety certification examination, so this is a store level coverage requirement rather than a personal credential. Treat zero current holders exactly like bench depth zero, and keep at least one certified backup at every store. Authority: Health and Safety Code 113947.1. VERIFY.","每一個食品營業場所都必須有一位業主或員工通過經核准且經認證的食品安全管理員考試，因此這是「門市層級的覆蓋要求」，不是個人資格。門市持證人數為零，應比照接班人深度為零看待，每家店至少要再培養一位備援持證人。法源：Health and Safety Code 113947.1。請人工查證（VERIFY）。"]},{"q":["A store shows exactly one certificate holder and that certificate was issued four years and eight months ago. The compliance screen shows the store as green. What is wrong?","某家門市顯示只有一位持證人，而該證照是四年八個月前核發的。合規畫面把這家店標示為綠燈。問題在哪裡？"],"o":[["Nothing, the certificate is still valid today","沒問題，這張證書今天還是有效的"],["The certificate expires after three years, so it is already invalid","證書三年就到期，所以已經失效了"],["Certificates do not expire once the store has passed its most recent inspection","只要門市通過最近一次稽查，證書就不會過期"],["The store is about to have zero holders, so a certificate approaching expiry should already be surfacing as a coverage warning rather than green","門市即將沒有任何持證人，所以快到期的證書早就應該跳出人力覆蓋警示，而不是顯示綠燈"]],"a":3,"x":["The certificate is commonly cited as valid for five years, so a store with a single holder near expiry is a coverage failure waiting for a date rather than a healthy store. Show the expiry as a countdown against a verified interval, and start the requalification early enough that an exam seat can actually be booked. Authority: Health and Safety Code 113947.3. VERIFY the five year term before it drives a countdown.","該證照的效期常被引述為五年。因此只有一位持證人、且證照即將到期的門市，並不是健康的店，而是一個只差日期就會出事的覆蓋缺口。到期日應以已查證的期間換算成倒數顯示，並提前啟動重新取證，才來得及排到考試名額。法源：Health and Safety Code 113947.3。五年效期請人工查證（VERIFY）後才可作為倒數依據。"]},{"q":["A deli manager says he does not need the food safety manager certification because he already holds a current food handler card. How do you answer?","一位熟食部經理說，他已經持有有效的食品從業人員證，所以不需要食品安全管理員證照。你要怎麼回答？"],"o":[["He is right, the handler card is the higher credential","他說得對，食品從業人員卡是比較高階的證明"],["They are different requirements: the handler card is an individual credential for food handlers, while the manager certification is a facility level requirement met by passing an accredited manager examination","這是兩種不同的要求，從業人員卡是食品從業人員的個人證明，管理人員證照則是場所層級的要求，必須通過認可的管理人員考試才算數"],["He is right if the store has fewer than ten food employees","如果門市的食品從業人員少於十人，他就是對的"],["He needs the manager certification only if he supervises more than five people","只有在他管理超過五個人時，才需要管理人員證照"]],"a":1,"x":["The handler card and the manager certification come from different sections of the code, cover different scope, and run on different clocks. Keep them as two separate requirements in the system so that a store cannot look compliant by counting handler cards. Authority: Health and Safety Code 113947.1 and 113948. VERIFY.","食品從業人員證與食品安全管理員證照出自不同法條，適用範圍不同，效期週期也不同。系統中必須維持為兩項獨立要求，否則門市只要累積一堆從業人員證，就會在畫面上看起來「已合規」。法源：Health and Safety Code 113947.1、113948。請人工查證（VERIFY）。"]},{"q":["A new store opens next month with no certified manager yet. A vendor tells your team there is a 60 day grace period and that the system should show a 60 day countdown. What is the right call?","下個月要開的新店目前還沒有持證的食品安全管理員。一家廠商告訴你們的團隊，有六十天的寬限期，系統應該顯示六十天倒數。正確的做法是什麼？"],"o":[["Build the 60 day countdown, the vendor works in this field every day","直接做60天倒數，這家廠商每天都在做這一行"],["Show the requirement as open, with no countdown, until the grace period is confirmed in the code text and with the enforcement agency, because a countdown on screen reads as a verified number","在法規條文和主管機關都確認寬限期之前，把這項要求顯示為待處理而且不做倒數，因為畫面上的倒數會被當成查證過的數字"],["Build a 30 day countdown instead, to be conservative","保守起見，改做30天倒數"],["Leave the requirement off the new store until it has been open a full quarter","新店開滿一整季之前，先不要把這項要求放上去"]],"a":1,"x":["A number on a screen is a claim. A 60 day figure is commonly cited for a newly opened facility or for a departed certificate holder, and it could not be confirmed to a subdivision, so the honest display is the requirement without a clock. Add the countdown on the day a human confirms the citation, not before. Authority: Health and Safety Code 113947.1 and following. VERIFY.","畫面上的數字就是一種主張。針對新開幕的營業場所或持證人離職，六十天的說法確實常見，但目前無法確認到具體款次，因此誠實的呈現方式是「顯示要求，但不顯示倒數」。等到有人完成法條查證的那一天，再把倒數加上去。法源：Health and Safety Code 113947.1 及其後條文。請人工查證（VERIFY）。"]},{"q":["During a routine inspection the officer asks to see the food safety manager certificate. The only copy is a photo on the personal phone of the previous manager. What is the correct practice?","例行稽查時，稽查人員要求出示食品安全管理員證照，但唯一的一份是前任經理個人手機裡的照片。正確的做法是什麼？"],"o":[["A photo on any device is acceptable evidence","存在任何裝置裡的照片都可以當作證明"],["Keep the original or an accepted copy available at the facility, with the holder name and expiry recorded as data, because evidence that lives on one personal device disappears when that person does","把正本或可接受的副本留在門市備查，並把持證人姓名和到期日建成資料，因為只存在某個人手機裡的證明，人走了就跟著不見"],["Certificates only need to be produced at the annual health permit renewal","證書只有在每年換發衛生許可時才需要提出"],["The corporate office can email it within five business days","總公司可以在五個工作天內用電子郵件補寄"]],"a":1,"x":["Compliance evidence that lives on a personal device is not retrievable by the store on the day it is asked for. Record the holder, the accrediting body, the issue date and the expiry as data, keep the accepted copy at the facility, and make the record survive turnover. Authority: Health and Safety Code 113947.1 and following. VERIFY the exact form of proof your county accepts.","存在個人裝置裡的合規證明，在被要求出示的那一天，門市根本調不出來。請把持證人、發證機構、核發日與到期日存成資料，把可採認的副本留在營業場所，讓紀錄能撐過人員異動。法源：Health and Safety Code 113947.1 及其後條文。所屬郡可接受的證明形式，請人工查證（VERIFY）。"]}],"CMP-120":[{"q":["A stocker tells you the electric pallet jack has been drifting left for about two weeks and that nobody wrote it up. The truck is in use right now in a grocery aisle with customers around. What do you do first?","一位理貨同事告訴你，電動拖板車已經往左偏大約兩週了，而且沒有人寫過異常單。這台車現在正在有顧客走動的賣場走道上使用中。你的第一個動作是什麼？"],"o":[["Finish the shift with it and write it up at the end of the day so the load gets out on time","先撐完這一班，下班前再寫報告，這樣貨才出得去"],["Take it out of service now, tag it so nobody uses it, and record the hazard and the correction in the program records","立刻停用，掛上標示避免有人使用，並把危害和改善情形登錄在計畫紀錄裡"],["Tell the stocker to steer against the drift and keep the speed down","叫理貨員往反方向修正、放慢速度就好"],["Ask the stocker to write it up himself, since he is the one who found it","請理貨員自己寫報告，因為是他發現的"]],"a":1,"x":["The employer must identify and correct unsafe conditions in a timely manner, and a two week old known defect on a powered truck in a public aisle is not timely. Remove it from service, tag it, log the hazard and the correction with a date and a named owner, then find out why two weeks of verbal reports went nowhere. That second question is the program failure. Authority: 8 CCR 3203. VERIFY.","雇主必須及時發現並改正不安全狀況；一個已知兩週、發生在有顧客走道上的動力搬運設備缺陷，顯然不叫及時。請立即停用、掛牌隔離，並把危害與改正措施連同日期與負責人記錄下來，接著追查「為什麼兩週的口頭反映都沒有下文」。後面這個問題才是計畫本身的失效點。法源：8 CCR 3203。請人工查證（VERIFY）。"]},{"q":["A new hire finishes the general orientation video on day one and is put on the cardboard baler the same afternoon, because the regular operator called out. Is the training obligation met?","一位新進同事在到職第一天看完一般性的新人訓練影片，當天下午因為固定操作人員請假，就被安排去操作紙箱壓縮打包機。訓練義務算是完成了嗎？"],"o":[["Yes, orientation covers general safety for all equipment","算，新人訓練已經涵蓋所有設備的一般安全"],["No, training is owed on the hazards specific to the assignment, so baler training is due before that assignment, not after","不算，訓練要針對該項工作特有的危害，所以壓縮打包機的訓練要在派工前完成，不是事後才補"],["Yes, provided a coworker watches him the first time","算，只要第一次操作時有同事在旁邊看著"],["No, but only if he is under eighteen","不算，但僅限於他未滿十八歲的情況"]],"a":1,"x":["The program requires training when an employee is given a new assignment for which training has not previously been received, which means hazard specific training before the person touches the equipment. Blocking the assignment until the training record exists is the control, and a callout is exactly when that discipline slips. Authority: 8 CCR 3203(a)(7). VERIFY, and note separately that other rules restrict minors from operating balers and compactors.","計畫要求：當員工被指派到過去未受過訓練的新工作時，必須施予該項訓練，也就是「先完成該設備的危害訓練，才可以碰設備」。真正的控制手段，是在訓練紀錄成立之前擋住這項指派，而人手臨時請假正是這道紀律最容易鬆掉的時候。法源：8 CCR 3203(a)(7)。請人工查證（VERIFY）。另請注意，未成年員工操作壓縮打包機與垃圾壓縮機另有法規限制。"]},{"q":["Two employees tell you privately about a leaking freezer case in the back aisle, but neither will put a name on a hazard report because the last person who reported something got talked about. What does the program require you to fix?","兩位員工私下告訴你後段走道有一台冷凍櫃在漏水，但兩人都不願意在危害通報單上具名，因為上次通報的人後來被同事議論。依計畫要求，你必須修正的是什麼？"],"o":[["The communication system itself, which must let employees report hazards without fear of reprisal, so add an anonymous route and deal with the culture that produced the fear","溝通制度本身，制度必須讓員工能通報危害又不必擔心被報復，所以要加上匿名管道，並處理造成這種恐懼的風氣"],["Nothing, the hazard reached you, so the system worked","不用改，危害有傳到你這裡，代表制度有用"],["Require named reports so that the store can follow up properly","要求一律具名通報，門市才好追蹤處理"],["Move the two employees to a different shift","把那兩位員工調到別的班"]],"a":0,"x":["The program requires a system for communicating with employees on health and safety matters in a form readily understandable, including a way to report hazards without fear of reprisal. If people will only tell you off the record, the reporting system is broken even on the days the hazard still gets fixed. Fix the leak, then fix the channel. Authority: 8 CCR 3203(a)(3). VERIFY.","計畫要求建立一套員工看得懂、用得上的安全衛生溝通機制，其中必須包含「可以在不擔心遭到報復的情況下通報危害」的管道。如果同事只肯私下講，即使這次危害仍然被修好了，通報機制本身已經失效。先修漏水，再修管道。法源：8 CCR 3203(a)(3)。請人工查證（VERIFY）。"]},{"q":["The safety committee walked the store, found a blocked exit path in receiving, and the crew cleared it within the hour. Nothing was written down, because the problem was solved immediately. What is missing?","安全委員會巡店時發現收貨區的逃生通道被堵住，現場同仁一小時內就清空了。因為問題當場解決，所以沒有留下任何書面。少了什麼？"],"o":[["Nothing, a hazard that has been corrected needs no record","不用，已經改善完成的危害不需要留紀錄"],["The record of the inspection, the hazard found, the correction and its date, because the documentation is what proves the program is actually running","檢查紀錄、發現的危害、改善措施和改善日期，因為文件才能證明這套計畫真的有在運作"],["A photograph, which regulation requires in every case","照片，法規規定每一次都要拍照"],["A report to Cal/OSHA, which is required for every blocked exit","向 Cal/OSHA 通報，只要出口被擋住就一定要通報"]],"a":1,"x":["An undocumented correction is invisible to an inspector, to the next manager, and to any analysis of repeat hazards. Record the inspection, the hazard, who owned the fix and when it closed. Repeat entries at the same location are the signal worth having, and you only get that signal if the first one was written down. Authority: 8 CCR 3203(a)(4) and 3203(b). VERIFY the required retention period before the system enforces one.","沒有留下紀錄的改正，對稽查人員、對下一任主管、對任何「重複性危害」的分析而言，等於沒有發生過。請記錄巡檢、發現的危害、負責改正的人以及結案日期。同一地點反覆出現的紀錄，才是真正有價值的訊號，而這個訊號的前提，是第一次就有寫下來。法源：8 CCR 3203(a)(4)、3203(b)。文件保存年限請人工查證（VERIFY）後，系統才可據以強制。"]},{"q":["You ask three managers who is responsible for the injury and illness prevention program at their store and you get three different answers, one of which is the corporate safety inbox. What does the program require?","你問三位主管：貴店的傷害與疾病預防計畫由誰負責？結果得到三個不同答案，其中一個是「總部安全信箱」。計畫本身的要求是什麼？"],"o":[["Any of these is acceptable as long as somebody answers","以上任何一種都可以，只要有人出面回應就行"],["The program must identify the person or persons with authority and responsibility for implementing it, named by job title so that turnover does not erase the answer","計畫必須明確指出有權責推動計畫的人員，並以職稱列出，這樣人員異動也不會讓答案消失"],["Responsibility always sits with the chief executive by regulation","依規定責任一律落在最高負責人身上"],["Responsibility sits with the safety committee chair and nobody else","責任只在安全委員會主席身上，其他人都沒有"]],"a":1,"x":["The program must identify who holds authority and responsibility for implementing it. Name the role by title, publish it at the store, and make sure the named role also holds the authority to spend money and to stop work, because responsibility without authority is a paper answer that produces exactly the three answers you just heard. Authority: 8 CCR 3203(a)(1). VERIFY.","計畫必須明確指出「由誰擁有推動本計畫的職權與責任」。請以職稱指定、在門市公告，並確認被指定的職務同時握有動用預算與令其停工的權限。有責任而無權限，就是一個紙上答案，也正是你剛才會聽到三種說法的原因。法源：8 CCR 3203(a)(1)。請人工查證（VERIFY）。"]}],"CMP-121":[{"q":["You are taking over the forklift on the receiving dock at 06:00. The opener ran it for two hours and left it idling. Three trailers are waiting. What is the correct start?","早上六點，你要接手收貨碼頭的堆高機。開店的同事已經開了兩小時，車子還怠速著沒熄火，外面還有三台拖車在等。正確的開始方式是什麼？"],"o":[["Start moving freight, the truck was already inspected today and has been running fine","直接開始搬貨，這台車今天已經檢查過，而且一直很正常"],["Complete your own documented inspection before you operate it, because the check belongs to the operator taking the truck and is required at least each shift where trucks run around the clock","操作前自己完成一次有紀錄的檢查，因為檢查是接手這台車的操作人員的責任，車輛全天候使用時至少每一班都要做一次"],["Do a quick visual walk around only, since a full check would hold up the trailers","只快速繞車看一圈就好，做完整檢查會卡到拖車"],["Ask the opener whether anything felt wrong and take his word for it","問早班的人有沒有覺得哪裡怪怪的，聽他說就好"]],"a":1,"x":["Powered industrial trucks must be examined before being placed in service, at least daily, and where trucks are used around the clock, before each shift. The operator taking the truck owns that check, and a recorded check is the only version that survives a question three months later. Authority: 29 CFR 1910.178(q)(7), with operator training and evaluation at 1910.178(l). VERIFY.","動力工業車輛在投入使用前必須檢查，至少每日一次；若車輛全天候輪班使用，則每一班次開始前都要檢查。這項檢查屬於「接手車輛的操作人員」，而且只有留下紀錄的版本，三個月後被問起時才站得住腳。法源：29 CFR 1910.178(q)(7)；操作人員訓練與評核見 1910.178(l)。請人工查證（VERIFY）。"]},{"q":["On your pre shift check the horn does not sound and the seat restraint latch is cracked. The truck drives normally and a refrigerated trailer is waiting with a driver on a clock. What do you do?","班前檢查時你發現喇叭不響，安全帶扣具也有裂痕。車子開起來一切正常，外面還有一台冷藏拖車在等，司機也在趕時間。你該怎麼做？"],"o":[["Operate carefully and shout a warning at blind corners until maintenance can look at it","小心操作，在死角處大聲提醒，等維修人員來看"],["Take the truck out of service, report the defects, and use another method until it has been repaired, because a truck in unsafe condition must not be operated","把車停用、通報故障，修好之前改用其他方式作業，因為狀況不安全的堆高機不可以操作"],["Use it only inside the warehouse where there are no customers","只在沒有顧客的倉庫裡面使用"],["Have a coworker walk ahead of the truck as a spotter for the rest of the shift","這一班剩下的時間請同事走在車子前面幫忙引導"]],"a":1,"x":["If an examination shows a condition that makes the truck unsafe, the truck must be taken out of service until it has been restored to safe operating condition. A horn and an operator restraint are not comfort items, they are the two controls that matter most on a shared dock. Tag it, report it, and escalate the waiting trailer to your supervisor rather than solving that problem yourself with an unsafe truck. Authority: 29 CFR 1910.178(p) and 1910.178(q). VERIFY.","檢查若發現任何使車輛處於不安全狀態的狀況，該車必須停止使用，直到修復至安全可用狀態為止。喇叭與駕駛約束裝置不是舒適配備，而是人車共用碼頭上最關鍵的兩項防護。請掛牌停用、回報缺失，並把「拖車在等」這件事往上呈報給主管處理，而不是自己用一台不安全的車去解決它。法源：29 CFR 1910.178(p)、1910.178(q)。請人工查證（VERIFY）。"]},{"q":["The receiving dock aisle is also the route the deli crew uses to reach the compactor. You are reversing a loaded truck and a clerk steps into the aisle behind you carrying boxes. Beyond stopping right now, what is the durable fix?","收貨碼頭的通道，同時也是熟食部同仁前往垃圾壓縮機的必經路線。你正在倒車，一位同事抱著箱子從你後方走進通道。除了立刻停車之外，能持久解決問題的做法是什麼？"],"o":[["Tell the clerk to watch out for the forklift next time","叫那位店員下次注意堆高機"],["Raise the shared route as a hazard so that pedestrian and truck traffic are separated by marked walkways, barriers or timing, and treat the near miss as reportable","把人車共用的動線列為危害提報，用劃線人行道、護欄或錯開時段把行人和堆高機分流，並把這次差點出事的情況當成應通報事件"],["Sound the horn continuously while reversing so that pedestrians know","倒車時一直按喇叭，讓行人知道"],["Only reverse when the deli crew is on their break","只在熟食部同事休息時才倒車"]],"a":1,"x":["Behaviour reminders fail on a route that mixes pedestrians and powered trucks, because the next person carrying boxes will not see you either. Stop immediately, then get the route separated by marking, barriers or scheduling, and record the near miss so that the fix has evidence behind it. A near miss is also a trigger to re evaluate the operator. Authority: 29 CFR 1910.178, with hazard correction under 8 CCR 3203. VERIFY.","在人車混流的通道上，光靠「叫大家小心」一定會失敗，因為下一個抱著箱子的人同樣看不到你。請立即停車，接著把路線以標線、實體隔離或時段錯開的方式分流，並把這次的虛驚事件記錄下來，讓改善有依據。虛驚事件同時也是重新評核操作人員的觸發條件。法源：29 CFR 1910.178；危害改正見 8 CCR 3203。請人工查證（VERIFY）。"]},{"q":["A pallet of bottled water has been double stacked and the top layer is leaning. Your quickest route to the cooler crosses the sales floor, and you would rather carry the load high so you can watch the edge of the pallet. What is correct?","一板瓶裝水被疊成兩層，上層已經歪斜。你到冷藏區最快的路線要穿過賣場，而你會想把貨叉抬高一點，這樣才看得到棧板邊緣。正確做法是什麼？"],"o":[["Carry it high and travel slowly so that you can watch the load","把貨舉高、慢慢開，這樣才看得到貨的狀況"],["Travel high but take the back aisle so that no customers are exposed","舉高行駛，但走後面的走道，這樣不會影響到顧客"],["Ask a coworker to walk alongside and steady the top layer","請同事走在旁邊扶著最上層"],["Restack or secure the load first, then travel with the forks low and tilted back, because an elevated load raises the centre of gravity and an unstable load must not be moved","先重新堆疊或固定貨物，再把貨叉放低並且後傾行駛，因為舉高會拉高重心，不穩的貨物不可以移動"]],"a":3,"x":["Loads must be stable and safely arranged, and travel is done with the load as low as practicable and tilted back. Raising a leaning load moves the centre of gravity up and outward, which is how a tip over begins, and no coworker should ever become a hand holding an unstable load. Restack it, then move it. Authority: 29 CFR 1910.178(o). VERIFY.","載重必須穩固且排列妥當，行進時貨叉應盡可能放低並後傾。把已經歪斜的貨抬高，等於把重心往上、往外移動，翻車就是這樣開始的；也絕不該讓同事用手去扶不穩的貨。請先重新堆疊或固定，再行駛。法源：29 CFR 1910.178(o)。請人工查證（VERIFY）。"]},{"q":["A newly hired night stocker says he ran a forklift for six years at a distribution centre and offers to move pallets while the receiver is busy. There is no training or evaluation record for him at your company. Can he operate?","一位新進的夜班理貨同事說，他在物流中心開了六年堆高機，主動表示可以在收貨人員忙的時候幫忙搬棧板。但公司內部沒有他的訓練或評核紀錄。他可以操作嗎？"],"o":[["Yes, six years of experience is worth more than any course you could give him","可以，六年經驗比你能給他的任何課程都有用"],["No, only employees trained, evaluated and certified by this employer for this truck type and this workplace may operate, and prior experience can shorten the training but never replaces the evaluation","不可以，只有經過本雇主針對這個車型和這個工作場所完成訓練、實地評估並認可的員工才能操作，過去的經驗可以縮短訓練時間，但不能取代評估"],["Yes, if a supervisor watches the first pallet","可以，只要第一板貨有主管在旁邊看著"],["Yes, for indoor moves only","可以，但僅限室內搬運"]],"a":1,"x":["The employer must certify that each operator has been trained and evaluated, and the certification is specific to the truck type and to the conditions of your workplace. Prior experience can be credited against the training content, but the evaluation and the record are still yours to complete. Refresher evaluation is commonly cited as at least once every three years, and is separately triggered by an accident, a near miss, observed unsafe operation, or a change in equipment or workplace conditions. Authority: 29 CFR 1910.178(l). VERIFY the three year interval.","雇主必須就每一位操作人員完成訓練與評核並出具認證，而該認證是針對「車種」與「本工作場所的實際條件」而定。過去的經驗可以折抵訓練內容，但評核與紀錄仍必須由本公司完成。回訓評核常被引述為至少每三年一次，另外在發生事故、虛驚事件、被觀察到不安全操作，或設備與作業環境改變時也會觸發。法源：29 CFR 1910.178(l)。三年這個週期請人工查證（VERIFY）。"]}],"CMP-130":[{"q":["A clerk clocks in at 08:00 for an eight hour shift. The front end gets busy and you send her to lunch at 13:40. She takes a full uninterrupted 30 minutes. Is the meal period compliant?","一位同事上午八點打卡，排班八小時。前線很忙，你到十三點四十分才讓她去用餐，她完整休息了三十分鐘，中間沒有被打斷。這段用餐時間合規嗎？"],"o":[["Yes, she received a full uninterrupted 30 minutes","有，她拿到完整而且沒有被打斷的30分鐘"],["No, the first meal period must begin no later than the end of the fifth hour of work, which is 13:00 for an 08:00 start","沒有，第一次用餐時間最晚必須在工作滿第五小時結束前開始，08:00 上班就是 13:00 之前"],["Yes, because the delay was caused by customer volume","有，因為延後是客流量造成的"],["No, because a meal period has to start at the exact midpoint of the shift","沒有，因為用餐時間必須正好在班次的中間點開始"]],"a":1,"x":["The common failure is treating the meal as something that happens sometime during the shift. The first meal period must begin before the end of the fifth hour, so an 08:00 start means the meal begins by 13:00 even on a busy day. Build the deadline into the schedule and alert the supervisor before it passes, not after. Authority: Labor Code 512 and the applicable IWC wage order. VERIFY.","最常見的錯誤，是把用餐時間當成「班中某個時候休息一下就好」。第一次用餐時間必須在第五個工作小時結束前開始，因此八點上班的人，即使當天再忙，也必須在十三點前開始用餐。請把這個期限做進排班系統，並在逾時之前就通知主管，而不是事後才發現。法源：Labor Code 512 及適用的 IWC 工資命令。請人工查證（VERIFY）。"]},{"q":["An employee scheduled for six and a half hours asks to skip his meal period so that he can leave early, and offers to sign a waiver. What is the correct response?","一位排班六個半小時的員工要求略過用餐時間以便提早下班，並表示願意簽切結書。正確的回應是什麼？"],"o":[["Accept the signed waiver, mutual consent is exactly what the rule requires","接受這份簽名的放棄同意書，規定要的就是雙方合意"],["Decline, because the first meal period may be waived by mutual consent only when the total hours worked that day do not exceed six","不接受，因為第一次用餐時間要雙方合意才能放棄，而且僅限當天總工時不超過六小時的情況"],["Accept it if he takes two rest periods instead","如果他改成多休息兩次就接受"],["Accept it once, but not as a regular practice","接受一次，但不能變成常態做法"]],"a":1,"x":["The waiver of the first meal period is available only where the day does not exceed six total hours, so at six and a half hours no signature makes it lawful. If he needs to leave early, change the schedule to six hours or less rather than papering over a missed meal. Authority: Labor Code 512. VERIFY the hour thresholds, and the separate conditions on waiving a second meal period, before the system enforces either.","第一次用餐時間的放棄，僅在當日總工時不超過六小時的情況下、經雙方同意才可為之；當班為六個半小時，任何人簽名都不會讓它變合法。如果他真的需要提早下班，正確做法是把班改成六小時以內，而不是用一張切結書把漏掉的用餐時間蓋過去。法源：Labor Code 512。工時門檻，以及放棄第二次用餐時間的另一組條件，請人工查證（VERIFY）後系統才可強制。"]},{"q":["You relieve a clerk for her meal at 12:30 and she clocks out. You then ask her to keep her radio on in case the floral cooler alarm sounds. She eats at the back table and is never called. Was this a compliant meal period?","十二點半你讓一位同事去用餐，她也打卡下班休息。接著你請她把無線電開著，以防花藝冷藏櫃的警報響。她在後場餐桌吃完飯，整段時間都沒有被呼叫。這段用餐時間合規嗎？"],"o":[["No, being kept on call for an alarm means she was not relieved of all duty and not free of employer control","不算，隨時要待命處理警報，表示她並未完全免除工作，也沒有脫離雇主的控制"],["Yes, she was clocked out and nobody actually called her","算，她已經打卡下班，而且實際上也沒有人叫她"],["Yes, since the radio was only a precaution","算，無線電只是以防萬一"],["No, unless she physically left the building","不算，除非她人真的走出這棟建築"]],"a":0,"x":["The employer duty is to relieve the employee of all duty, relinquish control over how the time is spent, and neither impede nor discourage the break. Being on call is control, whether or not the call ever comes. Hand the radio to somebody who is on the clock. Authority: Labor Code 512 and 226.7, with the provide standard discussed in Brinker v. Superior Court (2012) 53 Cal.4th 1004. VERIFY.","雇主的義務是讓員工完全免除職務、放棄對這段時間如何運用的控制，並且不得妨礙或勸阻員工休息。要求待命本身就是一種控制，不論警報最後有沒有響。請把無線電交給仍在工時內的人。法源：Labor Code 512、226.7；「提供」標準見 Brinker v. Superior Court (2012) 53 Cal.4th 1004。請人工查證（VERIFY）。"]},{"q":["A department head tells a clerk to take his ten minute rest at the end cap so that he can answer customer questions while he rests, because the department is short today. What is wrong with this?","部門主管要一位同事在端架旁邊休息那十分鐘，順便回答顧客問題，理由是今天部門人手不足。這樣做的問題在哪裡？"],"o":[["Nothing, the rest period is paid so light duties are acceptable","沒問題，休息時間是給薪的，做點輕鬆的事可以接受"],["A rest period must be duty free, so posting him to answer customers means the rest period was not provided at all","休息時間必須完全不用做事，所以要他站在那裡回答顧客，等於根本沒有提供休息時間"],["Nothing, provided he still gets the full ten minutes","沒問題，只要他還是有完整的十分鐘"],["The only problem is that rest periods have to be taken in the break room","唯一的問題是休息時間必須在員工休息室裡休"]],"a":1,"x":["Rest periods count as hours worked and are paid, which is exactly why supervisors slide duties into them. Paid does not mean working. Cover the floor another way, and if short staffing routinely eats rest periods then the defect is in the schedule, not in the clerk. Authority: Labor Code 226.7 and the rest period section of the applicable IWC wage order. VERIFY how the ten minutes per four hours or major fraction rule applies under your wage order.","休息時段計入工時並且照給工資，這正是主管最容易把工作偷偷塞進去的原因。有薪不等於要工作。請用別的方式補人力；如果人手不足經常吃掉休息時段，問題出在排班，不在員工身上。法源：Labor Code 226.7 及適用 IWC 工資命令的休息時段條款。「每四小時或其主要部分給予十分鐘」在貴適用工資命令下的具體適用方式，請人工查證（VERIFY）。"]},{"q":["A store has been paying the one hour premium for missed meal periods for months, and the store manager treats it as the cost of running a busy front end. What should a supervisor conclude?","某家門市已經連續好幾個月為漏掉的用餐時間支付一小時的補償工資，店長把它當成前線太忙的必要成本。主管應該得出什麼結論？"],"o":[["The premium is the remedy, so paying it keeps the store compliant","加給就是補救措施，付了門市就算合規"],["Premiums only matter if an employee complains","只有員工提出申訴時，加給才有影響"],["The premium is a remedy for a violation, not a purchase of the right to skip meals, so a repeating premium is a scheduling defect to fix and the pattern is discoverable evidence","加給是違規之後的補救，不是花錢買到可以不給用餐時間的權利，所以一直重複發放的加給代表排班有問題要修正，而且這個模式在訴訟時是可以被調閱的證據"],["The premium can be replaced by giving extra rest periods","可以用多給幾次休息時間來取代加給"]],"a":2,"x":["Paying the premium does not make the missed meal lawful, and a steady stream of premiums is a documented pattern that reads badly later. Treat repeated premiums as a staffing and scheduling signal, fix the shift that produces them, and keep accurate time records showing when each meal period began. Authority: Labor Code 226.7 and 512, with records under Labor Code 226. VERIFY.","支付補償工資並不會讓漏掉的用餐時間變成合法，而長期穩定出現的補償紀錄，本身就是一份對公司不利的書面證據。請把反覆出現的補償視為人力與排班的訊號，去修那個會造成漏餐的班表，並確保出勤紀錄能明確顯示每次用餐時間的開始時間。法源：Labor Code 226.7、512；紀錄義務見 Labor Code 226。請人工查證（VERIFY）。"]}],"CMP-140":[{"q":["It is 96 degrees on the outdoor receiving dock. A receiver says he feels dizzy and wants to sit in the shade. Two trailers are late and the crew is already behind. What is the correct action?","戶外收貨碼頭的氣溫是華氏九十六度。一位收貨同事說他覺得頭暈，想到陰涼處坐一下。今天有兩台拖車誤點，進度本來就落後。正確的處置是什麼？"],"o":[["Tell him to finish the trailer and take his break at the normal time","叫他先把這台拖車卸完，照原本的時間再休息"],["Let him take a cool down rest in the shade immediately, for at least five minutes and longer if he needs it, keep him under observation, and do not send him back while symptoms remain","立刻讓他到陰涼處降溫休息，至少五分鐘，需要更久就再延長，期間持續觀察，症狀還在就不要讓他回去工作"],["Send him home to recover on his own","叫他回家自己休息恢復"],["Give him water and let him keep working at a slower pace","給他水，讓他放慢速度繼續工作"]],"a":1,"x":["An employee who asks for or needs a cool down rest must be allowed to take one, must not be ordered back to work while symptoms remain, and must be monitored for signs that the situation is becoming a medical emergency. Dizziness in high heat is the point where the cost of delay stops being a trailer and starts being a person. Authority: 8 CCR 3395. VERIFY the minimum rest period and the observation requirement as currently written.","員工要求或需要降溫休息時，必須讓他休息；在症狀未消退前不得要求返回工作，並且要持續觀察是否惡化為醫療緊急狀況。在高溫下出現頭暈，就是延誤代價由「一台拖車」變成「一個人」的分界點。法源：8 CCR 3395。最短休息時間與觀察義務的現行條文，請人工查證（VERIFY）。"]},{"q":["Your dock is covered, so the crew works indoors, but the back room and the compactor area sit well above 90 degrees on summer afternoons. A manager says the heat standard is an outdoor rule and does not apply. Is he right?","你們的碼頭有遮蔽，所以同仁算是在室內工作，但夏天下午後場與垃圾壓縮機區的溫度遠高於華氏九十度。一位主管說高溫法規只管戶外，這裡不適用。他說得對嗎？"],"o":[["Yes, heat illness rules apply only to outdoor places of employment","對，高溫危害規定只適用於戶外工作場所"],["No, California also regulates indoor places of employment once the temperature reaches specified thresholds, so back rooms, compactor areas and kitchens can be covered","不對，加州對室內工作場所也有規範，溫度達到規定門檻就適用，所以後場、壓縮機區和廚房都可能被納入"],["Yes, unless the store has no air conditioning at all","對，除非門市完全沒有空調"],["Indoor heat is covered only for employees who work more than eight hours","室內高溫只涵蓋工時超過八小時的員工"]],"a":1,"x":["California has an indoor heat illness prevention standard in addition to the outdoor standard, with obligations triggered at specified indoor temperatures and further requirements at higher thresholds or where clothing and radiant heat add risk. Measure the actual temperature in the back room and the compactor area rather than arguing about indoors versus outdoors. Authority: 8 CCR 3395 for outdoor, with the indoor heat standard commonly cited at 8 CCR 3396. VERIFY the section number and every temperature threshold before seeding them.","加州在戶外標準之外，另有室內高溫傷病預防標準，於特定室內溫度達到門檻時即產生義務，並在更高溫度、或因衣著與輻射熱而風險升高時附加額外要求。與其爭論算室內還是戶外，不如直接量測後場與壓縮機區的實際溫度。法源：戶外見 8 CCR 3395；室內標準常被引述為 8 CCR 3396。條號與各項溫度門檻請人工查證（VERIFY）後才可寫入系統。"]},{"q":["A new hire starts on the outdoor dock during the first heat wave of the season, in the middle of a run of days above 95 degrees. What does the plan require beyond water and shade?","一位新進同事在本季第一波熱浪期間到職，被分派到戶外碼頭，而且連日氣溫都在華氏九十五度以上。除了飲水與遮蔭之外，計畫還要求什麼？"],"o":[["Nothing extra, he is young and the crew will look out for him","不用額外做什麼，他年輕，同事也會照看他"],["Close observation of the new employee during the initial period of employment and of all employees during a heat wave, with the workload built up gradually","新進員工在到職初期要密切觀察，熱浪期間則是所有員工都要密切觀察，工作量也要循序漸進增加"],["A doctor note clearing him to work outdoors","一張醫師開立、允許他在戶外工作的證明"],["Assigning him indoors until the heat wave passes, which is the only compliant option","熱浪過去之前都把他排在室內，這是唯一合規的做法"]],"a":1,"x":["Unacclimatised employees carry the highest risk, which is why close observation applies to new employees during their first days working in the heat and to all employees during a heat wave. Pair the new person with an experienced employee who is told that watching him is part of the job, and build the workload up rather than starting at full pace. Authority: 8 CCR 3395. VERIFY the observation period, commonly cited as the first fourteen days.","尚未適應高溫的員工風險最高，因此對新進人員在高溫下工作的最初數日，以及熱浪期間的全體員工，都必須加強觀察。請安排一位有經驗的同事帶他，並明確告知「盯著他」就是工作的一部分，同時讓工作量逐步增加，而不是第一天就全速上工。法源：8 CCR 3395。觀察期間常被引述為前十四天，請人工查證（VERIFY）。"]},{"q":["A produce clerk who has been unloading a hot trailer is confused, is no longer sweating, and stumbles when he stands up. A coworker offers to drive him home. What do you do?","一位剛在悶熱拖車裡卸貨的蔬果部同事出現意識混亂、不再流汗，站起來時步伐不穩。另一位同事說可以載他回家。你該怎麼做？"],"o":[["Let the coworker drive him home so that he can rest","讓同事開車送他回家休息"],["Call emergency services immediately, begin cooling him on site, and stay with him, because confusion and hot dry skin point to a medical emergency rather than fatigue","立刻撥打 911 求救，在現場先幫他降溫並全程陪著他，因為意識混亂加上皮膚又熱又乾，代表這是醫療緊急狀況，不是單純太累"],["Give him an electrolyte drink and let him sit in the break room until the end of shift","給他喝電解質飲料，讓他在員工休息室坐到下班"],["Drive him to urgent care yourself, since that is faster than waiting for an ambulance","自己開車載他去急診，因為這比等救護車快"]],"a":1,"x":["Altered mental status with hot dry skin has to be treated as an emergency. Call emergency services, begin cooling immediately with whatever is available, never leave the person alone, and send somebody to a specific door to direct responders. Sending an employee home unattended is the decision that turns a survivable event into a fatality. If the person is an employee this also becomes an injury with its own reporting clocks. Authority: 8 CCR 3395 emergency response procedures. VERIFY the serious injury reporting obligation and its deadline separately, because that clock is not a heat rule.","意識狀態改變加上皮膚乾熱，必須當成緊急醫療事件處理。請立即撥打急救電話、就地用任何可用方式開始降溫、絕不讓當事人獨處，並指派專人到指定門口引導救護人員。讓員工自行或由同事載回家，正是把「原本救得回來」變成死亡事故的那個決定。若當事人是員工，這同時成為一件工傷，另有其通報時效。法源：8 CCR 3395 的緊急應變程序。重大傷害通報義務與其期限屬於另一套規定，請另行人工查證（VERIFY）。"]},{"q":["The dock crew has one five gallon water cooler at the far end of the warehouse. It runs dry by noon and somebody refills it when they remember. What is the compliance problem?","碼頭這組人只有一桶五加侖的飲水，還放在倉庫最遠的那一端。中午前就會喝完，誰想到了誰就去補。合規問題在哪裡？"],"o":[["No problem, water is available and it is free","沒問題，有水而且免費"],["The problem is only that the container is not labelled","問題只在於水桶沒有標示"],["Water must be fresh, pure, suitably cool and free, provided as close as practicable to where employees are working, in an amount sufficient for one quart per employee per hour for the entire shift, with employees encouraged to drink frequently","飲用水必須新鮮、乾淨、涼度適口而且免費，並盡可能提供在員工實際工作的地點附近，數量要足夠讓每位員工整個班次每小時喝一夸脫，同時要鼓勵員工經常補充水分"],["The crew should be told to bring their own bottles from home","應該叫員工自己從家裡帶水壺來"]],"a":2,"x":["Distance and an empty container are what turn a written plan into a violation, because the crew quietly stops drinking rather than walking the length of the warehouse. Put the water where the work is, assign the refill to a named role rather than to whoever remembers, and treat access to shade the same way. Authority: 8 CCR 3395. VERIFY the one quart per hour figure and the temperature that triggers shade access.","距離太遠加上桶子見底，就是讓一份寫得很好的計畫變成違規的原因，因為同仁不會走過整個倉庫去喝水，他們只會不喝。請把飲水放在實際作業的地方，把補水這件事指定給特定職務負責，而不是「誰想到誰去」；遮蔭的可及性也要用同樣標準處理。法源：8 CCR 3395。每人每小時一夸脫的數字，以及觸發遮蔭義務的溫度，請人工查證（VERIFY）。"]}],"CMP-150":[{"q":["A store manager prints one page listing emergency phone numbers and the location of the panic button, and files it as the store workplace violence prevention plan. What is missing?","一位店長印了一張紙，上面列著緊急電話與緊急按鈕的位置，就把它歸檔為門市的職場暴力防治計畫。少了什麼？"],"o":[["Nothing, the plan only has to cover emergencies","沒有缺少，計畫只需要涵蓋緊急狀況"],["Most of it, because the written plan must also name who is responsible, describe how employees are involved, how reports are accepted and answered without retaliation, how hazards are identified and corrected, how incidents are investigated, and how the plan is reviewed","缺很多，因為書面計畫還必須寫明負責人是誰，說明員工如何參與、如何受理並回應通報而且不會遭到報復、如何辨識並改善危害、如何調查事件，以及如何定期檢討計畫"],["Only the employee signature page","只缺員工簽名頁"],["Nothing, provided a corporate plan exists at headquarters","沒有缺少，只要總公司有一份計畫就好"]],"a":1,"x":["The written plan must contain the full set of required elements, must be specific to the hazards and corrective measures for each work area and operation, and may either stand alone or sit inside the injury and illness prevention program. Store the plan as structured versioned elements so that a store specific section can be added without rewriting one document across every store. Authority: Labor Code 6401.9(c). VERIFY the element list against current law and against any Cal/OSHA standard adopted since, because a general industry standard is expected.","書面計畫必須包含法定的全部要素，必須針對每個工作區域與作業的危害與矯正措施個別撰寫，並可獨立成冊或併入傷害與疾病預防計畫之中。建議把計畫以「一個要素一筆、可版本控管」的結構儲存，這樣要新增門市專屬段落時，不必把每家店的整份文件重寫一次。法源：Labor Code 6401.9(c)。要素清單請對照現行法令，並確認自該法施行後 Cal/OSHA 是否已另行發布一般行業標準（VERIFY）。"]},{"q":["A customer angry about a returned item shoves a clerk against the counter. The clerk is not hurt, police were not called, and the customer left. The shift manager decides there is nothing to report. Is that right?","一位因退貨不滿的顧客把同事推撞到櫃檯上。同事沒有受傷，也沒有報警，顧客隨即離開。當班主管認為沒有什麼要通報的。這樣對嗎？"],"o":[["Yes, no injury and no police report means there is no incident","是，沒有人受傷也沒有報警，就不算事件"],["No, a violent incident log entry is required for a workplace violence incident whether or not anyone was injured and whether or not police were called","不是，只要發生職場暴力事件，不論有沒有人受傷、有沒有報警，都必須登錄在暴力事件記錄簿"],["Only if the clerk asks for it to be recorded","只有店員要求記錄時才需要"],["Only if the customer can be identified","只有查得出顧客身分時才需要"]],"a":1,"x":["The log requirement is not limited to injuries or to events that generate a police report, and unlogged incidents are how a chain fails to notice that one return counter produces most of its assaults. An incident also triggers a hazard evaluation and a review of the plan. Record it, classify the type, and use the store area field so the risk shows where it concentrates. Authority: Labor Code 6401.9(d), with the hazard evaluation and plan review triggers at 6401.9(c)(2). VERIFY.","紀錄義務並不以「有人受傷」或「有報警」為前提。沒有留下紀錄的事件，正是連鎖體系永遠看不出「某個退貨櫃檯集中了大部分衝突」的原因。事件同時會觸發危害評估與計畫檢討。請完成紀錄、標註暴力類型，並使用店內區域欄位，讓風險集中的位置浮現出來。法源：Labor Code 6401.9(d)；危害評估與計畫檢討的觸發條件見 6401.9(c)(2)。請人工查證（VERIFY）。"]},{"q":["A well intentioned assistant manager writes a thorough log entry naming the clerk who was threatened, the witness, and the customer, and adds the customer phone number from the loyalty account. What is wrong?","一位出於好意的副店長寫了一則非常詳細的事件紀錄，寫出被威脅同事的姓名、目擊者姓名、顧客姓名，還從會員資料抄了顧客的電話號碼。問題在哪裡？"],"o":[["The log must omit personal identifying information sufficient to identify any person involved, so names, phone numbers and similar details do not belong in the entry","記錄必須略去足以辨識當事人身分的個人資料，所以姓名、電話這類細節不應該寫進去"],["Nothing, more detail always makes a better record","沒有問題，寫得越詳細記錄越好"],["Only the customer information is a problem","只有顧客的資料有問題"],["Nothing, provided the log is kept in a locked office","沒有問題，只要記錄鎖在辦公室就好"]],"a":0,"x":["The privacy rule sits in the statute, not in company policy, so the description has to be detailed about what happened and silent about who. Put a persistent inline warning on the form telling the reporter not to enter names, and keep any investigation file that does contain identities separate from the log itself. Authority: Labor Code 6401.9(d)(1)(B). VERIFY.","這條隱私規定寫在法律裡，不是公司政策，因此紀錄的描述必須「對事情很詳細，對人完全不寫」。請在表單上放一則常駐提示，明確要求填寫者不要輸入姓名，並把確實包含當事人身分的調查卷宗，與這份紀錄分開保管。法源：Labor Code 6401.9(d)(1)(B)。請人工查證（VERIFY）。"]},{"q":["A closing clerk asks for a copy of the workplace violence prevention plan. The only copy is a PDF on the corporate intranet, behind a login that store level employees do not have. What does the law require?","一位負責晚班關店的同事要求索取職場暴力防治計畫。唯一的一份是放在公司內部網站上的 PDF，而該網站需要門市同仁沒有的帳號才能登入。法律的要求是什麼？"],"o":[["The employee can request it in writing and receive it within thirty days","員工可以書面申請，並在三十天內拿到"],["Access can be limited to supervisors for security reasons","基於安全考量，可以只讓主管查閱"],["The plan must be available and easily accessible to employees, so a copy the crew cannot open is not compliant, and the fix is a store copy in a language they read","計畫必須讓員工隨時取得而且容易查閱，所以同仁打不開的檔案並不合規，正確做法是在店裡放一份他們看得懂的語言版本"],["A verbal summary at the shift huddle is sufficient","在交班朝會口頭說明重點就夠了"]],"a":2,"x":["A plan the workforce cannot reach is a document, not a program. The statute states that the plan is available and easily accessible to employees, to authorised employee representatives and to Cal/OSHA. Keep a physical copy where the crew actually works, publish it in the languages the store operates in, and record who received it as part of the required training. Authority: Labor Code 6401.9(c) and 6401.9(e). VERIFY the access and training requirements as currently written.","員工拿不到的計畫，只是一份文件，不是一套制度。法條明定計畫必須對員工、經授權的員工代表以及 Cal/OSHA 可取得且易於取得。請在同仁實際工作的地方放一份紙本、以門市實際使用的語言提供，並把「誰收到了」記錄為法定訓練的一部分。法源：Labor Code 6401.9(c)、6401.9(e)。取得與訓練要求的現行條文，請人工查證（VERIFY）。"]},{"q":["A bakery clerk tells you that her former partner has been waiting in the parking lot at closing and has messaged that he will come inside next time. He has no connection to the store. Is this inside the workplace violence prevention plan?","一位烘焙部同事告訴你，她的前伴侶最近關店時都在停車場等，還傳訊息說下次要直接進店裡。此人與門市完全沒有關係。這件事屬於職場暴力防治計畫的範圍嗎？"],"o":[["No, it is a personal matter that happens outside work","不算，這是工作以外的私人事務"],["Yes, violence by a person who has or is known to have had a personal relationship with an employee is one of the recognised types, so the plan procedures, the log and hazard corrections such as closing escorts all apply","算，加害人與員工有或曾有私人關係的暴力，正是規定認定的類型之一，所以計畫的處理程序、事件記錄，以及打烊時結伴護送這類危害改善措施都要適用"],["Only once he actually enters the store","要等他真的走進店裡才算"],["Only if she first obtains a restraining order","要等她先聲請到保護令才算"]],"a":1,"x":["This is the type that stores most often treat as private and therefore do nothing about, which is exactly why the statute names it. Apply the plan, adjust the hazard controls such as escorts to vehicles at closing and parking lot lighting, log the threat without identifying details, and point her to the separate California notice on leave and accommodations for victims. Authority: Labor Code 6401.9(a) and 6401.9(d). VERIFY, and note that the victim leave and accommodation duty comes from a different statute with its own employer size thresholds.","這一類最常被門市當成「人家的私事」而完全不處理，法律特別把它列為一種類型，原因正在於此。請適用計畫程序，調整危害控制措施，例如關店時陪同至車輛、加強停車場照明；在不寫入可識別個人資料的前提下完成事件紀錄，並提供她加州另有的被害人休假與職務調整相關通知。法源：Labor Code 6401.9(a)、6401.9(d)。請人工查證（VERIFY）。另請注意，被害人休假與職務調整的義務出自另一部法律，並有其各自的雇主規模門檻。"]}],"DRL-201":[{"q":["A fire evacuation drill is called at 10 a.m. At the assembly point the grocery lead sees twelve people from a department that has fourteen on the shift roster. What happens next?","上午十點進行火災疏散演練。到了集合點，雜貨部主管發現當班班表上有十四人，現場只有十二人。接下來該怎麼做？"],"o":[["The lead counts against the shift roster, names the two who are unaccounted for, and reports the gap to the drill coordinator before anyone reenters the building.","帶班人員對照當班名單清點，指出那兩位下落不明的人是誰，並在任何人重新進入建築物之前，把缺口回報給演練負責人。"],["Sort it out later when the sign in sheet is collected at the office.","等簽到表收回辦公室後再處理。"],["Assume the two clocked out early and finish the drill.","假設那兩位提早打卡下班，把演練做完。"],["Send two employees back inside to look for them.","派兩位員工回建築物裡面找人。"]],"a":0,"x":["Accountability is the whole point of the assembly point. The department lead counts heads against the shift roster, names anyone missing, and hands that name plus a last known location to the person running the drill. Nobody reenters to search. In a real fire the search belongs to the fire department, and a name given at the curb is what makes that search possible. Log the count and the evacuation time on the store drill record.","集合點存在的意義就是清點人數。部門主管依當班班表點名，找出未到者姓名，並把姓名與最後出現位置交給演練負責人。任何人都不得自行返回搜尋。真實火災時搜救由消防單位執行，在門外提供的姓名就是關鍵。清點結果與疏散時間都要寫入門市演練紀錄。"]},{"q":["A cashier was on an offsite meal break when the quarterly evacuation drill ran. Everyone else took part and the store finished the drill. How is this recorded?","季度疏散演練進行時，一位收銀員正在店外用餐休息。其他人都參與且門市已完成演練。這要如何記錄？"],"o":[["Record the cashier as present, since the store ran the drill.","把該收銀員記為出席，因為店裡確實有做演練。"],["Mark the store drill incomplete and run the whole thing again when every person is present.","把整場門市演練記為未完成，等所有人都到齊再重做一次。"],["Mark the cashier as failed and assign a retake of an online module.","把該收銀員記為不合格，並指派他重上線上課程。"],["Record the store drill as complete, note the absence on the roster, and log a documented makeup briefing for that cashier before the next shift they work.","把門市演練記為完成，在名單上註記該員缺席，並在他下次上班之前完成一場有書面記錄的補訓說明。"]],"a":3,"x":["A drill is a store level event. It is complete because the store ran it, not because every individual was standing there. Do not hold the store record hostage to one absence, and never write someone onto a roster who was not there. Note the absence, give that person a short documented briefing covering the route, the exit and the assembly point, and keep the store clock running.","演練是門市層級的活動。門市有執行，演練就算完成，不是每個人都到場才算。不要因為一人缺席就卡住門市紀錄，也絕對不可以把沒到的人寫進簽到表。記下缺席，於該員下次上班前完成一次有紀錄的補充說明，內容涵蓋路線、出口與集合點，門市的效期照常計算。"]},{"q":["The store clears the building in four minutes and the manager writes \"drill went well\" in the debrief field. What is missing?","門市在四分鐘內清空建築物，店長在檢討欄位寫下「演練順利」。缺了什麼？"],"o":[["The names of the employees who were slowest to leave.","撤離最慢的員工姓名。"],["The percentage of scheduled staff who attended.","排班人員的出席百分比。"],["The measured evacuation time, what went wrong including blocked routes and accountability gaps, and every corrective action with a named owner and a due date.","實際測得的撤離時間，出了哪些問題，包括路線受阻和人數清點的漏洞，以及每一項改善措施的負責人姓名和完成期限。"],["Nothing, the time target was met.","不用記，時間有達標。"]],"a":2,"x":["The debrief is the part that turns a drill into a program. A one line compliment cannot be audited and cannot be acted on. Capture the measured time, the problems you actually saw, and each fix with a named owner and a date, then verify those fixes at the next drill. A debrief that never names anyone as an owner produces no change.","檢討紀錄才是讓演練成為制度的關鍵。一句稱讚無法稽核，也無法據以行動。要寫下實測疏散時間、現場真正出現的問題，以及每一項改善措施的負責人姓名與完成期限，並在下次演練時查核是否落實。沒有指定負責人的檢討，不會帶來任何改變。"]},{"q":["A store ran its evacuation drill and the roster is signed, but nobody wrote down how long the evacuation took. A district lead asks whether DRL-201 can be closed.","某門市完成疏散演練，簽到表已簽署，但沒有人記錄疏散花了多久。區主管詢問 DRL-201 是否可以結案。"],"o":[["Close it, evacuation time is only a suggestion.","可以結案，撤離時間只是建議值。"],["No. DRL-201 closes on the signed roster plus a logged evacuation time, so enter the time if it was genuinely measured, and if it was never taken, run the drill again.","不行。DRL-201 要有簽名的名單加上登錄的撤離時間才能結案，所以當時如果真的有測，就把時間填上去；如果根本沒測，就重新演練一次。"],["Yes, a signed roster is the requirement.","可以，規定要的就是一份簽名的名單。"],["Close it and add the time to next quarter record.","先結案，把時間補到下一季的記錄裡。"]],"a":1,"x":["Every drill has its own verification artifact, and the record is only as good as that artifact. For fire evacuation it is the roster plus a measured time. Never backfill a number nobody took, because an invented figure is worse than a missing one. Cal/OSHA emergency action plan expectations at 8 CCR 3220 and the federal 29 CFR 1910.38 are cited here for context only. VERIFY the current text and any interval with counsel before treating it as settled.","每一項演練都有專屬的查核佐證，紀錄的可信度就等於佐證的可信度。火災疏散的佐證是簽到表加上實測疏散時間。絕對不要補填沒有人量過的數字，捏造的數字比空白更糟。此處引用 Cal/OSHA 8 CCR 3220 與聯邦 29 CFR 1910.38 的緊急應變計畫規定僅供參考。任何條文與期限都須經法務確認後才可視為定案。VERIFY"]},{"q":["It is hot at the assembly point and employees start drifting back toward the entrance before the count is finished.","集合點很熱，清點尚未完成，員工開始三三兩兩往入口移動。"],"o":[["Hold everyone at the assembly point until the count is complete and the person running the drill gives one clear all clear.","讓所有人留在集合點，直到人數清點完畢，並由演練主持人統一發出一次明確的解除通知。"],["Release anyone who has already signed the roster.","已經在名單上簽名的人就可以先解散。"],["Let small groups go back in, the drill is basically over.","讓大家分成小批先進去，演練差不多結束了。"],["Let each department decide when to go back in.","由各部門自己決定什麼時候回到店內。"]],"a":0,"x":["A count that people walk away from is not a count. One person moving between groups can make a missing employee look present. Hold the assembly point, finish the count department by department, then give a single all clear. If heat or weather makes the location unusable, move the entire group together to the alternate point and record that in the debrief.","人一邊走動一邊清點，等於沒有清點。只要有人在各組之間移動，缺席者就可能被算成在場。請把大家留在集合點，逐部門完成清點，再統一宣布解除。若天候或高溫讓該地點無法使用，就整組一起移到備用集合點，並把這件事寫進檢討紀錄。"]}],"DRL-202":[{"q":["Shaking starts while you are restocking an aisle lined with tall shelving full of glass jars.","你正在補貨，走道兩側是高層架，上面都是玻璃罐，這時開始搖晃。"],"o":[["Stand in the nearest doorway.","站在最近的門框下。"],["Steady the shelf so the jars do not fall.","扶住貨架，避免罐子掉下來。"],["Drop, take cover beside a low fixed structure and away from the shelving, protect your head and neck, and hold on until the shaking stops.","趴下，躲到遠離貨架的低矮固定物旁邊掩護，保護頭頸，並抓牢直到搖晃停止。"],["Run for the nearest exit while the floor is still moving.","趁地面還在晃的時候衝向最近的出口。"]],"a":2,"x":["Most injuries in a quake come from falling stock and from people moving while the floor is moving. Drop before the shaking drops you, cover your head and neck, get clear of the shelving, and hold on. A doorway in a modern building is no safer than the floor. Never try to hold merchandise in place, glass is replaceable and hands are not.","地震中的傷害多半來自掉落的商品，以及在地面搖晃時仍在走動的人。先趴下，免得被震倒；保護頭頸，離開層架，並穩住不動。現代建築的門框並不比地板安全。絕對不要伸手去扶商品，玻璃可以再補，手不行。"]},{"q":["The shaking stops. The building is standing and the lights are on. What does the team do first?","搖晃停止。建築物完好，燈也還亮著。團隊第一件事該做什麼？"],"o":[["Go back to stocking, the event is over.","回去繼續補貨，事情已經結束了。"],["Wait for a news alert to say it is safe.","等新聞快報說安全了再行動。"],["Send everyone out the nearest door immediately at a run.","馬上叫所有人從最近的門跑出去。"],["Expect aftershocks, check people for injuries, then walk the exit route for fallen stock, broken glass and leaking lines before moving anyone, and evacuate on one instruction if the building is unsafe.","預期會有餘震，先確認有沒有人受傷，接著在讓大家移動之前，先走一遍撤離路線，檢查掉落的商品、碎玻璃和管線洩漏，如果建築不安全，就依照統一指令撤離。"]],"a":3,"x":["The minutes after the shaking are when people get hurt walking into glass or into a leak. Check for injuries first, then clear and check the route, then move as a group on one instruction. Aftershocks are expected, so keep people away from tall stacks and glass on the way out and count heads at the assembly point exactly as you would for a fire.","搖晃結束後的那幾分鐘，才是最多人踩到玻璃或走進洩漏區受傷的時候。先確認有無人員受傷，再清查並確認撤離路線，然後聽從單一指令整組移動。餘震是必然的，撤離途中請讓大家遠離高疊貨與玻璃，並和火災演練一樣在集合點清點人數。"]},{"q":["The post drill hazard walk finds cases of backstock stacked above head height over the checkstands with nothing restraining them.","演練後的危害巡檢發現，收銀檯上方堆放的備貨高過人頭，而且沒有任何固定。"],"o":[["Leave it, only warehouse racking needs restraint.","不用管，只有倉庫的貨架需要固定。"],["Take it down now, then record it in the debrief as a corrective action with a named owner and a due date for either a permanent restraint or a lower stacking limit.","現在就把它拆下來，並在檢討會記錄成改善措施，寫明負責人和完成期限，做永久固定或是降低堆放高度上限。"],["Tell the crew to be careful when they work near the checkstands.","提醒同仁在收銀台附近工作時小心一點。"],["Note it for discussion at the next drill.","先記下來，等下次演練再討論。"]],"a":1,"x":["The hazard walk is the verification artifact for DRL-202, and its value is the fix, not the observation. Remove the immediate hazard the moment you see it, then write the permanent fix into the debrief with an owner and a date so somebody can be asked about it later. Verify at the next drill that the stack stayed down.","危害巡檢是 DRL-202 的查核佐證，它的價值在於改善，而不在於「有看到」。看到當下就先把貨降下來，接著把永久性的改善方式寫進檢討紀錄，指定負責人與完成期限，日後才有人可以被追問。下次演練時再確認堆高是否維持在規定內。"]},{"q":["The drill is scheduled during open hours and a front end lead asks what to tell customers.","演練排在營業時間內，前檯主管詢問要怎麼向顧客說明。"],"o":[["Run it silently and let customers work out what is happening.","全程不廣播，讓顧客自己搞清楚發生什麼事。"],["Cancel the drill and reschedule it after closing.","取消演練，改到打烊後再做。"],["Announce clearly and calmly that a drill is in progress, in both languages the store serves, and have customer facing staff practise the exact words they would use to direct people.","用門市服務的兩種語言，清楚而且冷靜地廣播現在是演練，並讓第一線接待顧客的同仁演練引導顧客時要講的完整說法。"],["Announce it as a real earthquake so people react naturally.","宣布成真的地震，讓大家反應更自然。"]],"a":2,"x":["A drill that frightens customers creates a real injury risk and a real complaint. Say the word drill, out loud, in both languages. The realism that matters is staff rehearsing the sentence they will actually say and the route they will actually point to, not customers believing something is happening.","讓顧客受驚的演練，會製造真實的受傷風險與真實的客訴。請清楚說出「這是演練」，而且用門市服務的兩種語言各講一次。真正需要擬真的，是同仁演練屆時要說出口的那句話與要指的那條動線，而不是讓顧客信以為真。"]},{"q":["The overnight stocking crew never overlaps with the shift that ran the drill.","夜班補貨團隊的班別，和執行演練的班別完全沒有重疊。"],"o":[["Run the same drill on the overnight shift and log both sessions on the store record, so every shift has practised the routes it will actually use.","在大夜班也做同一套演練，並把兩場都登錄在門市記錄上，讓每個班別都練過自己實際會走的路線。"],["Have the day manager brief the overnight crew by group message.","由日班主管在群組訊息裡跟大夜班同仁說明就好。"],["Add them to the drill next year.","明年的演練再把他們納入。"],["Exempt the overnight crew, the store record already covers them.","大夜班可以免做，門市記錄已經涵蓋他們了。"]],"a":0,"x":["The store completes the drill, but a shift that has never walked the route with fewer people and locked front doors has not practised anything. Run it once per shift pattern and log each session on the same store record. Overnight conditions change the plan, and that is precisely what the second session surfaces.","演練的完成單位是門市，但一個從未在人力較少、前門上鎖的條件下走過動線的班別，等於沒有演練過。每一種班別型態各執行一次，並把每一場都登錄在同一份門市紀錄上。夜間條件會改變應變方式，而這正是第二場演練要找出來的東西。"]}],"DRL-203":[{"q":["A customer collapses near the deli case, is unresponsive and is not breathing normally. Three employees are nearby.","一位顧客在熟食櫃旁倒下，沒有反應，呼吸也不正常。附近有三位同仁。"],"o":[["Move the person to the back room so customers do not see.","把人搬到後場，免得被顧客看到。"],["Start chest compressions and, by name, send one person for the AED and one person to call 911, stay on the line and meet the medics at the entrance.","立刻開始壓胸，並指名一個人去拿 AED、一個人打 911，電話保持不掛斷，再到門口接應救護人員。"],["Put the person in the recovery position and watch for a cha
