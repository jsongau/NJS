. Write what you saw, note the camera and the time range so somebody can actually pull the footage, and take separate accounts from the other witnesses rather than one agreed version.","一份報告的價值，取決於其中有多少內容能追溯到具名的觀察者與明確的時間。對身分的猜測會污染周圍所有內容，也是把一份損耗報告變成對門市投訴案件的最快途徑。請寫下你親眼所見，註明攝影機位置與需要調閱的時間區間，讓後續有人真的調得到畫面；其他目擊同仁請分別取得各自的陳述，不要整合成一個共同版本。"]},{"q":["Your department shrink number jumps sharply this quarter. Nobody has reported seeing a single theft. The department manager wants a guard posted at the door.","你部門這一季的損耗數字大幅上升，但沒有任何人回報看到竊盜行為。部門主管想在門口安排一名警衛。"],"o":[["Post the guard, visible deterrence is the fastest way to bring the number down.","派保全站崗，看得到的嚇阻是把數字壓下來最快的方法。"],["Work the process first, reconcile receiving counts against invoices, check markdowns and rewrapped items, check whether damage and spoilage write offs are actually being logged, check date rotation and disposal in the perishable areas, and run a cycle count, because most of a shrink number is usually paperwork rather than theft.","先從流程查起，把驗收數量和發票核對，檢查降價品和重新包裝的商品，確認損壞和報廢有沒有確實登錄，檢查生鮮區的效期輪替和報廢處理，再做一次循環盤點，因為損耗數字大部分通常是帳務問題，不是偷竊。"],["Review a month of camera footage of customers in that department.","調閱該部門一個月的顧客監視器畫面來看。"],["Raise it with the night crew, they are the ones with the least supervision.","找夜班人員談，他們是最沒有人盯著的一群。"]],"a":1,"x":["Shrink is a difference between two numbers and theft is only one of the things that can create it. Receiving short and signing for full, unlogged spoilage, mismarked repacks and a missed count all look exactly like theft in the report and none of them are. Work the paperwork first because it is cheap, it is fast and it is where the answer usually is. Accusing the night crew on no evidence costs you the crew and does not move the number.","損耗只是兩個數字之間的差額，竊盜只是造成差額的其中一個原因。收貨短少卻照單簽收、報廢未登錄、重新包裝標錯、盤點漏算，在報表上看起來全都跟竊盜一模一樣，但它們都不是竊盜。請先從單據流程查起，因為成本低、速度快，而且答案通常就在那裡。在沒有證據的情況下懷疑夜班人員，只會失去這組人，數字也不會有任何改善。"]},{"q":["You have watched a cashier ring up items for the same two people at prices that look wrong, twice in one week. You are fairly confident about what you saw.","你在一週內兩次看到同一位收銀員為同樣的兩個人結帳，價格看起來明顯不對。你對自己看到的相當有把握。"],"o":[["Confront her at the end of the shift and give her a chance to explain before it goes any further.","下班前找她當面問清楚，在事情鬧大之前給她解釋的機會。"],["Check her bag and her locker before she leaves the building.","在她離開之前檢查她的包包和置物櫃。"],["Quietly tell the other supervisors to keep an eye on her.","私下告訴其他主管盯著她一點。"],["Do not confront her, do not investigate on your own and do not search her or her belongings. Write down what you observed with dates, times, lane and transaction times, and escalate through the defined loss prevention and HR channel.","不要當面質問她，不要自己調查，也不要搜她的身或她的物品。把你觀察到的內容寫下來，包含日期、時間、收銀線和交易時間，再依照公司規定的防損和 HR 通報管道往上呈報。"]],"a":3,"x":["Internal cases fail for two reasons, a supervisor who investigates alone and a supervisor who confronts early. Confronting warns the person, ends the evidence trail and puts you alone in a room with an accusation you cannot yet support. Searching a person or their belongings creates a second and much larger problem than the one you started with. Document precisely, hand it to the people whose job it is, and keep your suspicion off the sales floor and out of the break room.","內部案件失敗通常有兩個原因：主管自己查，以及主管太早當面質問。當面質問會讓對方有所警覺、切斷後續的證據軌跡，也會讓你單獨面對一項自己還無法佐證的指控。搜查員工本人或其隨身物品，更會製造出比原本嚴重許多的另一個問題。請精確記錄你觀察到的內容，交給職責所在的單位處理，並且不要把你的懷疑帶到賣場，也不要帶進休息室。"]}],"ONB-401":[{"q":["It is your third day. Your department head is off for the week, the assistant works a different shift from yours, and a customer hands you a carton of milk that smells sour. You are not sure who to take it to. What should orientation already have given you?","這是你到職的第三天。部門主管休假一週，副手上的班又和你不同，一位顧客拿了一瓶有酸味的牛奶給你，而你不確定該找誰處理。新人訓練原本就應該讓你先知道什麼？"],"o":[["The name of the person in charge of your department on each shift you actually work, and the named backup for when that person is off","你實際上班的每個班別中，負責你部門的主管姓名，以及該主管休假時的代理人姓名"],["The store manager personal phone number, to be used whenever your department head is away, since the store manager is ultimately responsible for everything that happens in the building","店長的私人電話，只要部門主管不在就打給他，因為門市裡發生的所有事情最後都是店長負責"],["A general instruction to ask any employee who has been here longer than you","一句籠統的指示，叫你去問任何比你資深的同事"],["Permission to decide these things yourself until your department head returns","在部門主管回來之前，你可以自行決定這些事情的權限"]],"a":0,"x":["Orientation is not finished until you can name the person responsible for you on every shift you are scheduled, and the backup for when that person is off. A chain of one name breaks the moment that name takes a holiday. If your orientation record does not carry both names for your shifts, ask for them today and have them written on the record rather than kept in somebody memory.","新人訓練沒有真正完成，除非你能講出你每一個排班班別上，負責你的那個人是誰，以及那個人休假時由誰代理。只寫一個名字的指揮鏈，在那個人放假的那天就斷了。如果你的新人訓練紀錄上沒有涵蓋你所有班別的這兩個名字，今天就去問清楚，並且要求寫進紀錄裡，而不是留在某個人的記憶裡。"]},{"q":["A coworker on the night crew wants to read the store written injury and illness prevention program and the workplace violence prevention plan. The office is locked after 20:00 and she never overlaps with the person who has the key. What is the right answer to give her?","一位夜班的同事想看門市的傷害與疾病預防計畫，以及職場暴力預防計畫的書面內容。晚上八點以後辦公室上鎖，而她的班和拿鑰匙的人從來沒有重疊。你應該怎麼回答她？"],"o":[["Tell her to submit a written request to HR and wait for a copy to be mailed","請她向HR提出書面申請，等公司把副本寄給她"],["Tell her the plans are written for supervisors and that the parts an employee actually needs were already covered in her orientation, so there is nothing further for her to read","告訴她這些計畫是寫給主管看的，員工真正用得到的部分在職前訓練都講過了，沒有其他需要看的內容"],["Tell her where the current copy is kept and how to reach it on a night shift, and raise it with the supervisor if the only copy sits behind a locked door","告訴她最新版本放在哪裡，以及上夜班時要怎麼拿到，如果唯一一份鎖在門後，就向主管反映"],["Read her the sections you remember from your own orientation","把你自己職前訓練還記得的段落唸給她聽"]],"a":2,"x":["Both written plans have to be available to employees, and a plan that only exists behind a door that is locked during somebody shift is not available to that person. Point her at the actual location, whether that is a binder on the floor, a posted location or the intranet, and if night crew cannot reach it then that access gap is itself the finding to report. Authority: Cal/OSHA T8 3203 for the injury and illness prevention program and Labor Code 6401.9 for the workplace violence prevention plan. VERIFY the access and record requirements before this drives a control in the system.","這兩份書面計畫都必須讓員工取得，而一份只鎖在辦公室裡、剛好在某人上班時間都拿不到的計畫，對那個人來說就等於沒有提供。請直接告訴她現行版本放在哪裡、夜班要怎麼拿到；如果夜班根本拿不到，這個取得管道的缺口本身就是應該通報的問題。法源：Cal/OSHA T8 3203（傷害與疾病預防計畫）、Labor Code 6401.9（職場暴力預防計畫）。在系統據此設定管控之前，請人工查證（VERIFY）取得方式與紀錄的要求。"]},{"q":["You notice the blade guard on the meat room band saw is loose and swings out of position. Your department is short two people today and the person who normally handles maintenance requests is not in. What do you do first?","你發現肉品處理室帶鋸機的護刃罩鬆脫，會晃開偏離位置。今天部門少了兩個人，平常負責報修的同事也不在。你第一件事應該做什麼？"],"o":[["Use the saw carefully for the rest of the shift and write it up tomorrow when the department is properly staffed, since stopping the line today with two people down would put the whole department behind","這個班剩下的時間小心使用鋸台，明天人手齊了再寫報告，因為今天少兩個人還停止作業，會讓整個部門進度落後"],["Take it out of service now, tell the supervisor on duty, and file the hazard report today so the defect and the fix both land on the record","立刻停用該設備，通報當班主管，並在今天提出危害通報，讓缺失和改善都留下紀錄"],["Secure the guard with tape so the line keeps moving and mention it at the next department meeting","用膠帶把防護罩固定住，讓作業繼續進行，下次部門會議再提出來"],["Ask a more experienced coworker whether the saw has always been like that","去問比較資深的同事，這台鋸台是不是一直都這樣"]],"a":1,"x":["A guard that swings out of position is a defect, not a quirk, and being short staffed is the reason it will get used rather than a reason to keep using it. Take it out of service, tell the supervisor who is actually on the floor now, and put it in the hazard reporting channel the same day so there is a dated record and a named corrective action. Verbal awareness is not a record, and a report you plan to write tomorrow protects nobody today.","護刃罩會晃開偏離位置，那是機器有缺陷，不是它本來就這樣。人手不足只會讓大家更想繼續用它，不是可以繼續用的理由。請立刻停用並掛上停用標示，告訴當下真正在現場的主管，並在同一天透過危害通報管道報上去，讓缺陷與矯正措施都留下有日期、有負責人的紀錄。口頭上大家都知道不算紀錄，而打算明天再寫的通報，對今天在現場的人沒有任何保護作用。"]},{"q":["You cut your thumb on a box cutter while opening a case. It is a shallow cut, the bleeding stops after a few minutes, and you would rather finish your shift than make a fuss about it. What is the correct handling?","你在開箱時被美工刀割到拇指。傷口不深，幾分鐘後就止血了，你也覺得沒必要為這點小事驚動大家，想把班上完。正確的處理方式是什麼？"],"o":[["Report it to your supervisor the same day, get the first aid treatment, and ask for the workers compensation claim form even though the cut looks minor","當天就向主管通報，接受急救處理，即使傷口看起來很小，也要索取職災補償的申請表"],["Report it only if it still hurts tomorrow or if you end up missing work","只有在明天還會痛，或是因此請假沒上班時才通報"],["Treat it yourself from the first aid kit and mention it only if it becomes infected, since a shallow cut that has already stopped bleeding is not really an injury and reporting it makes more of it than it deserves","自己用急救箱處理，只有在傷口感染時才提出來，因為已經止血的淺傷口根本算不上受傷，通報反而是小題大作"],["See your own doctor on your day off and keep it out of the store records","利用休假日自己去看醫生，不要留在門市的紀錄裡"]],"a":0,"x":["Report on the day it happens, whether or not it looks like anything. A same day report is what lets first aid, the injury record and the claim form all start from the correct date, and a cut that turns into an infection a week later is very hard to sort out if the first record of it is the infection. In California an employer that has notice of a work injury is commonly cited as having to give the employee the claim form within one working day. Authority: Labor Code 5401 and the recordkeeping duties under Cal/OSHA T8. VERIFY the one working day interval before the system counts a deadline against it.","不論看起來嚴不嚴重，都要在發生當天通報。當天通報，急救處理、傷病紀錄與職災申請表才會從正確的日期開始起算；如果一個小傷口一週後才發炎，而最早的紀錄就是那次發炎，後面會非常難釐清。在加州，雇主在知悉職業傷害後應交付職災申請表，常見引述的期限是一個工作日。法源：Labor Code 5401，以及 Cal/OSHA T8 的紀錄保存義務。在系統據此起算期限之前，請人工查證（VERIFY）這個一個工作日的期間。"]},{"q":["At the end of your first week a lead puts an orientation acknowledgment in front of you. It lists a walk through of the emergency exits and the fire extinguisher locations, which nobody actually did with you. He says everyone signs it and the walk through will happen next week. What should you do?","第一週結束時，一位組長把新人訓練簽收單放到你面前。上面列了逃生出口與滅火器位置的現場導覽，但其實沒有人帶你走過。他說大家都是這樣簽的，導覽下週再補。你應該怎麼做？"],"o":[["Sign it, since the walk through is scheduled and the paperwork has to move","簽下去，因為現場走查已經排定時間，表單也必須往下送"],["Sign it but write next week beside that line so the intent is documented, which keeps the paperwork moving without pretending the walk through has already happened","簽下去，但在那一行旁邊註明下週，把用意記錄下來，這樣表單可以繼續往下送，也不會假裝走查已經完成"],["Decline to sign for the walk through you have not received, ask for it to be done now or scheduled with a date, and sign once it has happened","你還沒接受的走查就不要簽，要求現在進行或訂出確切日期，等實際完成後再簽"],["Refuse to sign anything at all until your probation period is over","在試用期結束前，什麼都不要簽"]],"a":2,"x":["The acknowledgment is the evidence that the training happened, so a signature on training you did not receive does two kinds of damage. It hides a real gap, which means nobody will notice you cannot find an extinguisher, and it makes the whole record less believable in the one situation where the chain most needs it to be believable. Sign for what happened. Ask for a date for the rest, and let the record show the gap until the gap is closed.","簽收單就是訓練有沒有發生的證據，所以在沒有受過的訓練上簽名，會造成兩種傷害。第一，它把真實的缺口蓋掉了，於是沒有人會發現你其實找不到滅火器；第二，它讓整份紀錄的可信度下降，而那份紀錄最需要被相信的時刻，正是出事的時候。已經完成的就簽，還沒完成的請對方給一個明確日期，在缺口補起來之前，就讓紀錄誠實顯示它還沒補。"]}],"ONB-402":[{"q":["You clock in at 06:00 for an eight hour shift. Around 10:30 the store fills up and your lead says to take your lunch once it quiets down, probably near 11:45. What does the rule actually require?","你早上六點打卡，排班八小時。十點半左右門市人潮變多，組長說等人少一點再去吃飯，大概十一點四十五分。規定實際上要求的是什麼？"],"o":[["Lunch can begin any time in the middle stretch of the shift, so 11:45 is acceptable","用餐時間可以排在班別中段的任何時候，所以11點45分沒問題"],["The first meal period must begin before the end of the fifth hour of work, so for an 06:00 start it begins by 11:00 no matter how busy the store is","第一次用餐時間必須在工作滿五小時之前開始，所以6點上班的人，不管門市多忙都要在11點前開始"],["The meal period has to begin at the exact midpoint of the shift","用餐時間必須剛好在班別的正中間開始"],["The start time does not matter as long as you get a full 30 minutes somewhere in the day, because what the rule protects is the length of the break rather than the point in the shift where it falls","只要當天某個時段有完整的30分鐘，開始時間並不重要，因為規定保障的是休息長度，而不是落在班別的哪個時間點"]],"a":1,"x":["The deadline is counted from when you clocked in, not from when the rush ends. Clocking in at 06:00 puts the end of the fifth hour at 11:00, so 11:45 is a late meal even though the shift was busy and even though you got the full 30 minutes. If 11:00 is approaching and no relief has come, say so before the deadline passes rather than after. Authority: Labor Code 512 and the applicable IWC wage order. VERIFY the interval before the system enforces it.","這個期限是從你打卡上班的時間起算，不是從人潮退去的時候起算。六點打卡，第五個工作小時的結束就是十一點，所以十一點四十五分就是遲到的用餐時間，即使當天真的很忙，即使你確實休滿了三十分鐘也一樣。如果快到十一點還沒有人來接手，請在期限之前就講，而不是事後才說。法源：Labor Code 512 及適用的 IWC 工資命令。在系統據此強制執行之前，請人工查證（VERIFY）這個期間。"]},{"q":["You agree to stay late and your day will now run about 11 hours and 15 minutes. You already took a 30 minute meal in your fourth hour. A coworker tells you that one lunch covers a shift of any length. Is that right?","你答應留下來加班，這一天的工時會變成大約十一小時十五分鐘。你在第四個小時已經吃過三十分鐘的飯了。一位同事說，不管上多久，一天吃一次飯就夠了。這樣對嗎？"],"o":[["Yes, one meal period covers the whole workday regardless of length","對，不管工作多長，一次用餐時間就涵蓋整個工作日"],["No, a second meal period is owed once the workday goes past ten hours, and the conditions for waiving it are narrow, so raise it before the tenth hour passes","不對，工作日超過十小時就必須提供第二次用餐時間，可以放棄的條件很嚴格，所以要在滿十小時前提出來"],["No, but the second meal period is only owed once the day goes past twelve hours, and below that a single meal covers however long you are scheduled to stay that day","不對，但第二次用餐時間要工作日超過十二小時才需要提供，在這之下不管當天排多久，一次用餐時間就夠了"],["Yes, provided you are paid for the extra time you worked past eight hours","對，只要超過八小時的工時有付你薪水就可以"]],"a":1,"x":["A workday of more than ten hours is commonly stated to bring a second meal period. It can be waived by mutual consent only in limited circumstances, including that the total day does not exceed twelve hours and that the first meal period was not itself waived, so agreeing to stay late is exactly the moment to raise it. Ask when the second meal starts before the tenth hour is behind you, because after the fact all anyone can do is pay for it. Authority: Labor Code 512 and the applicable IWC wage order. VERIFY the ten hour and twelve hour thresholds and the waiver conditions before either is enforced.","一天工作超過十小時會產生第二次用餐時間，這是常見的引述說法。只有在有限的條件下，經雙方同意才能放棄，其中包括當日總工時不超過十二小時，而且第一次用餐時間本身沒有被放棄。所以答應加班的當下，正是應該把這件事提出來的時機。請在第十個小時過去之前就問清楚第二次用餐時間什麼時候開始，因為事後大家能做的就只剩下補錢。法源：Labor Code 512 及適用的 IWC 工資命令。十小時與十二小時的門檻，以及放棄的條件，在強制執行之前請人工查證（VERIFY）。"]},{"q":["You are on an eight hour shift. Your lead asks you to save both of your ten minute rest periods and take them back to back right before your meal, so the department only loses your coverage once. How should you read that instruction?","你今天上八小時的班。組長要你把兩段十分鐘的休息時間存起來，接在用餐時間之前連著休，這樣部門只會少你一次人力。你應該怎麼看待這個指示？"],"o":[["It is fine, because you still receive the full twenty minutes","沒問題，因為你還是拿到完整的二十分鐘"],["It is fine, because rest periods are paid time and paid time is the department time to arrange, so a lead can place both breaks wherever they cause the least disruption to coverage as long as you receive the full twenty minutes at some point in the shift","沒問題，因為休息時間是有薪時間，有薪時間由部門安排，所以組長可以把兩段休息排在對人力調度影響最小的位置，只要班上某個時段有給滿二十分鐘就好"],["Rest periods are meant to fall as near the middle of each work period as is practicable, so stacking both against the meal is not the default, and you should ask the supervisor to schedule them in their own halves of the shift","休息時間應盡可能安排在每個工作段落的中間，把兩段都黏在用餐時間前後並不是原則做法，你應該請主管把它們分別排在班別的前後半段"],["You should stop working until the rest periods are rescheduled correctly","在休息時間重新排對之前，你應該停止工作"]],"a":2,"x":["Twenty minutes taken in one lump is not the same rest as two breaks placed in the halves of the shift they belong to, which is why the wage order speaks of the middle of each work period insofar as practicable. There are days when practicable really does move a break, but coverage convenience every day is a scheduling defect, not an exception. Raise it with the supervisor, and note that walking off the job is not the remedy. Authority: Labor Code 226.7 and the rest period section of the applicable IWC wage order, including the ten minutes per four hours or major fraction rule. VERIFY.","把二十分鐘一次休完，和在各自所屬的半段班別中各休一次，並不是同一回事，這正是工資命令會寫「盡可能安排在各該工作期間的中段」的原因。確實有些日子情況不允許，休息時間會被挪動，但如果每天都以人力調度方便為由挪動，那就是排班本身有缺陷，不是例外。請向主管反映；同時要知道，直接不做事並不是正確的處理方式。法源：Labor Code 226.7 及適用 IWC 工資命令的休息時段條款，包含每四小時或其主要部分給予十分鐘的規則。請人工查證（VERIFY）。"]},{"q":["It is 12:50. Your meal period has to begin by 13:00, your relief has not arrived, and there are six customers in your line. What is the correct thing to do?","現在是十二點五十分。你的用餐時間必須在十三點前開始，接你班的人還沒來，而你的收銀線上還有六位顧客。正確的做法是什麼？"],"o":[["Clock out for the meal, keep ringing the line, and clock back in 30 minutes later so the time record looks clean","先打卡下班吃飯，人繼續留在收銀台結帳，30分鐘後再打卡上班，讓出勤紀錄看起來乾淨"],["Tell the supervisor right now that the deadline is about to pass and ask for relief, and if the meal still ends up late, short or missed, say so and let the time record show what actually happened","現在就告訴主管期限快到了，請主管派人換手，如果用餐時間還是延後、縮短或沒吃到，就據實反映，讓出勤紀錄呈現實際情況"],["Skip the meal, get through the rush, and take a longer meal later without mentioning the change","這餐就不吃了，先撐過人潮，之後再吃久一點，也不要提這個更動"],["Work through the rush, then ask the supervisor to enter 13:00 as your meal start so that the record matches the schedule, since the meal did eventually happen and the paperwork should not make the store look worse than it actually was","先做完人潮時段，再請主管把用餐開始時間填成13點，讓紀錄和班表一致，因為飯終究有吃到，文件不需要把門市寫得比實際更糟"]],"a":1,"x":["The two wrong answers that people actually pick both fix the paperwork instead of the problem. Working while clocked out is off the clock work and it turns a coverage problem into a wage claim, and asking for a start time that did not happen is a false record that someone else will have to defend. Raise it before the deadline, because that is the moment a supervisor can still send relief. If the meal is late or missed anyway, that is not your failure to hide, it is a fact the record has to carry. Authority: Labor Code 512, 226.7 and 226. VERIFY.","實際上最常被選的兩個錯誤答案，都是在修改文件，而不是解決問題。打卡下班之後繼續工作，就是未計工時的工作，會把一個人力調度的問題變成工資訴訟；要求填入一個根本沒發生的用餐開始時間，則是不實紀錄，而且將來得由別人去承擔。請在期限之前就反映，因為那還是主管來得及派人接手的時間點。如果最後用餐時間還是遲了或漏掉了，那不是你要幫忙隱藏的過失，而是紀錄必須誠實承載的事實。法源：Labor Code 512、226.7、226。請人工查證（VERIFY）。"]},{"q":["Last Tuesday your meal period began 40 minutes late. On Friday the supervisor asks you to review and sign the weekly time record. What should that week of records contain?","上週二你的用餐時間晚了四十分鐘才開始。到了週五，主管請你確認並簽署當週的出勤紀錄。那一週的紀錄裡應該有什麼？"],"o":[["The scheduled meal times, because that is what the posted schedule said should have happened, and a record that matches the published schedule is the one that reconciles cleanly when payroll processes the week and nobody has to explain a discrepancy","班表上排定的用餐時間，因為公布的班表就是這樣寫，紀錄和公布的班表一致，薪資結算整週時才對得起來，也不必有人去解釋差異"],["The actual meal start and end times as they occurred, and for a meal that was late, short or missed, an extra hour of pay at the regular rate of compensation showing as its own line on the itemized wage statement","實際的用餐開始與結束時間，而且用餐時間延後、縮短或沒吃到時，要按正常工資率多給一小時的加給，並在薪資明細上單獨列一行"],["Total hours worked only, since meal times are not part of the time record","只要記總工時就好，因為用餐時間不屬於出勤紀錄"],["Nothing unusual, because a late meal is corrected by giving you a longer meal the following day","沒什麼特別的，因為用餐時間延後，隔天讓你吃久一點就補回來了"]],"a":1,"x":["The record has to reflect what happened, not what was planned, and it is the pairing of the two that matters. Accurate meal punches show the late meal, and the extra hour of pay for a non compliant meal or rest period is what the wage statement has to itemise so it can be audited later. Time cannot be made up the next day, and a corrected schedule does not erase the premium for the day it was missed. If you are asked to sign a week that does not match what you lived, say so before you sign. Authority: Labor Code 226 on the itemized wage statement, 226.7 on the additional hour of pay, and 512 with the applicable IWC wage order on the meal periods themselves. VERIFY the premium calculation and the record retention period.","紀錄要反映實際發生的事，不是原本規劃的事，而重點在於兩者是成對出現的。準確的用餐打卡會顯示那次遲到的用餐時間，而未依規定提供用餐或休息時段所應給付的一小時額外工資，必須在薪資明細上單獨列示，日後才查得出來。時間沒辦法隔天補回來，重排班表也不會消滅漏掉那天所產生的補償工資。如果對方要你簽的那一週和你實際經歷的不一樣，請在簽名之前就講出來。法源：Labor Code 226（薪資明細應載事項）、226.7（額外一小時工資）、512 及適用的 IWC 工資命令（用餐時間本身）。補償工資的計算方式與紀錄保存年限，請人工查證（VERIFY）。"]}]};

/* Three things were wrong here and all three are keyboard-fatal.
   1. Focus moved in but nothing stopped Tab walking straight back out to the
      page behind the scrim, where the controls are invisible but still live.
   2. Nothing returned focus to the trigger on close, so Escape dropped the
      user on <body> and the next Tab restarted from the top bar.
   3. A closed drawer is only translated off screen, and its last innerHTML is
      never cleared, so Acknowledge / Escalate / File / Hold stayed in the tab
      order permanently. aria-hidden on a container that can hold focus is also
      an ARIA violation in its own right. */
let drawerOpener=null;

function openDrawer(html,foot){const d=$('#drawer');
  if(!d.classList.contains('on'))drawerOpener=document.activeElement;
  d.innerHTML=html+(foot?`<div class="foot">${foot}</div>`:'');
  d.removeAttribute('inert');
  d.classList.add('on');d.setAttribute('aria-hidden','false');$('#scrim').classList.add('on');
  $('#app').setAttribute('inert','');
  animateBars(d);const c=d.querySelector('.xbtn');if(c)c.focus();}
function closeDrawer(){const d=$('#drawer');
  const wasOpen=d.classList.contains('on');
  d.classList.remove('on');d.setAttribute('aria-hidden','true');d.setAttribute('inert','');
  $('#scrim').classList.remove('on');$('#app').removeAttribute('inert');
  if(wasOpen&&drawerOpener&&document.contains(drawerOpener)&&drawerOpener.offsetParent!==null){
    drawerOpener.focus();
  }
  drawerOpener=null;}
function trapFocus(e){const d=$('#drawer');
  if(e.key!=='Tab'||!d.classList.contains('on'))return;
  const f=[...d.querySelectorAll(FOCUSABLE)].filter(el=>el.offsetParent!==null);
  if(!f.length)return;

  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}

/* ============ router + events (A7) ============ */
/* render() replaces the whole application subtree, which destroys whatever the
   user was standing on and drops focus to <body>. Record enough to find the
   replacement afterwards. Data attributes are stable across a re-render; DOM
   identity is not. */
function focusKey(el){
  if(!el||el===document.body||!el.getAttribute)return null;
  if(el.id)return '#'+CSS.escape(el.id);
  for(const a of ['data-persona','data-lang','data-metric','data-filter','data-tab',
                  'data-ctab','data-cbanner','data-cregion','data-cdept','data-cstatus',
                  'data-creason','data-cart','data-cplang','data-cfocus',
                  'data-crole','data-cstate','data-ccourse','data-rloc','data-rtype',
                  'data-rtreat','data-rlost','data-inc','data-emp','data-store',
                  'data-pickemp','data-module','data-drill','data-zoom',
                  'data-apick','data-adept','data-acourse']){
    const v=el.getAttribute(a); if(v!=null)return `[${a}="${CSS.escape(v)}"]`;
  }
  return null;
}
function render(){
  document.body.dataset.lang=LANG;
  // Without this the chrome and every string switch to Traditional Chinese while
  // the document still declares itself English, so a screen reader reads it with
  // English pronunciation rules.
  document.documentElement.lang=LANG==='zh'?'zh-TW':'en';
  const key=focusKey(document.activeElement);
  const v=S.module?viewModule():S.persona==='hq'?viewHQ():S.persona==='legal'?viewLegal():S.persona==='mgr'?viewMgr():viewEmp();
  $('#app').innerHTML=chrome()+v;
  if(key){try{const back=$('#app').querySelector(key);if(back)back.focus();}catch(err){}}
  animateBars();
  const mm=window.matchMedia('(max-width:640px)').matches;
  document.querySelectorAll('.mobileonly').forEach(el=>el.style.display=mm?(el.classList.contains('bottomnav')?'flex':(el.classList.contains('seg')?'flex':'block')):'none');
  bindMap();
}
/* ============ real map surface ============
   The app re-renders by replacing innerHTML, which would destroy a WebGL
   context on every state change. So the map lives in a detached node that is
   moved back into the mount after each render. Moving a DOM node preserves the
   canvas and its context, so the map keeps its position and never re-downloads
   tiles just because a filter chip was clicked. */
let GL=null,GLEL=null,GLREADY=false,GLMARK=[];
function glFail(msg){
  const m=document.getElementById('glmount'); if(!m||document.getElementById('glfail'))return;
  const d=document.createElement('div'); d.id='glfail';
  d.innerHTML='<b>'+esc(msg)+'</b>The map needs network access to draw tiles. Every other panel on this page still works.';
  m.appendChild(d);
}
function cssVar(v){
  if(!/^var\(/.test(v))return v;
  return getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim()||'#8B8D85';
}
function glPinSVG(s,on){
  const col=cssVar(markerColor(s)), bw=s.b==='99'?'#00A650':'#006858';
  const w=on?36:26,h=on?47:34;
  return `<svg width="${w}" height="${h}" viewBox="0 0 30 39" role="img" aria-label="${esc(s.c)} ${esc(s.city)}">
    <path d="M15 38C15 38 28 24.5 28 14.5A13 13 0 0 0 2 14.5C2 24.5 15 38 15 38Z" fill="${bw}" stroke="#fff" stroke-width="2.2"/>
    <circle cx="15" cy="14.5" r="5.6" fill="#fff"/><circle cx="15" cy="14.5" r="3.8" fill="${col}"/></svg>`;
}
function glDrawPins(){
  if(!GL||!GLREADY)return;
  GLMARK.forEach(m=>m.remove()); GLMARK=[];
  STORES.filter(s=>s.lat!=null).filter(inRadius).forEach(s=>{
    const el=document.createElement('div');
    el.className='glpin'; el.tabIndex=0; el.setAttribute('role','button');
    const ss=storeStats(s);
    el.setAttribute('aria-label',`${s.c} ${s.city} ${s.st}. ${ss.pct} percent current. ${ss.drillsOverdue} drills overdue.`);
    el.innerHTML=glPinSVG(s,S.sel&&S.sel.c===s.c);
    const go=e=>{e.stopPropagation();S.sel=st(s.c);storeDrawer(s.c);};
    el.onclick=go; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e);}};
    GLMARK.push(new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([s.lng,s.lat]).addTo(GL));
  });
}
function ensureGL(){
  const mount=document.getElementById('glmount'); if(!mount)return;
  if(!GLEL){GLEL=document.createElement('div');GLEL.style.cssText='position:absolute;inset:0';}
  if(GLEL.parentNode!==mount){mount.appendChild(GLEL);}
  if(!GL){
    if(typeof maplibregl==='undefined'){glFail('Map library unavailable');return;}
    try{
      GL=new maplibregl.Map({container:GLEL,
        style:'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center:[-98.4,39.5],zoom:3.1,attributionControl:{compact:true}});
    }catch(err){glFail('Map could not start');return;}
    GL.on('load',()=>{GLREADY=true;glDrawPins();});
    GL.on('error',()=>glFail('Basemap tiles unavailable'));
  }
  GL.resize(); glDrawPins();
  // Radius search recentres the map on the chosen store.
  if(S.radius.lat!=null&&GLREADY){
    GL.easeTo({center:[S.radius.lng,S.radius.lat],zoom:Math.max(6,11-Math.log2(S.radius.mi)),duration:REDUCED()?0:500});
  }
}

function bindMap(){
  ensureGL();
  const svg=$('#usmap');if(!svg)return;
  let drag=null;
  const set=(x,y,k)=>{S.mapView={x:x,y:y,k:Math.max(1,Math.min(9,k))};
    svg.setAttribute('viewBox',`${S.mapView.x} ${S.mapView.y} ${PROJ.W/S.mapView.k} ${PROJ.H/S.mapView.k}`);};
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:S.mapView.x,vy:S.mapView.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
  svg.addEventListener('pointermove',e=>{if(!drag)return;
    const r=svg.getBoundingClientRect(),sc=(PROJ.W/S.mapView.k)/r.width;
    set(drag.vx-(e.clientX-drag.x)*sc,drag.vy-(e.clientY-drag.y)*sc,S.mapView.k)});
  const end=()=>{drag=null;svg.classList.remove('drag')};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  svg.addEventListener('wheel',e=>{e.preventDefault();
    const r=svg.getBoundingClientRect(),k0=S.mapView.k,k=Math.max(1,Math.min(9,k0*(e.deltaY<0?1.15:1/1.15)));
    const mx=S.mapView.x+(e.clientX-r.left)/r.width*(PROJ.W/k0), my=S.mapView.y+(e.clientY-r.top)/r.height*(PROJ.H/k0);
    set(mx-(e.clientX-r.left)/r.width*(PROJ.W/k), my-(e.clientY-r.top)/r.height*(PROJ.H/k), k)},{passive:false});
}
function zoomTo(dir){const k=dir===0?1:S.mapView.k*(dir>0?1.6:1/1.6);
  if(dir===0){S.mapView={x:0,y:0,k:1}}else{
    const cx=S.mapView.x+PROJ.W/S.mapView.k/2, cy=S.mapView.y+PROJ.H/S.mapView.k/2;
    const kk=Math.max(1,Math.min(9,k));S.mapView={x:cx-PROJ.W/kk/2,y:cy-PROJ.H/kk/2,k:kk};}
  render();}
function centerOn(code){const s=st(code);if(!s){S.radius={lat:null,lng:null,mi:S.radius.mi};S.mapView={x:0,y:0,k:1};return render()}
  S.radius={lat:s.lat,lng:s.lng,mi:S.radius.mi,c:code};
  const[x,y]=projXY(s.lat,s.lng);const k=Math.max(1.6,Math.min(6,900/S.radius.mi));
  S.mapView={x:x-PROJ.W/k/2,y:y-PROJ.H/k/2,k:k};render();}

document.addEventListener('click',e=>{
  const T_=sel=>e.target.closest(sel);
  if(T_('[data-close]')||e.target.id==='scrim')return closeDrawer();
  let el;
  if(el=T_('[data-persona]')){S.persona=el.dataset.persona;S.module=null;S.tab='training';S.filter='all';closeDrawer();return render()}

     <body>, so a bare [data-lang] made e.target.closest() match <body> for every
     click on the page, and this branch swallowed the lot: metric buttons, filter
     chips, tabs, modules, incident rows, employee rows, store rows and the
     roster picker were all dead, silently re-rendering in the same language
     instead of doing their job. */
  if(el=T_('button[data-lang]')){LANG=el.dataset.lang;return render()}
  if(el=T_('[data-metric]')){S.mapMetric=el.dataset.metric;return render()}

  if(el=T_('[data-tab]')){S.tab=el.dataset.tab;S.filter='all';return render()}

  if(el=T_('[data-inc]')){return incDrawer(el.dataset.inc)}
  if(el=T_('[data-emp]')){return empDrawer(el.dataset.emp)}

     reason recorded above: <html> carries data-persona and <body> carries
     data-view, so a bare closest() matches the document root and eats the
     event before anything else sees it. */
  if(el=T_('button[data-ctab]')){S.campaign.ctab=el.dataset.ctab;S.campaign.pending=null;render();
    const pn=document.getElementById('camp-panel');

    {banner:'all',regions:[],states:[],roles:[],depts:[],courses:[],status:'gap'});return campRefresh()}

  function boot(){
    // The store list renders FIRST and never waits on the map. If the library or
    // the tile server is slow, blocked, or down, the rail, filters, radius search
    // and store detail all still work. Pins arrive when the map is ready.
    renderList();
  
    if(typeof maplibregl==='undefined'){ mapFail('Map library unavailable'); return; }
    try{
      map=new maplibregl.Map({
        container:'map',
        style:'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center:S.center, zoom:3.4, attributionControl:{compact:true}
      });
    }catch(err){ mapFail('Map could not start'); return; }
    map.on('load',()=>{mapReady=true;renderPins();});
    // If the basemap style cannot load (offline, blocked network, CDN down) the
    // canvas would otherwise be a silent grey rectangle. Say what happened, and
    // keep the rail, the filters and the drawer fully usable without it.
    map.on('error',()=>mapFail('Basemap tiles unavailable'));
    if(map) map.on('moveend',()=>{
      if(S.sel){const s=STORES.find(x=>x.c===S.sel); if(s) showHover(s);}
      document.getElementById('mv-redo').classList.add('show');
    });
    if(map) map.on('movestart',()=>{S.moved=true;});
    if(map) map.on('click',()=>{S.sel=null;hideHover();renderList();});
  
    document.getElementById('mv-zin').onclick=()=>map&&map.zoomIn();

      setLocateState('busy');
      navigator.geolocation.getCurrentPosition(pos=>{
        const {latitude:lat,longitude:lng}=pos.coords;
        S.center=[lng,lat]; S.radiusActive=true;
        if(meMarker) meMarker.remove();
        const el=document.createElement('div');
        el.className='mepin'; el.setAttribute('role','img'); el.setAttribute('aria-label','Your location');
        meMarker=new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(map);
        map.easeTo({center:[lng,lat],zoom:8,duration:700});
        setLocateState('on');
        renderList();
      }, err=>{
        // Refused or unavailable. Say so once rather than leaving a dead control.
        setLocateState('denied');
        document.getElementById('mv-count').innerHTML =
          'Location unavailable, showing the whole network instead';
      }, {enableHighAccuracy:false, timeout:8000, maximumAge:600000});
    };
    function setLocateState(s){
      const b=document.getElementById('mv-zme'); if(!b) return;
      b.classList.toggle('on', s==='on');
      b.setAttribute('aria-label',
        s==='busy'?'Finding your location':
        s==='on'?'Centred on your location':
        s==='denied'?'Location unavailable':'Use my location');

    document.getElementById('mv-zout').onclick=()=>map&&map.zoomOut();
  
    const doSearch=()=>{
      S.radiusActive=true;
      if(map){const c=map.getCenter(); S.center=[c.lng,c.lat];}
      document.getElementById('mv-redo').classList.remove('show');

    };
    document.getElementById('mv-dosearch').onclick=doSearch;
    document.getElementById('mv-redo').onclick=doSearch;
  
    const r=document.getElementById('mv-rad');

    fill();
    r.oninput=()=>{S.radius=+r.value;document.getElementById('mv-radval').textContent=r.value+' mi';fill();};
    r.onchange=()=>{S.radiusActive=true;renderList();};
  
    const geo=()=>{
      const q=document.getElementById('mv-q').value.trim().toLowerCase();
      if(!q) return;
      const hit=STORES.find(s=>s.city.toLowerCase().includes(q)||s.zip===q||s.st.toLowerCase()===q
        ||s.c.toLowerCase()===q||s.a.toLowerCase().includes(q));
      if(hit){S.radiusActive=true;S.center=[hit.lng,hit.lat];
        if(map)map.easeTo({center:[hit.lng,hit.lat],zoom:9,duration:600});renderList();}
      else {document.getElementById('mv-count').innerHTML=`No match for "${esc(q)}" in the store directory`;}
    };
    document.getElementById('mv-gobtn').onclick=geo;
    document.getElementById('mv-q').onkeydown=e=>{if(e.key==='Enter')geo();};
  
    root.addEventListener('click',e=>{
      if(e.target.closest('#clearall')){S.filter='all';S.radiusActive=false;renderList();return;}
      const chip=e.target.closest('.chip');
      if(chip&&chip.dataset.f){S.filter=chip.dataset.f;renderList();return;}
      const per=e.target.closest('button[data-persona]');
      if(per){
        S.persona=per.dataset.persona; S.filter='all'; S.sel=null; hideHover();
        document.querySelectorAll('button[data-persona]').forEach(b=>b.setAttribute('aria-pressed',b===per));
        document.documentElement.dataset.persona=S.persona;
        S.radiusActive=false;
        if(S.persona==='mgr'){const s=STORES.find(x=>x.c==='R107');S.center=[s.lng,s.lat];S.radius=50;S.radiusActive=true;
          r.value=50;document.getElementById('mv-radval').textContent='50 mi';fill();
          map.easeTo({center:[s.lng,s.lat],zoom:10,duration:600});}
        renderList(); return;
      }
      const mv=e.target.closest('button[data-view]');
      if(mv){document.body.dataset.view=mv.dataset.view;
        document.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',b===mv));
        if(mv.dataset.view==='map') setTimeout(()=>map.resize(),60); return;}
      const open=e.target.closest('button[data-open]');
      if(open){openDrawer(open.dataset.open);return;}
      if(e.target.closest('.dclose')||e.target.closest('#scrim')){closeDrawer();return;}
      const tab=e.target.closest('button[data-tab]');

      if(e.target.closest('#selx')){S.sel=null;hideHover();renderList();return;}
      if(e.target.closest('#hovx')){S.sel=null;hideHover();renderList();return;}
      const card=e.target.closest('.scard');
      if(card){select(card.dataset.c,true);
        if(window.matchMedia('(max-width:900px)').matches){
          document.body.dataset.view='map';
          document.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view==='map'));
          setTimeout(()=>map.resize(),60);}
        return;}
    });
    root.addEventListener('keydown',e=>{
      if(e.key==='Escape'){
        if(document.getElementById('mv-drawer').classList.contains('open')){closeDrawer();}
        else {S.sel=null;hideHover();renderList();}

      if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(card.dataset.c,true);}
    });
  }

/* ============================================================================
   Expanded map view.

   This is the v3 store finder, folded into the app as a full screen overlay
   rather than living as a second file. There is now ONE map.

   Two things make that safe inside a single file app:

   1. **Everything is inside an IIFE.** The finder has its own S, map, markers,
      view and STORES. The app has an S and a STORES too. Without a closure the
      second one silently wins and the app breaks in a way that looks like a
      rendering bug.

   2. **Every finder CSS rule is scoped under .mv, including its design tokens.**
      The finder defines --ok, --warn, --card and --rule with different values
      than the app. Left on :root those would repaint the entire console.

   The overlay reads the app's own STORES and storeStats(), so the map and the
   consoles cannot disagree about how many stores exist or how compliant one is.
   ========================================================================== */
window.MapView = (function () {
  let mounted = false, root = null;

  /* The app's store shape is not the finder's. Adapt rather than duplicate,
     so store counts and compliance numbers have exactly one source. */
  function adapt() {
    return STORES.map(s => {
      const ss = (typeof storeStats === 'function') ? storeStats(s) : {};
      const open = (typeof openInc === 'function')
        ? openInc().filter(i => i.store === s.c).length : 0;
      let clock = null;
      if (typeof openInc === 'function' && typeof bindingClock === 'function') {
        const cs = openInc().filter(i => i.store === s.c)
          .map(bindingClock).filter(Boolean);
        if (cs.some(c => c.st && c.st.left < 0)) clock = 'expired';
        else if (cs.length) clock = 'expiring';
      }
      return {
        c: s.c, b: s.b, n: s.b === '99' ? '99 Ranch Market' : '168 Market',
        a: s.a, city: s.city, st: s.st, zip: '',
        lat: s.lat, lng: s.lng, ph: s.ph || '', pid: s.pid || '',
        rt: s.rt != null ? parseFloat(s.rt) : null,
        rc: s.rc != null ? s.rc : null,
        hrs: s.h ? [s.h, s.h, s.h, s.h, s.h, s.h, s.h] : ['', '', '', '', '', '', ''],
        head: ss.head || 0, pct: ss.pct != null ? ss.pct : 0,
        drills: ss.drillsOverdue || 0, inc: open, clock: clock,
        enr: s.enr !== false, geo: s.lat == null ? 'pending' : 'ok'
      };
    });
  }

  function open() {
    if (mounted) { root.hidden = false; setTimeout(() => MV.boot(), 30); return; }
    root = document.createElement('div');
    root.className = 'mv';
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-modal', 'true');
    root.setAttribute('aria-label', 'Store network map');
    root.innerHTML = MV_MARKUP;
    document.body.appendChild(root);
    mounted = true;
    MV.STORES = adapt();
    MV.boot();
    const back = root.querySelector('#mvback');
    // Wired directly rather than through the app's delegated handler, because the
    // overlay is a sibling of #app and may sit outside that handler's subtree.
    back.addEventListener('click', close);
    back.focus();
  }

  function close() {
    if (!root) return;
    root.hidden = true;
    const btn = document.querySelector('[data-open-mapview]');
    if (btn) btn.focus();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && root && !root.hidden) {
      // Let the finder's own drawer take Escape first if it is open.
      const d = root.querySelector('.drawer.open');
      if (!d) { e.stopPropagation(); close(); }
    }
  }, true);

  return { open, close, adapt };
})();
