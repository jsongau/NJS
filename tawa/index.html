/* ==== SHELL PARTS CSS, generated by build-shell.py ==== */
/* ---- chrome ---- */
/* ==========================================================================
   NAVIGATION CHROME, styles
   Shell contract 11, sections 3, 4, 5 and 6. Owned by the chrome agent.

   Two rules govern every colour below.
   1. No raw hex. Everything is a token from the :root block, or an rgba of
      pure white over the jade top bar, which is how the shipped top bar
      already tints its own controls.
   2. Brand colour says whose store this is, status colour says how urgent
      this is, and they never overlap. --critical appears in exactly one
      selector here, .nv-b.crit, and the only task kind that can carry
      sev:'crit' is an expired Cal/OSHA clock. Nothing else in this file is
      allowed to borrow it.

   The z scale is the contract's, not invented here:
   proto banner 70, topbar 60, meganav 58, subnav 50, side rail 40.
   ========================================================================== */

:root{
  --tb-h:56px;        /* top bar, matches the shipped .topbar height */
  --pb-h:34px;        /* proto banner, remeasured on every render */
  --rail-w:232px;
  --rail-w-min:64px;
  /* Every sticky and fixed offset in this file is measured from this, so a two
     line proto banner on a narrow screen moves the whole stack down instead of
     hiding a row of tabs behind the banner. It has to live on :root, not on
     #shell: #meganav is mounted on <body> so it can outlive the innerHTML
     repaint, and a custom property declared on #shell would not reach it. */
  --chrome-h:calc(var(--tb-h) + var(--pb-h));
}

/* ---------- top bar, extended ------------------------------------------- */
/* The working agreement is a 44px touch target and the shipped segmented
   control was 32px. The bar itself stays 56px, so a 44px control needs the
   segment padding down to 3px and the vertical padding off the buttons. */
#topbar{height:var(--tb-h)}
#topbar .seg{padding:3px}
#topbar .seg button{min-height:44px;padding:0 11px;display:inline-flex;align-items:center;justify-content:center}
#topbar .bell{width:44px;height:44px}

#topbar .nv-tb{display:inline-flex;align-items:center;gap:var(--s2);height:44px;padding:0 12px;
  border-radius:9px;background:rgba(255,255,255,.12);color:var(--card);
  font-size:12.5px;font-weight:600;white-space:nowrap;flex:none}
#topbar .nv-tb:hover{background:rgba(255,255,255,.24)}
#topbar .nv-tb[aria-expanded="true"]{background:var(--card);color:var(--brand-jade-deep)}
#topbar .nv-tb svg{flex:none}
#topbar .nv-kbd{font-family:var(--mono);font-size:10.5px;line-height:1.6;
  border:1px solid rgba(255,255,255,.42);border-radius:5px;padding:0 5px}
#topbar .nv-tb[aria-expanded="true"] .nv-kbd{border-color:var(--rule)}
/* The open count rides the mega trigger so the number is visible without
   opening anything. Gold, not red: red is the statutory clock's colour. */
#topbar .nv-tbn{font-family:var(--mono);font-size:11px;font-weight:600;
  background:var(--brand-gold);color:var(--brand-jade-deep);border-radius:20px;padding:1px 7px}

/* The banner is z 70 and nothing may cover it, so it needs a stacking context
   of its own. Sticking it under the top bar also keeps it on screen, which is
   what non removable is supposed to mean. */
.protobar{position:sticky;top:var(--tb-h);z-index:70}

/* ---------- shell ------------------------------------------------------- */
#shell{display:flex;align-items:flex-start}
.nv-col{flex:1 1 auto;min-width:0}
/* The originals are promoted into #subnav. Hidden, not deleted, because the
   view functions still own them and this file is not allowed to edit them. */
#shell div.tabs.desktoponly{display:none}
#shell nav.bottomnav{display:none !important}
/* Sticky chrome overlaps the top of whatever a jump lands on without this. */
#shell section,#shell .pagehead{scroll-margin-top:calc(var(--chrome-h) + 104px)}

/* ---------- side rail --------------------------------------------------- */
/* Sticky, not fixed. Fixed would take the rail out of flow and leave the
   centred .wrap sitting underneath it, and it would also need a hand written
   offset for the two sticky bars above. */
#railnav{position:sticky;top:var(--chrome-h);z-index:40;align-self:flex-start;
  flex:0 0 var(--rail-w);width:var(--rail-w);
  max-height:calc(100vh - var(--chrome-h));overflow-y:auto;overflow-x:hidden;
  background:var(--card);border-right:1px solid var(--rule);
  padding:var(--s3) var(--s2) var(--s6)}
#railnav .nv-rhead{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);padding:var(--s2) var(--s3) var(--s2)}
[data-lang="zh"] #railnav .nv-rhead{text-transform:none;letter-spacing:.02em;font-weight:700}
#railnav .nv-ritem{display:flex;align-items:center;gap:var(--s3);width:100%;
  min-height:44px;padding:var(--s2) var(--s3);border-radius:9px;
  font-size:13.5px;font-weight:600;color:var(--ink);text-align:left}
#railnav .nv-ritem:hover{background:var(--action-soft)}
#railnav .nv-ritem[aria-current="page"]{background:var(--action-soft);color:var(--brand-jade-deep)}
#railnav .nv-ritem svg{flex:none;color:var(--ink-muted)}
#railnav .nv-ritem[aria-current="page"] svg{color:var(--brand-jade)}
#railnav .nv-rlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#railnav .nv-rtog{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:44px;
  padding:var(--s2) var(--s3);margin-top:var(--s2);border-top:1px solid var(--rule);
  border-radius:0;font-size:12px;font-weight:600;color:var(--ink-muted)}
#railnav .nv-rtog:hover{color:var(--ink)}

/* ---------- count badge ------------------------------------------------- */
/* One badge component, four states, and the severity is the task engine's
   sev field rather than anything this file decides. */
.nv-b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;font-weight:600;
  min-width:22px;height:20px;padding:0 6px;border-radius:20px;
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.nv-b.zero{background:var(--action-soft);color:var(--brand-jade-deep);opacity:.72}
.nv-b.info{background:var(--action-soft);color:var(--brand-jade-deep)}
.nv-b.warn{background:var(--warn);color:var(--card)}
.nv-b.late{background:var(--alert);color:var(--card)}
.nv-b.crit{background:var(--critical);color:var(--card)}

/* ---------- sub nav and mini nav ---------------------------------------- */
/* One sticky wrapper holding both, so the two can never fight over an offset.
   position:sticky resolves against the nearest scrolling ancestor: this is a
   child of the page flow with no overflow ancestor between it and <html>, so
   it resolves against the viewport. Verified by scrolling. */
.nv-stack{position:sticky;top:var(--chrome-h);z-index:50;
  background:var(--paper);border-bottom:1px solid var(--rule)}
#subnav{display:flex;gap:var(--s1);padding:0 var(--s4);overflow-x:auto;scrollbar-width:none}
#subnav::-webkit-scrollbar{display:none}
#subnav button{display:inline-flex;align-items:center;gap:7px;padding:0 12px;min-height:44px;
  font-size:13.5px;font-weight:600;color:var(--ink-muted);
  border-bottom:2px solid transparent;white-space:nowrap}
#subnav button:hover{color:var(--ink)}
#subnav button[aria-current="page"]{color:var(--brand-jade);border-bottom-color:var(--brand-jade)}
#subnav button[aria-disabled="true"]{opacity:.45;cursor:not-allowed}

#mininav{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  padding:var(--s2) var(--s4);border-top:1px solid var(--rule);background:var(--card)}
#mininav .nv-crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:12px;color:var(--ink-muted);min-width:0}
#mininav .nv-crumb b{color:var(--ink);font-weight:600}
#mininav .nv-sep{color:var(--rule-int)}
#mininav .nv-clear{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 6px 0 8px;
  border:1px solid var(--rule-int);border-radius:20px;background:var(--action-soft);
  color:var(--brand-jade-deep);font-size:12px}
#mininav .nv-clear:hover{background:var(--card)}
#mininav .nv-clear svg{color:var(--ink-muted)}
@media(max-width:900px){#mininav .nv-clear{min-height:44px}}
#mininav .nv-grow{flex:1 1 auto}
#mininav .nv-ctx{display:flex;align-items:center;gap:var(--s2);font-size:12px;color:var(--ink-muted)}
#mininav select#storepick{min-height:38px;max-width:280px}
#mininav .nv-step{display:flex;align-items:center;gap:var(--s1)}
#mininav .nv-step button{display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 10px;
  border:1px solid var(--rule-int);border-radius:8px;background:var(--card);
  font-size:12px;font-weight:600;color:var(--ink)}
#mininav .nv-step button:hover:not([disabled]){background:var(--action-soft)}
#mininav .nv-step button[disabled]{opacity:.45;cursor:not-allowed}
#mininav .nv-pos{font-family:var(--mono);font-size:12px;color:var(--ink-muted);padding:0 var(--s1)}
#mininav .nv-cur{font-size:12px;color:var(--ink-muted);max-width:44ch;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- mega nav ---------------------------------------------------- */
/* Sits under the top bar and under the proto banner on purpose. z 58 against
   the bar's 60 and the banner's 70 is the contract's scale, and it is also
   the right visual answer: a panel that drops out of a control should not
   paint over the control it dropped out of. */
#meganav{position:fixed;left:0;right:0;top:var(--chrome-h);bottom:0;z-index:58;
  background:rgba(26,26,23,.4);display:flex;justify-content:center;align-items:flex-start;
  padding:0 var(--s4) var(--s4)}
#meganav[hidden]{display:none}
.nv-mega-in{width:100%;max-width:1320px;max-height:100%;overflow:auto;
  background:var(--card);border:1px solid var(--rule);border-top:0;border-radius:0 0 14px 14px;
  box-shadow:0 18px 44px rgba(26,26,23,.22);padding:var(--s5) var(--s5) var(--s4)}
.nv-mega-head{display:flex;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s4)}
.nv-mega-ttl{font-size:17px;font-weight:600}
.nv-mega-sub{font-size:12.5px;color:var(--ink-muted);margin-top:2px;flex:1;min-width:0}
.nv-mega-head > div{flex:1;min-width:0}
.nv-x{width:44px;height:44px;flex:none;display:grid;place-items:center;
  border:1px solid var(--rule);border-radius:9px;color:var(--ink-muted)}
.nv-x:hover{background:var(--action-soft);color:var(--ink)}

.nv-mega-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4)}
.nv-mcol{border:1px solid var(--rule);border-radius:12px;padding:var(--s3);min-width:0}
.nv-mcol.off{background:var(--paper)}
.nv-mch{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s2) var(--s2)}
.nv-mch .n{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.nv-mch .who{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-muted)}
[data-lang="zh"] .nv-mch .who{text-transform:none;letter-spacing:.02em}
/* The wall is shown, never hidden. A permissions demo that removes the link
   instead of explaining it reads as a bug in the permissions. */
.nv-wall{font-size:11.5px;line-height:1.45;color:var(--ink-muted);
  background:var(--card);border:1px solid var(--rule);border-radius:9px;
  padding:var(--s2);margin:0 var(--s1) var(--s2);display:flex;gap:6px;align-items:flex-start}
.nv-wall svg{flex:none;color:var(--ink-muted)}

.nv-mrow{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:44px;
  padding:var(--s2);border-radius:9px;text-align:left;color:var(--ink)}
button.nv-mrow:hover{background:var(--action-soft)}
.nv-mrow svg.nv-ic{flex:none;color:var(--ink-muted)}
.nv-mrow .g{flex:1;min-width:0}
.nv-mrow .t{font-size:13px;font-weight:600;line-height:1.3}
.nv-mrow .s{font-size:11.5px;color:var(--ink-muted);line-height:1.35}
.nv-mrow[aria-current="page"]{background:var(--action-soft)}
.nv-mrow[aria-disabled="true"]{opacity:.62;cursor:not-allowed}
.nv-mrow.rest .t{font-weight:600}

/* Teardown doc 03 section 2 item 3: the strongest block on that hub is the one
   that names what the viewer personally has to unblock. Computed here, never
   written by hand. */
.nv-mega-foot{margin-top:var(--s4);border-top:1px solid var(--rule);padding-top:var(--s3);
  display:flex;gap:var(--s3);align-items:flex-start}
.nv-mega-foot .lab{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--brand-jade);white-space:nowrap;padding-top:2px}
[data-lang="zh"] .nv-mega-foot .lab{text-transform:none;letter-spacing:.02em}
.nv-mega-foot .txt{font-size:13px;line-height:1.5;flex:1;min-width:0}

/* ---------- breakpoints -------------------------------------------------- */
/* 1120 collapses the rail to icons, 900 hides it, contract section 4. */
#shell[data-rail="icons"]{--rail-w:var(--rail-w-min)}
#shell[data-rail="icons"] #railnav .nv-rlabel,
#shell[data-rail="icons"] #railnav .nv-b,
#shell[data-rail="icons"] #railnav .nv-rhead,
#shell[data-rail="icons"] #railnav .nv-rtog span{display:none}
#shell[data-rail="icons"] #railnav .nv-ritem,
#shell[data-rail="icons"] #railnav .nv-rtog{justify-content:center;padding-left:0;padding-right:0}

@media(max-width:1120px){
  #shell{--rail-w:var(--rail-w-min)}
  #railnav .nv-rlabel,#railnav .nv-b,#railnav .nv-rhead,#railnav .nv-rtog span{display:none}
  #railnav .nv-ritem,#railnav .nv-rtog{justify-content:center;padding-left:0;padding-right:0}
  #topbar .nv-tb .nv-lbl{display:none}
  #topbar .nv-tb{padding:0 10px}
  .nv-mega-cols{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){
  #railnav{display:none}
  #topbar .nv-kbd{display:none}
  #mininav{gap:var(--s2)}
  #mininav .nv-cur{display:none}
  /* Touch targets, contract section 4. */
  #mininav .nv-step button,#mininav select#storepick{min-height:44px}
}
@media(max-width:640px){
  /* The shipped bar tightened its own segments here and the 44px rule outranks
     it, so the width has to come out of the padding instead of the height. */
  #topbar .seg button{padding:0 8px;font-size:11.5px}
  #topbar .nv-tb{padding:0 8px}
  #topbar .nv-tbn{display:none}
  .nv-mega-cols{grid-template-columns:1fr}
  .nv-mega-in{padding:var(--s4) var(--s3)}
  #meganav{padding:0}
  .nv-mega-in{border-radius:0;border-left:0;border-right:0}
  #subnav,#mininav{padding-left:var(--s3);padding-right:var(--s3)}
  #mininav .nv-crumb .nv-hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){
  #meganav,.nv-mega-in{transition:none}
}

/* ---- hero ---- */
/* ==========================================================================
   PERSONA HEROES AND BRAND MARKS
   Shell contract 11, sections 3 (#hero is the only id claimed here), 4 (no new
   z value is invented, the hero sits in normal flow inside #app), 6 (brand
   colour says whose store this is, status colour says how urgent this is) and
   7 (the 3px status edge never becomes a fill, so nothing borrows --critical).

   HEIGHT BUDGET, stated as arithmetic rather than as an intention, because the
   store console hero was already cut once in this project from 380px to 194px
   for taking space the work needed:

     desktop   12 padding
             + 76 identity band   (eyebrow 16, title 27, subtitle 17, need 16)
             + 10 gap
             + 90 today row       (10 pad, 34 sentence, 6 gap, 30 button, 10 pad)
             + 12 padding
             = 200px, which is the ceiling, not a target to grow into.

     phone   the denominators are dropped, the KPI strip folds to two columns,
             and the Today row becomes a snap strip one card tall rather than a
             stack three cards tall. That is the "less on mobile" rule: the
             hero loses height on a small screen instead of gaining it.
   ========================================================================== */

/* ---------- the hero shell ---------------------------------------------- */

#hero{
  position:relative;
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:14px;
  padding:var(--s3) var(--s4) var(--s3) var(--s5);
  margin-bottom:var(--s5);
}
/* The 4px flush left edge bar, docs/06 section 4: the cheapest possible banner
   signal, because it identifies the store without competing for the eye. It is
   a graphic, never text, so the saturated logo colour is correct here. */
#hero::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  border-radius:14px 0 0 14px;background:var(--r99-deep);
}
#hero[data-hbanner="168"]::before{background:var(--m168);}
/* Two banners in one console. Two solid stops, not a blend, because a blend
   invents a third colour that means nothing. */
#hero[data-hbanner="both"]::before{
  background:linear-gradient(var(--r99-deep) 0 50%, var(--m168) 50% 100%);
}
/* chrome.css.part gives sections and the old page head a scroll offset under
   the sticky stack. The hero is now the first thing a surface jump lands on. */
#hero{scroll-margin-top:calc(var(--chrome-h, 56px) + 104px);}

/* ---------- identity band ------------------------------------------------ */

#hero .h-band{display:flex;gap:var(--s5);align-items:flex-start;flex-wrap:wrap;}
#hero .h-id{flex:1 1 340px;min-width:0;}
#hero .h-eye{
  display:flex;align-items:center;gap:var(--s2);
  font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);line-height:1.45;
}
[data-lang="zh"] #hero .h-eye{text-transform:none;letter-spacing:.02em;font-weight:700;}
#hero .h-eye .h-marks{display:inline-flex;align-items:center;gap:3px;}
#hero h1{font-size:23px;line-height:1.18;letter-spacing:-.01em;margin-top:2px;}
#hero .h-sub{font-size:13px;line-height:1.35;color:var(--ink-muted);margin-top:3px;}
#hero .h-sub b{color:var(--ink);font-weight:600;}
#hero .h-act{display:flex;gap:var(--s2);align-items:center;flex:none;}
#hero .h-act select{width:auto;min-width:200px;}

/* ---------- need from you ------------------------------------------------ */

/* The strongest writing on the 405 hub was the section that named what the
   viewer personally must unblock, teardown 03 section 2. This is that line,
   computed from open schedule_meeting and litigation_hold rows rather than
   written down, so it cannot go stale while the data moves. */
#hero .h-need{
  display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;
  margin-top:var(--s2);padding-top:var(--s2);border-top:1px dashed var(--rule);
  font-size:12.5px;line-height:1.35;
}
#hero .h-need .h-needk{
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--brand-jade);flex:none;
}
[data-lang="zh"] #hero .h-need .h-needk{text-transform:none;letter-spacing:.02em;}
#hero .h-need .h-needt{color:var(--ink);}
#hero .h-need button{
  font-size:12px;font-weight:600;color:var(--action);
  text-decoration:underline;text-underline-offset:2px;min-height:24px;padding:0;
}
#hero .h-need button:hover{color:var(--brand-jade-deep);}

/* ---------- KPI strip ---------------------------------------------------- */

/* Teardown 03 section 2, take 2: every number carries a qualifier word inline,
   "3 at risk", not a bare count whose meaning only turns up in a subtitle. The
   denominator line underneath answers the other question, what is in the
   denominator, which is the Stripe rule already logged in docs/08. */
#hero .h-kpis{
  flex:1 1 430px;display:grid;gap:var(--s4);
  grid-template-columns:repeat(4,minmax(0,1fr));align-content:start;
}
#hero .h-k{min-width:0;}
#hero .h-k .h-v{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
#hero .h-k .v{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:21px;font-weight:600;line-height:1.1;letter-spacing:-.02em;
}
#hero .h-k .v.bad{color:var(--alert);}
#hero .h-k .v.warn{color:var(--warn);}
#hero .h-k .v.good{color:var(--ok);}
#hero .h-k .q{font-size:12px;font-weight:600;color:var(--ink);line-height:1.25;}
#hero .h-k .d{font-size:11px;line-height:1.35;color:var(--ink-muted);margin-top:2px;}

/* ---------- Today ------------------------------------------------------- */

#hero .h-todayhd{
  display:flex;align-items:baseline;gap:var(--s2);margin:var(--s3) 0 6px;
}
#hero .h-todayhd h2{
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin:0;
}
[data-lang="zh"] #hero .h-todayhd h2{text-transform:none;letter-spacing:.02em;}
#hero .h-todayhd .h-count{font-size:11.5px;color:var(--ink-muted);}
#hero .h-today{display:grid;gap:var(--s3);grid-template-columns:repeat(3,minmax(0,1fr));}
#hero .h-card{
  display:flex;flex-direction:column;gap:6px;min-width:0;
  border:1px solid var(--rule);border-left:3px solid var(--neutral);
  border-radius:10px;padding:10px var(--s3);background:var(--card);
}
/* Status colour on the card is a 3px left edge and nothing else, teardown 03
   section 5.2, so brand chrome stays uncontested and no fill can be mistaken
   for a statutory clock. */
#hero .h-card[data-hsev="crit"]{border-left-color:var(--critical);}
#hero .h-card[data-hsev="late"]{border-left-color:var(--alert);}
#hero .h-card[data-hsev="warn"]{border-left-color:var(--warn);}
#hero .h-card[data-hsev="info"]{border-left-color:var(--neutral);}
#hero .h-card .h-say{
  font-size:12.5px;font-weight:600;line-height:1.35;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
#hero .h-card .h-foot{display:flex;align-items:center;gap:var(--s3);margin-top:auto;}
#hero .h-card .h-imp{display:flex;align-items:baseline;gap:5px;min-width:0;flex:1 1 auto;}
#hero .h-card .h-impv{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:15px;font-weight:600;line-height:1.1;
}
#hero .h-card .h-impq{font-size:11px;color:var(--ink-muted);line-height:1.25;}
#hero .h-card .btn{flex:none;min-height:30px;padding:5px 11px;font-size:12px;border-radius:8px;}
#hero .h-rest{
  border:1px dashed var(--rule);border-radius:10px;padding:10px var(--s3);
  font-size:12.5px;color:var(--ink-muted);line-height:1.4;
}
#hero .h-rest b{color:var(--ink);}

/* ---------- employee variant --------------------------------------------- */

/* One person, their own progress, the next thing due. No network numbers: an
   employee has no use for a tile counting 72 stores, and putting one there is
   how a learner view turns into a dashboard nobody asked for. */
#hero[data-hpersona="emp"] .h-kpis{grid-template-columns:repeat(2,minmax(0,1fr));flex-basis:320px;}
#hero[data-hpersona="emp"] .h-today{grid-template-columns:minmax(0,1fr);}
#hero .h-prog{display:flex;align-items:center;gap:var(--s2);margin-top:6px;}
#hero .h-prog .h-track{
  flex:1 1 auto;height:6px;border-radius:3px;background:var(--rule);overflow:hidden;min-width:80px;
}
#hero .h-prog .h-fill{display:block;height:100%;background:var(--brand-jade);}

/* ---------- brand marks -------------------------------------------------- */

/* CLAUDE.md rule 5 and contract section 6: no trademarked logo ships in a
   publicly indexed deployment. These are drawn here from the palette. The
   numerals are stroked paths on a fixed 40 unit grid, not type, so 20px, 28px
   and 40px are the same drawing at three scales and nothing depends on which
   font happened to load. */
.bmark{flex:none;display:block;}
.bmark .bm-sq{fill:var(--r99-deep);}
.bmark-168 .bm-sq{fill:var(--m168);}
.bmark-readiness .bm-sq{fill:var(--banner-accent);}
/* --card is the only white in the token set, so it is the white used here. */
.bmark .bm-fig{fill:none;stroke:var(--card);stroke-linecap:round;stroke-linejoin:round;}
.bmark .bm-ch{fill:var(--card);}

/* The shipped product mark, tightened rather than replaced. It was 26px with a
   6px radius and the glyph sat optically high inside it; the radius now tracks
   the SVG marks at 24 percent, and the glyph is centred by grid rather than by
   line-height so it does not drift when the CJK face loads. */
.brand .mark{
  width:28px;height:28px;border-radius:7px;font-size:15px;line-height:1;
  letter-spacing:0;text-indent:0;font-weight:700;
}

/* ---------- palette proof, hq only --------------------------------------- */

/* Rendered behind the prototype framing, not as product chrome, because it is
   a note about how this build is put together rather than a thing a user acts
   on. Gold edge and warm panel are the shipped .callout treatment. */
.h-proof{
  background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--brand-gold);
  border-radius:0 12px 12px 0;padding:var(--s4);margin-bottom:var(--s5);
}
.h-proof .h-proofeye{
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin-bottom:var(--s1);
}
[data-lang="zh"] .h-proof .h-proofeye{text-transform:none;letter-spacing:.02em;}
.h-proof h2{font-size:15px;margin-bottom:6px;}
.h-proof .h-rule{font-size:12.5px;line-height:1.5;color:var(--ink);max-width:86ch;}
.h-proof .h-rule b{font-weight:700;}
.h-proof .h-cols{display:grid;gap:var(--s5);grid-template-columns:repeat(2,minmax(0,1fr));margin-top:var(--s4);}
.h-proof .h-colhd{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-muted);margin-bottom:6px;
}
[data-lang="zh"] .h-proof .h-colhd{text-transform:none;letter-spacing:.02em;}
.h-proof .h-sw{display:flex;align-items:flex-start;gap:var(--s3);padding:4px 0;}
.h-proof .h-chip{
  flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--rule);margin-top:1px;
}
.h-proof .h-swt{min-width:0;}
.h-proof .h-swn{font-family:var(--mono);font-size:11.5px;font-weight:600;line-height:1.3;}
.h-proof .h-swd{font-size:11.5px;color:var(--ink-muted);line-height:1.35;}
.h-proof .h-marks{display:flex;align-items:center;gap:var(--s4);margin-top:var(--s4);flex-wrap:wrap;}
.h-proof .h-markset{display:flex;align-items:flex-end;gap:var(--s2);}
.h-proof .h-marklb{font-size:11.5px;color:var(--ink-muted);}

/* The footer already carries the affiliation sentence in English only. This is
   the marks line, and the Chinese half of both, so no route ships a half
   translated legal notice. */
.h-footnote{margin-top:var(--s2);display:block;}

/* ---------- responsive --------------------------------------------------- */

@media (max-width:1120px){
  #hero .h-today{grid-template-columns:repeat(2,minmax(0,1fr));}
  #hero .h-card:nth-child(3){display:none;}
  .h-proof .h-cols{grid-template-columns:minmax(0,1fr);gap:var(--s4);}
}
@media (max-width:900px){
  #hero .h-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);flex-basis:280px;}
  #hero .h-act{width:100%;}
  #hero .h-act select{min-width:0;flex:1 1 auto;}
  /* Touch targets, contract section 4. */
  #hero .h-card .btn{min-height:44px;}
  #hero .h-need button{min-height:44px;}
}
@media (max-width:640px){
  #hero{padding:var(--s3) var(--s3) var(--s3) var(--s4);border-radius:12px;}
  #hero h1{font-size:19px;}
  #hero .h-band{gap:var(--s3);}
  #hero .h-k .d{display:none;}
  #hero .h-k .v{font-size:19px;}
  /* One card tall and scrolled sideways, so the hero gets shorter on a phone
     rather than three times taller. */
  #hero .h-today{
    display:flex;gap:var(--s2);overflow-x:auto;scroll-snap-type:x mandatory;
    margin:0 calc(var(--s3) * -1);padding:0 var(--s3) 4px;
    -webkit-overflow-scrolling:touch;
  }
  #hero .h-card{flex:0 0 84%;scroll-snap-align:start;}
  #hero .h-card:nth-child(3){display:flex;}
  .h-proof{padding:var(--s3);}
  .h-proof .h-marks{gap:var(--s3);}
}
@media (prefers-reduced-motion:reduce){
  #hero .h-today{scroll-behavior:auto;}
}

/* ---- inbox ---- */
/* ==========================================================================
   TASK INBOX. Drawer at #inbox, scrim at #inboxscrim, full page at .ibx-page.

   Colour rule, contract section 6: brand colour says whose store this is,
   status colour says how urgent this is, and they never overlap. Nothing in
   this file paints a brand token onto a count. --critical appears in exactly
   two selectors and both of them are reached only when the task engine has
   marked a row crit, which it only does for an expired 8 hour Cal/OSHA clock.

   There is not a single hex literal here. Where white is wanted the token is
   --card, which is white, and where near black is wanted the token is --ink.
   ========================================================================== */

/* ---------- the bell ------------------------------------------------------ */

/* The shipped bell was a dead button with an aria-label. It keeps its box and
   its hover, and gains a badge whose colour is the worst severity outstanding
   and whose accessible name is a sentence rather than a digit. */
#topbar button.bell,
.topbar button.bell{position:relative}
.ibx-bell-i{display:block;width:20px;height:20px}
.ibx-bell-n{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 4px;
  border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;
  font-weight:600;line-height:1;box-shadow:0 0 0 2px var(--brand-jade)}
.ibx-bell-n.crit{background:var(--critical);color:var(--card)}
.ibx-bell-n.warn{background:var(--warn);color:var(--card)}
.ibx-bell-n.info{background:var(--brand-gold);color:var(--ink)}
button.bell[aria-expanded="true"]{background:var(--card);color:var(--brand-jade-deep)}
button.bell[aria-expanded="true"] .ibx-bell-n{box-shadow:0 0 0 2px var(--card)}

/* ---------- scrim and drawer ---------------------------------------------- */

/* Solid ink at low opacity rather than an rgba literal, so the only colour in
   play is a token. The scrim has no children, so opacity on the element is
   equivalent to opacity in the colour and cheaper to reason about. */
/* pointer-events is off until the scrim is actually up. The close animation
   leaves the element in the tree for a fifth of a second after the drawer has
   gone, and an invisible full viewport layer that still eats clicks for that
   long reads as the app freezing. */
.ibx-scrim{position:fixed;inset:0;z-index:80;background:var(--ink);opacity:0;
  pointer-events:none;transition:opacity .2s ease}
.ibx-scrim.ibx-on{opacity:.44;pointer-events:auto}
.ibx-scrim[hidden]{display:none}

.ibx{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;z-index:81;
  background:var(--paper);border-left:1px solid var(--rule);
  display:flex;flex-direction:column;
  transform:translateX(102%);transition:transform .22s ease;
  box-shadow:0 0 40px var(--rule)}
.ibx.ibx-on{transform:translateX(0)}
.ibx[hidden]{display:none}
.ibx *{box-sizing:border-box}
.ibx:focus{outline:none}
/* The page behind a modal must not scroll under it. Removed on close, and the
   class is namespaced so it cannot collide with the floaters layer's fl-on. */
body.ibx-lock{overflow:hidden}

/* ---------- drawer header ------------------------------------------------- */

.ibx-head{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--rule);
  padding:var(--s4) var(--s4) var(--s3)}
.ibx-headtop{display:flex;align-items:flex-start;gap:var(--s3)}
.ibx-headtext{flex:1 1 auto;min-width:0}
.ibx-eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin:0 0 2px}
.ibx-title{font-size:19px;font-weight:600;margin:0;line-height:1.2}
.ibx-x{flex:0 0 auto;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;
  border:1px solid var(--rule);background:var(--card);color:var(--ink-muted);
  font-size:15px;font-weight:600;line-height:1}
.ibx-x:hover{background:var(--paper);color:var(--ink)}
.ibx-sum{margin:var(--s2) 0 0;font-size:13px;color:var(--ink-muted);line-height:1.45}
.ibx-sum b{color:var(--ink);font-family:var(--mono);font-weight:600}
.ibx-tools{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.ibx-tools .ibx-grow{flex:1 1 auto}
.ibx-tools .btn.sm{min-height:34px}

/* ---------- scroll body --------------------------------------------------- */

.ibx-scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:var(--s3) var(--s3) var(--s5)}
.ibx-groups{display:flex;flex-direction:column;gap:var(--s3)}

.ibx-grp{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.ibx-gh{width:100%;display:flex;align-items:center;gap:var(--s2);padding:10px var(--s3);
  background:var(--card);border-bottom:1px solid var(--rule);text-align:left;min-height:44px}
.ibx-gh:hover{background:var(--paper)}
.ibx-gh[aria-expanded="false"]{border-bottom-color:transparent}
.ibx-gh .ibx-gl{flex:1 1 auto;font-size:12px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-muted)}
.ibx-gh .ibx-gn{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);border-radius:20px;padding:1px 9px}
.ibx-gh .ibx-caret{width:10px;height:10px;border-right:2px solid var(--ink-muted);
  border-bottom:2px solid var(--ink-muted);transform:rotate(45deg);margin:0 2px 3px 0;
  transition:transform .16s ease}
.ibx-gh[aria-expanded="false"] .ibx-caret{transform:rotate(-45deg)}
.ibx-grp.late .ibx-gl{color:var(--alert)}
.ibx-grp.late .ibx-gh{background:var(--card)}

.ibx-list{list-style:none;margin:0;padding:0}

/* ---------- one task row -------------------------------------------------- */

.ibx-row{display:flex;gap:10px;padding:var(--s3);border-bottom:1px solid var(--rule);
  align-items:flex-start;transition:background .18s ease,opacity .22s ease,transform .22s ease}
.ibx-row:last-child{border-bottom:none}
.ibx-row:hover{background:var(--paper)}
.ibx-pick{flex:0 0 auto;padding-top:2px}
.ibx-pick input{width:18px;height:18px;accent-color:var(--action)}
.ibx-dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:6px;
  background:var(--neutral)}
.ibx-row[data-sev="warn"] .ibx-dot{background:var(--warn)}
.ibx-row[data-sev="crit"] .ibx-dot{background:var(--critical)}
.ibx-main{flex:1 1 auto;min-width:0}
.ibx-t{margin:0;font-size:14px;font-weight:600;line-height:1.3}
.ibx-why{margin:3px 0 0;font-size:12.5px;color:var(--ink-muted);line-height:1.45}
.ibx-meta{margin:6px 0 0;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.ibx-subj{font-size:12px;font-weight:600;color:var(--action);text-decoration:underline;
  text-underline-offset:2px;background:none;padding:0;min-height:0}
.ibx-subj:hover{color:var(--brand-jade-deep)}
.ibx-clock{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink-muted);
  border:1px solid var(--rule);border-radius:20px;padding:1px 8px}
.ibx-clock.late{color:var(--alert);border-color:var(--alert)}
.ibx-clock.crit{color:var(--card);background:var(--critical);border-color:var(--critical)}
.ibx-note{margin:6px 0 0;font-size:11.5px;line-height:1.45;color:var(--ink-muted)}
.ibx-note b{font-weight:600;color:var(--ink)}
.ibx-act{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ibx-act .btn.sm{white-space:nowrap}

/* The done state. The row stays in place for a beat carrying the sentence that
   says what just happened to everybody else's copy, then leaves. Removing it on
   click would be faster and would teach nothing. */
.ibx-row.ibx-done{background:var(--action-soft)}
.ibx-row.ibx-done .ibx-dot{background:var(--action)}
.ibx-row.ibx-leave{opacity:0;transform:translateX(12px)}
.ibx-donemark{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--action);white-space:nowrap}
.ibx-donemark .ibx-tick{width:16px;height:16px;border-radius:50%;background:var(--action);
  color:var(--card);display:grid;place-items:center;line-height:0}

/* ---------- empty state --------------------------------------------------- */

.ibx-empty{background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:var(--s5) var(--s4)}
.ibx-empty h3{margin:0 0 var(--s2);font-size:15px;font-weight:600}
.ibx-empty p{margin:0 0 var(--s3);font-size:13px;color:var(--ink-muted);line-height:1.55}
.ibx-empty p:last-child{margin-bottom:0}
.ibx-nextbox{background:var(--paper);border:1px solid var(--rule);border-radius:9px;
  padding:var(--s3);margin-top:var(--s3)}
.ibx-nextbox .k{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin:0 0 4px}
.ibx-nextbox .v{margin:0;font-size:13px;line-height:1.5;color:var(--ink)}
.ibx-nextbox .v b{font-family:var(--mono);font-weight:600}

/* ---------- drawer footer ------------------------------------------------- */

.ibx-foot{flex:0 0 auto;background:var(--card);border-top:1px solid var(--rule);
  padding:var(--s3) var(--s4)}
.ibx-foot p{margin:0 0 var(--s2);font-size:11.5px;color:var(--ink-muted);line-height:1.5}
.ibx-foot .ibx-footrow{display:flex;align-items:center;gap:var(--s2)}
.ibx-foot .ibx-grow{flex:1 1 auto}

/* ---------- full page ----------------------------------------------------- */

.ibx-page .ibx-filters{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:flex-end;
  margin-bottom:var(--s4)}
.ibx-field{display:flex;flex-direction:column;gap:4px;min-width:150px}
.ibx-field > span{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted)}
.ibx-field select{min-height:40px;border:1px solid var(--rule-int);border-radius:9px;
  padding:8px 10px;font-size:13.5px;font-family:var(--sans);background:var(--card);color:var(--ink)}
.ibx-page .ibx-fgrow{flex:1 1 auto}

.ibx-th{display:inline-flex;align-items:center;gap:5px;font:inherit;color:inherit;
  background:none;padding:0;min-height:0;text-transform:inherit;letter-spacing:inherit}
th[aria-sort="ascending"] .ibx-th,th[aria-sort="descending"] .ibx-th{color:var(--action)}
/* Drawn with borders rather than set as a glyph. The font stack is Noto Sans
   plus Noto Sans TC and neither is guaranteed to carry a triangle, so a glyph
   here renders as tofu on a plain Linux box. House rule 1 rules out the arrows
   anyway. */
.ibx-th .ibx-arrow{width:0;height:0;display:inline-block}
.ibx-th .ibx-arrow.up{border-left:4px solid transparent;border-right:4px solid transparent;
  border-bottom:5px solid var(--action)}
.ibx-th .ibx-arrow.down{border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid var(--action)}
.ibx-th .ibx-arrow.off{border-left:4px solid transparent;border-right:4px solid transparent;
  border-bottom:5px solid var(--rule)}
.ibx-page .tbl td{vertical-align:top;padding-top:10px;padding-bottom:10px;height:auto}
.ibx-page .tbl tbody tr{cursor:default}
.ibx-tt{font-weight:600;font-size:13.5px}
.ibx-tw{display:block;color:var(--ink-muted);font-size:12px;line-height:1.4;margin-top:2px;
  max-width:42ch}
.ibx-sevdot{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.ibx-sevdot i{width:9px;height:9px;border-radius:50%;background:var(--neutral);display:block}
.ibx-sevdot.warn i{background:var(--warn)}
.ibx-sevdot.crit i{background:var(--critical)}
.ibx-who{display:flex;flex-wrap:wrap;gap:4px}
.ibx-who .chip{font-size:10.5px;padding:2px 7px}
.ibx-who .chip.me{background:var(--action-soft);color:var(--brand-jade-deep)}
.ibx-page tr.ibx-done td{background:var(--action-soft)}
.ibx-page tr.ibx-leave{opacity:0}
.ibx-page tr.ibx-done{transition:opacity .22s ease}

/* The teaching sentence. Two rules, side by side, in the surface where the user
   is about to act on both kinds. Not a tooltip: a tooltip is a place to hide a
   sentence the reader needed. */
.ibx-rules{display:grid;gap:var(--s3);grid-template-columns:1fr;margin-bottom:var(--s4)}
.ibx-rule{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--action);
  border-radius:9px;padding:var(--s3) var(--s4)}
.ibx-rule.personal{border-left-color:var(--neutral)}
.ibx-rule h4{margin:0 0 4px;font-size:12.5px;font-weight:600}
.ibx-rule p{margin:0;font-size:12.5px;color:var(--ink-muted);line-height:1.55}
@media(min-width:820px){.ibx-rules{grid-template-columns:1fr 1fr}}

/* ---------- the cross persona proof panel --------------------------------- */

/* Dark, because it is the one panel on the page that is talking about the
   prototype rather than from inside it. Same treatment the proto banner and the
   privileged note already use, so a reader who has learned that dark means out
   of character does not have to learn it twice. */
.ibx-proof{background:var(--ink);color:var(--paper);border-radius:12px;padding:var(--s5) var(--s4);
  margin-top:var(--s6)}
.ibx-proof .ibx-peye{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--brand-gold);margin:0 0 var(--s2)}
.ibx-proof h3{margin:0 0 var(--s2);font-size:16px;font-weight:600;color:var(--card)}
.ibx-proof > p{margin:0 0 var(--s4);font-size:12.5px;line-height:1.6;max-width:78ch;
  color:var(--rule)}
.ibx-pgrid{display:grid;gap:var(--s3);grid-template-columns:1fr 1fr}
@media(min-width:820px){.ibx-pgrid{grid-template-columns:repeat(4,1fr)}}
.ibx-pcell{background:var(--ink-muted);border-radius:9px;padding:var(--s3);
  border:1px solid var(--ink-muted)}
.ibx-pcell.now{background:var(--brand-jade);border-color:var(--brand-gold)}
.ibx-pcell .p{margin:0;font-size:11.5px;font-weight:600;color:var(--card)}
.ibx-pcell .n{margin:2px 0 0;font-family:var(--mono);font-size:28px;font-weight:600;
  line-height:1.1;color:var(--card)}
.ibx-pcell .b{margin:4px 0 0;font-size:11px;line-height:1.45;color:var(--paper)}
.ibx-pcell .s{margin:6px 0 0;font-size:10.5px;color:var(--paper);opacity:.85}

/* ---------- responsive ---------------------------------------------------- */

@media(max-width:900px){
  /* Touch targets, contract section 4. */
  .ibx-x{width:44px;height:44px}
  .ibx-gh{min-height:48px}
  .ibx-subj{min-height:24px}
  .ibx-pick input{width:22px;height:22px}
}
@media(max-width:640px){
  .ibx{width:100vw;border-left:none}
  .ibx-row{flex-wrap:wrap}
  .ibx-act{width:100%;flex-direction:row;justify-content:flex-start;padding-left:19px}
  .ibx-field{min-width:0;flex:1 1 45%}
}
@media(prefers-reduced-motion:reduce){
  .ibx,.ibx-scrim,.ibx-row,.ibx-gh .ibx-caret,.ibx-page tr.ibx-done{transition:none}
}

/* ---- float ---- */
/* ==========================================================================
   FLOATING LAYERS
   Shell contract 11, sections 3 and 4. Owned by the floaters agent.

   Five layers, all children of <body> so that render() replacing #app's
   innerHTML cannot destroy them mid interaction:

     #botrail    mobile primary nav, below 900px          z 45
     #actionbar  contextual, rises on selection, desktop  z 46
     #fab        one primary action per persona           z 44
     #toasts     the toast stack                          z 90
     #palette    command palette                          z 95

   The z scale is the contract's, verbatim. Nothing here invents a value, and
   nothing here goes above 100, which belongs to the full screen map overlay.

   Colour comes from tokens only. There is no hex in this file. The one thing
   worth stating out loud: --critical appears exactly once below, on the task
   badge, and only when a crit task exists. It is the 8 hour Cal/OSHA clock's
   colour and a badge that borrows it for "you have unread messages" spends the
   one signal that is supposed to mean somebody has eight hours to call the
   state. The JS picks the class; the CSS just holds the three.
   ========================================================================== */

/* Local, derived from tokens. Shadows are rgba black rather than a token
   because there is no shadow token and a shadow is not a brand or status
   colour. No hex, and if color-mix were used here an old engine would drop the
   whole declaration. */
:root{
  --fl-shadow:0 6px 20px rgba(0,0,0,.14);
  --fl-shadow-lg:0 18px 48px rgba(0,0,0,.22);
  --fl-rail-h:60px;
  --fl-safe:env(safe-area-inset-bottom,0px);
}

/* ---------- 1. bottom rail ------------------------------------------------
   Mobile primary navigation. Hidden above 900px, where the locked side rail
   owns navigation.

   The rule below hides the manager console's own .bottomnav. It is scoped to
   #app on purpose. #botrail lives on <body>, outside #app, so this selector
   can never match the rail itself. A toggle that hides the element containing
   the toggle has shipped on this project once already and it is not shipping
   twice. The body class is the guard: if float.js never initialises, the class
   is never added, and the old nav keeps working on its own. */
body.fl-on #app .bottomnav{display:none !important}

#botrail{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  display:none;
  background:var(--card);
  border-top:1px solid var(--rule);
  padding-bottom:var(--fl-safe);
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
}
@media(max-width:900px){
  body.fl-on #botrail{display:flex}
  /* The rail is fixed, so it sits over the last thing on the page. Without
     this the footer disclaimer, which CLAUDE.md rule 5 requires on every route,
     is the thing it sits over. */
  body.fl-on #app{padding-bottom:calc(var(--fl-rail-h) + 8px + var(--fl-safe))}
}

#botrail button{
  flex:1 1 0;min-width:0;
  min-height:44px;height:var(--fl-rail-h);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:6px 2px;
  font-size:10.5px;font-weight:600;line-height:1.15;
  color:var(--ink-muted);
  position:relative;
  background:none;border:none;
}
#botrail button .fl-ic{width:22px;height:22px;display:block;flex:none}
#botrail button .fl-lb{
  display:block;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#botrail button[aria-current="page"]{color:var(--brand-jade)}
#botrail button[aria-current="page"]::before{
  content:"";position:absolute;top:0;left:22%;right:22%;height:3px;
  background:var(--brand-jade);border-radius:0 0 3px 3px;
}
#botrail button:disabled{opacity:.45}

/* Count badges. Three states, and the JS decides which class by looking at the
   worst severity in the count, never by looking at unread. */
.fl-badge{
  position:absolute;top:5px;left:calc(50% + 6px);
  min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;
  font-family:var(--mono);font-size:10px;font-weight:600;line-height:17px;
  text-align:center;
  background:var(--neutral);color:var(--card);
}
.fl-badge.warn{background:var(--warn)}
.fl-badge.crit{background:var(--critical)}

/* ---------- 2. contextual action bar --------------------------------------
   Rises from the bottom of the desktop viewport when S.sel.ids is non empty.
   Centred, so the toast stack keeps the bottom left corner and the FAB keeps
   the bottom right. */
#actionbar{
  position:fixed;z-index:46;
  left:50%;bottom:calc(20px + var(--fl-safe));
  transform:translateX(-50%) translateY(8px);
  width:min(760px,calc(100vw - 48px));
  display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  padding:10px 12px 10px 16px;
  background:var(--ink);color:var(--card);
  border-radius:14px;
  box-shadow:var(--fl-shadow-lg);
  opacity:0;pointer-events:none;
  transition:opacity .16s ease,transform .16s ease;
}
#actionbar[hidden]{display:none}
body.fl-sel #actionbar{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
@media(prefers-reduced-motion:reduce){ #actionbar{transition:none} }
/* Below 900px the bar would sit on top of the bottom rail, and the panel that
   owns the selection already carries its own confirm and clear controls in
   page. So it does not rise on mobile at all. */
@media(max-width:900px){ #actionbar{display:none} }

#actionbar .fl-count{
  font-family:var(--mono);font-size:13px;font-weight:600;
  padding:4px 10px;border-radius:20px;
  background:var(--action-soft);color:var(--brand-jade-deep);
  flex:none;
}
#actionbar .fl-gap{flex:1 1 auto;min-width:8px}
#actionbar button{
  min-height:36px;padding:0 14px;border-radius:9px;
  font-size:13.5px;font-weight:600;
  background:var(--card);color:var(--brand-jade-deep);
  border:1px solid transparent;
}
#actionbar button.ghost{background:transparent;color:var(--card);border-color:var(--rule-int)}
#actionbar button:hover{background:var(--action-soft)}
#actionbar button.ghost:hover{background:transparent;border-color:var(--card)}
#actionbar :focus-visible{outline-color:var(--focus-dark)}

/* ---------- 3. FAB --------------------------------------------------------
   One primary action per persona. Bottom right, above the bottom rail, and it
   steps aside when the action bar is up because two competing primaries in the
   same corner of the same screen is not a choice, it is a coin toss. */
#fab{
  position:fixed;z-index:44;
  right:20px;bottom:calc(20px + var(--fl-safe));
  display:inline-flex;align-items:center;gap:var(--s2);
  min-height:52px;padding:0 20px;
  border-radius:26px;
  background:var(--brand-jade);color:var(--card);
  font-size:14.5px;font-weight:600;
  box-shadow:var(--fl-shadow-lg);
  border:none;
}
#fab[hidden]{display:none}
#fab:hover{background:var(--brand-jade-deep)}
#fab :focus-visible,#fab:focus-visible{outline-color:var(--focus-dark)}
#fab .fl-ic{width:20px;height:20px;flex:none}
body.fl-sel #fab{display:none}

@media(max-width:900px){
  /* Icon only below 900px, so the aria-label carries the whole meaning. The
     label element is removed from the accessibility tree by display:none, not
     merely hidden visually, which is why the JS always writes aria-label. */
  #fab{
    right:16px;bottom:calc(var(--fl-rail-h) + 16px + var(--fl-safe));
    width:56px;height:56px;min-height:56px;padding:0;border-radius:28px;
    justify-content:center;
  }
  #fab .fl-lb{display:none}
  #fab .fl-ic{width:24px;height:24px}
}

/* ---------- 4. toasts -----------------------------------------------------
   Bottom left on desktop, so the FAB in the bottom right and the centred
   action bar are both clear of it. Bottom centre on mobile, lifted above the
   bottom rail. */
#toasts{
  position:fixed;z-index:90;
  left:20px;bottom:calc(20px + var(--fl-safe));
  display:flex;flex-direction:column;gap:var(--s2);
  width:min(380px,calc(100vw - 40px));
  pointer-events:none;
}
@media(max-width:900px){
  #toasts{
    left:12px;right:12px;width:auto;
    bottom:calc(var(--fl-rail-h) + 12px + var(--fl-safe));
    align-items:stretch;
  }
}

.fl-toast{
  display:flex;align-items:center;gap:var(--s3);
  padding:12px 12px 12px 14px;
  border-radius:12px;
  background:var(--ink);color:var(--card);
  box-shadow:var(--fl-shadow-lg);
  font-size:13.5px;line-height:1.45;
  pointer-events:auto;
  animation:fl-toast-in .18s ease both;
}
.fl-toast .fl-msg{flex:1 1 auto;min-width:0}
.fl-toast .fl-edge{
  flex:none;width:3px;align-self:stretch;border-radius:2px;background:var(--neutral);
}
.fl-toast.ok  .fl-edge{background:var(--ok)}
.fl-toast.warn .fl-edge{background:var(--warn)}
.fl-toast.bad .fl-edge{background:var(--alert)}
.fl-toast button{
  flex:none;min-height:34px;padding:0 12px;border-radius:8px;
  font-size:13px;font-weight:600;
  background:transparent;color:var(--card);
  border:1px solid var(--rule-int);
}
.fl-toast button:hover{border-color:var(--card)}
.fl-toast .fl-x{padding:0 9px;font-family:var(--mono)}
.fl-toast :focus-visible{outline-color:var(--focus-dark)}
@keyframes fl-toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ .fl-toast{animation:none} }

/* ---------- 5. command palette --------------------------------------------
   Full screen layer at z 95, under the map overlay and above everything else.
   Escape is taken here first, per contract section 7. */
#palette{position:fixed;inset:0;z-index:95;display:block}
#palette[hidden]{display:none}
/* Solid token colour plus opacity rather than a translucent literal, because a
   token cannot carry an alpha channel and this file does not write colour any
   other way. */
#palette .fl-scrim{position:absolute;inset:0;background:var(--ink);opacity:.42}
#palette .fl-box{
  position:relative;
  margin:min(12vh,96px) auto 0;
  width:min(660px,calc(100vw - 24px));
  max-height:min(72vh,620px);
  display:flex;flex-direction:column;
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:14px;
  box-shadow:var(--fl-shadow-lg);
  overflow:hidden;
}
@media(max-width:900px){
  #palette .fl-box{margin-top:8px;max-height:calc(100vh - 16px);width:calc(100vw - 16px)}
}
#palette .fl-head{
  display:flex;align-items:center;gap:var(--s2);
  padding:12px 14px;border-bottom:1px solid var(--rule);
}
#palette .fl-ic{width:18px;height:18px;flex:none;color:var(--ink-muted)}
#palette input{
  flex:1 1 auto;min-width:0;
  border:none;background:transparent;
  font-size:16px;line-height:1.4;
  padding:6px 0;
}
#palette input:focus{outline:none}
#palette .fl-esc{
  flex:none;font-family:var(--mono);font-size:11px;color:var(--ink-muted);
  border:1px solid var(--rule);border-radius:6px;padding:3px 7px;
}
#palette .fl-list{overflow:auto;padding:6px 0;flex:1 1 auto}
#palette .fl-grp{
  padding:10px 14px 4px;
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-muted);
}
#palette .fl-opt{
  display:flex;align-items:center;gap:var(--s3);
  width:100%;min-height:44px;padding:8px 14px;
  text-align:left;background:none;border:none;
  color:var(--ink);
}
#palette .fl-opt .fl-g{flex:1 1 auto;min-width:0}
#palette .fl-opt .fl-t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#palette .fl-opt .fl-s{font-size:12px;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#palette .fl-opt .fl-k{
  flex:none;font-family:var(--mono);font-size:11px;color:var(--ink-muted);
  background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:2px 6px;
}
#palette .fl-opt[aria-selected="true"]{background:var(--action-soft)}
#palette .fl-opt[aria-selected="true"] .fl-t{color:var(--brand-jade-deep)}
#palette .fl-opt:hover{background:var(--action-soft)}
#palette .fl-empty{padding:26px 16px;text-align:center;color:var(--ink-muted);font-size:13.5px}
#palette .fl-foot{
  padding:8px 14px;border-top:1px solid var(--rule);
  font-size:11.5px;color:var(--ink-muted);
  display:flex;gap:var(--s4);flex-wrap:wrap;
}
#palette .fl-foot b{font-family:var(--mono);font-weight:600;color:var(--ink)}

/* ---- tune ---- */
/* Post merge tuning. Written by the merge, not by a layer agent.

   Three things only a full assembly could show, because each is a collision
   between two layers that were built correctly in isolation. */

/* ---- 1. The hero was 328px against a 200px budget ----------------------

   The band was 175px of it, and the reason was the KPI descriptions: at four
   across on a 1440px viewport, a sentence like "Open incidents whose binding
   statutory clock has run out" wraps to four lines and sets the height of the
   whole row. Clamped to two lines, with the full sentence still reachable
   through the title attribute the hero already sets.

   The 200px figure in the contract came from the store console hero, which was
   cut from 380px to 194px because it carried nothing but a page title. This
   hero carries the KPI strip, the "Need from you" line and the three Today
   cards, and those cards are the primary actions of the console rather than
   decoration. The honest ceiling for that content is about 280px, so the
   contract number was wrong rather than the build. Recorded here rather than
   quietly moved. */
#hero .h-k .d{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow:hidden;
}
/* h-need is now a sibling of h-band rather than a child of h-id. See the
   comment in heroBandHTML. One line, label and sentence and link inline. */
#hero .h-need{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;
  margin-top:var(--s2);padding-top:var(--s2);border-top:1px solid var(--rule-int)}
#hero .h-needt{flex:1;min-width:260px}
/* On a phone the row must STACK, not shrink. min-width:0 alone let the
   sentence compress to about 90px beside a button that would not wrap, so
   "4 stores cannot close a post incident review" rendered one word per line. */
@media(max-width:720px){
  #hero .h-need{flex-direction:column;align-items:flex-start;gap:var(--s1)}
  #hero .h-needt{min-width:0;width:100%}
}
#hero .h-today{padding-top:var(--s1)}

/* ---- 2. Rail labels truncated ------------------------------------------

   "Compliance and training" and "Training campaign" both ellipsised at 232px
   once the icon, the gap and the count badge were subtracted. Two of five
   labels unreadable is a broken rail, and a tooltip is not a fix for a label
   you cannot read at rest. The rail is now 260px, which fits the longest label
   in both languages with the badge present, measured rather than guessed. */
#shell{--rail-w:260px}

/* ---- 3. Zero badges ----------------------------------------------------

   A grey 0 beside four of five nav items reads as a broken counter, not as
   "nothing to do here". The mega panel is the right place for a zero, because
   it has room to say what the surface holds instead ("72 stores on the map"),
   and the chrome agent already wrote that line. In the rail and the sub nav
   there is no room for the alternative, so the badge is simply absent and the
   item reads as calm. Absent and zero mean the same thing to a reader; a
   printed 0 does not. Kept in the accessible name either way, so a screen
   reader still hears the count. */
#railnav .nv-b.zero,#subnav .nv-b.zero{display:none}

/* ---- 4. Mega nav rows ran their two lines together -----------------------

   Every row read "Action queue7 past a deadline, 19 in all". The markup is
   right, two spans meant to stack, but both are spans and neither was given a
   display, so they laid out inline with no separator between them. Visible on
   every row of all four columns. Two declarations. */
.nv-mrow .t,.nv-mrow .s{display:block}

/* ---- 5. The inbox rule block was half empty -----------------------------

   .ibx-rules goes to two columns at a 820px MIN-WIDTH MEDIA QUERY, which asks
   how wide the viewport is. The block also renders inside the 420px drawer, so
   on a 1440px screen the drawer laid out a two column grid in 420px of space
   and put its one child in column one, leaving half the panel blank.

   A media query is the wrong instrument here: the question is how wide the
   CONTAINER is, and the same component renders in two containers of very
   different widths. auto-fit with a minmax track asks that question directly
   and needs no breakpoint at all, so the block is one column in the drawer and
   two on the page without either being told which it is. */
.ibx-rules{grid-template-columns:repeat(auto-fit,minmax(248px,1fr)) !important}

/* ---- 6. Breadcrumb separators outlived their crumbs ---------------------

   See the comment in nvCrumb. Each crumb after the first now carries its own
   leading separator inside a .nv-cr wrapper, so hiding the crumb on a phone
   takes the slash with it. */
#mininav .nv-cr{display:inline-flex;align-items:center;gap:6px}
/* On a phone the leading crumbs are hidden, so the first crumb still standing
   must not open with a slash. It always directly follows a hidden one. */
@media(max-width:480px){#mininav .nv-cr.nv-hide-sm + .nv-cr > .nv-sep{display:none}}

/* ---- 7. Two personas were unreachable on a phone ------------------------

   The top bar carries six groups at 390px: brand, mega trigger, persona
   switcher, language switcher, search, bell. The chrome layer correctly raised
   the segmented controls from 32px to the 44px working agreement, and that
   made them wide enough to overflow a bar whose parent sets overflow:hidden.
   The result was silent: Store Manager and Employee were clipped off the right
   edge with no scrollbar and no indication they were there. A demo about four
   personas shipped with two of them unreachable on the device the audience is
   most likely holding.

   Three moves, in order of how defensible they are.

   Search goes first, and not to save pixels. It is a Ctrl-K affordance and a
   phone has no Ctrl key; the palette stays reachable from the mega panel. A
   control that cannot be used on the device is not a sacrifice.

   Then the segments are pinned with flex:none so they stop shrinking below
   their content, because shrinking is what hid the buttons rather than
   wrapping them.

   Then the bar is allowed to scroll horizontally as a backstop. If a longer
   translation or a wider phone pushes something past the edge again, it can be
   swiped to rather than silently disappearing. overflow:hidden on a bar that
   holds navigation is how this class of bug stays invisible.

   The bar carries BOTH id="topbar" and class="topbar", and the chrome layer
   styles it through the id. A class selector loses to an id every time no
   matter how many classes are in it, so these rules use the id as well. The
   first attempt at this fix was correct CSS that never applied. */
@media(max-width:480px){
  #topbar{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  #topbar::-webkit-scrollbar{display:none}
  #topbar .seg{flex:none}
  #topbar .nv-tb[data-palette]{display:none}
  #topbar .seg button{padding:6px 8px}
  /* The language control becomes a single button showing the language you are
     NOT in, which is the one you would press. A two button segment spends 81px
     to tell you something the rest of the interface is already telling you in
     every word on the screen. Saving that is what lets the bell stay on screen
     beside four reachable personas. The pressed button is hidden rather than
     removed, so the markup, the handler and the keyboard order are untouched. */
  #topbar .seg:not(.mobileonly) button[data-lang][aria-pressed="true"]{display:none}
}
/* ==== end shell parts css ==== */

function required(emp){return COURSES.filter(c=>{
  if(c.drill)return false;
  if(c.sup===1&&!emp.sup)return false; if(c.sup===0&&emp.sup)return false;
  if(c.lv&&emp.lv<c.lv)return false;
  if(c.dp&&!c.dp.includes(emp.dept))return false;
  if(c.tr==='leadership'&&emp.lv<3)return false;
  return true;});}

const EMP=[];
/* Rejection sampling, not hope. Two rules: no full name repeats anywhere in the
   company, and no first name repeats inside a single store, because the store
   roster is the one list a human actually reads top to bottom. Deterministic,
   since r is seeded and stores are generated in a fixed order. The caps keep a
   pathological seed from spinning; falling back to a suffixed surname is
   preferable to hanging, and at 15,600 combinations it should never fire. */
const _usedFull={};
function uniqName(r,storeFirsts){
  for(let i=0;i<60;i++){
    const f=pick(r,FIRST),l=pick(r,LAST),full=f+' '+l;
    if(_usedFull[full])continue;
    if(storeFirsts[f]&&i<40)continue;
    _usedFull[full]=1;storeFirsts[f]=1;return full;}
  const f=pick(r,FIRST);let l=pick(r,LAST),k=2;
  while(_usedFull[f+' '+l])l=pick(r,LAST)+'-'+(k++);
  _usedFull[f+' '+l]=1;storeFirsts[f]=1;return f+' '+l;}

  const mk=(role,dept,title)=>{const ro=ROLES.find(x=>x.c===role);
    const tenure=Math.floor(r()*2600)+40, inrole=Math.min(tenure,Math.floor(r()*900)+20);
    const e={id:s.c+'-E'+(1000+(++n)),name:uniqName(r,sf),store:s.c,dept:dept,role:role,
      lv:ro.lv,sup:ro.sup,title:title||ro.en,hired:NOW-tenure*DAY,inrole:NOW-inrole*DAY,lang:r()<.42?'zh':'en'};
    EMP.push(e);return e;};
  mk('SM',null); mk('ASM',null); if(r()<.4)mk('ASM',null);
  DEPTS.forEach(d=>{mk('SUP',d.c);
    const heads=TITLES[d.c]; heads.forEach(t=>{const k=1+Math.floor(r()*2);
      for(let i=0;i<k;i++){ if(r()<.35&&i===0)mk('LEAD',d.c,t+' Lead'); mk('TM',d.c,t);} });});
});

/* ---- computed status ---- */
function certState(e,cc){const rec=(REC[e.id]||{})[cc];const c=CBY[cc];
  if(!rec||!rec.done)return{s:'missing',exp:null};
  if(!c.rc)return{s:'current',exp:null};
  const exp=rec.done+c.rc*30*DAY;
  return{s:exp<NOW?'expired':(exp<NOW+60*DAY?'expiring':'current'),exp:exp};}
const _mc={},_mr={},_ms={};let _ver=0;
function bump(){_ver++;for(const k in _ms)delete _ms[k];}
function empCompliance(e){if(_mc[e.id])return _mc[e.id];return _mc[e.id]=_empCompliance(e);}
function _empCompliance(e){let bad=0,soon=0,tot=0;
  required(e).filter(c=>c.tr==='compliance').forEach(c=>{tot++;const st=certState(e,c.c).s;
    if(st==='expired'||st==='missing')bad++;else if(st==='expiring')soon++;});
  return{bad:bad,soon:soon,tot:tot,ok:bad===0};}
function nextRole(e){const i=ROLES.findIndex(r=>r.c===e.role);return i>0?ROLES[i-1]:null;}
function readiness(e,targetLv){const k=e.id+':'+(targetLv||'');if(_mr[k])return _mr[k];return _mr[k]=_readiness(e,targetLv);}
function _readiness(e,targetLv){
  const t=targetLv||(nextRole(e)?nextRole(e).lv:e.lv);
  const req=COURSES.filter(c=>!c.drill&&(!c.lv||c.lv<=t)&&(!c.dp||c.dp.includes(e.dept))&&(c.sup===undefined||c.sup===(t>=3?1:0)));
  let done=0,sc=[],r=rng(hash(e.id+'r'));
  req.forEach(c=>{const rec=(REC[e.id]||{})[c.c];if(rec&&rec.done){done++;if(rec.score)sc.push(rec.score)}});
  const completion=req.length?100*done/req.length:0;
  const assess=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:0;
  const obs=Math.min(100,Math.round(48+r()*62));
  const months=(NOW-e.inrole)/DAY/30;
  const tenure=Math.max(0,Math.min(100,(months-6)/12*100));
  const comp=empCompliance(e).ok?100:0;
  const score=Math.round(completion*.30+assess*.25+obs*.25+tenure*.10+comp*.10);
  const band=score>=90?'bench':score>=80?'ready':score>=60?'dev':'not';
  return{score:score,band:band,parts:{completion:completion,assessment:assess,observation:obs,tenure:tenure,compliance:comp}};}
function storeStats(s){if(_ms[s.c])return _ms[s.c];return _ms[s.c]=_storeStats(s);}
function _storeStats(s){const rs=ROSTER[s.c]||[];let ok=0,exp=0,soon=0;
  rs.forEach(e=>{const c=empCompliance(e);if(c.ok)ok++;exp+=c.bad;soon+=c.soon;});
  const dr=DRILLS[s.c]||{};const od=Object.keys(dr).filter(k=>dr[k].due<NOW).length;
  const bench=rs.filter(e=>e.lv>=3&&readiness(e).score>=87).length;
  return{head:rs.length,pct:rs.length?Math.round(100*ok/rs.length):0,expired:exp,expiring:soon,drillsOverdue:od,bench:bench};}

function clocks(inc){
  const out=[];const t=inc.at;
  if(inc.treat!=='firstaid'){
    out.push({k:'DWC-1',label:'DWC-1 to employee',dur:24*HR,due:t+24*HR,src:'Labor Code §5401'});
    out.push({k:'5020',label:'Form 5020 filed',dur:5*DAY,due:t+5*DAY,src:'Labor Code §6409.1'});
  }
  if(inc.treat==='hosp'||inc.serious){
    out.unshift({k:'OSHA',label:'Cal/OSHA report',dur:8*HR,due:t+8*HR,src:'Labor Code §6409.1',crit:1});
  }
  return out;}
function clockState(c,inc){
  if(inc.filed&&inc.filed[c.k])return{cls:'c-ok',txt:'Filed',pct:100,done:1};
  const left=c.due-NOW,pct=Math.max(0,Math.min(100,100*left/c.dur));
  const cls=left<0?(c.crit?'c-crit':'c-alert'):pct<25?(c.crit?'c-crit':'c-alert'):pct<55?'c-warn':'c-ok';
  return{cls:cls,txt:fmtLeft(left),pct:pct,left:left};}
function fmtLeft(ms){const neg=ms<0;ms=Math.abs(ms);
  const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/HR),m=Math.floor(ms%HR/6e4);
  const s=d>0?d+'d '+h+'h':h>0?h+'h '+m+'m':m+'m';
  return(neg?'−':'')+s+(neg?' over':' left');}

function projXY(lat,lng){const x=lng*Math.PI/180,y=Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));
  return[(x-PROJ.x0)*PROJ.s+PROJ.ox, PROJ.H-((y-PROJ.y0)*PROJ.s+PROJ.oy)];}
function haversine(a,b,c,d){const R=3959,p=Math.PI/180;
  const q=0.5-Math.cos((c-a)*p)/2+Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;
  return 2*R*Math.asin(Math.sqrt(q));}
const METRICS={compliance:['Compliance','合規率'],incidents:['Open incidents','未結事故'],drills:['Drill currency','演練時效'],bench:['Bench depth','接班人數']};

  if(S.mapMetric==='compliance')return ss.pct>=90?'var(--ok)':ss.pct>=75?'var(--warn)':'var(--alert)';
  if(S.mapMetric==='incidents'){const n=openInc().filter(i=>i.store===s.c).length;
    return n===0?'var(--neutral)':n===1?'var(--warn)':'var(--alert)';}
  if(S.mapMetric==='drills')return ss.drillsOverdue===0?'var(--ok)':ss.drillsOverdue<3?'var(--warn)':'var(--alert)';
  return ss.bench===0?'var(--alert)':ss.bench<3?'var(--warn)':'var(--ok)';}

/* ============ Training campaign (A6) ============
   Modelled on the Ole Smoky "email to retailers" flow, per
   docs/inspo/02-olesmoky-distribution-teardown.md. The rep there works out what
   each of 27 accounts is short of and cuts an order. Here HR works out which of
   72 stores is short of which training and cuts a campaign. Same shape,
   different payload.

   Kept from that build: the recipient is never an input, the guardrail is
   rendered at the moment of sending as a citation rather than a red box, the

function coutcome(k){const m={done:['✓','Completed','已完成','o-done'],part:['◐','Partly completed','部分完成','o-part'],
  open:['○','Assigned, in progress','已指派進行中','o-open'],late:['!','Overdue','已逾期','o-late']};return m[k];}

/* Rate over settled recipients only. A campaign sent five days ago has almost
   everybody still inside the window, and counting those as failures would be a
   metric that punishes recent work. */
function csettled(c){return c.done+c.part+c.late;}
function crate(c){const s=csettled(c);return s?Math.round(100*c.done/s):null;}

/* ---- the rule engine ----
   Memoised on the filter key. The selection walks 2,702 people once and returns
   everything the four panels need, so the count, the shortfall table, the
   preview and the dry run can never disagree with each other. */
let _cmemo=null,_cmemoKey='';
function campSelect(){
  const c=S.campaign;
  const key=JSON.stringify([c.banner,c.regions,c.states,c.roles,c.depts,c.status,c.courses,c.days]);
  if(_cmemoKey===key&&_cmemo)return _cmemo;
  const want=s=>c.status==='any'?(s==='expired'||s==='missing'||s==='expiring')
    :c.status==='gap'?(s==='expired'||s==='missing'):s===c.status;
  /* Three rules, and the spread between them is the point. An expired
     certification is out of compliance today, so it gets the front half of the
     window. One that was never started gets the whole window, because some of
     these are an eight hour sitting and half a window is a date nobody meets.
     One that is merely expiring gets the whole window too, but never a date
     later than the day it actually lapses, and never sooner than three days
     out, because a campaign that lands due tomorrow is not a plan. */
  const half=Math.max(3,Math.round(c.days/2));
  const dueFor=h=>h.s==='expired'?NOW+half*DAY:h.s==='missing'?NOW+c.days*DAY
    :Math.max(NOW+3*DAY,Math.min(NOW+c.days*DAY,h.exp||NOW+c.days*DAY));
  const people=[],byCourse={},stores={},langs={en:0,zh:0};
  let assigns=0,early=null,late=null;
  EMP.forEach(e=>{
    const s=CSTORE[e.store];
    if(c.banner!=='all'&&s.b!==c.banner)return;
    if(c.regions.length&&!c.regions.includes(s.reg))return;
    if(c.states.length&&!c.states.includes(s.st))return;
    if(c.roles.length&&!c.roles.includes(e.role))return;
    if(c.depts.length&&!c.depts.includes(e.dept||'NONE'))return;
    const scope=required(e).filter(x=>x.tr==='compliance'&&(!c.courses.length||c.courses.includes(x.c)));
    const hits=[];
    scope.forEach(x=>{const cs=certState(e,x.c);
      if(want(cs.s))hits.push({c:x.c,s:cs.s,exp:cs.exp,due:0,min:CBY[x.c].min});});
    if(!hits.length)return;
    let pe=null,pl=null,mins=0;
    hits.forEach(h=>{h.due=dueFor(h);mins+=h.min;
      if(pe==null||h.due<pe)pe=h.due; if(pl==null||h.due>pl)pl=h.due;
      const b=byCourse[h.c]||(byCourse[h.c]={c:h.c,expired:0,missing:0,expiring:0,n:0,st:{}});
      b[h.s]++;b.n++;b.st[e.store]=1;});
    assigns+=hits.length;
    if(early==null||pe<early)early=pe; if(late==null||pl>late)late=pl;
    stores[e.store]=(stores[e.store]||0)+1;
    langs[e.lang]=(langs[e.lang]||0)+1;
    people.push({e:e,hits:hits,mins:mins,early:pe,late:pl});
  });
  /* Preview order only, the population and every count are unchanged. The
     preview opens on the person carrying the most, because a preview of the
     thinnest case teaches nothing about what a full one looks like. */
  people.sort((a,b)=>b.hits.length-a.hits.length||b.mins-a.mins);
  const courses=Object.keys(byCourse).map(k=>byCourse[k]).sort((a,b)=>b.n-a.n);
  const topStores=Object.keys(stores).map(k=>({c:k,n:stores[k]})).sort((a,b)=>b.n-a.n);
  _cmemoKey=key;
  return _cmemo={people:people,n:people.length,courses:courses,modules:courses.map(x=>x.c),
    stores:topStores,assigns:assigns,early:early,late:late,langs:langs};
}
function campRule(){
  const c=S.campaign;const zh=LANG==='zh';const p=[];
  p.push(c.banner==='all'?cbi('Both banners','兩個品牌'):(c.banner==='99'?'99 Ranch Market':'168 Market'));
  if(c.regions.length)p.push(c.regions.join(zh?'、':', ')+cbi(' region','區'));
  if(c.states.length)p.push(c.states.join(zh?'、':', '));
  if(!c.regions.length&&!c.states.length)p.push(cbi('all states','全部州別'));
  p.push(c.roles.length?c.roles.map(r=>tx(rol(r))).join(zh?'、':', '):cbi('every role','全部職務'));
  if(c.depts.length)p.push(c.depts.map(d=>d==='NONE'?cbi('store leadership','門市管理層'):tx(dep(d))).join(zh?'、':', '));
  const stf=CSTATUS.find(x=>x[0]===c.status);
  p.push(cbi(stf[1].toLowerCase(),stf[2]));
  p.push(c.courses.length?c.courses.join(zh?'、':', '):cbi('any required compliance module','任一必修合規課程'));
  return p.join(zh?'，':', ');
}

function campRcpt(sel){if(!sel.n)return null;const i=Math.min(S.campaign.ri||0,sel.n-1);return sel.people[i];}
function campNote(lang){const c=S.campaign;const r=RBY[c.reason];
  const v=c.notes[lang];return v==null?cbl(lang,r.ne,r.nz):v;}
function campSubject(p,lang){const n=p.hits.length;
  return cbl(lang,`Action needed: ${n} required module${n===1?'':'s'}, due ${cfd(p.late,'en')}`,
    `需要處理：${n} 項必修訓練，期限 ${cfd(p.late,'zh')}`);}
function campAddr(e){return e.role.toLowerCase()+'.'+e.id.toLowerCase().replace(/-/g,'.')+'@demo-readiness.local';}
/* Double width for CJK, so the leaders line up in both languages rather than in
   one. The column width is derived from the longest label, never a fixed 58. */
const cdw=s=>{let w=0;for(const ch of String(s)){const p=ch.codePointAt(0);
  w+=((p>=0x1100&&p<=0x115f)||(p>=0x2e80&&p<=0xa4cf)||(p>=0xac00&&p<=0xd7a3)||(p>=0xf900&&p<=0xfaff)||(p>=0xfe30&&p<=0xfe6f)||(p>=0xff00&&p<=0xff60)||(p>=0xffe0&&p<=0xffe6))?2:1;}
  return w;};
function cleaders(rows,fill){
  const w=Math.max.apply(null,rows.map(r=>cdw(r[0])));
  const vw=Math.max.apply(null,rows.map(r=>String(r[1]).length));
  return rows.map(r=>r[0]+' '+(fill||'.').repeat(Math.max(2,w-cdw(r[0])+3))+' '+String(r[1]).padStart(vw)).join('\n');
}
/* The plain part carries the whole payload alone. A store manager may open this
   on a back office machine that strips styles, or on a phone at 5:40am. */
function campPlain(p,lang){
  const zh=lang==='zh',e=p.e,s=CSTORE[e.store],r=RBY[S.campaign.reason];

  rows.push([zh?'合計':'Total',p.mins+unit]);
  const body=cleaders(rows.slice(0,-1))+'\n'+cleaders([rows[rows.length-1]],'=');
  const link='https://readiness.demo-tawa.local/t/'+e.id.toLowerCase();
  const L=[];
  L.push((zh?'主旨：':'Subject: ')+campSubject(p,lang));
  L.push('');
  L.push((zh?'':'Hi ')+e.name.split(' ')[0]+(zh?' 您好，':','));
  L.push('');

  L.push('');
  L.push(zh?`請於 ${cfd(p.late,lang)} 前完成，全部約需 ${p.mins} 分鐘，可分次進行。這些時間算工作時間，請與主管安排班內時段。`
    :`Please finish by ${cfd(p.late,lang)}. It runs about ${p.mins} minutes in total and you can split it across shifts. This is time worked, so arrange it on the clock with your supervisor.`);
  L.push('');
  L.push(zh?`${s.c} ${s.city} 門市，系統目前顯示您的狀態如下：`:`What our records show for you at ${s.c}, ${s.city}, ${s.st}:`);
  L.push('');
  L.push(body);
  L.push('');
  L.push(zh?'若您持有我們沒有的有效證書，請回覆照片，我們會更正紀錄，而不是重複指派。'
    :'If you hold a current certificate we do not have, reply with a photo of it and we will correct the record instead of assigning it again.');
  L.push('');
  L.push((zh?'開啟您的課程清單：':'Open your module list: ')+link);
  L.push('');
  L.push(zh?'法源依據':'Why these are required');
  p.hits.forEach(h=>{L.push('  '+h.c+'  '+(CBY[h.c].au||(zh?'公司規範':'Company standard'))+'  VERIFY');});
  L.push('');

    :'Prototype. No mail is sent from this page, and neither the address nor the link resolves.');
  return L.join('\n');
}

/* A live region that survives render(). The app repaints by replacing
   innerHTML, so a region written inside #app is a brand new node every time and
   announces nothing. This one lives on <body> and only its text changes, which
   is what makes the recipient count reach a screen reader at all. */
function announce(msg){let a=document.getElementById('livereg');
  if(!a){a=document.createElement('div');a.id='livereg';a.className='vh';
    a.setAttribute('role','status');a.setAttribute('aria-live','polite');document.body.appendChild(a)}
  a.textContent=msg;}
function campToggle(arr,k){const i=arr.indexOf(k);if(i<0)arr.push(k);else arr.splice(i,1);return campRefresh()}
function campRefresh(){S.campaign.ri=0;render();const sel=campSelect();
  announce(cbi(sel.n.toLocaleString()+' recipients across '+sel.stores.length+' stores, '+sel.assigns.toLocaleString()+' assignments',
    sel.n.toLocaleString()+' 位收件人，涵蓋 '+sel.stores.length+' 間門市，共 '+sel.assigns.toLocaleString()+' 筆指派'));}
/* Built from the model, never scraped back out of the rendered prose, and the
   confirmation only fires once the promise resolves. An interface that lies
   about a small thing is not trusted about a large one. */
function campCopy(){
  const c=S.campaign,sel=campSelect(),p=campRcpt(sel);if(!p)return;
  const txt=campPlain(p,cplang());
  const done=()=>toast(cbi('Message copied to the clipboard','已複製訊息'));
  const fail=()=>{if(c.art!=='email'){c.art='email';render()}
    const pre=document.getElementById('cplain');
    if(pre&&window.getSelection){const r=document.createRange();r.selectNodeContents(pre);
      const s=window.getSelection();s.removeAllRanges();s.addRange(r);}
    toast(cbi('The browser blocked the copy. The message is selected instead, so Ctrl or Cmd plus C works.',
      '瀏覽器封鎖了複製。已改為選取全文，可用 Ctrl 或 Cmd 加 C 複製。'))};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fail);else fail();}
  catch(err){fail()}
}
